# known_target_calibration_set.yaml
#
# The framework's standing regression suite of KNOWN targets — approved drugs
# (positive controls) + real Takeda ONC program targets with known outcomes
# (advanced / declined). Codifies the ad-hoc known-target backtests
# (GATE_SCAFFOLD_MODALITY_CONDITIONAL.md, prose tables) as a runnable fixture set
# so every future framework change is MEASURED against known targets, not argued.
#
# Consumer: tests/calibration/test_known_target_calibration.py — reads each entry's
# cached decision-snapshot (tests/calibration/snapshots/) and asserts per the
# entry's `assertion_type`. Deterministic (no Bedrock); snapshots checked in.
# Live refresh is an opt-in path (see the test's REFRESH note).
#
# ASSERTION TYPES (the executable form of the Phase-0 reframes,
# docs/design/KNOWN_TARGET_FRAMEWORK_REFRAMES.md):
#   must_not_veto          — NECESSITY reframe: an approved/validated target must NOT
#                            hit a dependency (gate-C) veto. The osimertinib guard.
#                            PASS = dependency_verdict is not a veto verdict.
#   abstention_expected    — ABSTENTION reframe: a data-blocked axis must return an
#                            HONEST insufficient, NOT a fabricated nomination. PASS =
#                            the relevant sufficiency skill returns insufficient/null.
#   known_gap_expected_fail — an ADVANCED program the framework CURRENTLY false-negatives
#                            (measured gate-C veto). PASS-of-the-suite = it still reads the
#                            documented gap verdict; when a fix lands (e.g. context-SL,
#                            Phase 2) the expected_after flips and this becomes must_not_veto.
#   selectivity_verdict_expected — SELECTIVITY gate (tumor-selectivity skill): pins
#                            headline.selectivity_class to its CURRENT measured value as a
#                            regression anchor, tagged with a `disposition` (clean_positive /
#                            over_veto_false_negative / window_veto_cohort_confounded /
#                            discordant_flag / not_selective_control / true_negative_veto). The
#                            over_veto_false_negative entries pin approved antigens the
#                            normal-breadth veto currently over-downgrades; a future veto fix
#                            flips expected_selectivity_class→`should_be`. Foundation gating all
#                            verdict-moving selectivity work.
#
# Curation discipline:
#   - Every entry cites outcome provenance (FDA approval / Takeda program status).
#   - `measured: true` means the read was captured from a LIVE framework run this
#     session (snapshot in tests/calibration/snapshots/); `measured: false` = reasoned,
#     no snapshot yet (the test skips its hard assertion, reports as pending).
#   - Extending is cheap — add an entry + (for measured ones) a snapshot; bump version.

version: 1.4.0
snapshot_date: "2026-07-19"
# v1.4.0 (2026-09-18, Stage 2b parity): every `expected_verdict_not_in` list (10 entries, 8 of them
# live — BRAF/SKCM and EGFR/LUAD are `measured: false`, so their lists are declarations the
# parametrize never evaluates) gains `not_dependent_in_indication`, the third dependency veto arm
# minted by #812. INERT TODAY BY REACHABILITY, not by weak assertion: no producer populates
# `indication_dependency_class` until Stage 5, so no snapshot can carry the token and the suite is
# byte-for-byte green. The addition is a FORWARD-DATED REQUIREMENT — "an approved target must not
# read a veto verdict" was always the assertion; naming only the pooled arm made it incomplete the
# moment a second arm existed. `known_gap_watchlist.MET.expected_verdict_current: non_dependent` is
# DELIBERATELY NOT touched: it is a positive claim about today's behaviour, not an absence set, and
# blind parity there would assert a verdict MET cannot reach. It flips at Stage 5 (MET/LUAD would
# resolve `not_dependent_in_indication` at priority 9, outranking pooled `non_dependent` at 22), and
# the test that reads it is the forcing function for that refresh.
#
# ⚠ STAGE-5 BLOCKER THIS VERSION MAKES VISIBLE (measured, not predicted). WWTR1/MESO, MARK2/PAAD and
# MARK3/PAAD — 3 of the 8 live controls, MARK2/3 being ADVANCED programs — resolve
# `non_dependent_paralog_buffered`, whose resolver rung is 19. `not_dependent_in_indication` is
# priority 9 and therefore OUTRANKS it, because v1.5.0 added compound twins pairing the indication
# killer with partner-conditional (6,7) and chemical-genetic (8) but NOT with
# `strong-paralog-buffering-degrader-preferred`. So at Stage 5 these three flip to a veto verdict and
# THIS SUITE GOES RED. That red is correct and must be fixed in the RESOLVER (a 4th compound twin
# above priority 9), never by deleting the token from these lists — a reciprocal paralog SL is
# invisible to a single-gene KO at every panel size, so the escape is real. The gate-layer half is
# already closed by veto_suppressors A4i (the veto will not fire); what remains is the LABEL, which
# is what this file asserts against. tests/vocabularies/test_indication_verdict_gate_parity.py pins
# both the obligation and the exact shape of the missing rung.
# v1.3.0 (2026-08-30): added MET/LUAD to known_gap_watchlist (known_gap_expected_fail) — the
# METex14-skipping biomarker-conditional dependency false-negative (approved TKI/ADC target reads
# pan-line non_dependent). Snapshot met_luad.functional-requirement.json captured against
# depmap-consortium-26q1. Flips to must_not_veto once a METex14 classifier lands (Wave-2 gap).
curator: ryan.abo@takeda.com
depmap_release_pin: depmap-consortium-26q1   # snapshots captured against this release
# v1.1.0 (2026-08-19): added the selectivity_cases bucket + selectivity_verdict_expected
# assertion type (tumor-vs-normal selectivity gate). Selectivity snapshots are captured against
# the recount3 tcga-gtex-2023-01-04 substrate (NOT the DepMap pin above, which governs dependency).

