# ---------------------------------------------------------------------------
# KNOWN-GAP WATCH-LIST — ADVANCED Takeda programs the framework CURRENTLY
# false-negatives at gate C (measured). These are the Phase-2 (context-SL) targets:
# expected to read the gap verdict TODAY; expected_after flips when the fix lands.
# ---------------------------------------------------------------------------
known_gap_watchlist:

  # ADDED 2026-09-11 by Step 3 (nomination_verdict_gate v1.18.0 thesis_deciding_axes). The single
  # substrate build that would repair the ONE false positive Step 3 knowingly creates.
  same_organ_normal_liability:
    indication: LUAD                    # the archetype; general to every surface antigen thesis
    modality: adc
    outcome: declined_ph3               # CEACAM5 / tusamitamab ravtansine
    assertion_type: known_gap_expected_fail
    measured: false                     # the CROSS is unwired; both inputs exist separately
    exemplar_target: CEACAM5
    blocks_correct_call_for: [CEACAM5]
    inputs_that_already_exist:
      - "surface_modality: the antigen-positive ESSENTIAL normal tissue identity (HPA IHC anchor /
         sc-surface-normal-safety / the modality-window-essential-liability rung that fires for CEACAM5)"
      - "the query's own indication -> organ (the OncoTree code is already in Context.indication)"
    missing: |
      The CROSS: no card or resolver rung asks "is the antigen-positive essential normal tissue the SAME
      ORGAN as the indication?". Until it does, a large tumor-vs-normal window RATIO reads as a clean
      therapeutic window even when tumor and critical normal tissue are the same tissue — the
      "~558x-window-yet-lung-positive" pattern surface_modality.resolver.yaml names CEACAM5 for by name.
    expected_after_wiring: |
      CEACAM5/LUAD leaves the antigen_driven nominate set (its surface arm should downgrade, or the
      thesis_deciding_axes conjunction should gain a same-organ negative conjunct), returning it to a
      correctly-declined control WITHOUT touching FOLR1/OV, DLL3/SCLC or MSLN/OV (whose antigen-positive
      normal tissues are NOT the indication organ). Flip CEACAM5's `agreement` back from
      framework_false_positive at that point.
    note: "This is the price Step 3 pays for the framework's first non-zero nominate count, recorded as a
      build item rather than absorbed silently. See the ★KNOWN LIMITATION note on
      nomination_verdict_gate.yaml::thesis_deciding_axes and the CEACAM5 reference_profiles entry."

  SMARCA2:
    indication: LUAD
    modality: small_molecule
    outcome: advanced                  # Takeda PS Achievement; SMARCA4-mutant synthetic lethal
    dependency_mode: partner_conditional_sl   # essential when SMARCA4 is LOF
    partner_gene: SMARCA4
    assertion_type: must_not_veto      # FLIPPED from known_gap_expected_fail — RESCUED (Takeda ONC backtest 2026-09-08)
    measured: true
    snapshot: smarca2_luad.functional-requirement.json
    expected_verdict_not_in: [non_dependent, not_dependent_in_indication, pan_essential_killer]
    resolved_verdict: partner_conditional_dependent            # realized (was non_dependent); the anticipated expected_after_context_sl flip
    resolved_driving_rule: partner-conditional-moderately-dependent-supportive
    note: "RESCUED: the SMARCA2×SMARCA4 partner-conditional lane (partner_map) now reads partner_conditional_dependent — the flip the entry anticipated (expected_after_context_sl: conditional_dependent). Surfaced by the Takeda ONC dependency-FN backtest (2026-09-08); snapshot refreshed from the stale non_dependent capture."

  MET:
    indication: LUAD
    modality: small_molecule            # capmatinib / tepotinib (METex14); also telisotuzumab-vedotin (c-Met ADC)
    outcome: approved_class             # METex14-selective TKIs approved in NSCLC/LUAD
    dependency_mode: biomarker_conditional   # dependency is METex14-skipping-selective (a splice-site subset)
    biomarker: METex14_skipping
    assertion_type: known_gap_expected_fail
    measured: true
    snapshot: met_luad.functional-requirement.json
    expected_verdict_current: non_dependent
    expected_driving_rule_current: non-dependent-killer
    expected_after_metex14: [biomarker_stratified_dependency, conditional_dependent, insufficient]  # flip when a METex14 classifier strata-fies the dependency
    note: "Biomarker-conditional false-negative (analogue of SMARCA2/LUAD). Pan-line CRISPR/RNAi reads strongly_concordant_non_dependent because METex14 skipping — a splice-site event in ~3% of LUAD — is invisible to the missense/hotspot-centric genomics + the pan-line dependency distribution. MET is APPROVED in LUAD, so the gate-C non_dependent veto is WRONG. Flips to must_not_veto once a METex14 classifier stratifies mutation-stratified-dependency (KNOWN_ISSUES-2026-08-26 MET-LUAD DATA-GAP; mostly WIRE from depmap MAF splice-site + CIViC METex14 + isoform/exon index, not ACQUIRE)."
    # SEPARATE axis (differentiation-landscape), surfaced by the literature↔deterministic discordance loop
    # (skills eval/CASE_LOG.md CASE-007). Verdict-INERT — NOT a nomination-gate assertion, so no
    # assertion_type/snapshot here; recorded as the regression-lock anchor for the caveat fix.
    differentiation_note: "Co-mutation reads strong_cooccurring, but de-novo MET drivers in LUAD are largely mutually exclusive with EGFR/ALK/ROS1 — MET co-occurrence is chiefly an ACQUIRED EGFR-TKI bypass (secondary MET amplification), a temporal/treatment-context association the cross-sectional cooccurrence_fisher_pancohort (no treatment axis) cannot separate from a de-novo co-driver. Regression-locked by the verdict-INERT cooccurrence_temporal_context_caveat (skills PR #1151, differentiation-landscape v1.11.0) + its hermetic tests; expected co-mutation reading = bypass-context / mutually-exclusive, NOT a de-novo patient-selection co-mutation."

