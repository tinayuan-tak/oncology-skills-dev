  CEACAM5:
    indication: COADREAD
    modality: adc
    outcome: declined_ph3              # CEACAM5-NSCLC ADC failed Ph3 (on density, not selectivity)
    assertion_type: selectivity_verdict_expected
    measured: true
    snapshot: ceacam5_coadread.tumor-selectivity.json
    expected_selectivity_class: field_effect_tumor_selective
    disposition: clean_positive
    note: "GTEx field-cancerization arm carries it (A/B discordant); no veto fired (clean_window; sc origin_tissue_liability does NOT veto). The reference positive."
    # CASE-008 tractability MODALITY-gate anchor (the false-DIRECT leak case). CEACAM5 carries 8 typed-
