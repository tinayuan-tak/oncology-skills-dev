    outcome: approved_class            # belzutifan approved; the canonical VHL-loss oncogenic dependency
    dependency_mode: biomarker_conditional   # dependency is conditional on VHL loss (VHL-null stabilizes HIF-2α)
    biomarker: VHL_loss
    assertion_type: must_not_veto      # FLIPPED from known_gap_expected_fail — CASE-014 fix landed (AM #582)
    measured: true
    snapshot: epas1_rcc.functional-requirement.json
    expected_verdict_not_in: [non_dependent, not_dependent_in_indication, pan_essential_killer]
    resolved_verdict: partner_conditional_dependent            # realized (was non_dependent)
    resolved_driving_rule: partner-conditional-moderately-dependent-supportive
    note: "RESOLVED CASE-014 (skills eval/CASE_LOG.md). Was a biomarker-conditional false-negative (analogue of MET/LUAD + SMARCA2/LUAD): pooled pan-line CRISPR/RNAi read non_dependent because EPAS1/HIF-2α dependency is CONDITIONAL on VHL loss (ccRCC near-uniformly VHL-null → no in-RCC-panel contrast; the conditional signal is only visible pan-cancer). FIXED by curating EPAS1×VHL (lof_mutation) in analysis-methods partner_map (PR #582): live DepMap 26q1 EPAS1×VHL-LoF stratum = delta -0.066 Chronos, mann-whitney q 2.1e-3, rank-biserial 0.32, n=28 VHL-LoF / 1510 neutral → partner_conditional_moderately_dependent, which the dependency resolver rescues above the non_dependent rung. Live FR re-run 2026-09-07 confirms the flip non_dependent → partner_conditional_dependent (snapshot epas1_rcc.functional-requirement.json). belzutifan-validated, so must_not_veto now holds. DISTINCT from the reference_profiles HIF2A/RCC licensing-blind anchor (Cortellis wall)."

  MARK2:
    indication: PAAD
    modality: small_molecule
    outcome: advanced                  # identified via paralog CRISPR screens
    dependency_mode: paralog_sl         # reciprocal MARK2<->MARK3 buffering
    partner_gene: MARK3
    assertion_type: must_not_veto      # FLIPPED (Takeda ONC backtest 2026-09-08) — paralog suppressor rescues
    measured: true
    snapshot: mark2_paad.functional-requirement.json
    expected_verdict_not_in: [non_dependent, not_dependent_in_indication, pan_essential_killer]
    resolved_verdict: non_dependent_paralog_buffered           # realized (was non_dependent); degrader-preferred
    resolved_driving_rule: strong-paralog-buffering-degrader-preferred
    note: "RESCUED: paralog-buffering suppressor reads non_dependent_paralog_buffered (non-veto, degrader-preferred), correctly capturing the reciprocal MARK2<->MARK3 SL. Realized verdict differs from the old expected_after_context_sl prediction (paralog_buffered, not conditional_dependent). Snapshot refreshed from stale non_dependent."

  MARK3:
    indication: PAAD
    modality: small_molecule
    outcome: advanced
    dependency_mode: paralog_sl
    partner_gene: MARK2
    assertion_type: must_not_veto      # FLIPPED (Takeda ONC backtest 2026-09-08) — paralog suppressor rescues
    measured: true
    snapshot: mark3_paad.functional-requirement.json
    expected_verdict_not_in: [non_dependent, not_dependent_in_indication, pan_essential_killer]
    resolved_verdict: non_dependent_paralog_buffered           # realized (was non_dependent); degrader-preferred
    resolved_driving_rule: strong-paralog-buffering-degrader-preferred
    note: "RESCUED: paralog-buffering suppressor reads non_dependent_paralog_buffered (non-veto, degrader-preferred), correctly capturing the reciprocal MARK3<->MARK2 SL. Snapshot refreshed from stale non_dependent."

