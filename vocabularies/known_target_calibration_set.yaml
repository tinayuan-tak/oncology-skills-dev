# ============================================================================
# REFERENCE PROFILES (2026-07-19) — deep-research fidelity assessment
# ============================================================================
# Independent per-target reference standard (built biology-first from published
# literature + catalog, then mapped to the 8 gates) grading whether the framework
# captures the axis that ACTUALLY DECIDED each target. Full per-gate profiles +
# citations live in the working-dir transcripts; the ASSESSMENT VERDICTS below are
# the committed ground truth the harness asserts against and the enrich backlog cites.
# Schema: dev/framework-runs/deep-research-reference/target-reference-profile.schema.yaml
# Assessment: .../R3_FIDELITY_ASSESSMENT.md   Citations: .../CITATION_CORRECTIONS_FINAL.md
#
# deciding_axis_coverage ∈ {captured | partial | blind | license_blocked | out_of_scope}
# severity ∈ {dangerous_false_positive | silent_false_negative | honest_blind | validated_lane}
# NOTE: all citations verified vs PubMed/E-utilities (7 adjacent-PMID mismatches corrected;
#       0 false biological claims). Coverage grades are unaffected by the citation fixes.
#
# HEADLINE: of ~71 known targets, the framework is blind/partial on the DECIDING axis for
# the large majority; approved-SM gate-C false-negatives = 5/9; approved-biologics
# nominable-on-merit = 0/10. Only the SM + pooled-CRISPR-visible + lineage/expression-shaped
# box is the validated lane. This is an assessment record, not per-entry harness assertions
# (those remain the measured snapshots above); it drives the enrich backlog + will be the
# flip-test when fixes land (blind→captured is the regression signal).

reference_profiles:

