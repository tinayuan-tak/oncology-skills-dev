# ---------------------------------------------------------------------------
# SELECTIVITY CASES — tumor-vs-normal SELECTIVITY gate (tumor-selectivity skill).
# assertion_type: selectivity_verdict_expected — pins headline.selectivity_class to the
# CURRENT measured value (a regression anchor), and tags each with a `disposition`:
#   clean_positive              — validated antigen correctly reads a *_tumor_selective class (PASS-as-intended)
#   over_veto_false_negative    — a validated/approved antigen the normal-breadth VETO currently
#                                 DOWNGRADES to selective_but_broadly_normal (the "over-eager clamp
#                                 kills good targets" failure, cf. the CD19 lesson). Pinned so a future
#                                 veto fix (plan Phase V/S/A5) produces a reviewable flip: update
#                                 expected_selectivity_class → `should_be` and disposition → clean_positive.
#   window_veto_cohort_confounded — vetoed, but scored in a non-approved cohort (confounds the read).
#   discordant_flag             — validated antigen not landing selective (comparator conflict).
#   not_selective_control       — a non-over-expressed control correctly read not_selective.
#   selective_with_liability_correct — Phase S FIX (skills #554 + contracts #417): the sc-normal
#                                 critical-organ arm now reads selective_with_normal_liability (a
#                                 named-organ SAFETY flag), NOT the housekeeping selective_but_broadly_
#                                 normal KILL. DLL3/ERBB2/FOLR1/MET flipped here from over_veto_false_
#                                 negative — the intended regression signal.
# This is the FOUNDATION that gates every verdict-moving selectivity change; snapshots captured
# from ~/dev/framework-runs/full/tumor-selectivity (recount3 tcga-gtex-2023-01-04 substrate).
# ---------------------------------------------------------------------------
