    assertion_type: selectivity_verdict_expected
    measured: true
    snapshot: klk3_prad.tumor-selectivity.json
    expected_selectivity_class: strong_tumor_selective
    disposition: clean_positive
    note: "KLK3/PSA — prostate-restricted; strong across comparators, no normal-breadth veto. Cleanest true positive."

