#   `LSCC` (not `LUSC`), `HNSCC` (not `HNSC`); consumer methods must
#   translate via this crosswalk
# - `adj_normal_manifest: null` means no derived DGE-with-adjacent-normal
#   product exists yet in data-catalog; TCGA-side paired samples exist
#   for most solid tumors but no derived manifest has been authored
