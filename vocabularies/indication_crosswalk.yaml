# indication_crosswalk.yaml
# Canonical vocabulary: iDAS indication → data-source-specific codes across
# TCGA study, GDC project, OncoTree, DepMap lineage, CPTAC cohort, GTEx normal,
# and adjacent-normal manifest. This is the reference vocabulary for methods
# that iterate across data sources for a single indication — supersedes the
# six inconsistent `INDICATION_TO_*` Python dicts (dge_deseq2/read.py:157,
# depmap_chronos/read.py:30, gdc_somatic_hotspot/read.py:26, cptac_protein_deg/
# read.py:42, dge_deseq2/read.py:620, dge_tcga_gtex_precompute/cli.py:36).
#
# See IDAS_SUBTYPE_PIPELINE.md master design + parent plan
# .claude/plans/deep-foraging-thompson.md Phase 1.

version: 1.3.0   # 1.2.0 (2026-08-24): + efo_ids lane per indication — OncoTree/canonical -> Open
                 # Targets EFO/MONDO disease ids, the filter the competitor-landscape card uses to
                 # scope Open Targets drugAndClinicalCandidates rows to an indication. Ids grounded
                 # in the OT 26.06 disease vocabulary, intersected with the competitor product's
                 # disease_id universe. Additive; all prior fields unchanged.
                 # 1.1.0 (2026-08-21): + mesh_terms lane per indication — the OncoTree/canonical ->
                 # MeSH (ClinicalTrials.gov browse_conditions.downcase_mesh_term) crosswalk that lets a
                 # method filter the AACT trial-precedent product to an indication. Curated from the
                 # AACT 2026-07 condition vocabulary. Additive; all prior fields unchanged.
schema_version: 1
curation_status: iter1_authored

