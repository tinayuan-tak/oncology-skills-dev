# ===========================================================================
# CANDIDATE EDGES — cross-axis edge cards the objective NEEDS but that DO NOT EXIST yet. First
# entry answered a direct user question (2026-08-19): there was NO genomic-feature × survival card
# (the two prognostic cards — expression-clinical-association, precog-prognostic-association — were
# EXPRESSION-keyed). BUILT 2026-08-20: both edges below now ship (methods analysis-methods #438/#439,
# cards target-contracts #458, wired into differentiation-landscape). status: built (kept here as the
# provenance of the closed gap).
# ===========================================================================
candidate_edges:
  - proposed_card: alteration-clinical-association
    status: built   # 2026-08-20 — shipped (verdict-inert; OS by target mutation status)
    axis_edge: {anchor: clinical_outcome_os, partner: genomic_alteration_status, edge_kind: prognostic_association}
    reports_into: [differentiation]        # prognostic value of the alteration = biomarker definability
    home_skill: differentiation-landscape  # (or genomic-alteration-profile; decide at build)
    question: "Does {target} mutation / CN / fusion STATUS stratify overall survival in {indication} (and by subtype)?"
    feasibility: "buildable from TCGA MC3 alteration status + TCGA clinical OS — same OS substrate expression-clinical-association already uses; by-subtype via subgroup strata. GENIE lacks broad OS (GENIE-BPC only)."
    gap_note: "the alteration analog of expression-clinical-association / precog-prognostic-association."
  - proposed_card: subtype-survival-association
    status: built   # 2026-08-20 — shipped (verdict-inert; omnibus OS across molecular subtypes)
    axis_edge: {anchor: clinical_outcome_os, partner: molecular_subtype, edge_kind: prognostic_association}
    reports_into: [differentiation]        # the SUBTYPE arm of the prognostic question (Q2)
    home_skill: differentiation-landscape
    question: "Does overall survival differ across {indication}'s molecular subtypes (subtype × OS)?"
    feasibility: "buildable from TCGA clinical OS + the subgroup-assignment shards (same substrate as the by-subtype cards); the subtype conditioner applied to the prognostic question."
    gap_note: "the SUBTYPE arm of differentiation Q2 (expression arm built; alteration + subtype arms are gaps)."

