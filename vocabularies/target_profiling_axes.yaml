# ===========================================================================
# OUTPUT CONTRACTS — the shape a skill's answer takes. Scalar axes emit a verdict + driving_rule_id;
# the RELATIONAL axis emits a ranked partner list. Making this explicit is what lets the relational
# skills stop faking a scalar verdict (Archetype-B fix, Debt #2).
# ===========================================================================
output_contracts:
  scalar_verdict:
    shape: "{verdict: enum, driving_rule_id: str}"
    used_by_band: [necessity, sufficiency]
    note: "the default Archetype-A contract; folds into the target-profile nomination gate."
  ranked_partner_table:
    shape: "[{partner, interaction_type, evidence_tier, direction, source}], + summary {n_partners, strongest}"
    used_by_axis: [combination_vulnerability]
    note: |
      Archetype-B: the PAYLOAD is the ranked list, not a scalar. Folds into target-profile as a
      'combination & vulnerability annex' (a named section), NOT as a verdict facet competing with
      the necessity/sufficiency gates. An SL-partner annotation may ALSO emit a scalar facet that
      reports_into dependency (veto-suppressor) — that facet is separate from this list payload.

# ===========================================================================
# RELATIONAL CONSOLIDATION (Debt #2 plan) — the design target for redefining the relational skills.
# STATUS: axis + contract defined here (v1.1.0); the SKILL-dir merge is a separate, sign-off-gated
# workstream (touches fan-out / resolvers / verdict spine — byte-stability-sensitive).
# ===========================================================================
relational_consolidation:
  target_skill: combination-and-vulnerability
  axis: combination_vulnerability
  output_contract: ranked_partner_table
  status: completed_2026-08-20   # combination-and-vulnerability wired into the fan-out; the 3 source skills RETIRED from SUB_SKILLS (still runnable standalone, SKILL.md marked retired-from-fanout).
  absorbed_skills:
