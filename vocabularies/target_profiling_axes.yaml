    - "SL: keep the dependency veto-suppressor facet in functional-requirement while moving DISCOVERY output to the new skill (dual-role split)."

# ===========================================================================
# QUESTION HIERARCHIES (v1.1.0) — the MIDDLE levels of the governed decomposition:
#   objective -> axis (above) -> SUB-GROUP -> QUESTION -> measurement_type -> card.
#
# WHY HERE: the sub-group/question layer is ontology, not skill-implementation — it is
# the same governed knowledge as the axes it extends, and its card binding depends on
# measurement_types.yaml. Keeping it in each skill repo's question_hierarchy.yaml let the two
# drift: a renamed/retired measurement_type could silently orphan a question. This section is the
# SINGLE SOURCE OF TRUTH; each skill's question_hierarchy.yaml is GENERATED from it and a skills-repo
# drift-CI test fails if they diverge (see skills/tools/sync_question_hierarchies.py).
#
# BINDING RULE (unchanged): a card binds to a question by its measurement_type (governed in
# measurement_types.yaml), NOT card-id. A question declares a SET of measurement_types; every consumed
# card of those types is automatically a SOURCE. `claim_axes` (optional) names the claim_vector
# axis/axes whose tuned signal a consumer overlays onto the sub-group (defaults to the sub_group id).
#
# `axis` cross-links each skill to its canonical `questions[].short` above; null for AUXILIARY skills
# (immune-context, target-intrinsic, cis-feature-coherence) that are not in the nomination fan-out — like
# the `translational` axis, they carry a hierarchy without a necessity/sufficiency question slot.
#
# VERDICT-NEUTRAL: taxonomy only; no resolver/gate logic. CONNECTIVITY is validated by
# validators/validate_question_hierarchies.py (every question sources >=1 measurement_type that EXISTS
# in measurement_types.yaml; every sub-group has >=1 question).
# ===========================================================================
