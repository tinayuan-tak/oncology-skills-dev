# gate_coverage_v2_sketch.yaml
# ============================================================================
# PROPOSAL / NOT WIRED. This is a reviewable SKETCH of the gate-model v2 shape
# (see docs/design/GATE_MODEL_V2_MEMO.md). The LIVE file is gate_coverage.yaml
# v1.0.0 — unchanged; nothing consumes this sketch. It exists so the two-axis +
# reports_into + biomarker-role structure can be reviewed in YAML before any
# migration. Verdict-neutral: this is taxonomy + routing metadata only.
#
# WHAT CHANGED vs v1 (all 8 audited strains addressed):
#   1. `axis:` splits the two things the A–H letters conflated:
#        biology       — modality-INDEPENDENT facts ("is this real biology?")
#        modality_fit  — per-lens sufficiency ("will it become a drug in THIS modality?")
#   2. Biology gates keep LETTERS (A–E) + a new "Altered" gate (E→"Altered"; see note) that
#      cleanly splits genomic-alteration out of the old A/C overload. Modality-fit assessments
#      get NAMES (not letters) — they are lens-conditional, not a sequential ladder, so
#      "letter E = both SM and surface" is retired.
#   3. `reports_into: [...]` replaces the slashed gate_names + parenthetical overloads. A
#      sub-skill has ONE home gate; if its verdict modulates ANOTHER gate, it declares that
#      here. These edges ALREADY EXIST as veto_suppressors / positive cross-refs in
#      nomination_verdict_gate.yaml — v2 just names them cleanly.
#   4. `role:` on biomarker/relational sub-skills — corroboration (→ confidence on the
#      outcome gate) vs stratification (→ patient-selection facet under the outcome gate).
#      NO separate "biomarker tier"/graph — they surface as FACETS of the gate they relate.
#   5. `modality_relevance: [...]` on modality_fit sub-skills → the active lens selects which
#      fit-assessments are relevant (5 cards already carry this field).
#
# UNCHANGED: band (necessity|sufficiency), framework_can_evidence + its vocab, evidences,
# coverage_note — all carried over verbatim so the deciding-axis router + calibration tests
# keep working after migration.

enum_id: gate_coverage
version: 2.0.0-sketch
description: |
  Two-axis target-evaluation model. AXIS 1 (biology): modality-independent necessity gates —
  is this real, actionable biology? AXIS 2 (modality_fit): per-lens sufficiency assessments —
  will it become a drug in a GIVEN modality? Biomarker/relational sub-skills are FACETS of the
  gate they relate (role: corroboration|stratification), surfaced under that gate, not a new
  gate. `reports_into` names cross-gate edges (a verdict modulating another gate) that were
  hand-patched as slashes in v1.

# ============================================================================
# AXIS 1 — BIOLOGY GATES (necessity; modality-independent). Keep letters.
# ============================================================================
biology_gates:
  - short: expression
    axis: biology
    gate: A
    gate_name: Present
    band: necessity
    framework_can_evidence: captured
    evidences: "RNA transcribed / protein made (recount3 + DepMap + CPTAC)."

  - short: selectivity
    axis: biology
    gate: B
    gate_name: Selective
    band: necessity
    framework_can_evidence: captured
    evidences: "tumor-vs-normal window (recount3 4-cell DESeq2; adjacent + GTEx comparators)."

  - short: dependency
    axis: biology
    gate: C
    gate_name: Required
    band: necessity
    framework_can_evidence: partial
    evidences: "functional requirement (DepMap CRISPR + RNAi)."
    # receives biomarker facets (below) that stratify / corroborate this gate's verdict:
    receives_facets: [mutation_stratified, expression_correlation, crispr_rnai_concordance,
                      chemical_genetic_concordance, synthetic_lethal_partners, dependency_predictability]
    coverage_note: |
      partial: pooled pan-cancer scalar conflates several dependency modes. In v2 the
      context-conditional modes are first-class FACETS (see biomarker_facets), not
      veto-suppressor-only afterthoughts.

  - short: mechanism
    axis: biology
    gate: D
    gate_name: Mechanism
    band: necessity
    framework_can_evidence: partial
    evidences: "network position / MoA hook (SIGNOR + CollecTri + Reactome + kinome)."
    coverage_note: "advisory-only today; does not move the deterministic verdict."

  # NEW GATE (decision 1): splits genomic-alteration cleanly out of the v1 A/C overload +
  # kills the one slashed gate_name. Alteration FREQUENCY is the biology fact here; the
  # biomarker-stratified half is a FACET that reports_into Required (C).
  - short: genomic_alteration
    axis: biology
    gate: E
    gate_name: Altered
    band: necessity
    framework_can_evidence: captured
    evidences: "somatic alteration landscape (TCGA-MC3 + GENIE): mutation / CN / fusion frequency."
    reports_into: [dependency]        # biomarker-stratified-dependency verdict modulates Required
    coverage_note: |
      v1 filed this under A with a slashed name 'Present (alteration) / Required
      (biomarker-stratified)'. v2: its own biology gate (Altered) for the alteration FACT;
      the stratification relationship is a facet reporting into Required (see mutation_stratified).

# ============================================================================
# BIOMARKER FACETS — relational (feature x outcome). NOT gates. Each surfaces UNDER the
# outcome gate it reports_into, as either a confidence annotation (corroboration) or a
# patient-selection facet (stratification). All are backed by derived_from measurement_types.
# ============================================================================
biomarker_facets:
  - short: mutation_stratified          # mutation_stratified_dependency
    role: stratification                # feature partitions outcome → WHO responds
    reports_into: dependency
    surfaces_as: patient_selection
    framework_can_evidence: captured
    evidences: "dependency stratified by own mutation status (oncogene-addiction biomarker)."
    note: "carries verdict biomarker_stratified_dependency; already rescues the C veto (kept)."

  - short: expression_correlation       # expression_dependency_correlation
    role: stratification
    reports_into: dependency
    surfaces_as: patient_selection
    framework_can_evidence: captured
    evidences: "own mRNA expression predicts own dependency (expression-as-biomarker)."

  - short: crispr_rnai_concordance      # crispr-rnai-dependency-concordance
    role: corroboration                 # two measures of the SAME thing agree → confidence
    reports_into: dependency
    surfaces_as: confidence
    framework_can_evidence: captured
    evidences: "CRISPR and RNAi LOF assays agree the target is required."

  - short: chemical_genetic_concordance # prism-crispr-concordance
    role: corroboration
    reports_into: [dependency, tractability_sm]   # the genuine cross-gate case (feeds BOTH)
    surfaces_as: confidence
    framework_can_evidence: partial
    evidences: "compound kill-pattern tracks CRISPR+RNAi dependency (on-target engagement)."
    note: "the one card that legitimately feeds two gates; the anti-double-count guard in the verdict gate stays."

  - short: dependency_predictability    # dependency-predictability (v1 orphan, no puller)
    role: corroboration
    reports_into: dependency
    surfaces_as: confidence
    framework_can_evidence: captured
    evidences: "how omics-predictable the dependency is (meta-evidence → C-confidence, Gate-C gap 1)."

  - short: synthetic_lethal_partners
    role: stratification                # SL partner defines the context where the target matters
    reports_into: dependency
    surfaces_as: patient_selection
    framework_can_evidence: partial
    evidences: "curated SL partner annotation (SynLethDB v3); suppresses the pooled non-dependent veto."
    note: "annotation, not measured co-dependency; never nominates on its own."

  - short: subtype_fit
    role: stratification
    reports_into: dependency
    surfaces_as: patient_selection
    framework_can_evidence: partial
    evidences: "subtype-stratified dependency (DepMap panorama); negative-selection hold only, n>=30."

# ============================================================================
# AXIS 2 — MODALITY-FIT ASSESSMENTS (sufficiency; per-lens). Names, not letters. The active
# modality lens (modality_relevance) selects which of these are relevant for a given target.
# ============================================================================
modality_fit:
  - short: tractability_sm
    axis: modality_fit
    gate_name: Small-molecule druggability
    modality_relevance: [small_molecule, degrader]
    band: sufficiency
    framework_can_evidence: partial
    evidences: "chemical-genetic (PRISM) + forward ligandability (AlphaFold/PDB pocket)."
    coverage_note: "retrospective PRISM + structural pocket wired; ternary/degrader feasibility not."

  - short: surface_modality
    axis: modality_fit
    gate_name: Surface-biologics fit (ADC/TCE/antibody)
    modality_relevance: [adc, bite_tce, antibody]
    band: sufficiency
    framework_can_evidence: blind
    evidences: "surface density / internalization / topology for ADC/BiTE/antibody."
    receives_facets: [lineage_restriction, shed_ectodomain]   # normal-tissue window + antigen-sink
    coverage_note: "surface abundance/density MS + avidity data-blocked (3/5 surface cards not on S3)."

  - short: safety
    axis: modality_fit
    gate_name: Safety
    modality_relevance: [small_molecule, degrader, adc, bite_tce, antibody]   # tiered severity per lens
    band: sufficiency
    framework_can_evidence: partial
    evidences: "germline LoF constraint (gnomAD) + normal-tissue liability (HPA IHC)."
    coverage_note: "modality-tiered: normal-tissue breadth trips a harder caution for BiTE/TCE than ADC."

  - short: differentiation
    axis: modality_fit
    gate_name: Differentiation
    band: sufficiency
    framework_can_evidence: partial
    evidences: "co-mutation / mutual-exclusivity + biomarker definability (TCGA-MC3 + GENIE Fisher)."
    coverage_note: "decisive axis (clinical precedent / competitive) is license-walled (Cortellis/IQVIA)."

# Translational — still unbuilt (no sub-skill). A sufficiency assessment; blind by construction.
unbuilt:
  - short: translational
    axis: modality_fit
    gate_name: Translational
    band: sufficiency
    framework_can_evidence: blind
    reason: "No sub-skill wired (translational-readiness is a placeholder phase)."

# ============================================================================
# MIGRATION NOTE (decision 4 — own slice, NOT this file): the 42 cards bind to gates via the
# skills' SKILL.md `composition.phase` + cards_used, and those phase letters already diverge
# from v1's gate letters. Re-aligning card→gate bindings + updating the deciding-axis router +
# calibration tests to consume `axis`/`reports_into` is a separate, test-guarded migration slice
# scheduled after this shape is agreed. This sketch changes NO runtime behavior.
