# subtype_crosswalk.yaml
# Canonical registry of molecular-subtype/subgroup STRATUM IDs per indication, the AXIS each belongs
# to, the COHORTS that actually carry members for it, and the cross-axis ASSOCIATIONS between strata.
#
# WHY THIS EXISTS (subtyping review 2026-08-09): the per-axis subtype panoramas speak DIFFERENT
# stratum vocabularies for the same indication — the DepMap dependency axis emits MSI_H/MSS (the only
# strata with cell-line members), while the TCGA expression axis emits CMS1-4 (which have ZERO DepMap
# cell lines). So target-profile's cross-axis coherence facet could never find a stratum id shared
# across >=2 axes, and `convergent_stratification` was effectively unreachable for the richest
# subtypes. This registry (a) declares the canonical id set + axis per indication so a consumer knows
# the full vocabulary, (b) records per-cohort availability so the facet knows WHICH axes can even
# carry a given stratum (CMS: patient-only), and (c) encodes cross-axis ASSOCIATIONS (CMS1 is
# MSI-H-ENRICHED, not identical) so the facet can relate findings across differently-vocabularied
# axes HONESTLY — an association is enrichment/overlap, NEVER equivalence.
#
# Sibling of indication_crosswalk.yaml (indication-level code reconciliation). Source of truth for
# stratum ids is the data-catalog subgroup-catalogs/{IND}/*.yaml; this registry MIRRORS those ids +
# adds the cross-axis relationships they document only in prose. Keep in sync when a catalog adds a
# stratum — the validator asserts sync in BOTH directions: every id here exists in a catalog, AND
# every catalog id is either registered here or named in `intentionally_excluded` below.

version: 1.2.0   # 1.2.0 (2026-09-14): + admissibility_floors, authoring_rule,
                 #   cohort_claim_reconciliation. Purely ADDITIVE at the top level -- both
                 #   consumers (tp_common.default_subtypes, tp_facets_subtype._load_subtype_crosswalk)
                 #   read only `indications`, so the new blocks are inert to every verdict path.
schema_version: 1
curation_status: iter1_authored

# ---- relationship_type vocabulary (how one stratum relates to another) ----
# enriched_in      : stratum A is over-represented within stratum B (A ⊂ B statistically, not set-wise)
#                    e.g. MSI_H enriched_in CMS1 (most CMS1 is MSI-H, but not all; and some MSI-H is not CMS1)
# co_defining      : two axes that partition the SAME biology (e.g. histology_ESCC / EAC are the two halves)
# mutually_exclusive : membership in A precludes B (e.g. MSI_H vs MSS)
# orthogonal       : independent axes (e.g. sidedness vs LOT) — no association claim
# NOTE: the coherence facet treats `enriched_in` as a WEAK bridge (report "related", never "same"),
# `mutually_exclusive` as a hard partition, and never fabricates convergence across `orthogonal`.

# ---- intentionally_excluded: catalog strata that this registry DELIBERATELY does not carry ----
#
# WHY THIS BLOCK EXISTS (foundation audit 2026-09-13): the sync validator only ran registry -> catalog
# ("no phantom ids"). The reverse direction was unguarded, so a stratum that EXISTS as data in
# data-catalog/subgroup-catalogs/ but is absent here was invisible to the DEFAULT-ON, VERDICT-BEARING
# subtype tier — the run silently proceeded whole-cohort with no gap reported anywhere. The audit found
# 21 such orphans across 9 catalogs. Nine are deliberate (below); the other 12 were real omissions.
#
# The distinction is the tier's own semantics, which tp_common.default_subtypes() states: the subtype
# tier means "a MEASURED, floor-cleared MOLECULAR SUBTYPE that is not a dependency holds the
# nomination". Staging, anatomic site and line-of-therapy are clinical descriptors, not molecular
# biology, so they are correctly absent from the default vocabulary. They remain fully usable via an
# explicit `--subtypes` argument; exclusion here scopes the DEFAULT, it does not retire the data.
#
# An entry here is a CLAIM that needs a reason, not a suppression. Adding an id to silence the
# reverse guard without a `reason` is the failure mode this block is meant to make visible.
intentionally_excluded:
  - indication: COADREAD
    strata: [stage_I, stage_II, stage_resectable]
    class: clinical_staging
    reason: "AJCC stage is a clinical descriptor, not molecular biology. tp_common.default_subtypes()
      names these explicitly as the reason the tier reads this curated registry rather than the raw
      catalog. Reachable via --subtypes."
  - indication: COADREAD
    strata: [MSS_RASMut_3Lplus, MSS_RASMut_1L2L, MSS_RASWT_LeftSided_1L]
    class: line_of_therapy_composite
    reason: "GENIE-BPC line-of-therapy composites (composite_cohorts, not atomic_strata) — trial-design
      cohorts crossing a molecular axis with a treatment-sequence axis. A composite is not a partition
      of the cohort, so it cannot supply the cross-stratum contrast the subtype verdict requires."
  - indication: HNSC
    strata: [site_oropharyngeal, site_oral_cavity, site_larynx]
    class: anatomic_site
    reason: "Anatomic subsite within the head and neck. Same non-molecular class as clinical staging.
      Note the biology that DOES matter here (HPV status) is carried as its own molecular stratum."

# ---- pending_authoring: molecular strata that SHOULD be registered but are not authored YET ----
#
# These are the other 12 orphans the reverse guard found. Unlike `intentionally_excluded`, every entry
# here is a real capability gap and is expected to LEAVE this list. They are separated because the two
# claims are opposite: excluded means "never, and here is why"; pending means "yes, blocked on X".
#
# WHY NOT JUST AUTHOR THEM NOW: a registered stratum is VERDICT-BEARING under the default-on subtype
# tier, and 83 of the 99 `expected_n` values in the subgroup-catalogs are ESTIMATES, not measurements —
# only COADREAD and SCLC carry "Observed emit" provenance. AML's estimated DepMap n's are 2-5, below
# even functional-requirement's underpower floor of 5. Authoring on a guessed denominator would ship a
# verdict resting on a number nobody measured, so the sequence is: measure n -> declare an admissibility
# floor -> author only what clears it. Some of these will land as cohort-restricted or stay excluded;
# that outcome IS the measurement doing its job, and it is not knowable from here.
#
# The validator pins this list BY NAME. Adding an id is therefore a deliberate, reviewed act — a new
# orphan cannot be quietly parked here to turn the reverse guard green.
pending_authoring:
  - indication: AML
    strata: [FLT3_ITD, NPM1_mut, IDH1_mut, IDH2_mut, TP53_mut, adverse_cytogenetics]
    blocked_on: measured_expected_n
    reason: "Complete 6-stratum catalog, NO registry entry at all, so every AML profile currently runs
      whole-cohort. Estimated DepMap n = 2-5 per stratum (below FR's floor of 5), so most of these are
      likely TCGA/GENIE-only or excluded outright once measured. Also depends on the GENIE republish
      (data-catalog #595 / analysis-methods #619) that covers AML."
  - indication: HNSC
    strata: [TP53_mut, PIK3CA_mut, NOTCH1_mut, CCND1_amp, TMB_high]
    blocked_on: measured_expected_n
    reason: "Driver-mutation, CN-amplification and TMB axes. Precedent exists — COADREAD, NSCLC, PAAD
      and BRCA all carry driver_mutation — so the axis shape is settled; only the denominators are not."
  - indication: ESCA
    strata: [TP53_mut]
    blocked_on: measured_expected_n
    reason: "ESCA is registered with 3 strata but its catalog carries a 4th. Single-stratum gap; the
      driver_mutation axis does not exist for ESCA yet, so this needs a new axis, not an append."

# ============================================================================================
# admissibility_floors — the governed subgroup-n floors, and what they actually DO
# ============================================================================================
#
# WHY THIS BLOCK EXISTS (foundation audit stage 3c, 2026-09-14): `pending_authoring` above names the
# sequence "measure n -> declare an admissibility floor -> author only what clears it". Stages 3a/3b
# measured all 180 expected_n declarations (data-catalog #598). This block is the middle step, which
# had never been taken: NO repo declared a floor. Sixteen literals in two families enforced one, and
# the ONLY thing keeping them consistent was prose comments naming each other.
#
# ★ THE AUDIT'S OWN PREMISE WAS WRONG AND THE MEASUREMENT CORRECTED IT. The plan said "three
# unreconciled literals ... one number read by all three, or an explicit statement of why a cohort
# legitimately differs". Measuring found the literals are not three but sixteen, and -- the load-
# bearing correction -- they do not differ by COHORT or by UNIT. They govern different POPULATIONS:
#   * family `subgroup_stratum_n` counts members of ONE STRATUM within one indication cohort;
#   * family `lineage_n`          counts cell lines within ONE LINEAGE, for per-lineage statistics.
# A lineage is not a stratum, so there is no number for both to share. `subgroup_stratum_n` is
# applied to patient counts AND cell-line counts at the same value of 30 -- verified, not assumed:
# analysis-methods methods/gdc_somatic_hotspot/read.py:543 applies it to TCGA patients and
# methods/depmap_chronos/read.py:208 applies it to DepMap cell lines, both `n >= SUBGROUP_N_FLOOR`.
# So "5 is cell lines, 30 is patients" -- which is what this audit believed going in -- is FALSE.
#
# ★★ THE FLOOR IS A LABELLING MECHANISM, NOT AN ADMISSION ONE. This is the single most important
# thing in this block, and it is why authoring is not gated on n >= 30. `subgroup_common/panorama.py
# ::evidence_state()` returns a TRICHOTOMY -- absent / underpowered / measured -- and an
# `underpowered` stratum is still computed, still emitted and still RENDERED; it is inadmissible only
# in COMPARATIVE prose (see the `powered` predicates in skills/_skills_common/subgroup_derivation.py
# and functional-requirement/scripts/run.py, which gate cross-stratum contrast, not existence).
# The governed authoring rule therefore already existed in code and had simply never been written
# down: it IS the trichotomy. See `authoring_rule` below.
#
# ★ THIS BLOCK IS DESCRIPTIVE, NOT PRESCRIPTIVE. Every number here is the value in force on
# 2026-09-14. CHANGING either floor is VERDICT-BEARING and deliberately out of scope: lowering
# `subgroup_stratum_n` to 5 would flip SCLC_P (measured n=8 DepMap lines) from `underpowered` to
# `measured`, which changes WHICH interpretation rule fires -- from
# `subtype-restricted-dependency-underpowered-supportive` to `subtype-restricted-dependency-
# supportive` -- and thereby lifts the "never dominant, never alone-sufficient" cap that the former
# carries. That is a verdict change disguised as a threshold tweak, and the escape hatch below is
# the better mechanism anyway because it gates on EFFECT SIZE rather than merely on a smaller n.
admissibility_floors:

  - family: subgroup_stratum_n
    value: 30
    population: "Members of ONE stratum within ONE indication cohort."
    units_applied_to: [tcga_patients, depmap_cell_lines, cptac_patients]
    declares: "The boundary between evidence_state `underpowered` and `measured`. NOT an
      existence or authoring gate -- see authoring_rule."
    canonical_definition: "analysis-methods methods/subgroup_common/panorama.py:37 SUBGROUP_N_FLOOR"
    # ★ That file's own comment reads "SINGLE SOURCE OF TRUTH -- readers import this, never
    # re-hardcode." Eight analysis-methods methods DO import it, correctly. Four skills modules
    # cannot: the skills repo has no import path to analysis-methods, so each re-declares the
    # literal. The claim is therefore false BY STRUCTURE, not by anyone's oversight, and no edit
    # inside analysis-methods can make it true. All five values agree TODAY; nothing enforces that.
    definition_sites:
      importers_of_canonical:
        - analysis-methods methods/depmap_chronos/read.py:208
        - analysis-methods methods/depmap_expression_distribution/read.py:154
        - analysis-methods methods/gdc_somatic_hotspot/read.py:543
        - analysis-methods methods/dge_deseq2/read.py:1594
        - analysis-methods methods/tcga_fusion_consensus/stratified.py:109
        - analysis-methods methods/tcga_patient_cn/stratified.py:65
        - analysis-methods methods/cptac_protein_distribution/read.py:75
        - analysis-methods methods/tcga_gtex_expression_distribution/read.py:1045,1336
      re_hardcoded_no_import_path:
        - skills/_skills_common/subgroup_derivation.py:327      # ★ carries NO mirror comment at all
        - skills/functional-requirement/scripts/run.py:181
        - skills/tumor-presence/scripts/run.py:72               # ★ comment conflates BOTH families
        - skills/render-evidence-package/scripts/render_markdown.py:687
      in_repo_rule_literals:                                    # this repo, interpretation-rules/
        - {rule_id: subtype-non-dependence-opposing, min_n_required: 30}
        - {rule_id: subtype-restricted-dependency-supportive, min_n_required: 30}
        - {rule_id: subtype-restricted-selectivity-supportive, min_n_required: 30}
        - {rule_id: subtype-expression-enriched-context, min_n_required: 30}
        - {rule_id: subtype-expression-restricted-context, min_n_required: 30}
        - {rule_id: subtype-expression-depleted-context, min_n_required: 30}
        - {rule_id: subtype-mutation-frequency-recurrent-context, min_n_required: 30}
    documented_exception:
      rule_id: subtype-restricted-dependency-underpowered-supportive
      min_n_required: 3
      # ★ NOT drift, and not a competing floor. Keyed on `evidence_state: underpowered` +
      # `subgroup_effect_admissible: true`, so it is DISJOINT from the floor-cleared rule (which
      # requires `measured`) and cannot double-fire. The 3 is an EFFECT-ADMISSIBILITY minimum, not a
      # relaxed power floor: admission additionally requires an overwhelming fraction of lines in the
      # strong-dependency band, i.e. a tight one-directional effect rather than a noisy mean on thin
      # data. Its own rationale states a hard n>=30 floor "would silently discard a genuine, clean
      # precision-oncology signal". Motivating case SCLC-P/POU2F3, described in-rule as ~5 tuft-cell
      # lines; this arc MEASURED it at n=8 of 63 evaluable DepMap lines. Capped supportive-only.

  - family: lineage_n
    value: 5
    population: "DepMap cell lines within ONE LINEAGE (or OncotreeCode), for per-lineage statistics."
    units_applied_to: [depmap_cell_lines]
    declares: "Whether a lineage is included in per-lineage enrichment/selectivity statistics at
      all -- an EXCLUSION gate on a statistic, not a label on a stratum. Different population and
      different consequence from subgroup_stratum_n; the two are not reconcilable to one number."
    canonical_definition: "cards/dependency-lineage-selectivity.card.yaml:127 min_cell_lines_in_lineage"
    definition_sites:
      - cards/dependency-lineage-selectivity.card.yaml:127                    # origin ("E2")
      - cards/prism-compound-activity.card.yaml:163                           # "mirrors E2"
      - analysis-methods methods/depmap_prism_precompute/cli.py:155           # "E2 parity"
      - skills/functional-requirement/scripts/run.py:716                      # _LINEAGE_UNDERPOWER_FLOOR

# ---- authoring_rule: when may a stratum be REGISTERED here? ----
#
# The rule that governs `pending_authoring` graduation. It is deliberately NOT "n >= 30", because
# that would confuse labelling with admission and, measured against the corpus, would retroactively
# disqualify 36 of the 84 already-registered measured cells (43%) -- including essentially the whole
# NSCLC actionable-driver panel (EGFR ex19del/L858R/ex20ins, ALK, ROS1, RET, MET ex14, BRAF V600E,
# HER2_mut), PAAD BRCA1/2 and KRAS G12R/G12V, HNSC HPV_positive, ESCA HER2_amp, STAD EBV_positive,
# and three of the four SCLC NAPY subtypes. Those are the clinically load-bearing strata of this
# whole framework; a floor that deletes them is measuring the wrong thing.
authoring_rule:
  registrable_when: "evidence_state(measured_n) != 'absent' for at least one declared cohort"
  # i.e. the stratum has >=1 measured member SOMEWHERE. `absent` means no members in the stratum
  # intersected with the method cohort -- there is nothing to stratify, so registering it would
  # create a stratum the subtype tier can never populate.
  floor_sets: claim_strength_not_existence
  states:
    absent:       "n == 0 on an EVALUATED cohort. NOT registrable for that cohort."
    underpowered: "1 <= n < 30. Registrable, computed, emitted and rendered; inadmissible in
                   CROSS-STRATUM COMPARATIVE prose. 36 of 84 measured cells sit here today."
    measured:     "n >= 30. Full comparative admissibility. 43 of 84 measured cells."
  # ★★ `evaluable == 0` IS NOT `n == 0`. A stratum whose every row abstained has measured NOTHING
  # and is `not_measured`, NOT `absent`. Conflating them is the exact defect analysis-methods #626
  # fixed one level down (DepMap opting out of normalize_effect made 13 strata report 0-of-N as
  # is_member=False rather than null). A `0` in a catalog is only an ABSENCE claim when its
  # `_denominator_note` says `Observed emit` -- the same 0 also serves as an N/A sentinel. This is
  # why the note is mandatory: schemas/subgroup_catalog.schema.json makes the pairing bidirectional
  # via `dependentRequired`, so a count can no longer ship without saying which kind of 0 it is.
  cohorts_key_semantics: "A cohort listed in an axis's `cohorts:` is a CLAIM that the stratum has
    members there -- the header states it records 'WHICH axes can even carry a given stratum'.
    Combined with the trichotomy this is checkable for the first time, which is what produced
    cohort_claim_reconciliation below."

# ============================================================================================
# cohort_claim_reconciliation — the 130 `cohorts:` claims checked against measurement
# ============================================================================================
#
# RECORDED, NOT FIXED. Every correction below is VERDICT-BEARING (removing a cohort from an axis
# changes which panoramas a profile builds), so it belongs behind the composed replay diff in
# stage 3d, not here. Pinned BY NAME so a new discrepancy is an error rather than a silent addition,
# and so removing one requires deleting its entry -- the reverse-guard pattern from #598.
#
# Census of all 130 (indication, axis, stratum, cohort) claims on 2026-09-14:
#   79 claim holds (measured, >=1 member)          10 not measurable, unresolvable
#   34 no expected_n key exists for that cohort     5 CONTRADICTED by measurement
#    2 CONTRADICTED by the catalog's own applicable_data_sources
cohort_claim_reconciliation:

  measured_absent:
    # The cohort WAS evaluated on a full denominator and found ZERO members. The claim is false.
    disposition: fix_in_stage_3d
    claims:
      - {indication: NSCLC, axis: driver_mutation, stratum: EGFR_mut_ex19del, cohort: depmap,
         measured: "0 members of ~244 evaluable of 264 rows"}
      - {indication: NSCLC, axis: driver_mutation, stratum: EGFR_mut_ex20ins, cohort: depmap,
         measured: "0 members of 264 evaluable of 264 rows"}
      - {indication: NSCLC, axis: driver_mutation, stratum: MET_ex14, cohort: depmap,
         measured: "0 members of ~263 evaluable of 264 rows"}
      - {indication: PAAD, axis: fusion, stratum: FGFR2_fusion, cohort: tcga,
         measured: "0 members of 190 evaluable of 190 rows"}
      - {indication: PAAD, axis: fusion, stratum: RET_fusion_PAAD, cohort: tcga,
         measured: "0 members of 190 evaluable of 190 rows"}

  source_excluded:
    # Sharper than measured_absent and needs NO measurement: the catalog stratum's own
    # `applicable_data_sources` EXCLUDES the cohort this registry claims. Two files, opposed
    # declarations. #598 corrected these two from a stray `expected_n_depmap: 60`/`: 40`.
    disposition: fix_in_stage_3d
    claims:
      - {indication: NSCLC, axis: histology, stratum: histology_Adeno, cohort: depmap,
         catalog_applicable_data_sources: [tcga]}
      - {indication: NSCLC, axis: histology, stratum: histology_SCC, cohort: depmap,
         catalog_applicable_data_sources: [tcga]}

  no_expectation_declared:
    # Cohort claimed, but the catalog shard declares no expected_n key for it at all -- so the
    # claim is neither confirmed nor refuted. Distinct from a note saying NOT MEASURED.
    disposition: measure_or_drop_in_stage_3d
    claims:
      - {indication: BRCA, axis: driver_mutation, stratum: TP53_mut, cohort: depmap}
      - {indication: BRCA, axis: driver_mutation, stratum: PIK3CA_mut, cohort: depmap}

  pending_substrate:
    # 19 `genie` claims (NSCLC x12, PAAD x7) where the catalog lists only [tcga, depmap]. This
    # registry is AHEAD of the catalogs on GENIE, deliberately: data-catalog #595 /
    # analysis-methods #619 (feat/genie-all-indications) republish 18 indications. Not curator
    # error and not fixable here -- the substrate lands first. COADREAD is absent from this list
    # because its catalog already declares genie/genie_bpc, which is why those 9 tokens existed in
    # the corpus while the schema enum omitted them.
    disposition: blocked_on_data_catalog_595_and_analysis_methods_619
    count: 19
    indications: [NSCLC, PAAD]

  unexpressible_before_this_change:
    # 4 `george_2015` claims (SCLC NAPY). The catalogs could not declare this cohort because
    # `george_2015` was absent from the schema's applicable_data_sources enum -- a structural
    # blocker, not an omission. This change adds the token, so the 4 become fixable in 3d.
    disposition: schema_token_added_2026_09_14_catalog_edit_in_stage_3d
    claims:
      - {indication: SCLC, axis: napy, strata: [SCLC_A, SCLC_N, SCLC_P, SCLC_Y], cohort: george_2015}

indications:

  # ============================================================================
  # COADREAD — the reference (fully covered: TCGA + DepMap + GENIE-BPC)
  # ============================================================================
  - canonical_code: COADREAD
    axes:
      - axis: msi_status
        strata: [MSI_H, MSS]
        cohorts: [tcga, depmap]          # the ONE COADREAD axis with DepMap cell-line members
        partition: mutually_exclusive
      - axis: molecular_subtype          # Guinney 2015 CMS (TCGA patient, directly-tagged)
        strata: [CMS1, CMS2, CMS3, CMS4]
        cohorts: [tcga]                  # PATIENT — the trusted Guinney labels (expected_n_depmap: 0 on THESE ids)
        partition: mutually_exclusive
      - axis: molecular_subtype_depmap   # CMS on DepMap Bowel lines (CMScaller NTP, method=cms_classifier).
                                         # DISTINCT ids from the TCGA CMS (option B, CMS_CLASSIFIER_DESIGN.md):
                                         # isolates the HYPOTHESIS-GENERATING cell-line call from the trusted
                                         # TCGA labels. Shard depmap-subgroup-assignments-coadread-cms-v1
                                         # (CMS1_depmap 17 / CMS2_depmap 41 / CMS3_depmap 19 / CMS4_depmap 33;
                                         # 21 unclassifiable). CMS1/CMS4 (immune/mesenchymal) recover poorly
                                         # on cell lines — lower confidence.
        strata: [CMS1_depmap, CMS2_depmap, CMS3_depmap, CMS4_depmap]
        cohorts: [depmap]
        partition: mutually_exclusive
      - axis: cimp_status
        strata: [CIMP_High, CIMP_Low, CIMP_Neg]
        cohorts: [tcga]
        partition: mutually_exclusive
      - axis: sidedness
        strata: [right_sided, left_sided]
        cohorts: [tcga]                  # sidedness UNMEASURABLE on DepMap (collection-site != primary sidedness)
        partition: mutually_exclusive
      - axis: driver_mutation
        strata: [KRAS_mut, KRAS_G12C, BRAF_V600E]
        cohorts: [tcga, depmap, genie]
      - axis: line_of_therapy
        strata: [LOT_1L_only, LOT_2L, LOT_3Lplus]
        cohorts: [genie_bpc]
    # Cross-axis associations (documented in the catalog prose; made machine-readable here).
    associations:
      - from: MSI_H
        to: CMS1
        relationship: enriched_in
        note: "MSI-H is CMS1-associated (Guinney 2015); most CMS1 is MSI-H/hypermutated/immune, but the sets are not equal. A weak bridge for coherence — report 'related', never 'same stratum'."
      - from: BRAF_V600E
        to: CMS1
        relationship: enriched_in
        note: "BRAF-V600E enriched in CMS1 (MSI-immune) + CIMP-High; right-sided."
      - from: MSI_H
        to: CIMP_High
        relationship: enriched_in
        note: "CIMP-High strongly MSI-H-enriched + BRAF-V600E-enriched (Weisenberger 2006)."
      - from: CMS4
        to: right_sided
        relationship: enriched_in
        note: "Mesenchymal CMS4 right-sided-enriched; TGF-beta/stromal biology."
      - from: CMS2
        to: left_sided
        relationship: enriched_in
        note: "Canonical CMS2 left-sided-enriched; WNT/MYC, best survival."
      - from: KRAS_mut
        to: CMS3
        relationship: enriched_in
        note: "Metabolic CMS3 KRAS-mutation-enriched."
      # DepMap-CMS ↔ TCGA-CMS cohort bridges: the CMScaller cell-line call is the SAME CMS biology as
      # the Guinney TCGA label, measured on a different cohort (co_defining — two axes partitioning the
      # same subtype across cohorts). The coherence facet relates them as RELATED + cohort_bridge=true
      # (DepMap vs TCGA), NEVER merges them — the hypothesis-generating cell-line call stays distinct
      # from the trusted patient label.
      - from: CMS1_depmap
        to: CMS1
        relationship: co_defining
        note: "DepMap CMScaller CMS1 call is the CMS1 biology on cell lines (hypothesis-generating; CMS1 immune-defined, recovers poorly off-tissue). Cohort bridge to the TCGA Guinney CMS1."
      - from: CMS2_depmap
        to: CMS2
        relationship: co_defining
        note: "DepMap CMScaller CMS2 call ↔ TCGA Guinney CMS2 (canonical). Cohort bridge, same biology."
      - from: CMS3_depmap
        to: CMS3
        relationship: co_defining
        note: "DepMap CMScaller CMS3 call ↔ TCGA Guinney CMS3 (metabolic). Cohort bridge, same biology."
      - from: CMS4_depmap
        to: CMS4
        relationship: co_defining
        note: "DepMap CMScaller CMS4 call ↔ TCGA Guinney CMS4 (mesenchymal; stroma-defined, recovers poorly off-tissue — hypothesis-generating). Cohort bridge."

  # ============================================================================
  # NSCLC — histology + drivers + fusions (histology data_blocked pending clinical loader)
  # ============================================================================
  - canonical_code: NSCLC
    axes:
      - axis: histology
        strata: [histology_Adeno, histology_SCC]
        cohorts: [tcga, depmap]          # LUAD/LUSC. TCGA patient (tcga-subgroup-assignments-nsclc-v1:
                                         # Adeno 230/SCC 178) + DepMap cell-line (depmap-subgroup-
                                         # assignments-nsclc-v1: Adeno 118/SCC 32, from OncotreeSubtype).
                                         # No longer data_blocked — both shards are materialized (2026-09-11).
        partition: co_defining
      - axis: driver_mutation
        strata: [EGFR_mut_ex19del, EGFR_mut_L858R, EGFR_mut_ex20ins, KRAS_G12C, KRAS_G12D, BRAF_V600E, MET_ex14, HER2_mut]
        cohorts: [tcga, depmap, genie]
      - axis: fusion
        strata: [ALK_fusion, ROS1_fusion, RET_fusion, NTRK_fusion]
        cohorts: [tcga, genie]
      - axis: tmb
        strata: [TMB_high]
        cohorts: [tcga]
      - axis: line_of_therapy
        strata: [LOT_1L_only, LOT_2L, LOT_3Lplus]
        cohorts: [genie_bpc]
    associations:
      - from: EGFR_mut_L858R
        to: histology_Adeno
        relationship: enriched_in
        note: "EGFR-mutant NSCLC concentrated in adenocarcinoma (LUAD)."
      - from: ALK_fusion
        to: histology_Adeno
        relationship: enriched_in
        note: "ALK/ROS1/RET fusions concentrated in LUAD."

  # ============================================================================
  # SCLC — NAPY (cell-line classifier; patient George cohort)
  # ============================================================================
  - canonical_code: SCLC
    axes:
      - axis: napy
        strata: [SCLC_A, SCLC_N, SCLC_P, SCLC_Y]
        cohorts: [depmap, george_2015]   # NAPY: classifier-derived; only SCLC_A clears n>=30
        partition: mutually_exclusive
      - axis: target_high
        strata: [DLL3_high]
        cohorts: [depmap]
    associations:
      - from: DLL3_high
        to: SCLC_A
        relationship: enriched_in
        note: "DLL3 (Notch ligand) expression is ASCL1(SCLC-A)-driven; DLL3-high concentrated in SCLC-A."

  # PAAD / HNSC / STAD / ESCA: patient-side subtypes present; DepMap subtype members mostly null.
  # Enumerated minimally here; cross-axis associations are indication-specific follow-ups.
  - canonical_code: PAAD
    axes:
      - axis: moffitt_subtype
        strata: [Moffitt_basal, Moffitt_classical]
        cohorts: [tcga]                  # 0 DepMap Moffitt calls (all-null on cell lines)
        partition: mutually_exclusive
      - axis: driver_mutation
        strata: [KRAS_G12D, KRAS_G12V, KRAS_G12R, KRAS_WT, TP53_mut, BRCA1_somatic, BRCA2_somatic]
        cohorts: [tcga, depmap, genie]
      - axis: fusion
        strata: [NTRK_fusion, FGFR2_fusion, RET_fusion_PAAD]
        cohorts: [tcga]
    associations: []

  - canonical_code: STAD
    axes:
      - axis: tcga_molecular_class
        strata: [EBV_positive, MSI_H, GS, CIN]
        cohorts: [tcga]                  # 4-class EBV/MSI/GS/CIN; DepMap all-null
        partition: mutually_exclusive
      - axis: cn_amplification
        strata: [HER2_amp]
        cohorts: [tcga]
    associations: []

  - canonical_code: ESCA
    axes:
      - axis: histology
        strata: [histology_ESCC, histology_EAC]
        cohorts: [tcga, depmap]
        partition: co_defining
      - axis: cn_amplification
        strata: [HER2_amp]
        cohorts: [tcga]
    associations: []

  - canonical_code: HNSC
    axes:
      - axis: bass_subtype
        strata: [subtype_atypical, subtype_mesenchymal, subtype_basal, subtype_classical]
        cohorts: [tcga]
        partition: mutually_exclusive
      - axis: hpv_status
        strata: [HPV_positive, HPV_negative]
        cohorts: [tcga]                  # data_blocked — HPV in no held source (see repoint runbook)
        partition: mutually_exclusive
    associations:
      - from: HPV_positive
        to: subtype_atypical
        relationship: enriched_in
        note: "HPV+ HNSC concentrated in the Atypical Bass subtype + oropharyngeal site."

  # ============================================================================
  # BRCA — PAM50 intrinsic subtypes (added 2026-08-09 with the new BRCA/PAM50 catalog, DC#311)
  # ============================================================================
  - canonical_code: BRCA
    axes:
      - axis: pam50_subtype           # Parker 2009 intrinsic subtypes (curated Subtype_Selected)
        strata: [PAM50_LumA, PAM50_LumB, PAM50_Her2, PAM50_Basal, PAM50_Normal]
        cohorts: [tcga]               # patient-only iter-1 (directly-tagged); DepMap PAM50 = iter-2 classifier
        partition: mutually_exclusive
      - axis: driver_mutation
        strata: [TP53_mut, PIK3CA_mut]
        cohorts: [tcga, depmap]
      - axis: cn_amplification
        strata: [ERBB2_amp]
        cohorts: [tcga]
    associations:
      # HER2-enriched INTRINSIC (PAM50) vs clinical HER2+ (ERBB2-amp): overlapping, NOT identical —
      # enriched_in captures that most ERBB2-amp is PAM50_Her2 while the sets differ.
      - from: ERBB2_amp
        to: PAM50_Her2
        relationship: enriched_in
        note: "Clinical HER2+ (ERBB2-amp) is enriched in the HER2-enriched INTRINSIC subtype, but the two are distinct axes (some ERBB2-amp are non-Her2-intrinsic and vice versa)."
      # TP53 loss is the genomic hallmark of Basal-like/TNBC-adjacent breast cancer.
      - from: TP53_mut
        to: PAM50_Basal
        relationship: enriched_in
        note: "TP53 LoF is strongly enriched in Basal-like (~80% of Basal/TNBC), the genomically-unstable arm."
      # PIK3CA activation concentrates in the luminal (ER+) intrinsic subtypes.
      - from: PIK3CA_mut
        to: PAM50_LumA
        relationship: enriched_in
        note: "PIK3CA activating mutations are luminal-enriched (LumA/LumB); alpelisib biomarker in HR+/HER2-."
