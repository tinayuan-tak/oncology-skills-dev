ncorroborated` block, so the set that blocks a nomination shrank by exactly those two keys -- while skills' own splitter warns in-source that a caller needing the strong-block must use the UNION and never contradictions alone. Reachability was then measured PER THESIS, on the only thesis this block graduates: (selectivity, discordant_across_comparators) is INERT, because selectivity is a `requires` conjunct whose verdict_in excludes it and the conjunction therefore still fails; (dependency, discordant) is LIVE, because dependency appears NOWHERE in the antigen_driven block, so a target carrying it was blocked before 1.20.0 and is not blocked now. The enlargement is therefore exactly ONE key on ONE thesis, and it is confined to the verdict whose whole content is THAT THE AXIS RESOLVED NOTHING. The surviving dependency guardrails were MEASURED on this thesis rather than inferred from the general rule, because vocab 1.17.0's thesis_axis_relevance DROPS the `non_dependent` veto for antigen_driven by design (the 0/14-surface fix): `pan_essential_killer` still VETOES -- the gate fires and the decider is never reached, and that is the one guardrail 1.17.0 explicitly never drops -- and `broadly_dependent` is still a listed contradiction and still blocks. `non_dependent` does NOT block and does nominate, but that is 1.17.0's deliberate choice for this thesis and not a consequence of the 1.20.0 relabelling. Not blocking on an axis that resolved nothing is the same correction this block already makes BY HAND via irrelevant_contradiction_axes for tractability_sm (the FOLR1/OV case), reached from the other direction. So it is recorded as CORRECT-BY-INTENT and pinned by a new test on the SKILLS side of this landing -- where the gate runs, and where the 40 tests shipped here could not testify because they predate 1.20.0. KNOWN LEAK, RECORDED 2026-09-15 POST-LANDING, NOT HIDDEN: the (A) selectivity conjunct admits the clamp OUTPUT `selective_with_normal_liability` while EXCLUDING one of that same clamp's declared `applies_to_input_verdicts` (`field_effect_tumor_selective`), and the loader only ever sees the POST-clamp token — so a field-effect target with a CLEAN normal profile is blocked, while the same target with a critical-organ liability DETECTED is admitted. The direction is fail-OPEN (detecting a liability turns a block into a GO) and CEACAM5/COADREAD sits one rule-fire away. Admitting `field_effect` instead would nominate it outright — a 5th dangerous FP against a floor of 4 that 1.21.0 already fills — so the leak is BOUNDED by test_admitted_clamp_arms_cannot_launder_an_excluded_pre_clamp_verdict (which fails if it ever widens, is closed, or stops being reachable) rather than widened. Closing it needs the clamp's PRE-PRECEDENCE (post-upgrade) input verdict published skills-side — NOT "the pre-clamp verdict", which this note said first and which is INSUFFICIENT: the clamp's `upgrade:` arm runs BEFORE the downgrade precedence and mints the excluded token `field_effect_tumor_selective` from {not_informative, discordant_across_comparators}, so a field named for what enters the clamp publishes `not_informative`, the exclusion compares against a token that is not it, and the leak survives behind a field that looks like the fix. See THE PRESCRIPTION IS NARROWER THAN IT LOOKS in the ⚠ block at conjunct (A) for the three-token chain. No semantic change, hence no version bump.
