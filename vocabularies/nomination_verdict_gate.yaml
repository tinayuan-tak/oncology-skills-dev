# nomination_verdict_gate.yaml
# Controlled policy: which sub-skill verdicts DETERMINISTICALLY force the
# target-profile overall_recommendation, overriding the LLM's choice.
#
# Background: target-profile's overall_recommendation was historically 100%
# LLM-chosen — a killer sub-verdict only appeared in the synthesis prompt as
# text and never forced the call (the framework's own "Decision #5": is the
# nomination LLM judgment we trust, or logic we can audit?). This file makes
# the veto/hold policy AUDITABLE and reviewable by product owners without a
# code change. The gate in
# claude-oncology-skills/skills/target-profile/scripts/run.py loads it and
# clamps overall_recommendation when a listed (sub_skill, verdict) fires.
#
# SAFETY-CRITICAL LOADER CONTRACT: the gate treats this file as an OVERRIDE of
# a conservative hardcoded fallback, NOT as the sole source. If this file is
# missing/unparseable the gate falls back to the hardcoded set and warns — it
# must NEVER become permissive (a missing policy silently disabling a
# pan-essential veto is a safety regression). Editing this file can only make
# the gate as-conservative-or-more against the fallback.
#
# CURATION PRINCIPLE — only genuine CROSS-TARGET vetoes belong here. A verdict
# that forecloses one MODALITY (e.g. surface neither_viable, degrader
# expression killers) must NOT force a blanket veto: the target may still be
# viable via another modality. KRAS×COADREAD is the canonical guard — it hits
# surface + degrader killers yet is a correct `nominate` via small molecule.
# Adding a modality-scoped killer here would regress that golden.

enum_id: nomination_verdict_gate
version: 1.22.0  # 1.22.0 (2026-09-18, Stage 2b): PARITY, not new policy — `not_dependent_in_indication` (minted by target-contracts #812, resolver dependency v1.4.0→v1.5.0, priority 9) inherits every mechanism the pooled `non_dependent` (priority 22) already had, and the two new POSITIVE tokens get their `positive_signals` weights. FORCED ORDERING, not a follow-up: `validate_verdict_tokens` walks gate→resolver ONE-WAY, so a resolver verdict that no gate block names is INVISIBLE to every gate — it is not demoted, it is unseen — and the calibration set's `must_not_veto` assertions would pass VACUOUSLY on a token no gate can reach. Landing the skills-side producer first would therefore fail the dependency axis OPEN on indication-scoped runs. Touched: a THIRD veto arm in `gates` (+ `kill_capable_verdicts`), 4 new `veto_suppressors` (A1i/A2i/A3i mirror a pooled arm each; A4i deliberately has NO pooled twin — see below), a third `modality_scoped_veto_suppression` entry, twins in `biology_axis_scoped_veto_downgrade` and `gof_driver_scoped_veto_downgrade`, the new arm appended to all 4 `thesis_axis_relevance.irrelevant` lists, and 2 `positive_signals` rows. VETO not hold, decided by MEASUREMENT: every calibration entry is keyed (target, indication, modality) and MET/LUAD's own note calls an indication-wrong veto WRONG, so a nomination IS indication-scoped — which is why `subtype_specific_non_dependence` stays a HOLD (it forecloses a subtype NARROWER than the queried scope) while this token forecloses EXACTLY the queried scope. POWER-GATED BY CONSTRUCTION: the driving rule keys on one measured token and all three could-not-look states route to a separate `insufficient*` rung, so the veto can never fire on an under-sampled indication. The three `insufficient*` dependency verdicts are a DELIBERATE ABSENCE from `kill_capable_verdicts`, now asserted as such. The suppressor/downgrade twins DUPLICATE rather than generalize to a verdict list on purpose: skills `tp_gates._load_veto_suppressors` reads `downgrades.verdict` / `suppresses.verdict` as SCALARS, so a list would be a schema the reader has never seen and would silently match NOTHING. Rationales are REWRITTEN, never copied: all four pooled ones justify the escape with the word POOLED, which is FALSE of this token — the surviving escapes are either DILUTION (an indication still pools genotypes and subtypes: smaller, never zero) or ORTHOGONALITY (a surface antigen / neomorphic GoF is not adjudicated by a knockout at ANY grain), and only the latter is grain-independent. A4i (paralog buffering) EXISTS BECAUSE OF A MEASURED RESOLVER GAP FOUND WHILE BUILDING THIS PARITY, and it is the finding a reviewer should read first: resolver v1.5.0 added compound twins pairing `not-dependent-in-indication-killer` with partner-conditional (rungs 6,7) and chemical-genetic (8) but NOT with `strong-paralog-buffering-degrader-preferred`, whose pooled compound rung sits at 19 — and priority 9 OUTRANKS 19. Measured on the calibration set: 3 of the 8 live `must_not_veto` controls resolve `non_dependent_paralog_buffered` today (WWTR1/MESO, MARK2/PAAD, MARK3/PAAD; MARK2/3 are ADVANCED programs), so at Stage 5 all three would flip from a non-veto verdict to a VETO. A4i suppresses the veto — correct on its own merits, since a single-gene KO is blind to a redundant paralog at EVERY panel size (ORTHOGONALITY, not dilution) — but it cannot relabel the verdict, and `expected_verdict_not_in` is asserted against the RESOLVER verdict, so the calibration suite is the forcing function: the resolver twin is a Stage-5 BLOCKER, declared and shape-pinned in the new guard rather than left in a comment. Six (not five) existing closed-set pins were deliberately WIDENED (they were written to stop veto scope creep, and a third veto arm IS scope creep), each preserving the property it protected — notably that suppressors never touch `pan_essential_killer`. ⚠ NECESSARY BUT NOT SUFFICIENT: `tp_gates.py:714` routes an UNRECOGNIZED dependency verdict to a FORCED VETO and none of the 4 new tokens is in `_RECOGNIZED_GATING_VERDICTS["dependency"]`; the two vocab→skills coupling tests catch 3 of them at pin-bump time, but `insufficient_underpowered_in_indication` is caught by NEITHER because it deliberately appears in no vocab block — so after Stage 5 "we could not look" would silently force a veto. The full forced skills-side delta is declared as a cross-repo obligation list in tests/vocabularies/test_indication_verdict_gate_parity.py, with an anti-drift assert against the resolver's own verdict set. # 1.21.0 (2026-09-15, Step 3, RELANDED): NEW `thesis_deciding_axes` block — the FIRST deterministic producer of `nominate`. Until now the gate could only VETO or HOLD (`action_precedence` has no `nominate`; `forced = max(hits)` ∈ {veto, hold, None}), so every `nominate` in every published run was LLM-authored and the positive tier's only observable effect was a confidence `floored_to`. This block graduates a thesis's BUILT-BUT-GATELESS deciding axis (Step 3 = surface_modality under antigen_driven) to a positive decider: on gate ABSTENTION, when the thesis's full necessity conjunction reads MEASURED-FAVOURABLE, the recommendation is floored `insufficient_evidence` → `nominate`. STRUCTURALLY F1-SAFE — it lives in the else-branch of the kill gate (unreachable when any veto/hold survives), exactly like the positive tier, so it can never mask or subordinate a kill. Routing STILL cannot invent a GO: every conjunct is a measured verdict/card field, an absent or `insufficient`/`data_unavailable`/`unmeasured` read FAILS the conjunction (→ insufficient_evidence, never nominate), and INVERTED FALLBACK means a missing/malformed block yields NO deciding axes → `nominate` becomes unreachable again. Only `antigen_driven` is graduated here; every other thesis (incl. `unresolved`) is byte-for-byte unchanged. SECOND deterministic producer, COMPLEMENTARY to 1.18.0's positive tier and DISJOINT from it: the favorable surface