# measurement_types.yaml — the governed measurement-type registry
# ============================================================================
# DATA_TO_SKILL_CONTRACT.md (2026-07-21). The "missing middle" the design doc
# names: a card's IDENTITY is (measurement_type × entity_grain). This file is the
# single governed vocabulary of measurement_types — the per-target-entity CLAIMS
# the framework can measure. Cards are VIEWS of a type; gates PULL type keys; data
# PUSHES providers. Ingestion and consumption meet here and never wire directly.
#
# SEEDED (2026-07-21) from the existing 40 cards' implied claims (migration step 2),
# grounded by a per-card survey. 37 types (30 dataset + 7 derived_from); 4 subgroup
# cards fold into an existing type as a NEW GRAIN (not a new type — the concordance
# test, Rule 2); 1 card excluded (surfaceome-cohort-ranking = a population-relative
# ranking, not a per-target claim — Rule non-goal / appendix case 14).
# +1 derived (tumor_elevation_breadth) added 2026-07-21 for the pan-cancer breadth card.
#
# GOVERNANCE (the two rules that keep this honest — doc "missing middle" §):
#   1. The CONCORDANCE TEST defines type identity. Two providers share a type IFF
#      they are corroborating (interchangeable) evidence for the SAME claim. Distinct
#      claims shown ALONGSIDE each other are distinct types. Same claim, new source =
#      a new PROVIDER (extend); same claim, new grain = a new entity_grain (extend);
#      genuinely new claim = a NEW type.
#   2. evidence_tier is MANDATORY per provider (measured | inferred | estimated). An
#      inferred/estimated provider must NEVER fire a measured-strength killer (the
#      measured-vs-null discipline, applied to provenance).
#
# CONFLICT: a type with >1 provider MUST declare multi_provider_policy
#   (tier_dominant | surface_discordance). Averaging / arbitrary pick-one is forbidden.
#
# GRAIN: entity_grains is the CAPABILITY CEILING (Rule 5). A query selects a grain
#   WITHIN it; a request above the ceiling → honest data_unavailable, NEVER a silent
#   fall-back to a coarser grain. target_subtype/target_lineage carry a PARTITION
#   dependency (Rule 4): the subgroup-catalog + subgroup-assignment product. A subtype
#   grain marked `blocked` is eligible-but-not-live (needs a per-sample reader).
#
# NOT here: population-relative claims (rankings, cross-cohort convergence, cross-
#   target mutual-exclusivity) — a different product class (panorama / cohort-scan),
#   kept out of the per-target skills. See Non-goals in the design doc.
#
# STATUS: scaffold slice (migration step 2). This registry is authored + validated;
#   provider wiring in analysis-methods and gate-view PULLs in skills are LATER
#   cross-repo slices (surface/CSPA family first). measurement_type on cards is
#   OPTIONAL during migration (validator warns, does not error) → REQUIRED for new
#   cards once the migration completes.
# ============================================================================

schema_version: 1

# Governed grain vocabulary (Rule 1/5). Extensible by a vocabulary entry here,
# NEVER by a card.schema.json change. `partition_required: true` grains need a
# subgroup-catalog + subgroup-assignment product (the Rule 4 upstream dependency).
entity_grain_vocabulary:
  target:            {partition_required: false, note: "scope-invariant: a property of the gene/protein"}
  target_indication: {partition_required: false, note: "within one indication cohort"}
  target_lineage:    {partition_required: false, note: "DepMap cell-line lineage; read-side groupby over per-ModelID rows"}
  target_subtype:    {partition_required: true,  note: "molecular subgroup; needs subgroup-catalog + assignment product"}
  target_pair:       {partition_required: false, note: "gene-PAIR grain: a claim about {target, partner} jointly (e.g. combinatorial-KO genetic interaction). Read-side keyed on target_gene; each pair carried under both members."}
  cohort:            {partition_required: false, note: "reserved — a named sample cohort"}
  single_cell:       {partition_required: false, note: "reserved — per-cell resolution"}

evidence_tiers: [measured, inferred, estimated]   # mandatory per provider

# ============================================================================
# DATASET types — a source+method measures the claim directly.
# ============================================================================
measurement_types:

  target_identity:
    claim: "Does the symbol resolve to a canonical HGNC/Ensembl/UniProt identity plus curated biology axis?"
    entity_grains: [target]
    cards: [target-identity-summary]
    providers:
      - {kind: dataset, source: target-id-resolver-release, evidence_tier: measured}

  cell_line_rna_expression:
    claim: "How is target mRNA distributed across DepMap cell lines, and is it lineage-stratified?"
    entity_grains: [target, target_lineage]
    cards: [cellline-rna-distribution]
    providers:
      - {kind: dataset, source: depmap-consortium-26q1, evidence_tier: measured}

  tumor_vs_adjacent_expression:
    claim: "Is target RNA upregulated in tumor vs matched adjacent normal (presence framing)?"
    entity_grains: [target_indication, target_subtype]   # target_subtype eligible-but-blocked (needs per-sample reader)
    cards: [tumor-rna-vs-adjacent, subgroup-stratified-expression]
    providers:
      - {kind: dataset, source: dge-tumor-vs-adjacent, evidence_tier: measured}

  tumor_expression_distribution:
    claim: "How does target RNA DISTRIBUTE across an indication's tumors (per-sample: median, fraction detectable/high, shape continuous|bimodal|long_tail)?"
    # Presence/abundance DISTRIBUTION framing — the per-sample tumor distribution the aggregate
    # cards (cohort median) can't produce. Distinct from tumor_vs_adjacent_expression (a contrast)
    # and from cell_line_rna_expression (DepMap cell lines). Q1 of the expression profiling spec.
    entity_grains: [target_indication, target_subtype]   # target_subtype eligible-but-blocked (needs TCGA UUID↔barcode bridge)
    cards: [tumor-rna-distribution]
    # tier_dominant, NOT surface_discordance: the claim is the TUMOR distribution; TCGA is the
    # dominant provider of it. GTEx is auxiliary — it supplies ONLY the matched-normal p95 OVERLAY
    # context fields (fraction_tumor_above_normal_p95), never a competing view of the distribution.
    # The tumor-vs-normal CONTRAST verdict lives on tumor_vs_normal_selectivity, not here.
    multi_provider_policy: tier_dominant
    providers:
      - {kind: dataset, source: tcga-tumor-tpm-recount3-long-v1, evidence_tier: measured}
      - {kind: dataset, source: gtex-tpm-recount3-long-v1, evidence_tier: measured}   # matched-normal p95 overlay (auxiliary)

  sc_tumor_celltype_expression:
    claim: "In how many cells of each tumor COMPARTMENT (malignant / immune / stromal / endothelial) is target detected at single-cell resolution, and is a detectable tumor signal tumor-cell-intrinsic (malignant) or microenvironmental?"
    # sc_rna MODALITY, tumor sample_context — the single-cell analogue of tumor_expression_distribution.
    # Rule 1 concordance test (distinct claim, shown ALONGSIDE bulk — NOT interchangeable): single-cell
    # carries TWO signals bulk RNA cannot — (1) DETECTION_FRACTION (fraction of a compartment's cells
    # expressing the target; bulk averages this away), and (2) COMPARTMENT ATTRIBUTION (is the tumor
    # signal from malignant cells or from immune/stromal microenvironment — the sc-unique answer to
    # the same question expression_purity_confound only ESTIMATES from bulk×purity). So this is a NEW
    # type, not a new provider of tumor_expression_distribution. Routes: Presence (A) only — a pure
    # biology-axis presence facet. NO modality_relevance key by design: the ADC/TCE antigen-reality
    # (microenvironment-dominant → is the antigen tumor-intrinsic?) modality-gate reading is DEFERRED
    # to P4; adding modality_relevance now would force a modality-axis rule this slice doesn't ship.
    entity_grains: [target_indication]   # per-indication tumor; target_subtype not attempted (per-cell subtyping is a later slice)
    cards: [tumor-scrna-celltype-expression]
    # tier_dominant: the CELLxGENE Census donor-pseudobulk is the single dominant provider of the
    # per-compartment single-cell presence claim. v1 materializes COADREAD + NSCLC (both carry a
    # per-cell MALIGNANT annotation + enough donors for the donor-is-replicate roll-up); other
    # indications resolve data_unavailable (honest capability ceiling).
    multi_provider_policy: tier_dominant
    providers:
      # kind: dataset (NOT derived_from): the donor×compartment pseudobulk is a RAW data-catalog
      # product from a filtered CELLxGENE Census query — NOT a composition of upstream framework
      # measurement_types. derived_from's inputs: must be registered measurement_type keys (DAG
      # edges); a manifest ID there is a dangling edge (Rule 4, cf. the fusion_rearrangement fix).
      # ONE provider today (COADREAD product); the NSCLC product is the SAME provider/claim at a
      # second indication (a grain value within entity_grains, not a second provider).
      - {kind: dataset, source: sc-pseudobulk-donor-celltype-coadread-v1, method: sc_celltype_pseudobulk, evidence_tier: measured}   # + sc-pseudobulk-donor-celltype-nsclc-v1 (same provider, NSCLC indication)

  tumor_vs_normal_selectivity:
    # P4 Tier-3 (2026-07-24): ENFORCE — every card of this type must declare modality_relevance
    # (validate_cards MODALITY_RELEVANCE_MISSING errors otherwise). Routing metadata only.
    modality_relevance: [small_molecule, degrader, adc, bite_tce, antibody]
    claim: "How robustly tumor-selective is target across four tumor-vs-normal comparators (efficacy-window framing)?"
    # Rule 1 discriminator (b): distinct from normal_tissue_*_breadth — same tumor-vs-normal biology,
    # but pulled by Selectivity (efficacy window), not Safety (off-tumor floor).
    entity_grains: [target_indication, target_subtype]   # target_subtype eligible-but-blocked
    cards: [tumor-vs-normal-selectivity]
    providers:
      - {kind: dataset, source: coadread-dge-tumor-vs-normal-sensitivity-v1, evidence_tier: measured}

  antigen_expressing_prevalence:
    claim: "What fraction of tumors express target above a clinically relevant level (patient-selection prevalence)?"
    entity_grains: [target_indication, target_subtype]   # target_subtype eligible-but-blocked
    cards: [antigen-prevalence]
    providers:
      - {kind: dataset, source: dge-tumor-vs-adjacent, evidence_tier: measured}

  tumor_protein_abundance:
    # P4 Tier-3 (2026-07-24): ENFORCE — every card of this type must declare modality_relevance
    # (validate_cards MODALITY_RELEVANCE_MISSING errors otherwise). Routing metadata only.
    modality_relevance: [small_molecule, degrader, adc, bite_tce, antibody]
    claim: "Is target present at protein level in tumor vs matched normal (CPTAC MS)?"
    entity_grains: [target_indication, target_subtype]   # target_subtype eligible-but-blocked
    cards: [tumor-protein-abundance-cptac]
    providers:
      - {kind: dataset, source: cptac-protein-tumor-vs-normal-per-cohort-v1, evidence_tier: measured}

  phospho_pathway_activity:
    claim: "Is target phosphorylated (a pathway-activity proxy) in the indication's tumors, beyond its total abundance (CPTAC phospho)?"
    # Q8 — CPTAC phosphoproteomics. DISTINCT from tumor_protein_abundance (total protein presence):
    # this is the PHOSPHO-level activity readout (activated phosphosites, phospho-vs-total), the
    # sharpest presence signal for kinases/signaling proteins where phosphorylation ≠ abundance.
    # Routes: Presence (A, protein/pathway support) + Mechanism (D). Biology axis; no modality facet.
    entity_grains: [target_indication]
    cards: [phospho-pathway-activity]
    providers:
      - {kind: dataset, source: cptac-pdc-snapshot-2026-07-01, evidence_tier: measured}   # cptac pkg harmonized phosphoproteomics [bcm]

  cell_line_protein_abundance:
    # P4 Tier-3 (2026-07-24): ENFORCE — every card of this type must declare modality_relevance
    # (validate_cards MODALITY_RELEVANCE_MISSING errors otherwise). Routing metadata only.
    modality_relevance: [small_molecule, degrader]
    claim: "What is target's Gygi-TMT-MS protein abundance across DepMap cell lines?"
    # Distinct from cell_line_rna_expression: RNA vs MS protein are orthogonal layers whose
    # disagreement is diagnostic (never averaged) — the concordance-test signal for two types.
    entity_grains: [target, target_lineage]
    cards: [cellline-protein-abundance]
    providers:
      - {kind: dataset, source: depmap-consortium-26q1-proteomics, evidence_tier: measured}

  crispr_lof_dependency:
    # P4 Tier-3 (2026-07-24): ENFORCE — every card of this type must declare modality_relevance
    # (validate_cards MODALITY_RELEVANCE_MISSING errors otherwise). Routing metadata only.
    modality_relevance: [small_molecule, degrader]
    claim: "What is the shape of CRISPR (Chronos) LOF dependency on target, incl. lineage and molecular-subgroup slices?"
    entity_grains: [target, target_lineage, target_subtype]   # target_subtype LIVE (subgroup-stratified-dependency binds a per-sample reader)
    cards: [pan-cancer-crispr-dependency-distribution, dependency-lineage-selectivity, subgroup-stratified-dependency]
    providers:
      - {kind: dataset, source: depmap-consortium-26q1, evidence_tier: measured}

  rnai_lof_dependency:
    # P4 Tier-3 (2026-07-24): ENFORCE — every card of this type must declare modality_relevance
    # (validate_cards MODALITY_RELEVANCE_MISSING errors otherwise). Routing metadata only.
    modality_relevance: [small_molecule, degrader]
    claim: "What is the shape of RNAi (DEMETER2) LOF dependency on target?"
    entity_grains: [target, target_lineage]
    cards: [pan-cancer-rnai-dependency-distribution]
    providers:
      - {kind: dataset, source: depmap-consortium-26q1-rnai, evidence_tier: measured}

  dependency_predictability:
    claim: "Can target's Chronos dependency be predicted from omics (biomarker-anchored / context-driven / unpredictable)?"
    # Registered but pulled by no gate today (mirror of the CSPA case, Rule 3): a first-class
    # visible 'no-puller' state, not a dead end.
    entity_grains: [target, target_lineage]
    cards: [dependency-predictability]
    providers:
      - {kind: dataset, source: depmap-predictability, evidence_tier: measured}

  paralog_buffering:
    # P4 Tier-3 (2026-07-24): ENFORCE — every card of this type must declare modality_relevance
    # (validate_cards MODALITY_RELEVANCE_MISSING errors otherwise). Routing metadata only.
    modality_relevance: [small_molecule, degrader]
    claim: "Does a functional paralog buffer target's dependency (dual-KO delta / escape risk)?"
    entity_grains: [target]
    cards: [paralog-buffering]
    providers:
      - {kind: dataset, source: depmap-paralog-buffering-per-gene-v1, evidence_tier: measured}

  synthetic_lethal_partner:
    claim: "Does target have a curated (experimental) synthetic-lethal partner making a pooled non-dependent read untrusted?"
    # Annotation, not measurement — suppresses a veto to insufficient, never nominates (per the
    # synleth wiring). evidence_tier: inferred reflects curated-pair annotation, not a measured screen.
    entity_grains: [target]
    cards: [synthetic-lethal-partners]
    providers:
      - {kind: dataset, source: synlethdb-sl-partners-per-gene-v1, evidence_tier: inferred}

  prism_compound_activity:
    # P4 Tier-3 (2026-07-24): ENFORCE — every card of this type must declare modality_relevance
    # (validate_cards MODALITY_RELEVANCE_MISSING errors otherwise). Routing metadata only.
    modality_relevance: [small_molecule]
    claim: "Does an annotated compound hit target, and is its activity lineage-selective or pan-cancer?"
    entity_grains: [target, target_lineage]
    cards: [prism-compound-activity]
    providers:
      - {kind: dataset, source: depmap-prism-activity-v3, evidence_tier: measured}

  mutation_hotspot_frequency:
    claim: "What is target's somatic mutation frequency + hotspot landscape in patient cohorts, incl. subgroup slices?"
    entity_grains: [target_indication, target_subtype]   # target_subtype LIVE (subgroup-stratified-mutation-frequency)
    cards: [mutation-hotspot-frequency, subgroup-stratified-mutation-frequency]
    providers:
      - {kind: dataset, source: gdc-pancohort-somatic, evidence_tier: measured}

  mutation_variant_class_spectrum:
    # P4 Tier-3 (2026-07-24): ENFORCE — every card of this type must declare modality_relevance
    # (validate_cards MODALITY_RELEVANCE_MISSING errors otherwise). Routing metadata only.
    modality_relevance: [small_molecule, degrader]
    claim: "What variant classes does target carry in cell lines (missense vs LOF vs mixed = oncogene/TSG pattern)?"
    # Distinct from mutation_hotspot_frequency (concordance test, appendix case 3): both 'about
    # mutations' but one is per-cohort recurrence, the other is per-line variant-class spectrum.
    entity_grains: [target, target_lineage]
    cards: [mutation-type-counts]
    providers:
      - {kind: dataset, source: depmap-consortium-26q1, evidence_tier: measured}

  mutation_status:
    claim: "Is target hotspot/damaging-mutant vs wild-type per sample (a per-line boolean, the biomarker axis)?"
    # LATENT UNOWNED input surfaced by the survey: mutation_stratified_dependency's mutation input
    # is a per-line mutant/WT boolean (DepMap hotspot/damaging matrices), NOT the variant-class
    # spectrum above. No standalone card is a view of it today — it exists as a derived-edge input.
    entity_grains: [target, target_lineage]
    cards: []
    providers:
      - {kind: dataset, source: depmap-consortium-26q1, evidence_tier: measured}

  copy_number_alteration:
    # P4 Tier-3 (2026-07-24): ENFORCE — every card of this type must declare modality_relevance
    # (validate_cards MODALITY_RELEVANCE_MISSING errors otherwise). Routing metadata only.
    modality_relevance: [small_molecule, degrader, adc, bite_tce, antibody]
    claim: "Is target recurrently amplified/deleted or broadly copy-neutral across cell lines?"
    entity_grains: [target, target_lineage]
    cards: [copy-number-distribution]
    providers:
      - {kind: dataset, source: depmap-consortium-26q1, evidence_tier: measured}

  fusion_rearrangement:
    claim: "Is target recurrently involved in gene fusions or structural rearrangements?"
    entity_grains: [target_indication]
    cards: [fusion-rearrangement-landscape]
    providers:
      # kind: dataset (not derived_from) — tcga-fusion-consensus-v1 is a RAW data-catalog product, not a
      # composition of upstream measurement_types. derived_from's `inputs:` must be registered
      # measurement_type keys (DAG edges); a manifest ID there is a dangling edge (Rule 4). Fixed
      # 2026-08-04: was mis-declared as derived_from at #108, failing the vocab validator on main since.
      - {kind: dataset, source: tcga-fusion-consensus-v1, method: tcga_fusion_consensus, evidence_tier: measured}   # LIVE 2026-07-23: pan-TCGA 3-caller consensus (TumorFusions/Gao/cBioPortal SV)

  fusion_status:
    claim: "Does the cell line carry a fusion INVOLVING the target (target as 5' or 3' partner), per line (a per-line boolean, the fusion biomarker axis)?"
    # A1-fusion (2026-08-06): the CELL-LINE fusion-involvement boolean — the DepMap analog of
    # mutation_status, distinct from the PATIENT-grain fusion_rearrangement above (target_indication,
    # TCGA recurrence). This is a per-line ModelID-keyed boolean from DepMap OmicsFusionFiltered.csv,
    # the input to fusion_stratified_dependency. Like mutation_status, no standalone card is a view of
    # it today — it exists as a derived-edge input (cards: []).
    entity_grains: [target, target_lineage]
    cards: []
    providers:
      - {kind: dataset, source: depmap-consortium-26q1, evidence_tier: measured}

  partner_deficiency_status:
    claim: "Is a PARTNER gene deficient in the cell line (MSI-high signature OR partner loss-of-function), per line (a per-line boolean, the synthetic-lethality stratifier axis)?"
    # Track PC (2026-08-09): the per-line PARTNER-DEFICIENCY boolean — the input to
    # partner_conditional_dependency. Distinct from mutation_status/fusion_status because the deficient
    # gene is the target's PARTNER, not the target itself, and the deficiency is heterogeneous:
    # msi_signature (canonical OmicsInferredMolecularSubtypes.csv MSI boolean) OR lof_mutation (partner
    # damaging matrix). Curated target->partner map (methods/depmap_partner_conditional_dependency/
    # partner_map.yaml); SynLethDB = candidate-generation. Like mutation_status/fusion_status, no
    # standalone card is a view of it — it exists as a derived-edge input (cards: []).
    entity_grains: [target, target_lineage]
    cards: []
    providers:
      - {kind: dataset, source: depmap-consortium-26q1, evidence_tier: measured}

  genomic_instability_state:
    claim: "How chromosomally unstable is the indication's cohort (aneuploidy / CIN burden)?"
    # M7 genome-state slice: an INDICATION-level, target-INDEPENDENT genome-wide phenotype (not a
    # per-gene call). Read LIVE from the PanCanAtlas seg-based scores (per-sample frac_altered),
    # scoped to the indication via the barcode→cancer-type annotation. DISPLAY facet — verdict-inert
    # context (high CIN correlates with WGD / prognosis / copy-number-noise caveats). No modality_relevance:
    # it is not a per-modality driver signal, it is cohort-genome context.
    entity_grains: [cohort]
    cards: [genomic-instability-state]
    providers:
      - {kind: dataset, source: gdc-pancanatlas-cnv-2018, method: tcga_aneuploidy_burden, evidence_tier: measured}

  ddr_deficiency_context:
    claim: "How HRD/DDR-deficient is the indication's cohort (fraction HRD-high)?"
    # Track PI (2026-08-09): an INDICATION-level, target-INDEPENDENT PRE-INTEGRATED companion result —
    # the PanCanAtlas DDR footprint (Knijnenburg 2018) per-sample HRD_Score (HRD-TAI+LST+LOH composite)
    # rolled up to a per-indication HRD-high fraction. DISPLAY facet — verdict-inert cohort HRD prior
    # (frames the PARP1/HRD blind axis; does NOT establish the partner-conditional dependency, which is
    # the separate partner_conditional_dependency type). Sibling of genomic_instability_state. No
    # modality_relevance: cohort-genome context, not a per-modality driver.
    entity_grains: [cohort]
    cards: [ddr-deficiency-context]
    providers:
      - {kind: derived_from, inputs: [ddr_footprint_score], method: cohort_fraction, evidence_tier: measured}

  ddr_footprint_score:
    claim: "Per-sample DDR/HRD footprint scores (HRD_Score, mutSig3, PARPi7), the pre-integrated Knijnenburg 2018 result."
    # Track PI (2026-08-09): the per-sample DDR footprint INPUT to ddr_deficiency_context. Pre-integrated
    # by Knijnenburg 2018 (we do not recompute HRD). Like fusion_status/partner_deficiency_status, no
    # standalone card is a view of it — a derived-edge input (cards: []).
    entity_grains: [cohort]
    cards: []
    providers:
      - {kind: dataset, source: gdc-pancanatlas-companions-2018, evidence_tier: measured}

  pathway_activity_context:
    claim: "Which PROGENy signaling pathways are relatively active in the indication's cohort (cross-indication z)?"
    # Track PROGENy (2026-08-10): INDICATION-level, target-INDEPENDENT PRE-INTEGRATED mechanism result —
    # PROGENy (Schubert 2018) pathway-footprint activity scored on recount3/TCGA, rolled up per-(pathway
    # x indication) + cross-indication z. DISPLAY facet — verdict-inert mechanism-context prior (upgrades
    # the Mechanism gate from topology-only to quantitative activity). Sibling of phospho_pathway_activity.
    entity_grains: [cohort]
    cards: [pathway-activity-context]
    providers:
      - {kind: derived_from, inputs: [pathway_activity_footprint], method: cross_indication_zscore, evidence_tier: measured}

  pathway_activity_footprint:
    claim: "Per-sample PROGENy pathway-activity scores (MLM over the responsive-gene footprint), the pre-integrated Schubert 2018 model applied to recount3/TCGA."
    # Track PROGENy input to pathway_activity_context. Like fusion_status/ddr_footprint_score: a
    # derived-edge input, no standalone card (cards: []).
    entity_grains: [cohort]
    cards: []
    providers:
      - {kind: derived_from, inputs: [tumor_expression_distribution], method: progeny_mlm, evidence_tier: measured}

  alteration_role:
    claim: "Is target a functional cancer driver in the indication (activating GoF / loss-of-function LoF driver / predictive biomarker / passenger)?"
    # The typed FUNCTIONAL-ROLE call layered on the descriptive alteration cards — the primitive the
    # genomic gate needs (frequency ≠ function). Genomic-alteration plan step 1. ZERO new ingestion.
    # tier_dominant: OncoKB (curated gene-role) is the dominant backbone; IntOGen adds patient-scale,
    # indication-scoped, statistically-significant mode-of-action (Act/LoF). Routes: genomic gate +
    # (P4, 2026-07-23) ALL modality-fit gates via modality_relevance — a driver role bears on SM/degrader
    # (drug the gained function) AND on the biologics lenses (an activating/amplified role feeds the
    # surface antigen-density argument) + the biomarker facet.
    modality_relevance: [small_molecule, degrader, adc, bite_tce, antibody]
    entity_grains: [target_indication]
    cards: [alteration-role]
    multi_provider_policy: tier_dominant
    providers:
      - {kind: dataset, source: oncokb-gene-roles-public-snapshot-2026-07-01, evidence_tier: measured}   # curated gene-role backbone (dominant)
      - {kind: dataset, source: intogen-v2024-09-20, evidence_tier: measured}   # per-(gene,cohort) mode-of-action (indication scope)

  functional_gene_state:
    claim: "Is target BIALLELICALLY inactivated (completed two-hit) or only monoallelically hit, harmonized across mutation + allele-specific copy number, per sample?"
    # M6 of the genomic-alteration plan — the harmonized two-hit / biallelic-inactivation primitive.
    # DISTINCT from the descriptive alteration cards (mutation-hotspot-frequency = how OFTEN; copy-
    # number-distribution = amp/del recurrence) AND from alteration_role (functional GoF/LoF ROLE): this
    # is the ALLELE-COUNT call — how many alleles are inactivated + by what mechanism — the substrate
    # for loss-of-function / synthetic-lethality reasoning (a het passenger ≠ a completed two-hit).
    # PHASE 1 = GENETIC-ONLY vocab {wt, monoallelic, biallelic-genetic, uncertain}, ZERO new ingestion.
    # Phase 2 (queued) adds {epigenetic, biallelic+epigenetic} once patient DNA-methylation lands
    # (PanCanAtlas HM450 → promoter methylation; DepMap RRBS already covers the model side) — a strict
    # superset, additive (a 3rd provider + 2 states), NOT a rework.
    # TWO grains / TWO arms (grain-split, like rna_protein_concordance): patient (target_indication —
    # ABSOLUTE per-locus allele-specific LOH, the SHARP arm) + model (target — DepMap relative CN +
    # genome-wide LoH, so copy-neutral per-gene LOH resolves `uncertain`, not a false biallelic).
    # tier_dominant: patient TCGA is the dominant arm (allele-specific); DepMap corroborates cross-system.
    entity_grains: [target, target_indication]
    cards: [functional-gene-state]
    multi_provider_policy: tier_dominant
    providers:
      - {kind: dataset, source: tcga-mc3-public-v0-2-8,   evidence_tier: measured}   # patient mutation (hg19)
      - {kind: dataset, source: gdc-pancanatlas-cnv-2018, evidence_tier: measured}   # patient ABSOLUTE allele-specific LOH + GISTIC homdel (dominant arm)
      - {kind: dataset, source: depmap-consortium-26q1,   evidence_tier: measured}   # model mutation matrices + relative CN (corroborating arm)

  mutation_cooccurrence:
    claim: "Which genes co-occur with or are mutually exclusive to target mutations?"
    entity_grains: [target, target_subtype]   # target_subtype eligible-but-blocked; pan-cohort
    cards: [co-mutation-and-mutual-exclusivity]
    providers:
      - {kind: dataset, source: pancohort-cooccurrence-fisher-v1, evidence_tier: measured}   # TCGA MC3 + GENIE 19.0

  signaling_network_mechanism:
    claim: "What upstream/downstream SIGNOR signaling context and candidate MoA hooks does target have?"
    entity_grains: [target]
    cards: [signaling-network-mechanism]
    providers:
      - {kind: dataset, source: signor-mechanism-network-per-gene-v1, evidence_tier: measured}

  protein_domains_class:
    # Target-intrinsic domain architecture (FT DOMAIN) + protein class (UniProt keyword taxonomy).
    # No modality_relevance — descriptive molecular context, not a modality-routing signal.
    claim: "What is target's curated domain architecture and molecular protein class(es)?"
    entity_grains: [target]
    cards: [protein-domains-class]
    providers:
      - {kind: dataset, source: uniprot-protein-features-v1, evidence_tier: measured}

  degradation_feasibility:
    # Degrader-lens E3 slice: is the target a tractable DEGRADATION substrate (PROTAC/glue)? Fuses
    # curated degrader precedent + natural E3-substrate evidence (UbiBrowser) + a surfaceome location
    # gate. modality_relevance = degrader (it exists to inform the degrader modality). Feeds the
    # degrader lens via degrader-channel-only rules; small-molecule spine untouched. Additive.
    claim: "Is target a tractable degradation substrate (PROTAC/molecular-glue feasibility)?"
    entity_grains: [target]
    cards: [degradation-feasibility]
    # UbiBrowser natural-substrate evidence is authoritative for the ubiquitination-competence signal;
    # SwissProt only supplies the AC->symbol join for the predicted layer → tier_dominant.
    multi_provider_policy: tier_dominant
    providers:
      - {kind: dataset, source: ubibrowser-e3-substrate-per-gene-v1, evidence_tier: measured}
      - {kind: dataset, source: uniprot-sprot-human-2026-02-snapshot-2026-06-18, evidence_tier: measured}

  domain_modality_relevance:
    # The INTERPRETIVE layer on top of protein_domains_class (roadmap #3): does the target's domain
    # FUNCTION favor a catalytic-site inhibitor, or REMOVAL (degrader/glue) because the therapeutic
    # function is scaffolding / non-catalytic (RIPK1 case)? Curated override (scaffolding biology the
    # data can't infer) > class-driven heuristic. modality_relevance = small_molecule + degrader
    # (it discriminates between those two modalities). Additive / verdict-inert display facet.
    claim: "Does target's domain function favor catalytic inhibition or removal (degrader/glue)?"
    entity_grains: [target]
    cards: [domain-modality-relevance]
    # UniProt curated FT DOMAIN + protein class is authoritative; InterPro only BROADENS domain
    # coverage (never overrides the curated class the heuristic reasons over) → tier_dominant.
    multi_provider_policy: tier_dominant
    providers:
      - {kind: dataset, source: uniprot-protein-features-v1, evidence_tier: measured}
      - {kind: dataset, source: interpro-109-0-snapshot-2026-08-05, evidence_tier: measured}

  variant_level_interpretation:
    # PER-VARIANT functional interpretation (oncogenicity + therapy resistance), aggregated to the
    # gene. Closes the gene→variant gap: alteration-role is per-GENE, mutation-hotspot-frequency is
    # FREQUENCY not FUNCTION. Target-grain + indication-independent (a variant's oncogenicity/
    # resistance is a property of the gene's variants). No modality_relevance — descriptive per-
    # variant call, not a modality-routing signal. DISPLAY facet, verdict-inert. Source: CIViC (CC0).
    claim: "For target, which specific variants are oncogenic (vs VUS/benign) and which confer therapy resistance?"
    entity_grains: [target]
    cards: [variant-level-interpretation]
    providers:
      - {kind: dataset, source: civic-variant-interpretation-per-gene-v1, method: civic_variant_interpretation, evidence_tier: measured}

  reactome_pathway_membership:
    # Target-intrinsic pathway/geneset MEMBERSHIP (distinct from signaling_network_mechanism's
    # directed edges). No modality_relevance — this is descriptive molecular context, not a
    # modality-routing signal. Consumed by the target-intrinsic dossier subskill.
    claim: "Which curated Reactome pathways is target a member of, under which top-level parents?"
    entity_grains: [target]
    cards: [reactome-pathway-membership]
    providers:
      - {kind: dataset, source: reactome-v96, evidence_tier: measured}

  gene_ontology_annotation:
    # Target-intrinsic GO functional annotation (BP/MF/CC). No modality_relevance — descriptive
    # molecular context, not a modality-routing signal. Consumed by the target-intrinsic dossier.
    claim: "Which GO terms (biological process / molecular function / cellular component) is target annotated with?"
    entity_grains: [target]
    cards: [gene-ontology-annotation]
    providers:
      - {kind: dataset, source: gene-ontology-release-2026-05-19, evidence_tier: measured}

  ppi_interactome:
    # Target-intrinsic protein-protein-interaction context: STRING functional network degree + CORUM
    # complex membership. No modality_relevance — descriptive context, not a modality-routing signal.
    # Two providers report DISTINCT signals side-by-side (functional-association degree vs stable-
    # complex membership) — surface_discordance = report alongside, NEVER average/collapse (Rule 5).
    claim: "How connected is target in STRING, and which CORUM protein complexes is it a member of?"
    entity_grains: [target]
    cards: [ppi-interactome]
    multi_provider_policy: surface_discordance
    providers:
      - {kind: dataset, source: string-v12-human-snapshot-2026-06-30, evidence_tier: measured}
      - {kind: dataset, source: corum-5-3, evidence_tier: measured}

  known_drug_tractability:
    # PHARMACOLOGY leg of small-molecule tractability (DGIdb): has a drug been catalogued against the
    # target (approved / antineoplastic) + is it in a recognized druggable-genome category? Orthogonal
    # to the retrospective PRISM cell-line cards and complementary to the STRUCTURE leg
    # (structure_druggability). Feeds the SM verdict via the E-known-drug intracellular rules.
    modality_relevance: [small_molecule]
    claim: "Has a small-molecule drug been catalogued against target (approved/antineoplastic), and is it in a druggable-genome category?"
    entity_grains: [target]
    cards: [known-drug-tractability]
    providers:
      - {kind: dataset, source: dgidb-drug-gene-per-gene-v1, evidence_tier: measured}

  measured_potency_tractability:
    # MEASURED-POTENCY leg of small-molecule tractability (T3.1, 2026-08-09): is there a POTENT
    # (<=1 uM) measured ligand + how deep is the chemotype series? From ChEMBL pchembl + BindingDB
    # affinity (previously-inert products). DISTINCT from the known-drug leg (DGIdb = presence, not
    # potency) + the structure leg (predicted pocket) + PRISM (retrospective cell-line killing).
    # Feeds the SM verdict via the E-measured-potency intracellular rule.
    modality_relevance: [small_molecule]
    claim: "Is there a potent (<=1 uM) measured small-molecule ligand for target, and how deep is the chemotype series?"
    entity_grains: [target]
    cards: [measured-potency-tractability]
    # tier_dominant: ChEMBL is the richer, dominant measured-potency source (broader coverage + clinical
    # phase); BindingDB corroborates + rescues. The reader takes MAX potency across the two (either can
    # supply a potent series) — NOT an average / arbitrary pick-one — with ChEMBL as the primary tier.
    multi_provider_policy: tier_dominant
    providers:
      - {kind: dataset, source: chembl-bioactivity-per-protein-v1, evidence_tier: measured}   # dominant (broader + clinical phase)
      - {kind: dataset, source: bindingdb-affinity-per-protein-v1, evidence_tier: measured}   # corroborating / rescue

  structure_druggability:
    # P4 Tier-3 (2026-07-24): ENFORCE — every card of this type must declare modality_relevance
    # (validate_cards MODALITY_RELEVANCE_MISSING errors otherwise). Routing metadata only.
    modality_relevance: [small_molecule, degrader]
    claim: "Are target's known hotspots in druggable pockets, and how confident is the structural context?"
    entity_grains: [target]
    cards: [structure-features-static]
    providers:
      - {kind: dataset, source: pdb-alphafold-structure-features-per-uniprot-v1, evidence_tier: inferred}

  surface_topology:
    # P4 Tier-3 (2026-07-24): ENFORCE — every card of this type must declare modality_relevance
    # (validate_cards MODALITY_RELEVANCE_MISSING errors otherwise). Routing metadata only.
    modality_relevance: [adc, bite_tce, antibody]
    claim: "What is target's predicted membrane topology + PTM / endocytosis-motif profile?"
    entity_grains: [target]
    cards: [surface-topology-and-ptm]
    providers:
      - {kind: dataset, source: topology-predictions-tmbed-v1, evidence_tier: inferred}

  surfaceome_family:
    # P4 Tier-3 (2026-07-24): ENFORCE — every card of this type must declare modality_relevance
    # (validate_cards MODALITY_RELEVANCE_MISSING errors otherwise). Routing metadata only.
    modality_relevance: [adc, bite_tce, antibody]
    claim: "Is target a surface protein and which family does it belong to (for modality-fit)?"
    entity_grains: [target]
    cards: [surfaceome-family-classification]
    providers:
      - {kind: dataset, source: surfaceome-family-classification-per-uniprot-v1, evidence_tier: inferred}   # SURFY + HPA + UniProt-EC + IUPHAR

  # --- the CSPA orphan case (design doc worked example) — 3 providers, tier-dominant ---
  surface_confirmation:
    claim: "Is the target protein detected/accessible on the extracellular cell surface?"
    entity_grains: [target]   # residency is a target property; the card's question is indication-framed but the claim is not
    modality_relevance: [adc, bite_tce, antibody]   # ROUTING metadata only — NOT modality-specific values
    multi_provider_policy: tier_dominant            # measured HPA/CSPA beats inferred SURFY (Rule 5)
    cards: [protein-surface-evidence]
    providers:
      - {kind: dataset, source: hpa-subcellular-location-per-gene-v1, evidence_tier: measured}   # HPA immunofluorescence plasma-membrane residency (2026-08-07); replaces the never-built hpa-protein-ihc placeholder. Orthogonal (microscopy) 2nd measured provider; composed as corroboration in cspa_surface_confirmation (surface_multimodal_support).
      - {kind: dataset, source: cspa-bausch-fluck-2015,   evidence_tier: measured}   # CSPA orphan resolved: registers here per Rule 2 / the doc's worked example
      - {kind: dataset, source: surfaceome-family-surfy-prediction, evidence_tier: inferred}   # SURFY prediction — second, lower-tier provider

  normal_tissue_rna_breadth:
    claim: "In how many adult tissues is target RNA-expressed (target-selection therapeutic-window count)?"
    # Distinct from normal_tissue_protein_breadth: RNA-breadth for selection vs protein-IHC for
    # safety — different layer AND different gate (Rule 1 discriminators (a) and (b) both fire).
    entity_grains: [target]
    cards: [lineage-restriction-evidence, normal-tissue-liability-gtex]
    # TWO providers, one breadth question: the dormant HPA card + the LANDED GTEx per-sample atlas
    # (Q3, recount3 — same axis as the tumor TPM, so tumor-to-normal ratios are directly comparable).
    # tier_dominant: GTEx (landed + comparable) is the dominant provider; HPA a future adjunct once
    # its product lands. NOT surface_discordance — these aren't independent measurements to reconcile;
    # GTEx is the primary read and HPA corroborates when available.
    multi_provider_policy: tier_dominant
    providers:
      - {kind: dataset, source: gtex-tpm-recount3-long-v1, evidence_tier: measured}          # LANDED (Q3, dominant)
      - {kind: dataset, source: hpa-normal-tissue-expression, evidence_tier: measured}   # product not yet landed; card dormant-by-design (applies_when)

  tumor_vs_normal_percentile_crossing:
    claim: "What fraction of an indication's tumors express target above the Nth percentile of matched normal (per-sample selectivity)?"
    # Q2 of the expression spec. Rule 1 discriminator: SELECTIVITY (Gate B), like tumor_vs_normal_selectivity,
    # but the PER-SAMPLE percentile-crossing on directly-comparable recount3 matrices — NOT the aggregate
    # log2FC (dge-deseq2) and NOT presence (tumor_expression_distribution, Gate A). The headline enrichment
    # metric of the therapeutic-window framing; cross-cuts to ADC/surface-antigen selectivity.
    entity_grains: [target_indication]
    cards: [tumor-vs-normal-percentile-crossing]
    # tier_dominant (mirrors Q1 tumor_expression_distribution): TCGA is the dominant provider (the
    # tumor arm — the fraction-above metric is a property of the tumor population); GTEx is auxiliary,
    # supplying ONLY the matched-normal percentile cutoff. Not surface_discordance — GTEx isn't a
    # competing view of the same quantity, it's the normal reference the crossing is measured against.
    multi_provider_policy: tier_dominant
    providers:
      - {kind: dataset, source: tcga-tumor-tpm-recount3-long-v1, evidence_tier: measured}          # tumor arm (dominant)
      - {kind: dataset, source: gtex-tpm-recount3-long-v1, evidence_tier: measured}   # matched-normal percentile cutoff (auxiliary)

  patient_model_correspondence:
    claim: "Which cell-line models represent an indication's tumors for target (expression-matched), and which are the positive/resistance/negative screen models?"
    # Q4 of the expression spec — the P3 patient↔model join, EXPRESSION-SIMILARITY slice (P3-Option-B):
    # ranks DepMap models by TARGET-expression fit to the patient tumor TARGET distribution + screen
    # role from Chronos. NOT the genomic same-functional-event join (that is the sibling
    # genomic_event_model_match / M11, now built on functional_gene_state) and NOT full-transcriptome
    # Celligner — this is the EXPRESSION-similarity axis. Routes: Patient-pop (Q10)
    # primary + corroborates Required (C, model-backed dependency). tier_dominant: TCGA patient TPM is
    # the reference distribution (dominant); DepMap supplies the model panel matched against it.
    entity_grains: [target_indication]
    cards: [recommended-models]
    multi_provider_policy: tier_dominant
    providers:
      - {kind: dataset, source: tcga-tumor-tpm-recount3-long-v1, evidence_tier: measured}   # patient reference distribution (dominant)
      - {kind: dataset, source: depmap-consortium-26q1, evidence_tier: measured}            # model TPM + Chronos + lineage

  rna_protein_concordance:
    # P4 Tier-3 (2026-07-24): ENFORCE — every card of this type must declare modality_relevance
    # (validate_cards MODALITY_RELEVANCE_MISSING errors otherwise). Routing metadata only.
    # GRAIN-SPLIT ROUTING (2026-08-05): this type spans TWO grains that route to DIFFERENT
    # modality-fit gates, so the routing set is their UNION. Cell-line arm (target grain) →
    # small_molecule/degrader (is RNA an adequate SM biomarker?). Tumor arm (target_indication
    # grain) → adc/bite_tce/antibody (is the protein ANTIGEN actually present, or must it be
    # confirmed for a biologic?) — surface-intrinsic.rules.yaml consumes exactly this signal.
    # A per-card modality_relevance is a subset of this union; validate_cards' subset check then
    # passes for BOTH sibling cards. (Before this, the tumor card's [adc,bite_tce,antibody] read
    # as MODALITY_RELEVANCE_DRIFT against an SM-only routing set — a false drift; the card was
    # right, the vocab was under-specified. modality_relevance is really per (type × grain).)
    modality_relevance: [small_molecule, degrader, adc, bite_tce, antibody]
    claim: "Does target RNA predict its protein (is RNA an adequate proxy, or must protein be measured directly)?"
    # Q5 of the expression spec. The rna_as_biomarker question — RNA vs protein correlation. TWO grains,
    # TWO cards (grain-split): cellline-rna-protein-concordance (target grain, CELL-LINE: DepMap RNA vs Gygi MS)
    # + rna-protein-concordance-tumor (target_indication grain, TUMOR: CPTAC matched RNA vs protein per
    # cohort). Reported SIDE-BY-SIDE, never averaged — their disagreement (KRAS cell-line r≈0.55 vs COAD
    # tumor r≈0.01) is the signal. Routes: Presence (A) + ADC/biologic modality lens (RNA-inadequate →
    # protein must be confirmed) + dependency M5. tier_dominant: RNA is the anchored layer; protein is
    # the comparator. NOTE: providers list = the CELL-LINE arm's substrates (tier_dominant needs a
    # single dominant provider per the validator); the tumor arm's substrate is the matched CPTAC product.
    entity_grains: [target, target_indication]
    cards: [cellline-rna-protein-concordance, rna-protein-concordance-tumor]
    multi_provider_policy: tier_dominant
    providers:
      - {kind: dataset, source: depmap-consortium-26q1, evidence_tier: measured}              # RNA (anchor, cell-line)
      - {kind: dataset, source: depmap-consortium-26q1-proteomics, evidence_tier: measured}   # protein comparator (cell-line)
      - {kind: dataset, source: cptac-rna-protein-matched-per-sample-v1, evidence_tier: measured}  # tumor arm (matched RNA+protein)

  normal_tissue_protein_breadth:
    # P4 Tier-3 (2026-07-24): ENFORCE — every card of this type must declare modality_relevance
    # (validate_cards MODALITY_RELEVANCE_MISSING errors otherwise). Routing metadata only.
    modality_relevance: [adc, bite_tce, antibody]
    claim: "How broad is target's normal-tissue protein-IHC footprint, and does it hit essential tissue (safety)?"
    entity_grains: [target]
    cards: [normal-tissue-liability]
    providers:
      - {kind: dataset, source: hpa-v25-1, evidence_tier: measured}

  gnomad_lof_constraint:
    # P4 Tier-3 (2026-07-24): ENFORCE — every card of this type must declare modality_relevance
    # (validate_cards MODALITY_RELEVANCE_MISSING errors otherwise). Routing metadata only.
    modality_relevance: [small_molecule, degrader]
    claim: "How constrained is target against germline LoF in the gnomAD population (safety)?"
    entity_grains: [target]
    cards: [gnomad-lof-constraint]
    providers:
      - {kind: dataset, source: gnomad-constraint-snapshot-2026-07-02, evidence_tier: measured}

  human_genetic_safety:
    # P5 Slice 2 (2026-07-24) — population rare-variant BURDEN LoF-tolerance (Open Targets 26.06
    # evidence_gene_burden). The highest-weight human-genetics safety leg: does losing this gene's
    # function harm (risk) or protect at population scale? MEASURED tier (real human genetics). Its
    # verdict-moving warning fires on the SM/degrader (full-KO) axis via safety.resolver.yaml (Slice
    # 5), NOT a modality-fit gate — so NO modality_relevance key (safety is axis-1). Composes with the
    # mutant-selective mechanism-conditioning downgrade (WT-loss ≠ mutant-selective-tx risk).
    claim: "Does population rare-variant burden show loss of target function is harmful (WT-loss safety signal) or protective?"
    entity_grains: [target]
    cards: [gene-burden-safety]
    providers:
      - {kind: dataset, source: opentargets-26-06, evidence_tier: measured}

  dosage_sensitivity_safety:
    # P5 Slice 3 (2026-07-24) — ClinGen dosage sensitivity (Open Targets 26.06 evidence_clingen).
    # Is single-copy loss pathogenic (autosomal-dominant / haploinsufficiency = highest degrader/full-
    # inhibition concern) or does disease need both copies (recessive)? MEASURED (curated genetics).
    # Verdict-moving warning fires on the SM/degrader axis via safety.resolver.yaml (Slice 5); NO
    # modality_relevance (safety is axis-1). Composes with the mutant-selective downgrade.
    claim: "Is single-copy loss of target pathogenic (ClinGen autosomal-dominant / haploinsufficiency safety)?"
    entity_grains: [target]
    cards: [clingen-dosage]
    providers:
      - {kind: dataset, source: opentargets-26-06, evidence_tier: measured}

  clinvar_germline_pathogenicity_safety:
    # P5 follow-on (2026-07-24) — ClinVar curated germline variant pathogenicity (OT 26.06 evidence_eva).
    # A 4th corroborating germline safety leg. Fires the same human_genetics_safety_concern hold as
    # gene_burden/clingen/mouse (resolver when_any_fired). MEASURED (curated variant pathogenicity).
    # SOMATIC pathogenic entries are guardrailed OUT (cancer-driver axis, not germline safety). NO
    # modality_relevance (safety axis-1). Composes with the mutant-selective downgrade.
    claim: "Does target carry curated GERMLINE pathogenic ClinVar variants (heritable-disease WT-loss safety signal)?"
    entity_grains: [target]
    cards: [clinvar-pathogenicity-safety]
    providers:
      - {kind: dataset, source: opentargets-26-06, evidence_tier: measured}

  mouse_ko_phenotype_safety:
    # P5 Slice 4 (2026-07-24) — mouse-KO normal-physiology safety (Open Targets 26.06 mouse_phenotype,
    # MGI). Adult/postnatal lethality = adult-essentiality safety signal; developmental (embryonic/
    # preweaning) lethality = a CAVEAT, not a hold (the developmental guardrail). INFERRED tier —
    # mouse is a MODEL, so it never fires a measured killer. Verdict-moving warning (lethal_ko) fires
    # on the SM/degrader axis via safety.resolver.yaml (Slice 5); NO modality_relevance (safety axis-1).
    claim: "Does mouse ADULT knockout cause lethality or severe organ dysfunction (normal-physiology safety, developmental-guardrailed)?"
    entity_grains: [target]
    cards: [mouse-ko-phenotype]
    providers:
      - {kind: dataset, source: opentargets-26-06, evidence_tier: inferred}

  pathway_stratified_surface:
    # E4-A3 (2026-08-07): is a surface antigen differentially expressed in a tumor-STATE subset
    # (e.g. hypoxia-HIGH tertile) — a biologics handle on that tumor compartment (the CA9 hypoxia-ADC
    # archetype)? Sibling of mutation_stratified_surface (mutation-conditioned); this is PATHWAY/STATE-
    # conditioned (MSigDB HALLMARK signature tertile). Rule 1 concordance test: distinct claim from
    # tumor_expression_distribution + from mutation_stratified_surface (different conditioning axis),
    # shown alongside, not interchangeable -> new type. v1 = HALLMARK_HYPOXIA x NSCLC (follow-on: pan-signature).
    modality_relevance: [adc, bite_tce, antibody]
    claim: "Is a surface antigen elevated in a pathway/stress-HIGH tumor subset (a biologics handle on that tumor compartment)?"
    entity_grains: [target_indication]   # the stratification is per (signature, indication) cohort
    cards: [pathway-stratified-surface]
    providers:
      - {kind: dataset, source: pathway-stratified-surface-window-v1, evidence_tier: measured}

  mutation_stratified_surface:
    # E4-A2 (2026-08-07): is a surface antigen differentially expressed in a DRIVER's MUTANT tumor
    # subset vs WT — a biologics handle on the driver-mutant patient subset the gene-level-averaged
    # tumor-vs-normal window dilutes away? Rule 1 concordance test: a DISTINCT claim from
    # tumor_expression_distribution (that's the whole-cohort distribution; this is mutation-CONDITIONED)
    # and from tumor_vs_normal_selectivity (tumor-vs-normal, not mutant-vs-WT). Shown alongside, not
    # interchangeable -> new type. modality_relevance surface (an elevated surface antigen is a
    # biologics presence signal). v1 covers the KRAS x NSCLC archetype (pan-driver = follow-on).
    modality_relevance: [adc, bite_tce, antibody]
    claim: "Is a surface antigen elevated in a driver's MUTANT tumor subset vs WT (a biologics handle on the driver-mutant patient subset)?"
    entity_grains: [target_indication]   # the stratification is per (driver, indication) cohort
    cards: [mutation-stratified-surface]
    providers:
      - {kind: dataset, source: mutation-stratified-surface-window-v1, evidence_tier: measured}

  shed_ectodomain_liability:
    # P4 Tier-3 (2026-07-24): ENFORCE — every card of this type must declare modality_relevance
    # (validate_cards MODALITY_RELEVANCE_MISSING errors otherwise). Routing metadata only.
    modality_relevance: [adc, bite_tce, antibody]
    claim: "Is target's ectodomain shed as a soluble circulating decoy (antigen-sink liability for biologics)?"
    entity_grains: [target]
    cards: [shed-ectodomain-liability]
    multi_provider_policy: tier_dominant
    providers:
      - {kind: dataset, source: hpa-v25-1,                  evidence_tier: measured}
      - {kind: dataset, source: uniprot-sprot-human-2026-02, evidence_tier: inferred}
      - {kind: dataset, source: shed_antigen_targets-curated, evidence_tier: inferred}   # vocabularies/shed_antigen_targets.yaml

  clinical_precedent:
    claim: "What is the clinical precedent (stage / approved agents / failures / resistance) for target?"
    entity_grains: [target_indication]
    cards: [clinical-precedent]
    providers:
      - {kind: dataset, source: literature-snapshot, evidence_tier: inferred}   # iter-1b literature-mining surface (placeholder-ish)

  rwd_stratified_expression:
    claim: "How does target expression vary across treatment-line / RAS strata in real-world data?"
    entity_grains: [target_subtype]   # eligible-but-blocked (pre-aggregated RWD; per-sample reader not landed)
    cards: [rwd-stratified-expression]
    providers:
      - {kind: dataset, source: tempus-rwd-stratified-expression, evidence_tier: measured}   # Tempus stub; product not landed

  # ==========================================================================
  # DERIVED types — the CLAIM is a comparison of other types (Rule 4, type→type edge).
  # The comparison itself is the scientific object; agnostic to how many datasets back it.
  # ==========================================================================

  crispr_rnai_concordance:
    claim: "Do the two orthogonal LOF assays agree that target is required?"
    entity_grains: [target]
    cards: [crispr-rnai-dependency-concordance]
    providers:
      - {kind: derived_from, inputs: [crispr_lof_dependency, rnai_lof_dependency], method: concordance, evidence_tier: measured}

  target_safety_prioritisation:
    # P5 Slice 1 (2026-07-24) — Open Targets 26.06 engineered target-prioritisation scores as
    # safety-ORIENTING CONTEXT. Verdict-inert (no resolver reference, no warning); NOT modality-
    # relevant (safety is axis-1, not a modality-fit gate — so NO modality_relevance key, which
    # would otherwise trip the P4 Tier-3 enforcement for a card that has no modality-axis rule).
    # The authoritative per-fact safety reads are the dedicated cards (gnomad_lof_constraint, and
    # the P5 verdict-moving human_genetic_safety / dosage_sensitivity_safety / mouse_ko_phenotype_
    # safety types in Slices 2-4). This type is the OT prioritisation orientation layer.
    claim: "How does Open Targets prioritise target on its engineered safety-relevant scores (safety-event, genetic constraint, mouse-KO), as orienting context?"
    entity_grains: [target]
    cards: [target-safety-prioritisation]
    providers:
      # inferred, not measured: OT prioritisation scores are engineered/derived from underlying
      # data (constraint, KO, expression), not a direct measurement of a single fact.
      - {kind: dataset, source: opentargets-26-06, evidence_tier: inferred}

  genomic_event_model_match:
    claim: "Which DepMap models carry the SAME functional genomic event (biallelic/monoallelic state) as the indication's tumors for target, and which of those genotype-matched models are dependent (positive screen lines)?"
    # M11 — the CANONICAL P3 patient↔model join, on GENOMIC EVENT (functional_gene_state), unblocked by
    # M6. The genomic sibling of patient_model_correspondence (expression-Q4, which matches by TARGET
    # EXPRESSION). Same P3 question, orthogonal axis: a model can be expression-matched yet GENOTYPE-
    # mismatched (highly expressing but WILD-TYPE where the tumor is biallelically inactivated → a poor
    # model for a LoF-driven dependency). Derived (Rule 4 type→type edge): joins the patient + model
    # functional_gene_state distributions with crispr_lof_dependency (Chronos screen role). Routes:
    # Patient↔model correspondence (P3) + corroborates Required (C, genotype-matched model-backed
    # dependency). ZERO new ingestion — reuses M6 both arms + the expression-Q4 Chronos/lineage loader.
    entity_grains: [target_indication]
    cards: [genomic-event-model-match]
    providers:
      - {kind: derived_from, inputs: [functional_gene_state, crispr_lof_dependency], method: genotype_match_screen_role, evidence_tier: measured}

  expression_dependency_correlation:
    claim: "Does target's mRNA expression correlate with its own dependency (expression-as-biomarker)?"
    # Comparison-is-the-claim → derived (appendix case 7 logic), even though single-dataset-sourced
    # and the card does not self-declare derived_from.
    entity_grains: [target, target_lineage]
    cards: [expression-dependency-correlation]
    providers:
      - {kind: derived_from, inputs: [cell_line_rna_expression, crispr_lof_dependency], method: correlation, evidence_tier: measured}

  abundance_dependency_correlation:
    claim: "Does target's PROTEIN abundance correlate with its own dependency (protein-as-biomarker-of-dependency)?"
    # Q7 PROTEIN arm — the sibling of expression_dependency_correlation (RNA arm). Same comparison-is-
    # the-claim derived shape, on Gygi-MS protein instead of mRNA. Reported ALONGSIDE the RNA arm; the
    # DISAGREEMENT (protein→dep strong while RNA→dep weak, or vice versa) picks preferred_assay in the
    # biomarker facet. Routes: Required (C, abundance→dependency chain) + biomarker synthesis.
    entity_grains: [target, target_lineage]
    cards: [abundance-dependency]
    providers:
      - {kind: derived_from, inputs: [cell_line_protein_abundance, crispr_lof_dependency], method: correlation, evidence_tier: measured}

  expression_purity_confound:
    # P4 Tier-3 (2026-07-24): ENFORCE — every card of this type must declare modality_relevance
    # (validate_cards MODALITY_RELEVANCE_MISSING errors otherwise). Routing metadata only.
    modality_relevance: [small_molecule, degrader, adc, bite_tce, antibody]
    claim: "Is target's tumor expression tumor-cell-intrinsic or driven by microenvironment (purity confound)?"
    # Q9 — correlate per-sample tumor expression vs tumor PURITY (ABSOLUTE). POSITIVE → tumor-intrinsic;
    # NEGATIVE → stromal/immune-derived confound. A derived comparison (expression × purity). Routes:
    # Presence (A) — a purity-confound caveat on the tumor presence call; ALSO (P4, deferred) the
    # ADC/TCE surface-modality gate (is the antigen tumor-intrinsic vs microenvironmental?). Biology-
    # axis Presence facet wired now; the modality-gate facet is deferred to P4.
    entity_grains: [target_indication]
    cards: [expression-purity-confound]
    providers:
      - {kind: derived_from, inputs: [tumor_expression_distribution, tumor_purity_absolute], method: correlation, evidence_tier: measured}

  tumor_purity_absolute:
    claim: "What is a tumor sample's ABSOLUTE-estimated tumor purity (the microenvironment-dilution denominator)?"
    # A per-sample tumor property (not a per-target claim in itself) — registered because it is a
    # derived_from INPUT to expression_purity_confound (Q9) and is the same ABSOLUTE substrate M6
    # (functional_gene_state patient arm) already consumes. No standalone card: it is an input-only
    # type (a sample covariate), surfaced through the cards that correlate against it.
    entity_grains: [target_indication]   # carried per (target, indication) query, though purity is sample-level
    cards: []
    providers:
      - {kind: dataset, source: gdc-pancanatlas-cnv-2018, evidence_tier: measured}   # ABSOLUTE abs_tables purity

  patient_survival_cdr:
    claim: "What is a patient's curated survival outcome (OS/PFI/DSS/DFI + time) from the TCGA-CDR?"
    # A per-patient clinical outcome (not a per-target claim in itself) — an INPUT-ONLY type
    # (cards: []) registered because it is a derived_from INPUT to expression_clinical_association
    # (Q11). Curated Liu 2018 endpoints; joined on bcr_patient_barcode. Surfaced through the cards
    # that associate against it, never standalone.
    entity_grains: [target_indication]   # carried per (target, indication) query, though survival is patient-level
    cards: []
    providers:
      - {kind: dataset, source: gdc-pancanatlas-clinical-2018, evidence_tier: measured}   # TCGA-CDR (Liu 2018)

  expression_clinical_association:
    claim: "Does target expression stratify patient survival in the indication (prognostic association)?"
    # Q11 — median-split OS log-rank by target expression. A derived comparison (expression × survival).
    # HYPOTHESIS-GENERATING (univariate/unadjusted), NOT a clinical claim. Routes: Patient-population /
    # clinical context + biomarker facet (prognostic stratification). Biology axis; no modality facet.
    entity_grains: [target_indication]
    cards: [expression-clinical-association]
    providers:
      - {kind: derived_from, inputs: [tumor_expression_distribution, patient_survival_cdr], method: median_split_logrank, evidence_tier: measured}

  mutation_stratified_dependency:
    # P4 Tier-3 (2026-07-24): ENFORCE — every card of this type must declare modality_relevance
    # (validate_cards MODALITY_RELEVANCE_MISSING errors otherwise). Routing metadata only.
    modality_relevance: [small_molecule, degrader]
    claim: "Is target dependency stratified by target's own mutation status (oncogene-addiction biomarker)?"
    entity_grains: [target]
    cards: [mutation-stratified-dependency]
    providers:
      - {kind: derived_from, inputs: [mutation_status, crispr_lof_dependency], method: stratified_effect, evidence_tier: measured}

  mutation_drug_response:
    # PHARMACOLOGICAL sibling of mutation_stratified_dependency: genotype × PRISM DRUG response
    # (Log2AUC), not CRISPR-KO dependency. Verdict-inert facet (v1). Thread 4, 2026-08-09.
    modality_relevance: [small_molecule]
    claim: "Are cell lines carrying an alteration in target more SENSITIVE to a drug that targets it (PRISM Log2AUC)?"
    entity_grains: [target]
    cards: [mutation-drug-response]
    providers:
      - {kind: derived_from, inputs: [mutation_status, prism_compound_activity], method: stratified_effect, evidence_tier: measured}

  cn_stratified_dependency:
    # A1a (2026-08-06): the copy-number analog of mutation_stratified_dependency — is dependency
    # stratified by the target's own AMPLIFICATION status (amplification-addiction biomarker)?
    # Same stratified_effect method (reuses the Mann-Whitney contrast); copy_number_alteration is
    # the per-line relative-CN input. Closes the amplification-driven-oncogene gap (ERBB2/MYC).
    modality_relevance: [small_molecule, degrader]
    claim: "Is target dependency stratified by target's own copy-number amplification status (amplification-addiction biomarker)?"
    entity_grains: [target]
    cards: [copy-number-stratified-dependency]
    providers:
      - {kind: derived_from, inputs: [copy_number_alteration, crispr_lof_dependency], method: stratified_effect, evidence_tier: measured}

  fusion_stratified_dependency:
    # A1-fusion (2026-08-06): the gene-fusion analog of mutation_stratified_dependency /
    # cn_stratified_dependency — is dependency stratified by whether the line carries a fusion
    # INVOLVING the target (fusion-addiction biomarker)? Same stratified_effect method (reuses the
    # Mann-Whitney contrast); fusion_status is the per-line fusion-involvement boolean input. Closes
    # the fusion-driven-oncogene gap (EWSR1-FLI1, BCR-ABL1) that mutation + CN both miss.
    modality_relevance: [small_molecule, degrader]
    claim: "Is target dependency stratified by whether the line carries a fusion involving the target (fusion-addiction biomarker)?"
    entity_grains: [target]
    cards: [fusion-stratified-dependency]
    providers:
      - {kind: derived_from, inputs: [fusion_status, crispr_lof_dependency], method: stratified_effect, evidence_tier: measured}

  partner_conditional_dependency:
    # Track PC (2026-08-09): the PARTNER-feature analog of the mutation/cn/fusion stratified family —
    # is dependency stratified by a PARTNER gene's DEFICIENCY status (synthetic-lethality biomarker)?
    # NOT an own-alteration addiction: the stratifier is a DIFFERENT gene's loss (WRN×MSI, PARP1×HRD,
    # SMARCA2×SMARCA4) — the partner_conditional_sl family the pooled dependency scalar structurally
    # misses. Same stratified_effect method (reuses the Mann-Whitney contrast); the input is the
    # PARTNER's deficiency boolean (MSI signature OR partner LoF), NOT the target's own alteration.
    # ANCHOR: WRN×MSI (live 26q1: delta -0.41, p 8.8e-12, moderately_dependent). Distinct verdict
    # (partner_conditional_dependent) — never conflated with biomarker_stratified_dependency, since
    # partner-SL != own-oncogene addiction (mirrors the drug_response_biomarker separation).
    modality_relevance: [small_molecule, degrader]
    claim: "Is target dependency stratified by a partner gene's deficiency status (synthetic-lethality biomarker)?"
    entity_grains: [target]
    cards: [partner-conditional-dependency]
    providers:
      - {kind: derived_from, inputs: [partner_deficiency_status, crispr_lof_dependency], method: stratified_effect, evidence_tier: measured}

  amp_expr_stratified_dependency:
    # A1 amp→expr→dep (2026-08-06): the CONJOINT sibling of cn_stratified_dependency — is dependency
    # stratified by whether the line is BOTH amplified AND high-expression for the target (amplification-
    # DRIVEN overexpression-addiction, ERBB2/MYC/KRAS-amp)? The three-way amp→overexpression→dependency
    # signature the CN-only path (expression-blind) under-weights and the expression-dependency facet
    # (CN-blind) can't establish. Same stratified_effect method (single conjoint-boolean Mann-Whitney);
    # adds cell_line_rna_expression (the overexpression term) to the CN×Chronos join.
    modality_relevance: [small_molecule, degrader]
    claim: "Is target dependency stratified by whether the line is both amplified and high-expression for the target (amplification-driven overexpression-addiction)?"
    entity_grains: [target]
    cards: [amp-expr-stratified-dependency]
    providers:
      - {kind: derived_from, inputs: [copy_number_alteration, cell_line_rna_expression, crispr_lof_dependency], method: stratified_effect, evidence_tier: measured}

  chemical_genetic_concordance:
    # P4 Tier-3 (2026-07-24): ENFORCE — every card of this type must declare modality_relevance
    # (validate_cards MODALITY_RELEVANCE_MISSING errors otherwise). Routing metadata only.
    modality_relevance: [small_molecule, degrader]
    claim: "Does compound kill-pattern track CRISPR + RNAi dependency (on-target engagement)?"
    entity_grains: [target]
    cards: [prism-crispr-concordance]
    providers:
      - {kind: derived_from, inputs: [prism_compound_activity, crispr_lof_dependency, rnai_lof_dependency], method: concordance, evidence_tier: measured}

  surface_density:
    # P4 Tier-3 (2026-07-24): ENFORCE — every card of this type must declare modality_relevance
    # (validate_cards MODALITY_RELEVANCE_MISSING errors otherwise). Routing metadata only.
    modality_relevance: [adc, bite_tce]
    claim: "What is estimated surface copies-per-cell, and is it above the TCE-viability threshold?"
    entity_grains: [target_indication]
    cards: [surface-abundance-density]
    providers:
      - {kind: derived_from, inputs: [tumor_protein_abundance, surfaceome_family, surface_topology], method: density_estimate, evidence_tier: estimated}

  modality_window:
    # biologics-augment (2026-08-06): the clean-antigen THERAPEUTIC-WINDOW ratio — tumor / max-essential-
    # normal, thresholded per modality tier. DISTINCT from surface_density (copies/cell) and from
    # tumor_vs_normal_selectivity (within-tissue-of-origin contrast): the fused tumor/essential-normal
    # ratio surfaces the CEACAM5 paradox (huge window yet strict-TCE liability) neither answers.
    modality_relevance: [adc, bite_tce, antibody]
    claim: "Is tumor expression high enough relative to the worst essential normal organ to open a therapeutic window at this modality tier?"
    entity_grains: [target_indication]
    cards: [modality-therapeutic-window]
    providers:
      - {kind: dataset, source: tcga-gtex-tpm-tissue-quantiles-v1, method: modality_therapeutic_window, evidence_tier: measured}

  exon_window:
    # enrichment E5 (2026-08-07): the EXON-resolution companion of modality_window. Scores a per-gene
    # tumor-vs-essential-normal window at exon grain + within-gene exon HETEROGENEITY. HONEST SCOPE
    # (live-smoke-calibrated): a HYPOTHESIS-GENERATING flag, NOT an isoform-identity call — per-exon
    # COVERAGE quantiles are blind to transcript membership, so it cannot resolve CLDN18.2 from CLDN18.1.
    # Reads tcga-gtex-exon-tpm-quantiles-v1 (surfaceome-scoped). Scores exon INCLUSION not SKIPPING.
    modality_relevance: [adc, bite_tce, antibody]
    claim: "Does the target's tumor-dominant exon show within-gene heterogeneity + a clean window suggesting an isoform-resolved epitope worth junction-level follow-up?"
    entity_grains: [target_indication]
    cards: [modality-exon-window]
    providers:
      - {kind: dataset, source: tcga-gtex-exon-tpm-quantiles-v1, method: exon_window, evidence_tier: measured}

  cd_antigen_backbone:
    # enrichment E6-CD (2026-08-07): is the target on the CD / immuno-oncology antigen BACKBONE — the
    # antigen class that has DELIVERED approved biologics (CD19/CD20/CD22/CD38/BCMA-class mAb/TCE/CAR-T)?
    # A CLASS-level clinical-PRECEDENT prior, orthogonal to the PREDICTED-biology axes (topology/density/
    # window). Reads hgnc-gene-group-471 (394 canonical CD antigens, CC0). tier:target (protein property).
    # Supportive-only: not_cd_antigen is NOT a negative (most solid-tumor ADC/TCE antigens aren't CD).
    modality_relevance: [adc, bite_tce, antibody]
    claim: "Is the target a canonical CD / immuno-oncology antigen with established mAb/TCE/CAR-T clinical precedent?"
    entity_grains: [target]
    cards: [cd-antigen-backbone]
    providers:
      - {kind: dataset, source: hgnc-gene-group-471-cd-molecules-snapshot-2026-07-08, method: cd_antigen_backbone, evidence_tier: measured}

  immune_context:
    # biologics-augment effector arm (2026-08-06): tumor T-cell infiltration (immune-hot vs cold) from
    # CIBERSORT LM22 per-sample leukocyte composition. The EFFECTOR half of the TCE story — orthogonal
    # to surface-antigen presence (a T-cell engager needs BOTH a target AND T cells to redirect). v1 is
    # per-indication / target-independent; antigen-conditioned join is a deferred v2 facet.
    modality_relevance: [bite_tce]
    claim: "Is the tumor immune-hot or immune-cold — is there a CD8 T-cell effector population for a T-cell engager to redirect?"
    entity_grains: [target_indication]
    cards: [immune-context]
    providers:
      - {kind: dataset, source: gdc-pancanatlas-immune-2018, method: immune_context, evidence_tier: measured}

  pmhc_presentation:
    # biologics enrichment E1 (2026-08-07): peptide-centric HLA presentation — reaches intracellular
    # targets via the peptide-MHC complex (TCR-mimetic TCE), an axis surface_confirmation/topology can't
    # see. Benign-atlas breadth = the normal-presentation SAFETY denominator (broad = liability).
    modality_relevance: [bite_tce]
    claim: "Are the target's peptides presented on HLA, and how broadly across normal tissue (clean pMHC-TCE target vs broad presentation liability)?"
    entity_grains: [target]
    cards: [pmhc-presentation]
    providers:
      - {kind: dataset, source: hla-ligand-atlas-presentation-per-protein-v1, method: pmhc_presentation, evidence_tier: measured}

  adc_tce_modality_fit:
    claim: "Which biologic modalities (ADC / TCE / both / neither) are viable candidates for target?"
    entity_grains: [target]
    cards: [adc-tce-modality-fit]
    providers:
      - {kind: derived_from, inputs: [surface_topology, surfaceome_family, structure_druggability], method: modality_fit, evidence_tier: inferred}

  tumor_elevation_breadth:
    claim: "In how many cancer indications is target ELEVATED in tumor vs normal, at the protein (CPTAC) and/or RNA (pan-cancer DESeq2) layer (pan-cancer breadth)?"
    # target-grain roll-up OVER INDICATIONS for ONE target — "elevated in K of N cancers". ALLOWED:
    # breadth over indications for a single target is a per-target claim (precedent:
    # normal_tissue_rna_breadth / normal_tissue_protein_breadth). It is NOT a ranking OVER TARGETS
    # (the surfaceome-cohort-ranking non-goal below) — the roll-up axis is indications, not other
    # genes. DISTINCT from the per-indication tumor_vs_adjacent contrast: breadth ≠ selectivity in
    # THIS cancer; it is "how many cancers at all". Derived because the claim is a roll-up (K-of-N
    # count) over an underlying per-indication type — the count is the scientific object (Rule 4).
    #
    # TWO INDEPENDENT breadth inputs (Slice C landed the RNA half):
    #   - tumor_protein_abundance: CPTAC per-cohort protein tumor-vs-normal (10 cohorts). Slice B.
    #   - tumor_vs_normal_selectivity: the pan-cancer stacked RNA DESeq2 product
    #     (pancan-dge-tumor-vs-normal-v1, 27 indications). Slice C. The RNA "elevated" predicate is
    #     VINTAGE-STABLE (dominant_direction + cells_supporting + magnitude; NEVER cell B — see the
    #     data-catalog manifest's cell_b_semantics note). RNA (27 inds) + protein (10 cohorts) are
    #     DIFFERENT-layer corroborating breadth counts, reported ALONGSIDE, never averaged into one
    #     number (the two-provider surface_discordance discipline applies at the card layer).
    entity_grains: [target]
    cards: [tumor-elevation-breadth]
    multi_provider_policy: surface_discordance   # RNA vs protein breadth are DISTINCT-layer views — surface both, never average
    providers:
      - {kind: derived_from, inputs: [tumor_protein_abundance], method: breadth_rollup, evidence_tier: measured}       # CPTAC protein (Slice B)
      - {kind: derived_from, inputs: [tumor_vs_normal_selectivity], method: breadth_rollup, evidence_tier: measured}   # pan-cancer RNA (Slice C)

  drug_anchored_combination:
    claim: "When {target} is INHIBITED by its anchor drug, which other genes become MORE essential (drug-anchored CRISPR combination opportunities)?"
    # NEW measurement_type (Phase-I combination half). DepMap 26Q1 drug-anchor CRISPR screens
    # (genome-wide KO WITH vs WITHOUT a fixed anchor inhibitor). NARROW coverage: single-target
    # anchor inhibitors only (KRAS/KIT/XPO1) → a card returns no_anchor_screen for uncovered targets.
    # Distinct from combinatorial_ko_dependency (paralog dual-KO, gene×gene) — this is drug×gene.
    # The RESISTANCE arm (positive shifts) is a deferred sibling (resistance-emergence-signature).
    entity_grains: [target]
    cards: [combo-crispr-screen]
    modality_relevance: [small_molecule, degrader]
    multi_provider_policy: tier_dominant
    providers:
      - {kind: dataset, source: depmap-drug-anchor-combination-per-target-v1, method: combo_drug_anchor, evidence_tier: measured}

  combinatorial_ko_dependency:
    claim: "When {target} is co-knocked-out with a paralog partner, is there a synthetic-lethal / buffering genetic interaction (GI = dual - sum-of-singles, Chronos scale), and is it constitutive or context-conditional?"
    # NEW measurement_type (measured dual-KO GI). Distinct from crispr_lof_dependency (single-gene)
    # and from the paralog-buffering annotation (per-gene veto-suppressor). target_pair grain: the
    # claim is about {target, partner} jointly. tier_dominant — DepMap ParalogV2 is the single
    # dominant provider; published CC-BY GI maps (Dede/in4mer/Horlbeck) are a future corroboration leg.
    entity_grains: [target, target_pair]
    cards: [combinatorial-dependency]
    modality_relevance: [small_molecule, degrader]
    multi_provider_policy: tier_dominant
    providers:
      - {kind: dataset, source: depmap-paralog-genetic-interaction-per-pair-v1, method: paralog_genetic_interaction, evidence_tier: measured}   # DOMINANT (282 lines)
      - {kind: dataset, source: dede-paralog-genetic-interaction-per-pair-v1, method: paralog_genetic_interaction, evidence_tier: measured}     # CORROBORATION — Dede 2020 enCas12a, 3 lines (A549/HT29/OVCAR8), CC BY 4.0. Independent published screen; harmonized to the same GI schema. Reader corroborates/discordantly tempers a paralog SL call (e.g. KAT6A/B context in DepMap, not replicated in Dede's 3 lines).
      - {kind: dataset, source: in4mer-paralog-genetic-interaction-per-pair-v1, method: paralog_genetic_interaction, evidence_tier: measured}   # CORROBORATION — in4mer 2024 Cas12a, 4 lines (K562/A549/A375/MELJUSO), CC BY 4.0. normZ GI. SUMMARY grain only (source pan-line aggregated — corroborates presence/strength, no per-lineage read). Validated on RAF1/ARAF+BRAF paralog SL.
      - {kind: dataset, source: horlbeck-genetic-interaction-per-pair-v1, method: paralog_genetic_interaction, evidence_tier: measured}          # EXTENSION — Horlbeck 2018 CRISPRi, K562+Jurkat, CC BY 4.0. UNIQUE role: NON-paralog arbitrary pairs (472-gene all-by-all) — reaches gene pairs the paralog providers (DepMap/Dede/in4mer) cannot. Coverage extension, not just corroboration.

  sc_normal_celltype_expression:
    claim: "Single-cell RNA expression in normal tissue by cell type (pseudobulk, donor-replicate) — on-target-off-tumor safety substrate at cell-type resolution"
    entity_grains: [target]
    cards: [sc-normal-celltype-expression]
    modality_relevance: [adc, bite_tce, antibody]
    # tier_dominant: the CELLxGENE Census donor-pseudobulk is the single dominant provider of this
    # claim; colon + lung are the same provider at different tissue shards (grain values, NOT distinct
    # providers). kind: dataset (NOT derived_from): these are raw data-catalog Tier-1 aggregation
    # products from the CELLxGENE Census query; derived_from inputs must be registered measurement_type
    # keys — a manifest ID there is a dangling edge (Rule 4, same as sc_tumor_celltype_expression).
    multi_provider_policy: tier_dominant
    providers:
      - {kind: dataset, source: sc-normal-celltype-expression-colon-v1, method: sc_normal_celltype_pseudobulk, evidence_tier: measured}   # + lung shard (same provider, different tissue)
      - {kind: dataset, source: sc-normal-celltype-expression-lung-v1, method: sc_normal_celltype_pseudobulk, evidence_tier: measured}

# ============================================================================
# EXCLUDED — NOT a per-target measurement_type (Rule non-goal / appendix case 14):
#   surfaceome-cohort-ranking — a population-relative ranking over all surface proteins
#   in an indication (percentile / tissue_rank among N), not a claim about one target.
#   It is a panorama/cohort-scan product, correctly kept out of the per-target skills.
# ============================================================================
