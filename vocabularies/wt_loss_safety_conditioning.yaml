# wt_loss_safety_conditioning.yaml
# Layer-1 of docs/design/VERDICT_REPRESENTATION.md — the per-signal modality-relevance
# the WT-loss / full-knockout safety concern conditions on.
#
# WHY THIS EXISTS
# ---------------
# A set of safety rules paint the intracellular channels {small_molecule, degrader} UNIFORMLY
# (e.g. highly-constrained-safety-warning => {small_molecule: opposing, degrader: opposing}).
# That is wrong: a WT-loss-of-function safety liability applies to an agent ONLY insofar as the
# agent depletes/fully-inhibits WILD-TYPE protein. An allele/mutant-selective small molecule
# (G12C covalent, mutant-selective glue) SPARES WT and nullifies the concern; a degrader / RNA /
# pan-inhibitor ENGAGES WT and the concern stands. The interpretation_rules schema is
# unevaluatedProperties:false, so this conditioning is recorded here (a curated sidecar, like
# internalizing_antigen_targets.yaml / degrader_precedent_targets.yaml) rather than as a rule field.
#
# HOW LAYER-2 CONSUMES IT (composition; not yet wired)
# ----------------------------------------------------
# For each modality channel a listed rule fires on, cross the rule's concern against the channel's
# wt_engagement (from modality.enum.yaml):
#   engages_wt     -> concern APPLIES  (signal stands: opposing/killer)
#   conditional    -> concern applies to WT-engaging agents; surface a caveat that an
#                     allele-selective agent spares WT (agent-level, resolved at program time)
#   not_applicable -> concern does NOT apply (drop the signal for that channel)
# protective_rules invert: an LoF-population-protective signal means full-KO (engages_wt) is
# SUPPORTIVE (safety-de-risking), most informative for engages_wt modalities.
#
# This REPLACES the GoF-role-proxy heuristic in safety.resolver.yaml (the 6 rungs emitting
# wt_constraint_mechanism_mismatch / wt_human_genetics_mechanism_mismatch), which fakes
# allele-selectivity from alteration-role instead of from the actual modality.

vocab_id: wt_loss_safety_conditioning
version: 1.2.0   # 1.2.0 (skills #1794): +pan-essential-unanchored-broad-tox-safety-warning +
                 # broad-dependency-partial-tox-safety-warning in concern_rules — both are WT-loss/
                 # full-KO broad-toxicity concerns on the DepMap dependency axis (same conditioning
                 # as their curated pan-essential sibling: opposing for engages_wt agents; an
                 # allele-selective agent spares the WT protein normal cells depend on).
                 # 1.1.0 (skills #1793): +tphp-hpa-blind-vital-organ-protein-safety-warning in
                 # concern_rules — the TPHP DIA-MS twin of the HPA essential-tissue rule, covering the
                 # vital organs HPA-IHC cannot represent (nerve/blood/adrenal_gland/thyroid). Same
                 # WT-loss/full-KO conditioning as its HPA sibling: measured protein presence in a
                 # dose-limiting organ opposes engages_wt agents; an allele-selective agent spares WT.
conditioning_property: wt_engagement    # defined in modality.enum.yaml

# WT-loss / full-KO liabilities: opposing for engages_wt agents; nullified by allele-selectivity.
concern_rules:
  - highly-constrained-safety-warning              # gnomAD LoF-constraint (highly_constrained)
  - gene-burden-lof-safety-warning                 # OT gene-burden LoF risk phenotype
  - clingen-dominant-loss-safety-warning           # ClinGen autosomal-dominant haploinsufficiency
  - mouse-ko-lethal-safety-warning                 # mouse adult-KO lethal (inferred)
  - clinvar-germline-pathogenic-safety-warning     # ClinVar germline pathogenic
  - pan-essential-broad-tox-safety-warning         # DepMap common-essential broad normal-tissue tox
  - pan-essential-unanchored-broad-tox-safety-warning # UNVERIFIABLE >=85% pan-essential (curated anchor unreachable) — conservative twin (skills #1794)
  - broad-dependency-partial-tox-safety-warning    # 0.60-0.85 partial broad-dependency band — graded WT-loss/full-KO liability (skills #1794)
  - pan-essential-killer                           # pan-essential CRISPR (broad tox for full inhibition/degradation)
  - rnai-pan-essential-killer                      # pan-essential RNAi (orthogonal broad tox)
  - normal-tissue-protein-liability-safety-warning # HPA-IHC essential-tissue protein (on-target-off-tumor for full-KO)
  - tphp-hpa-blind-vital-organ-protein-safety-warning # TPHP DIA-MS protein in the vital organs HPA-IHC cannot see (skills #1793)

# INVERTED: LoF is population-protective => full knockout is safety-DE-RISKING (supportive),
# most informative for engages_wt modalities (degrader / RNA / pan-inhibitor).
protective_rules:
  - gene-burden-protective-favorable

# ALLELE-SELECTIVE ELIGIBILITY (2026-08-24): the WT-loss concern is nullified for a small_molecule
# ONLY IF the target admits a mutant/allele-selective agent — i.e. it is an ACTIVATING GoF driver
# with a selectable mutant (KRAS-G12C). Absent such eligibility (a TSG, a WT-overexpressed or
# housekeeping target), a small-molecule inhibitor ENGAGES WT and the concern STANDS. Layer-2
# composition uses this to set the small_molecule (wt_engagement=conditional) channel:
#   eligibility rule fired  -> small_molecule = conditional (allele-selective agent spares WT)
#   NOT fired               -> small_molecule = hold        (pan inhibitor engages WT)
# These are the SAME role signals the retired safety.resolver.yaml downgrade rungs keyed on — now
# used as eligibility for ONE channel, not as a blanket modality-agnostic downgrade.
allele_selective_eligibility_rules:
  - activating-driver-role-safety-context
  - alteration-role-gof-driver-supportive

# REQUIRED ROLE CO-GATE (2026-08-31, B4-1 fix): an eligibility signal above is NECESSARY but NOT
# SUFFICIENT. Both eligibility rules fire on functional_direction=activating / alteration_role=
# direct_driver_gof, which a spurious IntOGen 'Act' label sets even for a TUMOR SUPPRESSOR (SMARCA2:
# oncokb_gene_type=TSG yet functional_direction=activating). A TSG is NOT drugged by a mutant-selective
# activator that spares WT, so downgrading its WT-loss safety concern is wrong (an under-calls-safety
# bug). The RETIRED safety.resolver.yaml GROUP-1 downgrades required BOTH an activating signal AND
# oncogene-role-safety-context (when_all_fired); this co-gate restores that conjunction in the Layer-2
# modality-safety composition: allele-selective escape requires an eligibility rule AND every rule here
# to have fired. A genuine GoF ONCOGENE (oncokb_gene_type=ONCOGENE) fires oncogene-role-safety-context;
# a TSG-with-spurious-Act does not → small_molecule stays `hold`.
allele_selective_required_role_rules:
  - oncogene-role-safety-context

# DISQUALIFIERS: a GoF oncogene that is AMPLIFICATION-driven (ERBB2, MDM2, MYC) or role-only /
# rarely-altered (MCL1) has NO selectable activating POINT mutation — a small molecule engages the
# WILD-TYPE (amplified/role-only) protein, so there is NO allele-selective escape and the WT-loss
# concern STANDS (small_molecule = hold, not conditional). Reuses the exact signals the retired
# safety.resolver.yaml GROUP-0 (amplification) + GROUP-0b (rarely-altered) guards keyed on, so the
# eligibility model preserves the S1-1 amplification-guard behavior. Composition: small_molecule is
# conditional ONLY IF (eligibility rule fired) AND NOT (any disqualifier fired).
# THIRD DISQUALIFIER (2026-09-12): CURATED-ONLY cancer genes. The B4-1 required-role co-gate above
# closes the TSG-with-spurious-Act hole, but it does NOT close the mirror hole on the ONCOGENE side:
# a gene that is on the OncoKB ONCOGENE list with ZERO IntOGen driver rows fires BOTH eligibility
# rules (activating-driver-role-safety-context from the curated direction, and formerly
# alteration-role-gof-driver-supportive from the role) AND the required-role co-gate
# (oncogene-role-safety-context is itself keyed on oncokb_gene_type=ONCOGENE) — so gene-list
# MEMBERSHIP alone cleared the whole triple. Measured on the 26-target genomic review panel:
# FOLR1/OV and TACSTD2/BRCA cleared it with NO disqualifier firing at all; CD19/DLBC was saved only
# INCIDENTALLY by functional-gene-state-rarely-altered-neutral. All three are ADC/antibody surface
# targets whose therapy engages WILD-TYPE protein, so the WT-loss concern is exactly the one that
# must STAND — an under-calls-safety bug of the same class B4-1 fixed.
# alteration_role=curated_cancer_gene (alteration-role.card.yaml >= 0.2.0) is the direct read of
# "curated cancer gene, no patient-scale driver call in any cohort", so disqualifying on it closes
# the hole for all 440 such OncoKB genes structurally, independent of which eligibility rule fired.
# NOTE the asymmetry with the role fix: alteration_role moves to curated_cancer_gene but
# functional_direction is STILL the curated `activating` (curation is honest evidence about
# mechanism), so the direction-keyed eligibility rule keeps firing — which is precisely why this had
# to be a disqualifier and not just a role change.
allele_selective_disqualifier_rules:
  - copy-number-amplified-oncogene-safety-context
  - functional-gene-state-rarely-altered-neutral
  - alteration-role-curated-cancer-gene-neutral

# NOTE (curation discipline): every rule_id above must exist in interpretation-rules/*.rules.yaml.
# tests/vocabularies/test_wt_loss_safety_conditioning.py asserts this (guards against rule renames).
