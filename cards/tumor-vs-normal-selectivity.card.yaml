# Card iter-2/E-tvN-Sel — TUMOR vs NORMAL SELECTIVITY  (v3 — multi-cell sensitivity)
#
# Composes from ONE consolidated derived product:
#   `{indication}-dge-tumor-vs-normal-sensitivity-v1` — the multi-cell DESeq2
#   sensitivity DEG produced by methods.dge_deseq2 --contrast four_cell_sensitivity.
#
# v3 (2026-07-06) REPLACES the v2 two-independent-products design with a single
# methodologically-consistent product. All cells run under ONE pipeline
# (DESeq2 NB-GLM + apeglm shrinkage), ONE substrate (recount3 tcga-gtex-2023-01-04,
# uniform monorail alignment), so log2FC values ARE comparable across cells — the
# scale-inconsistency that v2's Welch-vs-DESeq2 split introduced is gone.
#
# The THREE live cells (see analysis-methods DESIGN_v2_four_cell_consolidation.md +
# steps/06_four_cell_driver.R):
#   A  tumor vs TCGA adjacent-normal  | raw            | field-effect-inflated
#   B  tumor vs TCGA adjacent-normal  | ComBat(TSS)    | technical-batch removed
#   C  tumor vs GTEx population-normal | raw (naive)   | source-contaminated baseline
#
# Cell D (tumor vs GTEx, ComBat(source)) was RETIRED after the full-cohort/COADREAD
# validation showed it collapses the biology: because source (TCGA/GTEx) is perfectly
# confounded with group (tumor/normal) in the joint contrast, ComBat-seq regressed out
# the tumor-vs-normal signal along with the source effect — the intended "pessimistic
# anchor" read as noise, not signal. The pipeline assembles only cells A/B/C
# (06_four_cell_driver.R:227-244); the trust anchor is therefore 3/3, not 4/4.
#
# WHY multiple cells: neither comparator is clean. TCGA-adjacent carries field-effect
# (Sorokin & Buzdin 2023); the TCGA-vs-GTEx joint is batch-confounded with biology
# (Hui & Goh 2024). A gene's TRUST is how many cells agree — `cells_supporting` out of
# the cells that RAN (`cells_ran`, ≤3). A gene significant in all cells that ran
# (`sig_all_cells`) is robust to every comparator + batch-handling choice. A gene where
# cells DISAGREE in direction (`discordant`) is comparator-dependent — the interesting
# failure mode where "which normal?" changes the answer (e.g. epithelial markers up vs
# whole-tissue GTEx but flat vs epithelial-rich adjacent margin).
#
# Interpretation surface (supporting_frac = cells_supporting / cells_ran is the PRIMARY
# trust anchor — a 3/3 is strong if the magnitude clears 1.5, same as a 4/4 would have
# been; see read.py:592-611):
#   `strong_tumor_selective`  → all cells that ran support, dominant up, max|log2FC| >= 1.5
#   `modest_tumor_selective`  → supporting_frac >= 2/3, dominant up, max|log2FC| >= 0.5
#   `discordant_across_comparators` → discordant == true (sig cells disagree in sign)
#   `not_selective`           → supporting_frac >= 2/3, dominant DOWN
#   `not_informative`         → supporting_frac low (no comparator-robust signal)
#   `data_unavailable`        → sensitivity product not accessible

card_id: tumor-vs-normal-selectivity
version: 3.4.0    # 2026-08-05: + selectivity all-gene percentile (Axis-1 contextualization; SEL-1 orphaned-signal surface)
question: "How selectively is {target.symbol} expressed in {indication.label} tumor tissue, and how robust is that selectivity across the three independent tumor-vs-normal comparators (TCGA-adjacent raw + ComBat, GTEx-population raw)?"

tier: indication   # indication-scoped tumor-vs-normal selectivity; subtype-eligible once a per-sample expression reader ships

# BLOCKED (2026-07-16): selectivity varies by molecular subgroup (filter 1 met),
# but dge-tumor-vs-normal-selectivity emits whole-cohort comparators baked at
# emit time (filter 2 FAILS). Tagged not-live pending a per-sample reader.
subgroup_stratification:
  eligible: true
  status: blocked_needs_per_sample_reader
  axes: [msi_status]
  rationale: "Selectivity varies by subgroup but the four comparators are whole-cohort aggregates; needs a per-sample expression reader."

applies_when:
  - "context.data_sources.recount3_tcga_gtex_available == true"

required_inputs:
  - product_id: coadread-dge-tumor-vs-normal-sensitivity-v1

methods:
  - call: dge-tumor-vs-normal-selectivity
    args:
      target: "{target.symbol}"
      indication: "{indication}"

outputs:
  summary_fields:
    - cells_ran                             # PER-GENE: how many cells actually tested this gene (accounts for per-cell pre-filter drops); denominator for cells_supporting

    - cells_supporting                      # PRIMARY: cells sig<0.05 in the dominant direction (0-cells_ran, ≤3)
    - dominant_direction                    # up | down | none
    - sig_all_cells                         # gold-standard: sig in ALL cells that ran, same direction
    - discordant                            # >=1 sig cell up AND >=1 sig cell down
    - max_abs_log2fc                         # max |log2FC| across cells (secondary magnitude signal)
    - log2fc_cell_a                         # tumor vs TCGA-adjacent, raw
    - q_value_cell_a
    - log2fc_cell_b                         # tumor vs TCGA-adjacent, ComBat(TSS)
    - q_value_cell_b
    - log2fc_cell_c                         # tumor vs GTEx, raw (naive joint)
    - q_value_cell_c
    # cell D (tumor vs GTEx, ComBat(source)) RETIRED — see header + read.py:592. Not emitted.
    - n_tumor
    - n_adjacent
    - n_gtex_normal
    - selectivity_class                     # DESCRIPTIVE (drives Tier-2 rules)
    - comparator_concordance                # DERIVED: do the TCGA-adjacent (A/B) + GTEx (C) comparator FAMILIES agree? (cells_supporting is a count; this is the cross-comparator agreement it collapses)
    # SELECTIVITY all-gene percentile (SEL-1, 2026-08-05) — the Axis-1 CONTEXTUALIZATION of the
    # tumor-vs-normal contrast: where does this gene's log2FC sit among ALL genes in this indication's
    # sensitivity product? The method ALREADY computed cell-A's rank but never declared it here (orphaned
    # signal). Namespaced `selectivity_*` (NOT the presence card's abundance `allgene_percentile`) to
    # avoid a same-name/different-meaning collision in the composed target-profile. DISPLAY facet — feeds
    # render/LLM; no rule wired against the class yet (selectivity_class verdict spine byte-stable).
    - selectivity_allgene_percentile          # float 0-100 (or null) — cell-A (TCGA tumor-vs-adjacent, PRIMARY) log2FC rank among all genes
    - selectivity_allgene_percentile_class    # categorical (drives rules if wired later)
    - selectivity_allgene_percentile_context  # string — product + comparator column the null was drawn from (anti-pooling audit)
    - selectivity_allgene_percentile_cell_b    # float — cell-B (TCGA-adjacent ComBat) corroborating rank
    - selectivity_allgene_percentile_cell_c    # float — cell-C (GTEx population) corroborating rank

  summary_fields_vocabulary:
    dominant_direction:
      - up
      - down
      - none
    comparator_concordance:
      - concordant                          # both families sig, SAME direction (robust to "which normal?")
      - discordant                          # both families sig, OPPOSITE directions (field-effect failure mode; or a family self-disagrees)
      - single_comparator                   # only one family ran/reached significance — cross-comparator agreement UNTESTED
    selectivity_class:
      - strong_tumor_selective              # all cells that ran support, up, RAW max|log2FC|>=1.5 (cell A/C, not ComBat B)
      - modest_tumor_selective              # supporting_frac>=2/3, up, RAW max|log2FC|>=0.5
      - field_effect_tumor_selective        # discordant BUT adjacent-flat/down + GTEx-population strongly up
                                            # (>=1.5): field-cancerization signature — the adjacent 'normal'
                                            # already over-expresses (Aran/Butte 2017), so defer to the GTEx
                                            # population-normal comparator. Tumor-selective vs TRUE normal,
                                            # flagged (recovers epithelial lineage antigens e.g. CEACAM5/EPCAM
                                            # in colon that read discordant against field-affected adjacent).
      - discordant_across_comparators       # sig cells disagree in direction (a GENUINE comparator conflict,
                                            # not the field-effect signature)
      - not_selective                       # supporting_frac>=2/3, dominant DOWN
      - not_informative                     # supporting_frac low
      - data_unavailable
    selectivity_allgene_percentile_class:
      - top_1pct                            # >= selectivity_allgene_top_1pct cutoff — among the most tumor-selective genes in-indication
      - top_decile                          # >= selectivity_allgene_top_decile cutoff
      - mid
      - bottom_decile                       # <= selectivity_allgene_bottom_decile cutoff — tumor-DEPLETED relative to other genes
      - data_unavailable

  figures:
    - id: tumor_vs_normal_selectivity_4panel
      type: box_forest_sensitivity_panel
      description: "Per-indication compound figure: (left) horizontal box + jittered strip of log2(CPM+1) per group across Primary Tumor, TCGA Adjacent Normal, and GTEx tissue-of-origin — individual sample dots overlaid, group medians annotated. (middle) forest of the three live cell log2FC estimates (A/B/C; cell D retired) with q-value stars, colored by up/down, reference lines at 0/0.5/1.5; cells that disagree in sign are visually flagged. (right) sensitivity callout: cells_supporting badge (n/cells_ran), dominant_direction, sig_all_cells check, discordant flag, class."
      preferred_surfaces: [markdown, ppt, decision_memo]
      primary: true
    - id: tumor_vs_normal_pan_tissue_landscape
      type: pan_tissue_box_scatter_matrix
      description: "Cross-indication pan-tissue landscape (added v3.1.0, 2026-07-08). Rows = up to 18 wired indications, sorted by median tumor log2TPM descending. Columns = Primary Tumor / TCGA-Adjacent-Normal / GTEx-tissue-of-origin. Each cell shows a horizontal box + jittered scatter of log2(TPM+1) with n annotation. Sig. stars per (indication, cells A/C) from the sensitivity parquet's padj_A and padj_C fields: * q<0.05, ** q<1e-4, *** q<1e-10. Discordant indications (cells disagree in sign) flagged with a • bullet next to the row label. Cross-tissue comparability requires TPM (not CPM), enabled by Gencode-v26 gene-length normalization in the read layer as of dge_deseq2 v0.4."
      preferred_surfaces: [markdown, ppt, decision_memo, poster]
      primary: false

thresholds:
  strong_selectivity_log2fc: 1.5
  modest_selectivity_log2fc: 0.5
  # cells_supporting is judged as a FRACTION of cells_ran (≤3), not against a fixed count —
  # a 3/3 is strong, a 2/3 is modest. See read.py:606-611 (supporting_frac >= 1.0 / >= 2/3).
  min_supporting_frac_strong: 1.0
  min_supporting_frac_modest: 0.667
  min_expressed_log2cpm: 1.0     # log2(CPM+1) baseline for "detected in tumor"
  # selectivity all-gene percentile-class cutoffs (method bins selectivity_allgene_percentile →
  # selectivity_allgene_percentile_class). Same cutoff shape as the presence allgene cutoffs.
  selectivity_allgene_top_1pct: 99.0
  selectivity_allgene_top_decile: 90.0
  selectivity_allgene_bottom_decile: 10.0

warning_predicates:
  - warning_id: tvn_field_effect_discordant
    if: "discordant == true"
    message: "Comparator-dependent: significant cells disagree on direction. Typically tumor up vs GTEx-population but flat/down vs TCGA-adjacent-margin (field effect), or vice versa. 'Which normal?' changes the call — inspect the 3-cell forest before trusting either direction."
  - warning_id: tvn_adjacent_only
    if: "cells_ran == 2 && n_gtex_normal == 0"
    message: "Only TCGA-adjacent cells (A/B) ran — no GTEx tissue maps to this indication. cells_supporting is capped at 2/2; selectivity vs population-normal is UNTESTED. Treat a '2/2' as weaker evidence than a full 3/3."
  - warning_id: tvn_gtex_only
    if: "cells_ran == 1 && n_adjacent == 0"
    message: "Only the GTEx cell (C) ran — TCGA adjacent-normal below the DESeq2 sample floor for this indication. cells_supporting is capped at 1/1; the within-patient field-effect contrast is UNTESTED and there is no cross-comparator robustness."

caveats:
  - |
    cells_supporting AS A FRACTION of cells_ran (≤3) is the trust anchor, NOT any
    single log2FC. The cells bracket two irreducible uncertainties: WHICH normal
    (TCGA-adjacent vs GTEx-population) and HOW to handle batch (raw vs ComBat). A
    gene at 3/3 is differential no matter how you frame the comparison; a gene at
    1/3 is an artifact of one specific framing. Do not cite a log2FC without its
    cells_supporting / cells_ran.
  - |
    Cell D (tumor vs GTEx, ComBat(source)) was RETIRED, not run. Source (TCGA/GTEx)
    is perfectly confounded with group (tumor/normal) in the joint contrast, so
    ComBat-seq regressed out the genuine tumor signal along with the source effect —
    the intended "pessimistic floor" read as noise, not signal (confirmed on the
    full COADREAD cohort). The pipeline now assembles only cells A/B/C
    (06_four_cell_driver.R:227-244); the GTEx comparator survives as the naive cell C.
  - |
    TCGA paired-adjacent-normal (cells A/B) is a surgical selection artifact —
    uninvolved margin chosen at the surgeon's discretion, often bearing
    tumor-adjacent transcriptional signatures ("field cancerization"). This is
    WHY cells C/D (GTEx) exist as an orthogonal comparator; discordance between
    the A/B and C/D pairs is the field-effect signal made explicit.
  - |
    GTEx normal tissue (cells C/D) is BULK RNA — cell-type-specific expression
    within a tissue can far exceed the tissue median (e.g. intestinal crypt
    cells vs whole colon). Selectivity at bulk-RNA level does not guarantee
    selectivity at cell-type-of-origin level.
  - |
    Selectivity at RNA level does not guarantee selectivity at protein or
    surface level. Pair with protein-surface-evidence card (HPA/CPTAC-based)
    when available.
  - |
    All three cells share ONE alignment substrate (recount3 monorail). This is
    deliberate: mixing aligners (e.g. GDC-STAR for adjacent, recount3 for GTEx)
    would confound comparator with aligner and defeat the sensitivity logic. As
    a consequence, cell A does NOT byte-match the prior-generation GDC-STAR
    tumor-vs-adjacent product; it agrees in direction + rank, not in magnitude.

measurement: bulk_rna
sample_context: tumor         # patient tumor vs normal comparators (recount3 TCGA/GTEx) — orthogonal to measurement (2026-07-21)

# DATA_TO_SKILL_CONTRACT Rule 1 — view of the `tumor_vs_normal_selectivity` claim.
measurement_type: tumor_vs_normal_selectivity
# P4 Tier-2 (2026-07-24): cross-axis — the tumor-vs-normal window feeds SM efficacy AND is the biologics therapeutic-index / off-tumor-tox basis (surface rules J). Rules on BOTH axes. Declaration lands WITH the matching surface rules (PR feat/p4-surface-rules-tier2) — never declare without a rule.
modality_relevance: [small_molecule, degrader, adc, bite_tce, antibody]
entity_grains: [target_indication]
schema_version: 1
