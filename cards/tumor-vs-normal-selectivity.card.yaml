# Card iter-2/E-tvN-Sel — TUMOR vs NORMAL SELECTIVITY  (v3 — four-cell sensitivity)
#
# Composes from ONE consolidated derived product:
#   `{indication}-dge-tumor-vs-normal-sensitivity-v1` — the four-cell DESeq2
#   sensitivity DEG produced by methods.dge_deseq2 --contrast four_cell_sensitivity.
#
# v3 (2026-07-06) REPLACES the v2 two-independent-products design with a single
# methodologically-consistent product. All four cells run under ONE pipeline
# (DESeq2 NB-GLM + apeglm shrinkage), ONE substrate (recount3 tcga-gtex-2023-01-04,
# uniform monorail alignment), so log2FC values ARE comparable across cells — the
# scale-inconsistency that v2's Welch-vs-DESeq2 split introduced is gone.
#
# The four cells (see analysis-methods DESIGN_v2_four_cell_consolidation.md):
#   A  tumor vs TCGA adjacent-normal  | raw            | field-effect-inflated
#   B  tumor vs TCGA adjacent-normal  | ComBat(TSS)    | technical-batch removed
#   C  tumor vs GTEx population-normal | raw (naive)   | source-contaminated baseline
#   D  tumor vs GTEx population-normal | ComBat(source)| source-scrubbed (over-corrects)
#
# WHY four cells: neither comparator is clean. TCGA-adjacent carries field-effect
# (Sorokin & Buzdin 2023); the TCGA-vs-GTEx joint is batch-confounded with biology
# (Hui & Goh 2024). A gene's TRUST is how many cells agree — `cells_supporting`
# (0-4). A gene significant in all four (`sig_all_cells`) is robust to every
# comparator + batch-handling choice. A gene where cells DISAGREE in direction
# (`discordant`) is comparator-dependent — the interesting failure mode where
# "which normal?" changes the answer (e.g. epithelial markers up vs whole-tissue
# GTEx but flat vs epithelial-rich adjacent margin).
#
# Interpretation surface (cells_supporting is the PRIMARY trust anchor):
#   `strong_tumor_selective`  → cells_supporting == 4, dominant up, max|log2FC| >= 1.5
#   `modest_tumor_selective`  → cells_supporting >= 3, dominant up, max|log2FC| >= 0.5
#   `discordant_across_comparators` → discordant == true (sig cells disagree in sign)
#   `not_selective`           → cells_supporting >= 3, dominant DOWN
#   `not_informative`         → cells_supporting <= 1 (no comparator-robust signal)
#   `data_unavailable`        → sensitivity product not accessible

card_id: tumor-vs-normal-selectivity
version: 3.1.0
question: "How selectively is {target.symbol} expressed in {indication.label} tumor tissue, and how robust is that selectivity across four independent tumor-vs-normal comparators (TCGA-adjacent ± batch correction, GTEx-population ± source correction)?"

tier: indication   # indication-scoped tumor-vs-normal selectivity; subtype-eligible once a per-sample expression reader ships

# BLOCKED (2026-07-16): selectivity varies by molecular subgroup (filter 1 met),
# but dge-tumor-vs-normal-selectivity emits whole-cohort comparators baked at
# emit time (filter 2 FAILS). Tagged not-live pending a per-sample reader.
subgroup_stratification:
  eligible: true
  status: blocked_needs_per_sample_reader
  axes: [msi_status]
  rationale: "Selectivity varies by subgroup but the four comparators are whole-cohort aggregates; needs a per-sample expression reader."

applies_when:
  - "context.data_sources.recount3_tcga_gtex_available == true"

required_inputs:
  - product_id: coadread-dge-tumor-vs-normal-sensitivity-v1

methods:
  - call: dge-tumor-vs-normal-selectivity
    args:
      target: "{target.symbol}"
      indication: "{indication}"

outputs:
  summary_fields:
    - cells_ran                             # PER-GENE: how many cells actually tested this gene (accounts for per-cell pre-filter drops); denominator for cells_supporting

    - cells_supporting                      # PRIMARY: cells sig<0.05 in the dominant direction (0-4)
    - dominant_direction                    # up | down | none
    - sig_all_cells                         # gold-standard: sig in ALL cells that ran, same direction
    - discordant                            # >=1 sig cell up AND >=1 sig cell down
    - max_abs_log2fc                         # max |log2FC| across cells (secondary magnitude signal)
    - log2fc_cell_a                         # tumor vs TCGA-adjacent, raw
    - q_value_cell_a
    - log2fc_cell_b                         # tumor vs TCGA-adjacent, ComBat(TSS)
    - q_value_cell_b
    - log2fc_cell_c                         # tumor vs GTEx, raw (naive joint)
    - q_value_cell_c
    - log2fc_cell_d                         # tumor vs GTEx, ComBat(source)
    - q_value_cell_d
    - n_tumor
    - n_adjacent
    - n_gtex_normal
    - selectivity_class                     # DESCRIPTIVE (drives Tier-2 rules)

  summary_fields_vocabulary:
    dominant_direction:
      - up
      - down
      - none
    selectivity_class:
      - strong_tumor_selective              # cells_supporting==4, up, max|log2FC|>=1.5
      - modest_tumor_selective              # cells_supporting>=3, up, max|log2FC|>=0.5
      - discordant_across_comparators       # sig cells disagree in direction
      - not_selective                       # cells_supporting>=3, dominant DOWN
      - not_informative                     # cells_supporting<=1
      - data_unavailable

  figures:
    - id: tumor_vs_normal_selectivity_4panel
      type: box_forest_sensitivity_panel
      description: "Per-indication compound figure: (left) horizontal box + jittered strip of log2(CPM+1) per group across Primary Tumor, TCGA Adjacent Normal, and GTEx tissue-of-origin — individual sample dots overlaid, group medians annotated. (middle) forest of the FOUR cell log2FC estimates (A/B/C/D) with q-value stars, colored by up/down, reference lines at 0/0.5/1.5; cells that disagree in sign are visually flagged. (right) sensitivity callout: cells_supporting badge (n/4), dominant_direction, sig_all_cells check, discordant flag, class."
      preferred_surfaces: [markdown, ppt, decision_memo]
      primary: true
    - id: tumor_vs_normal_pan_tissue_landscape
      type: pan_tissue_box_scatter_matrix
      description: "Cross-indication pan-tissue landscape (added v3.1.0, 2026-07-08). Rows = up to 18 wired indications, sorted by median tumor log2TPM descending. Columns = Primary Tumor / TCGA-Adjacent-Normal / GTEx-tissue-of-origin. Each cell shows a horizontal box + jittered scatter of log2(TPM+1) with n annotation. Sig. stars per (indication, cells A/C) from the sensitivity parquet's padj_A and padj_C fields: * q<0.05, ** q<1e-4, *** q<1e-10. Discordant indications (cells disagree in sign) flagged with a • bullet next to the row label. Cross-tissue comparability requires TPM (not CPM), enabled by Gencode-v26 gene-length normalization in the read layer as of dge_deseq2 v0.4."
      preferred_surfaces: [markdown, ppt, decision_memo, poster]
      primary: false

thresholds:
  strong_selectivity_log2fc: 1.5
  modest_selectivity_log2fc: 0.5
  min_cells_supporting_strong: 4
  min_cells_supporting_modest: 3
  min_expressed_log2cpm: 1.0     # log2(CPM+1) baseline for "detected in tumor"

warning_predicates:
  - warning_id: tvn_field_effect_discordant
    if: "discordant == true"
    message: "Comparator-dependent: significant cells disagree on direction. Typically tumor up vs GTEx-population but flat/down vs TCGA-adjacent-margin (field effect), or vice versa. 'Which normal?' changes the call — inspect the 4-cell forest before trusting either direction."
  - warning_id: tvn_adjacent_only
    if: "cells_ran == 2 && n_gtex_normal == 0"
    message: "Only TCGA-adjacent cells (A/B) ran — no GTEx tissue maps to this indication. cells_supporting is capped at 2; selectivity vs population-normal is UNTESTED. Treat a '2/2' as weaker evidence than a true 4/4."
  - warning_id: tvn_gtex_only
    if: "cells_ran == 2 && n_adjacent == 0"
    message: "Only GTEx cells (C/D) ran — TCGA adjacent-normal below the DESeq2 sample floor for this indication. cells_supporting is capped at 2; the within-patient field-effect contrast is UNTESTED."
  - warning_id: tvn_gtex_correction_fragile
    if: "sign(log2fc_cell_c) != sign(log2fc_cell_d) && q_value_cell_c < 0.05"
    message: "Cell C (naive joint) and cell D (source-scrubbed) disagree in direction. The tumor-vs-GTEx signal is sensitive to how the TCGA-vs-GTEx batch confound is handled — the naive estimate is likely inflated by the source effect. Weight the TCGA-adjacent cells (A/B) more heavily here."

caveats:
  - |
    cells_supporting (0-4) is the trust anchor, NOT any single log2FC. Four
    cells bracket the two irreducible uncertainties: WHICH normal (TCGA-adjacent
    vs GTEx-population) and HOW to handle batch (raw vs ComBat). A gene at 4/4
    is differential no matter how you frame the comparison; a gene at 1/4 is an
    artifact of one specific framing. Do not cite a log2FC without its
    cells_supporting.
  - |
    Cell D intentionally OVER-corrects. Because source (TCGA/GTEx) is perfectly
    confounded with group (tumor/normal) in the joint contrast, ComBat-seq
    cannot preserve biology while removing source — cell D runs without group
    protection, so it removes some genuine tumor signal along with the source
    effect. It is the pessimistic floor, not an unbiased estimate. A gene that
    survives cell D has survived the harshest correction.
  - |
    TCGA paired-adjacent-normal (cells A/B) is a surgical selection artifact —
    uninvolved margin chosen at the surgeon's discretion, often bearing
    tumor-adjacent transcriptional signatures ("field cancerization"). This is
    WHY cells C/D (GTEx) exist as an orthogonal comparator; discordance between
    the A/B and C/D pairs is the field-effect signal made explicit.
  - |
    GTEx normal tissue (cells C/D) is BULK RNA — cell-type-specific expression
    within a tissue can far exceed the tissue median (e.g. intestinal crypt
    cells vs whole colon). Selectivity at bulk-RNA level does not guarantee
    selectivity at cell-type-of-origin level.
  - |
    Selectivity at RNA level does not guarantee selectivity at protein or
    surface level. Pair with protein-surface-evidence card (HPA/CPTAC-based)
    when available.
  - |
    All four cells share ONE alignment substrate (recount3 monorail). This is
    deliberate: mixing aligners (e.g. GDC-STAR for adjacent, recount3 for GTEx)
    would confound comparator with aligner and defeat the sensitivity logic. As
    a consequence, cell A does NOT byte-match the prior-generation GDC-STAR
    tumor-vs-adjacent product; it agrees in direction + rank, not in magnitude.

measurement: bulk_rna

# DATA_TO_SKILL_CONTRACT Rule 1 — view of the `tumor_vs_normal_selectivity` claim.
measurement_type: tumor_vs_normal_selectivity
entity_grains: [target_indication]
schema_version: 1
