# Card — GENOMIC INSTABILITY STATE  (genome-state slice: aneuploidy / CIN burden)
#
# INDICATION-LEVEL, TARGET-INDEPENDENT context: how chromosomally unstable is this cancer's
# cohort? Aneuploidy / chromosomal instability (CIN) is a genome-WIDE phenotype, not a per-gene
# property — so this card describes the indication, and a target maps in only as context ("is my
# target in a highly-aneuploid indication?"). High CIN correlates with whole-genome doubling,
# poorer prognosis, and modality caveats (e.g. broad copy-number noise complicating a clean
# copy-number driver read).
#
# Source: PanCanAtlas seg_based_scores.tsv (per-sample frac_altered = fraction of the genome
# CN-altered), scoped to the indication's TCGA project(s) via merged_sample_quality_annotations —
# the SAME barcode→cancer-type join functional-gene-state uses. Read LIVE (small per-indication
# compute), like alteration-role reads OncoKB/IntOGen live — NO intermediate derived product.
#
# SCOPE NOTE: this is per-SAMPLE genome-wide instability, NOT per-arm gain/loss. A per-arm
# arm-loss + per-lineage-selectivity-percentile card (the arm-loss-discovery direction) needs the
# Taylor-2018 arm-level calls, which are not yet ingested — a deferred follow-up.
#
# DISPLAY facet — verdict-inert. Surfaces the cohort instability class to render/LLM; touches no
# resolver rung.

card_id: genomic-instability-state
version: 0.6.0   # + PATIENT HRD genomic-SCAR arm (ABSOLUTE segtabs, Myriad myChoice >= 42); on top of MODEL signature/MSI, patient MSI, WGD
question: "How chromosomally unstable is the {indication.label} cohort — highly aneuploid, intermediate, or a quiet genome; how prevalent are whole-genome doubling and microsatellite instability — and where does its genome-instability burden sit?"

tier: indication

applies_when:
  - "true"   # any indication with a TCGA-project mapping; data_unavailable-safe otherwise

required_inputs:
  - product_id: gdc-pancanatlas-cnv-2018        # seg_based_scores.tsv (frac_altered) + ABSOLUTE abs_tables (WGD/ploidy)
  - product_id: gdc-pancanatlas-clinical-2018   # merged_sample_quality_annotations (barcode→cancer type)

methods:
  # ONE method module (tcga_aneuploidy_burden) supplies ALL genome-state axes: the skill dispatcher
  # performs a MULTI-AXIS (six-function) merge — aneuploidy_burden_for_indication() +
  # wgd_summary_for_indication() + the patient-MSI, model-MSI, model-signature, and HRD-scar
  # (hrd_score_for_indication, remapped to hrd_scar_*) functions — the same on-read dispatcher-merge
  # pattern the fusion card uses for GENIE-SV.
  - call: tcga-aneuploidy-burden
    args:
      indication: "{indication}"

outputs:
  summary_fields:
    - aneuploidy_burden_class            # PRIMARY categorical (indication cohort CIN level)
    - median_fraction_genome_altered     # cohort median frac_altered (the burden metric)
    - p25_fraction_genome_altered
    - p75_fraction_genome_altered
    - n_samples                          # PanCanAtlas samples in the indication cohort
    - aneuploidy_burden_context          # human-readable burden summary
    # ---- WGD / ploidy axis (Phase 3a; ABSOLUTE abs_tables) — 2nd cohort genome-state facet ----
    - wgd_class                          # cohort WGD-prevalence class (enriched/intermediate/rare)
    - wgd_fraction                       # fraction of cohort samples with >=1 whole-genome doubling
    - median_ploidy                      # cohort median ABSOLUTE ploidy (tracks WGD)
    - median_purity                      # cohort median ABSOLUTE tumor purity
    - wgd_context                        # human-readable WGD summary
    # ---- MSI axis, PATIENT arm (Phase 3a; TCGA marker-paper labels) — CRC+STAD only ----
    - msi_class                          # PATIENT cohort MSI-prevalence class (enriched/intermediate/mss/unavailable)
    - msi_high_fraction                  # fraction of PATIENT cohort samples that are MSI-high
    - n_msi_high                         # patient MSI-H sample count
    - msi_context                        # human-readable patient MSI summary
    # ---- MSI axis, MODEL arm (Phase 3a; DepMap MSIsensor MSIScore) — ALL LINEAGES ----
    # The complement to the patient arm: covers the indications patient labels miss (NSCLC/PAAD get a
    # MEASURED model_msi_class here where msi_class=data_unavailable). Cell-line cohort, not patient.
    - model_msi_class                    # MODEL (cell-line) MSI-prevalence class
    - model_msi_high_fraction            # fraction of DepMap lineage cell lines with MSIsensor MSIScore >= 20
    - n_model_msi_high                   # MSI-H cell-line count
    - model_msi_context                  # human-readable model MSI summary
    # ---- Mutational-SIGNATURE arm, MODEL (Phase 3a; DepMap OmicsMolecularSignatureMatrix) — all lineages ----
    # MMR-signature = an INDEPENDENT cross-validation of MSI (mutation spectrum, not microsatellite length).
    # HRD (SBS3) is a WEAK PARP proxy only — the actionable segment-based HRD scar score is the hrd_scar_* arm below.
    - model_mmr_signature_class          # cohort MMR-deficiency-signature prevalence class
    - model_mmr_signature_high_fraction  # fraction of lines with MMR SBS >= 20% of burden
    - model_hrd_signature_present_fraction  # fraction with SBS3 >= 10% (WEAK HRD/PARP proxy)
    - model_signature_context            # human-readable signature summary
    # ---- HRD genomic-SCAR arm, PATIENT (scope-coherence Phase 4; PanCanAtlas ABSOLUTE allele-specific segtabs) ----
    # Segment-based HRD score (HRD-LOH + LST + ntAI, Myriad myChoice >= 42) — the ACTIONABLE HRD read, the
    # complement to the WEAK SBS3 signature proxy above. Distinct semantics from the SBS3 `hrd` process in
    # mutational-signature-context — hence the `hrd_scar_*` prefix. Verdict-inert cohort context.
    - hrd_scar_class                     # cohort HRD-scar prevalence class (frac scar-high >= 0.20 → enriched)
    - frac_hrd_scar_high                 # fraction of cohort with HRD scar score >= 42
    - n_hrd_scar_high                    # HRD-scar-high patient count
    - median_hrd_scar_score              # cohort median HRD scar score
    - hrd_scar_context                   # human-readable HRD-scar summary
  summary_fields_vocabulary:
    aneuploidy_burden_class:
      - highly_aneuploid                 # cohort median frac_altered >= 0.40
      - intermediate_aneuploidy          # 0.10 < median < 0.40
      - quiet_genome                     # median <= 0.10 — comparatively CN-stable cohort
      - data_unavailable                 # no TCGA-project mapping or seg-scores/annotation unresolvable
    wgd_class:
      - wgd_enriched                     # >= 50% of cohort samples carry >=1 genome doubling
      - wgd_intermediate                 # 20% < fraction < 50% (near the ~30-40% pan-cancer baseline)
      - wgd_rare                         # <= 20% — comparatively WGD-infrequent cohort
      - data_unavailable                 # no TCGA-project mapping or ABSOLUTE/annotation unresolvable
    msi_class:
      - msi_high_enriched                # >= 15% of cohort samples MSI-high (e.g. gastric ~22%)
      - msi_intermediate                 # 5% < fraction < 15% (e.g. colorectal ~14%)
      - mss_dominant                     # <= 5% MSI-high — microsatellite-stable cohort
      - data_unavailable                 # NO patient MSI labels for this indication (CRC+STAD only) — NOT 0% MSI-H
    model_msi_class:                     # same cutoffs as patient msi_class, on DepMap cell lines
      - msi_high_enriched                # >= 15% of lineage cell lines MSI-high (e.g. uterus ~49%, bowel ~22%)
      - msi_intermediate                 # 5% < fraction < 15%
      - mss_dominant                     # <= 5% MSI-high — e.g. NSCLC ~0.8%, PAAD ~1.7% (measured, not unavailable)
      - data_unavailable                 # no DepMap lineage mapping or OmicsGlobalSignatures unresolvable
    model_mmr_signature_class:           # fraction of lines MMR-signature-high (MMR SBS >= 20% of burden)
      - mmr_signature_enriched           # >= 15% of lines MMR-sig-high (uterus ~43%, bowel ~21% — tracks MSI)
      - mmr_signature_intermediate       # 5% < fraction < 15% (ovary ~10%, gastric ~5%)
      - mmr_signature_rare               # <= 5% — MMR-clean cohort (lung ~0%, pancreas ~1%)
      - data_unavailable                 # no DepMap lineage mapping or signature matrix unresolvable
    hrd_scar_class:                      # PATIENT genome-scar HRD prevalence (ABSOLUTE segtabs; Phase 4)
      - hrd_enriched                     # >= 20% of cohort HRD-scar-high (myChoice score >= 42)
      - hrd_intermediate                 # 5% < fraction < 20%
      - hrd_rare                         # <= 5% — HRD-scar-clean cohort
      - data_unavailable                 # no ABSOLUTE segtabs or TCGA-project mapping

thresholds:
  high_median_frac_altered: 0.40         # method bins median → highly_aneuploid
  low_median_frac_altered: 0.10          # method bins median → quiet_genome
  wgd_enriched_fraction: 0.50            # method bins WGD fraction → wgd_enriched
  wgd_rare_fraction: 0.20                # method bins WGD fraction → wgd_rare
  msi_high_enriched_fraction: 0.15       # method bins MSI-high fraction → msi_high_enriched (patient + model)
  msi_mss_dominant_fraction: 0.05        # method bins MSI-high fraction → mss_dominant
  model_msi_high_score: 20               # MSIsensor2 MSI-H per-cell-line score cutoff (model arm)
  mmr_signature_high_model_fraction: 0.20  # per-cell-line: MMR SBS fraction >= this = MMR-sig-high
  mmr_signature_cohort_enriched: 0.15    # cohort: >= this fraction of lines MMR-sig-high → enriched
  hrd_signature_present_model_fraction: 0.10  # per-cell-line: SBS3 >= this = HRD-signature-present (weak)
  hrd_scar_high_score: 42                # PATIENT Myriad myChoice HRD-scar cutoff (HRD-LOH + LST + ntAI)
  hrd_scar_cohort_enriched_fraction: 0.20  # cohort: >= this fraction HRD-scar-high → hrd_enriched
  hrd_scar_cohort_rare_fraction: 0.05      # cohort: <= this → hrd_rare

caveats:
  - "INDICATION-LEVEL + target-INDEPENDENT: aneuploidy + WGD are genome-wide cohort phenotypes, not per-gene calls. The classes describe the indication's chromosomal instability / doubling prevalence, not the target — a target's own copy-number is copy-number-distribution; its two-hit state is functional-gene-state."
  - "Per-SAMPLE genome-wide instability (frac_altered), NOT per-arm. A per-arm arm-loss / per-lineage-selectivity-percentile view needs Taylor-2018 arm-level calls (not yet ingested) — deferred. DISPLAY facet, verdict-inert."
  - "WGD prevalence (wgd_class / wgd_fraction) is from PanCanAtlas ABSOLUTE Genome-doublings (>=1 doubling), the sibling of the aneuploidy burden — the two axes correlate (WGD-enriched cohorts run higher frac_altered + ploidy) but are reported separately. High WGD is a copy-number-noise + prognosis caveat, NOT a target-specific amplification signal."
  - "PATIENT MSI (msi_class / msi_high_fraction) is from TCGA marker-paper labels, CRC + STAD ONLY — other indications return data_unavailable (UNLABELLED, NOT a measured 0% MSI-high). The MODEL arm (model_msi_class, DepMap MSIsensor) FILLS this gap: all-lineage, so NSCLC/PAAD get a measured model_msi_class where patient msi_class is unavailable. A genome-wide PATIENT MSIsensor score is a deferred derivation. Cohort-level, target-independent."
  - "MODEL MSI (model_msi_class / model_msi_high_fraction) is DepMap cell-line MSIsensor (MSIScore >= 20 = MSI-H), a MODEL-cohort property — NOT patient prevalence (MSI-H lines are over-represented vs tumours, so model fractions can run higher). DepMap 26q1 merges gastric with esophageal into 'Esophagus/Stomach', so GC/STAD/ESCA model MSI is broader than gastric alone (dilutes vs the patient STAD label). Where both arms exist they cross-validate; where they differ, note the cohort difference."
  - "MODEL MMR-SIGNATURE (model_mmr_signature_class) is DepMap SBS exposures normalized per-model; MMR-deficiency signatures (SBS6/14/15/21/26/44) are an INDEPENDENT cross-validation of the MSI axis — a different signal (mutation spectrum, not microsatellite length) that tracks it closely (uterus/bowel enriched, lung rare). Reported as the FRACTION of lines MMR-sig-high (a subset phenomenon; the cohort median sits at MSS baseline)."
  - "model_hrd_signature_present_fraction (SBS3, defective-HR) is a WEAK PARP-sensitivity proxy ONLY: SBS3 is flat/featureless and rarely dominates a cell line's spectrum, so a low 10% presence threshold is used and near-zero fractions are expected. A real HRD / genomic-scar score (scarHRD-style, allele-specific CN) is a deferred derivation. Do NOT read a low HRD-signature fraction as HR-proficient."

# DATA_TO_SKILL_CONTRACT Rule 1 — view of the `genomic_instability_state` claim.
measurement_type: genomic_instability_state
entity_grains: [cohort]
schema_version: 1
