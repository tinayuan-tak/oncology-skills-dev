# Card — TUMOR EXPRESSION DISTRIBUTION (per-sample RNA; TCGA)
#
# The PER-SAMPLE tumor RNA distribution the existing expression cards can't produce.
# cellline-rna-distribution is CELL-LINE (DepMap); tumor-rna-vs-adjacent emits a
# whole-cohort AGGREGATE (median + one log2FC). This card answers the 12-question spec's
# Q1 ("is the target expressed in human tumors, and how does expression DISTRIBUTE across
# patients?") from the per-sample TCGA long product — the fraction of patients above a
# threshold (more actionable than the median), the shape (continuous | bimodal | long_tail
# → target-high/-low populations for patient selection), and variability.
#
# PRESENCE-side card (Gate A / tumor-presence skill) — a distribution/abundance signal,
# NOT a tumor-vs-normal contrast (that is tumor-vs-normal-selectivity, Gate B). Presence and
# selectivity stay SEPARATE. The matched-normal fraction-above-p95 fields here are an overlay
# for context; the selectivity CONTRAST lives on the selectivity card.

card_id: tumor-rna-distribution
version: 0.2.0
question: "How does {target.symbol} RNA expression DISTRIBUTE across {indication.label} tumors — median, fraction of patients detectable/high, and shape (continuous, bimodal, long-tail)?"

tier: indication   # the POOLED per-indication tumor distribution; the target_subtype grain lives on the
                   # sibling tumor-rna-distribution-by-subtype card (the framework's grain-split convention)

subgroup_stratification:
  eligible: true
  status: out_of_scope   # this POOLED card does not stratify — the target_subtype grain is served by the
                         # separate live sibling tumor-rna-distribution-by-subtype (per the grain-split
                         # convention: pooled target_indication card BESIDE a tier:subtype panorama card).
  axes: [molecular_subtype]
  rationale: "Subtype stratification for this measurement_type is served by the sibling card tumor-rna-distribution-by-subtype (tier:subtype, LIVE — binds the per-sample stratified reader read_tumor_expression_subtype_landscape via the TCGA UUID↔barcode bridge). This pooled card stays at target_indication grain; splitting the panorama onto a separate card is the framework convention (cf. crispr_lof_dependency: pooled distribution cards beside subgroup-stratified-dependency)."

applies_when:
  # the indications the TCGA long product + INDICATION_TO_TCGA_STUDIES map cover
  - "context.indication in ['COADREAD', 'COAD', 'READ', 'LUAD', 'LUSC', 'BRCA', 'PAAD', 'PDAC', 'SKCM', 'STAD', 'PRAD', 'OV', 'KIRC', 'GBM', 'LGG', 'HNSC', 'BLCA', 'LIHC', 'CESC', 'ESCA']"

required_inputs:
  - product_id: tcga-tumor-tpm-recount3-long-v1        # per-sample tumor TPM (the distribution substrate)
  - product_id: gtex-tpm-recount3-long-v1              # matched-normal overlay for the p95 context fields

methods:
  - call: tcga-gtex-expression-distribution
    args:
      target: "{target.symbol}"
      indication: "{indication}"
  # Additive patient-SPLICING facet (2026-08-07, roadmap #2 patient arm). ORTHOGONAL to the
  # expression-LEVEL fields above: those say how MUCH / how BROADLY the gene is expressed;
  # this says whether its SPLICING is dysregulated in patient tumours (TCGA SpliceSeq PSI).
  # The patient complement to the model-arm isoform facet on cellline-rna-distribution.
  # Reads tcga-spliceseq-psi-per-gene-v1. Verdict-inert — display + LLM context only.
  - call: tcga-spliceseq-psi
    args:
      target: "{target.symbol}"
      indication: "{indication}"

outputs:
  summary_fields:
    - tumor_expression_class                    # PRIMARY categorical (drives Tier-2 rules)
    - n_tumor_samples
    - median_log2tpm                            # per-sample median (not a cohort aggregate)
    - p95_log2tpm
    - p99_log2tpm
    - detectable_fraction                       # fraction of tumors >= detectable (log2TPM>=1 / TPM~1)
    - moderate_fraction                         # >= moderate (log2TPM>=3.46 / TPM~10)
    - high_fraction                             # >= high (log2TPM>=5.67 / TPM~50)
    - coefficient_of_variation                  # on LINEAR TPM — expression consistency vs variability
    - distribution_pattern                      # continuous | bimodal | long_tail (patient-population shape)
    - studies                                   # TCGA study code(s) backing the indication
    # matched-normal OVERLAY (context, not the selectivity verdict — that's the selectivity card):
    - matched_normal_tissue
    - n_normal_samples
    - fraction_tumor_above_normal_p95           # Q2 headline enrichment metric (normal-relative)
    - fraction_tumor_above_normal_p99
    - distribution_overlap_tumor_normal         # OVL ∈ [0,1]; 0 = clean separation
    # All-gene percentile null (additive, Phase 1C 2026-08-05): where the tumor MEDIAN
    # log2(TPM+1) falls among ALL genes measured in THIS indication's TCGA tumor cohort. A
    # single-gene predicate-pushdown lookup of the precomputed allgene-tumor-rank-v1 (NO
    # multi-GB long-product re-scan); the null is drawn PER-STUDY (never pooled across
    # indications — the anti-pooling audit guard is the context string). Answers "is a median
    # of 3.97 high?" in the disease-tissue frame (KRAS 84th mid vs CEACAM5 99.9th top_1pct in
    # COADREAD). One-directional: display + companion categorical; NEVER moves tumor_expression_class.
    - allgene_percentile                         # float 0-100 (or null) — tumor-median rank among all genes, mean over the indication's studies
    - allgene_percentile_class                   # categorical (drives rules if wired)
    - allgene_percentile_context                 # string — source + studies the null was drawn from (audit)
    - allgene_percentile_by_study               # {study: pct} — per-TCGA-study breakdown (multi-study transparency)
    # Control-benchmark position (additive, Phase 2 2026-08-05): where the tumor-median
    # percentile sits relative to CURATED positive/negative control genes on the SAME
    # per-study tumor scale (tumor_presence_controls.yaml), with INDICATION-MATCHED negatives
    # (a lineage-marker negative like SFTPC is dropped in its own lineage — negative in colon,
    # excluded in lung). Turns a bare percentile into "above N/M positives; above N/M negatives".
    # One-directional: display + companion categorical; NEVER moves tumor_expression_class.
    - control_position_class                     # categorical (drives rules if wired)
    - control_position                           # string — "above N/M positive(s); above N/M negative(s)"
    - control_positives                          # {symbol: percentile} — positive anchors on this indication's scale
    - control_negatives                          # {symbol: percentile} — applicable negative anchors
    - control_negatives_excluded_lineage_conflict # [symbol] — lineage-marker negatives dropped (marker in THIS tissue)
    - control_position_context                   # string — controls vocab + indication normal tissue + scale (audit)
    # Patient-SPLICING facet (additive, 2026-08-07, roadmap #2 patient arm). Is this gene's
    # SPLICING dysregulated in patient tumours? From TCGA SpliceSeq per-event PSI: variability
    # across tumours + tumour-vs-matched-normal PSI shift. ORTHOGONAL to the expression-LEVEL /
    # percentile / control axes (how MUCH vs which SPLICE EVENTS shift). The patient complement
    # to the model-arm isoform facet (cellline-rna-distribution). Verdict-inert: display + LLM
    # context; NEVER moves tumor_expression_class. From tcga-spliceseq-psi-per-gene-v1.
    - splicing_dysregulation_class               # categorical (see vocabulary); verdict-inert
    - n_splice_events                            # int — annotated alternative-splicing events for the gene
    - max_event_psi_std                          # float — max across events of tumour PSI std (variability)
    - median_event_psi_std                       # float — median event PSI std
    - n_variable_events                          # int — events with tumour PSI std >= 0.10
    - n_tumor_shifted_events                     # int/null — events shifted vs matched normal (null if no normals)
    - dominant_event_splice_type                 # string — splice class (ES/AA/AD/RI/AP/AT/ME) of the most-variable event
    - splicing_context                           # string — human-readable splicing summary (audit)

  summary_fields_vocabulary:
    tumor_expression_class:
      - broadly_high                            # high_fraction >= 0.5 — most tumors highly express
      - broadly_detected                        # detectable_fraction >= 0.7 (not high) — present in most tumors
      - subset_high                             # bimodal/long_tail with a real high minority (high_fraction >= 0.1) — target-high/-low populations
      - broadly_moderate                        # detectable in a middling fraction
      - broadly_low                             # detectable_fraction < 0.3 — present in a minority
      - data_unavailable                        # target absent from TCGA long product for this indication (coverage gap, NOT a measured negative)
    distribution_pattern:
      - continuous                              # unimodal spread
      - bimodal                                 # a separable target-high + target-low subset (patient-selection shape)
      - long_tail                               # mostly-off with a rare high-expressing tail
    allgene_percentile_class:
      - top_1pct                                # >= top_1_percentile cutoff
      - top_decile                              # >= top_decile cutoff
      - mid
      - bottom_decile                           # <= bottom_decile cutoff
      - data_unavailable
    control_position_class:
      - above_all_positives                     # target >= every applicable positive control
      - within_positives                        # target among the positives (>= at least one, below the max)
      - above_negatives_below_positives         # clears every (floor) negative but below all positives
      - below_negatives                         # below the highest non-housekeeping (silent/lineage) floor
      - data_unavailable
    splicing_dysregulation_class:
      - tumor_shifted                           # >=1 event with |median tumour - median normal| PSI >= 0.10 (directional tumour change)
      - highly_variable                         # >=1 event with tumour PSI std >= 0.10 (dynamic splicing, no normal contrast)
      - stable                                  # no variable/shifted event — splicing is flat across the cohort
      - data_unavailable                        # gene/indication absent from the SpliceSeq product (coverage gap)

  figures:
    - id: expression_distribution_per_sample
      type: per_sample_tumor_normal_distribution
      description: "Per-sample tumor (TCGA) vs matched-normal (GTEx) log2(TPM+1) distribution (box + strip), with the normal-p95 line and the fraction-of-tumors-above-p95 annotation. Shows the distribution SHAPE + the target-high subset the median hides."
      preferred_surfaces: [markdown, ppt, decision_memo]
      primary: true
  plot_data: per_sample_tumor_normal_long_format

thresholds:
  # ABSOLUTE cutoffs (log2(TPM+1)) — anchored to DepMap's expressed/highly-expressed convention
  # for cross-target/cross-indication consistency (mirrors cellline-rna-distribution).
  detectable_log2tpm: 1.0                       # TPM ~1
  moderate_log2tpm: 3.46                        # TPM ~10
  high_log2tpm: 5.67                            # TPM ~50
  broadly_high_min_high_fraction: 0.5
  broadly_detected_min_fraction: 0.7
  broadly_low_max_fraction: 0.3
  # ENRICHMENT cutoff (normal-relative) — the Q2 headline metric percentile.
  normal_enrichment_percentile: 95
  # all-gene percentile-class cutoffs (method bins allgene_percentile → allgene_percentile_class)
  allgene_top_1_percentile: 99.0
  allgene_top_decile: 90.0
  allgene_bottom_decile: 10.0

warning_predicates:
  - warning_id: low_tumor_sample_count
    if: "n_tumor_samples < 30"
    message: "Fewer than 30 tumor samples for this indication — distribution shape (bimodality, tail) is weakly powered. Interpret distribution_pattern cautiously."
  - warning_id: no_matched_normal
    if: "n_normal_samples == 0"
    message: "No matched GTEx normal for this indication — the fraction-above-normal-p95 overlay is unavailable; distribution stats are tumor-only."

caveats:
  - "Per-sample log2(TPM+1) from recount3/GENCODE-v26 (same pipeline as GTEx normal → directly comparable)."
  - "distribution_pattern uses a dependency-light gap heuristic (not a KDE/dip test), robust on small panels; a `bimodal` call is a patient-selection hypothesis, not a statistical guarantee."
  - "RNA distribution does not imply protein; pair with the CPTAC protein cards for ADC/TCE decisions."
  - "The fraction_tumor_above_normal_p95 fields are a matched-normal OVERLAY for context; the tumor-vs-normal selectivity VERDICT lives on tumor-vs-normal-selectivity (Gate B), kept separate from this presence/distribution card."
  - "The splicing_* fields are from TCGA SpliceSeq per-event PSI (patient tumours), a SEPARATE substrate from the recount3 expression above; they measure alternative-splicing dysregulation, not expression level, and never move tumor_expression_class."
  - "splicing_dysregulation_class is a bulk-cohort POPULATION view: a low-frequency/context-specific cancer isoform (e.g. AR-V7 in castration-resistant disease, largely absent from treatment-naive TCGA) reads 'stable' because it does not move cohort PSI variance. This is orthogonal to the curated isoform_selective_targets guardrail, by design; absence of a shift is not absence of a clinically-relevant isoform."
  - "n_tumor_shifted_events is null when the indication has no matched normals (9/33 TCGA cohorts); in that case only the variability signal (highly_variable/stable) is available, not the tumour-vs-normal shift."

measurement: bulk_rna
sample_context: tumor         # patient tumor per-sample (TCGA) — orthogonal to measurement

measurement_type: tumor_expression_distribution
entity_grains: [target_indication]
schema_version: 1
