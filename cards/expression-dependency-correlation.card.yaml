# Card — EXPRESSION-DEPENDENCY CORRELATION  (pure-data, v2)
#
# Question: "Does {target}'s mRNA expression correlate with its own Chronos
# dependency across cell lines?"  A strong NEGATIVE correlation (high expression
# → strongly dependent, more-negative Chronos) is the canonical biomarker
# hypothesis — expression could stratify responders. A positive correlation is
# anomalous and worth flagging (possible paralog compensation).
#
# v2 refactor 2026-06-30: pure-data shape. interpretation_hints removed; normative
# logic lives in target-contracts/interpretation-rules/intracellular-intrinsic.
# rules.yaml. Card emits the descriptive correlation_class vocabulary directly.
#
# Pairs with E1a/E1b/E1c (CRISPR + RNAi + concordance), E2 (lineage selectivity),
# E3.a/E3.b (expression + CN), E4 (mutation type counts), and the reactivated
# mutation-stratified-dependency card to complete the cell-line evidence cluster.
#
# Inputs (DepMap 26Q1):
#   - CRISPRGeneEffect.csv — cell_line × gene Chronos matrix
#   - OmicsExpressionTPMLogp1HumanProteinCodingGenes.csv — cell_line × gene
#     log2(TPM+1) matrix; first 5 columns are metadata; filter to
#     IsDefaultEntryForModel == True for one row per ModelID.
#   - Model.csv — cell-line metadata (OncotreeLineage primary)

card_id: expression-dependency-correlation
version: 2.0.0                                  # bumped 2026-06-30: pure-data v2 refactor
question: "Across DepMap cell lines, does {target.symbol} mRNA expression correlate with its own Chronos dependency? (Expression-as-biomarker hypothesis.)"

applies_when:
  - "target.depmap_screened == true"
  - "target.depmap_expression_measured == true"

required_inputs:
  - product_id: depmap-consortium-26q1
    release_pin: "{release_pin}"

methods:
  - call: depmap-expression-dependency
    module: depmap_expression_dependency
    entrypoint: read_expression_dependency
    args:
      target: "{target.symbol}"
      release_pin: "{release_pin}"

outputs:
  summary_fields:
    # === Correlation primary metrics ===
    - pearson_r                                  # Pearson r across all panel cell lines
    - pearson_p                                  # two-sided p-value
    - spearman_r                                 # rank-based (robust to outliers)
    - spearman_p
    - n_cell_lines_evaluated
    # === Sample distribution context ===
    - mean_chronos
    - mean_tpm_logp1
    - tpm_iqr                                    # range of expression across panel — narrow IQR = correlation unreliable
    - chronos_iqr
    # === Stratified summaries (top vs bottom expression quartile) ===
    - chronos_at_high_expression                 # median Chronos in top-quartile expressers
    - chronos_at_low_expression                  # median Chronos in bottom-quartile expressers
    - delta_chronos_top_vs_bottom_quartile       # difference — large negative = strong stratification
    # === Lineage breakout for biomarker context ===
    - top_lineages_by_dependence_high_expression # list of {lineage, n_high_expr, mean_chronos_high_expr}
    # === Categorical (drives Tier-2 rules) ===
    - correlation_class

  summary_fields_vocabulary:
    correlation_class:
      - strong_negative                          # r ≤ -0.4 AND p ≤ 0.01 — canonical biomarker hypothesis
      - moderate_negative                        # r ≤ -0.2 AND p ≤ 0.01 — supports but not dominant
      - weak_negative                            # -0.2 < r ≤ -0.1 — directionally consistent but not conclusive
      - no_correlation                           # -0.1 < r ≤ 0.2 — null
      - positive_anomaly                         # r > 0.2 — anomalous (paralog compensation, etc.)
      - data_unavailable

  figures:
    - id: scatter_with_regression
      type: expression_chronos_scatter
      description: "Scatter of TPM Logp1 (x) vs Chronos (y), lineage-colored, OLS regression line with 95% CI. Reference lines at Chronos=-1.0 (strong dep) and median expression. Annotated with Pearson r/p."
      preferred_surfaces: [markdown, ppt, decision_memo]
      primary: true
    - id: lineage_stratified_scatter
      type: lineage_stratified_scatter
      description: "Small-multiples scatter, one panel per top-6 lineage (by n cells). Same axes; reveals lineage-specific biomarker signal that pan-cancer averaging dilutes."
      preferred_surfaces: [html, markdown_alt]
  plot_data: per_cell_line_chronos_tpm_with_lineage

# interpretation_hints REMOVED 2026-06-30 (v2 refactor) — normative interpretation
# moved to target-contracts/interpretation-rules/intracellular-intrinsic.rules.yaml.
# Rules consume correlation_class directly. See rule_ids:
#   - expression-biomarker-supportive (correlation_class == strong_negative, dominant)
#   - and the additional correlation_class rules added in the v2 refactor

thresholds:
  # Correlation strength bands (Pearson r; NEGATIVE = expression correlates with stronger dependency)
  strong_correlation_r: -0.4
  moderate_correlation_r: -0.2
  weak_correlation_r: -0.1
  positive_anomaly_r: 0.2
  # Significance gate (Bonferroni-relaxed; pan-cancer correlations with n>=100 reach this easily)
  significance_alpha: 0.01
  # Biomarker viability gate — high-expressers must be at least moderately dependent
  biomarker_chronos_threshold: -0.5
  # Sample-size discipline
  min_cell_lines_for_correlation: 50
  # Range discipline — correlation requires variance in both axes
  min_tpm_iqr: 1.0                              # log2(TPM+1) units
  min_chronos_iqr: 0.3
  # Pan-essential confound — when gene is broadly essential, correlation is dominated by tissue identity
  pan_essential_median_chronos: -0.5

threshold_roles:
  biomarker_chronos_threshold:
    role: method_parameter
    consumed_by: depmap-expression-dependency
  significance_alpha:
    role: method_parameter
    consumed_by: depmap-expression-dependency
warning_predicates:
  - warning_id: low_n_cell_lines
    if: "n_cell_lines_evaluated < THRESHOLD.min_cell_lines_for_correlation"
    message: "Fewer than 50 cell lines with both expression + Chronos data; correlation estimate has wide confidence interval. Read alongside scatter plot."
  - warning_id: narrow_expression_range
    if: "tpm_iqr < THRESHOLD.min_tpm_iqr"
    message: "Expression range across the panel is narrow (IQR < 1 log2 unit); correlation is unreliable when expression doesn't vary. Biomarker hypothesis may not be testable in cell lines."
  - warning_id: pan_essential_confound
    if: "mean_chronos < THRESHOLD.pan_essential_median_chronos"
    message: "Pan-cancer mean Chronos indicates broad essentiality; expression-dependency correlation may be confounded by tissue-of-origin patterns rather than reflecting a biomarker. Read alongside Card 1 (pan-cancer-crispr-dependency-distribution)."

caveats:
  - "Correlation reflects cell-line behavior; in-vivo expression-stratification may differ due to tumor microenvironment + heterogeneity."
  - "TPM Logp1 is log2(TPM+1) — measures bulk mRNA, not protein abundance; pair with proteomics card when available."
  - "A strong negative correlation is necessary but NOT SUFFICIENT for a clinical biomarker — needs orthogonal validation (e.g. PDX, GTEx normal context)."
  - "Lineage-stratified figure may reveal that pan-cancer correlation is driven by 1-2 dominant lineages; biomarker hypothesis may be lineage-specific."
  - "Cell lines with metadata IsDefaultEntryForModel == False are excluded; some ModelIDs may have multiple sequencing entries — only the canonical one is used."

# DATA_TO_SKILL_CONTRACT Rule 1/4 — view of the DERIVED `expression_dependency_correlation` claim
# (does mRNA correlate with own dependency?), derived_from [cell_line_rna_expression,
# crispr_lof_dependency]. Comparison-is-the-claim → derived even though single-dataset-sourced
# (appendix case 7); the card doesn't self-declare derived_from but the type edge captures it.
measurement_type: expression_dependency_correlation
entity_grains: [target, target_lineage]
schema_version: 1
