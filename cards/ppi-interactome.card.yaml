# Card — PPI INTERACTOME (v1; target-intrinsic)
#
# The INDICATION-INDEPENDENT protein-protein-interaction view of a target: how connected is the
# protein (STRING high-confidence functional network) and is it a member of any stable protein
# complex (CORUM). Two biologically-distinct signals, NOT collapsed:
#   - STRING functional NETWORK: n high-confidence interactors (combined_score >= 700) + top partners.
#   - CORUM stable COMPLEX membership: which named complexes (proteasome, mediator, BAF, ...) — a
#     stronger target-intrinsic signal (complex identity implies function; complex members are often
#     harder to drug in isolation).
#
# Target-intrinsic (cancer-independent). Consumed by the target-intrinsic dossier. Descriptive, no verdict.
#
# interactome_class (PRIMARY): hub (>=50 HC interactors) | connected (>=10) | sparse (>=1) |
#   no_high_confidence_interactors | data_unavailable.

card_id: ppi-interactome
version: 1.0.0
question: "How connected is {target.symbol} in the STRING functional network, and is it a member of any CORUM protein complex?"

tier: target   # the interactome is a property of the protein, independent of indication

applies_when:
  - "context.data_sources.string_available == true"

required_inputs:
  - product_id: string-v12-human-snapshot-2026-06-30   # STRING functional network (links + info)
  - product_id: corum-5-3                               # CORUM stable-complex membership
  - product_id: biogrid-physical-interactions-per-gene-v1   # BioGRID experimental-physical interactions (method 1.1.0)

derived_from:
  - card_id: target-identity-summary   # symbol resolution (STRING self-contained; CORUM via UniProt sidecar)

methods:
  - call: ppi-interactome
    args:
      target: "{target.symbol}"

outputs:
  summary_fields:
    - interactome_class              # PRIMARY (hub | connected | sparse | no_high_confidence_interactors | data_unavailable)
    - n_high_confidence_interactors  # STRING combined_score >= 700 degree
    - top_interactors                # list<{partner, combined_score}> — top 15 by score
    - n_corum_complexes              # count of CORUM complexes the target is a member of
    - corum_complexes                # list<{corum_id, complex_name}> — top 15
    - in_protein_complex             # bool — member of >=1 CORUM complex
    - string_protein_id              # provenance: the STRING ENSP id resolved
    # BioGRID experimental-PHYSICAL leg (method 1.1.0) — a THIRD distinct signal, reported
    # alongside STRING/CORUM (never merged): direct experimentally-observed physical binding,
    # ranked by supporting-publication count. Complements STRING's functional-association score.
    - physical_interactome_class     # physical_hub | physically_connected | physically_sparse | no_physical_interactors | data_unavailable
    - n_physical_interactors         # distinct BioGRID physical partners
    - top_physical_partners          # list<{partner, n_publications, n_experiments}> — top 15 by publication evidence

  summary_fields_vocabulary:
    interactome_class:
      - hub
      - connected
      - sparse
      - no_high_confidence_interactors
      - data_unavailable
    physical_interactome_class:
      - physical_hub
      - physically_connected
      - physically_sparse
      - no_physical_interactors
      - data_unavailable

warning_predicates:
  - warning_id: not_in_string_or_corum
    if: "interactome_class == 'data_unavailable'"
    message: "{target.symbol} was not resolvable in STRING v12 or CORUM. Interactome is UNKNOWN, not empty — a coverage/resolution gap, never 'has no interactions'."
  - warning_id: hub_promiscuity_caveat
    if: "interactome_class == 'hub'"
    message: "{target.symbol} is a STRING hub (>=50 high-confidence interactors). High connectivity can indicate a promiscuous/central protein — interpret 'interactor' lists as functional-association context, not direct binary binding partners (STRING combines many evidence channels)."

caveats:
  - |
    Two signals reported SEPARATELY, never merged: STRING functional-association degree (how connected)
    vs CORUM stable-complex membership (part of a named machine). STRING edges are multi-channel
    functional associations (co-expression, text-mining, databases, experiments), NOT necessarily
    direct physical binding; the high-confidence cutoff (combined_score >= 700) is STRING's canonical
    threshold. CORUM complexes are curated stable assemblies.
  - |
    Target-intrinsic (cancer-independent): the same regardless of indication. This card takes no
    indication and emits no verdict — descriptive molecular context for the target-intrinsic dossier.
  - |
    THIRD signal (method 1.1.0, SHIPPED 2026-08-05): BioGRID experimental-PHYSICAL interactions
    (physical_interactome_class + n_physical_interactors + top_physical_partners), from
    biogrid-physical-interactions-per-gene-v1 (BioGRID 5.0.259). Unlike STRING's functional score,
    these are experimentally-OBSERVED physical bindings, ranked by distinct supporting-publication
    count (evidence depth + traceability, e.g. TP53-MDM2 in 504 papers). Alongside STRING/CORUM, never merged.
  - |
    Symbol resolution: STRING is self-contained (9606.protein.info maps symbol<->ENSP); CORUM
    (UniProt-AC-keyed) resolves symbol->AC via a target_id_resolver sidecar. Pinned to STRING v12 +
    CORUM 5.3. License: STRING CC-BY-4.0; CORUM CC-BY-NC-4.0 (non-commercial).

# DATA_TO_SKILL_CONTRACT Rule 1 — view of the `ppi_interactome` claim (target-grain).
# No measurement/sample_context — expression-family-only fields; this is a reference-annotation card.
measurement_type: ppi_interactome
entity_grains: [target]
schema_version: 1
