# Card 4 of 5 — iter-1 vertical slice
# Exercises: the `pinned` data mode end-to-end (Tempus CRC deposit is pinned by deposit date)
# Honesty note: Tempus is pre-aggregated upstream — pinning here pins an opaque CSV column,
# not sample-level lineage. See plan Tier-3 honest-limitation discussion (post-adversarial-review T3.1).

card_id: rwd-stratified-expression
version: 1.1.0
status: placeholder_not_wired   # Tempus RWD is commercial/unlanded; compose emits availability_state=not_wired. Already in optional_cards (not required) — status added for consistency.
question: "How does {target.symbol} expression vary across treatment-line strata in real-world {indication.label} RWD?"

tier: subtype

# BLOCKED (2026-07-16): treatment-line biology genuinely varies (filter 1 met),
# but Tempus RWD is PRE-AGGREGATED upstream — the card's own honesty note (below)
# says the `pinned` mode pins "an opaque CSV column, not sample-level lineage."
# With no per-sample substrate the framework cannot recompute a metric within each
# stratum's member-set (filter 2 FAILS). Tagged not-live; the `per_stratum_metrics`
# record field is dropped until a per-sample RWD reader exists. Grain-check enforced.
subgroup_stratification:
  eligible: true
  status: blocked_needs_per_sample_reader
  axes: [line_of_therapy, ras_mutation_status]
  rationale: "Tempus RWD is pre-aggregated upstream (opaque CSV columns, no sample-level rows); cannot recompute per-stratum. Needs a per-sample RWD substrate."

applies_when:
  - "indication.has_pre_aggregated_rwd == true"
  - "indication.rwd_strata_include_target == true"

required_inputs:
  - product_id: tempus-rwd-stratified-expression
    indication: "{indication}"
    release_pin: "{release_pin}"

methods:
  - call: tempus-rwd-aggregator
    args:
      target: "{target.symbol}"
      indication: "{indication}"
      release_pin: "{release_pin}"
      strata: "all_available"

outputs:
  # `per_stratum_metrics` DROPPED 2026-07-16 — card blocked (see
  # subgroup_stratification above): Tempus RWD is pre-aggregated, no per-sample
  # substrate to recompute per-stratum. Reducer scalars describe intended output
  # once a per-sample RWD reader ships.
  summary_fields:
    - n_strata_with_data
    - max_stratum_size
    - min_stratum_size
    - cross_stratum_delta_median
    - cross_stratum_delta_pct_detected
  figure: stratum_bar_with_detection_rate
  plot_data: per_stratum_aggregate_metrics

interpretation_hints:
  - if: "cross_stratum_delta_median >= THRESHOLD.meaningful_delta_median"
    call: "meaningful cross-stratum variation"
  - if: "cross_stratum_delta_median < THRESHOLD.meaningful_delta_median && min_stratum_size >= THRESHOLD.min_stratum_size_for_call"
    call: "no meaningful cross-stratum variation"
  - if: "min_stratum_size < THRESHOLD.min_stratum_size_for_call"
    call: "not informative"

thresholds:
  meaningful_delta_median: 0.3       # log2(TPM+1) units; iter-1 conservative default
  min_stratum_size_for_call: 100     # below this, stratum metrics have wide CIs

caveats:
  - "Tempus RWD is pre-aggregated upstream; per-sample lineage and harmonization decisions are not visible. The `pinned` data_mode pins a CSV column hash, not sample-level provenance."
  - "Strata are RAS-mutation-status × treatment-line; reading across strata implicitly conditions on RAS biology."
  - "Detection rate (pct_detected) reflects assay sensitivity in the Tempus panel; cross-platform comparison with TCGA RNA-seq requires care."

# DATA_TO_SKILL_CONTRACT Rule 1 — view of the `rwd_stratified_expression` claim.
measurement_type: rwd_stratified_expression
entity_grains: [target_subtype]
schema_version: 1
