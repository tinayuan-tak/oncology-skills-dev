# Card E5 — DEPENDENCY PREDICTABILITY  (v2 — DepMap-parity + extensions)
#
# Per-target predictability of Chronos CRISPR dependency from a genome-wide
# multi-omics + lineage feature set. Matches DepMap Daintree's published
# methodology (Dempster 2020; cds-daintree pipeline) with three principled
# extensions:
#   1. Bootstrap 95% CI on r² for calibration
#   2. SHAP-based feature attributions alongside RF importances
#   3. RF + XGBoost dual-model with agreement/divergence diagnostic
#   4. Lineage-conditional companion table (per-lineage r² + top feature)
#
# DEPMAP-PARITY (Broad's cds-daintree):
#   Model:         RandomForestRegressor(n_estimators=100, max_depth=8,
#                                          min_samples_leaf=5)
#   CV:            3-fold QuantileKFold (quantile-stratified splitter)
#   Feature red.:  SelectKBest(f_regression, k=1000) inside each CV fold
#   Metric:        Pearson r (portal DB column literally named `pearson`)
#   High-conf:     r ≥ 0.4 (r² ≥ 0.16) matches DepMap's binned taxonomy floor
#
# DEPMAP-PARITY FEATURES (target-own + genome-wide + context):
#   own_expression, own_copy_number, own_mut_hotspot, own_mut_damaging
#   cross_gene_expression (all ~19k protein-coding genes, target excluded)
#   cross_gene_copy_number (all ~38k CN entries, target excluded)
#   arm_level_cn (chromosome-arm-mean CN; ~48 arms) — matches Daintree's
#     transform_genetic_derangement
#   oncokb_gof / oncokb_lof — inferred from OncoKB gene roles × DepMap hotspot/
#     damaging matrices. Approximates Daintree's transform_driver_events using
#     only public data (delta documented in derived manifest).
#   lineage — one-hot of Model.csv.OncotreeLineage
#
# DEPMAP-PARITY GAPS (documented, queued for v2.1 if anchor validation shows
# these matter):
#   - Fusion status matrix (not yet in data-catalog)
#   - RPPA proteomics
#   - RRBS methylation, metabolomics, ssGSEA
#   - DepMap's dynamic MatchRelated related-entity lookup

card_id: dependency-predictability
version: 2.0.0
question: "How well can {target.symbol}'s Chronos dependency be predicted from a genome-wide multi-omics + lineage feature set? Is the dependency biomarker-anchored (target-own omics dominate), context/driver-dependent (lineage/arm/co-driver flags dominate), or unpredictable (standard features don't explain Chronos)?"

applies_when:
  - "context.data_sources.depmap_predictability_available == true"

required_inputs:
  - product_id: depmap-predictability
    release_pin: "26q1-v2"

methods:
  - call: depmap-predictability
    args:
      target: "{target.symbol}"
      release_pin: "26q1-v2"

outputs:
  summary_fields:
    # Core predictability scalars
    - pred_n_cell_lines_evaluated       # n cells with complete-case features
    - pearson_r_rf                      # Pearson r of OOF preds vs truth (RF)
    - pearson_r_squared_rf              # r_rf² (primary DepMap-parity scalar)
    - pearson_r_squared_rf_ci_lo        # bootstrap 95% CI lower bound
    - pearson_r_squared_rf_ci_hi        # bootstrap 95% CI upper bound
    - pearson_r_xgb                     # XGBoost companion
    - pearson_r_squared_xgb
    - model_agreement                   # 'concordant' | 'divergent' | 'single_model'
    - delta_r2                          # r²_rf - r²_xgb (dual-model divergence)
    # Feature-attribution outputs
    - pred_top_features_rf              # top-10 features by SHAP mean|value|
                                          # struct{feature, feature_class, importance, rf_importance}
    - pred_top_features_xgb             # same for XGBoost
    - pred_dominant_feature             # top-1 feature name
    - pred_dominant_feature_class       # feature-class of the top-1 feature
    - predictability_class              # DESCRIPTIVE (drives Tier-2 rules)
    - per_lineage_predictability        # RF-only per-lineage r² + top-feature table

  summary_fields_vocabulary:
    predictability_class:
      - own_omics_driven                # r²_rf CI lo ≥ 0.35 AND top ∈ target-own
      - context_or_driver_dependent     # r²_rf CI lo ≥ 0.35 AND top ∈ lineage / arm / driver
      - weakly_predictable              # r² ≥ 0.16 (DepMap high-conf) but CI lo < 0.35
      - unpredictable                   # r² < 0.16
      - data_unavailable                # target not in v2 precompute
    pred_dominant_feature_class:
      - own_expression
      - own_copy_number
      - own_mut_hotspot
      - own_mut_damaging
      - cross_gene_expression
      - cross_gene_copy_number
      - arm_level_cn
      - oncokb_gof
      - oncokb_lof
      - lineage
      - unpredictable
      - data_unavailable
    model_agreement:
      - concordant                      # |delta_r2| < 0.1
      - divergent                       # |delta_r2| ≥ 0.1
      - single_model                    # XGBoost unavailable at precompute time
      - data_unavailable

  figures:
    - id: feature_importance_bar
      type: horizontal_bar
      description: "Horizontal bar of top-10 SHAP-ranked features (RF), colored by feature_class. Reads as: dominant navy/red = own-omic biomarker; dominant slate = cross-gene expression / arm-level CN; dominant gray = lineage-context. Title carries r² + bootstrap CI + predictability_class + optional RF↔XGB divergence caveat."
      preferred_surfaces: [markdown, ppt, decision_memo]
      primary: true
    - id: lineage_predictability
      type: horizontal_bar_lineage
      description: "Per-lineage r² horizontal bar (top 12 lineages by r²), each annotated with its within-lineage top feature. Vertical dashed line at r²=0.16 marks DepMap's high-confidence floor. Diagnostic for lineage-collapsed biomarker signals: high pan-cancer r² with all lineages below the floor = signal driven by lineage-differentiated variance."
      preferred_surfaces: [markdown, ppt]

thresholds:
  r2_high_ci_lo: 0.35                   # CI lower bound above → strong-predictor bucket
  r2_depmap_high_conf: 0.16             # DepMap's Pearson r ≥ 0.4 floor
  min_cell_lines_per_gene: 100          # per-gene coverage floor (v2 precompute)
  cv_n_splits: 3                        # matches DepMap Daintree
  select_k_best: 1000                   # per-fold KBest reduction
  bootstrap_n: 500                      # bootstrap resamples for CI
  lineage_min_lines: 30                 # per-lineage refit min-n
  rf_n_estimators: 100
  rf_max_depth: 8
  rf_min_samples_leaf: 5
  xgb_n_estimators: 100
  xgb_max_depth: 6
  xgb_learning_rate: 0.1

warning_predicates:
  - warning_id: predictability_low_cell_line_count
    if: "pred_n_cell_lines_evaluated < 200"
    message: "Predictability fit used fewer than 200 cell lines — R² estimate has higher variance; interpret class call with caution."
  - warning_id: predictability_wide_ci
    if: "(pearson_r_squared_rf_ci_hi - pearson_r_squared_rf_ci_lo) > 0.20"
    message: "95% CI on r² spans more than 0.20 — high uncertainty; a single-run r² point estimate over-states confidence in the biomarker class call."
  - warning_id: predictability_model_divergent
    if: "model_agreement == 'divergent'"
    message: "RF and XGBoost disagree on r² by more than 0.10 — feature-attribution structure differs between tree types. Inspect the top_features_xgb list; a divergent XGBoost identifies an interaction structure RF misses."
  - warning_id: predictability_lineage_collapsed
    if: "predictability_class == 'context_or_driver_dependent' && pred_dominant_feature_class == 'lineage'"
    message: "Lineage one-hot dominates; the model has essentially learned a per-lineage baseline. Patient-selection beyond indication unlikely from standard omics."

caveats:
  - "v2 approximates DepMap Daintree's transform_driver_events (which uses OncoKB's auth-gated per-variant Oncogenic + MutationEffect annotations) with a coarser GENE-ROLE join (OncoKB public gene list × DepMap hotspot/damaging matrices). This means some GoF/LoF flags may be less specific than DepMap's — particularly for genes where OncoKB's per-variant curation resolves ambiguous mutations."
  - "cross_gene_expression + cross_gene_copy_number features fill NaNs with 0 / 1.0 (diploid) respectively rather than dropping rows. This preserves the ~1500-cell CRISPR panel but introduces some noise on the discarded features. SelectKBest inside each CV fold retains only the 1000 most-informative features (per-fold, no leakage) so noise on the discarded features is soft-capped."
  - "predictability_class is DESCRIPTIVE — `unpredictable` means standard features don't explain Chronos, NOT that the dependency is artefactual. Pair with E1/E2 to confirm the dependency itself is real before discounting."
  - "Bootstrap CI on r² is over cell-line indices at the OOF-prediction level. It does NOT propagate uncertainty from feature-selection (KBest inside folds) or hyperparameter choice. A tighter CI would nest bootstrap around the full CV loop — infeasible at ~18k-gene scale."
  - "Own driver flags (driver_{target}_GoF / driver_{target}_LoF) are EXCLUDED from the OncoKB flag feature block for each target — same feature as own_mut_hotspot / own_mut_damaging; would leak label information. Cross-driver flags (driver_TP53_LoF when target=KRAS, etc.) are retained since they capture co-driver context."

schema_version: 1
