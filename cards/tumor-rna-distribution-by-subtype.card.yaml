# Card — TUMOR EXPRESSION DISTRIBUTION BY MOLECULAR SUBTYPE (per-sample RNA; TCGA)
#
# The target_subtype-grain SIBLING of tumor-rna-distribution. Same measurement_type
# (tumor_expression_distribution), same per-sample substrate — but recomputes the distribution
# WITHIN each molecular-subtype member-set of the indication, emitting a per-stratum panorama.
#
# This is the framework's standard grain-split convention: a POOLED target_indication card
# (tumor-rna-distribution) beside a SEPARATE tier:subtype card (this one) — exactly as
# crispr_lof_dependency splits into the pooled distribution cards + subgroup-stratified-dependency.
# The GRAIN-CHECK validator (_grain_and_tier_check) enforces that a card declaring
# per_subgroup_metrics binds a per-sample stratified reader; tcga-gtex-expression-distribution
# (AM #82, read_tumor_expression_subtype_landscape) IS one — it recomputes per stratum via the
# TCGA UUID→barcode→stratum bridge, verified live (0 null bridge, ~92% stratum coverage, KRAS/CRC).
#
# PRESENCE-side (Gate A / tumor-presence). Subtype is CONTEXT/CONFIDENCE, never a veto — the
# one-directional nomination gate is preserved. COMPUTE-ALL-SPOTLIGHT-ONE: the reader computes
# EVERY stratum; a queried subtype spotlights + scopes the verdict downstream, not the computation.

card_id: tumor-rna-distribution-by-subtype
version: 0.1.0
question: "How does {target.symbol} RNA expression DISTRIBUTE across the molecular subtypes of {indication.label} tumors — which subtypes are enriched, depleted, or restricted vs the pooled distribution?"

tier: subtype

subgroup_stratification:
  eligible: true
  status: live
  axes: [molecular_subtype]
  rationale: "Expression distribution varies by molecular subtype (e.g. MLH1 depleted in CIMP-High/CMS1/MSI-H via mismatch-repair silencing; ZEB1 enriched in mesenchymal CMS4). Backed by tcga-gtex-expression-distribution, which recomputes the per-sample distribution within each stratum's member-set via the TCGA UUID↔barcode bridge — not an emit-time aggregate."

applies_when:
  # a landed tumor assignment shard is required. Extended 2026-08-04 from COADREAD-only to the 6
  # indications whose shards have landed AND been VERIFIED to emit real, powered strata (>=30
  # members): COADREAD (7 strata), HNSC (9), STAD (4), NSCLC/LUAD/LUSC (3), ESCA (2), PAAD/PDAC (2).
  # Must stay in lockstep with INDICATION_TO_TUMOR_ASSIGNMENT_MANIFEST in the tcga_gtex_expression_
  # distribution reader (analysis-methods). An indication not listed → subtype_axis_available:False.
  - "context.indication in ['COADREAD', 'COAD', 'READ', 'HNSC', 'HNSCC', 'STAD', 'GC', 'NSCLC', 'LUAD', 'LUSC', 'ESCA', 'PAAD', 'PDAC']"
  - "indication.subgroup_catalog_available == true"

required_inputs:
  - product_id: tcga-tumor-tpm-recount3-long-v1        # per-sample tumor TPM (the distribution substrate)
  - product_id: tcga-tumor-tpm-per-sample-v1           # the UUID↔barcode sidecar (the bridge)
  - product_id: tcga-subgroup-assignments-coadread-v1  # the molecular-subtype assignment shard (barcode-keyed)

methods:
  - call: tcga-gtex-expression-distribution
    args:
      target: "{target.symbol}"
      indication: "{indication}"

outputs:
  summary_fields:
    - per_subgroup_metrics                      # the per-stratum panorama (record schema below)
    - subtype_axis_available                    # is a shard landed for this indication?
    - n_subtypes_measured                       # strata clearing the n-floor
    - n_subtypes_enriched                       # strata flagged subtype_enriched
    - n_subtypes_restricted                     # strata flagged subtype_restricted (present here, absent pooled)
    - subtype_stratification_class              # graded patient-selection signal → biomarker facet stratification_role
                                                # (subtype_restricted_with_window > subtype_restricted > subtype_enriched
                                                #  > pan_subtype_uniform > subtype_axis_unavailable). One-directional:
                                                #  raises CONFIDENCE / defines patient population, NEVER moves presence_verdict.
    - n_subtypes_clearing_normal_window         # strata where >=50% of tumors clear the (matched) normal p95
    - n_subtypes_clearing_proxy_window_by_tissue # {proxy_tissue: count} — the PROXY analogue (multi-valued);
                                                 # null on matched/none comparators (mutually exclusive w/ the above)
    - spotlight_subtype                          # the queried stratum (or null — compute-all)
    - assignment_manifest                        # provenance: the shard consumed
    - matched_normal_tissue                      # true GTEx tissue-of-origin (null when none exists)
    - normal_comparator_type                     # matched | proxy | none — HOW the window was computed
    - proxy_normal_tissues                        # proxy tissues used when no true normal (HNSC etc.)
    # ACROSS-SUBTYPE OMNIBUS (Phase 3, 2026-08-05) — the ANOVA-analogue over the POWERED strata's
    # per-sample vectors. Answers "is subtype a patient-selection axis for this target, and how much
    # of the expression variance does it explain?" Kruskal-Wallis (non-parametric — log2TPM is
    # non-normal/heteroscedastic) + ε² variance-explained EFFECT SIZE. The effect-size CLASS is the
    # decision-relevant field; the p-value is DISPLAY-ONLY (at TCGA n's KW p is near-always
    # significant → significance != actionability; effect size is what discriminates). One-directional
    # display facet — NEVER moves presence_verdict (consistent with the rest of this card).
    - subtype_omnibus_kruskal_h                  # float — the H statistic (or null)
    - subtype_omnibus_p                          # float — asymptotic chi-square p (DISPLAY-ONLY)
    - subtype_variance_explained                 # float — ε² ∈ [0,1] (variance subtype explains)
    - subtype_effect_size_class                  # categorical — large / moderate / negligible / data_unavailable
    - which_subtypes_separate                    # {highest, lowest} stratum ids at the median extremes (or null)
  summary_fields_vocabulary:
    subtype_effect_size_class:
      - large                                    # ε² >= subtype_effect_large (subtype a strong patient-selection axis)
      - moderate                                 # ε² >= subtype_effect_moderate
      - negligible                               # ε² below moderate (subtype not a meaningful selection axis)
      - data_unavailable                         # <2 powered strata / no shard
  summary_fields_record_schemas:
    # record-schema value specs declare the EXPECTED scalar type; a runtime null (e.g. an
    # underpowered stratum's subtype_signal / median) is permitted — the schema types the
    # non-null case, matching the subgroup-stratified-dependency exemplar convention.
    per_subgroup_metrics:
      stratum_id: string
      subtype_signal: {enum: [subtype_enriched, subtype_restricted, subtype_depleted, subtype_uniform], type: string}
      evidence_state: {enum: [measured, underpowered, absent], type: string}
      subgroup_n_floor_met: boolean
      n_tumor_samples: integer
      # absolute distribution depth (parity with the pooled card — Option 1, 2026-08-04)
      median_log2tpm: number
      p95_log2tpm: number
      p99_log2tpm: number
      min_log2tpm: number
      max_log2tpm: number
      coefficient_of_variation: number
      detectable_fraction: number
      high_fraction: number
      moderate_fraction: number
      distribution_pattern: string
      tumor_expression_class: string
      match_rate: number                        # stratum join coverage (id-convention guard)
      # per-subtype matched-normal WINDOW (therapeutic-window / patient-selection — Option 2). Null
      # when the indication has no true matched normal (then see proxy_normal_windows).
      fraction_tumor_above_normal_p95: number
      fraction_tumor_above_normal_p99: number
      normal_p95_log2tpm: number
      normal_p99_log2tpm: number
      distribution_overlap_tumor_normal: number
      # per-subtype PROXY-normal window panel (labeled analogue, weaker evidence — Option 3). One
      # entry per configured proxy tissue; EMPTY list when a true matched normal exists.
      proxy_normal_windows:
        record_schema:
          proxy_tissue: string
          rationale: string
          fraction_tumor_above_proxy_p95: number
          fraction_tumor_above_proxy_p99: number
          proxy_p95_log2tpm: number
          proxy_p99_log2tpm: number
          distribution_overlap_tumor_proxy: number
  figure: expression_distribution_subtype_panel  # per-stratum distribution panel (faceted)

thresholds:
  # per-stratum enrichment cutoff vs the indication's pooled median, in log2TPM units. Declared
  # here (not hardcoded in rules) so it is reviewable. ~0.585 = log2(1.5) ≈ a 1.5x linear-TPM
  # shift — mirrors SUBTYPE_ENRICH_LOG2_DELTA in the method.
  subtype_enrich_log2_delta: 0.585
  subgroup_n_floor: 30                           # underpowered stratum → null signal, never a scoped call
  # across-subtype omnibus ε² (variance-explained) effect-size cutoffs — the method bins
  # subtype_variance_explained → subtype_effect_size_class on these (Cohen-style bands adapted to ε²).
  # Declared here (not hardcoded in rules) so they are reviewable; mirror EPSILON_SQUARED_* in stats.py.
  subtype_effect_large: 0.14
  subtype_effect_moderate: 0.06

caveats:
  - "Landed tumor assignment shards (2026-08-04): COADREAD, HNSC, STAD, NSCLC, ESCA, PAAD. Other indications return subtype_axis_available:false (honest) until their shards land (the subgroup-assignment-shards workstream)."
  - "normal_comparator_type distinguishes matched (true GTEx tissue-of-origin) from proxy (histological analogue, e.g. HNSC→esophagus/skin/salivary — GTEx has no head-and-neck track). A PROXY window is WEAKER evidence: proxy fields live in proxy_normal_windows, NEVER in the matched fraction_tumor_above_normal_* fields. The panel is multi-proxy because a target's window can be strong vs one proxy but weak vs another (EGFR/HNSC: ~86% vs esophagus/salivary but ~33% vs skin)."
  - "A stratum below subgroup_n_floor (n<30) carries distribution stats for context but a NULL subtype_signal — never a scoped call on underpowered data."
  - "The UUID→barcode→stratum bridge drops the ~8% of recount3 samples with no sidecar barcode or no stratum label; a <5% match rate raises the id-convention guard rather than masquerading as empty strata."
  - "MSI-H / CIMP-High stratum biology is dominated by mismatch-repair hypermutation; subtype-specific calls may partly reflect global expression dysregulation, not target-specific signal."
  - "Subtype is confidence/context for patient selection, NOT a new veto — the pooled tumor-rna-distribution card carries the presence verdict; this card enriches it."

# Two orthogonal axes (Slice A1): measurement LAYER + biological SAMPLE. Same as the pooled
# sibling — this card differs only in GRAIN (target_subtype), not measurement/sample_context.
measurement: bulk_rna
sample_context: tumor         # patient tumor per-sample (TCGA), stratified by molecular subtype

# DATA_TO_SKILL_CONTRACT Rule 1 — view of tumor_expression_distribution at target_subtype grain (LIVE per-sample slice).
measurement_type: tumor_expression_distribution
entity_grains: [target_subtype]
schema_version: 1
