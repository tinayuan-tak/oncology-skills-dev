# Card Phase-C-adjacent — PARALOG BUFFERING (v1)
#
# REVIEWER-ADDED card (2026-07-08). Content-reviewer flagged paralog
# buffering as a distinct dependency-hardening signal from co-mutation.
# The plan originally folded this under differentiation-landscape (Phase E);
# this is a category error — paralog buffering is a REQUIREMENT signal
# (a paralog that functionally substitutes when the target is inhibited)
# operating in Phase C, not a differentiation signal. Extends
# functional-requirement skill.
#
# Data: DepMap PARIS 2024 paralog CRISPR screens + Sanger Paralog Screen
# 2023 + Ensembl paralog annotation (WGD-ancestry ohnolog classification).
# References: Ito et al 2021 Nature, De Kegel et al 2021 Cell Systems,
# Dede et al 2020 Genome Biology.
#
# Interpretation surface (paralog_buffering_class is PRIMARY):
#   `strong`  → at least 1 paralog with dep_delta_paired_vs_max_single > 0.5
#   `partial` → at least 1 paralog with 0.2-0.5 delta
#   `none`    → paralogs annotated but no buffering signal
#   `no_paralog` → no functional paralogs in Ensembl compara
#   `data_unavailable` → target not in PARIS or Sanger screen coverage

card_id: paralog-buffering
version: 1.0.0
question: "Does {target.symbol} have functional paralogs that buffer its dependency, and does single-agent inhibition risk paralog-mediated escape?"

applies_when: []

required_inputs:
  - product_id: depmap-paralog-buffering-per-gene-v1

methods:
  - call: depmap-paralog-aggregator
    args:
      target: "{target.symbol}"

outputs:
  summary_fields:
    - paralog_buffering_class                       # PRIMARY categorical
    - n_paralogs_annotated
    - n_paralogs_functionally_buffering
    - functional_paralogs                           # list<struct>
    - strongest_paralog_symbol                      # the MAX-buffering-delta partner — NOT necessarily the
                                                    # biologically-canonical redundant paralog. Ties/near-ties
                                                    # among strong partners are common + meaningful (e.g. CDK4:
                                                    # CDK1 delta 1.57 edges CDK4/6 delta 1.48). Read the ranked
                                                    # `functional_paralogs` list for the full picture.
    - strongest_paralog_ohnolog                     # bool | null (null = not annotatable on this read; see status)
    - strongest_paralog_ohnolog_status              # annotated | unknown_fallback | data_unavailable (2026-08-08):
                                                    # provenance of the ohnolog flag, so a null is never read as False
    - strongest_paralog_delta                       # float; dep_delta_paired_vs_max_single
    - screen_source_summary                         # list<string>; 'PARIS_2024' | 'Sanger_2023'
    - method_version

  summary_fields_vocabulary:
    paralog_buffering_class:
      - strong
      - partial
      - none
      - no_paralog
      - data_unavailable
    strongest_paralog_ohnolog_status:
      - annotated          # primary derived-product read — the ohnolog flag is a real Ensembl-Compara annotation
      - unknown_fallback   # raw-CSV fallback (product unreachable) — ohnolog NOT computable; flag is UNKNOWN, not False
      - data_unavailable   # no paralog data at all — nothing to annotate

  figure: paralog_buffering_forest_with_ohnolog_flag

thresholds:
  strong_buffering_delta: 0.5
  partial_buffering_delta: 0.2

warning_predicates:
  - warning_id: strong_ohnolog_paralog
    if: "paralog_buffering_class == 'strong' && strongest_paralog_ohnolog == true"
    message: "{target.symbol} has a strongly-buffering ohnolog paralog ({strongest_paralog_symbol}, delta={strongest_paralog_delta}). Single-agent inhibition risks paralog-mediated escape. Consider dual-target strategies OR degrader modalities that can hit both paralogs."
  # 2026-08-08 false-negative fix: on the raw-CSV fallback the ohnolog flag is null (unknown), and the
  # eval-based predicate above reads null==true as False → it silently SUPPRESSED the escape-risk
  # warning for a strong-buffering target. This unknown-aware sibling surfaces an HONEST caveat instead
  # of silence when the buffering is strong but the ohnolog status could not be verified.
  - warning_id: ohnolog_unknown
    if: "paralog_buffering_class == 'strong' && strongest_paralog_ohnolog_status == 'unknown_fallback'"
    message: "{target.symbol} shows strong paralog buffering ({strongest_paralog_symbol}, delta={strongest_paralog_delta}), but ohnolog status is UNVERIFIED (raw-CSV fallback). Paralog-mediated escape risk is possible — treat the ohnolog flag as unknown, not absent; re-run against the derived product."
  - warning_id: sanger_paris_disagreement
    if: "n_paralogs_functionally_buffering > 0 && screen_source_summary contains 'disagreement'"
    message: "PARIS 2024 and Sanger 2023 disagree on {target.symbol}'s paralog-buffering status. Both screens have different cell-line panels; disagreement may reflect lineage-specific buffering. Consider lineage-conditional interpretation."
  - warning_id: data_unavailable_common_target
    if: "paralog_buffering_class == 'data_unavailable' && n_paralogs_annotated > 0"
    message: "{target.symbol} has annotated paralogs but was not screened in PARIS or Sanger paralog screens. The gene is a plausible paralog-buffering candidate but the empirical evidence is missing — flag for future screen coverage."

caveats:
  - |
    Paralog buffering is a SYNTHETIC-LETHAL signal — the target and its
    paralog are individually dispensable but essential in combination. This
    is DEPENDENCY HARDENING (single-agent inhibition may fail) — a REQUIREMENT
    signal distinct from mutation cooccurrence (co-mutation-and-mutual-
    exclusivity card).
  - |
    PARIS 2024 covers ~1,500 paralog pairs across ~60 cell lines. Sanger
    2023 covers ~700 pairs across ~50 lines. Pairs NOT screened in either
    return paralog_buffering_class='data_unavailable'.
  - |
    Ohnolog flag (whole-genome-duplication ancestry) is stricter than the
    general 'paralog' annotation — ohnologs share cell-type-specific
    regulatory context that non-ohnolog paralogs may not. Consumers may
    filter to strongest_paralog_ohnolog=true for the highest-confidence
    buffering candidates.
  - |
    Buffering strength cutoffs (strong: delta > 0.5, partial: 0.2-0.5) are
    calibrated against published SL screens (SMARCA4/2, ARID1A/B, MAGOH/
    MAGOHB). Lineage-conditional cutoffs may be needed in iter-2.
  - |
    A paralog-buffered dependency does NOT invalidate the target — it
    signals that MODALITY CHOICE matters. Degrader modalities (PROTAC,
    molecular glue) can hit multiple paralogs if they share ligand-binding
    domains; small-molecule active-site inhibitors typically cannot.
    Downstream tractability-and-modality skill should read paralog_buffering
    when reasoning about degrader vs SM tradeoffs.

# DATA_TO_SKILL_CONTRACT Rule 1 — view of the `paralog_buffering` claim (does a functional paralog
# buffer the dependency / create escape risk?). A distinct dependency-hardening axis, not a slice of
# crispr_lof_dependency (shown alongside it — concordance test → separate type).
measurement_type: paralog_buffering
# P4 (2026-07-24): declaration-only routing key — buffering opposes SM active-site but is neutral for a degrader (which can clear both paralogs) — discriminating. Matching rule pre-exists in interpretation-rules/intracellular-intrinsic.rules.yaml.
modality_relevance: [small_molecule, degrader]
entity_grains: [target]
schema_version: 1
