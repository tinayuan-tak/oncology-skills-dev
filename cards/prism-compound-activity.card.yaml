# Card E6 — PRISM COMPOUND ACTIVITY  (v1 — thin-lookup, dual-release derived aggregate)
#
# Answers: "Is there an existing compound that targets this gene, and does it
# kill cell lines in a target-relevant pattern?"
#
# Structurally different from E1-E5:
#   - E1-E5: per-target DISTRIBUTION queries (dependency / expression / CN / mut
#     across DepMap cell-line panel)
#   - E6:     GENE → DRUG bridge + activity distribution (given gene X, what
#     compounds annotate as targeting it, and what viability effect do they
#     produce across cell lines?)
#
# Cross-release-pin substrate (locked 2026-07-01):
#   The card carries its OWN release_pin (`prism-activity-v1`) separately from
#   the 26q1 CRISPR pin. PRISM releases are off-substrate from the CRISPR/RNAi
#   26q1 baseline and version independently.
#
#   Card reads a single per-gene aggregate parquet materialized by the sibling
#   `depmap-prism-precompute` batch job from two upstream PRISM releases:
#     - OncologyReference 25Q4 (primary, ~600 clinical-focus compounds incl.
#       sotorasib/adagrasib/etc.)
#     - Repurposing 24Q2 (fallback, ~6790 broad-library compounds)
#   Per-compound activity is computed within each release's OWN cell-line panel;
#   NEVER mixed across releases. Cross-release dedup by uppercase drug_name;
#   OncRef row wins when both present.
#
# Multi-target handling (locked 2026-07-01, plan Q3):
#   Polyselective compounds (e.g. LONAFARNIB → FNTA/HRAS/KRAS/NRAS) appear on
#   ALL annotated genes' cards, each entry carrying `polyselective: true` and
#   `n_annotated_targets: N`. Rules and synthesis can discount as desired.
#
# Interpretation surface (locked 2026-07-01, plan Q4):
#   `clinically_active`      → supportive for small_molecule, NEUTRAL for degrader
#   `tool_compound_only`     → weak-supportive for small_molecule (druggability)
#   `weakly_active`          → weak-supportive for small_molecule
#   `no_compounds_found`     → NEUTRAL (first-in-class opportunity, NOT a killer)
#   `data_unavailable`       → neutral (no signal to interpret)

card_id: prism-compound-activity
version: 1.0.0
question: "For compounds annotated as targeting {target.symbol}, how many exist across PRISM screens and what is their viability effect across cell lines? Is the target druggable in the clinical library (small-molecule tractable), tool-compound-only (druggable but pre-clinical), or first-in-class opportunity (no annotated compound)?"

applies_when:
  - "context.data_sources.depmap_prism_available == true"

# Distinct release pin from the 26q1 CRISPR substrate. Card is off-substrate
# from the rest of the intracellular-intrinsic dashboard; sourcing manifest is
# s3://onc-compbio/data-catalog/derived/depmap-prism-activity-v1/manifest.yaml
# which cites the upstream PRISM OncRef 25Q4 + Repurposing 24Q2 releases used
# to build the aggregate.
required_inputs:
  - product_id: depmap-prism-activity-v1
    release_pin: "prism-activity-v1"

methods:
  - call: depmap-prism-activity
    args:
      target: "{target.symbol}"
      release_pin: "prism-activity-v1"

outputs:
  summary_fields:
    - prism_activity_class                  # DESCRIPTIVE — drives Tier-2 rules
    - n_compounds_targeting                 # count of BRD/PRC compounds annotated to target (deduped by drug_name across releases)
    - highest_clinical_phase                # coarse ladder — see vocabulary + caveat
    - median_lfc_across_compounds           # median of per-compound median LFC (pan-cancer); null if no LFC data
    - top_compounds                         # up to 5 compounds ranked by activity; each entry:
                                              # struct{compound_id, drug_name, moa, median_lfc,
                                              #        fraction_lines_responding, n_lines_screened,
                                              #        polyselective, n_annotated_targets,
                                              #        source_release, prioritized}

  summary_fields_vocabulary:
    prism_activity_class:
      - clinically_active                   # ≥1 OncRef-prioritized compound (phase_1+ / approved proxy)
      - tool_compound_only                  # only tool / non-prioritized compounds; no clinical anchor
      - weakly_active                       # tool compounds show some activity (median LFC < -0.5) but not clinical
      - no_compounds_found                  # NO compound annotates as targeting this gene across BOTH releases
                                              # NOT a killer — first-in-class opportunity
      - data_unavailable                    # derived parquet unreadable (S3 error, unknown release_pin)
    highest_clinical_phase:
      - approved                            # placeholder — v1 does not resolve; see caveat
      - phase_1_plus                        # ≥1 OncRef-prioritized compound present
      - preclinical                         # OncRef-non-prioritized entry present
      - tool                                # Repurposing-only presence

  figures:
    - id: top_compounds_bar
      type: horizontal_bar_top_compounds
      description: "Horizontal bar of the top-K compounds by activity (bar length = −median LFC across screened lines). Bars colored by clinical status (navy = OncRef-prioritized clinical; ochre = tool / Repurposing). Annotations: drug_name (y-axis) + MOA + polyselective flag (right of bar). No-compound targets render a placeholder that reads 'first-in-class opportunity'."
      preferred_surfaces: [markdown, ppt, decision_memo]
      primary: true
    - id: activity_vocab_panel
      type: text_summary_panel
      description: "Text card showing class + granular fields (n_compounds, highest_phase, median LFC, polyselective-count-in-top). Complements the bar for headline-only surfaces; renders informatively even when the bar is a placeholder."
      preferred_surfaces: [markdown, ppt]

thresholds:
  lfc_responding_threshold: -1.0            # LFC < this → cell line responding to compound
  weakly_active_lfc_threshold: -0.5         # tool compounds must clear this to count as weakly_active
  top_compounds_k: 5                        # ranked cap for top_compounds field

warning_predicates:
  - warning_id: prism_polyselective_dominated
    if: "n_compounds_targeting >= 1 && all_top_compounds_polyselective"
    message: "All compounds annotated to this target are polyselective (targeting >1 gene). Activity signal may be caused by off-target engagement; discount before interpreting as 'target-relevant kill'."
  - warning_id: prism_no_clinical_anchor
    if: "prism_activity_class == 'tool_compound_only' && n_compounds_targeting >= 3"
    message: "Multiple tool compounds exist but no clinical anchor. Target may be druggable but preclinical; SM programs would be first-in-clinic risk profile."
  - warning_id: prism_thin_lfc_evidence
    if: "n_compounds_targeting >= 1 && median_lfc_across_compounds == null"
    message: "Compounds annotate to this target but no LFC measurements exist in the aggregate. Class call rests on annotation presence alone; activity claim is unsupported by the current data."

caveats:
  - |
    highest_clinical_phase is APPROXIMATED in v1. The PRISM source files
    do NOT carry a clinical-phase column. `phase_1_plus` is inferred from
    OncologyReference 25Q4's `Prioritized=TRUE` flag (curated to be clinical
    priority); `preclinical` from non-prioritized OncRef; `tool` from
    Repurposing-only presence. A v2 upgrade would join to ChEMBL's `max_phase`
    for real phase resolution.
  - |
    PRISM's "compound targets gene X" annotation does NOT guarantee that the
    compound's activity is caused BY target engagement. Many compounds
    annotate as targeting a gene based on curated MoA / literature but
    biological specificity is imperfect — LONAFARNIB "targets KRAS" via
    farnesyltransferase inhibition, not direct KRAS binding. Interpret
    `median_lfc` as "kill activity in cell lines annotated to this target"
    NOT "on-target killing."
  - |
    Cross-release cell-line panels differ: OncRef 25Q4 screens ~250-300 lines,
    Repurposing 24Q2 screens ~500. When top_compounds contains both a
    Repurposing entry and an OncRef entry, the activity metrics come from
    different panels. Reported per-compound `n_lines_screened` makes this
    visible.
  - |
    `no_compounds_found` is a REAL class, not a data-gap. It signals a
    first-in-class opportunity — pursue-with-eyes-open, NOT a killer against
    the target. It's distinct from `data_unavailable` (which means the derived
    product itself is unreadable).
  - |
    v1 is PAN-CANCER (no lineage stratification). A KRAS-active compound in
    the aggregate could be active in Bowel lines only or across the panel
    uniformly — v1 can't distinguish. Lineage-specific PRISM activity is a
    v2 scope item; would re-aggregate LFC per DepMap OncotreeLineage.

schema_version: 1
