# Card E6 — PRISM COMPOUND ACTIVITY  (v2 — thin-lookup, dual-release, lineage-stratified)
#
# Answers: "Is there an existing compound that targets this gene, and does it
# kill cell lines in a target-relevant pattern? Is the activity pan-cancer or
# lineage-selective?"
#
# Structurally different from E1-E5:
#   - E1-E5: per-target DISTRIBUTION queries (dependency / expression / CN / mut
#     across DepMap cell-line panel)
#   - E6:     GENE → DRUG bridge + activity distribution (given gene X, what
#     compounds annotate as targeting it, and what viability effect do they
#     produce across cell lines?)
#
# v2 (2026-07-01, PRISM lineage stratification build):
#   Adds per_lineage_activity + prism_lineage_selectivity to summary_fields.
#   Motivated by the v1 KRAS symptom: pan-cancer median LFC = -0.02 (nearly flat)
#   masks a real Bowel/Pancreas activity signal for sotorasib/adagrasib because
#   averaging with non-KRAS-mutant lines cancels the effect. v2 exposes the
#   lineage-level distribution so downstream synthesis + Tier-2 rules can
#   distinguish "broadly-active" from "lineage-selective" targets.
#
# Cross-release-pin substrate (locked 2026-07-01):
#   The card carries its OWN release_pin (`prism-activity-v2`) separately from
#   the 26q1 CRISPR pin. PRISM releases are off-substrate from the CRISPR/RNAi
#   26q1 baseline and version independently.
#
#   Card reads a single per-gene aggregate parquet materialized by the sibling
#   `depmap-prism-precompute` batch job from two upstream PRISM releases:
#     - OncologyReference 25Q4 (primary, ~600 clinical-focus compounds incl.
#       sotorasib/adagrasib/etc.)
#     - Repurposing 24Q2 (fallback, ~6790 broad-library compounds)
#   Per-compound activity is computed within each release's OWN cell-line panel;
#   NEVER mixed across releases. Cross-release dedup by uppercase drug_name;
#   OncRef row wins when both present. Lineage stratification uses DepMap 26Q1
#   Model.csv for the ModelID → OncotreeLineage join.
#
# Multi-target handling (locked 2026-07-01, plan Q3):
#   Polyselective compounds (e.g. LONAFARNIB → FNTA/HRAS/KRAS/NRAS) appear on
#   ALL annotated genes' cards, each entry carrying `polyselective: true` and
#   `n_annotated_targets: N`. Rules and synthesis can discount as desired.
#
# Interpretation surface (locked 2026-07-01, plan Q4):
#   `clinically_active`      → supportive for small_molecule, NEUTRAL for degrader
#   `tool_compound_only`     → supportive for small_molecule (druggability)
#   `weakly_active`          → supportive for small_molecule
#   `no_compounds_found`     → NEUTRAL (first-in-class opportunity, NOT a killer)
#   `data_unavailable`       → insufficient (no signal to interpret)
#
#   v2 additional signal (prism_lineage_selectivity, layers on top of activity_class):
#   `lineage_selective`      → supplements clinically_active/weakly_active with
#                              a "biomarker cohort" quality — SM programs get
#                              lineage-restricted rather than pan-cancer patient
#                              selection question.
#   `broadly_active`         → pan-cancer viability signal; less specific
#   `no_lineage_signal`      → activity signal is thin OR flat across lineages

card_id: prism-compound-activity
version: 2.0.0
question: "For compounds annotated as targeting {target.symbol}, how many exist across PRISM screens, what is their viability effect across cell lines, AND is that activity lineage-selective or pan-cancer? Is the target druggable in the clinical library (small-molecule tractable), tool-compound-only (druggable but pre-clinical), or first-in-class opportunity (no annotated compound)?"

applies_when:
  - "context.data_sources.depmap_prism_available == true"

# Distinct release pin from the 26q1 CRISPR substrate. Card is off-substrate
# from the rest of the intracellular-intrinsic dashboard; sourcing manifest is
# s3://onc-compbio/data-catalog/derived/depmap-prism-activity-v2/manifest.yaml
# which cites the upstream PRISM OncRef 25Q4 + Repurposing 24Q2 releases AND
# the 26Q1 Model.csv used to build the per-lineage aggregate.
required_inputs:
  - product_id: depmap-prism-activity-v2
    release_pin: "prism-activity-v2"

methods:
  - call: depmap-prism-activity
    args:
      target: "{target.symbol}"
      release_pin: "prism-activity-v2"

outputs:
  summary_fields:
    - prism_activity_class                  # DESCRIPTIVE — drives Tier-2 rules
    - n_compounds_targeting                 # count of BRD/PRC compounds annotated to target (deduped by drug_name across releases)
    - highest_clinical_phase                # coarse ladder — see vocabulary + caveat
    - median_lfc_across_compounds           # median of per-compound median LFC (pan-cancer); null if no LFC data
    - top_compounds                         # up to 5 compounds ranked by activity; each entry:
                                              # struct{compound_id, drug_name, moa, median_lfc,
                                              #        fraction_lines_responding, n_lines_screened,
                                              #        polyselective, n_annotated_targets,
                                              #        source_release, prioritized}
    - per_lineage_activity                  # v2: per-lineage activity distribution (sorted most-active-first);
                                              # struct{lineage, n_lines_screened, n_lines_responding,
                                              #        median_lfc, best_responder_lfc,
                                              #        top_compound_in_lineage, n_compounds_evaluated}
                                              # best_responder_lfc = min LFC (single best-responding line)
                                              # across compounds in the lineage; median_lfc = middle line.
                                              # Divergence indicates a responder subpopulation the median masks
                                              # (canonical for oncogene-addiction drugs vs mixed-genotype lineages).
    - prism_lineage_selectivity             # v2: DESCRIPTIVE — drives additional Tier-2 rules

  summary_fields_vocabulary:
    prism_activity_class:
      - clinically_active                   # ≥1 OncRef-prioritized compound (phase_1+ / approved proxy)
      - tool_compound_only                  # only tool / non-prioritized compounds; no clinical anchor
      - weakly_active                       # tool compounds show some activity (median LFC < -0.5) but not clinical
      - no_compounds_found                  # NO compound annotates as targeting this gene across BOTH releases
                                              # NOT a killer — first-in-class opportunity
      - data_unavailable                    # derived parquet unreadable (S3 error, unknown release_pin)
    prism_lineage_selectivity:
      - lineage_selective                   # ≥1 lineage active (median LFC < -0.5) AND ≥1 lineage inactive
      - broadly_active                      # majority of lineages active; no clear inactive contrast
      - no_lineage_signal                   # too few active lineages; pan-cancer signal is flat
      - data_unavailable                    # no evaluable lineages (Model.csv unreachable OR none met min-n)
    highest_clinical_phase:
      - approved                            # placeholder — v2 does not resolve; see caveat
      - phase_1_plus                        # ≥1 OncRef-prioritized compound present
      - preclinical                         # OncRef-non-prioritized entry present
      - tool                                # Repurposing-only presence

  figures:
    - id: top_compounds_bar
      type: horizontal_bar_top_compounds
      description: "Horizontal bar of the top-K compounds by activity (bar length = −median LFC across screened lines). Bars colored by clinical status (navy = OncRef-prioritized clinical; ochre = tool / Repurposing). Annotations: drug_name (y-axis) + MOA + polyselective flag (right of bar). No-compound targets render a placeholder that reads 'first-in-class opportunity'."
      preferred_surfaces: [markdown, ppt, decision_memo]
      primary: true
    - id: lineage_activity_bar
      type: horizontal_bar_per_lineage
      description: "v2: Per-lineage median LFC horizontal bar (top 10 lineages most-active-first). Navy bars = lineage active (median LFC < -0.5); gray = inactive/borderline. Each bar labeled with the top compound in that lineage + n_lines_screened. Dashed reference line at the active threshold. Direct visual answer to 'is this gene's PRISM activity broad or lineage-restricted?'"
      preferred_surfaces: [markdown, ppt, decision_memo]
    - id: activity_vocab_panel
      type: text_summary_panel
      description: "Text card showing class + granular fields (n_compounds, highest_phase, median LFC, polyselective-count-in-top) AND v2 lineage-selectivity + n_lineages_active/evaluated. Complements the bars for headline-only surfaces; renders informatively even when the bars are placeholders."
      preferred_surfaces: [markdown, ppt]

thresholds:
  lfc_responding_threshold: -1.0            # LFC < this → cell line responding to compound
  weakly_active_lfc_threshold: -0.5         # tool compounds must clear this to count as weakly_active
  top_compounds_k: 5                        # ranked cap for top_compounds field
  # v2 lineage-stratification thresholds
  min_cell_lines_in_lineage: 5              # mirrors E2 (dependency-lineage-selectivity)
  lineage_active_lfc: -0.5                  # lineage's median LFC below this → 'active'
  lineage_inactive_lfc: -0.2                # lineage's median LFC above this → 'inactive'
  lineage_selective_min_active: 1
  lineage_selective_min_inactive: 1

warning_predicates:
  - warning_id: prism_polyselective_dominated
    if: "n_compounds_targeting >= 1 && all_top_compounds_polyselective"
    message: "All compounds annotated to this target are polyselective (targeting >1 gene). Activity signal may be caused by off-target engagement; discount before interpreting as 'target-relevant kill'."
  - warning_id: prism_no_clinical_anchor
    if: "prism_activity_class == 'tool_compound_only' && n_compounds_targeting >= 3"
    message: "Multiple tool compounds exist but no clinical anchor. Target may be druggable but preclinical; SM programs would be first-in-clinic risk profile."
  - warning_id: prism_thin_lfc_evidence
    if: "n_compounds_targeting >= 1 && median_lfc_across_compounds == null"
    message: "Compounds annotate to this target but no LFC measurements exist in the aggregate. Class call rests on annotation presence alone; activity claim is unsupported by the current data."
  - warning_id: prism_lineage_signal_but_flat_pan_cancer
    if: "prism_lineage_selectivity == 'lineage_selective' && median_lfc_across_compounds > -0.5"
    message: "Pan-cancer median LFC is flat but per-lineage aggregation is lineage-selective. Pan-cancer signal is diluted by non-responding lineages; consult per_lineage_activity for the biomarker-cohort read (expected shape for oncogene-addiction drugs like KRAS-G12C inhibitors)."
  - warning_id: prism_responder_tail_masked_by_median
    if: "prism_lineage_selectivity == 'no_lineage_signal' && n_compounds_targeting >= 3"
    message: "Lineage medians flat despite ≥3 annotated compounds. Check per_lineage_activity.best_responder_lfc — strong divergence (best_responder_lfc negative, median flat) indicates a genotype-specific responder subpopulation (canonical for KRAS-G12C-type drugs). Mutation-conditional strat is a v3 target."

caveats:
  - |
    highest_clinical_phase is APPROXIMATED in v2. The PRISM source files
    do NOT carry a clinical-phase column. `phase_1_plus` is inferred from
    OncologyReference 25Q4's `Prioritized=TRUE` flag (curated to be clinical
    priority); `preclinical` from non-prioritized OncRef; `tool` from
    Repurposing-only presence. A future upgrade would join to ChEMBL's `max_phase`
    for real phase resolution.
  - |
    PRISM's "compound targets gene X" annotation does NOT guarantee that the
    compound's activity is caused BY target engagement. Many compounds
    annotate as targeting a gene based on curated MoA / literature but
    biological specificity is imperfect — LONAFARNIB "targets KRAS" via
    farnesyltransferase inhibition, not direct KRAS binding. Interpret
    `median_lfc` as "kill activity in cell lines annotated to this target"
    NOT "on-target killing."
  - |
    Cross-release cell-line panels differ: OncRef 25Q4 screens ~250-300 lines,
    Repurposing 24Q2 screens ~500. When top_compounds contains both a
    Repurposing entry and an OncRef entry, the activity metrics come from
    different panels. Reported per-compound `n_lines_screened` makes this
    visible.
  - |
    `no_compounds_found` is a REAL class, not a data-gap. It signals a
    first-in-class opportunity — pursue-with-eyes-open, NOT a killer against
    the target. It's distinct from `data_unavailable` (which means the derived
    product itself is unreadable).
  - |
    v2 lineage-selectivity uses THRESHOLD-BASED classification (≥1 lineage
    with median LFC < -0.5, ≥1 with median LFC > -0.2) — NOT a formal
    enrichment test as in E2 (dependency-lineage-selectivity). This is a
    coarser signal that trades statistical rigor for a scipy-free precompute.
    Consult E2 for formal Mann-Whitney-style enrichment on the CRISPR side.
  - |
    Per-lineage cell-line counts vary widely — some lineages have ~50 lines in
    PRISM, others have 5-10. The min_cell_lines_in_lineage threshold (=5) mirrors
    E2 discipline, but small-lineage bars in the figure have wider variance
    around their per-line LFC medians. Interpret rank-1 lineage confidence
    proportional to n_lines_screened.

schema_version: 1
