# Card Phase-G — dosage-sensitivity safety via ClinGen gene-disease validity (P5 Slice 3)
#
# A verdict-moving P5 card. ClinGen curated gene-disease validity (Open Targets 26.06) → is losing
# ONE copy of {target.symbol} pathogenic (haploinsufficiency / autosomal-dominant loss = the highest
# concern for a degrader / full-inhibition modality) or does disease require BOTH copies lost
# (recessive = lower single-allele safety concern)?
#
# DERIVED signal (ClinGen has no dosage column): dosage_sensitivity_class from allelicRequirements
# gated on confidence.
#   autosomal_dominant_loss → ANY high-confidence (Definitive/Strong) AD association. Single-allele
#                             loss is pathogenic → haploinsufficiency safety concern. Fires the
#                             full-KO safety warning.
#   dosage_sufficient       → high-confidence associations are exclusively recessive (AR). Disease
#                             needs both copies → lower single-allele concern. Favorable/neutral.
#   unresolved              → only X-linked/mito/semidominant, or rows exist but none high-confidence.
#   no_clingen_entry        → gene absent from ClinGen. insufficient → unresolvable symbol.
#
# ANY-association reduction: BRCA1/MLH1 are BOTH AD (cancer-predisposition) AND AR (Fanconi/other) —
# the dominant association wins because single-copy loss is pathogenic for at least that disease. A
# majority-vote over allelic requirements would MISS the haploinsufficiency concern.
#
# BYTE-STABLE this slice: the warning below is card-level context; its RULE is resolver-wired in Slice 5.

card_id: clingen-dosage
version: 1.0.0
question: "Is loss of one copy of {target.symbol} pathogenic (ClinGen autosomal-dominant / haploinsufficiency), implying a dosage-sensitivity safety concern for a full-KO modality?"

tier: target   # scope-invariant: ClinGen gene-disease dosage validity is a property of the gene. Never stratifies.

applies_when: []

required_inputs:
  - product_id: opentargets-26-06

methods:
  - call: opentargets-clingen-dosage
    args:
      target: "{target.symbol}"

outputs:
  summary_fields:
    - dosage_sensitivity_class            # PRIMARY categorical
    - n_high_confidence                   # int; Definitive/Strong rows
    - n_total_rows                        # int; all ClinGen rows for the gene
    - n_autosomal_dominant                # int; high-confidence AD rows
    - n_autosomal_recessive               # int; high-confidence AR rows
    - allelic_requirements                # list; distinct high-confidence allelicRequirements tokens
    - top_disease                         # the dominant-loss disease driving the call
    - top_confidence                      # Definitive | Strong
    - method_version

  summary_fields_vocabulary:
    dosage_sensitivity_class:
      - autosomal_dominant_loss
      - dosage_sufficient
      - unresolved
      - no_clingen_entry
      - insufficient

  # NO figure: tables-only (deferred with the other P5 figures).

warning_predicates:
  - warning_id: clingen_dominant_loss_safety_concern
    if: "dosage_sensitivity_class == 'autosomal_dominant_loss'"
    message: "{target.symbol}: ClinGen autosomal-dominant loss is pathogenic ({top_disease}, {top_confidence}) — single-copy loss suffices for disease (haploinsufficiency), a safety concern for full-KO modalities (degrader/RNA/full SM). Mutant-selective tx vs an activating driver spares WT, nullifying this."

caveats:
  - |
    ClinGen carries no dosage column; dosage_sensitivity_class is DERIVED from allelicRequirements
    (AD → dominant-loss, AR → dosage-sufficient) gated on confidence (Definitive/Strong only —
    Disputed/Refuted excluded). A gene can be both AD and AR across diseases (BRCA1, MLH1); the card
    reports autosomal_dominant_loss whenever ANY high-confidence dominant association exists, because
    single-copy loss is then pathogenic for at least that disease.
  - |
    This is a germline gene-disease-validity signal about the WILD-TYPE gene's dosage sensitivity. It
    does not capture adult-vs-developmental requirements (cross-reference mouse-ko-phenotype), and a
    mutant-selective therapy against an activating driver spares WT and largely nullifies the concern
    (resolver mechanism-conditioning downgrade, Slice 5).

# DATA_TO_SKILL_CONTRACT Rule 1 — view of the `dosage_sensitivity_safety` claim (ClinGen dominant-loss
# / haploinsufficiency). Provider: opentargets-26-06 evidence_clingen (measured curated genetics).
measurement_type: dosage_sensitivity_safety
entity_grains: [target]
schema_version: 1
