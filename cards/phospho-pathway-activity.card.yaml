# Card — PHOSPHO PATHWAY ACTIVITY (target biology at the phospho level; Q8)
#
# From CPTAC phosphoproteomics: is the target PHOSPHORYLATED in the indication's tumors, and — the
# key question for kinases / signaling proteins — is it phosphorylated BEYOND its total abundance
# (a proxy for PATHWAY ACTIVITY / activation state that total-protein presence (Q1/Q5) misses)?
#   - phospho_active      → phosphosites detected in a substantial fraction of tumors AND the phospho
#                           signal exceeds the total-protein expectation → active signaling.
#   - phospho_present     → detected but tracking abundance (present, not clearly hyper-activated).
#   - phospho_low         → few phosphosites detected despite the gene being in the panel.
#   - not_phosphoprotein  → the gene has NO phosphosites in the CPTAC panel — an honest "this axis
#                           doesn't apply" (e.g. KRAS, a GTPase regulated by nucleotide exchange).
#
# ZERO new ingestion — reads the cptac PYTHON PACKAGE's harmonized phosphoproteomics [bcm]
# (Patient_ID x (gene, site, peptide, ENSG) multiindex) + proteomics [bcm] for the phospho-vs-total
# comparison. Same cptac package + cohort map as the Q5 tumor arm.
#
# ROUTES INTO GATES (master-sequencing Part 3): Presence (A, protein/pathway-level support) +
# Mechanism (D, is the signaling pathway active). Biology axis; no modality-gate facet. For
# kinases/signaling targets this is the SHARPEST presence signal (phospho-activity > total abundance).

card_id: phospho-pathway-activity
version: 0.1.0
question: "Is {target.symbol} phosphorylated (pathway-activity proxy) in {indication.label} tumors, and beyond its total abundance — or is it not a phosphoprotein?"

tier: indication

applies_when:
  # needs a CPTAC cohort for the indication (the cptac package's 10 cohorts).
  - "context.indication in ['BRCA', 'KIRC', 'CCRCC', 'COADREAD', 'COAD', 'READ', 'GBM', 'HNSC', 'HNSCC', 'LUSC', 'LSCC', 'LUAD', 'OV', 'PAAD', 'PDAC', 'UCEC']"

required_inputs:
  - product_id: cptac-pdc-snapshot-2026-07-01    # cptac package harmonized phosphoproteomics [bcm] + proteomics [bcm]

methods:
  - call: phospho-pathway-activity
    args:
      target: "{target.symbol}"
      indication: "{indication}"

outputs:
  summary_fields:
    - phospho_activity_class              # PRIMARY categorical (drives Tier-2 rules)
    - n_phosphosites                      # target's phosphosites in the CPTAC panel
    - n_phosphosites_frequent             # sites detected in >= active-fraction of tumors
    - max_site_detection_fraction         # detection fraction of the most-detected site
    - phospho_exceeds_abundance           # true = phosphorylated beyond total protein (pathway-active)
    - top_site_phospho_minus_protein      # top site's mean(phospho log-ratio − gene total-protein log-ratio) across paired tumors
    - n_phospho_protein_paired            # paired tumors backing the top site's phospho-vs-protein residual
    - top_phosphosites                    # top sites by detection (record list)
    - n_tumors
    - cptac_cohort
    - substrate
  summary_fields_record_schemas:
    top_phosphosites:
      site: string
      detection_fraction: number
  summary_fields_vocabulary:
    phospho_activity_class: [phospho_active, phospho_present, phospho_low, not_phosphoprotein, data_unavailable]
  figure: phospho_pathway_activity_card

thresholds:
  detected_fraction_active: 0.50      # site detected in >= this fraction → substantial
  phospho_over_protein_delta: 0.25    # mean(phospho z) - mean(protein z) > this → exceeds abundance
  min_tumors: 20                      # below → data_unavailable

caveats:
  - "not_phosphoprotein is a REAL biological state (the gene has no phosphosites in the CPTAC panel), NOT a coverage gap — e.g. KRAS, a GTPase regulated by nucleotide exchange rather than phosphorylation. Distinct from data_unavailable (no CPTAC cohort / read failure)."
  - "phospho_exceeds_abundance compares mean phospho z-score to mean total-protein z-score across tumors; a target can be abundantly phosphorylated simply because it is abundant (phospho_present) vs hyper-phosphorylated beyond abundance (phospho_active). Interpret with the abundance cards (Q1/Q5)."
  - "Detection fraction reflects MS coverage (a phosphosite below the MS detection limit reads as absent); low detection is not proof of no phosphorylation. Phosphosite-level stoichiometry is not resolved."
  - "The phospho signal is total across the target's sites (mean); a SPECIFIC activating site (e.g. an autophosphorylation site) is not singled out — top_phosphosites lists the most-detected sites for follow-up but does not assert which is functionally activating."
  - "CPTAC bcm phospho is the harmonized cptac-package source; it is a tumor cohort (no matched-normal contrast in this card — that is a follow-up)."

measurement: bulk_protein_ms
sample_context: tumor

# DATA_TO_SKILL_CONTRACT Rule 1 — NEW measurement_type: phospho pathway-activity (CPTAC phospho).
measurement_type: phospho_pathway_activity
entity_grains: [target_indication]
schema_version: 1
