# Card Phase-G — OT target-PRIORITISATION safety context (P5 Slice 1, walking skeleton)
#
# The first card of the P5 human-genetics safety leg. A CONTEXT view of Open Targets 26.06's
# engineered target-prioritisation scores — it ORIENTS the safety reader across OT's harmonized
# priors, it does NOT make a call. Deliberately verdict-inert (byte-stable): no warning_predicates,
# and its interpretation rule is skill-consumed only (never resolver-referenced), so it cannot move
# the deterministic verdict spine.
#
# WHY CONTEXT-ONLY: target_prioritisation values are OT-NORMALIZED prioritisation scores
# (~[-1, +1], higher = more favorable on the priority axis), NOT raw facts. geneticConstraint here
# is OT's normalized score, NOT a raw gnomAD LOEUF; isInMembrane is a normalized membership score,
# NOT a boolean. Recasting them as facts would misread OT's sign conventions. The AUTHORITATIVE
# per-fact reads live in the dedicated cards — gnomad-lof-constraint (raw pLI/LOEUF),
# surfaceome-family-classification (surface residency), mouse-ko-phenotype (P5 Slice 4). This card is
# the OT-prioritisation orientation layer that sits alongside them.
#
# Interpretation surface (three neutral CONTEXT bands per safety-relevant score):
#   favorable     → OT score >= 0.5 on the prioritisation axis
#   intermediate  → -0.5 < score < 0.5
#   unfavorable   → score <= -0.5
#   not_scored    → OT assigned no value for this field (null/sentinel)

card_id: target-safety-prioritisation
version: 1.0.0
question: "How does Open Targets prioritise {target.symbol} on its engineered safety-relevant scores (safety-event, genetic constraint, mouse-KO), as orienting context?"

tier: target   # scope-invariant: OT target_prioritisation is one row per human gene, indication- and subgroup-agnostic. Never stratifies.

applies_when: []

required_inputs:
  - product_id: opentargets-26-06

methods:
  - call: opentargets-target-prioritisation
    args:
      target: "{target.symbol}"

outputs:
  summary_fields:
    - prioritisation_status                # PRIMARY: scored | not_in_prioritisation_table | data_unavailable
    - has_safety_event_band                # context band on OT hasSafetyEvent score
    - genetic_constraint_band              # context band on OT geneticConstraint score (NOT raw gnomAD)
    - mouse_ko_score_band                  # context band on OT mouseKOScore
    - ot_scores                            # dict of raw OT-normalized scores (full precision, surfaced for the figure/skill)
    - ensembl_gene_id
    - method_version

  summary_fields_vocabulary:
    prioritisation_status:
      - scored
      - not_in_prioritisation_table
      - data_unavailable
    has_safety_event_band:
      - favorable
      - intermediate
      - unfavorable
      - not_scored
    genetic_constraint_band:
      - favorable
      - intermediate
      - unfavorable
      - not_scored
    mouse_ko_score_band:
      - favorable
      - intermediate
      - unfavorable
      - not_scored

  # NO figure: this walking-skeleton context card ships tables-only. A figure (OT prioritisation
  # radar) is deferred — it would need an emitter registered in compose-dashboard; not warranted for
  # a verdict-inert orientation card. Figures for the verdict-moving P5 Slices 2-4 come with those.

# NO warning_predicates: this card is verdict-inert context. It surfaces OT priors for the safety
# skill to display alongside the authoritative per-fact cards; it never fires a hold or a killer.
# The verdict-moving human-genetics signals arrive in P5 Slices 2-4 (gene_burden / clingen /
# mouse_phenotype) as dedicated measured cards.

# NO modality_relevance: this is a SAFETY-axis context card (routes to the safety gate only). It is
# not a modality-fit card — declaring modality_relevance without a modality-axis rule would be the
# exact "declared-relevant-but-mute" anti-state (see the P4 sweep). Safety is axis-1, not axis-2.

caveats:
  - |
    All fields are Open Targets ENGINEERED PRIORITISATION SCORES (normalized ~[-1,+1], higher =
    more favorable), NOT raw measurements. Do NOT read geneticConstraint as a gnomAD LOEUF or
    isInMembrane as a boolean — the dedicated per-fact cards (gnomad-lof-constraint,
    surfaceome-family-classification) carry the authoritative values. Orientation, not evidence-of-record.
  - |
    A `not_in_prioritisation_table` status means the target is absent from OT's 78,691-target
    prioritisation set (not a coverage failure of any single fact) — read it as "OT has no engineered
    prioritisation profile for this target", not as a negative safety signal.
  - |
    OT's prioritisation sign convention is subtle and version-specific; this card is intentionally
    verdict-inert so a sign-convention misread cannot flip a safety call. The dedicated Slices 2-4
    cards carry the actual measured human-genetics safety signals.

# DATA_TO_SKILL_CONTRACT Rule 1 — view of the `target_safety_prioritisation` claim (OT engineered
# target-priority scores as safety-orienting context). Provider: opentargets-26-06 target_prioritisation.
measurement_type: target_safety_prioritisation
entity_grains: [target]
schema_version: 1
