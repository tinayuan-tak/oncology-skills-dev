# Card — RNA↔PROTEIN CONCORDANCE, TUMOR (CPTAC; Q5 tumor arm)
#
# The TUMOR-grain sibling of rna-protein-concordance (cell-line). Same question — does RNA predict
# PROTEIN for this target? — but IN PATIENT TUMORS, per the indication's CPTAC cohort, from the
# matched cptac-rna-protein-matched-per-sample-v1 product (per-(cohort, patient, gene) RNA+protein).
#
# WHY A SEPARATE CARD (grain-split, not two providers of one number): cell-line concordance is a
# TARGET property (one r per gene, indication-independent → tier:target). Tumor concordance is
# TARGET_INDICATION (one r per gene×cohort — a target can track in one tumor type and decouple in
# another). Same measurement_type (rna_protein_concordance), different grain → sibling card, mirroring
# the pooled/subtype expression split. The two are REPORTED SIDE-BY-SIDE, never averaged: they answer
# the biomarker question in two contexts and their DISAGREEMENT is itself the signal.
#
# WHY TUMOR MATTERS MOST for rna_as_biomarker: bulk-tumor purity, stromal admixture, and
# post-transcriptional regulation degrade RNA↔protein concordance far more than in cell lines, and it
# is strongly gene-specific — so the tumor number, not the cell-line one, is what a patient-selection
# RNA biomarker or RNA-inferred presence claim actually rests on. Verified: KRAS in COAD tumors
# r≈0.01 (RNA useless as a KRAS-protein proxy) vs r≈0.55 in cell lines; ERBB2/BRCA r≈0.78, EGFR/LUAD
# r≈0.80 (RNA adequate). The cell-line "partial_proxy" for KRAS would MISLEAD without the tumor read.

card_id: rna-protein-concordance-tumor
version: 0.1.0
question: "Does {target.symbol} RNA predict its PROTEIN in {indication.label} TUMORS (CPTAC) — is RNA an adequate proxy in the disease context, or must protein be measured directly?"

tier: indication   # tumor concordance is cohort/indication-specific

applies_when:
  # the indications with a CPTAC cohort in the matched product (10 cohorts).
  - "context.indication in ['BRCA', 'CCRCC', 'KIRC', 'COADREAD', 'COAD', 'READ', 'GBM', 'HNSC', 'HNSCC', 'LUSC', 'LSCC', 'LUAD', 'OV', 'PAAD', 'PDAC', 'UCEC']"

required_inputs:
  - product_id: cptac-rna-protein-matched-per-sample-v1   # matched per-(cohort, patient, gene) tumor RNA+protein

methods:
  - call: depmap-rna-protein-concordance
    args:
      target: "{target.symbol}"
      indication: "{indication}"

outputs:
  summary_fields:
    - rna_as_biomarker                           # PRIMARY categorical (shared vocab with the cell-line card)
    - rna_protein_r                              # Pearson (paired per-tumor)
    - rna_protein_spearman
    - n_paired_tumors
    - cptac_cohort                               # the CPTAC cohort backing this indication
    - substrate                                  # 'cptac_tumor' (distinguishes from the cell-line card)
  summary_fields_vocabulary:
    rna_as_biomarker: [adequate_proxy, partial_proxy, poor_proxy, insufficient_paired_tumors, data_unavailable]
  figure: rna_protein_concordance_tumor_scatter  # per-tumor RNA vs protein, fitted trend + r

thresholds:
  strong_concordance_r: 0.7
  moderate_concordance_r: 0.4
  min_paired_tumors: 20            # below → insufficient_paired_tumors

caveats:
  - "TUMOR-grain sibling of rna-protein-concordance (cell-line). Same measurement_type, different grain (target_indication vs target). Report the two SIDE-BY-SIDE, never averaged — their disagreement (e.g. KRAS partial in cell lines, poor in COAD tumors) is the decision-relevant signal."
  - "CPTAC cohort maps to the indication (COADREAD→coad, KIRC→ccrcc, LUSC→lscc, PAAD→pdac, etc.); indications without a CPTAC cohort return data_unavailable."
  - "bcm protein abundance is NOT zero-centered (per the matched product manifest) — used for CORRELATION only (scale-invariant), never cross-gene comparison."
  - "A poor_proxy verdict is a MODALITY caution (protein must be measured for ADC/TCE; RNA biomarker inadequate in THIS tumor type), NOT a target killer."
  - "Bulk-tumor concordance is degraded by purity/stroma; a low r may partly reflect microenvironmental dilution rather than pure post-transcriptional decoupling (see Q9 purity attribution)."

measurement: bulk_rna
sample_context: tumor          # patient tumor (CPTAC), contrasted RNA-vs-protein

# DATA_TO_SKILL_CONTRACT Rule 1 — rna_protein_concordance at target_indication grain (tumor arm).
measurement_type: rna_protein_concordance
entity_grains: [target_indication]
schema_version: 1
