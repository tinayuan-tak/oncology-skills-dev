# tumor_presence.yaml — the tumour-presence domain's L2a per-source properties.
#
# This is the REFERENCE L2a implementation: `skills/_skills_common/presence_claims.py`'s
# `_SOURCE_PROPERTY_RECIPES` (:694) emits exactly these six, and Wave-1 of arc #2210 replicates the
# pattern onto the other five domains. Every entry here is transcribed from that tuple — the
# catalog does not invent properties the code does not resolve.
catalog_id: tumor_presence
kind: l2a_property
version: 1.1.0

description: |
  "Is the target present in the tumour" decomposes into six DIFFERENT questions, each answered by a
  different source at a different grain. The tumour-presence vertical resolves all six and keeps
  them separate rather than folding them into one presence verdict, because they fail the
  identifiability test against each other: a bulk RNA cohort, a mass-spec proteome, and a
  single-cell atlas would still disagree if all three were measured perfectly, since they are
  measuring transcript abundance, protein abundance and malignant-cell occupancy respectively.

  The pairwise agreements that ARE meaningful are registered as L2b concordance families in
  integrated_families.yaml (abundance, coverage, tumor_presence, protein_presence,
  subtype_restriction) — a family is where the cross-source comparison becomes legal, and it
  carries the comparability gate that makes it legal.

governance:
  role: |
    Authoritative for: which source resolves which presence property, at what grain, and which
    quantitative anchors are retained alongside the class token. NOT authoritative for the class
    VALUE vocabularies (those live with each card's interpretation rules) and NOT for the
    concordance families (integrated_families.yaml).
  versioning: |
    Semver, additive-only. These six `name`s are emitted as KEYS in the exported
    `source_properties` map, so an ID here is a published wire name — renaming one is breaking
    for every downstream consumer of the evidence package, not just for this file.
  ownership: |
    Epic #1507. The two envelope-v1.1 additive fields this file does NOT yet record —
    `interpretation.{function_id, version, disjunct_fired}` and island `comparability_state` —
    are the subject of #2227, which is deliberately BLOCKED on #2061 + #1984 PR-B because it is
    the one change that must regenerate the tumour-presence golden.
  change_discipline: |
    Byte-stable omission: a recipe whose card or property_field does not resolve emits NO entry,
    and the whole `source_properties` key is omitted when nothing resolves. Any change here must
    preserve that — a fabricated entry is worse than an absent one.

properties:

  patient_tumor_abundance:
    status: resolvable
    definition: |
      How abundant is the target transcript across patient tumour samples, in absolute terms and
      relative to the rest of the transcriptome?
    grain:
      measurement_type: tumor_rna_expression
      sample_context: tumor
      entity_grain: bulk
    observables:
      - card_id: tumor-rna-distribution
        field: tumor_expression_class
        role: estimator
        emission: class_token
        dependence_group: tcga_bulk_rna
      - card_id: tumor-rna-distribution
        field: allgene_percentile
        role: estimator
        emission: anchor
        dependence_group: tcga_bulk_rna
      - card_id: tumor-rna-distribution
        field: median_log2tpm
        role: estimator
        emission: anchor
        dependence_group: tcga_bulk_rna
      - card_id: tumor-rna-distribution
        field: p95_log2tpm
        role: estimator
        emission: anchor
        dependence_group: tcga_bulk_rna
      - card_id: tumor-rna-distribution
        field: fraction_tumor_above_normal_p95
        role: coupled
        emission: anchor
        dependence_group: tcga_bulk_rna
        estimates_property: tumor_normal_selectivity
        note: |
          Retained on this entry as an anchor but it is a tumour-vs-NORMAL comparison, so it
          estimates selectivity, not abundance. Marked `coupled` so nothing counts it as a
          second abundance estimator.
    determinants:
      - name: DETECTABLE_LOG2TPM
        value: 1.0
        unit: log2_tpm_plus_1
        source: methods/onc_methods/tcga_gtex_expression_distribution/stats.py:22
        rationale: |
          TPM ~= 1, the tumour-side detection floor feeding `detectable_fraction` (the input to
          `broadly_low_detectable_fraction` and `BROADLY_DETECTED_MODERATE_FRACTION_MIN` below).
          Numerically identical to the cell-line twin's `_EXPRESSED_LOG2TPM` (expression.yaml) and
          to DepMap's own `_EXPRESSED` floor (methods/depmap_expression_distribution/read.py:27) —
          a genuine cross-modality mirror at the DETECTION (not high-expression) rung, unlike
          HIGH_LOG2TPM below which is the confirmed divergent rung.
        calibration:
          controls: null
          flip_matrix: null
          adjudication: null
      - name: HIGH_LOG2TPM
        value: 5.6724
        unit: log2_tpm_plus_1
        source: methods/onc_methods/tcga_gtex_expression_distribution/stats.py:24
        rationale: |
          log2(51), i.e. a round TPM 50 in LINEAR space. Diverges from the cell-line twin's 5.0
          (round in LOG space, TPM ~31) — see expression.yaml::magnitude and #2221.

          ADJUDICATED #2221 (2026-09-30): DOCUMENTED-INTENTIONAL, THIS CONSTANT NOT MOVED. The
          two bars were confirmed to cut the SAME quantity (fraction of samples at or above),
          unlike #2220's pair, so the divergence is real; but neither value is calibrated, both
          are rounding artefacts in different spaces, and the same-quantity FRACTION bar also
          diverges (0.30 in the cell-line card vs 0.50 here and in the cell-line resolver), so
          moving this anchor alone would push the two `broadly_high` words further apart. Lowering
          it to 5.0 moves 8/59 units on the live panel, all promotions, which would additionally
          require the tumour-presence golden regenerated (#2061 / #1984 PR-B). Full per-mover
          measurement and the two-arm matrix: see `flip_matrix` below and
          expression.yaml::magnitude::_HIGHLY_EXPRESSED_LOG2TPM. The direction is an owner call
          on what "highly expressed" should mean; the fork is on #2221.

          Sub-question also settled by the same measurement: the rounding note on
          cards/tumor-rna-distribution.card.yaml (the card declares a rounded 5.67 while this
          constant is 5.6724, so a value in [5.6700, 5.6724) displays as at-or-above while the
          code puts it below) describes a real gap that NO measured unit occupies at median grain
          — 0 of 117 panel medians fall in the sliver, nearest is 0.0142 away, ~6x the sliver
          width. It IS populated at per-sample grain (7 values), so the note is a live
          display-precision hazard for fractions, not a hidden class flip.
        calibration:
          controls: methods/onc_methods/tumor_presence_controls/read.py
          flip_matrix: methods/tests/calibration/high_anchor_flip_matrix/matrix.json
          adjudication: "#2221"
      - name: MODERATE_LOG2TPM
        value: 3.4594
        unit: log2_tpm_plus_1
        source: methods/onc_methods/tcga_gtex_expression_distribution/stats.py:23
        rationale: |
          log2(11) ~ TPM 10. Same linear-TPM rounding convention as HIGH_LOG2TPM, internally
          consistent with it.
        calibration:
          controls: null
          flip_matrix: null
          adjudication: null
      - name: BROADLY_DETECTED_MODERATE_FRACTION_MIN
        value: 0.5
        unit: fraction_of_tumors_above_moderate
        source: methods/onc_methods/tcga_gtex_expression_distribution/read.py:884
        rationale: |
          (Citation re-pointed 898 -> 884 by #2221: the cited line had drifted off the constant.
          Nothing in the gates checks a `:line` suffix — deliberately, see
          `test_teeth_determinant_line_drift_is_tolerated` — so this was found by hand-reading, and
          #2221 carries the question of whether that tolerance should be tightened. The value and
          the reasoning below are unchanged.)
          The detected-is-not-expressed guard (tumor-presence expert review, finding G4): a
          target sitting at the TPM~1 transcriptional-background floor in most tumours is
          "present but low-level", and must NOT inherit the `tumor_broadly_expressed` word that
          the surface/ADC/degrader reads depend on. This is the best-justified determinant in
          the presence domain — it names the failure it prevents.
        calibration:
          controls: null
          flip_matrix: null
          adjudication: null
      - name: broadly_low_detectable_fraction
        value: 0.3
        unit: fraction_of_tumors_above_detection_floor
        source: methods/onc_methods/tcga_gtex_expression_distribution/read.py:927
        rationale: |
          UNKNOWN as a value. Recorded here because it is the number #2220 mistakes for a
          `broadly_high` divergence: it is the `broadly_low` bar on DETECTABLE fraction, not a
          bar on HIGH fraction. The unit is the whole point — reconciling it against the
          cell-line path's 0.30 (_PRESENCE_SUPPORTED_MEDIAN_FRACTION) compares two different
          quantities that happen to share a numeral.
        calibration:
          controls: null
          flip_matrix: null
          adjudication: "#2222"
    consumers:
      - skill: tumor-presence
        axis_key: A
        note: |
          Axis keys in this domain are the letters A/B/C/D — tumour-presence is the only skill of
          15 using a letter scheme. #2229 proposes migrating them to mnemonics via
          add -> consume -> remove; until that lands, the letters are the wire names.
      - skill: target-profile
        surface: tp_facets.modality_conjunction

  tumor_normal_selectivity:
    status: resolvable
    definition: |
      Is the target's transcript elevated in tumour relative to matched adjacent-normal tissue
      (and to the GTEx normal reference)? The therapeutic-window question at transcript grain.
    grain:
      measurement_type: tumor_rna_dge_vs_adjacent
      sample_context: tumor
      entity_grain: bulk
    observables:
      - card_id: tumor-rna-vs-adjacent
        field: expression_call_class
        role: estimator
        emission: class_token
        dependence_group: tcga_bulk_rna_dge
      - card_id: tumor-rna-vs-adjacent
        field: log2_fc
        role: estimator
        emission: anchor
        dependence_group: tcga_bulk_rna_dge
      - card_id: tumor-rna-vs-adjacent
        field: q_value
        role: estimator
        emission: anchor
        dependence_group: tcga_bulk_rna_dge
      - card_id: tumor-rna-vs-adjacent
        field: gtex_log2_fc
        role: estimator
        emission: anchor
        dependence_group: gtex_normal_reference
        note: |
          A DIFFERENT dependence_group from the adjacent-normal arm: GTEx is an independent
          normal cohort, not the same patients' adjacent tissue. The two normal comparators can
          legitimately corroborate each other.
      - card_id: tumor-rna-vs-adjacent
        field: gtex_q_value
        role: estimator
        emission: anchor
        dependence_group: gtex_normal_reference
    determinants: []
    consumers:
      - skill: tumor-presence
        axis_key: B
      - skill: tumor-selectivity
        surface: selectivity_hero.axis_a

  tumor_protein_abundance:
    status: resolvable
    definition: |
      How abundant is the target PROTEIN across patient tumour samples? A distinct property from
      transcript abundance, not a corroboration of it — see the README's identifiability test.
    grain:
      measurement_type: tumor_protein_expression
      sample_context: tumor
      entity_grain: bulk_protein
    observables:
      - card_id: tumor-protein-abundance-cptac
        field: protein_expression_class
        role: estimator
        emission: class_token
        dependence_group: protein_ms_tumor
      - card_id: tumor-protein-abundance-cptac
        field: allgene_percentile
        role: estimator
        emission: anchor
        dependence_group: protein_ms_tumor
      - card_id: tumor-protein-abundance-cptac
        field: protein_effect_size
        role: estimator
        emission: anchor
        dependence_group: protein_ms_tumor
      - card_id: tumor-protein-abundance-cptac
        field: protein_bh_q_value
        role: estimator
        emission: anchor
        dependence_group: protein_ms_tumor
    determinants:
      - name: _cohens_d_class.small
        value: 0.2
        unit: cohens_d_standardized_effect_size
        source: methods/onc_methods/cptac_protein_deg/read.py:93
        rationale: |
          Cohen's (1988) canonical small/medium/large convention for a standardized effect size —
          a textbook cut, not a value tuned against this framework's data. Standardizes the raw
          TMT log2 `protein_effect_size` (which is within-cohort, reference-pool-relative and not
          comparable across cohorts on its own) via the exact MSstatsTMT moderated SE when present,
          falling back to a p-value/z-score approximation (`read.py:118-125`).
        calibration:
          controls: null
          flip_matrix: null
          adjudication: null
      - name: _cohens_d_class.medium
        value: 0.5
        unit: cohens_d_standardized_effect_size
        source: methods/onc_methods/cptac_protein_deg/read.py:91
        rationale: |
          Cohen's (1988) canonical convention; see `_cohens_d_class.small` above for the shared
          standardization context.
        calibration:
          controls: null
          flip_matrix: null
          adjudication: null
      - name: _cohens_d_class.large
        value: 0.8
        unit: cohens_d_standardized_effect_size
        source: methods/onc_methods/cptac_protein_deg/read.py:89
        rationale: |
          Cohen's (1988) canonical convention; see `_cohens_d_class.small` above for the shared
          standardization context.
        calibration:
          controls: null
          flip_matrix: null
          adjudication: null
    consumers:
      - skill: tumor-presence
        axis_key: A
        note: |
          Shares axis A with patient_tumor_abundance — the axis aggregates the abundance lens
          across modalities. The `abundance` L2b family is where their AGREEMENT is computed;
          the axis is where it is displayed.
    dependence_note: |
      dependence_group `protein_ms_tumor` is shared with TPHP
      (tumor-vs-normal-protein-abundance-tphp) wherever both appear as arms: both are
      mass-spectrometry tumour proteomics, so a CPTAC/TPHP agreement is one modality measured
      twice, NOT two independent arms. This is the #1667 lesson and the reason the field is
      mandatory.

  malignant_cell_coverage:
    status: resolvable
    definition: |
      In what fraction of MALIGNANT cells is the target detected, and across how many donors? The
      occupancy property — what decides whether a tumour-cell-directed modality reaches the whole
      population or leaves escapers.
    grain:
      measurement_type: sc_tumor_celltype_expression
      sample_context: tumor
      entity_grain: single_cell
    observables:
      - card_id: tumor-scrna-celltype-expression
        field: sc_expression_class
        role: estimator
        emission: class_token
        dependence_group: sc_tumor_atlas
      - card_id: tumor-scrna-celltype-expression
        field: malignant_detection_fraction
        role: estimator
        emission: anchor
        dependence_group: sc_tumor_atlas
      - card_id: tumor-scrna-celltype-expression
        field: malignant_n_donors
        role: estimator
        emission: anchor
        dependence_group: sc_tumor_atlas
        note: |
          The powering denominator. A detection fraction without a donor count is uninterpretable
          — one donor's 90% is not a population claim.
    determinants:
      - name: MALIGNANT_BROADLY_DETECTED_MIN
        value: 0.5
        unit: fraction_of_malignant_cells_detected
        source: methods/onc_methods/sc_tumor_expression_celltype/stats.py:23
        rationale: |
          Anchored to the single-cell convention: ~0.5 detection reads as "expressed in most cells
          of the compartment" (cross-donor median `malignant_detection_fraction`).
          Mirror sites carrying the SAME value under the same "broadly detected" meaning, for the
          non-malignant microenvironment compartments (a distinct population from `malignant`,
          hence a separate property is not warranted but the constant is worth tracking together
          so a future edit to one is visibly a divergence): `caf_compartment/read.py:29`
          (`_BROADLY_DETECTED_MIN`) and `myeloid_compartment/read.py:42` (same name).
        calibration:
          controls: null
          flip_matrix: null
          adjudication: null
      - name: MALIGNANT_SUBSET_DETECTED_MIN
        value: 0.10
        unit: fraction_of_malignant_cells_detected
        source: methods/onc_methods/sc_tumor_expression_celltype/stats.py:24
        rationale: |
          Anchored to the single-cell convention: ~0.1 detection reads as "a real expressing subset"
          (dropout-aware — scRNA under-detects, so a lower bar than the broadly-detected rung is
          deliberate). Same three-site mirror as `MALIGNANT_BROADLY_DETECTED_MIN`:
          `caf_compartment/read.py:30` and `myeloid_compartment/read.py:43` (both `_SUBSET_DETECTED_MIN`).
        calibration:
          controls: null
          flip_matrix: null
          adjudication: null
    consumers:
      - skill: tumor-presence
        axis_key: C
      - skill: surface-modality-fit
        surface: coverage_lens

  tumor_elevation_breadth:
    status: resolvable
    definition: |
      Across how many tumour cohorts is the target elevated, out of those tested? A
      generality/portfolio property at target grain — pan-cancer reach rather than depth in one
      indication.
    grain:
      measurement_type: tumor_elevation_breadth
      sample_context: tumor
      entity_grain: target
    observables:
      - card_id: tumor-elevation-breadth
        field: tumor_elevation_breadth_class
        role: estimator
        emission: class_token
        dependence_group: pancancer_elevation
      - card_id: tumor-elevation-breadth
        field: n_cohorts_elevated
        role: estimator
        emission: anchor
        dependence_group: pancancer_elevation
      - card_id: tumor-elevation-breadth
        field: n_cohorts_tested
        role: estimator
        emission: anchor
        dependence_group: pancancer_elevation
        note: |
          The denominator, and the reason this property is at `target` grain rather than per
          indication: 3-of-4 and 3-of-30 are different claims and the class token alone cannot
          distinguish them.
    determinants: []
    consumers:
      - skill: tumor-presence
        axis_key: D

  model_expression_structure:
    status: resolvable
    definition: |
      What is the SHAPE of the target's expression across a cell-line panel — level, breadth,
      spread, lineage structure? A model-grain property, deliberately NOT a proxy for the patient
      abundance property above.
    grain:
      measurement_type: cellline_rna_expression
      sample_context: cell_line
      entity_grain: bulk
    observables:
      - card_id: cellline-rna-distribution
        field: expression_class
        role: estimator
        emission: class_token
        dependence_group: depmap_rna
      - card_id: cellline-rna-distribution
        field: allgene_percentile
        role: estimator
        emission: anchor
        dependence_group: depmap_rna
    determinants:
      - name: broadly_high_fraction
        value: 0.30
        unit: fraction_of_panel_highly_expressing
        source: methods/onc_methods/depmap_expression_distribution/cli.py:244
        rationale: |
          UNKNOWN as a calibrated value. ADJUDICATED #2273 (2026-09-30): DOCUMENTED-INTENTIONAL,
          this constant NOT moved — the fraction-bar counterpart to #2221's anchor adjudication,
          following the same #809 phase-3b flip-matrix protocol. The `broadly_high` word is gated on
          the fraction-of-samples-highly-expressing at THREE sites:
            * site A — this `_classify_expression` knob, 0.30, over the WHOLE pan-cancer DepMap
              panel, GUARDED (reached only inside `frac_expressed >= 0.70`, splitting broadly_high
              from broadly_moderate);
            * site B — `expression_properties/resolve.py::_BROADLY_HIGH_FRACTION_MIN`, 0.50, reading
              the IDENTICAL `fraction_highly_expressed` field off the SAME summary dict at the SAME
              5.0 floor, UNGUARDED (`_prevalence`'s first rung -> broad; one OR-condition in
              `_magnitude` -> high);
            * site C — the tumour twin `tcga_gtex_expression_distribution/read.py::
              _classify_tumor_expression` inline 0.50, the SAME concept on a DIFFERENT denominator
              (one indication's tumour patients) and a DIFFERENT high floor (HIGH_LOG2TPM = 5.6724,
              the #2221 divergence), UNGUARDED first rung.
          Sites A and B are therefore a REAL same-quantity, same-panel divergence (0.30 vs 0.50),
          not the #2220 shared-numeral illusion; site C is the same concept on another panel/floor.
          Measured on the 11 committed cell-line vectors + the tumour anchor/panel fixtures (see
          `flip_matrix`): (1) the divergence is STRUCTURAL as well as numeric — at a shared 0.50 bar
          site A's guarded word and site B's unguarded word still disagree (APC, ERBB2), because B's
          `broad` also fires on the `frac_expressed >= 0.70` breadth rung A never uses; so
          harmonising the NUMBER alone would not converge the words (the #2221 shape of finding).
          (2) Costs: raising A 0.30->0.50 demotes ERBB2 + MET broadly_high->broadly_moderate — and
          `expression_class` feeds THIS property, so it moves the tumour-presence golden (FORBIDDEN
          this arc, #2061 / #1984 PR-B; #2227 filed-blocked). Lowering C 0.50->0.30 promotes 6
          tumour reads to broadly_high — also golden-touching, FORBIDDEN. The only golden-safe
          direction, lowering B 0.50->0.30, moves EPCAM/MET/TACSTD2 prevalence subset->broad (and 4
          magnitude reads), and REVERSES resolve.py's OWN documented arm-mirror of the tumour twin.
          (3) In `_magnitude` the `fh>=0.5` OR-condition is redundant today (fh>=0.5 forces
          median>=5.0), so B's 0.50 bites only in `_prevalence`; lowering it would broaden the reach.
          NO CHANGE because two of three directions touch the forbidden golden and the third is not a
          mechanical fix but an OWNER CALL — should resolve.py's pan-cancer bar mirror the tumour
          twin's NUMBER (0.50, agreement-by-value, current) or the cell-line classifier's
          DENOMINATOR-appropriate bar (0.30, since a pan-cancer panel dilutes)? Neither bar is
          calibrated and the deciding panel-composition noise floor is unmeasured for this panel
          (same honest limit as #2221). Routed up, not guessed. Same posture and answer as #2221/#2222.
        calibration:
          controls: null
          flip_matrix: methods/tests/calibration/threshold_adjudication/broadly_high_fraction_flip_matrix.json
          adjudication: "#2273"
      - name: lineage_restricted_min_fraction
        value: 0.10
        unit: fraction_of_panel_above_detection_floor
        source: methods/onc_methods/depmap_expression_distribution/cli.py:245
        rationale: |
          UNKNOWN. The lower edge of the `expression_class` band that reads as `lineage_restricted`
          (given >=1 enriched lineage) vs `broadly_low` below it. Shares a numeral with several
          OTHER determinants in this catalog (`_SUBSET_HIGH_FRACTION_MIN`, `_RARE_FRACTION`,
          `_PRESENCE_FLOOR_FRACTION` in expression.yaml) but is a DIFFERENT quantity — the panel
          fraction expressed at all, gating a lineage-structure word, not a presence or subset-high
          word. Not the same knob as `_LINEAGE_RESTRICTED_MAX_SHARE` (expression.yaml's
          `lineage_restriction` property, value 0.5, share-of-EVALUATED-lineages) — a name collision
          on "lineage_restricted" across two differently-grained quantities, not a value divergence.
        calibration:
          controls: null
          flip_matrix: null
          adjudication: "#2218"
      - name: lineage_restricted_max_fraction
        value: 0.70
        unit: fraction_of_panel_above_detection_floor
        source: methods/onc_methods/depmap_expression_distribution/cli.py:246
        rationale: |
          UNKNOWN. The upper edge of the same band as `lineage_restricted_min_fraction` above;
          numerically identical to `_BROAD_EXPRESSED_FRACTION` (expression.yaml, same unit) but that
          is the coincidence of a shared boundary between adjacent bands on the SAME `frac_expressed`
          axis (>=0.70 is `broadly_moderate`/`broadly_high` territory here; the two are read from the
          same cli.py `_classify_expression`), not an independent determinant to calibrate twice.
        calibration:
          controls: null
          flip_matrix: null
          adjudication: "#2218"
    integration_note: |
      This entry additionally carries the whole RESOLVED expression_properties object under
      `resolved_expression_properties` (presence_claims.py:814) when the card supplies it — the
      five resolvable properties in expression.yaml, recoverable rather than merely labelled. The
      cross-grain patient-vs-model comparison is NOT an L2b family today; it is surfaced as the
      display-level `cell_line_vs_tumor_discordant` facet, and whether it should be promoted is
      the open question in #2226.
    consumers:
      - skill: tumor-presence
        surface: source_properties.model_expression_structure
