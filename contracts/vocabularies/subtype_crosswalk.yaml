      - {indication: STAD, axis: tcga_molecular_class, cohort: depmap,
         measured: "all 4 strata 0 members of 0 evaluable (91 rows, all null)"}
      - {indication: PAAD, axis: moffitt_subtype, cohort: depmap,
         measured: "both strata 0 members of 0 evaluable (126 rows, all null)"}
      - {indication: PAAD, axis: fusion, cohort: depmap,
         measured: "no fusion stratum present in depmap-subgroup-assignments-paad-v1 at all"}
      - {indication: NSCLC, axis: fusion, cohort: depmap,
         measured: "no fusion stratum present in depmap-subgroup-assignments-nsclc-v1 (histology only)"}
      - {indication: STAD, axis: cn_amplification, cohort: depmap,
         measured: "HER2_amp absent from depmap-subgroup-assignments-stad-v1"}
      - {indication: ESCA, axis: cn_amplification, cohort: depmap,
         measured: "HER2_amp absent from depmap-subgroup-assignments-esca-v1 (histology only)"}

  no_expectation_declared:
    # Cohort claimed, but the catalog shard declares no expected_n key for it at all -- so the
    # claim is neither confirmed nor refuted. Distinct from a note saying NOT MEASURED.
    # ★ RESOLVED 2026-09-14 by MEASURE, not by DROP. AM#624 ran the assigner against DepMap source
    # data and BRCA TP53_mut has 32 members of 66 evaluable (of 114 rows) -- so the claim is TRUE and
    # stays. There is no depmap-subgroup-assignments-brca-* shard at all (re-counted 2026-09-19: the
    # 8 published DepMap shards cover COADREAD x2, ESCA, HNSC, NSCLC, PAAD, SCLC, STAD -- the earlier
    # "9" was an arithmetic error against this same enumeration, and the BRCA subgroup catalog says
