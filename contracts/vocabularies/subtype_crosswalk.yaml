    disposition: resolved_measured_claim_true_catalog_gains_the_key
    measured:
      - {indication: BRCA, axis: driver_mutation, stratum: TP53_mut, cohort: depmap,
         members: 32, evaluable: 66, state: measured, needs: expected_n_depmap key in the BRCA catalog}
      - {indication: BRCA, axis: driver_mutation, stratum: PIK3CA_mut, cohort: depmap,
         members: null, evaluable: null, state: not_yet_measured,
         needs: "an assigner run; PIK3CA_mut was not among AM#624's 13 effect-referencing cells"}

  pending_substrate:
