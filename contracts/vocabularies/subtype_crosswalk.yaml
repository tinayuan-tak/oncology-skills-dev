# ============================================================================================
# reader_routing — REGISTERING A STRATUM HERE DOES NOT CONNECT ITS DATA
# ============================================================================================
#
# WHY THIS BLOCK EXISTS (stage 3d, 2026-09-14): stage 3d authored the HNSC and ESCA axes above and
# then measured what a consumer actually gets, because REGISTERING a stratum here is only link 2 of
# three: (1) data-catalog PUBLISHES an assignments shard, (2) this registry REGISTERS the stratum,
# (3) a per-indication routing table maps the indication to that shard. A zero-diff replay over a
# newly authored axis is ambiguous between "safe" and "never reached", and this block says which.
#
# ★★ CORRECTED 2026-09-19 -- THE ORIGINAL SUBJECT WAS WRONG, AND WRONG ON THE DAY IT WAS WRITTEN.
# This block used to say link 3 was "MISSING for HNSC and ESCA" and that a consumer gets NOTHING.
# Re-measured by brace-matching every routing table and testing KEY MEMBERSHIP (not a substring
# grep), across all four arms that consume this registry:
#
#   TCGA tumor RNA (base strata)  analysis-methods methods/tcga_gtex_expression_distribution/read.py
#                                 INDICATION_TO_TUMOR_ASSIGNMENT_MANIFEST
#                                 -> HNSC + ESCA ROUTED since 2026-08-04 (AM#124 b65b462)
#   TCGA tumor genomic (MAF)      same file, INDICATION_TO_TUMOR_MAF_MANIFEST
#                                 -> HNSC + ESCA ROUTED since 2026-08-04 (AM#135 379461e)
#   DepMap cell line              skills _live_readers.py _CELLLINE_SUBTYPE_ASSIGNMENTS
#                                 -> HNSC + ESCA ROUTED since 2026-09-18 (skills#1464 e85fad49),
#                                    which grew it from 3 keys/1 shard to 14 keys/7 shards
#   CPTAC tumor protein           skills _live_readers.py _TUMOR_PROTEIN_SUBTYPE_ASSIGNMENTS
#                                 -> COADREAD ONLY, and that is a SUBSTRATE limit, not a wiring gap:
#                                    CPTAC has exactly one published assignments shard.
#
# ★ HOW THE ORIGINAL MEASUREMENT MISSED IT -- the transferable lesson: the 2026-09-14 census
# enumerated the seven `*ASSIGNMENTS*` dicts INSIDE _live_readers.py and found no "HNSC" or "ESCA",
# which was TRUE OF THAT FILE and is still true of six of the seven. But the TCGA tumor arms -- the
# arms the authored axes actually feed -- resolve their shard in ANALYSIS-METHODS, from a table that
# had already carried both codes for six weeks. A census bounded by one FILE cannot see a link that
# lives in another REPO. Enumerate by CONSUMER ("which table does THIS arm read?"), never by file.
#
# ★ WHAT IS GENUINELY UNROUTED TODAY: BRCA, on every arm -- and the cause is LINK 1, not link 3.
# BRCA is registered below with three axes and the string "BRCA" does not occur in _live_readers.py
# at all. No BRCA assignments shard is published in any cohort: eight depmap-subgroup-assignments-*
# shards exist (coadread, coadread-cms, esca, hnsc, nsclc, paad, sclc, stad) and BRCA is absent. The
# DepMap assigner HAS been run for BRCA (AM#624, TP53_mut 32 members of 66 evaluable -- see
# `cohort_claim_reconciliation` above) but nothing was PUBLISHED, which the BRCA subgroup catalog
# states twice. Wiring link 3 for BRCA would route a shard that does not exist, so the fix is a
# catalog PUBLICATION, not a reader edit.
#
# ★★ REPLAY-DIFF WARNING -- THE CONCLUSION MAY STILL HOLD, THE STATED MECHANISM DOES NOT. The
# original text explained a zero-diff by "the dispatchers short-circuit on `manifest is None` BEFORE
# they look at which strata were requested". That mechanism is FALSE for three of the four arms
# above, which DO resolve a manifest for HNSC/ESCA. The tumor subtype dispatcher is
# COMPUTE-ALL-SPOTLIGHT-ONE -- it fans out over every stratum of the indication's landed SHARD
# regardless of what this registry requests -- so authoring strata here can still be inert to that
# arm, but only where the shard does not carry the authored stratum, which is a narrower claim.
# Concretely it is NOT uniformly inert: tcga-subgroup-assignments-hnsc-maf-v1 IS routed and its
# verified-powered strata are TP53_mut and PIK3CA_mut -- two of the three HNSC driver_mutation strata
# stage 3d authored -- so those two are SERVABLE, which the original block denied. NOT RE-MEASURED
# 2026-09-19: whether `provenance.scope_subtypes` is still the only changed key. Read the field below
# as the 2026-09-14 measurement it was, not as a re-verified fact.
#
# ★ WHY AUTHORING WAS STILL THE RIGHT MOVE (unchanged): link 3 cannot be built without link 2.
# `default_subtypes` only requests strata this registry lists, so wiring an indication while its
# strata sat in `pending_authoring` would route a shard nothing ever asks for. Registration is the
# PREREQUISITE, and it makes a gap visible where it was previously silent -- which is the whole
# premise of the reverse subtype guard.
#
# NO LONGER "NOT DONE HERE": the DepMap cell-line wiring this block deferred to a peer claim on
# _skills_common/ LANDED in skills#1464 (e85fad49), deliberately mirroring the TCGA arm's alias keys
# so the two arms resolve the same indications.
reader_routing:
  registration_is_not_routing: true
  measured_on: 2026-09-19
  # `link_3_file` is the one the liveness test re-measures. The TCGA arms' table is the sibling
  # below, and OMITTING it is exactly how the 2026-09-14 census reached a false conclusion.
  link_3_file: claude-oncology-skills/skills/_skills_common/_live_readers.py
  link_3_file_tcga_arms: analysis-methods/methods/tcga_gtex_expression_distribution/read.py
  unrouted_indications: [BRCA]
  # TWO counts, because one cannot answer both questions and the single earlier value was compared
  # against the wrong one: `declared` guards "a NEW registry appeared that might route the subject",
  # while `returning_none` is the measured per-subject answer. They are equal today only because
  # BRCA is absent from all seven; they are free to diverge, and a divergence is the signal.
  registries_declared_in_link_3_file: 7
  registries_returning_none: 7
  observable_change_from_authoring: provenance.scope_subtypes only (HNSC 6->11, ESCA 3->4) -- 2026-09-14 measurement; mechanism corrected 2026-09-19, value NOT re-measured
  blocked_on: link_1_no_published_brca_assignments_shard_in_any_cohort
  # ★ A THIRD FAILURE CATEGORY the original block did not model -- and the one that every
  # `driver_mutation` + `cohorts: [depmap]` claim below actually hits. The indication IS routed; there
  # is simply no DepMap GENOMIC-STRATA shard to route to. Measured 2026-09-19 from the shards' own
  # `parameters.assigner_method`: all 8 published depmap-subgroup-assignments-* shards are
  # subgroup_assigner_directly_tagged (6) or subgroup_assigner_classifier (2) -- ZERO are
  # subgroup_assigner_maf_filter, while TCGA publishes 5 of those. So the DepMap side can serve
  # histology / MSI / CMS / NAPY strata but cannot serve a driver-mutation stratum for ANY indication,
  # which is why AM#624 could MEASURE those members (it ran the assigner against source data) without
  # any of them becoming servable. This is per-AXIS, not per-indication, so `unrouted_indications`
  # cannot express it -- do not collapse the two categories, and do not "fix" it by narrowing
  # `cohorts:` (see `authoring_rule`: that would delete a measured biological fact).
  depmap_genomic_strata_publication_gap:
    measured_on: 2026-09-19
    depmap_maf_filter_shards_published: 0
    tcga_maf_filter_shards_published: 5
    affected: driver_mutation x cohorts[depmap] for COADREAD, NSCLC, PAAD, ESCA, HNSC, BRCA

indications:

  # ============================================================================
  # COADREAD — the reference (fully covered: TCGA + DepMap + GENIE-BPC)
  # ============================================================================
  - canonical_code: COADREAD
    axes:
      - axis: msi_status
        strata: [MSI_H, MSS]
        cohorts: [tcga, depmap]          # the ONE COADREAD axis with DepMap cell-line members
        partition: mutually_exclusive
      - axis: molecular_subtype          # Guinney 2015 CMS (TCGA patient, directly-tagged)
        strata: [CMS1, CMS2, CMS3, CMS4]
        cohorts: [tcga]                  # PATIENT — the trusted Guinney labels (expected_n_depmap: 0 on THESE ids)
        partition: mutually_exclusive
      - axis: molecular_subtype_depmap   # CMS on DepMap Bowel lines (CMScaller NTP, method=cms_classifier).
                                         # DISTINCT ids from the TCGA CMS (option B, CMS_CLASSIFIER_DESIGN.md):
                                         # isolates the HYPOTHESIS-GENERATING cell-line call from the trusted
                                         # TCGA labels. Shard depmap-subgroup-assignments-coadread-cms-v1
                                         # (CMS1_depmap 17 / CMS2_depmap 41 / CMS3_depmap 19 / CMS4_depmap 33;
                                         # 21 unclassifiable). CMS1/CMS4 (immune/mesenchymal) recover poorly
                                         # on cell lines — lower confidence.
        strata: [CMS1_depmap, CMS2_depmap, CMS3_depmap, CMS4_depmap]
        cohorts: [depmap]
        partition: mutually_exclusive
      - axis: cimp_status
        strata: [CIMP_High, CIMP_Low, CIMP_Neg]
        cohorts: [tcga]
        partition: mutually_exclusive
      - axis: sidedness
        strata: [right_sided, left_sided]
        cohorts: [tcga]                  # sidedness UNMEASURABLE on DepMap (collection-site != primary sidedness)
        partition: mutually_exclusive
      - axis: driver_mutation
        strata: [KRAS_mut, KRAS_G12C, BRAF_V600E]
        cohorts: [tcga, depmap, genie]
      - axis: line_of_therapy
        strata: [LOT_1L_only, LOT_2L, LOT_3Lplus]
        cohorts: [genie_bpc]
    # Cross-axis associations (documented in the catalog prose; made machine-readable here).
    associations:
      - from: MSI_H
        to: CMS1
        relationship: enriched_in
        note: "MSI-H is CMS1-associated (Guinney 2015); most CMS1 is MSI-H/hypermutated/immune, but the sets are not equal. A weak bridge for coherence — report 'related', never 'same stratum'."
      - from: BRAF_V600E
        to: CMS1
        relationship: enriched_in
        note: "BRAF-V600E enriched in CMS1 (MSI-immune) + CIMP-High; right-sided."
      - from: MSI_H
        to: CIMP_High
        relationship: enriched_in
        note: "CIMP-High strongly MSI-H-enriched + BRAF-V600E-enriched (Weisenberger 2006)."
      - from: CMS4
        to: right_sided
        relationship: enriched_in
        note: "Mesenchymal CMS4 right-sided-enriched; TGF-beta/stromal biology."
      - from: CMS2
        to: left_sided
        relationship: enriched_in
        note: "Canonical CMS2 left-sided-enriched; WNT/MYC, best survival."
      - from: KRAS_mut
        to: CMS3
        relationship: enriched_in
        note: "Metabolic CMS3 KRAS-mutation-enriched."
      # DepMap-CMS ↔ TCGA-CMS cohort bridges: the CMScaller cell-line call is the SAME CMS biology as
      # the Guinney TCGA label, measured on a different cohort (co_defining — two axes partitioning the
      # same subtype across cohorts). The coherence facet relates them as RELATED + cohort_bridge=true
      # (DepMap vs TCGA), NEVER merges them — the hypothesis-generating cell-line call stays distinct
      # from the trusted patient label.
      - from: CMS1_depmap
        to: CMS1
        relationship: co_defining
        note: "DepMap CMScaller CMS1 call is the CMS1 biology on cell lines (hypothesis-generating; CMS1 immune-defined, recovers poorly off-tissue). Cohort bridge to the TCGA Guinney CMS1."
      - from: CMS2_depmap
        to: CMS2
        relationship: co_defining
        note: "DepMap CMScaller CMS2 call ↔ TCGA Guinney CMS2 (canonical). Cohort bridge, same biology."
      - from: CMS3_depmap
        to: CMS3
        relationship: co_defining
        note: "DepMap CMScaller CMS3 call ↔ TCGA Guinney CMS3 (metabolic). Cohort bridge, same biology."
      - from: CMS4_depmap
        to: CMS4
        relationship: co_defining
        note: "DepMap CMScaller CMS4 call ↔ TCGA Guinney CMS4 (mesenchymal; stroma-defined, recovers poorly off-tissue — hypothesis-generating). Cohort bridge."

  # ============================================================================
  # NSCLC — histology + drivers + fusions (histology data_blocked pending clinical loader)
  # ============================================================================
  - canonical_code: NSCLC
    axes:
      - axis: histology
        strata: [histology_Adeno, histology_SCC]
        cohorts: [tcga, depmap]          # LUAD/LUSC. TCGA patient (tcga-subgroup-assignments-nsclc-v1:
                                         # Adeno 230/SCC 178) + DepMap cell-line (depmap-subgroup-
                                         # assignments-nsclc-v1: Adeno 118/SCC 32, from OncotreeSubtype).
                                         # No longer data_blocked — both shards are materialized (2026-09-11).
        partition: co_defining
      - axis: driver_mutation
        strata: [EGFR_mut_ex19del, EGFR_mut_L858R, EGFR_mut_ex20ins, KRAS_G12C, KRAS_G12D, BRAF_V600E, MET_ex14, HER2_mut]
        cohorts: [tcga, depmap, genie]
      - axis: fusion
        strata: [ALK_fusion, ROS1_fusion, RET_fusion, NTRK_fusion]
        cohorts: [tcga, genie]
      - axis: tmb
        strata: [TMB_high]
        cohorts: [tcga]
      - axis: line_of_therapy
        strata: [LOT_1L_only, LOT_2L, LOT_3Lplus]
        cohorts: [genie_bpc]
    associations:
      - from: EGFR_mut_L858R
        to: histology_Adeno
        relationship: enriched_in
        note: "EGFR-mutant NSCLC concentrated in adenocarcinoma (LUAD)."
      - from: ALK_fusion
        to: histology_Adeno
        relationship: enriched_in
        note: "ALK/ROS1/RET fusions concentrated in LUAD."

  # ============================================================================
  # SCLC — NAPY (cell-line classifier; patient George cohort)
  # ============================================================================
  - canonical_code: SCLC
    axes:
      - axis: napy
        strata: [SCLC_A, SCLC_N, SCLC_P, SCLC_Y]
        cohorts: [depmap, george_2015]   # NAPY: classifier-derived; only SCLC_A clears n>=30
        partition: mutually_exclusive
      - axis: target_high
        strata: [DLL3_high]
        cohorts: [depmap]
    associations:
      - from: DLL3_high
        to: SCLC_A
        relationship: enriched_in
        note: "DLL3 (Notch ligand) expression is ASCL1(SCLC-A)-driven; DLL3-high concentrated in SCLC-A."

  # PAAD / HNSC / STAD / ESCA: patient-side subtypes present; DepMap subtype members mostly null.
  # Enumerated minimally here; cross-axis associations are indication-specific follow-ups.
  - canonical_code: PAAD
    axes:
      - axis: moffitt_subtype
        strata: [Moffitt_basal, Moffitt_classical]
        cohorts: [tcga]                  # 0 DepMap Moffitt calls (all-null on cell lines)
        partition: mutually_exclusive
      - axis: driver_mutation
        strata: [KRAS_G12D, KRAS_G12V, KRAS_G12R, KRAS_WT, TP53_mut, BRCA1_somatic, BRCA2_somatic]
        cohorts: [tcga, depmap, genie]
      - axis: fusion
        strata: [NTRK_fusion, FGFR2_fusion, RET_fusion_PAAD]
        cohorts: [tcga]
    associations: []

  - canonical_code: STAD
    axes:
      - axis: tcga_molecular_class
        strata: [EBV_positive, MSI_H, GS, CIN]
        cohorts: [tcga]                  # 4-class EBV/MSI/GS/CIN; DepMap all-null
        partition: mutually_exclusive
      - axis: cn_amplification
        strata: [HER2_amp]
        cohorts: [tcga]
    associations: []

  - canonical_code: ESCA
    axes:
      - axis: histology
        strata: [histology_ESCC, histology_EAC]
        cohorts: [tcga, depmap]
        partition: co_defining
      - axis: cn_amplification
        strata: [HER2_amp]
        cohorts: [tcga]                  # measured 28 of 169 evaluable -> UNDERPOWERED (n<30)
      # Authored 2026-09-14 (stage 3d) off MEASURED n. New axis, not an append: ESCA had no
      # driver_mutation axis, which is why its catalog's 4th stratum was an orphan.
      - axis: driver_mutation
        strata: [TP53_mut]
        cohorts: [tcga, depmap]          # tcga-subgroup-assignments-esca-maf-v1: 131 members of
                                         # 169 evaluable of 169 rows -> MEASURED (n>=30).
                                         # depmap: 51 of 83 evaluable -> MEASURED (AM#624, run
                                         # against DepMap source). NOT SERVABLE on depmap, and the
                                         # reason is GENERAL, not ESCA-specific: no depmap shard uses
                                         # the maf_filter assigner (0 of 8) -- see
                                         # `reader_routing.depmap_genomic_strata_publication_gap`.
                                         # `cohorts:` records members-exist, not shard coverage.
    associations: []

  - canonical_code: HNSC
    axes:
      - axis: bass_subtype
        strata: [subtype_atypical, subtype_mesenchymal, subtype_basal, subtype_classical]
        cohorts: [tcga]
        partition: mutually_exclusive
      - axis: hpv_status
        strata: [HPV_positive, HPV_negative]
        cohorts: [tcga]                  # ★ COMMENT CORRECTED 2026-09-14 (stage 3d). It previously
                                         # read "data_blocked — HPV in no held source (see repoint
                                         # runbook)". MEASURED FALSE: tcga-subgroup-assignments-
                                         # hnsc-v1 emits HPV_negative 45 and HPV_positive 7 of 52
                                         # EVALUABLE (227 of 279 samples abstain). The source is
                                         # held; the DENOMINATOR is thin. Both strata stay
                                         # registered per `authoring_rule` -- underpowered is not
                                         # absent -- with HPV_positive (n=7) UNDERPOWERED and
                                         # therefore inadmissible in comparative prose.
        partition: mutually_exclusive
      # ---- authored 2026-09-14 (stage 3d) off MEASURED n; see `authoring_rule` above ----
      # ★ `cohorts:` HERE MEANS "members exist on this cohort" (this file's header: "the COHORTS that
      # actually carry members for it"), NOT "a published shard serves this cohort". The two differ
      # for the drivers below and the distinction is deliberate: AM#624 measured DepMap membership by
      # running the assigner against DepMap source data (TP53_mut 42 of 54 evaluable, PIK3CA_mut 8 of
      # 95, NOTCH1_mut 7 of 95), but depmap-subgroup-assignments-hnsc-v1 is a DIRECTLY-TAGGED shard
      # (`parameters.assigner_method`) and therefore carries no driver-mutation strata at all.
      # Narrowing `cohorts:` to what a shard happens to serve today would DELETE a measured
      # biological fact to match the current substrate -- and _live_readers.py:559 already states the
      # shard is "the authoritative what's-servable, MORE PRECISE than the crosswalk cohort", so the
      # consumer expects this lane to be the broader one. The servability gap is recorded in
      # `reader_routing.depmap_genomic_strata_publication_gap` below (0 of 8 depmap shards use the
      # maf_filter assigner), which is where a substrate fact belongs -- NOT in
      # `unrouted_indications`, which is about the indication, not the axis. Same reading as the
      # landed NSCLC/PAAD/BRCA driver_mutation depmap claims, which hit the identical gap.
      - axis: driver_mutation
        strata: [TP53_mut, PIK3CA_mut, NOTCH1_mut]
        cohorts: [tcga, depmap]          # tcga-subgroup-assignments-hnsc-maf-v1, 277 evaluable:
                                         # TP53_mut 181 MEASURED / PIK3CA_mut 38 MEASURED /
                                         # NOTCH1_mut 20 UNDERPOWERED. depmap (AM#624, live source,
                                         # no shard): 42 MEASURED / 8 / 7 UNDERPOWERED.
                                         # NOTCH1_mut is registered BECAUSE underpowered != absent;
                                         # it is labelled, not dropped (see admissibility_floors).
      - axis: cn_amplification
        strata: [CCND1_amp]
        cohorts: [tcga]                  # tcga-subgroup-assignments-hnsc-v1: 69 of 276 evaluable
                                         # -> MEASURED. depmap NOT claimed, and note the reason is
                                         # NOT the catalog's `expected_n_depmap: 0` (that is an N/A
                                         # sentinel, which the NSCLC case below proves is no
                                         # evidence): CCND1_amp is simply UNMEASURED on DepMap in
                                         # either direction. No members-exist fact => no claim.
                                         # Absence of a measurement is not a measurement of absence.
      - axis: tmb
        strata: [TMB_high]
        cohorts: [tcga]                  # tcga-subgroup-assignments-hnsc-v1: 27 of 277 evaluable
                                         # -> UNDERPOWERED (n<30). Registered and labelled.
                                         # Mirrors the NSCLC `tmb` axis shape exactly (also [tcga]).
    associations:
      - from: HPV_positive
        to: subtype_atypical
        relationship: enriched_in
        note: "HPV+ HNSC concentrated in the Atypical Bass subtype + oropharyngeal site."
      # ★ NO ASSOCIATIONS AUTHORED FOR THE FOUR NEW STRATA, AND THE REASON IS THIS FILE'S OWN RULE.
      # The co-occurrence was measured on the samples evaluable for BOTH axes and it reproduces the
      # textbook HNSC picture: TP53_mut 34/44 (77.3%) of HPV-negative vs 0/7 (0.0%) of HPV-positive;
      # CCND1_amp 12/45 (26.7%) vs 0/7; NOTCH1_mut 3/44 vs 0/7; and PIK3CA_mut INVERTED at 5/44
      # (11.4%) vs 2/7 (28.6%), consistent with PIK3CA being the dominant HPV+ driver.
      # BUT the HPV-positive arm is n=7 -- UNDERPOWERED -- and `authoring_rule` states that an
      # underpowered stratum is inadmissible in CROSS-STRATUM COMPARATIVE prose. An `enriched_in`
      # edge is exactly such a comparison, and the coherence facet treats it as a real (if weak)
      # bridge. Strong literature support does not substitute for a powered denominator, so these
      # edges are deliberately NOT authored. Revisit when the HPV denominator grows past 30
      # evaluable HPV-positive samples (today: 7 of 279).

  # ============================================================================
  # BRCA — PAM50 intrinsic subtypes (added 2026-08-09 with the new BRCA/PAM50 catalog, DC#311)
  # ============================================================================
  - canonical_code: BRCA
    axes:
      - axis: pam50_subtype           # Parker 2009 intrinsic subtypes (curated Subtype_Selected)
        strata: [PAM50_LumA, PAM50_LumB, PAM50_Her2, PAM50_Basal, PAM50_Normal]
        cohorts: [tcga]               # patient-only iter-1 (directly-tagged); DepMap PAM50 = iter-2 classifier
        partition: mutually_exclusive
      - axis: driver_mutation
        strata: [TP53_mut, PIK3CA_mut]
        cohorts: [tcga, depmap]
      - axis: cn_amplification
        strata: [ERBB2_amp]
        cohorts: [tcga]
    associations:
      # HER2-enriched INTRINSIC (PAM50) vs clinical HER2+ (ERBB2-amp): overlapping, NOT identical —
      # enriched_in captures that most ERBB2-amp is PAM50_Her2 while the sets differ.
      - from: ERBB2_amp
        to: PAM50_Her2
        relationship: enriched_in
        note: "Clinical HER2+ (ERBB2-amp) is enriched in the HER2-enriched INTRINSIC subtype, but the two are distinct axes (some ERBB2-amp are non-Her2-intrinsic and vice versa)."
      # TP53 loss is the genomic hallmark of Basal-like/TNBC-adjacent breast cancer.
      - from: TP53_mut
        to: PAM50_Basal
        relationship: enriched_in
        note: "TP53 LoF is strongly enriched in Basal-like (~80% of Basal/TNBC), the genomically-unstable arm."
      # PIK3CA activation concentrates in the luminal (ER+) intrinsic subtypes.
      - from: PIK3CA_mut
        to: PAM50_LumA
        relationship: enriched_in
        note: "PIK3CA activating mutations are luminal-enriched (LumA/LumB); alpelisib biomarker in HR+/HER2-."
