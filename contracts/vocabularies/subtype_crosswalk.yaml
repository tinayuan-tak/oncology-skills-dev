# ============================================================================================
# admissibility_floors — the governed subgroup-n floors, and what they actually DO
# ============================================================================================
#
# WHY THIS BLOCK EXISTS (foundation audit stage 3c, 2026-09-14): `pending_authoring` above names the
# sequence "measure n -> declare an admissibility floor -> author only what clears it". Stages 3a/3b
# measured all 180 expected_n declarations (data-catalog #598). This block is the middle step, which
# had never been taken: NO repo declared a floor. Sixteen literals in two families enforced one, and
# the ONLY thing keeping them consistent was prose comments naming each other.
#
# ★ THE AUDIT'S OWN PREMISE WAS WRONG AND THE MEASUREMENT CORRECTED IT. The plan said "three
# unreconciled literals ... one number read by all three, or an explicit statement of why a cohort
# legitimately differs". Measuring found the literals are not three but sixteen, and -- the load-
# bearing correction -- they do not differ by COHORT or by UNIT. They govern different POPULATIONS:
#   * family `subgroup_stratum_n` counts members of ONE STRATUM within one indication cohort;
#   * family `lineage_n`          counts cell lines within ONE LINEAGE, for per-lineage statistics.
# A lineage is not a stratum, so there is no number for both to share. `subgroup_stratum_n` is
# applied to patient counts AND cell-line counts at the same value of 30 -- verified, not assumed:
# analysis-methods methods/gdc_somatic_hotspot/read.py:543 applies it to TCGA patients and
# methods/depmap_chronos/read.py:208 applies it to DepMap cell lines, both `n >= SUBGROUP_N_FLOOR`.
# So "5 is cell lines, 30 is patients" -- which is what this audit believed going in -- is FALSE.
#
# ★★ THE FLOOR IS A LABELLING MECHANISM, NOT AN ADMISSION ONE. This is the single most important
# thing in this block, and it is why authoring is not gated on n >= 30. `subgroup_common/panorama.py
# ::evidence_state()` returns a TRICHOTOMY -- absent / underpowered / measured -- and an
# `underpowered` stratum is still computed, still emitted and still RENDERED; it is inadmissible only
# in COMPARATIVE prose (see the `powered` predicates in skills/_skills_common/subgroup_derivation.py
# and functional-requirement/scripts/run.py, which gate cross-stratum contrast, not existence).
# The governed authoring rule therefore already existed in code and had simply never been written
# down: it IS the trichotomy. See `authoring_rule` below.
#
# ★ THIS BLOCK IS DESCRIPTIVE, NOT PRESCRIPTIVE. Every number here is the value in force on
# 2026-09-14. CHANGING either floor is VERDICT-BEARING and deliberately out of scope: lowering
# `subgroup_stratum_n` to 5 would flip SCLC_P (measured n=8 DepMap lines) from `underpowered` to
# `measured`, which changes WHICH interpretation rule fires -- from
# `subtype-restricted-dependency-underpowered-supportive` to `subtype-restricted-dependency-
# supportive` -- and thereby lifts the "never dominant, never alone-sufficient" cap that the former
# carries. That is a verdict change disguised as a threshold tweak, and the escape hatch below is
# the better mechanism anyway because it gates on EFFECT SIZE rather than merely on a smaller n.
admissibility_floors:

  - family: subgroup_stratum_n
    value: 30
    population: "Members of ONE stratum within ONE indication cohort."
    units_applied_to: [tcga_patients, depmap_cell_lines, cptac_patients]
    declares: "The boundary between evidence_state `underpowered` and `measured`. NOT an
      existence or authoring gate -- see authoring_rule."
    canonical_definition: "analysis-methods methods/subgroup_common/panorama.py:37 SUBGROUP_N_FLOOR"
    # ★ That file's own comment reads "SINGLE SOURCE OF TRUTH -- readers import this, never
    # re-hardcode." Eight analysis-methods methods DO import it, correctly. Four skills modules
    # cannot: the skills repo has no import path to analysis-methods, so each re-declares the
    # literal. The claim is therefore false BY STRUCTURE, not by anyone's oversight, and no edit
    # inside analysis-methods can make it true. All five values agree TODAY; nothing enforces that.
    definition_sites:
      importers_of_canonical:
        - analysis-methods methods/depmap_chronos/read.py:208
        - analysis-methods methods/depmap_expression_distribution/read.py:154
        - analysis-methods methods/gdc_somatic_hotspot/read.py:543
        - analysis-methods methods/dge_deseq2/read.py:1594
        - analysis-methods methods/tcga_fusion_consensus/stratified.py:109
        - analysis-methods methods/tcga_patient_cn/stratified.py:65
        - analysis-methods methods/cptac_protein_distribution/read.py:75
        - analysis-methods methods/tcga_gtex_expression_distribution/read.py:1045,1336
      re_hardcoded_no_import_path:
        - skills/_skills_common/subgroup_derivation.py:327      # ★ carries NO mirror comment at all
        - skills/functional-requirement/scripts/run.py:181
        - skills/tumor-presence/scripts/run.py:72               # ★ comment conflates BOTH families
        - skills/render-evidence-package/scripts/render_markdown.py:687
      in_repo_rule_literals:                                    # this repo, interpretation-rules/
        - {rule_id: subtype-non-dependence-opposing, min_n_required: 30}
        - {rule_id: subtype-restricted-dependency-supportive, min_n_required: 30}
        - {rule_id: subtype-restricted-selectivity-supportive, min_n_required: 30}
        - {rule_id: subtype-expression-enriched-context, min_n_required: 30}
        - {rule_id: subtype-expression-restricted-context, min_n_required: 30}
        - {rule_id: subtype-expression-depleted-context, min_n_required: 30}
        - {rule_id: subtype-mutation-frequency-recurrent-context, min_n_required: 30}
    documented_exception:
      rule_id: subtype-restricted-dependency-underpowered-supportive
      min_n_required: 3
      # ★ NOT drift, and not a competing floor. Keyed on `evidence_state: underpowered` +
      # `subgroup_effect_admissible: true`, so it is DISJOINT from the floor-cleared rule (which
      # requires `measured`) and cannot double-fire. The 3 is an EFFECT-ADMISSIBILITY minimum, not a
      # relaxed power floor: admission additionally requires an overwhelming fraction of lines in the
      # strong-dependency band, i.e. a tight one-directional effect rather than a noisy mean on thin
      # data. Its own rationale states a hard n>=30 floor "would silently discard a genuine, clean
      # precision-oncology signal". Motivating case SCLC-P/POU2F3, described in-rule as ~5 tuft-cell
      # lines; this arc MEASURED it at n=8 of 63 evaluable DepMap lines. Capped supportive-only.

  - family: lineage_n
    value: 5
    population: "DepMap cell lines within ONE LINEAGE (or OncotreeCode), for per-lineage statistics."
    units_applied_to: [depmap_cell_lines]
    declares: "Whether a lineage is included in per-lineage enrichment/selectivity statistics at
      all -- an EXCLUSION gate on a statistic, not a label on a stratum. Different population and
      different consequence from subgroup_stratum_n; the two are not reconcilable to one number."
    canonical_definition: "cards/dependency-lineage-selectivity.card.yaml:127 min_cell_lines_in_lineage"
    definition_sites:
      - cards/dependency-lineage-selectivity.card.yaml:127                    # origin ("E2")
      - cards/prism-compound-activity.card.yaml:163                           # "mirrors E2"
      - analysis-methods methods/depmap_prism_precompute/cli.py:155           # "E2 parity"
      - skills/functional-requirement/scripts/run.py:716                      # _LINEAGE_UNDERPOWER_FLOOR

# ---- authoring_rule: when may a stratum be REGISTERED here? ----
#
# The rule that governs `pending_authoring` graduation. It is deliberately NOT "n >= 30", because
# that would confuse labelling with admission and, measured against the corpus, would retroactively
# disqualify 36 of the 84 already-registered measured cells (43%) -- including essentially the whole
# NSCLC actionable-driver panel (EGFR ex19del/L858R/ex20ins, ALK, ROS1, RET, MET ex14, BRAF V600E,
# HER2_mut), PAAD BRCA1/2 and KRAS G12R/G12V, HNSC HPV_positive, ESCA HER2_amp, STAD EBV_positive,
# and three of the four SCLC NAPY subtypes. Those are the clinically load-bearing strata of this
# whole framework; a floor that deletes them is measuring the wrong thing.
authoring_rule:
  registrable_when: "evidence_state(measured_n) != 'absent' for at least one declared cohort"
  # i.e. the stratum has >=1 measured member SOMEWHERE. `absent` means no members in the stratum
  # intersected with the method cohort -- there is nothing to stratify, so registering it would
  # create a stratum the subtype tier can never populate.
  floor_sets: claim_strength_not_existence
  states:
    absent:       "n == 0 on an EVALUATED cohort. NOT registrable for that cohort."
    underpowered: "1 <= n < 30. Registrable, computed, emitted and rendered; inadmissible in
                   CROSS-STRATUM COMPARATIVE prose. 36 of 84 measured cells sit here today."
    measured:     "n >= 30. Full comparative admissibility. 43 of 84 measured cells."
  # ★★ `evaluable == 0` IS NOT `n == 0`. A stratum whose every row abstained has measured NOTHING
  # and is `not_measured`, NOT `absent`. Conflating them is the exact defect analysis-methods #626
  # fixed one level down (DepMap opting out of normalize_effect made 13 strata report 0-of-N as
  # is_member=False rather than null). A `0` in a catalog is only an ABSENCE claim when its
  # `_denominator_note` says `Observed emit` -- the same 0 also serves as an N/A sentinel. This is
  # why the note is mandatory: schemas/subgroup_catalog.schema.json makes the pairing bidirectional
  # via `dependentRequired`, so a count can no longer ship without saying which kind of 0 it is.
  cohorts_key_semantics: "A cohort listed in an axis's `cohorts:` is a CLAIM that the stratum has
    members there -- the header states it records 'WHICH axes can even carry a given stratum'.
    Combined with the trichotomy this is checkable for the first time, which is what produced
    cohort_claim_reconciliation below."

# ============================================================================================
# cohort_claim_reconciliation — the 130 `cohorts:` claims checked against measurement
# ============================================================================================
#
# RECORDED, NOT FIXED. Every correction below is VERDICT-BEARING (removing a cohort from an axis
# changes which panoramas a profile builds), so it belongs behind the composed replay diff in
# stage 3d, not here. Pinned BY NAME so a new discrepancy is an error rather than a silent addition,
# and so removing one requires deleting its entry -- the reverse-guard pattern from #598.
#
# Census of all 130 (indication, axis, stratum, cohort) claims on 2026-09-14:
#   79 claim holds (measured, >=1 member)          10 not measurable, unresolvable
#   34 no expected_n key exists for that cohort     5 CONTRADICTED by measurement
#    2 CONTRADICTED by the catalog's own applicable_data_sources
cohort_claim_reconciliation:

  # ============================================================================================
  # ★★ STAGE 3D RE-MEASURED THIS BLOCK AGAINST THE SHARDS AND FOUND IT WRONG IN TWO WAYS.
  # Read this before acting on any `disposition: fix_in_stage_3d` below -- three of them are
  # now known to have pointed at the wrong file.
  #
  # (1) THE BLOCK CHECKED ONE DIRECTION. It recorded only claims this registry makes that the
  #     catalogs deny (OVER-claims). Re-running the comparison in BOTH directions found 12 axis-level
  #     disagreements, not 5: 5 over-claims and 7 UNDER-claims, where a catalog stratum's
  #     `applicable_data_sources` allows a cohort this registry omits. Every guard has a DIRECTION and
  #     this one had one -- the identical defect the reverse subtype guard was built to fix, committed
  #     one file away from it. The 7 under-claims are recorded in `catalog_over_declares` below.
  #
  # (2) `applicable_data_sources` IS NOT EVIDENCE, AND NEITHER IS `expected_n_<cohort>: 0`. Both were
  #     treated as authoritative here. Measuring the published shards directly falsified that:
  #       * NSCLC histology_Adeno / histology_SCC were filed under `source_excluded` on the strength
  #         of `applicable_data_sources: [tcga]` plus `expected_n_depmap: 0`. The DepMap shard
  #         MEASURES 118 and 32 members of 150 evaluable -- BOTH clear the floor. The registry was
  #         RIGHT and the catalog is stale.
  #       * That `0` was written by #598 itself, which reset a previously-declared 60/40 to the N/A
  #         SENTINEL 0 *because* `applicable_data_sources` excluded depmap -- so the backfill drew its
  #         authority to declare N/A from the very declaration that was wrong, and the discarded
  #         ESTIMATES (60/40) were closer to the measured truth (118/32) than the "Correction". A
  #         sentinel that shares an encoding with a measurement will eventually be read as one.
  #   ⇒ ADJUDICATE COHORT CLAIMS AGAINST THE SHARD, which is the only artifact that carries members.
  #     Of the 12 disagreements, 9 are the CATALOG being wrong and 3 are this registry running ahead
  #     of the GENIE substrate on purpose. NONE required an edit to a `cohorts:` list.
  #
  # (3) THE GRAIN NEVER MATCHED. `cohorts:` is declared on the AXIS; membership is measured per
  #     STRATUM. So "3 of 8 strata measured 0 on depmap" does NOT falsify NSCLC driver_mutation's
  #     depmap claim -- KRAS_G12C measures 15 there. An axis-level cohort claim can only mean "at
  #     least one stratum on this axis has members on this cohort", and under that reading every
  #     `measured_absent` entry below is a STRATUM-grain fact filed against an AXIS-grain claim.
  #     They are retained as measurements, with the disposition corrected.
  # ============================================================================================

  measured_absent:
    # The cohort WAS evaluated on a full denominator and found ZERO members for THIS STRATUM.
    # ★ DISPOSITION CORRECTED 2026-09-14: this does NOT falsify the axis's cohort claim (see note 3
    # above). Every axis below retains at least one stratum with measured members on the same
    # cohort, so no `cohorts:` list was edited. These stay as recorded per-stratum absences.
    #
    # ★★ AND THE CATEGORY'S OWN PREMISE WAS FALSE FOR THREE OF THE ORIGINAL FIVE (2026-09-14,
    # data-catalog #601). "The cohort WAS evaluated on a full denominator" is the load-bearing
    # clause, and for the three NSCLC entries it was not true. Their rules named `exon`, a column
    # the DepMap somatic MAF does not carry; the assigner correctly returned None per row and every
    # candidate ABSTAINED, so the surviving denominator held only samples with no relevant
    # mutation. `evaluable == 0` is not `n == 0` -- and this is that same defect one level in, at
    # the grain of the CANDIDATE SET rather than the cohort. The denominator was full of the wrong
    # samples, which is why the arithmetic looked healthy.
    #
    # This is a THIRD direction, distinct from both neighbours below: `source_excluded` was
    # falsified because the measurement DID exist (the pin demanded a correction and got one), and
    # `catalog_over_declares` is a declaration the catalog should narrow. Here the pin was recording
    # a NON-MEASUREMENT as a measurement -- the registry claim and the catalog were both defensible;
    # the EVIDENCE was not.
    disposition: recorded_not_a_cohorts_edit_stratum_grain_vs_axis_grain
    axis_claim_still_true_because:
      - {indication: NSCLC, axis: driver_mutation, cohort: depmap, counterexample: "KRAS_G12C = 15"}
      - {indication: PAAD, axis: fusion, cohort: tcga, counterexample: "NTRK_fusion = 2 (underpowered, not absent)"}
    claims:
      # ★ RE-DERIVED, NOT RE-USED. The old 0 here rested on `&& exon == 20` and was therefore no
      # more evidence than the two cleared below -- it was correct BY LUCK, and the luck is not
      # transferable: with 0 members and 0 abstentions it was indistinguishable, by value,
      # denominator, abstention count and note class alike, from AML/NPM1_mut, whose identical
      # signature was a false negative over two canonical NPM1c models. data-catalog #601 dropped
      # the exon leg after verifying the broadening is COUNT-PRESERVING on the source that had
      # already measured this stratum (TCGA: 2 members under either rule), so the 0 below is now
      # earned rather than inherited. The two cleared entries could NOT be repaired that way --
      # broadening moves TCGA 10 -> 12 and 2 -> 7, trading a landed fact for an estimate.
      - {indication: NSCLC, axis: driver_mutation, stratum: EGFR_mut_ex20ins, cohort: depmap,
         measured: "0 members of 264 evaluable of 264 rows (re-derived data-catalog#601 under the
           exon-free rule; the pre-#601 0 was not evidence)"}
      - {indication: PAAD, axis: fusion, stratum: FGFR2_fusion, cohort: tcga,
         measured: "0 members of 190 evaluable of 190 rows"}
      - {indication: PAAD, axis: fusion, stratum: RET_fusion_PAAD, cohort: tcga,
         measured: "0 members of 190 evaluable of 190 rows"}
    # ★★ MOVED, NOT DELETED -- the #771 precedent, and here it is load-bearing rather than tidy.
    # `test_declared_cohorts_that_measure_absent_are_exactly_the_pinned_set` skips any stratum whose
    # `expected_n_<cohort>` key is absent, so narrowing a cell out of `applicable_data_sources`
    # makes it INVISIBLE to that guard rather than resolved by it. Deleting these two would have
    # recorded "no longer contradicted" when the truth is "no longer looked at" -- the same
    # disappear-from-the-population move the guards in this arc exist to prevent. Kept here so the
    # absence is DECLARED, and asserted absent by
    # `test_field_absent_pins_are_narrowed_out_not_silently_dropped`.
    cleared:
      - {indication: NSCLC, axis: driver_mutation, stratum: EGFR_mut_ex19del, cohort: depmap,
         state: unmeasurable_field_absent,
         was: "0 members of ~244 evaluable of 264 rows",
         why: "rule names `exon`, absent from the DepMap somatic MAF's 6 columns; all 20 EGFR
           in-frame-deletion candidates abstained, so the 244 were the models with no relevant
           mutation. Not broadenable: dropping the exon leg moves the LANDED TCGA count 10 -> 12.",
         cleared_by: "data-catalog#601"}
      - {indication: NSCLC, axis: driver_mutation, stratum: MET_ex14, cohort: depmap,
         state: unmeasurable_field_absent,
         was: "0 members of ~263 evaluable of 264 rows",
         why: "same absent `exon` column; the single MET splice-site candidate abstained. Weakest
           proxy case in the corpus -- the one candidate model's rows carry a NULL protein_change,
           so the source cannot confirm the exon even circumstantially. Not broadenable: MET has
           21 exons and dropping the leg moves the LANDED TCGA count 2 -> 7.",
         cleared_by: "data-catalog#601"}

  source_excluded:
    # ★★ FALSIFIED 2026-09-14, AND IN THE OPPOSITE DIRECTION FROM WHAT THIS ENTRY CLAIMED.
    # It read: "Sharper than measured_absent and needs NO measurement: the catalog stratum's own
    # `applicable_data_sources` EXCLUDES the cohort this registry claims." The phrase "needs NO
    # measurement" is the whole error -- it promoted a DECLARATION to EVIDENCE. Measuring
    # s3://onc-compbio/data-catalog/derived/subgroup-assignments/NSCLC/depmap/2026-Q3/assignments.parquet
    # (586 rows, 293 samples) gives histology_Adeno 118 members and histology_SCC 32 of 150
    # evaluable -- both MEASURED, both above the floor. `depmap-subgroup-assignments-nsclc-v1`'s own
    # description already stated "Strata (2): histology_Adeno (118); histology_SCC (32)".
    # ⇒ This registry's `cohorts: [tcga, depmap]` on NSCLC/histology is CORRECT and UNCHANGED.
    #   The defect WAS in data-catalog and had three parts, all since corrected -- see the CLEARED
    #   note below:
    #     applicable_data_sources [tcga] -> [tcga, depmap]; expected_n_depmap 0 -> 118 / 32 with a
    #     measured note; iter1b_status data_blocked -> active (it was never blocked).
    disposition: falsified_registry_was_right_catalog_corrected_and_pin_cleared
    # ★★ CLEARED 2026-09-14 by data-catalog #600 (squash `1addffd`) -- which is exactly the state the
    # pin below was written to DEMAND, so this is the tripwire working, not the tripwire failing. All
    # three staleness sites are now corrected in the corpus: `applicable_data_sources` [tcga] ->
    # [tcga, depmap], `expected_n_depmap` 0 -> 118 / 32 with `Observed emit` notes, and
    # `iter1b_status` data_blocked -> active.
    #
    # `measured` STAYS as a declared key holding an EMPTY list rather than being deleted, because the
    # guard reads it BY EQUALITY: an empty list still makes a THIRD sentinel-0 on a declared cohort an
    # error. Deleting the key would retire that half of the guard along with the pin.
    #
    # The falsification MOVES to `cleared` rather than being deleted, so it keeps working in the
    # OTHER direction. These two cells were reset to the N/A sentinel `0` once already -- by the very
    # PR that was correcting provenance -- and the equality above cannot see the interesting form of
    # that regression: a count edited from 118 back to an ESTIMATE (non-zero, no measured note) never
    # re-enters `sentinels` at all. So the recorded members are pinned as VALUES, not just as
    # non-zeroes, and this block stays the only surviving evidence of what was falsified and why.
    measured: []
    cleared:
      - {indication: NSCLC, axis: histology, stratum: histology_Adeno, cohort: depmap,
         members: 118, evaluable: 150, state: measured, cleared_by: "data-catalog#600"}
      - {indication: NSCLC, axis: histology, stratum: histology_SCC, cohort: depmap,
         members: 32, evaluable: 150, state: measured, cleared_by: "data-catalog#600"}

  catalog_over_declares:
    # ★ NEW 2026-09-14 -- the direction this block was missing. Here the CATALOG's
    # `applicable_data_sources` allows a cohort that this registry omits, and the registry is right:
    # measured against the published DepMap shards, every stratum below is either all-null
