# surface_secreted_antigen_targets.yaml
#
# Curated vocabulary of gene symbols whose protein is a CELL-SURFACE or SECRETED
# antigen of the class that mass-spectrometry TMT proteomics (the Gygi DepMap
# cell-line panel) systematically UNDER-READS on an all-gene abundance percentile.
#
# WHY THIS VOCABULARY EXISTS (issue #980, 2026-09-04):
#   The tumor-presence abundance-LEVEL floor (_abundance_floor) anchors on the
#   Gygi TMT cell-line-protein all-gene percentile. A panel backtest (issue #980)
#   showed Gygi reads the canonical surface/secreted antigen class BOTTOM-DECILE
#   even when the antigen is tumor-RNA top-1% and IHC detected_high:
#     TACSTD2 1.2 · CEACAM5 3.8 · FOLR1 4.2 · MSLN 5.0 · EPCAM 8.6 · DLL3 12.3
#   while the cytoplasmic/structural CONTROLS (KRAS 73.4, ACTB 68.4) are NOT
#   bottom-decile — so the under-read is CLASS-SPECIFIC (membrane / low-solubility
#   / heavily-glycosylated peptides are under-sampled by TMT), not a global bias.
#   ProCan (DIA-SWATH MaxLFQ, `cellline-protein-abundance-procan`) recovers most
#   of them (EPCAM 79.7, CEACAM5 84.3, TACSTD2 87.0, MSLN 61.5).
#
# HOW IT IS CONSUMED (tumor-presence _abundance_floor, surface-class anchor
# preference — VERDICT-INERT):
#   For a target whose HGNC symbol appears in `entries:`, a LONE Gygi
#   (`cellline-protein-abundance`) bottom-decile reading is treated as a
#   surface-class MS under-read (not a genuine abundance floor) WHEN the orthogonal
#   protein anchor recovers it — ProCan (`cellline-protein-abundance-procan`) not
#   bottom-decile, or HPA-IHC `ihc_detected_high`. In that case the target
#   re-anchors to ProCan/IHC → `adequate_abundance` (no floor flag), rather than
#   the general single-lens SOFT flag. This is the surface-class-aware layer ON TOP
#   of the general PR #965 quorum-override (which stays the guard for everything).
#
#   DO NOT BLANKET-RESCUE (the issue's explicit caution): a target that is ALSO
#   bottom-decile on ProCan is genuinely lower-abundance and KEEPS the honest floor
#   — DLL3 (ProCan 25.7) and FOLR1 (ProCan 20.8) are legitimately lower-abundance
#   surface antigens; the re-anchor only fires when ProCan/IHC actually recover.
#   MUC1 is the exception the vocab still admits (Gygi reads it high already, so no
#   floor fires; if a heavily-glycosylated mucin reads both MS platforms low, IHC
#   high carries it). Membership NEVER changes a presence/selectivity VERDICT — it
#   only refines the verdict-inert abundance-level display/synthesis facet.
#
# WHY A CURATED CROSSWALK, NOT A MEASURED SIGNAL (mirrors
# internalizing_antigen_targets.yaml / shed_antigen_targets.yaml):
#   The first-principles signal is the measured surfaceome-family
#   `is_surface_protein` (SURFY / HPA plasma-membrane), but that card is not yet in
#   tumor-presence's card set (adding it trips the field-disposition completeness
#   ratchet — a separate change). Until then this citable clinical/biological
#   crosswalk of validated cell-surface & secreted antigens is the honest, minimal,
#   controllable fill. POSITIVE-ONLY: presence enables the surface-class re-anchor;
#   absence is UNCHANGED (the general quorum-override still applies). A target NOT
#   in the list is never marked "not surface".
#
# Curation discipline:
#   - Only cell-surface (single/multi-pass membrane) or secreted antigens with an
#     approved or late-clinical antibody / ADC / TCE / CAR program, i.e. bona-fide
#     surface antigens whose absolute abundance is decision-relevant for a biologic.
#   - Overlaps by construction with internalizing_antigen_targets.yaml and
#     shed_antigen_targets.yaml (those are surface antigens by definition).

version: 1.0.0
snapshot_date: "2026-09-04"
curator: ryan.abo@takeda.com

entries:

  EPCAM:
    class: single_pass_membrane_glycoprotein
    programs: solitomab (EpCAM BiTE); catumaxomab; multiple EpCAM CAR/TCE
    backtest_note: >
      #980 panel: Gygi 8.6 %ile vs ProCan 79.7, tumor-RNA 99.7, IHC detected_high.
      Pan-epithelial surface antigen; Gygi under-reads, ProCan recovers.

  CEACAM5:
    class: gpi_anchored_membrane_glycoprotein
    programs: tusamitamab ravtansine (CEACAM5 ADC); CEA TCE (cibisatamab)
    backtest_note: >
      #980 panel: Gygi 3.8 %ile vs ProCan 84.3, tumor-RNA 99.9, IHC detected_high.

  FOLR1:
    class: gpi_anchored_membrane_glycoprotein
    programs: mirvetuximab soravtansine (FRα ADC, approved 2022)
    backtest_note: >
      #980 panel: Gygi 4.2 %ile vs ProCan 20.8 — ProCan modest; legitimately
      lower-abundance, so the re-anchor only fires if ProCan/IHC recover (they may
      not) — keeps the honest floor otherwise. Do NOT blanket-rescue.

  MSLN:
    class: gpi_anchored_membrane_glycoprotein
    programs: anetumab ravtansine; mesothelin CAR-T / TCE
    backtest_note: >
      #980 panel: Gygi 5.0 %ile vs ProCan 61.5, tumor-RNA 99.6, IHC detected_high.

  TACSTD2:
    class: single_pass_membrane_glycoprotein
    programs: sacituzumab govitecan (TROP2 ADC, approved 2020)
    backtest_note: >
      #980 panel: Gygi 1.2 %ile vs ProCan 87.0, tumor-RNA 99.2. TROP2.

  DLL3:
    class: single_pass_membrane_protein
    programs: rovalpituzumab tesirine (DLL3 ADC); tarlatamab (DLL3 TCE, approved 2024)
    backtest_note: >
      #980 panel: Gygi 12.3 %ile vs ProCan 25.7 — ProCan also modest; legitimately
      lower-abundance surface antigen, keeps the honest floor unless ProCan/IHC
      recover. Do NOT blanket-rescue.

  ERBB2:
    class: single_pass_receptor_tyrosine_kinase
    programs: trastuzumab / T-DM1 / T-DXd (approved); HER2 TCE
    backtest_note: >
      #980 panel: Gygi 30.2 %ile (mid, not bottom-decile) — no floor fires; listed
      for completeness as a validated surface antigen.

  MUC1:
    class: single_pass_membrane_mucin
    programs: multiple MUC1 CAR / ADC / vaccine programs
    backtest_note: >
      #980 panel EXCEPTION: Gygi reads MUC1 HIGH (85.6 %ile) — not under-read; no
      floor fires. Heavily-glycosylated mucin; if both MS platforms ever read low,
      IHC detected_high carries the re-anchor.

  MUC16:
    class: single_pass_membrane_mucin_shed
    programs: CA125; MUC16 ADC / TCE programs
    backtest_note: Secreted/shed mucin surface antigen (analogous class).

  NECTIN4:
    class: single_pass_membrane_glycoprotein
    programs: enfortumab vedotin (approved 2019)
    backtest_note: Validated internalizing surface antigen (see internalizing vocab).

  TNFRSF17:
    class: single_pass_membrane_receptor
    programs: BCMA CAR-T / TCE / ADC (approved)
    backtest_note: BCMA — validated surface antigen; TMT under-reads low-abundance receptors.

  CLDN18:
    class: multi_pass_tight_junction_membrane
    programs: zolbetuximab (Claudin18.2 mAb, approved 2024); CLDN18.2 CAR/TCE
    backtest_note: Multi-pass membrane antigen; MS under-samples multi-pass TM peptides.

  GPC3:
    class: gpi_anchored_membrane_glycoprotein
    programs: GPC3 CAR-T / TCE (hepatocellular)
    backtest_note: GPI-anchored surface antigen (analogous to FOLR1/CEACAM5 class).

  FOLH1:
    class: single_pass_membrane_glutamate_carboxypeptidase
    programs: PSMA (177Lu-PSMA approved); PSMA CAR/TCE
    backtest_note: PSMA — validated prostate surface antigen.

  STEAP1:
    class: multi_pass_membrane_metalloreductase
    programs: STEAP1 TCE (prostate)
    backtest_note: Multi-pass surface antigen; MS under-samples multi-pass TM peptides.

  CD19:
    class: single_pass_membrane_receptor
    programs: CD19 CAR-T (approved); blinatumomab (CD19 BiTE)
    backtest_note: Archetypal validated surface antigen (low copy-number ~110/cell).

  MS4A1:
    class: multi_pass_membrane_protein
    programs: CD20 — rituximab (approved); mosunetuzumab (CD20 TCE)
    backtest_note: CD20 — validated multi-pass surface antigen.
