version: 1.4.0

description: |
  One governed entry per (skill, axis_key): the display label, the decision question the axis informs,
  whether it is decision-critical, and — the load-bearing field — which catalogued biological
  properties it resolves. Two inverse indexes (`skills:` for gate + display order, `properties:` for
  property -> axes) are cross-checked against the primary `axes:` roster by the validator. That
  redundancy is the point, not debt: an entry added to one view and forgotten in another is the single
  most likely way this file goes wrong, and only a mutual check catches it.

criterion: |
  An axis belongs in this registry if and only if it appears in some skill's `HeadlineSpec.axis_keys`.
  There is no editorial discretion: the population is whatever the code declares, equality is enforced
  in both directions by the skills-side coverage test, and a new axis in any `run.py` reds until it is
  declared here.

governance:
  role: |
    Authoritative for: the fleet-wide roster of claim axes, each axis's governed display label, the
    decision question it informs, its critical-axis status, and which catalogued properties it
    resolves. NOT authoritative for the axis KEYS themselves — those are owned by each skill's
    `HeadlineSpec` and are wire names appearing in `claim_vector.<axis>` paths. This file is a
    projection of that code, pinned to it; where they disagree the code is right and this file is
    broken.
  versioning: |
    Semver. Adding a skill, an axis, or a `resolves:` entry is a MINOR bump. Correcting an `informs`
    gloss or a `resolves_pending` note is a PATCH bump. Removing an axis, or changing an existing
    axis's `label`, `critical` flag or `resolves` set, is BREAKING and requires a MAJOR bump plus
    coordination via the wip-registry — `validate_claim_axis.py --additive-against <ref>` makes an
    un-bumped removal RED.
  ownership: |
    Epic #1507 (evidence-property architecture), arc #2210 Wave-0d (#2228). `resolves:` is populated
    domain by domain as Wave-1 lands its l2a catalogs (#2211-#2214 plus the hands-on safety seed);
    every axis still awaiting one carries a `resolves_pending:` note naming the item that will fill it.
    Axis RENAMES belong to #2229 and are explicitly not this file's business.
  change_discipline: |
    ADDITIVE ONLY, and the pair `(skill, axis_key)` is the published key — migrate by
    add -> consume -> remove, never a bare rename. `resolves:` cites property ids in the QUALIFIED
    form `<catalog_id>.<entry_id>`; those too are published names under the property catalog's own
    add -> consume -> remove discipline.
  identity_is_the_pair: |
    Nothing in this file, in its validator, or in any consumer may key on a bare `axis_key`. `DEP` is
    two different properties in two skills, and the day a second collision lands, code keyed on the
    bare token will silently conflate them rather than fail. Every roster and index here is keyed on
    `(skill, axis_key)`; `collides_with:` exists so that the one measured collision is DECLARED rather
    than resolved, and the validator reconciles the declared collisions against the measured ones in
    both directions with ABSENCE as a first-class member of the comparison — a "check it when present"
    clause is structurally blind to an entry that should have carried the key and did not.

axes:

  # ── cis-feature-coherence (gate: cis_coherence) ─────────────────────────────────────────────────
  - skill: cis-feature-coherence
    axis_key: CIS_DOSAGE
    label: "CN→expression cis-dosage"
    informs: |
      Does a copy-number change at the locus actually move the target's own expression in cis?
    critical: false
    resolves:
      - integrated_families.cis_dosage
  - skill: cis-feature-coherence
    axis_key: SILENCING
    label: "methylation→low-expression"
    informs: |
      Is low expression explained by promoter methylation rather than by absent copy?
    critical: false
    resolves:
      - integrated_families.methylation_silencing
  - skill: cis-feature-coherence
    axis_key: EXPR_DEP
    label: "expression→dependency"
    informs: |
      Do the tumours that express the target most also depend on it most?
    critical: true
    resolves:
      - integrated_families.expression_dependency
  - skill: cis-feature-coherence
    axis_key: CONJOINT
    label: "amp∩overexpr addiction"
    informs: |
      Are amplification and over-expression jointly present — the addiction signature rather than either alone?
    critical: false
    resolves: []
    resolves_pending: |
      no l2a property catalog is scheduled for this domain in arc #2210; the determinant sweep #2219 is the first item that would reach it

