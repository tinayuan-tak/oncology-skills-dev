      The ONE property in this registry resolved by TWO skills' axes, and deliberately so: it is a single
      DepMap CRISPR measurement read in two frames — functional-requirement's DEP reads it as the
      efficacy dependency signal, on-target-safety-liability's PAN_ESSENTIAL reads its `common_essential`
      token at LIABILITY valence (broad tox). dependency.yaml owns the property, records the cross-domain
      sharing in its dependence_note, and lists both consumers; the safety domain does NOT re-emit it as
      a safety L2a property, so the measurement is filed once, not twice.
