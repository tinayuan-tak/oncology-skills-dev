population_floors:
  skills: 15
  axes: 55
  distinct_axis_keys: 55
  resolved_axes: 26
  resolved_properties: 35
  note: |
    Anti-vacuity, not decoration. Floors sit at or BELOW the measured population (measured at v1.4.0: 15 skills, 61 axes, 60 distinct axis_keys, 28 resolved axes, 40 resolved properties; at v1.3.0 the last two were 26 and 34; at v1.2.0 they were 23 and 28; at v1.1.0 they were 19 and 23; at v1.0.0 they were 14 and 15) so that legitimate additive growth never reds, while a discovery glob that silently matches nothing does. The two resolve-floors are RATCHETED with each wave that populates `resolves:`, preserving their v1.0.0 margin below measured (2 and 5): a floor left at the pre-wave number would still pass on a registry that had silently lost everything the wave added, which is precisely the shrink a floor exists to catch. `skills` is a FLOOR and not pinned to equality on purpose: contracts/ may not read skills' HeadlineSpecs (dependency direction), so the equality half lives in skills/_skills_common/tests/test_claim_axis_registry_coverage.py, which reds when a 16th skill declares axes with no entry here.

coverage_dimensions:
  - dimension: axes_resolving_a_catalogued_property
    measured: 28
    total: 61
    is_a_gate: false
    rationale: |
      28 of 61 axes cite a property today (14 at v1.0.0, +5 from Wave-1a's safety.yaml, +4 from
      Wave-1b's dependency.yaml, +3 from Wave-1c's genomic.yaml, +2 from Wave-1d's selectivity.yaml:
      tumor-selectivity's DIST and INT — empty since v1.0.0 pending exactly this catalog — now resolve it;
      WIN and SAFE already resolved their l2b families, so they did not change this count even though
      they each gained l2a properties, mirroring SNV/DEP's precedent at the Wave-1c wave). They come from
      the six landed l2a catalogs plus the l2b family catalog Wave-0a landed. The other 33 are not defects
      and not holes in this file: the l2a catalog for surface is the remaining Wave-1 item owned by #2214.
      A GATE on this number would either block the wave behind its own successor or force catalog entries
      to be invented ahead of the measurement they record. So it is REPORTED. Fail-open promotes; an
      unmeasured number would be worse than a small one, which is why `measured` is required to be an int
      and `resolves_pending:` is required on every one of the 33.
  - dimension: domains_with_a_landed_l2a_property_catalog
    measured: 6
    total: 15
    is_a_gate: false
    rationale: |
      expression.yaml, tumor_presence.yaml, safety.yaml (Wave-1a), dependency.yaml (Wave-1b),
      genomic.yaml (Wave-1c) and — as of Wave-1d — selectivity.yaml are the six landed `l2a_property`
      files; the 13 entries in integrated_families.yaml are `l2b_family` folds, not per-domain
      properties. This is the upstream cause of the dimension above, recorded separately so a reader
      does not mistake sparse `resolves:` coverage for sloppy registration here.
  - dimension: skills_using_a_letter_axis_scheme
    measured: 1
    total: 15
    is_a_gate: false
    rationale: |
      tumour-presence's A/B/C/D. Recorded as a number so #2229 has a baseline and so "the letters stay"
      remains a legible, auditable outcome rather than a forgotten inconsistency. NOT a gate: gating it
      would amount to this file demanding a rename it is explicitly forbidden to perform.

documented_collisions:
  - axis_key: DEP
    skills: [functional-requirement, genomic-alteration-profile]
    why_legal: |
      Two different properties. In functional-requirement `DEP` is *genetic dependency* — is loss of the
      target lethal at all — and resolves `integrated_families.essentiality`. In
      genomic-alteration-profile `DEP` is *alteration-conferred dependency* — does carrying the
      alteration create the requirement. They are not the same question and must not be merged.
    why_declared: |
      Declared rather than resolved, because resolving it means renaming a `claim_vector.<axis>` wire
      name and that is #2229's add -> consume -> remove work, not this file's. The declaration is what
      stops a reader inferring "same token, same biology" — the inference the collision makes false.
    action: |
      No action here. If #2229 renames either, the rename lands in that skill's `HeadlineSpec` first and
      this registry follows as a MINOR addition, with the old pair retained until the remove step.

related_ungoverned_vocabularies:
  - field: CLAIM_INFORMS
    site: skills/_skills_common/presence_claims.py
    tokens: [A, B, C, D]
    why_out_of_scope: |
      The routing gloss — "which downstream lens does this axis inform" — existed in exactly ONE module
      and covered exactly ONE skill's four axes. This file's `informs:` generalises it to all 61 axes,
      but it does not REPLACE the live map: `presence_claims.py` still reads its own copy, and deleting
      that is a consume-then-remove step for a later item. What is enforced today is that the live map's
      key set is exactly the tumour-presence axis set declared here, so a 5th key added there without a
      registry entry reds (skills-side coverage test). Note the wording is deliberately NOT pinned:
      `CLAIM_INFORMS` values are lens names and `informs:` values are questions, and a substring pin
      across two different shapes would be green-for-the-wrong-reason theatre.
  - field: axis_labels
    site: skills/*/scripts/run.py (HeadlineSpec.axis_labels)
    tokens: [free text]
    why_out_of_scope: |
      The labels remain free text owned by each skill, because they are display strings and a governed
      closed vocabulary for them would buy nothing. What IS governed is AGREEMENT: every `label:` here
      must equal the skill's `axis_labels` entry byte-for-byte, checked by the skills-side coverage
      test. A second copy pinned to equality is a projection; an unpinned one would be drift.

