  # ── tumor-presence (gate: presence) ─────────────────────────────────────────────────────────────
  - skill: tumor-presence
    axis_key: A
    label: "abundance"
    informs: |
      Is the target present in the tumour at all, in any modality?
    critical: true
    resolves:
      - integrated_families.abundance
      - integrated_families.protein_presence
      - tumor_presence.patient_tumor_abundance
      - tumor_presence.tumor_protein_abundance
  - skill: tumor-presence
    axis_key: B
    label: "tumor-elevation"
    informs: |
      Is it higher in tumour than in the matched normal tissue?
    critical: true
    resolves:
      - tumor_presence.tumor_normal_selectivity
  - skill: tumor-presence
    axis_key: C
    label: "malignant-intrinsic"
    informs: |
      Is it the malignant cells that carry it, rather than stroma or immune infiltrate?
    critical: true
    resolves:
      - integrated_families.coverage
      - tumor_presence.malignant_cell_coverage
  - skill: tumor-presence
    axis_key: D
    label: "generality"
    informs: |
      Across how much of the patient population does the elevation hold?
    critical: false
    resolves:
      - tumor_presence.tumor_elevation_breadth

  # ── tumor-selectivity (gate: selectivity) ───────────────────────────────────────────────────────
  - skill: tumor-selectivity
    axis_key: WIN
    label: "tumor-vs-normal window"
    informs: |
      Is there a tumour-versus-normal expression window at all?
    critical: true
    resolves:
      - integrated_families.selectivity
  - skill: tumor-selectivity
    axis_key: DIST
    label: "distributional separation"
