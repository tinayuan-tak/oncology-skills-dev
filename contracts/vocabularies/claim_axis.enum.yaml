# claim_axis.enum.yaml — the governed registry of every skill's headline claim axes.
#
# Structure arc #2210 Wave-0d; epic #1507. Answers the owner's question of 2026-09-29 — *"can we make
# the signal blocks somewhat uniform at least in structure or naming across skills so that it is easier
# to align them or navigate between?"* — by MEASURING it rather than assuming it:
#
#   * STRUCTURE IS ALREADY UNIFORM. Every skill declares the same
#     `HeadlineSpec{gate, axis_keys, axis_labels, critical_axes, tension_extra}`
#     (skills/_skills_common/headline_core.py) and every axis block has the same
#     `{signal, corroboration, evidence, conflict}` shape. Nothing here changes that; there was
#     nothing to fix.
#
#   * NAMING IS NOT, AND THIS FILE DOES NOT FIX IT BY RENAMING. 15 skills declare axes; 14 use
#     mnemonics and tumour-presence alone uses the letters A/B/C/D. `DEP` means *genetic* dependency in
#     functional-requirement and *alteration-conferred* dependency in genomic-alteration-profile.
#     `NORMAL_TISSUE` / `SAFE` / `SAFETY` are three display names for ONE property. A rename is a
#     BREAKING change — `claim_vector.<axis>` keys are hard-coded in question-table `provenance_ref`
#     strings and in `critical_axes`, and a mismatch degrades SILENTLY (reads as `unmeasured`) instead
#     of raising. So renaming is #2229's job, as add -> consume -> remove, and "the letters stay" is a
#     legitimate outcome there.
#
# WHAT THIS FILE DELIVERS INSTEAD. Alignment through the `resolves:` field: two axes are the same
# question when they resolve the same `property_id`, NOT when they share a token. The `properties:`
# inverse index below turns "which skills read the normal-tissue-liability property" from a
# fifteen-file code archaeology exercise into one grep — and makes the SAFE/SAFETY/NORMAL_TISSUE triple
# visibly one property with three display names, with nothing renamed.
#
# ★ THE UNIT OF IDENTITY IS THE PAIR `(skill, axis_key)`, NEVER THE BARE `axis_key`. This is the direct
#   transposition of Wave-0b's measured result that `single_source_only` is emitted by 5 different
#   concordance families and means a different comparison in each. Here the same shape is MEASURED, not
#   assumed: 61 axes over 60 distinct tokens, with exactly one collision (`DEP`, two skills, two
#   different properties). Every roster, index and floor in this file keys on the pair.
#
# ★ AND `resolves:` USES THE QUALIFIED FORM `<catalog_id>.<entry_id>`, NEVER THE BARE ENTRY ID, for
#   exactly the same reason one level down. The property catalog's own namespace COLLIDES: its 27
#   entries have only 25 distinct bare ids, because `selectivity` and `subtype_restriction` each name
#   one `l2a_property` in expression.yaml AND one unrelated `l2b_family` in integrated_families.yaml.
#   `validate_property_catalog.collect_entry_ids()` flattens them into one 25-element namespace, so a
#   bare `resolves: [selectivity]` would be genuinely ambiguous for 2 of 27 entries. The validator
#   REJECTS the bare form rather than guessing.
#
# WHAT THIS FILE IS NOT. It is a register, not an engine: nothing reads it at runtime and no verdict
# moves because of it (SK#2091 — verdict movement is not a metric here in either direction). It does
# not gate coverage: 47 of 61 axes have no resolvable property yet, because the l2a catalogs for
# safety / dependency / genomic / selectivity / surface are Wave-1 items owned elsewhere in the arc.
# That number is REPORTED as a `coverage_dimensions` entry with `is_a_gate: false`. A gate on it would
# be false at repository grain today and would force emission into code owned by four peer epics.
#
# TEETH. `../validators/validate_claim_axis.py` (wired into `scripts/preland.sh` twice — shape clauses
# in the pool, token additivity after) checks that this file is internally coherent and pinned to the
# property catalog in both directions. It CANNOT check the thing that matters most — whether the
# declarations agree with the real `HeadlineSpec`s — because the dependency direction is
# skills/ -> contracts/ and never the reverse. That half is
# `skills/_skills_common/tests/test_claim_axis_registry_coverage.py`, which re-derives every axis from
# the skills' ASTs fail-loud and reconciles both directions.

enum_id: claim_axis
