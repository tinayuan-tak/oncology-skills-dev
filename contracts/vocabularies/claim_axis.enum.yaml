    critical: false
    resolves: []
    resolves_pending: |
      arc #2210 Wave-1d, issue #2213 (selectivity l2a catalog)
  - skill: tumor-selectivity
    axis_key: SAFE
    label: "normal-tissue window"
    informs: |
      Which normal tissues fall inside the window and become the dose-limiting liability?
