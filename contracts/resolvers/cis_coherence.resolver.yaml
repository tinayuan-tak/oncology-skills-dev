# cis-feature-coherence verdict resolver — the locus -> expression -> dependency coherence owner.
#
# Produces cis_coherence_verdict by first-match over the ordered `resolve:` ladder, pattern-matching
# fired rule IDs only (no arithmetic — numeric labels live in the cards). It is a deterministic 2x2
# cross-tab of two coherence legs, integrating the NEW feature->expression leg (cis-dosage) with the
# REUSED expression->dependency evidence (no new dependency measurement):
#
# Leg-1 is DIRECTIONAL as of v1.3.0 — coupled splits into an AMPLIFICATION arm and a DELETION arm,
# because "coupled" alone put ERBB2 and CDKN2A in the same cell:
#
#              leg-2 dependency-coupled (+)      leg-2 dependency-absent (neutral)
#   leg-1    ┌──────────────────────────────┬───────────────────────────────────┐
#   coupled  │ coherent_cis_driver          │ expressed_cis_coupled_inert       │
#   AMPLIFIED│  (oncogene-addiction chain)  │  (present + cis-driven, NOT req'd) │
#            ├──────────────────────────────┼───────────────────────────────────┤
#   coupled  │ dependency_without_cis_dosage│ coherent_cis_loss_of_function      │
#   DELETED  │  (not amplification-driven)  │  (SL / re-expression hypothesis)   │
#            ├──────────────────────────────┼───────────────────────────────────┤
#   leg-1    │ dependency_without_cis_dosage│ cis_uncoupled_no_dependency        │
#   uncoupled│  (trans-driven dependency)   │  (no coherent cis chain)           │
#            └──────────────────────────────┴───────────────────────────────────┘
#   methylation silencing leg fired  →  coherent_epigenetic_silencing (standalone; outranks the
#                                       DELETED/absent cell, is outranked by the AMPLIFIED cells)
#   any leg untestable / unmeasured  →  insufficient_cis_coherence (default; honest abstention)
#
# VERDICT-INERT for overall_recommendation: cis_coherence is a DEDICATED self-contained axis (like
# combination_opportunity / resistance_emergence), NOT registered in the skills kill/hold gating axes
# (tp_gates._GATING_AXES) and NOT in target-profile's _SHORT_TO_GATE — it has NO `gates` action, so it can
# never cross the kill boundary or move the Go/No-Go. GRADUATED (nomination_verdict_gate.yaml v1.6.0,
# 2026-08-20) to a CONFIDENCE-tier axis: coherent_cis_driver -> positive_signal (supportive),
# expressed_cis_coupled_inert -> positive_contradiction (blocks `strong`), grouped with genomic_alteration
# (correlated_dimension_groups) to avoid double-counting the shared amplification signal. It moves
# CONFIDENCE + tension_analysis, never the nomination recommendation.
#
# leg-2 is an OR of two reused signals (correlation-leg cis-expr-dependency-coupled-supportive OR the
# conjoint-leg cis-conjoint-dependent-supportive); both map to the SAME verdict so first-match never
# double-counts. driving_rule is set EXPLICITLY on every rung (the interpreter's rids[-1] fallback
# would otherwise name whichever leg happened to fire last).
gate: cis_coherence
version: 1.3.0  # 1.3.0 (2026-09-12): leg-1 is now DIRECTIONAL. The MET-class residual v1.2.0 documented
                # inline below is CLOSED: every rung that made an amplification-driver claim now requires
                # cis-dosage-amplification-coupled-supportive, and the expressed_cis_coupled_inert rung was
                # lifted ABOVE the silencing rung, so an amplification-coupled gene with no dependency leg
                # can no longer be labeled coherent_epigenetic_silencing by a minority-methylation subset
                # (MET/LUAD). A deletion-coupled gene with no dependency leg gets the NEW terminal verdict
                # coherent_cis_loss_of_function (APC/STK11/NF1) instead of falling to the default; CDKN2A
                # keeps coherent_epigenetic_silencing because the silencing rung outranks the LoF rung.
                # NOT byte-stable: any fired-set with a coupled leg-1 now also carries a direction token.
       # 1.2.0 (2026-09-12): dependency_without_cis_dosage rungs (uncoupled+dependency) now
                # OUTRANK the standalone coherent_epigenetic_silencing rung (a self-dependency is not a
                # silenced-off gene). Fixes FGFR1/LUSC + NKX2-1/LUAD, which were mislabeled
                # coherent_epigenetic_silencing by a lineage-confounded minority-methylation subset. Safe:
                # validated silenced TSGs (MLH1/MGMT/CDKN2A) carry no coupled dependency leg. Priorities
                # only; byte-stable for every fired-set lacking BOTH a dependency leg AND the silencing leg.
# Fold (VERDICT_REPRESENTATION_FOLD.md): evaluated match-all-then-reduce = the matching rung of MINIMUM
# `priority` (explicit precedence data; rung ORDER is now irrelevant — R6 order-independence). Priorities
# = the former ladder indices, so this is BYTE-EQUIVALENT to the retired first_match ladder (proven by
# the resolver golden + the cis replay). cis_coherence is the first resolver flipped; the rest follow.
evaluation: match_all_reduce
description: |
  Cis-coherence verdict: does the target's own copy-number drive its own expression (leg-1, the new
  cis-dosage card), and does that expression/feature track its own dependency (leg-2, reused
  expression-dependency-correlation + amp-expr-stratified-dependency)? A deterministic 2x2 cross-tab
  distinguishing amplification-driven oncogene addiction (coherent_cis_driver) from an expressed-but-
  inert target (expressed_cis_coupled_inert; the abundance-laundering guard) and a trans-driven
  dependency (dependency_without_cis_dosage). VERDICT-INERT — descriptive coherence, not a gate.

resolve:
  # ── coherent_cis_driver — leg-1 coupled AND leg-2 dependency-coupled (chain intact) ──────────────
  #    Two rungs (leg-2 is an OR): the conjoint amplification-addiction leg first (more mechanism-
  #    specific), then the expression-dependency correlation leg. driving_rule names leg-1 — the leg
  #    that establishes the call is CIS (amplification-driven), which is the whole point of the skill.
  #    DIRECTIONAL (v1.3.0): both rungs additionally require the AMPLIFICATION direction token. An
  #    oncogene-addiction chain is a GAIN story; a deletion-coupled gene that happens to carry a
  #    dependency leg is not amplification-driven and drops to the dependency_without_cis_dosage rungs.
  - {verdict: coherent_cis_driver, when_all_fired: [cis-dosage-coupled-supportive, cis-dosage-amplification-coupled-supportive, cis-conjoint-dependent-supportive], driving_rule: cis-dosage-coupled-supportive, priority: 0}
  - {verdict: coherent_cis_driver, when_all_fired: [cis-dosage-coupled-supportive, cis-dosage-amplification-coupled-supportive, cis-expr-dependency-coupled-supportive], driving_rule: cis-dosage-coupled-supportive, priority: 1}

  # ── dependency_without_cis_dosage — leg-1 uncoupled AND leg-2 dependency-coupled ─────────────────
  #    A real expression->dependency signal, but copy-number does NOT drive the expression: the
  #    dependency is trans/lineage-regulated, not amplification-driven. Routes the modality framing
  #    toward dependency_relational rather than a copy-number-stratified strategy.
  #    PRECEDENCE (2026-09-12 panel calibration): these OUTRANK the standalone silencing rung. A gene with
  #    a genuine self-dependency is BY DEFINITION not silenced-off, so when a dependency leg co-fires with
  #    a (typically minority-subset, lineage-confounded) methylation-silencing signal, the dependency
  #    reading must win — else a lineage-restricted amplicon dependency (FGFR1/LUSC, NKX2-1/LUAD) is
  #    mislabeled coherent_epigenetic_silencing. Safe: a validated silenced TSG (MLH1/MGMT/CDKN2A) fires
  #    NO coupled dependency leg (its expr-dep is no_correlation/weak), so it is untouched by this ordering.
  - {verdict: dependency_without_cis_dosage, when_all_fired: [cis-dosage-uncoupled-neutral, cis-conjoint-dependent-supportive], driving_rule: cis-dosage-uncoupled-neutral, priority: 2}
  - {verdict: dependency_without_cis_dosage, when_all_fired: [cis-dosage-uncoupled-neutral, cis-expr-dependency-coupled-supportive], driving_rule: cis-dosage-uncoupled-neutral, priority: 3}
  #    DELETION-coupled + a dependency leg lands HERE too (v1.1.0/v1.3.0 direction pair). Leg-1 is intact
  #    and cis, but downward: loss lowers expression. Whatever drives the dependency, it is not
  #    amplification, so the "trans/not-amplification-driven dependency" framing is the honest one — the
  #    verdict name reads "dependency without cis DOSAGE", and a deletion arm is not a dosage-addiction
  #    chain. driving_rule names the DIRECTION token, so the memo says which arm was measured.
  - {verdict: dependency_without_cis_dosage, when_all_fired: [cis-dosage-deletion-coupled-neutral, cis-conjoint-dependent-supportive], driving_rule: cis-dosage-deletion-coupled-neutral, priority: 4}
  - {verdict: dependency_without_cis_dosage, when_all_fired: [cis-dosage-deletion-coupled-neutral, cis-expr-dependency-coupled-supportive], driving_rule: cis-dosage-deletion-coupled-neutral, priority: 5}

  # ── expressed_cis_coupled_inert — AMPLIFICATION-coupled leg-1 AND leg-2 absent ────────────────────
  #    CN drives expression, but expression does NOT track dependency: the target is present and even
  #    cis-driven, yet more abundance does not mean more required. This is the case a bare abundance
  #    steer would launder as "expected non-dependency"; naming it explicitly is a Rank-1 goal.
  #    LIFTED ABOVE the silencing rung (v1.3.0) — this is the MET-class fix. A gene whose GAIN arm drives
  #    its expression is being described by its amplicon, and a minority hypermethylated subset must not
  #    overwrite that with a silenced-gene reading (MET/LUAD read coherent_epigenetic_silencing under
  #    v1.2.0). Note this also requires the AMPLIFICATION direction: the deletion-coupled + dependency-
  #    absent case is a LoF story, not an "expressed but inert" one, and gets its own rung below.
  - {verdict: expressed_cis_coupled_inert, when_all_fired: [cis-dosage-coupled-supportive, cis-dosage-amplification-coupled-supportive, cis-expr-dependency-absent-neutral], driving_rule: cis-expr-dependency-absent-neutral, priority: 6}

  # ── coherent_epigenetic_silencing — LoF arm: methylation coherently explains LOW expression ─────
  #    STANDALONE (no dependency leg): a silenced gene is turned OFF, not a self-dependency. A synthetic-
  #    lethal / silenced-target hypothesis flag (MLH1/MGMT/CDKN2A). Placed AFTER the coherent_cis_driver
  #    AND dependency_without_cis_dosage rungs so a genuine amplification-addiction or a trans-driven
  #    dependency (both carry a dependency leg) still names its GoF/dependency verdict first; a gene
  #    silenced but with NO dependency leg lands here. Cell-line arm (CCLE RRBS); the patient
  #    promoter-methylation arm is a separate later leg.
  #    RESIDUAL CLOSED (v1.3.0, was "MET-class, deferred"): the amplification-coupled + dependency-absent
  #    case now has its OWN rung ABOVE this one (priority 6), so an amplicon driver can no longer be
  #    labeled silenced by a minority-methylation subset. CDKN2A is unaffected — it is DELETION-coupled,
  #    so it never matches that rung, and this rung still outranks the deletion-coupled LoF rung below,
  #    which is the correct precedence: a MEASURED silencing mechanism is more specific than a bare
  #    "the deleted arm carries the expression" statement. The lineage-collapse guard on the methylation
  #    card (card v1.1.0) removes the confounded contrasts that produced most of these cases upstream;
  #    this ladder ordering is the second, independent line of defence.
  - {verdict: coherent_epigenetic_silencing, when_fired: cis-silencing-coupled-supportive, driving_rule: cis-silencing-coupled-supportive, priority: 7}

  # ── coherent_cis_loss_of_function — DELETION-coupled leg-1 AND leg-2 absent (NEW, v1.3.0) ────────
  #    Loss lowers expression and the gene is not a self-dependency: the coherent cis chain exists but
  #    points DOWNWARD. Read as a synthetic-lethal / re-expression / loss-biomarker hypothesis, NOT a
  #    direct-inhibition target. APC / STK11 / NF1 live here (deletion-coupled, no dependency leg, no
  #    methylation-silencing leg); before v1.3.0 they fell through to cis_uncoupled_no_dependency's
  #    sibling default and lost the fact that their deleted arm DID explain their expression.
  #    Placed BELOW the silencing rung on purpose: when a specific epigenetic mechanism is measured, name
  #    it (CDKN2A is both deletion-coupled and silenced and must keep coherent_epigenetic_silencing).
  #    Deliberately NOT registered in nomination_verdict_gate.yaml, mirroring coherent_epigenetic_
  #    silencing: it is a LoF/SL hypothesis, not the expressed-but-inert contradiction class.
  - {verdict: coherent_cis_loss_of_function, when_all_fired: [cis-dosage-deletion-coupled-neutral, cis-expr-dependency-absent-neutral], driving_rule: cis-dosage-deletion-coupled-neutral, priority: 8}

  # ── cis_uncoupled_no_dependency — leg-1 uncoupled AND leg-2 absent (no coherent cis chain) ───────
  - {verdict: cis_uncoupled_no_dependency, when_all_fired: [cis-dosage-uncoupled-neutral, cis-expr-dependency-absent-neutral], driving_rule: cis-dosage-uncoupled-neutral, priority: 9}

# Any leg untestable (cn_invariant_panel / data_unavailable → no leg-1 token) or unmeasured →
# no rung matches → insufficient_cis_coherence. Honest abstention, never a passenger claim from a gap.
default: insufficient_cis_coherence
