# mechanism-and-pharmacology (Gate D) verdict resolver (gap #5, 2026-07-20).
# Declarative transcription of skills/mechanism-and-pharmacology/scripts/run.py::_verdict.
# NETWORK SHAPE is the sole verdict axis. The former `has_pd_marker` rung (priority 3) was
# STRUCTURALLY DEAD and REMOVED (2026-09-07, v1.2.0): has-pd-marker-supportive fires iff
# n_downstream >= 1, but n_downstream >= 1 forces network_class ∈ {well_characterized, partial,
# sparse} (never data_unavailable), so a shape rung (priority 0-2) ALWAYS co-fired and outranked
# it — the has_pd_marker verdict could never win (proven; won 0/7 across the panel). The PD marker
# remains surfaced non-verdictally as headline.has_pd_marker + pd_marker_classes_present (a
# secondary annotation, like alteration-role), so nothing is lost. (Its original ordering rationale
# — protecting a sparse OPPOSING warning — was also stale: `sparse` is now NEUTRAL, not opposing.)
gate: mechanism
version: 1.2.0
description: Signaling-network mechanism precedence — network shape is the sole verdict axis.
resolve:
  - verdict: well_characterized
    when_fired: mechanism-well-characterized-supportive
    priority: 0
  - verdict: partial
    when_fired: mechanism-partial-neutral
    priority: 1
  - verdict: sparse
    when_fired: mechanism-sparse-warning
    priority: 2
  - verdict: data_unavailable
    when_fired: mechanism-data-unavailable-insufficient
    priority: 3
default: insufficient
evaluation: match_all_reduce
