# Card — PHOSPHO PATHWAY ACTIVITY (target biology at the phospho level; Q8)
#
# From CPTAC phosphoproteomics: is the target PHOSPHORYLATED in the indication's tumors, and — the
# key question for kinases / signaling proteins — is it phosphorylated BEYOND its total abundance
# (a proxy for PATHWAY ACTIVITY / activation state that total-protein presence (Q1/Q5) misses)?
#   - phospho_active      → phosphosites detected in a substantial fraction of tumors AND the phospho
#                           signal exceeds the total-protein expectation → active signaling.
#   - phospho_present     → detected but tracking abundance (present, not clearly hyper-activated).
#   - phospho_low         → few phosphosites detected despite the gene being in the panel.
#   - phospho_not_detected → NO phosphosites for the target in this cohort's phospho panel, but the
#                           target's TOTAL PROTEIN *is* detected in the same cohort's MS. A measured
#                           no-detection, NOT a claim that the target is unphosphorylatable.
#   - data_unavailable    → no CPTAC cohort for the indication, a read failure, OR the target's total
#                           protein is not detected in this cohort either (the axis is uninformative:
#                           absence of phosphopeptides is unreadable when the protein itself is absent).
#
# 2026-09-12 TOKEN RETIREMENT — `not_phosphoprotein` (v0.1.0) asserted a BIOLOGICAL state ("the target
# is not a phosphoprotein; this axis genuinely does not apply") from what is actually a COVERAGE FLOOR.
# Measured against the products: the phospho panel covers ~4.7-6.1k genes per cohort while total protein
# covers ~7.4-11.5k, so ~48-55% of protein-detected genes in EVERY cohort have zero phosphosites — and
# ~1.7-2.3k of those per cohort DO carry phosphosites in another CPTAC cohort, i.e. are demonstrably
# phosphoproteins. Concrete false calls under the old token: ALK (0 sites in all 10 cohorts — an RTK
# defined by autophosphorylation), CDK4 (0 sites in 9/10 despite the canonical T172 activating site),
# MET (0 in brca/hnscc, 8 in ccrcc), and KRAS itself (0 in coad but 2 in ccrcc) — the very example the
# retired caveat used to justify the claim. Replaced by `phospho_not_detected` + the protein-detection
# and cross-cohort evidence fields, which state what was measured without asserting the negative.
#
# ZERO new ingestion — reads the cptac PYTHON PACKAGE's harmonized phosphoproteomics [bcm]
# (Patient_ID x (gene, site, peptide, ENSG) multiindex) + proteomics [bcm] for the phospho-vs-total
# comparison. Same cptac package + cohort map as the Q5 tumor arm.
#
# ROUTES INTO GATES (master-sequencing Part 3): Presence (A, protein/pathway-level support) +
# Mechanism (D, is the signaling pathway active). Biology axis; no modality-gate facet. For
# kinases/signaling targets this is the SHARPEST presence signal (phospho-activity > total abundance).

card_id: phospho-pathway-activity
version: 0.2.0
question: "Is {target.symbol} phosphorylated (pathway-activity proxy) in {indication.label} tumors, and beyond its total abundance — or is no phosphorylation detected?"

tier: indication

applies_when:
  # needs a CPTAC cohort for the indication (the cptac package's 10 cohorts).
  - "context.indication in ['BRCA', 'KIRC', 'CCRCC', 'COADREAD', 'COAD', 'READ', 'GBM', 'HNSC', 'HNSCC', 'LUSC', 'LSCC', 'LUAD', 'OV', 'PAAD', 'PDAC', 'UCEC']"

required_inputs:
  - product_id: cptac-phospho-per-site-per-cohort-v1   # derived per-site/per-cohort product — reader's pushdown path
  - product_id: cptac-protein-tumor-vs-normal-per-cohort-v1  # TOTAL-PROTEIN detection probe: separates a measured no-phospho (protein detected) from an uninformative axis (protein absent too)
  - product_id: cptac-pdc-snapshot-2026-07-01          # cptac package harmonized phosphoproteomics [bcm] + proteomics [bcm] (upstream source)

methods:
  - call: phospho-pathway-activity
    args:
      target: "{target.symbol}"
      indication: "{indication}"

outputs:
  summary_fields:
    - phospho_activity_class              # PRIMARY categorical (drives Tier-2 rules)
    - n_phosphosites                      # target's phosphosites in the CPTAC panel
    - n_phosphosites_frequent             # sites detected in >= active-fraction of tumors
    - max_site_detection_fraction         # detection fraction of the most-detected site
    - phospho_exceeds_abundance           # true = phosphorylated beyond total protein (pathway-active)
    - top_site_phospho_minus_protein      # top site's mean(phospho log-ratio − gene total-protein log-ratio) across paired tumors
    - n_phospho_protein_paired            # paired tumors backing the top site's phospho-vs-protein residual
    - top_phosphosites                    # top sites by detection (record list)
    - total_protein_detected_in_cohort    # is the target's TOTAL protein detected in this cohort's MS? (null = probe unavailable)
    - n_cohorts_with_phosphosites         # how many of the product's 10 CPTAC cohorts carry >=1 phosphosite for the target
    - phosphoprotein_detected_in_other_cohorts  # true = the target IS a phosphoprotein elsewhere in CPTAC ⇒ this cohort's zero is a detection gap
    - phospho_axis_uninformative_reason   # why data_unavailable, when it is not a missing cohort (e.g. total_protein_not_detected_in_cohort)
    - n_tumors
    - cptac_cohort
    - substrate
  summary_fields_record_schemas:
    top_phosphosites:
      site: string
      detection_fraction: number
  summary_fields_vocabulary:
    phospho_activity_class: [phospho_active, phospho_present, phospho_low, phospho_not_detected, data_unavailable]
  figure: phospho_pathway_activity_card

thresholds:
  detected_fraction_active: 0.50      # site detected in >= this fraction → substantial
  phospho_over_protein_delta: 0.25    # mean(phospho z) - mean(protein z) > this → exceeds abundance
  min_tumors: 20                      # below → data_unavailable

caveats:
  - "phospho_not_detected is a MEASURED no-detection, NOT a claim the target is unphosphorylatable. The phospho panel covers ~4.7-6.1k genes/cohort vs ~7.4-11.5k for total protein, so ~48-55% of protein-detected genes have zero phosphosites, and ~1.7-2.3k of those per cohort DO carry sites in another CPTAC cohort. Read phosphoprotein_detected_in_other_cohorts before inferring biology: true means this cohort's zero is a DETECTION gap (e.g. KRAS 0 in coad but 2 in ccrcc; MET 0 in brca, 8 in ccrcc)."
  - "When the target's total protein is not detected in the same cohort, the class is data_unavailable with phospho_axis_uninformative_reason=total_protein_not_detected_in_cohort — phosphopeptide absence is unreadable when the protein itself is undetected (e.g. ALK in LUAD, a fusion-activated RTK below bulk-MS detection). Never read that as evidence against phosphorylation."
  - "phospho_exceeds_abundance compares mean phospho z-score to mean total-protein z-score across tumors; a target can be abundantly phosphorylated simply because it is abundant (phospho_present) vs hyper-phosphorylated beyond abundance (phospho_active). Interpret with the abundance cards (Q1/Q5)."
  - "Detection fraction reflects MS coverage (a phosphosite below the MS detection limit reads as absent); low detection is not proof of no phosphorylation. Phosphosite-level stoichiometry is not resolved."
  - "The phospho signal is total across the target's sites (mean); a SPECIFIC activating site (e.g. an autophosphorylation site) is not singled out — top_phosphosites lists the most-detected sites for follow-up but does not assert which is functionally activating."
  - "CPTAC bcm phospho is the harmonized cptac-package source; it is a tumor cohort (no matched-normal contrast in this card — that is a follow-up)."

measurement: bulk_protein_ms
sample_context: tumor

# DATA_TO_SKILL_CONTRACT Rule 1 — NEW measurement_type: phospho pathway-activity (CPTAC phospho).
measurement_type: phospho_pathway_activity
entity_grains: [target_indication]
schema_version: 1
