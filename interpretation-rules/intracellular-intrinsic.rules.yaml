# Tier-2 signal-mapping rules for the intracellular-intrinsic biology axis.
# Maps card-emitted descriptive labels → per-modality signals consumed by Tier-3 synthesis.
#
# CONSOLIDATES three previously-scattered homes of normative logic:
#   1. card_spec interpretation_hints[].dominant flags (Cards 1, 2, 4)
#   2. modality-module killer_conditions (small_molecule, degrader)
#   3. synthesis-layer NOT_INFORMATIVE_CALLS hardcoded set (_synthesis.py:59-68)
#
# Reviewable by domain experts in PR. Each rule is a normative claim that should be
# defensible against biology + therapeutic-development practice.

rules_id: intracellular-intrinsic
version: 1.0.0
axis: intracellular_intrinsic
schema_version: 1

rationale: |
  Intracellular-intrinsic targets (cytoplasmic/nuclear proteins acting cell-autonomously)
  are pursued primarily via small-molecule + degrader modalities. The therapeutic
  rationale requires (a) functional dependency in the indication's cell context AND
  (b) for degraders, demonstrable protein presence. This rules file encodes those
  modality-specific requirements as signal mappings over descriptive evidence labels.

rules:
  # ============================================================================
  # E1 — Pan-cancer dependency distribution (Card 1: pan-cancer-crispr-dependency-distribution)
  # ============================================================================

  - rule_id: pan-essential-killer
    when:
      card_id: pan-cancer-crispr-dependency-distribution
      field: dependency_class
      equals: common_essential
    signals:
      small_molecule: killer
      degrader: killer
    killer_message: |
      Pan-essential target — no therapeutic window. Common-essential genes are required
      for viability across the panel; systemic inhibition produces unacceptable toxicity
      regardless of indication. Not viable as a small-molecule or degrader program.
    rationale: |
      DepMap's common_essential classification (~2000 genes, mostly housekeeping/ribosomal).
      Pursuing these requires either tissue-restricted delivery (out of scope for systemic
      small-molecule/degrader) or context-conditional inhibition (mutant-specific, etc.).

  - rule_id: common-essential-underpowered-insufficient
    when:
      card_id: pan-cancer-crispr-dependency-distribution
      field: dependency_class
      equals: common_essential_underpowered
    signals:
      small_molecule: insufficient
      degrader: insufficient
    rationale: |
      H fix (2026-07-20): a >=85% pan-essential fraction on a panel BELOW the coverage
      floor (PAN_ESSENTIAL_MIN_PANEL_N=300) — an underpowered tiny-panel artifact, NOT a
      trusted pan-essential. Symmetric top-end admissibility guard to
      non-dependent-underpowered-insufficient: this must NOT fire the pan-essential VETO
      (an underpowered positive is a coverage gap, not a measured pan-essential).
      Checked as a distinct verdict so the functional-requirement _verdict routes it to
      insufficient before the pan-essential killer. Measured-vs-null discipline.

  - rule_id: strongly-selective-supportive
    when:
      card_id: pan-cancer-crispr-dependency-distribution
      field: dependency_class
      equals: strongly_selective
    signals:
      small_molecule: supportive
      degrader: supportive
    dominant: true
    rationale: |
      DepMap's strongly_selective classification — dependency is highly variable across
      the panel, suggesting context-specific essentiality. This is the canonical
      therapeutic-window signal: some cell contexts need it, most don't.

  - rule_id: non-dependent-killer
    when:
      card_id: pan-cancer-crispr-dependency-distribution
      field: dependency_class
      equals: non_dependent
    signals:
      small_molecule: killer
      degrader: killer
    killer_message: |
      No functional dependency detected across the cell-line panel. Without dependency
      evidence there is no rationale for therapeutic investment regardless of modality.

  - rule_id: non-dependent-underpowered-insufficient
    when:
      card_id: pan-cancer-crispr-dependency-distribution
      field: dependency_class
      equals: non_dependent_underpowered
    signals:
      small_molecule: insufficient
      degrader: insufficient
    rationale: |
      DepMap-power admissibility guard (2026-07-17). The POOLED pan-cancer fraction is
      below the dependency floor, but a well-sampled lineage (n>=5) is concentrated-
      dependent — the relevant lineage/genotype is simply UNDER-SAMPLED in DepMap
      (EGFR-mut lung, FLT3-mut AML, IDH1-mut), so the pooled negative is diluted, not
      trusted. This is a COVERAGE GAP (insufficient), NOT a measured negative — it must
      NOT fire the non_dependent veto (measured-vs-null discipline: absence of pooled
      power is not evidence-against). The lineage-scoped or mutation-stratified
      dependency cards carry the real read for the concentrated context; synthesis
      should surface "insufficient pan-cancer power; see lineage/mutation-stratified
      evidence" rather than a false-negative veto.

  - rule_id: broadly-dependent-neutral
    when:
      card_id: pan-cancer-crispr-dependency-distribution
      field: dependency_class
      equals: broadly_dependent
    signals:
      small_molecule: neutral
      degrader: neutral
    rationale: |
      Dependency signal is broad but doesn't meet the common_essential threshold (~85%
      strongly-dependent). Between selective and pan-essential territory. NOT a killer
      on its own — could still be a valid therapeutic-window target if lineage-selectivity
      or mutation-stratification cards identify a discriminating context. Downstream cards
      carry the differentiation.

  # ============================================================================
  # E1b — Pan-cancer RNAi dependency distribution (Card 1b)
  # ============================================================================
  # Parallel to CRISPR Card 1 on DEMETER2 scale. The concordance card (E1c) carries
  # cross-assay reconciliation; these per-assay rules are scoped to single-card signal.

  - rule_id: rnai-pan-essential-killer
    when:
      card_id: pan-cancer-rnai-dependency-distribution
      field: rnai_dependency_class
      equals: common_essential
    signals:
      small_molecule: killer
      degrader: killer
    killer_message: |
      RNAi LOF shows pan-essential signal. Cross-check vs CRISPR via the concordance
      card; if both agree the program is not viable as systemic small_molecule/degrader.
    rationale: |
      DEMETER2 ≥85% strong-dep matches DepMap's common_essential convention on the RNAi
      panel. Same therapeutic-window argument as CRISPR's pan-essential rule.

  - rule_id: rnai-common-essential-underpowered-insufficient
    when:
      card_id: pan-cancer-rnai-dependency-distribution
      field: rnai_dependency_class
      equals: common_essential_underpowered
    signals:
      small_molecule: insufficient
      degrader: insufficient
    rationale: |
      H fix (2026-07-20): RNAi >=85% pan-essential on a panel below the coverage floor —
      underpowered artifact, NOT a trusted pan-essential. Must not fire the RNAi
      pan-essential veto. Symmetric with the CRISPR common-essential-underpowered guard.

  - rule_id: rnai-strongly-selective-supportive
    when:
      card_id: pan-cancer-rnai-dependency-distribution
      field: rnai_dependency_class
      equals: strongly_selective
    signals:
      small_molecule: supportive
      degrader: supportive
    rationale: |
      RNAi shows selective dependency — orthogonal LOF confirmation if CRISPR also
      strongly-selective. NOT dominant on its own: RNAi knockdown is partial vs CRISPR's
      complete knockout, so RNAi-alone signal needs CRISPR cross-check to drive fit_level.

  - rule_id: rnai-non-dependent-neutral
    when:
      card_id: pan-cancer-rnai-dependency-distribution
      field: rnai_dependency_class
      equals: non_dependent
    signals:
      small_molecule: neutral
      degrader: neutral
    rationale: |
      RNAi finds no dependency. NOT a killer on its own — RNAi has known false-negative
      patterns (partial knockdown insufficient to reveal dependency). The CRISPR card
      carries the dependency-killer logic; concordance card reconciles cross-assay.

  - rule_id: rnai-broadly-dependent-neutral
    when:
      card_id: pan-cancer-rnai-dependency-distribution
      field: rnai_dependency_class
      equals: broadly_dependent
    signals:
      small_molecule: neutral
      degrader: neutral
    rationale: |
      RNAi shows dependency across many but not all lines — between strongly_selective
      and common_essential. Signal alone is neutral; the CRISPR analog + concordance
      card carry the dominant decision logic.

  - rule_id: rnai-data-unavailable-insufficient
    when:
      card_id: pan-cancer-rnai-dependency-distribution
      field: rnai_dependency_class
      equals: data_unavailable
    signals:
      small_molecule: insufficient
      degrader: insufficient
    rationale: |
      RNAi data unreachable or target absent from DEMETER2 panel. Coverage gap;
      not used as opposing evidence. CRISPR card carries the dependency call alone.

  # ============================================================================
  # E1c — CRISPR-RNAi concordance (Card 1c, derived)
  # ============================================================================
  # The concordance card consumes upstream CRISPR + RNAi outputs and emits a derived
  # categorical describing cross-assay agreement. These rules promote concordant
  # signals to DOMINANT (orthogonal-evidence confirmation strengthens the call)
  # and flag discordance as a warning, not a killer.

  - rule_id: concordant-dependent-supportive-dominant
    when:
      card_id: crispr-rnai-dependency-concordance
      field: concordance_class
      in: [strongly_concordant_dependent, moderately_concordant_dependent]
    signals:
      small_molecule: supportive
      degrader: supportive
    dominant: true
    rationale: |
      CRISPR and RNAi BOTH call dependent for the majority of cell lines tested in
      both panels. Orthogonal-LOF-evidence confirmation; reliability is high.
      Promoted to dominant because cross-assay agreement is the gold-standard
      'real dependency' signal in cellular models.
      2026-08-08: also matches `moderately_concordant_dependent` (the 0.70-0.85 agreement
      band), which was formerly LABELED `strongly_concordant_dependent` — so this rule fires
      on exactly the same targets as before the relabel (VERDICT-INERT). The moderate label
      is an honest descriptive downgrade of the agreement strength, not of the dependency call.

  - rule_id: concordant-non-dependent-neutral
    when:
      card_id: crispr-rnai-dependency-concordance
      field: concordance_class
      in: [strongly_concordant_non_dependent, moderately_concordant_non_dependent]
    signals:
      small_molecule: neutral
      degrader: neutral
    rationale: |
      Concordance class is descriptive of which side of the partition dominates the
      in-both subset — for SELECTIVE targets (which are the framework's main interest),
      most lines are non-dependent in both assays, so 'strongly_concordant_non_dependent'
      lands here naturally without being a kill-the-program signal. The killer-on-
      non-essentiality logic lives in the upstream per-assay cards' non_dependent rules
      (CRISPR non-dependent-killer + RNAi non-dependent-killer); both must fire to
      kill the program. This rule keeps the descriptive concordance label without
      double-firing the killer.

      Discovered 2026-06-30 during live KRAS-COADREAD smoke: KRAS is a strongly
      selective target with two approved small molecules (sotorasib, adagrasib). The
      concordance label legitimately reports 51% agree-non-dependent vs 24%
      agree-dependent on the in-both subset (a SELECTIVE-target signature), which
      should NOT be a killer.

  - rule_id: concordance-discordant-warning
    when:
      card_id: crispr-rnai-dependency-concordance
      field: concordance_class
      equals: discordant
    signals:
      small_molecule: opposing
      degrader: opposing
    rationale: |
      CRISPR and RNAi disagree substantially (≥30% of in-both lines disagree). Not a
      killer — discordance can reflect biology (partial RNAi knockdown vs complete
      CRISPR knockout) rather than error — but downgrades single-assay-dominant
      signals from supportive to opposing pending mechanistic context.

  - rule_id: concordance-partially-assayed-insufficient
    when:
      card_id: crispr-rnai-dependency-concordance
      field: concordance_class
      equals: partially_assayed
    signals:
      small_molecule: insufficient
      degrader: insufficient
    rationale: |
      Cell-line overlap between CRISPR and RNAi panels is below the minimum threshold
      (< 30 lines). Concordance call cannot be made reliably; the per-assay cards
      carry the dependency signals individually.

  - rule_id: concordance-data-unavailable-insufficient
    when:
      card_id: crispr-rnai-dependency-concordance
      field: concordance_class
      equals: data_unavailable
    signals:
      small_molecule: insufficient
      degrader: insufficient
    rationale: |
      Concordance requires BOTH upstream cards to succeed; one or both failed. Not
      used as opposing evidence. The per-assay cards may still contribute signals.

  # ============================================================================
  # E2 — Lineage selectivity (Card 2: dependency-lineage-selectivity)
  # ============================================================================

  # Card 2 (E2) refactored to v3.0.0 — target-only, indication-decoupled. Emits
  # `enrichment_class` describing the SHAPE of lineage variation across the panel.
  # Per-indication interpretation ("which lineage matters for THIS dashboard?") is
  # a synthesis-layer concern that consults the per_lineage_stats table directly.

  - rule_id: lineage-selective-supportive
    when:
      card_id: dependency-lineage-selectivity
      field: enrichment_class
      equals: lineage_selective
    signals:
      small_molecule: supportive
      degrader: supportive
    dominant: true
    rationale: |
      ≥1 lineage is significantly more dependent on the target than the rest of the
      panel (BH-adjusted q < α). Indication-selection driver: a clear "use it for THIS
      cancer type" signal. Which specific lineage matters for the dashboard's resolved
      indication is a synthesis-layer lookup over per_lineage_stats.

  - rule_id: broadly-lineage-dependent-neutral
    when:
      card_id: dependency-lineage-selectivity
      field: enrichment_class
      equals: broadly_lineage_dependent
    signals:
      small_molecule: neutral
      degrader: neutral
    rationale: |
      Multiple lineages show dependency but no single lineage is significantly enriched
      vs the rest. Doesn't kill the case (dependency exists) but doesn't differentiate
      an indication either. Pan-cancer dependency classification (E1) carries the
      therapeutic-window story instead.

  - rule_id: no-lineage-enrichment-neutral
    when:
      card_id: dependency-lineage-selectivity
      field: enrichment_class
      equals: no_lineage_enrichment
    signals:
      small_molecule: neutral
      degrader: neutral
    rationale: |
      No lineage shows significant dependency enrichment vs the rest. This is
      DESCRIPTIVELY informative but NOT a killer on its own — the gene could still
      be uniformly dependent across the panel (in which case E1's dependency_class
      would carry the killer). Killer determination for "dependency does not exist"
      lives correctly on E1's non-dependent-killer rule, not duplicated here.

  - rule_id: lineage-selectivity-data-unavailable-insufficient
    when:
      card_id: dependency-lineage-selectivity
      field: enrichment_class
      equals: data_unavailable
    signals:
      small_molecule: insufficient
      degrader: insufficient
    rationale: |
      Lineage selectivity data unreachable or panel too small. Coverage gap; not
      used as opposing evidence. Other dependency evidence threads (E1 CRISPR/RNAi)
      carry the therapeutic-window story.

  # ============================================================================
  # Card 3 — mutation-stratified-dependency (oncogene-addiction biomarker)
  # ============================================================================

  - rule_id: mutant-strongly-dependent-supportive
    when:
      card_id: mutation-stratified-dependency
      field: mutation_stratification_class
      equals: mutant_strongly_dependent
    signals:
      small_molecule: supportive
      degrader: supportive
    dominant: true
    rationale: |
      Mutant cells significantly + strongly more dependent than WT (BH-corrected q < α,
      |delta| >= 0.5). Oncogene-addiction biomarker — supports a mutation-stratified
      clinical strategy (give the drug to patients with the mutation). Canonical
      examples: BRAF-V600E + vemurafenib, KRAS-G12C + sotorasib, EGFR-L858R + erlotinib.

  - rule_id: mutant-moderately-dependent-supportive
    when:
      card_id: mutation-stratified-dependency
      field: mutation_stratification_class
      equals: mutant_moderately_dependent
    signals:
      small_molecule: supportive
      degrader: supportive
    rationale: |
      Significant mutant-vs-WT stratification but smaller effect size (-0.2 to -0.5).
      Supportive but not dominant on its own; biomarker hypothesis viable but needs
      stronger orthogonal evidence (PDX, isogenic-model rescue) before clinical strategy.

  # A1a (2026-08-06): copy-number analogs of the two mutation-stratified rules above. The CN card
  # (copy-number-stratified-dependency) is the amplification sibling; these rules fire the SAME
  # biomarker_stratified_dependency verdict in genomic_alteration.resolver.yaml (no new verdict,
  # no gate change). Closes the amplification-driven-oncogene gap the mutation-only path missed.
  - rule_id: cn-amplified-strongly-dependent-supportive
    when:
      card_id: copy-number-stratified-dependency
      field: cn_stratification_class
      equals: amplified_strongly_dependent
    signals:
      small_molecule: supportive
      degrader: supportive
    dominant: true
    rationale: |
      Amplified cells significantly + strongly more dependent than non-amplified (q < α,
      |delta| >= 0.5). Amplification-addiction biomarker — supports a copy-number-stratified
      strategy. The copy-number analog of oncogene-addiction; the class the mutation-only
      stratified path misses for amplification-driven oncogenes (ERBB2, MYC).

  - rule_id: cn-amplified-moderately-dependent-supportive
    when:
      card_id: copy-number-stratified-dependency
      field: cn_stratification_class
      equals: amplified_moderately_dependent
    signals:
      small_molecule: supportive
      degrader: supportive
    rationale: |
      Significant amplified-vs-neutral stratification but smaller effect size (-0.2 to -0.5).
      Supportive but not dominant on its own; the amplification-addiction hypothesis is viable
      but needs stronger orthogonal evidence. Live example: ERBB2 (delta -0.31), MYC (-0.24).

  # Track PC (2026-08-09): PARTNER-conditional analogs. Unlike the own-alteration siblings above
  # (mutation/CN/fusion), the stratifier here is a PARTNER gene's DEFICIENCY (synthetic lethality),
  # so these fire a DISTINCT verdict (partner_conditional_dependent / moderate) in dependency.resolver
  # — NOT biomarker_stratified_dependency (partner-SL != own-oncogene addiction; mirrors the
  # drug_response_biomarker separation). The rescue-firing tier is MODERATE, not just STRONG: the
  # WRN×MSI anchor is a -0.41 effect (context-conditional SL is structurally smaller than addiction).
  - rule_id: partner-conditional-strongly-dependent-supportive
    when:
      card_id: partner-conditional-dependency
      field: partner_stratification_class
      equals: partner_conditional_strongly_dependent
    signals:
      small_molecule: supportive
      degrader: supportive
    dominant: true
    rationale: |
      Partner-deficient cells significantly + strongly more dependent than partner-neutral (q < α,
      |delta| >= 0.5). Synthetic-lethality biomarker — supports a partner-conditional strategy (give
      the drug where the partner is deficient). The class the pooled dependency scalar misses for
      partner_conditional_sl targets (definitionally non-monoculture-essential).

  - rule_id: partner-conditional-moderately-dependent-supportive
    when:
      card_id: partner-conditional-dependency
      field: partner_stratification_class
      equals: partner_conditional_moderately_dependent
    signals:
      small_molecule: supportive
      degrader: supportive
    dominant: true
    rationale: |
      Significant partner-deficient-vs-neutral stratification, effect size -0.2 to -0.5. For the
      partner-conditional SL family this MODERATE tier IS the rescue-firing signal (not merely
      supportive-not-dominant, unlike the own-alteration moderate tier): context-conditional SL
      effect sizes in mono-KO CRISPR are structurally smaller than oncogene addiction, so the ANCHOR
      itself lives here. Live example: WRN×MSI (delta -0.41, p 8.8e-12, 91 MSI-high lines).

  # A1-fusion (2026-08-06): gene-fusion analogs of the two mutation-stratified + CN-stratified rules
  # above. The fusion card (fusion-stratified-dependency) is the fusion-addiction sibling; these rules
  # fire the SAME biomarker_stratified_dependency verdict in genomic_alteration.resolver.yaml (no new
  # verdict, no gate change). Closes the fusion-driven-oncogene gap (EWSR1-FLI1, BCR-ABL1) that BOTH
  # the mutation-only and CN-only stratified paths miss.
  - rule_id: fusion-positive-strongly-dependent-supportive
    when:
      card_id: fusion-stratified-dependency
      field: fusion_stratification_class
      equals: fusion_positive_strongly_dependent
    signals:
      small_molecule: supportive
      degrader: supportive
    dominant: true
    rationale: |
      Fusion-positive cells significantly + strongly more dependent than fusion-negative (q < α,
      |delta| >= 0.5). Fusion-addiction biomarker — supports a fusion-stratified strategy. The class
      the mutation-only + CN-only stratified paths miss for fusion-driven oncogenes: the target is
      neither hotspot-mutated nor amplified but the fusion establishes the dependency (EWSR1-FLI1
      Ewing addiction, delta -0.69; BCR-ABL1).

  - rule_id: fusion-positive-moderately-dependent-supportive
    when:
      card_id: fusion-stratified-dependency
      field: fusion_stratification_class
      equals: fusion_positive_moderately_dependent
    signals:
      small_molecule: supportive
      degrader: supportive
    rationale: |
      Significant fusion-positive-vs-negative stratification but smaller effect size (-0.2 to -0.5).
      Supportive but not dominant on its own; the fusion-addiction hypothesis is viable but needs
      stronger orthogonal evidence (fusion-positive PDX, isogenic breakpoint constructs). Live
      example: ABL1 (delta -0.47, BCR-ABL1).

  # T1.3 (2026-08-09) — PATIENT-recurrence fusion driver (the mode-gap fix). DISTINCT from the two
  # DepMap fusion-DEPENDENCY rules above: this reads fusion-rearrangement-landscape (TCGA-consensus +
  # GENIE SV patient recurrence), NOT a cell-line Chronos split. It is the fusion analog of
  # cn-recurrently-amplified-supportive (a patient-recurrence LANDSCAPE driver), and the resolver
  # promotes it to a NEW recurrent_fusion_driver verdict — closing the gap where a recurrently
  # rearranged patient oncogene with NO DepMap cell line (or a line-poor tissue) collapsed to
  # passenger/insufficient (the exact gap the ERBB2/MYC CN reframe fixed for amplification). The card
  # already emits recurrent_fusion_driver (>=3 samples partner-or-target recurrence, with a measured-
  # negative no_recurrent_fusion bucket); the surface rules already consume it — only the genomic
  # verdict lacked a rung. The card's own rationale even says "encoded in the intracellular rules".
  - rule_id: fusion-landscape-recurrent-driver-supportive
    when:
      card_id: fusion-rearrangement-landscape
      field: fusion_class
      equals: recurrent_fusion_driver
    signals:
      small_molecule: supportive
      degrader: supportive
    rationale: |
      The target is recurrently involved in gene fusions/rearrangements in the indication (>=3 samples
      as a recurrent partner OR the target itself recurs >=3 samples; TCGA-consensus 3-caller + GENIE
      SV breadth). A recurrent fusion is a bona-fide oncogenic driver event — catalytic-domain-retained
      kinase fusions support small-molecule inhibition (ALK/RET/ROS1/NTRK), and a bindable/degradable
      fusion protein supports degraders. This is a PATIENT-recurrence landscape signal (the fusion
      analog of recurrent focal amplification), ORTHOGONAL to the DepMap fusion-dependency cards above:
      it rescues fusion-driven oncogenes that are line-poor or absent from DepMap and would otherwise
      read passenger (EWSR1-FLI1, BCR-ABL1, EML4-ALK). NOT a killer — recurrence establishes driver
      status, the modality-fit + dependency threads carry the tractability story.

  - rule_id: snv-recurrence-top-driver-supportive
    when:
      card_id: mutation-hotspot-frequency
      field: pooled_driver_recurrence_class
      equals: top_1pct
    signals:
      small_molecule: supportive
      degrader: supportive
    rationale: |
      The target is among the MOST RECURRENTLY MUTATED genes in the indication's patients (top 1% by
      pooled multi-cohort frequency: TCGA-MC3 whole-exome + GENIE + MSK-CHORD panels, coverage-corrected,
      pooled by summed-counts/summed-coverage; pooled-snv-recurrence-v1). This is the SNV analog of the
      recurrent focal-amplification / recurrent-fusion landscape drivers — a PATIENT-recurrence signal
      that fires the recurrent_snv_driver resolver rung (scope-coherence Phase 2). It rescues genuinely
      indication-recurrent SNV drivers that are line-poor / absent from DepMap and carry no cell-line
      dependency or variant-class-dominance signal, which would otherwise fall through to passenger /
      insufficient. It sits BELOW the dependency + variant-class-pattern rungs (a KO-dependency or a
      lof/missense-dominant spectrum is a stronger call), so KRAS/APC/TP53-style genes keep their
      higher-tier verdict; recurrent_snv_driver is the honest floor for recurrence-only SNV drivers.
      NOT a killer.

  # A1 amp→expr→dep (2026-08-06): the CONJOINT (amplified AND overexpressed) analog of the CN-stratified
  # rules above. The three-way card (amp-expr-stratified-dependency) is the amplification-DRIVEN-
  # overexpression-addiction sibling; these rules fire the SAME biomarker_stratified_dependency verdict
  # in genomic_alteration.resolver.yaml (no new verdict, no gate change). Closes the amp→overexpression→
  # dependency gap the CN-only path (expression-blind) under-weights (ERBB2 sharper here than CN-alone).
  - rule_id: amp-expr-strongly-dependent-supportive
    when:
      card_id: amp-expr-stratified-dependency
      field: amp_expr_stratification_class
      equals: amplified_overexpressed_strongly_dependent
    signals:
      small_molecule: supportive
      degrader: supportive
    dominant: true
    rationale: |
      Amplified+overexpressed cells significantly + strongly more dependent than the rest (q < α,
      |delta| >= 0.5). Amplification-driven overexpression-addiction — supports a copy-number+expression-
      stratified strategy. The conjoint refinement the CN-only path under-weights: conditioning the
      amplified arm on ALSO-overexpressed isolates the addicted subset. Live example: KRAS (delta -0.64).

  - rule_id: amp-expr-moderately-dependent-supportive
    when:
      card_id: amp-expr-stratified-dependency
      field: amp_expr_stratification_class
      equals: amplified_overexpressed_moderately_dependent
    signals:
      small_molecule: supportive
      degrader: supportive
    rationale: |
      Significant amplified+overexpressed-vs-rest stratification but smaller effect size (-0.2 to -0.5).
      Supportive but not dominant on its own; the amplification-driven-addiction hypothesis is viable but
      needs stronger orthogonal evidence (isogenic amplification models). Live example: ERBB2 (delta -0.41,
      SHARPER than the CN-only -0.31 — the conditioning on overexpression works), MYC (delta -0.26).

  - rule_id: amp-expr-indication-scoped-context
    when:
      card_id: amp-expr-stratified-dependency
      field: evidence_scope
      in: [within_indication, within_indication_mut_vs_pan_wt]
    signals:
      small_molecule: neutral
      degrader: neutral
    rationale: |
      Indication-scope GATE for the amp-expr biomarker verdict (redesign Stage 3a). The amp-expr
      stratified-dependency signal can be computed from PAN-LINEAGE evidence only
      (evidence_scope=pan_lineage_evidence_only / pan_no_indication) when the indication has too few
      amplified+overexpressed lines. A pan-lineage signal is NOT an indication-level biomarker — the
      audit found MARK2/PAAD promoted to moderate_biomarker_dependency off a pan-lineage amp-expr signal
      (n=7 across DepMap, not PAAD-scoped). The genomic resolver's §0 amp-expr biomarker rungs now require
      this rule (when_all_fired), so only INDICATION-scoped amp-expr evidence earns a biomarker verdict;
      pan-lineage-only amp-expr falls through to the driver/pattern rungs. Neutral: scope context, not a
      biology call. (Mutation-stratified veto-suppressor rescues — EGFR/IDH1/FLT3 — are UNAFFECTED.)

  # ── Indication-scope GATES for the mutation / CN / fusion biomarker verdicts (scope-coherence Phase 1) ──
  # These three mirror amp-expr-indication-scoped-context above, HARMONIZING the scope treatment across
  # all four stratified-dependency siblings: previously only amp-expr's biomarker rungs required
  # indication-scoped evidence, while the mutation / cn / fusion rungs — which LEAD the genomic resolver
  # ladder — fired on the pan-cancer/pan-lineage class alone, so a pan-lineage-only dependency in a lineage
  # the queried indication does not belong to could still set biomarker_stratified_dependency. The genomic
  # resolver's dependency rungs now require the matching gate (when_all_fired), so only INDICATION-scoped
  # KO-dependency evidence earns a biomarker verdict; pan-lineage-only evidence falls through to the
  # driver / variant-pattern / landscape rungs (never disappears). Neutral: scope context, not a biology
  # call. The genomic_alteration_by_scope headline block (skills Phase 0) surfaces which lineage each call
  # rests on. Backtest-gated: KRAS/ERBB2/EWSR1/BRAF/MET retain (indication-scoped); a pan-lineage-only-in-
  # wrong-tissue signal downgrades.
  - rule_id: mutant-indication-scoped-context
    when:
      card_id: mutation-stratified-dependency
      field: evidence_scope
      in: [within_indication, within_indication_mut_vs_pan_wt]
    signals:
      small_molecule: neutral
      degrader: neutral
    rationale: |
      Indication-scope GATE for the mutation biomarker verdict (scope-coherence Phase 1). The mutation
      stratified-dependency signal can be computed from PAN-LINEAGE evidence only when the indication has
      too few mutant lines; a pan-lineage signal is not an indication-level biomarker. Required by the
      genomic resolver's mutant-*-dependent biomarker rungs (when_all_fired) so pan-lineage-only mutation
      dependency falls through to the confirmed_driver / *_dominant_pattern rungs. Twin of
      amp-expr-indication-scoped-context.
  - rule_id: cn-amplified-indication-scoped-context
    when:
      card_id: copy-number-stratified-dependency
      field: evidence_scope
      in: [within_indication, within_indication_mut_vs_pan_wt]
    signals:
      small_molecule: neutral
      degrader: neutral
    rationale: |
      Indication-scope GATE for the copy-number-amplified biomarker verdict (scope-coherence Phase 1).
      Required by the genomic resolver's cn-amplified-*-dependent biomarker rungs (when_all_fired) so
      pan-lineage-only amplification dependency falls through to the confirmed_driver /
      recurrent_amplification_driver rungs. Twin of amp-expr-indication-scoped-context.
  - rule_id: fusion-positive-indication-scoped-context
    when:
      card_id: fusion-stratified-dependency
      field: evidence_scope
      in: [within_indication, within_indication_mut_vs_pan_wt]
    signals:
      small_molecule: neutral
      degrader: neutral
    rationale: |
      Indication-scope GATE for the fusion-positive biomarker verdict (scope-coherence Phase 1). Required
      by the genomic resolver's fusion-positive-*-dependent biomarker rungs (when_all_fired) so
      pan-lineage-only fusion dependency falls through to the confirmed_driver / recurrent_fusion_driver
      rungs. Twin of amp-expr-indication-scoped-context.

  - rule_id: wt-strongly-dependent-neutral
    when:
      card_id: mutation-stratified-dependency
      field: mutation_stratification_class
      equals: wt_strongly_dependent
    signals:
      small_molecule: neutral
      degrader: neutral
    rationale: |
      WT cells more dependent than mutant — unusual pattern, sometimes seen in
      tumor-suppressor contexts where the LOF mutation produces synthetic dependency
      ELSEWHERE in the genome. Doesn't kill the small_molecule/degrader case on its
      own but suggests the biology is more complex than direct oncogene-addiction.

  - rule_id: not-mutation-stratified-neutral
    when:
      card_id: mutation-stratified-dependency
      field: mutation_stratification_class
      equals: not_mutation_stratified
    signals:
      small_molecule: neutral
      degrader: neutral
    rationale: |
      Dependency doesn't stratify by mutation status across the panel. NOT a killer:
      the target could still be a strong-fit modality via lineage selectivity (E2) or
      pan-essential discrimination (E1). It just means mutation status isn't a
      stratifying biomarker for this target.

  - rule_id: insufficient-mutation-rate-insufficient
    when:
      card_id: mutation-stratified-dependency
      field: mutation_stratification_class
      equals: insufficient_mutation_rate
    signals:
      small_molecule: insufficient
      degrader: insufficient
    rationale: |
      <5 mutant cell lines in the panel — Mann-Whitney test is underpowered. Coverage
      gap, not opposing evidence. Tier-3 should surface this in coverage_summary.

  - rule_id: mutation-stratified-data-unavailable
    when:
      card_id: mutation-stratified-dependency
      field: mutation_stratification_class
      equals: data_unavailable
    signals:
      small_molecule: insufficient
      degrader: insufficient
    rationale: |
      DepMap mutation matrices were unreachable. Coverage gap; not used as opposing evidence.

  # ============================================================================
  # E3.b — Copy-number distribution (Card 3b: copy-number-distribution)
  # ============================================================================
  # DESIGN: "broadly_neutral" is the CORRECT call for mutation-driven targets
  # (KRAS, BRAF, etc.) — informative ("CN axis isn't a driver here"), NOT a gap.
  # The vocabulary maps to signals that respect this: amplified/deleted are
  # supportive (CN-driven biology supports the program), neutral is NEUTRAL,
  # mixed is NEUTRAL pending downstream interpretation, data_unavailable is
  # insufficient. No CN-class is a killer — CN alone shouldn't kill a program.

  - rule_id: cn-recurrently-amplified-supportive
    when:
      card_id: copy-number-distribution
      field: copy_number_class
      equals: recurrently_amplified
    signals:
      small_molecule: supportive
      degrader: supportive
    rationale: |
      Recurrent amplification across the panel (>=20% of lines). The CN axis
      is plausibly driving target activity in a subset of contexts. Supportive
      across modalities; degrader programs can leverage amplification-elevated
      protein abundance, small-molecule programs can leverage oncogene-addiction
      patterns at amplified loci (e.g. MYC amp in HCC).
      ASYMMETRY CAVEAT (known, pre-recalibration): the amplification score counts
      only FOCAL/high-level gain (relative CN > 1.5), whereas the deletion score
      (cn-recurrently-deleted-supportive) counts hemizygous/shallow loss down to
      0.92. A focal-amp target whose gains are predominantly SHALLOW (1.07-1.5,
      one-copy) can therefore read broadly_neutral here — an amp-side FALSE
      NEGATIVE (observed for ERBB2 / CCND1 on the COADREAD cell-line panel, where
      shallow-amp fraction ~0.32 but focal-amp fraction <0.11). The focal-vs-arm
      distinction lives in the ADDITIVE patient_focal_cn_class field (GISTIC
      indication-specific focal call), NOT in this pan-cancer relative-CN class.
      A 2026-08-14 focal-driver backtest VALIDATED keeping these thresholds: adding
      shallow-amp raised amp-recall 2/6→6/6 but collapsed neutral-specificity 3/4→0/4
      (shallow gain is genome-wide background — mutation-only KRAS/BRAF/PIK3CA all
      carry shallow-amp ~0.34-0.40), and focal_amp alone doesn't separate drivers
      (ERBB2 focal 0.053 < KRAS 0.111). The real amp-driver signal belongs to
      patient_focal_cn_class + the copy-number-stratified-dependency card, NOT this
      classifier — see the backtest note in
      analysis-methods/methods/depmap_cn_distribution/cli.py. Do NOT re-tune these bands.

  - rule_id: cn-recurrently-deleted-supportive
    when:
      card_id: copy-number-distribution
      field: copy_number_class
      equals: recurrently_deleted
    signals:
      small_molecule: supportive
      degrader: supportive
    rationale: |
      Recurrent deletion across the panel (>=20% of lines). For tumor-suppressor
      targets, deletion is a loss-of-function event; the framework treats it as
      supportive (the deletion creates a context the program might exploit, e.g.
      synthetic-lethal partner targeting). NOT a killer on its own — interpretation
      requires the dependency cards as orthogonal evidence.
      MAGNITUDE CAVEAT (known, pre-recalibration): the deletion score counts BOTH
      homozygous/deep loss (relative CN < 0.5, the canonical biallelic LoF) AND
      hemizygous/shallow loss (0.5-0.92, one-copy — often arm-level passenger). So
      recurrently_deleted spans arm-level hemizygous loss through focal homozygous
      deletion, and the class alone does NOT establish biallelic LoF. On the
      COADREAD panel, 6 of 7 recurrently_deleted TSGs (SMAD4/APC/PTEN/TP53/RB1/
      STK11) have deep-del fraction < 0.20 — i.e. the call rests on shallow loss;
      only CDKN2A is genuinely deep. Read the biallelic signal from
      cn_homozygous_deletion_recurrent / the deep-del fraction, and the focal-vs-arm
      signal from the ADDITIVE patient_focal_cn_class (GISTIC), not from this class.
      Note the deletion band (down to 0.92) is more permissive than the
      amplification band (>1.5) — see cn-recurrently-amplified-supportive.

  - rule_id: cn-mixed-neutral
    when:
      card_id: copy-number-distribution
      field: copy_number_class
      equals: mixed
    signals:
      small_molecule: neutral
      degrader: neutral
    rationale: |
      Both amp and del are recurrent in different lineages (balanced ratio). The
      CN axis is complex but not unidirectional; treat as neutral signal pending
      lineage-specific context from synthesis layer.

  - rule_id: cn-broadly-neutral-neutral
    when:
      card_id: copy-number-distribution
      field: copy_number_class
      equals: broadly_neutral
    signals:
      small_molecule: neutral
      degrader: neutral
    rationale: |
      No recurrent CN events — the CN axis is NOT a driver for this target.
      This is the EXPECTED outcome for mutation-driven oncogenes (KRAS, BRAF,
      EGFR) and is informative evidence ("CN isn't where the action is here").
      NOT a killer; other evidence threads (dependency, mutation, expression)
      carry the therapeutic-window story.

  - rule_id: cn-data-unavailable-insufficient
    when:
      card_id: copy-number-distribution
      field: copy_number_class
      equals: data_unavailable
    signals:
      small_molecule: insufficient
      degrader: insufficient
    rationale: |
      CN data unreachable, OR the target gene is absent from both the WES and WGS
      panels. Coverage gap; not used as opposing evidence. Other evidence threads
      remain the basis for the call.

  # ---- PATIENT-tumour FOCAL CN (2026-08-06) — the cell-line-OR-patient CONSENSUS ----
  # These fire on patient_focal_cn_class (TCGA GISTIC, per-indication, HIGH-LEVEL +2 amp / -2 homdel
  # only — NOT arm-level any-gain). They mirror the cell-line cn-recurrently-{amplified,deleted}
  # rules' SIGNALS, and the genomic_alteration resolver treats them EQUIVALENTLY (cell-line OR patient
  # focal → the same CN-driver rung). Strictly ADDITIVE: rescues a false-negative like ERBB2/BRCA
  # (cell-line-neutral but patient-focal-amplified) without weakening any existing cell-line call.
  # The FOCAL gate (patient_focal_cn_class, not patient_copy_number_class) keeps arm-level noise out.
  - rule_id: cn-patient-focal-amplified-supportive
    when:
      card_id: copy-number-distribution
      field: patient_focal_cn_class
      equals: recurrent_focal_amplification
    signals:
      small_molecule: supportive
      degrader: supportive
    rationale: |
      Recurrent FOCAL high-level amplification (GISTIC +2) across the indication's PATIENT tumours
      (tcga-patient-cn-per-gene-v1). The patient-cohort complement to cn-recurrently-amplified-supportive
      — it recovers amplification-driven targets the DepMap cell-line panel misses (e.g. ERBB2 in breast,
      where few HER2+ lines are in culture). Focal +2 only, so arm-level gain does not fire this.

  - rule_id: cn-patient-focal-deleted-supportive
    when:
      card_id: copy-number-distribution
      field: patient_focal_cn_class
      equals: recurrent_focal_deletion
    signals:
      small_molecule: supportive
      degrader: supportive
    rationale: |
      Recurrent FOCAL homozygous deletion (GISTIC -2) across the indication's PATIENT tumours — the
      canonical tumour-suppressor loss-of-function event, complementing cn-recurrently-deleted-supportive
      with patient-cohort evidence the cell-line panel may miss. Homdel -2 only (not shallow/arm-level loss).

  # ============================================================================
  # E4 — Mutation-type counts (Card E4: mutation-type-counts)
  # ============================================================================
  # DESIGN: classification is descriptive — describes the variant-class profile of
  # the gene across DepMap cell lines. Oncogene-pattern (missense_dominant) and
  # tumor-suppressor-pattern (lof_dominant) both can be supportive for the right
  # modality. No rule emits a killer signal — mutation-type alone shouldn't kill a
  # program; coverage / dependency / clinical-precedent carry that logic.

  - rule_id: mut-missense-dominant-supportive
    when:
      card_id: mutation-type-counts
      field: mutation_landscape_class
      equals: missense_dominant
    signals:
      small_molecule: supportive
      degrader: supportive
    rationale: |
      Missense-dominant variant profile (≥70% missense among coding variants) is
      the canonical oncogene signature. Activating hotspot mutations support both
      small-molecule (inhibitor of the mutant protein, e.g. KRAS-G12C inhibitors)
      and degrader strategies (degrade the oncogenic protein).

  - rule_id: mut-lof-dominant-supportive
    when:
      card_id: mutation-type-counts
      field: mutation_landscape_class
      equals: lof_dominant
    signals:
      small_molecule: supportive
      degrader: supportive
    rationale: |
      LOF-dominant variant profile (≥50% nonsense + frameshift + splice) is the
      canonical tumor-suppressor signature. The target itself is being lost — so
      direct inhibition is NOT the strategy. Supportive for SYNTHETIC-LETHAL
      partner-targeting strategies (PARP for BRCA-LOF, MAT2A for MTAP-LOF, etc.)
      where the framework subsequently asks 'what depends on this LOF context?'.

  - rule_id: mut-mixed-neutral
    when:
      card_id: mutation-type-counts
      field: mutation_landscape_class
      equals: mixed
    signals:
      small_molecule: neutral
      degrader: neutral
    rationale: |
      Neither missense nor LOF dominates (dual-role gene, e.g. TP53). The
      mutation profile alone doesn't drive a directional therapeutic call;
      synthesis layer should consult the dependency cards + clinical-precedent.

  - rule_id: mut-no-mutations-neutral
    when:
      card_id: mutation-type-counts
      field: mutation_landscape_class
      equals: no_mutations
    signals:
      small_molecule: neutral
      degrader: neutral
    rationale: |
      Fewer than 5 cell lines mutated — gene is rarely mutated in the DepMap
      panel. NOT a killer (rare-mutation oncogenes exist, e.g. RIT1 in NSCLC).
      Other evidence threads (dependency, expression, copy number) carry the
      call; this card adds no signal.

  - rule_id: mut-data-unavailable-insufficient
    when:
      card_id: mutation-type-counts
      field: mutation_landscape_class
      equals: data_unavailable
    signals:
      small_molecule: insufficient
      degrader: insufficient
    rationale: |
      MAF unreachable or target absent. Coverage gap; not used as opposing evidence.

  # ============================================================================
  # ALTERATION ROLE (typed driver classification; OncoKB × IntOGen) — 2026-07-22
  # ============================================================================
  # The FUNCTIONAL-ROLE layer on the descriptive genomic cards. DIRECTIONAL signals (unlike the
  # broadly-supportive mut-*/cn-* rules) because GoF vs LoF have OPPOSITE implications for direct-
  # inhibition modalities: an activating driver (GoF) is the classic SM-inhibitor/degrader target;
  # a loss-of-function driver (LoF/tumor-suppressor) CANNOT be drugged by direct inhibition — it
  # routes to synthetic-lethality / the partner axis. ADDITIVE (signal + rationale only; the genomic
  # skill's inline _verdict is untouched → verdict byte-stable). Wiring alteration_role INTO the
  # verdict (resolver-conversion) is a separate, golden-tested slice.
  - rule_id: alteration-role-gof-driver-supportive
    when:
      card_id: alteration-role
      field: alteration_role
      equals: direct_driver_gof
    signals:
      small_molecule: supportive
      degrader: supportive
    rationale: |
      Target is a direct ACTIVATING (gain-of-function) cancer driver in this indication (OncoKB
      ONCOGENE and/or IntOGen Act, indication-scoped where available). The classic small-molecule-
      inhibitor / degrader target — block the gained function. Supportive for both direct-inhibition
      modalities. The strongest driver-rationale the genomic layer can give for SM/degrader.

  - rule_id: alteration-role-lof-driver-neutral
    when:
      card_id: alteration-role
      field: alteration_role
      equals: direct_driver_lof
    signals:
      small_molecule: neutral
      degrader: neutral
    rationale: |
      Target is a direct LOSS-OF-FUNCTION cancer driver (tumor suppressor; OncoKB TSG and/or IntOGen
      LoF). NEUTRAL for direct-inhibition modalities, NOT supportive: you cannot drug a LOST function
      by inhibition or degradation — a bona-fide TSG driver is the HARDEST case for SM/degrader and
      routes instead to the synthetic-lethality / partner axis (see synthetic-lethal-partners). Not
      opposing either — the target is a real driver, just not a direct-inhibition one. The SL redirect
      is where a LoF driver's therapeutic hypothesis lives.

  - rule_id: alteration-role-predictive-biomarker-neutral
    when:
      card_id: alteration-role
      field: alteration_role
      equals: predictive_biomarker
    signals:
      small_molecule: neutral
      degrader: neutral
    rationale: |
      Target's driver role is AMBIGUOUS / bidirectional (OncoKB ONCOGENE_AND_TSG, or an OncoKB↔IntOGen
      direction conflict). Actionable as a patient-selection / predictive marker but the GoF/LoF
      direction — hence the direct-inhibition rationale — is unresolved. Neutral for SM/degrader;
      feeds the biomarker facet (patient stratification), not a direct-modality call.

  - rule_id: alteration-role-passenger-neutral
    when:
      card_id: alteration-role
      field: alteration_role
      equals: passenger
    signals:
      small_molecule: neutral
      degrader: neutral
    rationale: |
      No driver role for this target in the curated + statistical sources (OncoKB NEITHER/INSUFFICIENT
      and no significant IntOGen call). Alterations here are likely passengers — no genomic-driver
      rationale for the target. Neutral (informational: the genomic axis is not a differentiator),
      NOT opposing — absence of a driver call is not evidence against the target on other axes.

  - rule_id: alteration-role-data-unavailable-insufficient
    when:
      card_id: alteration-role
      field: alteration_role
      equals: data_unavailable
    signals:
      small_molecule: insufficient
      degrader: insufficient
    rationale: |
      Target absent from both driver-annotation sources (OncoKB gene-role list + IntOGen driver
      compendium). Coverage gap; not used as opposing evidence.

  # ============================================================================
  # FUNCTIONAL GENE STATE (M6; harmonized two-hit / biallelic inactivation) — 2026-07-22
  # ============================================================================
  # The ALLELE-COUNT layer (orthogonal to alteration_role's DIRECTION): how COMPLETE is the
  # inactivation? A biallelic-genetic (two-hit) call is the corroborating evidence that a
  # LOSS-OF-FUNCTION event is real + complete — it strengthens the tumor-suppressor / synthetic-
  # lethality hypothesis, which routes to the SL/partner axis (like alteration-role-lof: NEUTRAL for
  # direct inhibition — you cannot drug a lost function by inhibition/degradation). A predominantly
  # MONOALLELIC pattern on a suspected TSG is a caution (one allele intact → the two-hit LoF driver
  # hypothesis is weaker). ADDITIVE (signal + rationale only; fires NO resolver rung → the genomic
  # verdict spine is byte-stable). Keyed on the target-level functional_state_class headline; the
  # per-arm state distributions (patient vs model) inform the rationale, not a separate rung.
  - rule_id: functional-gene-state-recurrent-biallelic-neutral
    when:
      card_id: functional-gene-state
      field: functional_state_class
      equals: recurrent_biallelic_inactivation
    signals:
      small_molecule: neutral
      degrader: neutral
    rationale: |
      Target is RECURRENTLY BIALLELICALLY INACTIVATED (completed two-hit: mutation + allele-specific
      copy loss / LOH, or homozygous deletion) across a meaningful fraction of samples. This is the
      strongest genomic evidence for a genuine LOSS-OF-FUNCTION / tumor-suppressor role — the gene is
      not just mutated but functionally KNOCKED OUT. NEUTRAL for direct-inhibition modalities (you
      cannot inhibit or degrade a lost function), NOT supportive: a biallelically-inactivated TSG is
      the classic case that routes to the SYNTHETIC-LETHALITY / partner axis (see
      synthetic-lethal-partners) rather than a direct SM/degrader hypothesis. Corroborates
      alteration-role-lof-driver-neutral when both fire (role says LoF-driver, state says the loss is
      complete) — the two-hit completion is the allele-count evidence the role call cannot give.

  - rule_id: functional-gene-state-sporadic-biallelic-neutral
    when:
      card_id: functional-gene-state
      field: functional_state_class
      equals: sporadic_biallelic_inactivation
    signals:
      small_molecule: neutral
      degrader: neutral
    rationale: |
      Biallelic inactivation is PRESENT but SPORADIC (below the recurrence threshold). Some samples
      show a completed two-hit event, but it is not a dominant recurrent pattern — a weaker
      loss-of-function signal than recurrent biallelic inactivation. Neutral for direct-inhibition
      modalities; informative for the SL/partner axis in the biallelic-inactivated subset, but the
      low recurrence tempers a population-wide tumor-suppressor hypothesis.

  - rule_id: functional-gene-state-predominantly-monoallelic-neutral
    when:
      card_id: functional-gene-state
      field: functional_state_class
      equals: predominantly_monoallelic
    signals:
      small_molecule: neutral
      degrader: neutral
    rationale: |
      Target is altered but PREDOMINANTLY MONOALLELIC — one allele is hit while the other remains
      intact, with little completed biallelic inactivation. For a suspected tumor suppressor this is a
      CAUTION: a retained wild-type allele argues against a complete loss-of-function two-hit driver
      role (haploinsufficiency remains possible but is a weaker hypothesis). For an ACTIVATING
      oncogene this is the EXPECTED pattern (a single activating hotspot with a retained wild-type
      allele — e.g. KRAS), so read this state alongside alteration-role: monoallelic + GoF-driver is
      coherent (activated by one hit), whereas monoallelic + suspected-LoF weakens the driver call.
      Neutral for direct-modality signals; a context flag for the driver interpretation.

  - rule_id: functional-gene-state-rarely-altered-neutral
    when:
      card_id: functional-gene-state
      field: functional_state_class
      equals: rarely_altered
    signals:
      small_molecule: neutral
      degrader: neutral
    rationale: |
      Target is RARELY genomically altered in this context (mostly wild-type; little mutation or copy
      loss). No allele-count-based loss-of-function rationale here. Neutral (informational: the
      allele-count axis is not a differentiator for this target), NOT opposing — a target can still be
      a dependency or a surface antigen without recurrent genomic inactivation.

  - rule_id: functional-gene-state-data-unavailable-insufficient
    when:
      card_id: functional-gene-state
      field: functional_state_class
      equals: data_unavailable
    signals:
      small_molecule: insufficient
      degrader: insufficient
    rationale: |
      Neither the patient (MC3 + PanCanAtlas ABSOLUTE) nor the model (DepMap) arm produced a state
      distribution for this target. Coverage gap; not used as opposing evidence.

  # ============================================================================
  # Expression — tumor vs adjacent (Card v2.0.0, pure-data 2026-07-01)
  # ============================================================================
  # Degrader-specific: degraders require demonstrable protein presence in the indication.
  # Card was migrated 2026-07-01 from interpretation_hints to pure-data
  # expression_call_class vocabulary. 4 rules cover the full vocabulary.

  - rule_id: expression-strong-upregulation-supportive
    when:
      card_id: tumor-rna-vs-adjacent
      field: expression_call_class
      equals: strong_upregulation
    signals:
      small_molecule: supportive
      degrader: supportive
    rationale: |
      Strong tumor-vs-adjacent upregulation (q < 0.05 AND log2_fc >= 1.5). RNA-level
      evidence that the target is elevated in tumor vs normal — supports both
      small-molecule (target is available in tumor tissue) and degrader (RNA proxy
      for protein presence). Not dominant; other cards carry the therapeutic-window
      story.

  - rule_id: expression-modest-upregulation-neutral
    when:
      card_id: tumor-rna-vs-adjacent
      field: expression_call_class
      equals: modest_upregulation
    signals:
      small_molecule: neutral
      degrader: neutral
    rationale: |
      Modest tumor-vs-adjacent upregulation (q < 0.05 AND 0.5 <= log2_fc < 1.5).
      Directionally consistent but small effect size. Neither supports nor
      opposes; other cards drive the fit determination.

  - rule_id: expression-call-not-informative-degrader-killer
    when:
      card_id: tumor-rna-vs-adjacent
      field: expression_call_class
      equals: not_informative
    signals:
      degrader: killer
    killer_message: |
      Degrader not viable — no demonstrable tumor-vs-adjacent expression differential
      in this indication. Degrader investment requires confirmed intracellular protein
      presence; RNA-level evidence is the iter-1b proxy until the proteomics card lands.
    rationale: |
      Pure-data v2 (renamed from expression-not-informative-degrader-killer 2026-07-01).
      Fires on the same semantic condition (q >= 0.05 OR log2_fc < 0.5) but now via
      the vocabulary field. Small-molecule NOT killed — SM programs can pursue
      targets without tumor-vs-adjacent differential; degraders cannot.

  - rule_id: expression-call-data-unavailable-insufficient
    when:
      card_id: tumor-rna-vs-adjacent
      field: expression_call_class
      equals: data_unavailable
    signals:
      small_molecule: insufficient
      degrader: insufficient
    rationale: |
      DGE data unreachable or target absent from the indication's DGE table. Coverage
      gap; not used as opposing evidence for either modality.

  # Down-regulation labels (2026-07-21): a significantly NEGATIVE tumor-vs-adjacent log2_fc means
  # the target is DEPLETED in tumor relative to normal — adverse for a target you want present in
  # tumor. Previously these contrasts fell to not_informative (folding down into "flat"); now
  # labelled honestly. Degrader is killed (same as not_informative: degraders need demonstrable
  # tumor protein presence, and depletion is the opposite); small-molecule is opposed (not killed —
  # SM can still engage a present-but-not-elevated target, but tumor-depletion is a genuine negative).
  - rule_id: expression-strong-downregulation-degrader-killer
    when:
      card_id: tumor-rna-vs-adjacent
      field: expression_call_class
      equals: strong_downregulation
    signals:
      small_molecule: opposing
      degrader: killer
    killer_message: |
      Degrader not viable — target is strongly DEPLETED in tumor vs adjacent normal
      (q < 0.05 AND log2_fc <= -1.5). Degrader investment requires confirmed tumor protein
      presence; strong tumor-depletion is the opposite of the required signal.
    rationale: |
      Strong tumor-vs-adjacent downregulation. RNA-level evidence the target is lower in tumor
      than normal — a genuine negative (distinct from not_informative's "flat/absent" coverage
      gap). Degrader killed; small-molecule opposed but not killed.

  - rule_id: expression-modest-downregulation-opposing
    when:
      card_id: tumor-rna-vs-adjacent
      field: expression_call_class
      equals: modest_downregulation
    signals:
      small_molecule: opposing
      degrader: opposing
    rationale: |
      Modest tumor-vs-adjacent downregulation (q < 0.05 AND -1.5 < log2_fc <= -0.5). Directionally
      adverse (target lower in tumor) but small effect size — opposing, not killing, for both
      modalities; other cards carry the therapeutic-window story.

  # ============================================================================
  # E3a — Expression distribution (Card E3a: cellline-rna-distribution)
  # ============================================================================
  # Pan-cancer cell-line TPM distribution. NOT a primary fit_level driver — the
  # rationale-for-modality questions live in tumor-vs-normal / lineage-restriction.
  # This card answers "is the target measurably expressed across cell lines?"

  - rule_id: expression-broadly-low-degrader-killer
    when:
      card_id: cellline-rna-distribution
      field: expression_class
      equals: broadly_low
    signals:
      degrader: killer
    killer_message: |
      Target is broadly NOT expressed in DepMap cell lines (<10% expressed). Degraders
      require protein presence to degrade; this is strong evidence the protein is not
      present in cellular models. Not viable for degrader.
    rationale: |
      Degrader programs need a target protein to degrade. Broadly-low expression on the
      most-comprehensive cell-line panel is strong negative evidence for that condition.
      Small-molecule signal here is neutral — the SM rationale lives in expression-tumor-
      vs-adjacent (patient-level evidence), not the DepMap cell-line panel.

  - rule_id: expression-broadly-high-supportive
    when:
      card_id: cellline-rna-distribution
      field: expression_class
      equals: broadly_high
    signals:
      small_molecule: supportive
      degrader: supportive
    rationale: |
      Target is broadly + highly expressed across DepMap cell lines. Confirms measurable
      protein expression. Supportive for both modalities; not dominant (selectivity
      questions live in lineage-restriction-evidence + tumor-vs-normal).

  - rule_id: expression-lineage-restricted-supportive
    when:
      card_id: cellline-rna-distribution
      field: expression_class
      equals: lineage_restricted
    signals:
      small_molecule: supportive
      degrader: supportive
    rationale: |
      Target shows lineage-restricted expression across DepMap (one or more lineages
      express, others don't). Therapeutic-window candidate by selectivity; the
      indication-of-interest needs to overlap an expressing lineage (synthesis-layer
      lookup over per_lineage_stats).

  - rule_id: expression-broadly-moderate-neutral
    when:
      card_id: cellline-rna-distribution
      field: expression_class
      equals: broadly_moderate
    signals:
      small_molecule: neutral
      degrader: neutral
    rationale: |
      Target expressed everywhere at moderate levels — informative that expression
      isn't a differentiator, but doesn't drive a directional call. Not a killer
      (degrader-viable target expression is present), not a supportive (no
      selectivity signal). KRAS lands here in real DepMap data — expression is
      not the biology-driver axis for many mutation-driven oncogenes.

  - rule_id: expression-data-unavailable-insufficient
    when:
      card_id: cellline-rna-distribution
      field: expression_class
      equals: data_unavailable
    signals:
      small_molecule: insufficient
      degrader: insufficient
    rationale: |
      Expression matrix unreachable or target absent. Coverage gap.

  # ============================================================================
  # TUMOR EXPRESSION DISTRIBUTION (Q1, per-sample TCGA tumor RNA) — PRESENCE signals
  # ============================================================================
  # The tumor-patient analogue of the DepMap cell-line expression-* rules above. CRUCIAL
  # DIFFERENCE: these fire on a PER-INDICATION tumor class, so — unlike the cell-line
  # broadly_low (target expressed in NO cell line → a defensible degrader killer) — a tumor
  # broadly_low is INDICATION-SCOPED: the target may be highly expressed in other indications.
  # So NO killer here; per-indication tumor absence is neutral context, never a target-wide kill
  # (same reasoning that keeps the subtype rules non-opposing). Signals feed the LLM/matrix; these
  # do NOT enter the tumor-presence rank ladder (that stays byte-stable — additive signal only).
  - rule_id: tumor-expression-broadly-high-supportive
    when:
      card_id: tumor-rna-distribution
      field: tumor_expression_class
      in: [broadly_high, broadly_detected, subset_high]
    signals:
      small_molecule: supportive
      degrader: supportive
    rationale: |
      Target RNA is present across (or in a real high subset of) this indication's tumors —
      measurable target expression in patient tumor tissue (not just cell lines). Supportive for
      small-molecule (context-of-action present) and degrader (target must be expressed to be
      degraded). subset_high additionally flags a target-high patient population for selection.
      Presence, not selectivity (that is the percentile-crossing card) — interpret alongside Q2.

  - rule_id: tumor-expression-broadly-moderate-neutral
    when:
      card_id: tumor-rna-distribution
      field: tumor_expression_class
      equals: broadly_moderate
    signals:
      small_molecule: neutral
      degrader: neutral
    rationale: |
      Target expressed at moderate levels across this indication's tumors — informative that
      expression is present but not a differentiator. Not directional.

  - rule_id: tumor-expression-broadly-low-neutral
    when:
      card_id: tumor-rna-distribution
      field: tumor_expression_class
      equals: broadly_low
    signals:
      small_molecule: neutral
      degrader: neutral
    rationale: |
      Target RNA is detectable in only a minority of this indication's tumors. NEUTRAL, NOT a
      killer: this is a PER-INDICATION tumor read — the target may be highly expressed in other
      indications, so indication-scoped low presence cannot kill a target-wide nomination. A
      degrader/SM concern only becomes decisive if presence is broadly low ACROSS indications
      (the cell-line cellline-rna-distribution card's job), not from one indication's tumors.

  - rule_id: tumor-expression-data-unavailable-insufficient
    when:
      card_id: tumor-rna-distribution
      field: tumor_expression_class
      equals: data_unavailable
    signals:
      small_molecule: insufficient
      degrader: insufficient
    rationale: |
      Target absent from the TCGA long product for this indication, or matrix unreachable. Coverage gap.

  # ============================================================================
  # SINGLE-CELL PER-COMPARTMENT TUMOR EXPRESSION (sc_rna/tumor) — PRESENCE signals
  # ============================================================================
  # The single-cell analogue of the tumor-expression-* block above, keyed on the
  # tumor-scrna-celltype-expression card's malignant-anchored sc_expression_class. Single-cell adds
  # what bulk cannot: detection at per-cell resolution + malignant-vs-microenvironment ATTRIBUTION.
  # SAME per-indication-scoping discipline as the bulk tumor-RNA rules: NO killer — a per-indication
  # single-cell read cannot kill a target-wide nomination (the target may be malignant-expressed in
  # other indications). microenvironment_dominant is NEUTRAL (present in the tumor, just not tumor-
  # cell-intrinsic — a presence-axis nuance, not an absence; the ADC/TCE modality-gate reading of
  # this signal is a deferred P4 facet). Signals feed the LLM/matrix; whether they enter the
  # tumor-presence sc_rna ladder is the skill's call (additive, verdict byte-stable for existing targets).
  - rule_id: sc-expression-malignant-broadly-detected-supportive
    when:
      card_id: tumor-scrna-celltype-expression
      field: sc_expression_class
      in: [malignant_broadly_detected, malignant_subset_detected]
    signals:
      small_molecule: supportive
      degrader: supportive
    rationale: |
      Target is detected in malignant (tumor) cells at single-cell resolution — measurable tumor-cell-
      INTRINSIC expression, the sharpest presence signal single-cell provides (bulk cannot separate
      malignant from microenvironment). Supportive for small-molecule (context-of-action present in the
      tumor cell) and degrader (target must be present in the tumor cell to be degraded).
      malignant_subset_detected additionally flags a target-high tumor-cell subpopulation for selection.

  - rule_id: sc-expression-microenvironment-dominant-neutral
    when:
      card_id: tumor-scrna-celltype-expression
      field: sc_expression_class
      equals: microenvironment_dominant
    signals:
      small_molecule: neutral
      degrader: neutral
    rationale: |
      Target is detected in the tumor SAMPLE but predominantly in the microenvironment (immune/stromal/
      endothelial), NOT in malignant cells. NEUTRAL: the target is present (a bulk-RNA presence signal
      is corroborated) but the single-cell view shows it is not tumor-cell-intrinsic — a caveat on the
      presence call, not a directional signal for an intracellular SM/degrader. (For tumor-cell-targeted
      biologics this microenvironment attribution is decision-relevant; that modality-gate reading is a
      deferred P4 facet, not an axis-1 signal here.)

  - rule_id: sc-expression-broadly-low-neutral
    when:
      card_id: tumor-scrna-celltype-expression
      field: sc_expression_class
      equals: broadly_low
    signals:
      small_molecule: neutral
      degrader: neutral
    rationale: |
      Target detected in only a minority of cells across every compartment in this indication's tumors.
      NEUTRAL, NOT a killer: this is a PER-INDICATION single-cell read — the target may be malignant-
      expressed in other indications, so indication-scoped low single-cell detection cannot kill a
      target-wide nomination (same discipline as the bulk tumor-RNA broadly-low rule).

  - rule_id: sc-expression-data-unavailable-insufficient
    when:
      card_id: tumor-scrna-celltype-expression
      field: sc_expression_class
      equals: data_unavailable
    signals:
      small_molecule: insufficient
      degrader: insufficient
    rationale: |
      No landed single-cell product for this indication, target absent from the product, OR the
      indication's atlases carry no per-cell malignant annotation to anchor the call. Coverage gap
      (a NAMED capability gap, never a measured negative).

  # ============================================================================
  # TUMOR-VS-NORMAL PERCENTILE-CROSSING (Q2, per-sample selectivity) — SELECTIVITY signals
  # ============================================================================
  # Per-sample corroboration of the aggregate tumor-vs-normal-selectivity card. Emits SM/degrader
  # supportive on real tumor-enrichment; does NOT enter the selectivity RESOLVER ladder (that stays
  # keyed to the aggregate card's classes — byte-stable), so this is additive signal/rationale that
  # reaches the LLM + matrix without changing the selectivity verdict. (Cross-routing the per-sample
  # separation into the SURFACE modality gate — the ADC antigen-selectivity argument — is master-plan
  # P4 modality-vector work, wired through adc-tce-modality-fit's fit_class, not a direct rule here.)
  - rule_id: tumor-vs-normal-crossing-strong-supportive
    when:
      card_id: tumor-vs-normal-percentile-crossing
      field: selectivity_class
      in: [strongly_tumor_enriched, enriched_subset]
    signals:
      small_molecule: supportive
      degrader: supportive
    rationale: |
      A real fraction of this indication's tumors express the target above the 95th percentile of
      matched normal tissue (per-sample, on the directly-comparable recount3 axis) — the headline
      therapeutic-window enrichment signal. strongly_tumor_enriched additionally means the tumor and
      normal distributions separate (low overlap): the clean-separation pattern surface antigens need.
      Corroborates the aggregate selectivity card at per-sample resolution.

  - rule_id: tumor-vs-normal-crossing-minimal-neutral
    when:
      card_id: tumor-vs-normal-percentile-crossing
      field: selectivity_class
      in: [minimally_enriched, not_enriched]
    signals:
      small_molecule: neutral
      degrader: neutral
    rationale: |
      Few tumors exceed the matched-normal percentile / distributions overlap heavily — no per-sample
      tumor-vs-normal enrichment. Neutral (a broadly-present but non-selective target, e.g. a
      housekeeping gene, lands here) — not opposing, since presence itself may still support an
      intracellular modality; it simply isn't a selectivity argument.

  - rule_id: tumor-vs-normal-crossing-data-unavailable-insufficient
    when:
      card_id: tumor-vs-normal-percentile-crossing
      field: selectivity_class
      equals: data_unavailable
    signals:
      small_molecule: insufficient
      degrader: insufficient
    rationale: |
      No matched GTEx normal for this indication, or target absent. Coverage gap.

  # ============================================================================
  # NORMAL-TISSUE LIABILITY (Q3, GTEx atlas) — SAFETY / therapeutic-window signals
  # ============================================================================
  # On-target-off-tumor liability from the normal-tissue atlas. critical_organ_liability is a genuine
  # safety concern for FULL-KO modalities (degrader / full-inhibition SM) — high expression in a vital
  # organ is on-target toxicity risk regardless of tumor abundance → opposing (NOT killer: it narrows
  # the window / demands a therapeutic-index argument, doesn't foreclose the target). restricted_normal
  # = favorable window → supportive. Feeds SM/degrader here (intracellular axis); the ADC/TCE
  # on-target-off-tumor read routes to the surface modality gate (P4, via HPA/surface composition).
  - rule_id: normal-liability-critical-organ-opposing
    when:
      card_id: normal-tissue-liability-gtex
      field: liability_class
      equals: critical_organ_liability
    signals:
      small_molecule: opposing
      degrader: opposing
    rationale: |
      The target is highly expressed (>= the HIGH cutoff) in a CRITICAL/vital organ in the GTEx
      normal atlas — an on-target-off-tumor liability that holds regardless of tumor abundance. Opposing
      for full-KO modalities (degrader, full-inhibition SM): the therapeutic window is narrow and a
      target-index argument is required. Opposing, NOT killer — a real (documented) therapeutic index
      or a tumor-restricted delivery modality can still rescue it; the flag demands justification.

  - rule_id: normal-liability-restricted-supportive
    when:
      card_id: normal-tissue-liability-gtex
      field: liability_class
      equals: restricted_normal
    signals:
      small_molecule: supportive
      degrader: supportive
    rationale: |
      The target is expressed in few normal tissues (breadth < ~30%) with no critical-organ liability —
      a favorable therapeutic window. Supportive for both intracellular modalities.

  - rule_id: normal-liability-broadly-expressed-neutral
    when:
      card_id: normal-tissue-liability-gtex
      field: liability_class
      in: [broadly_expressed_normal, moderate_normal_breadth]
    signals:
      small_molecule: neutral
      degrader: neutral
    rationale: |
      The target is detectable across many/most normal tissues but without a single-critical-organ
      high-liability flag. Neutral window context — broad normal presence is a housekeeping-like caution
      (narrower window) but not, by itself, an on-target-off-tumor killer.

  - rule_id: normal-liability-data-unavailable-insufficient
    when:
      card_id: normal-tissue-liability-gtex
      field: liability_class
      equals: data_unavailable
    signals:
      small_molecule: insufficient
      degrader: insufficient
    rationale: |
      Target absent from the GTEx normal atlas, or matrix unreachable. Coverage gap.

  # ============================================================================
  # RECOMMENDED MODELS (Q4, patient↔model expression correspondence) — Gate-C corroboration
  # ============================================================================
  # Q4 routes to Required (Gate C) as MODEL-BACKED-DEPENDENCY corroboration (its master-plan
  # primary consumer Patient-pop/Q10 was deleted in the #62 skill restructure; Required is the
  # live secondary home). ADDITIVE signal only — does NOT enter the dependency RESOLVER ladder
  # (that stays keyed to the actual dependency cards → verdict byte-stable). A well-modeled target
  # has cell-line models that both express it in the patient range AND depend on it: a real,
  # screenable dependency basis. NOT a killer on the downside — Q4 is expression-similarity, not
  # the dependency measurement, so absence of a good model ≠ absence of dependency.
  - rule_id: recommended-models-well-modeled-supportive
    when:
      card_id: recommended-models
      field: correspondence_class
      in: [well_modeled_in_lineage, well_modeled_off_lineage]
    signals:
      small_molecule: supportive
      degrader: supportive
    rationale: |
      DepMap has cell-line model(s) that express the target within the patient tumor range AND
      depend on it (Chronos ≤ −0.5) — a model-backed, screenable dependency basis. Supportive for
      SM/degrader (there is a system to run the screen in). well_modeled_in_lineage is stronger
      (the model is of the indication's lineage); off_lineage still corroborates the dependency
      exists in a representative model, just not lineage-matched. Corroboration, not the dependency
      verdict itself (that is the functional-requirement gate's job).

  - rule_id: recommended-models-poorly-modeled-neutral
    when:
      card_id: recommended-models
      field: correspondence_class
      equals: poorly_modeled
    signals:
      small_molecule: neutral
      degrader: neutral
    rationale: |
      No cell-line model both expresses the target in the patient range and depends on it. NEUTRAL,
      NOT opposing: Q4 is an expression-similarity correspondence, not the dependency measurement —
      lack of a representative dependent model is a screening-tractability gap (harder to model),
      not evidence the target is non-essential. The dependency verdict is set by the
      functional-requirement gate; this only notes the model panel is thin.

  - rule_id: recommended-models-data-unavailable-insufficient
    when:
      card_id: recommended-models
      field: correspondence_class
      equals: data_unavailable
    signals:
      small_molecule: insufficient
      degrader: insufficient
    rationale: |
      No patient tumor TPM for this (target, indication), or the DepMap model panel was unreachable.
      Coverage gap.

  # ============================================================================
  # expression-dependency-correlation — biomarker hypothesis
  # (v2 refactor 2026-06-30: card now pure-data; 5 vocab values, 5 rules)
  # ============================================================================

  - rule_id: expression-biomarker-supportive
    when:
      card_id: expression-dependency-correlation
      field: correlation_class
      equals: strong_negative
    signals:
      small_molecule: supportive
      degrader: supportive
    dominant: true
    rationale: |
      Strong negative expression-dependency correlation (r ≤ -0.4, p ≤ 0.01) =
      high-expressers are strongly dependent. Biomarker-stratification candidate;
      supports patient-selection strategy. Dominant — when this fires it should
      drive fit_level upward absent contradicting killer signals.

  - rule_id: expression-biomarker-moderate-supportive
    when:
      card_id: expression-dependency-correlation
      field: correlation_class
      equals: moderate_negative
    signals:
      small_molecule: supportive
      degrader: supportive
    rationale: |
      Moderate negative correlation (-0.4 < r ≤ -0.2, p ≤ 0.01). Signal is directional
      but smaller-effect — supports biomarker hypothesis without being dominant.

  - rule_id: expression-correlation-weak-neutral
    when:
      card_id: expression-dependency-correlation
      field: correlation_class
      equals: weak_negative
    signals:
      small_molecule: neutral
      degrader: neutral
    rationale: |
      Weak negative correlation (-0.2 < r ≤ -0.1). Directionally consistent but not
      conclusive; treated as neutral signal until orthogonal evidence accumulates.

  - rule_id: expression-no-correlation-neutral
    when:
      card_id: expression-dependency-correlation
      field: correlation_class
      equals: no_correlation
    signals:
      small_molecule: neutral
      degrader: neutral
    rationale: |
      Expression and dependency are uncorrelated. Not a killer (target could still
      be a fit via other evidence threads — dependency, lineage selectivity, mutation
      stratification); just no biomarker hypothesis from this axis.

  - rule_id: expression-positive-anomaly-opposing
    when:
      card_id: expression-dependency-correlation
      field: correlation_class
      equals: positive_anomaly
    signals:
      small_molecule: opposing
      degrader: opposing
    rationale: |
      Positive correlation (r > 0.2): high expression associates with REDUCED
      dependency. Anomalous — may indicate paralog compensation (expressing the
      target signals an alternative pathway is active) or measurement artifact.
      Treated as opposing evidence; pair with paralog analysis before discounting.

  # ============================================================================
  # ABUNDANCE-DEPENDENCY (Q7, PROTEIN arm of expression-as-biomarker-of-dependency) — 2026-07-22
  # ============================================================================
  # The PROTEIN sibling of the expression-dependency-correlation (RNA arm) rules above. Same
  # biomarker-hypothesis framing on Gygi-MS protein instead of mRNA. Signals are deliberately MODEST
  # (NOT dominant, unlike the RNA arm) — the protein arm CORROBORATES the biomarker hypothesis; the
  # two arms' comparison (RNA vs protein) is resolved in the biomarker-facet synthesis (preferred_assay),
  # not by two cards both claiming dominance. ADDITIVE render facet — feeds NO resolver ladder (verdict
  # byte-stable). Biology axis only (no modality-gate facet).
  - rule_id: abundance-dependency-supportive
    when:
      card_id: abundance-dependency
      field: abundance_dependency_class
      equals: protein_predicts_dependency
    signals:
      small_molecule: supportive
      degrader: supportive
    rationale: |
      Protein abundance predicts dependency (strong negative Pearson r, significant): high-protein
      cell lines are strongly dependent. A PROTEIN-level biomarker-stratification candidate — often
      the sharper arm since dependency is a protein-level phenomenon. Supportive (not dominant): it
      corroborates the biomarker hypothesis and, when it BEATS the RNA arm, points preferred_assay to
      protein in synthesis.

  - rule_id: abundance-dependency-weak-neutral
    when:
      card_id: abundance-dependency
      field: abundance_dependency_class
      equals: weak_protein_dependency_link
    signals:
      small_molecule: neutral
      degrader: neutral
    rationale: |
      Weak/moderate protein-abundance→dependency link (directional but not conclusive, or
      insignificant). Neutral — for oncogene-addiction targets (e.g. KRAS) dependency is driven by
      MUTATION status not abundance, so a weak abundance link is EXPECTED and correctly redirects the
      biomarker to the genomic stratifier (mutation-stratified-dependency), not opposing evidence.

  - rule_id: abundance-dependency-none-neutral
    when:
      card_id: abundance-dependency
      field: abundance_dependency_class
      equals: no_protein_dependency_link
    signals:
      small_molecule: neutral
      degrader: neutral
    rationale: |
      Protein abundance and dependency are uncorrelated. Not a killer (the target can still be a
      dependency via other threads) — just no protein-abundance biomarker hypothesis from this axis.

  - rule_id: abundance-dependency-insufficient
    when:
      card_id: abundance-dependency
      field: abundance_dependency_class
      equals: insufficient_paired_models
    signals:
      small_molecule: insufficient
      degrader: insufficient
    rationale: |
      Fewer than the minimum cell lines have BOTH Gygi-MS protein and Chronos for this target — the
      protein-arm correlation is underpowered. Coverage gap, not opposing evidence.

  - rule_id: abundance-dependency-data-unavailable-insufficient
    when:
      card_id: abundance-dependency
      field: abundance_dependency_class
      equals: data_unavailable
    signals:
      small_molecule: insufficient
      degrader: insufficient
    rationale: |
      Target absent from the Gygi MS panel or no Chronos — no protein-arm data. Coverage gap (panel
      coverage, not biology); not used as opposing evidence.

  # ============================================================================
  # MUTATION × DRUG-RESPONSE (Thread 4, 2026-08-09) — the PHARMACOLOGICAL biomarker
  # ============================================================================
  # Genotype × PRISM drug-response (Log2AUC) — "are mutant lines more SENSITIVE to a DRUG that targets
  # this gene?" — the pharmacological sibling of mutation-stratified-dependency (which is CRISPR-KO
  # dependency). Signals are small_molecule-only (a drug-response biomarker is an SM patient-selection
  # signal). VERDICT-DRIVING on the GENOMIC gate (2026-08-15 doc-parity fix — the "distinct verdict
  # rung" the old comment deferred HAS since landed): the STRONG rule below fires the genomic_alteration
  # resolver's drug_response_biomarker rung (genomic_alteration.resolver.yaml §2d-drug); the moderate
  # class stays signal-only. It remains OUT of the DEPENDENCY spine (that stays byte-stable) —
  # deliberately NOT fired as biomarker_stratified_dependency: drug-sensitivity != KO-dependency (a KO
  # removes noncatalytic scaffolding a small molecule leaves intact), so a DISTINCT verdict
  # (drug_response_biomarker, never conflated with biomarker_stratified_dependency) is emitted instead.
  - rule_id: mutation-drug-response-strongly-sensitive-supportive
    when:
      card_id: mutation-drug-response
      field: drug_response_stratification_class
      equals: mutant_strongly_drug_sensitive
    signals:
      small_molecule: supportive
    rationale: |
      Cell lines carrying an alteration in the target are strongly MORE SENSITIVE to a drug that
      targets the gene (PRISM Log2AUC, mutant median >= 0.20 below WT, significant). A genotype→
      drug-response biomarker hypothesis — the strongest, most clinically-shaped biomarker signal in
      the framework because it reflects an actual pharmacologic agent (e.g. BRAF-mut → vemurafenib).
      Supportive, not dominant: cell-panel PRISM is necessary-not-sufficient for a clinical biomarker.

  - rule_id: mutation-drug-response-moderately-sensitive-supportive
    when:
      card_id: mutation-drug-response
      field: drug_response_stratification_class
      equals: mutant_moderately_drug_sensitive
    signals:
      small_molecule: supportive
    rationale: |
      Mutant lines moderately more drug-sensitive (significant, smaller effect). A weaker genotype→
      drug-response biomarker hypothesis; corroborates SM patient-selection.

  - rule_id: mutation-drug-response-resistant-neutral
    when:
      card_id: mutation-drug-response
      field: drug_response_stratification_class
      equals: mutant_drug_resistant
    signals:
      small_molecule: neutral
    rationale: |
      Reverse direction: mutant lines are more RESISTANT (WT more sensitive) to the on-target drug — a
      candidate RESISTANCE biomarker. Neutral to the SM biology axis (does not kill the target; flags a
      patient-selection caveat that the altered subset may not respond). Verdict-inert.

  - rule_id: mutation-drug-response-not-stratified-neutral
    when:
      card_id: mutation-drug-response
      field: drug_response_stratification_class
      equals: not_drug_response_stratified
    signals:
      small_molecule: neutral
    rationale: |
      No significant mutant-vs-WT drug-response difference in the PRISM panel. Genotype does not predict
      on-target drug sensitivity here (e.g. EGFR in the cell panel) — neutral, not opposing.

  - rule_id: mutation-drug-response-no-compound-insufficient
    when:
      card_id: mutation-drug-response
      field: drug_response_stratification_class
      equals: no_on_target_compound
    signals:
      small_molecule: insufficient
    rationale: |
      No PRISM compound targets this gene — the drug-response biomarker cannot be evaluated. An honest
      coverage gap (no drug in the panel), not opposing evidence.

  - rule_id: mutation-drug-response-insufficient
    when:
      card_id: mutation-drug-response
      field: drug_response_stratification_class
      equals: insufficient_mutant_or_drug_data
    signals:
      small_molecule: insufficient
    rationale: |
      Fewer than the minimum altered (or WT) lines have a measured on-target Log2AUC — the
      stratification is underpowered. Coverage gap, not opposing evidence.

  - rule_id: mutation-drug-response-data-unavailable-insufficient
    when:
      card_id: mutation-drug-response
      field: drug_response_stratification_class
      equals: data_unavailable
    signals:
      small_molecule: insufficient
    rationale: |
      No PRISM or mutation data for this target — no drug-response-biomarker signal. Coverage gap.

  - rule_id: expression-correlation-data-unavailable-insufficient
    when:
      card_id: expression-dependency-correlation
      field: correlation_class
      equals: data_unavailable
    signals:
      small_molecule: insufficient
      degrader: insufficient
    rationale: |
      Expression or Chronos data unreachable, OR insufficient n cell lines.
      Coverage gap; not used as opposing evidence.

  # ============================================================================
  # E5 — Dependency predictability (Card: dependency-predictability)
  # ============================================================================
  # Asks how well STANDARD features (own omics + lineage) explain Chronos. The
  # descriptive class drives a biomarker-vs-context call:
  #   own_omics_driven → biomarker hypothesis supported (target-own omic
  #                       feature dominates → patient-selection axis exists)
  #   lineage_driven   → context-determined (tissue matters; no extra
  #                       biomarker beyond indication)
  # Two rules in v1 (minimal scope). weakly_predictable + unpredictable surface
  # as card-level caveats, not Tier-2 signals — low R² doesn't kill a target,
  # it just means the standard feature set doesn't explain it.

  - rule_id: predictability-biomarker-hypothesis-supportive
    when:
      card_id: dependency-predictability
      field: predictability_class
      equals: own_omics_driven
    signals:
      small_molecule: supportive
      degrader: supportive
    rationale: |
      Dependency is biomarker-anchored: a target-own omic feature (expression,
      copy number, or mutation status) dominates a RandomForest model with
      out-of-fold R² ≥ 0.5. This is the canonical patient-selection signal —
      the standard omics axes carry enough information to predict who responds.
      Supports both small-molecule and degrader programs by giving the
      development plan a defensible biomarker hypothesis at IND entry.

  - rule_id: predictability-context-determined-neutral
    when:
      card_id: dependency-predictability
      field: predictability_class
      equals: context_or_driver_dependent
    signals:
      small_molecule: neutral
      degrader: neutral
    rationale: |
      Model has strong signal (r²_rf CI lower bound ≥ 0.35) but the top feature
      is lineage / arm-level CN / co-driver flag — NOT the target's own omic
      state. Dependency is context/driver-determined; the standard target-own
      axes don't give a patient-selection biomarker beyond indication + co-
      driver context. Doesn't kill the target (many valid programs sit here:
      KRAS in pancreas, ESR1 in breast, WRN in MSI) but flags that the
      biomarker arm of the development plan needs to combine indication +
      co-driver readouts rather than a single target-anchored assay.

  - rule_id: predictability-weakly-predictable-neutral
    when:
      card_id: dependency-predictability
      field: predictability_class
      equals: weakly_predictable
    signals:
      small_molecule: neutral
      degrader: neutral
    rationale: |
      r² above DepMap's high-confidence floor (≥ 0.16) but the 95% CI lower
      bound is < 0.35 — meaningful signal but wide uncertainty. Doesn't kill
      the target and doesn't cleanly support a biomarker hypothesis; the
      standard features give a partial explanation but the class call is not
      yet defensible. Use as a caveat, not a discriminant.

  - rule_id: predictability-unpredictable-neutral
    when:
      card_id: dependency-predictability
      field: predictability_class
      equals: unpredictable
    signals:
      small_molecule: neutral
      degrader: neutral
    rationale: |
      r² < DepMap's high-confidence floor (0.16) — standard omics + lineage
      + arm-level CN + driver flags do NOT explain Chronos for this target.
      NOT a kill — the dependency may still be real (verify via E1/E2). Flags
      a novel-biology candidate where the biomarker hypothesis needs a feature
      class not in the standard predictability panel (e.g. epigenetic state,
      protein-level signature, pathway-partner dependency structure).

  - rule_id: predictability-data-unavailable-insufficient
    when:
      card_id: dependency-predictability
      field: predictability_class
      equals: data_unavailable
    signals:
      small_molecule: insufficient
      degrader: insufficient
    rationale: |
      Target absent from v1 medium-scope precompute (~500 dependency-mappable
      genes). Coverage gap; not used as opposing evidence. v2 (full genome) will
      backfill this set.

  # ============================================================================
  # Generic insufficient-evidence handling (replaces NOT_INFORMATIVE_CALLS)
  # ============================================================================
  # Cards that emit data_unavailable / no_data_for_target descriptive labels signal
  # 'insufficient' for all modalities — counted toward coverage gap, not held against fit.

  - rule_id: data-unavailable-insufficient
    when:
      card_id: pan-cancer-crispr-dependency-distribution
      field: dependency_class
      equals: data_unavailable
    signals:
      small_molecule: insufficient
      degrader: insufficient
    rationale: |
      Card's underlying data was unreachable (_live_read_error) or the target was absent
      from the substrate. Coverage gap; not used as opposing evidence.

  # ============================================================================
  # E6 — PRISM compound activity (Card prism-compound-activity)
  # ============================================================================
  # Interpretation surface locked 2026-07-01 (plan Q4):
  #   - clinically_active    → SUPPORTIVE for small_molecule; NEUTRAL for degrader
  #   - tool_compound_only   → weak-supportive for small_molecule (druggability signal only)
  #   - weakly_active        → weak-supportive for small_molecule (activity without clinical anchor)
  #   - no_compounds_found   → NEUTRAL (first-in-class opportunity, NOT a killer)
  #   - data_unavailable     → insufficient (parquet unreadable / release_pin unknown)

  - rule_id: prism-clinically-active-supportive-sm
    when:
      card_id: prism-compound-activity
      field: prism_activity_class
      equals: clinically_active
    signals:
      small_molecule: supportive
      degrader: neutral
    rationale: |
      An OncologyReference-prioritized compound (proxy for phase_1+ clinical anchor) is
      annotated as targeting this gene. Compound existence + clinical presence is a real
      small-molecule tractability signal — chemistry-matter risk is de-risked. Degrader
      is scored NEUTRAL rather than supportive: small-molecule inhibitor tractability
      does not imply degrader (E3 ligase recruitment) feasibility; those are independent
      chemistry problems.

  - rule_id: prism-clinical-precedent-only-weak-supportive-sm
    when:
      card_id: prism-compound-activity
      field: prism_activity_class
      equals: clinical_precedent_only
    signals:
      small_molecule: supportive
      degrader: neutral
    rationale: |
      T1.2 (2026-08-09): a phase_1+/approved compound is ANNOTATED as targeting this gene, but the
      PRISM cell panel shows NO measured activity (median Log2AUC absent or not below the clinically-
      active threshold). Weak-supportive — chemistry-matter exists and a clinical anchor is claimed,
      so the target is chemically approachable; but WITHOUT measured cell-panel killing (and with no
      on-target concordance check here) this is honestly weaker than a measured clinically_active hit.
      The verdict layer maps it to `clinical_precedent_only`, below chemically_active. Degrader
      NEUTRAL (SM inhibitor precedent does not imply degrader feasibility).

  - rule_id: prism-tool-compound-only-weak-supportive-sm
    when:
      card_id: prism-compound-activity
      field: prism_activity_class
      equals: tool_compound_only
    signals:
      small_molecule: supportive
      degrader: neutral
    rationale: |
      Tool / preclinical compounds exist but no clinical anchor. This validates the target
      is chemically approachable at bench scale but leaves clinical translatability
      unresolved. Weak-supportive: better than first-in-class-chemistry risk, worse than
      an existing clinical scaffold.

  - rule_id: prism-weakly-active-weak-supportive-sm
    when:
      card_id: prism-compound-activity
      field: prism_activity_class
      equals: weakly_active
    signals:
      small_molecule: supportive
      degrader: neutral
    rationale: |
      Tool compounds show measurable pan-cancer dose-response potency (median Log2AUC < -0.15) but
      no clinical anchor. Activity signal is present but interpretation is confounded by
      the tool-vs-clinical gap; treat as chemistry-tractability weak-positive.

  - rule_id: prism-no-compounds-found-neutral
    when:
      card_id: prism-compound-activity
      field: prism_activity_class
      equals: no_compounds_found
    signals:
      small_molecule: neutral
      degrader: neutral
    rationale: |
      No PRISM-annotated compound targets this gene across either OncologyReference 25Q4
      or Repurposing 24Q2. Locked 2026-07-01: NEUTRAL, NOT killer. Absence of a screened
      compound is a first-in-class OPPORTUNITY — targets like this are where discovery
      programs are meant to originate. Killer-classification would conflate "not-yet-drugged"
      with "undruggable" and mis-eliminate legitimate first-in-class targets.

  - rule_id: prism-data-unavailable-insufficient
    when:
      card_id: prism-compound-activity
      field: prism_activity_class
      equals: data_unavailable
    signals:
      small_molecule: insufficient
      degrader: insufficient
    rationale: |
      Derived aggregate parquet unreadable (S3 error, unknown release_pin, or parquet
      corruption). Coverage gap; not used as opposing evidence. Distinct from
      no_compounds_found — a real class call.

  # ---- v2 additions (2026-07-01, PRISM lineage stratification build) ----

  - rule_id: prism-lineage-selective-supportive
    when:
      card_id: prism-compound-activity
      field: prism_lineage_selectivity
      equals: lineage_selective
    signals:
      small_molecule: supportive
      degrader: neutral
    rationale: |
      Activity is lineage-selective (≥1 lineage active with median Log2AUC < -0.15 AND ≥1
      inactive lineage). This is the biomarker-cohort shape: SM programs get lineage-
      restricted patient selection (e.g. KRAS-G12C inhibitors in Bowel/Pancreas/Lung).
      Reinforces supportive signal from prism_activity_class = clinically_active;
      distinguishes oncogene-addiction drugs from broadly cytotoxic compounds. Degrader
      is scored neutral — small-molecule tractability across lineages does not imply
      degrader feasibility (independent chemistry problem).

  - rule_id: prism-broadly-active-caution
    when:
      card_id: prism-compound-activity
      field: prism_lineage_selectivity
      equals: broadly_active
    signals:
      small_molecule: neutral
      degrader: neutral
    rationale: |
      Activity is broad across evaluable lineages with no clear inactive contrast.
      Pan-cancer viability signal without lineage selectivity often indicates
      non-specific cytotoxicity OR pan-essential mechanism — either way it weakens
      the target-specificity claim for a compound. Neutral rather than supportive:
      cannot distinguish target-relevant kill from off-target background at this
      resolution. Pair with E1 (dependency-lineage-selectivity) and E2 (mutation-
      stratified-dependency) for the target-specificity read.

  - rule_id: prism-no-lineage-signal-neutral
    when:
      card_id: prism-compound-activity
      field: prism_lineage_selectivity
      equals: no_lineage_signal
    signals:
      small_molecule: neutral
      degrader: neutral
    rationale: |
      Too few lineages show activity above the threshold to call selectivity, AND
      the pan-cancer signal is flat. Not a killer — could be a genuine "no activity"
      case, but could also be a target-engagement failure of the annotated compounds
      (see caveat on annotation-vs-engagement). Neutral: no signal to reinforce or
      oppose the activity_class call.

  - rule_id: prism-lineage-selectivity-data-unavailable-insufficient
    when:
      card_id: prism-compound-activity
      field: prism_lineage_selectivity
      equals: data_unavailable
    signals:
      small_molecule: insufficient
      degrader: insufficient
    rationale: |
      Per-lineage aggregation unavailable — either Model.csv was unreadable in the
      precompute, or no lineage met the min_cell_lines_in_lineage threshold for this
      gene. Coverage gap; distinct from a real 'no_lineage_signal' call.

  # ============================================================================
  # E7 — CRISPR × RNAi × PRISM triangulated concordance (Card prism-crispr-concordance)
  # ============================================================================
  # Chemical-genetic target engagement. Triangulated concordance (both CRISPR AND
  # RNAi correlate with PRISM compound kill patterns) is the framework's
  # highest-confidence "compound is on-target" call.

  - rule_id: e7-triangulated-target-engaged-supportive
    when:
      card_id: prism-crispr-concordance
      field: crispr_prism_concordance_class
      equals: triangulated_target_engaged
    signals:
      small_molecule: supportive
      degrader: supportive
    dominant: true
    rationale: |
      Both CRISPR-KO Chronos AND RNAi-KD DEMETER2 dependency scores correlate
      positively with PRISM compound kill activity across the cell-line panel
      (best rho ≥ 0.30 in each assay). Cross-modality (chemical vs genetic)
      cross-perturbation (full-KO vs partial-KD) triangulated evidence that the
      annotated compounds engage the target on-target. Highest-confidence
      supportive signal for BOTH small_molecule (compound scaffold validated)
      AND degrader (target biology validated; degrader-scaffold to be
      developed). Marked DOMINANT — this is a dispositive target-engagement
      confirmation.

  - rule_id: e7-crispr-confirmed-supportive-sm
    when:
      card_id: prism-crispr-concordance
      field: crispr_prism_concordance_class
      equals: crispr_confirmed_engagement
    signals:
      small_molecule: supportive
      degrader: neutral
    rationale: |
      CRISPR-KO Chronos correlates with PRISM activity (rho ≥ 0.30) but RNAi-KD
      does not (< 0.30 or unavailable). Consistent with paralog-compensable
      dependencies that only full-KO reveals — RNAi's residual protein activity
      is sufficient to rescue viability. Small-molecule inhibitor (full activity
      block at active site) engages the target. Degrader is NEUTRAL: full protein
      depletion may hit the same paralog-compensable biology BUT the graded-KD
      failure suggests any residual protein may buffer degrader activity too;
      needs case-by-case evaluation.

  - rule_id: e7-rnai-confirmed-weak-supportive
    when:
      card_id: prism-crispr-concordance
      field: crispr_prism_concordance_class
      equals: rnai_confirmed_engagement
    signals:
      small_molecule: supportive
      degrader: neutral
    rationale: |
      RNAi correlates but CRISPR does not — rare pattern. May indicate CRISPR
      fitness-selection artifact (essential gene where KO cells are underrepresented
      in the panel because they die too fast) or partial-KD-mimicking mechanism.
      Supportive but with caveat; interpret alongside E1/E1b to check for CRISPR
      panel-composition issues.

  - rule_id: e7-mixed-engagement-neutral
    when:
      card_id: prism-crispr-concordance
      field: crispr_prism_concordance_class
      equals: mixed_engagement
    signals:
      small_molecule: neutral
      degrader: neutral
    rationale: |
      Best pair-wise rho in the [0.10, 0.30) weak range. Compound activity is
      partially concordant with genetic dependency but neither assay strongly
      validates on-target engagement. Common for compounds with mixed
      target-plus-off-target profiles or genes where PRISM cell-line coverage
      is thin. Neutral: no signal to reinforce or oppose the target call.

  - rule_id: e7-discordant-off-target-warning
    when:
      card_id: prism-crispr-concordance
      field: crispr_prism_concordance_class
      equals: discordant_off_target_likely
    signals:
      small_molecule: neutral
      degrader: neutral
    rationale: |
      All pair-wise rhos < 0.10. Compound activity does NOT track with genetic
      dependency in either CRISPR or RNAi. The annotated compounds may be working
      via off-target mechanisms. IMPORTANT: this is a compound-annotation warning,
      NOT a target killer. The target itself may still be biologically valid — a
      different chemical scaffold could engage it. Interpretation: PRISM's E6
      activity call should be discounted (or contextualized as "possibly
      off-target") but the target-itself signal (dependency, essentiality) is
      untouched by this rule.

  - rule_id: e7-thin-evidence-insufficient
    when:
      card_id: prism-crispr-concordance
      field: crispr_prism_concordance_class
      equals: thin_evidence
    signals:
      small_molecule: insufficient
      degrader: insufficient
    rationale: |
      Insufficient cell-line overlap between the PRISM screen panel and CRISPR/RNAi
      panels (< 20 lines intersected for any compound). Coverage gap; not used as
      opposing evidence.

  - rule_id: e7-data-unavailable-insufficient
    when:
      card_id: prism-crispr-concordance
      field: crispr_prism_concordance_class
      equals: data_unavailable
    signals:
      small_molecule: insufficient
      degrader: insufficient
    rationale: |
      Neither CRISPR nor RNAi data available for this gene (both assays absent
      from DepMap). Coverage gap; concordance cannot be assessed. E6's compound
      activity call stands unchallenged.

  # ============================================================================
  # E8 — Structure / small-molecule ligandability (Card structure-features-static)
  # ============================================================================
  # FORWARD ligandability for the small-molecule druggability call. Added 2026-07-17
  # (gate-scaffold backtest follow-up): E6/E7 (PRISM) measure whether a compound has
  # ALREADY been found — retrospective. They cannot credit a target that is
  # structurally druggable but not yet drugged (the KRAS-G12C switch-II pocket was
  # invisible to E1 pre-sotorasib). These rules add the "CAN it be drugged" signal
  # from AlphaFold/PDB pocket structure. structure-features-static is tier:target
  # (a protein property, subgroup-invariant) and is ALSO consumed by
  # surface-modality-fit on the surface axis — its surface-scoped rules live in
  # surface-intrinsic.rules.yaml. These intracellular rules are small_molecule-scoped
  # ONLY (a druggable pocket says nothing about a biologics modality) and are a
  # deliberate axis-local copy of the SM-relevant structure signal, NOT a move.

  # NB: rule_id is intracellular-axis-specific (…-e8) to disambiguate from the
  # surface-axis copy in surface-intrinsic.rules.yaml, which emits adc/bite_tce
  # neutral signals for the SAME card. The rules loader reads one axis file per
  # skill, so both coexist safely; distinct ids keep provenance unambiguous.
  - rule_id: hotspot-in-druggable-pocket-sm-supportive-e8
    when:
      card_id: structure-features-static
      field: mutation_hotspot_in_druggable_pocket
      equals: 'true'
    signals:
      small_molecule: supportive
    dominant: true
    rationale: |
      A known TCGA mutation hotspot sits in a druggable pocket → small-molecule
      structure-guided design is actionable (the KRAS-G12C switch-II archetype).
      This is FORWARD ligandability: it credits druggability the retrospective PRISM
      cards (E6/E7) miss for a not-yet-drugged target. SM-scoped only.

  - rule_id: structure-pocket-adjacent-sm-supportive
    when:
      card_id: structure-features-static
      field: hotspot_pocket_adjacency_call
      equals: adjacent
    signals:
      small_molecule: supportive
    rationale: |
      A mutation hotspot sits ADJACENT to a resolved pocket (PDB or high-confidence
      AlphaFold) — structure-guided small-molecule design has a handle even without an
      existing compound. Supportive (not dominant): weaker than a hotspot IN a
      druggable pocket. SM-scoped forward-ligandability signal.

  - rule_id: structure-low-confidence-sm-opposing
    when:
      card_id: structure-features-static
      field: alphafold_confidence_class
      equals: low
    signals:
      small_molecule: opposing
    rationale: |
      AlphaFold structural confidence is LOW (the card's categorical proxy for a
      largely disordered / poorly-resolved fold; the method thresholds pLDDT at
      emit time) — classical small-molecule pocket-based design is unlikely to have
      a handle. A MEASURED structural negative for the SM modality, not an absence.
      NOT a killer: low-confidence/disordered targets can still be addressable by
      degraders / molecular glue / RNA therapeutics (see mechanism-and-pharmacology).
      SM-scoped. (Rule-layer discipline: keyed on the card's categorical, not a raw
      threshold — thresholding happens at emit time in the method.)

  - rule_id: structure-no-coverage-sm-insufficient
    when:
      card_id: structure-features-static
      field: hotspot_pocket_adjacency_call
      equals: no_structure
    signals:
      small_molecule: insufficient
    rationale: |
      Neither PDB nor AlphaFold has usable structural coverage — a structure-based
      SM ligandability call cannot be made. Coverage gap (insufficient), NOT an
      opposing signal (measured-vs-null discipline: absence of structure is not
      evidence of undruggability). The surface axis handles this card's adc/bite_tce
      neutral signal separately in surface-intrinsic.rules.yaml.

  # ============================================================================
  # E8-lig — COMPOSITE structural ligandability (Card structure-features-static, v1.1.0)
  # ============================================================================
  # The LIVE structure signal (2026-08-07). structural_ligandability_class fuses SIX shipped
  # per-UniProt products (HOTPocket pocket geometry, GenomeScreen virtual-screen hits, PLINDER
  # co-crystals, CryptoBench cryptic sites, AlphaFold disorder, InterPro binding/active sites)
  # into one ordinal via structure-ligandability-per-protein-v1. BOTH structural legs now move the
  # SM tractability verdict: the E8 block above keys on hotspot_pocket_adjacency_call, whose product
  # (pdb-alphafold-structure-features-per-uniprot-v1) is LIVE as of 2026-08-07 — the reader loads it
  # and those rules fire (KRAS/BRAF/ERBB2 -> adjacent / hotspot-in-druggable-pocket). These E8-lig
  # rules ADD an ordinal FORWARD-ligandability signal ("is there ANY druggable handle") that the
  # retrospective PRISM cards (E6/E7) miss for a not-yet-drugged target (KRAS-G12C switch-II
  # archetype). SM-scoped ONLY (a pocket says nothing about a biologics modality); the surface
  # axis does not load a small_molecule module, so no surface twin is needed.
  #
  # Ordinal-tier design (measured-vs-null discipline, mirroring the E8 hotspot block):
  #   experimental_ligandable -> supportive+dominant (a real ligand-bound co-crystal exists)
  #   predicted_ligandable    -> supportive          (pocket / VS-hit / cryptic site; weaker)
  #   disordered_low          -> opposing            (MEASURED negative: AF model present, mostly-IDP)
  #   insufficient_evidence   -> insufficient        (coverage gap; NEVER opposing)
  # annotation_ligandable / no_ligandability_signal emit no signal (indeterminate middle).
  - rule_id: ligandability-experimental-sm-supportive
    when:
      card_id: structure-features-static
      field: structural_ligandability_class
      equals: experimental_ligandable
    signals:
      small_molecule: supportive
    dominant: true
    rationale: |
      A real experimental ligand-bound co-crystal exists (PLINDER) — the strongest possible
      structural handle for small-molecule design. Dominant forward-ligandability signal;
      credits druggability independent of whether a compound has yet been found in PRISM.
      SM-scoped.

  - rule_id: ligandability-predicted-sm-supportive
    when:
      card_id: structure-features-static
      field: structural_ligandability_class
      equals: predicted_ligandable
    signals:
      small_molecule: supportive
    rationale: |
      A druggable pocket (HOTPocket), virtual-screen hit (GenomeScreen), or cryptic/allosteric
      site (CryptoBench) is present without a co-crystal — a credible small-molecule handle
      exists even absent an existing compound. Supportive (not dominant): weaker than a real
      co-crystal. SM-scoped forward-ligandability signal.

  - rule_id: ligandability-disordered-sm-opposing
    when:
      card_id: structure-features-static
      field: structural_ligandability_class
      equals: disordered_low
    signals:
      small_molecule: opposing
    rationale: |
      The AlphaFold model exists and the protein is majority-disordered (highly_disordered)
      with NO pocket / co-crystal / cryptic-site / annotated-site evidence — classical
      small-molecule pocket-based design is unlikely to have a handle. A MEASURED structural
      negative, not an absence. NOT a killer: disordered targets remain addressable by
      degraders / molecular glue / RNA therapeutics (see mechanism-and-pharmacology). SM-scoped.

  - rule_id: ligandability-no-evidence-sm-insufficient
    when:
      card_id: structure-features-static
      field: structural_ligandability_class
      equals: insufficient_evidence
    signals:
      small_molecule: insufficient
    rationale: |
      The target is absent from all six structure/tractability products — a structure-based SM
      ligandability call cannot be made. Coverage gap (insufficient), NOT an opposing signal
      (measured-vs-null discipline: absence of data is not evidence of undruggability). SM-scoped.

  # ============================================================================
  # E-known-drug — PHARMACOLOGY leg (Card known-drug-tractability, DGIdb)
  # ============================================================================
  # The known-drug / druggable-category leg of the SM tractability call, from DGIdb. Complements the
  # STRUCTURE leg (E8/E8-lig, "is there a handle") with "has a drug actually been catalogued". These
  # rules REUSE the existing verdict rungs (no new verdict string): an APPROVED antineoplastic drug is
  # retrospective chemical-genetic evidence -> chemically_active (same tier as PRISM clinically-active,
  # so it RESCUES a target an individual PRISM screen missed but a real oncology drug exists); a
  # druggable-genome / clinically-actionable-without-approval membership is a forward druggable-class
  # prior -> structurally_ligandable tier (alongside a pocket). SM-scoped only. Measured-vs-null: DGIdb
  # absence emits NO signal (a coverage gap, not an opposing note); the card's no_known_drug_evidence
  # class simply fires nothing here. Both rules map to EXISTING verdicts, so they can only rescue
  # fall-through combos, never change one that already returned chemically_active/structurally_ligandable.
  - rule_id: known-drug-approved-antineoplastic-sm-supportive
    when:
      card_id: known-drug-tractability
      field: known_drug_tractability_class
      equals: approved_drug_tractable
    signals:
      small_molecule: supportive
    dominant: true
    rationale: |
      An APPROVED small-molecule drug is catalogued against this target in DGIdb (approved-drug
      interaction) — a real compound demonstrably engages the target. Retrospective chemical
      evidence (like PRISM clinically-active), from the drug-catalogue rather than a cell-line
      screen, so it credits a target an individual PRISM screen may have missed. Maps to the
      chemically_active verdict rung. SM-scoped.

  - rule_id: known-drug-druggable-category-sm-supportive
    when:
      card_id: known-drug-tractability
      field: known_drug_tractability_class
      in: [clinically_actionable, druggable_genome]
    signals:
      small_molecule: supportive
    rationale: |
      The target is in a recognized DGIdb druggable category (CLINICALLY ACTIONABLE or DRUGGABLE
      GENOME) without an approved drug flagged here — a forward druggable-CLASS prior (kinase/GPCR/
      enzyme families with established small-molecule chemistry). Supportive, not dominant: a class
      membership is weaker than an approved drug or a resolved pocket. Maps to the structurally_
      ligandable tier (a forward handle, no compound yet). SM-scoped.

  # E-measured-potency (T3.1, 2026-08-09): the MEASURED-POTENCY leg (ChEMBL + BindingDB), wiring the
  # previously-inert bioactivity products. DISTINCT from PRISM (retrospective cell-line killing),
  # known-drug/DGIdb (drug PRESENCE, not potency), and structure (predicted pocket): this is MEASURED
  # binding potency. A potent chemotype SERIES is a strong forward-tractability signal a med-chemist
  # values above a predicted pocket. Maps (resolver) to a measured-potency tier between the
  # retrospective chemical-activity tier and the structural tier.
  - rule_id: measured-potent-ligand-sm-supportive
    when:
      card_id: measured-potency-tractability
      field: measured_bioactivity_class
      equals: potent_measured_ligand
    signals:
      small_molecule: supportive
    dominant: true
    rationale: |
      A potent (<=1 uM) MEASURED small-molecule ligand SERIES exists (>=10 potent ligands in ChEMBL
      and/or BindingDB) — a real, deep chemical start point with quantified binding, not a predicted
      pocket or a presence-only catalogue entry. Dominant for the measured-potency tier. SM-scoped
      (measured binding potency says nothing about degrader/E3 feasibility).

  - rule_id: measured-weak-ligand-sm-supportive
    when:
      card_id: measured-potency-tractability
      field: measured_bioactivity_class
      equals: weak_measured_ligand
    signals:
      small_molecule: supportive
    rationale: |
      Measured small-molecule activity exists but is NOT a potent series (a potent hit or two, or
      sub-potent affinity) — a starting point that needs optimization. Weak-supportive: real measured
      chemical matter, but thin. SM-scoped.

  # ============================================================================
  # E-tvN-Sel — Tumor vs Normal Selectivity (Card tumor-vs-normal-selectivity v3)
  # ============================================================================
  # MULTI-CELL sensitivity selectivity. The three live cells (TCGA-adjacent raw +
  # ComBat, GTEx-population raw; cell D retired — ComBat over-corrected the GTEx
  # joint) run under ONE DESeq2 pipeline on ONE recount3 substrate, so trust =
  # cells_supporting AS A FRACTION of cells_ran (≤3), not a single log2FC. Signal
  # interpretation (rules fire on selectivity_class, the categorical — not a count):
  # * strong_tumor_selective          → supportive (up in ALL cells that ran, |log2FC|≥1.5)
  # * modest_tumor_selective          → supportive, lower confidence (supporting_frac ≥ 2/3 up)
  # * discordant_across_comparators   → NEUTRAL but flagged — comparator-dependent
  #     (sig cells disagree on direction; "which normal?" changes the answer)
  # * not_selective                   → NEUTRAL (down in supporting_frac ≥ 2/3; expression
  #     selectivity is orthogonal to a dependency-driven target's viability)
  # * not_informative                 → neutral (no comparator-robust signal)
  # * data_unavailable                → insufficient

  - rule_id: tvn-strong-selective-supportive
    when:
      card_id: tumor-vs-normal-selectivity
      field: selectivity_class
      equals: strong_tumor_selective
    signals:
      small_molecule: supportive
      degrader: supportive
    rationale: |
      Target upregulated in tumor in ALL sensitivity cells that ran (cells_supporting
      == cells_ran, dominant up, max |log2FC| ≥ 1.5). Robust to both comparator choice
      (TCGA-adjacent vs GTEx-population) AND batch handling (raw vs ComBat) — the
      strongest RNA-level therapeutic-window signal the card can emit. Supportive
      for small-molecule (context-of-action) and degrader (target must be
      expressed to be degraded). Does not imply protein-level selectivity; that's
      the protein-surface-evidence card's job.

  - rule_id: tvn-modest-selective-supportive
    when:
      card_id: tumor-vs-normal-selectivity
      field: selectivity_class
      equals: modest_tumor_selective
    signals:
      small_molecule: supportive
      degrader: supportive
    rationale: |
      Tumor upregulation in most cells that ran (supporting_frac ≥ 2/3, dominant up,
      max |log2FC| ≥ 0.5). Supportive but lower confidence than strong_tumor_selective
      — one comparator dissents, typically the naive GTEx arm (cell C) where the
      TCGA-vs-GTEx batch confound bites. Interpret alongside the 3-cell forest in the figure.

  - rule_id: tvn-field-effect-selective-supportive
    when:
      card_id: tumor-vs-normal-selectivity
      field: selectivity_class
      equals: field_effect_tumor_selective
    signals:
      small_molecule: supportive
      degrader: supportive
    rationale: |
      FIELD-EFFECT tumor-selective: the tumor-vs-adjacent comparators (cells A/B) are flat or
      slightly DOWN while the GTEx population-normal (cell C) is strongly UP (≥1.5). This is the
      field-cancerization signature — the tumour-ADJACENT 'normal' tissue is already molecularly
      shifted toward tumour (Aran/Butte 2017 Nat Commun: NAT is an intermediate state carrying ~55%
      fewer tumour-vs-NAT than tumour-vs-healthy DEGs), so within-patient contrast UNDERSTATES a
      genuinely tumour-selective epithelial lineage antigen (CEACAM5/EPCAM in colon). We defer to the
      GTEx population-normal — the less-biased baseline for the over-expression call. Supportive for
      small-molecule + degrader, like strong_tumor_selective, but flagged as GTEx-anchored (the
      within-patient arm did not corroborate — a field-effect caveat, not full 3-cell robustness).
      Does NOT imply protein/surface selectivity, and does NOT address normal-tissue BREADTH (a
      separate axis — see normal-tissue-liability-gtex; a field-effect-selective gene can still be
      broadly expressed across critical normal tissues).

  - rule_id: tvn-discordant-neutral-flagged
    when:
      card_id: tumor-vs-normal-selectivity
      field: selectivity_class
      equals: discordant_across_comparators
    signals:
      small_molecule: neutral
      degrader: neutral
    rationale: |
      Significant cells DISAGREE on direction — the target reads as tumor-up
      against one normal comparator and tumor-down (or flat) against the other.
      This is the field-effect / comparator-dependence signal made explicit
      (e.g. epithelial markers up vs whole-tissue GTEx but flat vs epithelial-
      rich adjacent margin). NEUTRAL for the modality call, but the divergence
      is itself informative and must be surfaced in synthesis — do NOT average
      the cells into a single misleading log2FC. Inspect the 4-cell forest.

  - rule_id: tvn-not-selective-neutral
    when:
      card_id: tumor-vs-normal-selectivity
      field: selectivity_class
      equals: not_selective
    signals:
      small_molecule: neutral
      degrader: neutral
    rationale: |
      Target expression is LOWER in tumor across ≥3 cells (dominant down). NOT a
      killer — RNA selectivity axis is orthogonal to dependency + target-
      engagement axes. Many strongly-dependent oncogenes (KRAS, BRAF) have
      neutral or slightly-negative tumor-vs-normal RNA log2FC because their
      pathology is mutation-driven, not expression-driven. Interpretation
      requires pairing with dependency (E1/E2) and mutation (E3/E4) cards.

  - rule_id: tvn-not-informative-neutral
    when:
      card_id: tumor-vs-normal-selectivity
      field: selectivity_class
      equals: not_informative
    signals:
      small_molecule: neutral
      degrader: neutral
    rationale: |
      ≤1 of the ran cells shows a comparator-robust significant signal in the
      dominant direction — below the bar for a meaningful selectivity call.
      Neutral; no signal to reinforce or oppose.

  - rule_id: tvn-data-unavailable-insufficient
    when:
      card_id: tumor-vs-normal-selectivity
      field: selectivity_class
      equals: data_unavailable
    signals:
      small_molecule: insufficient
      degrader: insufficient
    rationale: |
      The multi-cell sensitivity product is not accessible for this indication
      (batch expansion pending, or gene absent). Coverage gap; not used as
      opposing evidence.

  # ── axis-B/E NORMAL-BREADTH VETO (selectivity conjunction INC-1/2, 2026-08-07) ──
  # The housekeeping veto. Fires on the modality-therapeutic-window card's RATIO-based
  # therapeutic_window_class == no_therapeutic_window (tumor BELOW the worst critical normal — no
  # therapeutic window). The tumor-selectivity skill's _verdict applies this as a CONJUNCTION: when
  # axis-A returns strong/modest/field_effect_tumor_selective AND this veto rule is in `fired`, the
  # verdict is downgraded to selective_but_broadly_normal (axis-A over-expression is NECESSARY but
  # NOT SUFFICIENT — a broadly-normal gene like GAPDH is not a target regardless of tumor-vs-origin
  # fold-change). Backtest: separates housekeeping (no_window) from validated antigens cleanly.
  # SM/degrader OPPOSING (a genuine on-target/off-tumor liability, not a coverage gap).
  - rule_id: tvn-no-therapeutic-window-veto
    when:
      card_id: modality-therapeutic-window
      field: therapeutic_window_class
      equals: no_therapeutic_window
    signals:
      small_molecule: opposing
      degrader: opposing
    rationale: |
      Tumor expression is BELOW the worst critical/essential normal organ (tumor÷worst-essential-normal
      ratio < 1) — there is NO therapeutic window versus the broad normal tissue atlas, even if the gene
      is over-expressed vs its own tissue of origin (axis A). This is the housekeeping / broadly-expressed
      signature (GAPDH/ACTB/TUBB/B2M). The tumor-selectivity verdict downgrades a selective axis-A call to
      selective_but_broadly_normal when this fires (conjunction: over-expression is necessary, not
      sufficient — best practice is tumor-to-WORST-normal window, not tumor-vs-origin alone). Modality-
      lensed: on-target/off-tumor liability is worst for a systemic small-molecule/degrader that hits the
      target everywhere it is expressed.

  - rule_id: tvn-no-full-normal-window-veto
    when:
      card_id: modality-therapeutic-window
      field: full_normal_window_class
      equals: no_full_normal_window
    signals:
      small_molecule: opposing
      degrader: opposing
    rationale: |
      PAN-NORMAL companion to tvn-no-therapeutic-window-veto (DEFERRED-2, 2026-08-08). The
      therapeutic-window veto keys on therapeutic_window_class, which is ESSENTIAL-ORGANS-ONLY (tumor ÷
      worst of the 15 critical organs). A gene broad across NON-essential normals but low in the
      essential set (TROP2/TACSTD2 salivary-gland archetype) reads clean_window there yet has NO
      pan-normal therapeutic window. full_normal_window_class = no_full_normal_window means tumor is
      below the worst tissue of the FULL normal atlas — a second, orthogonal normal-breadth veto. The
      tumor-selectivity verdict downgrades a selective axis-A call to selective_but_broadly_normal when
      this fires (same conjunction discipline as the essential-organ veto). Modality-lensed identically.

  - rule_id: tvn-sc-normal-critical-organ-veto
    when:
      card_id: sc-normal-celltype-expression
      field: sc_normal_safety_essential_class
      equals: critical_organ_liability
    signals:
      small_molecule: opposing
      degrader: opposing
    rationale: |
      CELL-TYPE-RESOLVED normal veto (INC-3, axis-D, 2026-08-08). Bulk tumor-vs-normal + the
      atlas-window vetoes can miss a target expressed in a SAFETY-ESSENTIAL CELL TYPE within a
      non-origin critical organ (cardiomyocyte / hepatocyte / renal-tubule / HSC / neuron), which
      bulk tissue medians dilute. sc_normal_safety_essential_class == critical_organ_liability means
      the target is highly detected in an essential cell type of a NON-tissue-of-origin critical organ
      (the AM #237 organ-aware instrument, threaded with origin_tissues; origin_tissue_liability is
      DELIBERATELY NOT a veto — origin-tissue essential expression is expected and modality-arbitrated).
      The tumor-selectivity verdict downgrades a selective axis-A call to selective_but_broadly_normal
      when this fires — the third normal-breadth veto arm (worst-case conjunction). Design note: this
      INCLUDES FOLR1 (real kidney tubule) → correctly downgraded (real target + real off-origin organ
      liability; window/modality then arbitrate — NOT a rejection). MSLN reads origin_tissue_liability
      (pleural/lung) → correctly does NOT fire. Modality-lensed (systemic SM/degrader worst).

  # ============================================================================
  # Phase D — Signaling-network-mechanism card (added 2026-07-08)
  # ============================================================================

  - rule_id: mechanism-well-characterized-supportive
    when:
      card_id: signaling-network-mechanism
      field: network_class
      equals: well_characterized
    signals:
      small_molecule: supportive
      degrader: supportive
    rationale: |
      >= 3 upstream regulators AND >= 3 downstream effectors annotated in
      SIGNOR-via-OmniPath. Well-characterized network context — MoA hooks
      + PD marker candidates are enumerable. Supportive for both SM and
      degrader modalities.

  - rule_id: mechanism-partial-neutral
    when:
      card_id: signaling-network-mechanism
      field: network_class
      equals: partial
    signals:
      small_molecule: neutral
      degrader: neutral
    rationale: |
      Some — but not richly-characterized — upstream/downstream signaling
      context annotated (between sparse and well_characterized). Added
      2026-07-14: the reader emits `partial` as the fall-through class
      (mechanism_composed read.py:162) but no rule matched it, so
      partial-network targets fired nothing and collapsed to `insufficient`.
      MoA hooks are partially enumerable; informative but not
      decision-driving on its own.

  - rule_id: mechanism-sparse-warning
    when:
      card_id: signaling-network-mechanism
      field: network_class
      equals: sparse
    signals:
      small_molecule: opposing
      degrader: opposing
    rationale: |
      0-1 edges in SIGNOR-via-OmniPath. Mechanism-of-action reasoning is
      unconstrained by prior signaling context — governance readers should
      require additional mechanism evidence before nomination.

  - rule_id: mechanism-data-unavailable-insufficient
    when:
      card_id: signaling-network-mechanism
      field: network_class
      equals: data_unavailable
    signals:
      small_molecule: insufficient
      degrader: insufficient
    rationale: |
      Target not present in SIGNOR-via-OmniPath. Coverage gap; not opposing
      evidence.

  - rule_id: has-pd-marker-supportive
    when:
      card_id: signaling-network-mechanism
      field: has_pd_marker
      equals: 'true'
    signals:
      small_molecule: supportive
      degrader: supportive
    rationale: |
      At least one downstream effector identified. PD-marker candidates
      exist for pharmacodynamic monitoring — a governance-critical
      trial-design signal.

  # ============================================================================
  # Phase E — Co-mutation-and-mutual-exclusivity card (added 2026-07-08)
  # ============================================================================

  - rule_id: has-cooccurring-driver-supportive
    when:
      card_id: co-mutation-and-mutual-exclusivity
      field: has_cooccurring_driver
      equals: 'true'
    signals:
      small_molecule: supportive
      degrader: supportive
    rationale: |
      >= 1 significantly-cooccurring driver partner at q<0.001. Combination
      biology + patient-selection biomarkers can be reasoned from the
      cooccurrence pattern.

  - rule_id: strong-mutual-exclusivity-supportive
    when:
      card_id: co-mutation-and-mutual-exclusivity
      field: cooccurrence_class
      equals: strong_mutually_exclusive
    signals:
      small_molecule: supportive
      degrader: supportive
    dominant: true
    rationale: |
      Target has strong mutually-exclusive partners at q<0.001, log2_or<-1.
      Indicates the target operates in a distinct oncogenic pathway from
      its exclusive partners — provides patient-selection stratification
      for a monotherapy trial.

  - rule_id: cooccurrence-data-unavailable-insufficient
    when:
      card_id: co-mutation-and-mutual-exclusivity
      field: cooccurrence_class
      equals: data_unavailable
    signals:
      small_molecule: insufficient
      degrader: insufficient
    rationale: |
      Target not present in the panel-intersect Fisher scan output. Coverage
      gap; not opposing evidence.

  # ----------------------------------------------------------------------------
  # Coverage completion (added 2026-07-14): the reader emits SIX cooccurrence_
  # class values (both_patterns_present | strong_cooccurring |
  # strong_mutually_exclusive | modest_cooccurring | modest_mutually_exclusive
  # | ns) plus data_unavailable, but only strong_mutually_exclusive +
  # data_unavailable had rules — so a target landing on any co-occurring or
  # both-pattern class fired NOTHING and its verdict silently collapsed to
  # `insufficient` despite real, significant data (e.g. KRAS/COADREAD:
  # both_patterns_present, 709 cooc / 59 mutex partners). These rows close
  # that gap. (NOTE: the card docstring's vocabulary list omits
  # both_patterns_present — a reader↔card doc drift flagged for the card
  # owner; rules here match what the reader actually emits, read.py:134-142.)
  - rule_id: cooccurrence-both-patterns-supportive
    when:
      card_id: co-mutation-and-mutual-exclusivity
      field: cooccurrence_class
      equals: both_patterns_present
    signals:
      small_molecule: supportive
      degrader: supportive
    dominant: true
    rationale: |
      Target has BOTH strong co-occurring (q<0.001, log2_or>1) AND strong
      mutually-exclusive (q<0.001, log2_or<-1) partners. The richest
      differentiation signal: co-occurring partners inform combination +
      patient-selection biology; exclusive partners inform monotherapy
      stratification.

  - rule_id: cooccurrence-strong-supportive
    when:
      card_id: co-mutation-and-mutual-exclusivity
      field: cooccurrence_class
      equals: strong_cooccurring
    signals:
      small_molecule: supportive
      degrader: supportive
    rationale: |
      Strong co-occurring partners (q<0.001, log2_or>1). Combination biology
      + patient-selection biomarkers reason from the co-occurrence pattern.

  - rule_id: cooccurrence-modest-cooccurring-neutral
    when:
      card_id: co-mutation-and-mutual-exclusivity
      field: cooccurrence_class
      equals: modest_cooccurring
    signals:
      small_molecule: neutral
      degrader: neutral
    rationale: |
      Modest co-occurring partners (q<0.05, log2_or>0.5). A weak
      differentiation signal — informative but not decision-driving.

  - rule_id: cooccurrence-modest-mutually-exclusive-neutral
    when:
      card_id: co-mutation-and-mutual-exclusivity
      field: cooccurrence_class
      equals: modest_mutually_exclusive
    signals:
      small_molecule: neutral
      degrader: neutral
    rationale: |
      Modest mutually-exclusive partners (q<0.05, log2_or<-0.5). Weak
      pathway-distinctness signal; informative but not decision-driving.

  - rule_id: cooccurrence-ns-neutral
    when:
      card_id: co-mutation-and-mutual-exclusivity
      field: cooccurrence_class
      equals: ns
    signals:
      small_molecule: neutral
      degrader: neutral
    rationale: |
      No significant co-occurrence or mutual-exclusivity pattern for this
      target. Present in the scan (distinct from data_unavailable) but the
      co-mutation axis is not informative for differentiation here — neutral
      signal (neither supports nor opposes). NOTE: signal must be one of the
      schema enum {supportive, opposing, killer, neutral, insufficient};
      `not_informative` is NOT a valid signal value (fixed 2026-07-14).

  # ============================================================================
  # Phase C-adjacent — Paralog-buffering card (added 2026-07-08)
  # ============================================================================

  - rule_id: strong-paralog-buffering-degrader-preferred
    when:
      card_id: paralog-buffering
      field: paralog_buffering_class
      equals: strong
    signals:
      small_molecule: opposing
      degrader: supportive
    dominant: true
    rationale: |
      Target has a strongly-buffering paralog (dep_delta > 0.5). Small-
      molecule active-site inhibitors typically cannot hit both paralogs;
      degrader modalities (PROTAC, molecular glue) may if the ligand-binding
      domain is shared. Strongest degrader-vs-SM differentiation signal
      available in the framework.

  - rule_id: partial-paralog-buffering-warning
    when:
      card_id: paralog-buffering
      field: paralog_buffering_class
      equals: partial
    signals:
      small_molecule: opposing
      degrader: neutral
    rationale: |
      Partial paralog buffering (delta 0.2-0.5). SM programs should model
      paralog-escape scenarios in trial design.

  - rule_id: no-paralog-buffering-sm-supportive
    when:
      card_id: paralog-buffering
      field: paralog_buffering_class
      equals: none
    signals:
      small_molecule: supportive
      degrader: neutral
    rationale: |
      Paralogs annotated but no functional buffering in DepMap PARIS or
      Sanger screens. Single-agent SM inhibition is not paralog-escape-
      constrained.

  # ============================================================================
  # Phase G — gnomAD LoF-constraint card (added 2026-07-08)
  # ============================================================================

  - rule_id: highly-constrained-safety-warning
    when:
      card_id: gnomad-lof-constraint
      field: constraint_class
      equals: highly_constrained
    signals:
      small_molecule: opposing
      degrader: opposing
    dominant: true
    rationale: |
      Target is highly LoF-constrained in gnomAD (pLI>=0.9, LOEUF<=0.35).
      Population evidence suggests LoF is not tolerated — on-target safety
      risk if the therapy fully abrogates protein function. Governance
      readers should require dose-limiting-toxicity study before full
      program commit.

  - rule_id: moderately-constrained-safety-neutral
    when:
      card_id: gnomad-lof-constraint
      field: constraint_class
      equals: moderately_constrained
    signals:
      small_molecule: neutral
      degrader: neutral
    rationale: |
      Target sits in the MIDDLE gnomAD constraint band (between highly_constrained
      and tolerant — e.g. 0.5<=pLI<0.9 / 0.35<LOEUF<=0.6). Population evidence is
      genuinely equivocal on LoF tolerance: not a clear safety liability (so NOT
      opposing / NOT a hold) but not a safety-margin signal either (so NOT
      supportive). Emitting `neutral` fills the previously decision-INERT middle
      band with an honest read — the card declared moderately_constrained in its
      vocab but no rule consumed it (safety returned `insufficient` for every
      mid-band gene). Added 2026-07-17 (defensible-v1 C2c). Deliberately NEUTRAL,
      not hold: only highly_constrained warrants a safety hold at the nomination gate.

  - rule_id: tolerant-safety-supportive
    when:
      card_id: gnomad-lof-constraint
      field: constraint_class
      equals: tolerant
    signals:
      small_molecule: supportive
      degrader: supportive
    rationale: |
      gnomAD population tolerates LoF variants at this locus (pLI<0.5,
      LOEUF>0.6). Reduced on-target-off-tumor safety risk; degrader
      modalities in particular gain a safety-margin signal.

  - rule_id: constraint-data-unavailable-insufficient
    when:
      card_id: gnomad-lof-constraint
      field: constraint_class
      equals: indeterminate
    signals:
      small_molecule: insufficient
      degrader: insufficient
    rationale: |
      Target not in gnomAD constraint table. Coverage gap; not opposing
      evidence.

  # MUTANT-SELECTIVE SAFETY CONDITIONING (2026-07-23). A mechanism-CONTEXT detector, NOT itself a
  # safety judgment: it fires when the target is an ACTIVATING (GoF) driver. The safety RESOLVER
  # (safety.resolver.yaml) combines this with highly-constrained-safety-warning via when_all_fired to
  # DOWNGRADE the gnomAD-constraint concern — because gnomAD constraint measures intolerance of the
  # WILD-TYPE protein, but a GoF driver's therapeutic is typically MUTANT-SELECTIVE (KRAS-G12C spares
  # WT KRAS in normal tissue), so the WT-essentiality safety signal largely does not apply. The rule
  # itself emits NEUTRAL signals on the intracellular axis (it adds no per-modality biology of its
  # own — the driver-direction's SM/degrader story is carried by the alteration-role rules elsewhere);
  # its ONLY job here is to be a fired-rule the safety resolver can pattern-match. See memory
  # feedback_wt_essentiality_mechanism_conditioning. NOTE the nullification assumes an allele-SELECTIVE
  # modality; a pan-target degrader / WT-hitting inhibitor would re-expose the concern (the resolver
  # verdict + card caveat state this conditionality).
  - rule_id: oncogene-role-safety-context
    when:
      card_id: alteration-role
      field: oncokb_gene_type
      equals: ONCOGENE
    signals:
      small_molecule: neutral
      degrader: neutral
    rationale: |
      Role-agreement GATE for the mutant-selective GoF safety downgrade. activating-driver-role-safety-
      context fires on functional_direction=activating, which a spurious intOGen 'Act' label can set even
      for a TUMOR SUPPRESSOR (e.g. SMARCA2: oncokb_gene_type=TSG yet functional_direction=activating).
      Downgrading a TSG's WT-loss safety concern is wrong — a TSG is not drugged by a mutant-selective
      activator that spares WT. The safety resolver's GROUP-1 downgrades require BOTH this rule AND
      activating-driver-role-safety-context (when_all_fired), so only a genuine GoF ONCOGENE earns the
      WT-constraint mechanism-mismatch downgrade. Neutral signals: mechanism context, not a biology call.
      AMPLIFICATION-driven oncogenes (e.g. ERBB2, MDM2) are now EXCLUDED from the downgrade by
      copy-number-amplified-oncogene-safety-context (a GROUP-0 resolver guard above the GROUP-1
      downgrades): when the target is recurrently focally amplified, a drug hits WT protein so the
      mutant-selective-sparing logic fails and the on-target-safety HOLD is kept (S1-1, cards review
      2026-08-17). [Previously a KNOWN GAP — closed.]

  - rule_id: activating-driver-role-safety-context
    when:
      card_id: alteration-role
      field: functional_direction
      equals: activating
    signals:
      small_molecule: neutral
      degrader: neutral
    rationale: |
      Target is an ACTIVATING (GoF) driver. Mechanism-context signal for the safety gate: a GoF
      driver is typically drugged mutant-selectively, so a WILD-TYPE-essentiality safety signal
      (gnomAD germline constraint; DepMap somatic pan-essentiality) OVERSTATES on-target risk — the
      therapy spares the WT protein in normal tissue. Combined with highly-constrained-safety-warning
      in the safety resolver (when_all_fired) to downgrade the constraint concern to a
      mechanism-mismatch note. Neutral signals: this rule contributes mechanism CONTEXT, not a
      per-modality biology call. Conditional on an allele-selective modality.

  - rule_id: copy-number-amplified-oncogene-safety-context
    when:
      card_id: copy-number-distribution
      field: patient_focal_cn_class
      equals: recurrent_focal_amplification
    signals:
      small_molecule: neutral
      degrader: neutral
    rationale: |
      AMPLIFICATION-driven-GoF GUARD for the mutant-selective safety downgrade (S1-1, cards review
      2026-08-17). The safety resolver's GROUP-1 mechanism-mismatch downgrades assume a GoF oncogene is
      drugged MUTANT-SELECTIVELY, so a WILD-TYPE-essentiality safety concern OVERSTATES on-target risk
      (the therapy spares WT). That logic FAILS for an AMPLIFICATION-driven oncogene (ERBB2, MDM2, MYC):
      the target IS the wild-type protein (over-produced from extra gene copies), so an ADC / T-cell
      engager / degrader / WT-hitting inhibitor DOES engage WT in normal tissue — the WT-loss safety
      concern stands. This rule fires when the tumour cohort shows recurrent FOCAL high-level (+2 GISTIC,
      >=10% of tumours) amplification of the target; the safety resolver consumes it (when_all_fired,
      GROUP-0 above GROUP-1) to KEEP the on-target-safety HOLD instead of downgrading it to a
      mechanism-mismatch. Neutral per-modality signals: this is mechanism CONTEXT for the safety gate,
      not a biology call. Closes the KNOWN GAP documented on oncogene-role-safety-context.
# Added 2026-07-14 (Pass 1 of legacy-cleanup): CPTAC bulk-protein categorical
# was emitted after the tumor-presence protein wiring but no rule consumed it,
# so the protein signal was decision-inert. These rules complete the
# per-modality reasoning for the bulk_protein_ms axis of Phase A.
# ============================================================================

  - rule_id: protein-strongly-up-supportive
    when:
      card_id: tumor-protein-abundance-cptac
      field: protein_expression_class
      equals: strong_up
    signals:
      small_molecule: supportive
      degrader: supportive
    dominant: true
    rationale: |
      Protein-level tumor-vs-normal differential is strong (q<0.05, effect
      size >=1.5) in the CPTAC cohort. Bulk-protein confirmation of the
      RNA-level tumor-elevation call — reduces the risk that a strong-RNA
      signal is post-transcriptionally attenuated. Dominant because
      protein-level confirmation is the modality-decision anchor for
      intracellular programs.

  - rule_id: protein-modestly-up-neutral
    when:
      card_id: tumor-protein-abundance-cptac
      field: protein_expression_class
      equals: modest_up
    signals:
      small_molecule: neutral
      degrader: neutral
    rationale: |
      Protein-level differential is significant but modest (q<0.05,
      0.5<=effect<1.5). Informative but not decision-driving on its own;
      concordance with the RNA-level call matters more than the effect
      magnitude here.

  - rule_id: protein-strongly-down-opposing
    when:
      card_id: tumor-protein-abundance-cptac
      field: protein_expression_class
      equals: strong_down
    signals:
      small_molecule: opposing
      degrader: opposing
    rationale: |
      Protein is DOWN in tumor vs normal in the CPTAC cohort. If the
      RNA-level call says elevated, this is a red flag — post-transcriptional
      down-regulation or antibody/MS artifact. Governance readers should
      resolve the RNA/protein discordance before program commit.

  - rule_id: protein-modestly-down-opposing
    when:
      card_id: tumor-protein-abundance-cptac
      field: protein_expression_class
      equals: modest_down
    signals:
      small_molecule: opposing
      degrader: opposing
    rationale: |
      Protein is MODESTLY down in tumor vs normal in the CPTAC cohort
      (q<0.05, -1.5<effect<=-0.5) — a measured mild-negative presence signal.
      Mirrors the RNA card's expression-modest-downregulation-opposing rule and
      the protein card's own strong_down rule: a significant down-differential
      is opposing (weaker than strong_down but not neutral). Previously
      modest_down was declared-but-UN-ruled, so a measured mild protein
      down-regulation collapsed to `insufficient` (a coverage-gap verdict for
      what is actually a measured negative) — the direction-semantics fix
      applied to the RNA card, now mirrored here.

  - rule_id: protein-not-detected-degrader-killer
    when:
      card_id: tumor-protein-abundance-cptac
      field: protein_expression_class
      equals: not_detected
    signals:
      small_molecule: opposing
      degrader: killer
    killer_message: >
      Protein was not detected in tumor OR matched normal by CPTAC mass-spec.
      Degrader modalities require a protein substrate to engage — absence of
      detectable protein is a hard killer for a degrader program.
    rationale: |
      Protein was not detected in either tumor OR matched normal by CPTAC
      mass-spec. Degrader modalities require a protein substrate to degrade;
      absence-of-protein is a hard killer for a degrader program.
      Small-molecule inhibitor is not automatically ruled out (MS limits
      of detection can miss low-abundance functional proteins), but the
      lack of detected protein is opposing evidence for governance review.

  - rule_id: protein-data-unavailable-insufficient
    when:
      card_id: tumor-protein-abundance-cptac
      field: protein_expression_class
      equals: data_unavailable
    signals:
      small_molecule: insufficient
      degrader: insufficient
    rationale: |
      Target not resolved in the CPTAC protein cohort for this indication
      (missing from tumor + normal MS, or CPTAC cohort n < min). Coverage
      gap, not opposing evidence.

  # NOTE: the flat protein_expression_class values are deliberately un-ruled. A protein differential
  # that is not significant (or significant but small) is neither supportive nor opposing for a
  # presence call — it's the neutral null we don't want to fire on. Same discipline as
  # expression_class = 'broadly_moderate' (see above).
  # 2026-08-14 (cptac_protein_deg ns-split): the former single 'ns' was split into 'not_significant'
  # (q >= 0.05) + 'small_effect' (q < 0.05, |logfc| <= 0.5). BOTH remain un-ruled here. The
  # tumor-presence M2 rescue (skills) still marks the bulk_protein_ms/tumor bucket measured
  # (protein_present_not_elevated) off either value — present-but-flat, not "not measured".

  # ============================================================================
  # E3b — Protein abundance distribution (Card E3b: cellline-protein-abundance)
  # ============================================================================
  # The PROTEIN twin of cellline-rna-distribution (E3a). Cell-line whole-proteome
  # TMT MS (Gygi/Nusinow) DISTRIBUTION — distinct from tumor-protein-abundance-cptac,
  # which is a tumor-vs-normal CONTRAST (strong_up/down vocab). This card uses the
  # DISTRIBUTION vocab (broadly_high/broadly_low/lineage_restricted), so it gets
  # its OWN rules — exactly parallel to how cellline-rna-distribution and
  # tumor-rna-vs-adjacent each have their own rule sets. Signal mappings
  # mirror the E3a RNA-distribution rules: broadly_low → degrader killer (no
  # protein to degrade), broadly_high/lineage_restricted → supportive, moderate/
  # data_unavailable → neutral/insufficient. This is the substrate that catches
  # the RNA-high / protein-absent false-positive the modality taxonomy names.

  - rule_id: protein-abundance-broadly-low-degrader-killer
    when:
      card_id: cellline-protein-abundance
      field: protein_expression_class
      equals: broadly_low
    signals:
      degrader: killer
    killer_message: |
      Target protein is detected in <30% of DepMap cell lines by TMT MS. Degraders
      require protein presence to degrade; broadly-low cell-line protein abundance is
      strong evidence the protein is not present in cellular models. Not viable for
      degrader. (Cross-check RNA + MS-sensitivity caveat — sparse MS detection can
      also reflect membrane/low-abundance under-sampling.)
    rationale: |
      Protein twin of expression-broadly-low-degrader-killer. A degrader needs a
      target protein to degrade; broadly-low MS detection across the cell-line panel
      is strong negative evidence for that condition. Small-molecule signal neutral
      (the SM rationale lives in patient-level cards, not the cell-line panel).

  - rule_id: protein-abundance-broadly-high-supportive
    when:
      card_id: cellline-protein-abundance
      field: protein_expression_class
      equals: broadly_high
    signals:
      small_molecule: supportive
      degrader: supportive
    rationale: |
      Target protein is broadly + highly abundant across DepMap cell lines (TMT MS).
      Confirms measurable PROTEIN presence — stronger presence evidence than RNA
      alone. Supportive for both modalities; not dominant (selectivity lives in the
      tumor-vs-normal + lineage cards).

  - rule_id: protein-abundance-lineage-restricted-supportive
    when:
      card_id: cellline-protein-abundance
      field: protein_expression_class
      equals: lineage_restricted
    signals:
      small_molecule: supportive
      degrader: supportive
    rationale: |
      Lineage-restricted protein abundance across DepMap (some lineages express
      protein, others don't). Therapeutic-window candidate by selectivity; the
      indication-of-interest must overlap an expressing lineage (synthesis-layer
      lookup over per_lineage_stats). Protein twin of the E3a lineage-restricted rule.

  - rule_id: protein-abundance-broadly-moderate-neutral
    when:
      card_id: cellline-protein-abundance
      field: protein_expression_class
      equals: broadly_moderate
    signals:
      small_molecule: neutral
      degrader: neutral
    rationale: |
      Protein detected broadly at moderate abundance — informative that protein
      presence isn't a differentiator, but no directional call. Not a killer
      (degrader-viable protein IS present), not supportive (no selectivity signal).

  - rule_id: protein-abundance-data-unavailable-insufficient
    when:
      card_id: cellline-protein-abundance
      field: protein_expression_class
      equals: data_unavailable
    signals:
      small_molecule: insufficient
      degrader: insufficient
    rationale: |
      Target absent from the Gygi TMT MS matrix (not quantified in any line, or
      accession not present). Coverage gap, NOT opposing evidence — MS sensitivity
      limits under-sample membrane/low-abundance proteins.

  # ============================================================================
  # SUBTYPE TIER — verdict-affecting subgroup signal (2026-07-17)
  # ============================================================================
  # First verdict-affecting subtype rule. Fires on the subgroup-stratified-
  # dependency panorama card via an in_record match against per_subgroup_metrics.
  #
  # SEMANTICS (negative-selection only, F1-safe): the queried subtype's
  # dependency row is MEASURED (subgroup_n_floor_met: true — i.e. n >= 30, so
  # the finding is trustworthy) AND the target is NOT a dependency in that
  # subtype. This is a subtype-specific efficacy gap: nominating the target FOR
  # THIS SUBTYPE has no dependency basis. Emits subtype_fit_genomic: opposing.
  #
  # WHY in_record + subgroup_n_floor_met: true is the F4/admissibility guard.
  # An underpowered row (n < 30, subgroup_n_floor_met: false) FAILS this match
  # and cannot fire the rule — INADMISSIBLE by construction, not by convention.
  # This is the mechanical enforcement of "below floor = excluded, not tagged."
  #
  # WHY this is HOLD (not veto) at the nomination gate: it forecloses one
  # SUBTYPE, not the target — the target may be a strong dependency in other
  # subtypes (mirrors the safety-concern → hold precedent, and the
  # curation principle in nomination_verdict_gate.yaml). The gate mapping lives
  # in vocabularies/nomination_verdict_gate.yaml (sub_skill: subtype_fit).
  #
  # DESCRIPTIVE POSITIVE cases (subtype IS a strong dependency) deliberately do
  # NOT get a verdict-affecting rule: the gate can only ratchet conservative
  # (hold/veto, never nominate), so a positive subtype finding stays descriptive
  # — it appears in the panorama render but cannot inflate a nomination.
  - rule_id: subtype-non-dependence-opposing
    when:
      card_id: subgroup-stratified-dependency
      field: per_subgroup_metrics
      in_record:
        class: not_dependent
        evidence_state: measured
        subgroup_n_floor_met: true
    signals:
      subtype_fit_genomic: opposing
    tier: subtype
    subgroup_metadata_declared:
      subtype_defining_data: genomic
      subgroup_n_source: depmap-subgroup-assignments (Chronos per-ModelID cohort_size)
      min_n_required: 30
    rationale: |
      The queried molecular subtype shows a MEASURED absence of CRISPR
      dependency on the target (median Chronos in the not-dependent band, on a
      cohort that clears the subgroup-n floor of 30). Because the row is
      floor-cleared this is a trusted negative, not an unknown — the target is
      genuinely not required for survival in this subtype's cell models.
      Nominating the target for THIS subtype therefore lacks an on-target
      efficacy basis. Subtype-scoped (→ hold, not veto): the target may remain a
      valid dependency in other subtypes of the same indication.

  # POSITIVE subtype-restricted dependency (2026-08-19, subtype-verdict-shifting review §5) — the
  # positive counterpart of subtype-non-dependence-opposing. This intentionally REVISES the prior
  # "positive subtype findings stay descriptive" stance for the STRONG, floor-cleared case ONLY: a
  # MEASURED strong CRISPR dependency confined to a molecular subtype IS a precision-oncology
  # nomination basis (POU2F3/SCLC-P; CMS4/CRC). It closes the population-DEFINITION asymmetry — a
  # genomically-defined subgroup could already positively nominate via biomarker_stratified_dependency,
  # but a transcriptional subtype could previously only HOLD. Emits subtype_fit_genomic: supportive →
  # _subtype_verdict maps it to subtype_restricted_dependency → the nomination gate treats it as a
  # SUPPORTIVE positive + a non_dependent veto-suppressor (never dominant — subtype strata are thinner
  # + noisier than a mutation call). Opt-in-by-scope: only fires under --subtypes; pooled spine unchanged.
  - rule_id: subtype-restricted-dependency-supportive
    when:
      card_id: subgroup-stratified-dependency
      field: per_subgroup_metrics
      in_record:
        class: strong_dependency
        evidence_state: measured
        subgroup_n_floor_met: true
    signals:
      subtype_fit_genomic: supportive
    tier: subtype
    subgroup_metadata_declared:
      subtype_defining_data: genomic
      subgroup_n_source: depmap-subgroup-assignments (Chronos per-ModelID cohort_size)
      min_n_required: 30
    rationale: |
      The queried molecular subtype shows a MEASURED strong CRISPR dependency on the target (median
      Chronos in the strong-dependency band, on a cohort that clears the subgroup-n floor of 30).
      Because the row is floor-cleared this is a trusted positive, not an unknown — the target is
      genuinely required for survival in this subtype's cell models, even where the pooled pan-cancer
      read dilutes to non_dependent. The subtype label (+ its classifier assay) is the patient-selection
      biomarker. SUPPORTIVE (not dominant): a subtype cell-line stratum is thinner + noisier than a
      mutation-defined stratum, so it rescues a diluted pooled negative / raises confidence but never
      mints a nominate alone. Subtype-scoped: nominates FOR this subtype, not pan-subtype.

  # The EFFECT-ADMISSIBLE complement (2026-08-20, Part-8 Step-3): an intrinsically-small
  # transcriptional subtype (e.g. SCLC-P/POU2F3, ~5 DepMap lines) can never clear the n>=30
  # floor, so evidence_state is "underpowered" and the rule above (which requires "measured")
  # will not match. This rule admits that stratum ONLY when the effect is tight enough to trust:
  # subgroup_effect_admissible (n >= MIN_N_EFFECT_ADMISSIBLE AND >= EFFECT_STRONG_FRAC of lines
  # in the strong band, per depmap_chronos) — an effect-size gate, NOT "just a lower N". It emits
  # the SAME supportive signal → subtype_restricted_dependency. Keyed on evidence_state:
  # underpowered, so it is DISJOINT from the floor-cleared rule (measured) — no double-fire.
  # Still SUPPORTIVE only (capped in the gate: never dominant, never alone-sufficient to nominate),
  # because a 5-line stratum is thinner than a mutation-defined one even when overwhelmingly strong.
  - rule_id: subtype-restricted-dependency-underpowered-supportive
    when:
      card_id: subgroup-stratified-dependency
      field: per_subgroup_metrics
      in_record:
        class: strong_dependency
        evidence_state: underpowered
        subgroup_effect_admissible: true
    signals:
      subtype_fit_genomic: supportive
    tier: subtype
    subgroup_metadata_declared:
      subtype_defining_data: genomic
      subgroup_n_source: depmap-subgroup-assignments (Chronos per-ModelID cohort_size)
      min_n_required: 3
    rationale: |
      The queried molecular subtype is intrinsically small (below the subgroup-n floor of 30, so the
      pooled read tags it `underpowered`) BUT its measured CRISPR dependency is effect-admissible: the
      stratum has at least the effect-admissibility minimum of cell lines and an overwhelming fraction
      of them fall in the strong-dependency band (a tight, one-directional effect, not a noisy mean on
      thin data). This is the SCLC-P/POU2F3 case — ~5 tuft-cell SCLC lines, nearly all strongly
      dependent — where a hard n>=30 floor would silently discard a genuine, clean precision-oncology
      signal. Admitted as SUPPORTIVE (never dominant, never alone-sufficient): the effect gate earns
      the stratum a seat at the table, but a 5-line cohort must corroborate, not nominate on its own.
      The subtype label (+ its classifier assay) is the patient-selection biomarker. Subtype-scoped:
      nominates FOR this subtype, not pan-subtype.

  # ----------------------------------------------------------------------------
  # SUBTYPE TIER — EXPRESSION (presence) context, 2026-07-22
  # ----------------------------------------------------------------------------
  # The expression analogue of subtype-non-dependence, but with a CRUCIAL semantic
  # difference: expression is PRESENCE, not efficacy. A subtype-specific expression
  # signal is CONTEXT for patient-selection — it must NEVER veto or hold. So these
  # rules emit `subtype_fit_expression: neutral` ("informational, no fit-level
  # effect", per the signal_vocabulary) on a channel the nomination gate has NO
  # mapping for → they surface in the panorama render + reach the LLM as context,
  # but cannot ratchet the verdict. This preserves the one-directional gate exactly:
  #   - dependency subtype signal CAN hold (a measured efficacy gap forecloses a subtype)
  #   - expression subtype signal CANNOT — lower/higher presence in a subtype is a
  #     patient-selection nuance, not an efficacy verdict.
  # All three fire only on a MEASURED + floor-cleared stratum (in_record admissibility
  # guard: an underpowered row fails the match → INADMISSIBLE by construction, the
  # same discipline as subtype-non-dependence). subtype_uniform deliberately gets NO
  # rule — "no stratum-specific signal" is the descriptive default, nothing to surface.
  - rule_id: subtype-expression-enriched-context
    when:
      card_id: tumor-rna-distribution-by-subtype
      field: per_subgroup_metrics
      in_record:
        subtype_signal: subtype_enriched
        evidence_state: measured
        subgroup_n_floor_met: true
    signals:
      subtype_fit_expression: neutral
    tier: subtype
    subgroup_metadata_declared:
      subtype_defining_data: expression
      subgroup_n_source: tcga-subgroup-assignments (per-sample TCGA tumor TPM within stratum member-set, UUID↔barcode bridge)
      min_n_required: 30
    rationale: |
      The target's RNA is ENRICHED in this molecular subtype vs the indication's
      pooled distribution (stratum median ≥ pooled + the enrichment delta, on a
      cohort that clears the subgroup-n floor of 30). Context for PATIENT SELECTION —
      the subtype is a candidate enriched-expression population. NOT verdict-affecting:
      expression is presence, not efficacy, so a subtype-specific abundance signal
      raises where-to-look, never the nomination itself (one-directional gate).

  - rule_id: subtype-expression-restricted-context
    when:
      card_id: tumor-rna-distribution-by-subtype
      field: per_subgroup_metrics
      in_record:
        subtype_signal: subtype_restricted
        evidence_state: measured
        subgroup_n_floor_met: true
    signals:
      subtype_fit_expression: neutral
    tier: subtype
    subgroup_metadata_declared:
      subtype_defining_data: expression
      subgroup_n_source: tcga-subgroup-assignments (per-sample TCGA tumor TPM within stratum member-set, UUID↔barcode bridge)
      min_n_required: 30
    rationale: |
      The target is DETECTABLE in this subtype while broadly absent in the pooled
      indication (present in the stratum, off pooled). The strongest patient-selection
      context this card produces — a subtype-restricted presence population. Still
      CONTEXT only (subtype_fit_expression: neutral): it sharpens who to treat, it
      does not mint or oppose a nomination. Efficacy remains the dependency gate's job.

  - rule_id: subtype-expression-depleted-context
    when:
      card_id: tumor-rna-distribution-by-subtype
      field: per_subgroup_metrics
      in_record:
        subtype_signal: subtype_depleted
        evidence_state: measured
        subgroup_n_floor_met: true
    signals:
      subtype_fit_expression: neutral
    tier: subtype
    subgroup_metadata_declared:
      subtype_defining_data: expression
      subgroup_n_source: tcga-subgroup-assignments (per-sample TCGA tumor TPM within stratum member-set, UUID↔barcode bridge)
      min_n_required: 30
    rationale: |
      The target's RNA is DEPLETED in this subtype vs pooled (stratum median ≤ pooled −
      the delta, floor-cleared). Context that this subtype is a POORER expression
      population — relevant to patient selection / de-selection. Deliberately NOT
      opposing: unlike a measured dependency gap (which forecloses a subtype → hold),
      lower presence is not an efficacy verdict — a low-but-present target can still be
      a valid modality substrate. subtype_fit_expression: neutral (context, no gate effect).

  # ============================================================================
  # SYNTHETIC-LETHAL PARTNERS (SynLethDB v3, Gate-C step 2, 2026-07-20)
  # ============================================================================
  # Curated SL-partner ANNOTATION → sub-verdict the nomination gate's veto-suppressor
  # keys on. These rules map the synthetic-lethal-partners card's sl_partner_class to
  # the rule_ids the sub-skill _verdict resolves. The GATE ACTION (suppress the
  # dependency non_dependent veto) is driven by the (synthetic_lethal_partners,
  # has_experimental_sl_partner) tuple in nomination_verdict_gate.yaml veto_suppressors
  # — NOT by these signals (which stay advisory). ANNOTATION: never nominates.

  - rule_id: sl-experimental-partner-context-conditional
    when:
      card_id: synthetic-lethal-partners
      field: sl_partner_class
      equals: has_experimental_sl_partner
    signals:
      small_molecule: supportive
      degrader: supportive
    rationale: |
      Target has an experimentally-supported curated SL partner (SynLethDB v3, CRISPR/
      RNAi/throughput screen). A pooled pan-cancer non_dependent CRISPR read is a
      CONTEXT-CONDITIONAL false negative — the target may be a genuine dependency once
      the partner is altered (SMARCA2←SMARCA4-loss). Drives the gate veto-suppressor
      (dependency:non_dependent → insufficient). ANNOTATION: suppresses a veto, does
      NOT nominate. Signals are advisory-supportive (a druggable context-SL target is
      an SM/degrader opportunity IN the partner-altered context), not a positive-tier
      nomination.

  - rule_id: sl-computational-partner-informational
    when:
      card_id: synthetic-lethal-partners
      field: sl_partner_class
      equals: has_computational_sl_partner
    signals:
      small_molecule: neutral
      degrader: neutral
    rationale: |
      Curated SL partner(s) exist but only from computational prediction — too weak to
      suppress a measured pooled negative. Surfaced for context (the gate suppressor
      requires an EXPERIMENTAL partner, so this class does NOT fire it). Neutral.

  - rule_id: sl-no-partner-neutral
    when:
      card_id: synthetic-lethal-partners
      field: sl_partner_class
      equals: no_curated_sl_partner
    signals:
      small_molecule: neutral
      degrader: neutral
    rationale: |
      Gene is in the SynLethDB universe with no curated SL partner — a real negative
      read (NOT data_unavailable). No context-conditional escape for a pooled negative;
      neutral (does not suppress, does not oppose).

  - rule_id: sl-data-unavailable-insufficient
    when:
      card_id: synthetic-lethal-partners
      field: sl_partner_class
      equals: data_unavailable
    signals:
      small_molecule: insufficient
      degrader: insufficient
    rationale: |
      SL-partner derived product unreachable. Coverage gap; not opposing evidence.

  # ============================================================================
  # tumor_elevation_breadth (Slice B, 2026-07-21) — pan-cancer presence breadth
  # ============================================================================
  # The TARGET-GRAIN presence signal (card tumor-elevation-breadth, measurement
  # bulk_protein_ms x sample_context tumor). It is the ONE tumor-context card that
  # can fire in a TARGET-ONLY query — CPTAC per-cohort + tumor-vs-adjacent both need
  # an indication, but breadth rolls up over all cohorts. Adding these rules is what
  # makes the bulk_protein_ms/tumor per-modality bucket read `measured` (not
  # data_unavailable) in a target-only run — completing the degenerate-case fix
  # (Slice A1/A2). Without a rule the card would be decision-inert (the 2026-07-14
  # "emitted-but-un-ruled" lesson). Signals mirror the CPTAC protein-presence family:
  # breadth is presence-SUPPORTIVE, never a killer (absence-of-elevation is not
  # absence-of-protein). BREADTH ≠ SELECTIVITY: these say "elevated in many cancers",
  # not "selective in this one" — selectivity lives in the tumor-vs-normal cards.

  - rule_id: tumor-breadth-broadly-supportive
    when:
      card_id: tumor-elevation-breadth
      field: tumor_elevation_breadth_class
      equals: broadly_tumor_elevated
    signals:
      small_molecule: supportive
      degrader: supportive
    rationale: |
      Target protein is elevated vs normal in >=3 CPTAC cohorts AND in >=50% of the
      cohorts it was tested in — pan-cancer tumor-presence breadth. Confirms measurable,
      tumor-elevated PROTEIN across multiple cancers; supportive for both modalities.
      Not dominant: breadth is a presence signal, not selectivity-in-this-indication
      (that lives in tumor-protein-abundance-cptac + tumor-vs-normal-selectivity).

  - rule_id: tumor-breadth-multi-supportive
    when:
      card_id: tumor-elevation-breadth
      field: tumor_elevation_breadth_class
      equals: multi_tumor_elevated
    signals:
      small_molecule: supportive
      degrader: supportive
    rationale: |
      Target protein is elevated in >=2 CPTAC cohorts (but below the broadly threshold).
      Multi-cancer tumor-presence — supportive presence evidence, weaker than broadly.

  - rule_id: tumor-breadth-single-neutral
    when:
      card_id: tumor-elevation-breadth
      field: tumor_elevation_breadth_class
      equals: single_tumor_elevated
    signals:
      small_molecule: neutral
      degrader: neutral
    rationale: |
      Target protein is elevated in exactly ONE CPTAC cohort — an indication-specific
      signal, not pan-cancer breadth. Neutral for a breadth claim (the per-indication
      tumor-protein-abundance-cptac card carries the single-cancer signal); the card's own
      single_cohort_breadth warning flags not to over-generalize.

  - rule_id: tumor-breadth-not-elevated-neutral
    when:
      card_id: tumor-elevation-breadth
      field: tumor_elevation_breadth_class
      equals: not_tumor_elevated
    signals:
      small_molecule: neutral
      degrader: neutral
    rationale: |
      Measured negative: tested in >=1 CPTAC cohort, elevated in NONE. This is a real
      negative for the tumor-ELEVATION claim, but NOT for protein presence (an
      un-elevated protein may still be abundantly present) — so neutral, never a
      killer. Do not read as absence-of-protein.

  - rule_id: tumor-breadth-data-unavailable-insufficient
    when:
      card_id: tumor-elevation-breadth
      field: tumor_elevation_breadth_class
      equals: data_unavailable
    signals:
      small_molecule: insufficient
      degrader: insufficient
    rationale: |
      Target not quantified in any CPTAC cohort (CPTAC covers 10 cohorts). Coverage
      gap, NOT opposing evidence — distinct from not_tumor_elevated (a measured negative).

  # ============================================================================
  # RNA tumor-elevation BREADTH (Slice C parallel layer) — added 2026-08-11 (G3 fix)
  # ----------------------------------------------------------------------------
  # tumor-elevation-breadth emits a SECOND breadth layer alongside the primary protein one:
  # rna_tumor_elevation_breadth_class (pan-cancer DESeq2, 27 indications vs CPTAC's 10). It was
  # EMITTED but UN-RULED — decision-inert, the exact 2026-07-14 "emitted-but-un-ruled" failure the
  # protein breadth rules above were written to avoid. These mirror the protein signal semantics
  # (breadth is presence-SUPPORTIVE, never a killer; BREADTH ≠ SELECTIVITY). PARALLEL layer by the
  # card's own design (protein primary/driving, RNA co-surfaced) — the tumor-presence skill reads
  # these as a verdict-inert headline facet (rna_tumor_elevation_breadth_class +
  # breadth_layer_concordance), NOT as a rung in the presence collapsed ladder (the protein breadth
  # already occupies the breadth rungs). RNA's wider coverage makes breadth_layer_concordance ==
  # rna_only the decision-relevant case: a protein-coverage-gap breadth that would otherwise vanish.
  - rule_id: rna-tumor-breadth-broadly-supportive
    when:
      card_id: tumor-elevation-breadth
      field: rna_tumor_elevation_breadth_class
      equals: broadly_tumor_elevated
    signals:
      small_molecule: supportive
      degrader: supportive
    rationale: |
      Target RNA is elevated vs normal in >=3 indications AND in >=50% of those tested —
      pan-cancer RNA tumor-presence breadth over 27 indications. Presence-supportive, parallel
      to the protein breadth broadly rule; surfaced as a facet, not a ladder rung.

  - rule_id: rna-tumor-breadth-multi-supportive
    when:
      card_id: tumor-elevation-breadth
      field: rna_tumor_elevation_breadth_class
      equals: multi_tumor_elevated
    signals:
      small_molecule: supportive
      degrader: supportive
    rationale: |
      Target RNA is elevated in >=2 indications (below the broadly threshold). Multi-cancer RNA
      tumor-presence — supportive presence evidence, weaker than broadly.

  - rule_id: rna-tumor-breadth-single-neutral
    when:
      card_id: tumor-elevation-breadth
      field: rna_tumor_elevation_breadth_class
      equals: single_tumor_elevated
    signals:
      small_molecule: neutral
      degrader: neutral
    rationale: |
      Target RNA is elevated in exactly ONE indication — indication-specific, not pan-cancer
      breadth. Neutral for a breadth claim (the per-indication tumor-rna cards carry the
      single-cancer signal).

  - rule_id: rna-tumor-breadth-not-elevated-neutral
    when:
      card_id: tumor-elevation-breadth
      field: rna_tumor_elevation_breadth_class
      equals: not_tumor_elevated
    signals:
      small_molecule: neutral
      degrader: neutral
    rationale: |
      Measured negative: RNA-tested in >=1 indication, elevated in NONE. A real negative for the
      tumor-ELEVATION claim, but NOT for RNA presence (an un-elevated transcript may still be
      abundantly present) — so neutral, never a killer.

  - rule_id: rna-tumor-breadth-data-unavailable-insufficient
    when:
      card_id: tumor-elevation-breadth
      field: rna_tumor_elevation_breadth_class
      equals: data_unavailable
    signals:
      small_molecule: insufficient
      degrader: insufficient
    rationale: |
      Target absent from the pan-cancer RNA breadth product. Coverage gap, NOT opposing evidence —
      distinct from not_tumor_elevated (a measured negative).

  # ============================================================================
  # RNA↔PROTEIN CONCORDANCE (Q5, rna_as_biomarker; cell-line arm) — 2026-07-22
  # ============================================================================
  # The rna_as_biomarker question: does RNA track PROTEIN, so an RNA-only presence/dependency read is
  # trustworthy? These are the BIOLOGY-AXIS signals — a proxy-QUALITY qualifier on the intracellular
  # (SM/degrader) evidence, NOT a target killer (a poor proxy means "measure protein", not "bad
  # target"). Signals are deliberately MODEST (neutral / mildly supportive): concordance is a
  # confidence modifier on the presence/dependency read, not a primary driver.
  #
  # SCOPE (deliberate, P4 boundary): the MODALITY-GATE facet of Q5 — poor_proxy → an ADC/TCE caution
  # (biologics need PROTEIN, RNA is an inadequate surface-antigen proxy) — is NOT wired here. That is a
  # surface-modality-gate signal routed through adc-tce-modality-fit's fit_class composition (a
  # different axis), sequenced with P4 modality-vector emission. Here we wire ONLY the intracellular
  # biology-axis read. Wiring the ADC caution as a direct rule now would strand it on the wrong axis.
  - rule_id: rna-protein-adequate-proxy-supportive
    when:
      card_id: cellline-rna-protein-concordance
      field: rna_as_biomarker
      equals: adequate_proxy
    signals:
      small_molecule: supportive
      degrader: supportive
    rationale: |
      RNA tracks protein tightly (Pearson >= strong_concordance_r) across paired cell-line models —
      RNA is an ADEQUATE proxy for protein presence. Mildly SUPPORTIVE: it means the RNA-based
      presence + expression→dependency reads (which the framework leans on heavily) are trustworthy
      for this target, so the intracellular evidence stands without a protein-confirmation caveat.
      Not a primary driver — a confidence qualifier on the other expression cards.

  - rule_id: rna-protein-partial-proxy-neutral
    when:
      card_id: cellline-rna-protein-concordance
      field: rna_as_biomarker
      equals: partial_proxy
    signals:
      small_molecule: neutral
      degrader: neutral
    rationale: |
      RNA↔protein correlation is moderate (moderate_concordance_r .. strong_concordance_r): RNA is a
      PARTIAL proxy. Neutral — the RNA presence/dependency read is usable but carries some
      post-transcriptional slack, so it neither strengthens nor undercuts the intracellular call.
      Interpret RNA-based abundance with mild caution; a protein spot-check is informative but not required.

  - rule_id: rna-protein-poor-proxy-neutral
    when:
      card_id: cellline-rna-protein-concordance
      field: rna_as_biomarker
      equals: poor_proxy
    signals:
      small_molecule: neutral
      degrader: neutral
    rationale: |
      RNA does NOT predict protein (correlation below moderate_concordance_r) — RNA is a POOR proxy.
      This is a MEASUREMENT caution, NOT a target killer: an RNA-only presence/dependency read is
      unreliable for this target and protein should be measured directly. Neutral on the biology axis
      (the target may be perfectly valid protein-confirmed), NOT opposing. NB: the sharper consequence
      is on the MODALITY axis (poor_proxy → ADC/TCE need protein, not RNA) — that routes through
      adc-tce-modality-fit at the surface-modality gate (P4), deliberately NOT a direct rule here.

  - rule_id: rna-protein-insufficient-paired-models-insufficient
    when:
      card_id: cellline-rna-protein-concordance
      field: rna_as_biomarker
      equals: insufficient_paired_models
    signals:
      small_molecule: insufficient
      degrader: insufficient
    rationale: |
      Fewer than min_paired_models cell lines have BOTH RNA and Gygi-MS protein for this target —
      the correlation is underpowered. Coverage gap, not opposing evidence; the concordance question
      is simply unanswerable here (distinct from poor_proxy, a measured discordance).

  - rule_id: rna-protein-concordance-data-unavailable-insufficient
    when:
      card_id: cellline-rna-protein-concordance
      field: rna_as_biomarker
      equals: data_unavailable
    signals:
      small_molecule: insufficient
      degrader: insufficient
    rationale: |
      Target absent from the Gygi MS panel (~12.5k proteins) or DepMap RNA — no paired data to assess
      RNA-as-proxy. Coverage gap (panel coverage, not biology); not used as opposing evidence.

  # ============================================================================
  # EXPRESSION PURITY CONFOUND (Q9 — is the tumor presence signal tumor-intrinsic?) — 2026-07-23
  # ============================================================================
  # Does target tumor expression correlate with tumor PURITY (ABSOLUTE)? A CAVEAT on the tumor
  # presence read, on the biology axis. Signals are MODEST (mildly supportive / neutral / mild caution)
  # — a purity-confound flag is a confidence qualifier on presence, never a primary driver and never a
  # killer (bulk cannot resolve cell-of-origin; the flag guides interpretation).
  #
  # SCOPE (deliberate, P4 boundary): the sharp consequence of microenvironment_confounded is on the
  # ADC/TCE MODALITY axis (antigen reality — is the antigen on the cancer cell?). That routes through
  # the surface-modality gate (P4), NOT a direct rule here. This wires the intracellular biology-axis
  # presence caveat only.
  - rule_id: purity-tumor-intrinsic-supportive
    when:
      card_id: expression-purity-confound
      field: purity_confound_class
      equals: tumor_intrinsic
    signals:
      small_molecule: supportive
      degrader: supportive
    rationale: |
      Target expression rises with tumor PURITY (significant positive correlation) — the tumor
      presence signal is TUMOR-CELL-INTRINSIC, not microenvironment-derived. Mildly SUPPORTIVE: it
      confirms the presence read reflects the cancer cells (a confidence qualifier on Presence), not
      a primary driver. Reassuring for any modality that needs the target ON the tumor cell.

  - rule_id: purity-independent-neutral
    when:
      card_id: expression-purity-confound
      field: purity_confound_class
      equals: purity_independent
    signals:
      small_molecule: neutral
      degrader: neutral
    rationale: |
      Target expression is not significantly correlated with tumor purity (either direction). No
      confound signal — the presence read is neither confirmed tumor-intrinsic nor flagged as
      microenvironment-derived. Neutral; in high-purity cohorts the purity range may simply be too
      narrow to resolve a confound (read median_purity alongside).

  - rule_id: purity-microenvironment-confounded-neutral
    when:
      card_id: expression-purity-confound
      field: purity_confound_class
      equals: microenvironment_confounded
    signals:
      small_molecule: neutral
      degrader: neutral
    rationale: |
      Target expression is HIGHER in LOW-purity tumors (significant negative correlation) — the bulk
      tumor presence signal is likely STROMAL / IMMUNE-derived, not tumor-cell-intrinsic. A CAUTION on
      the presence read (the "tumor expression" may be inflated by microenvironment), NOT a killer:
      the target may still be validly tumor-expressed at a lower level (needs single-cell / IHC to
      confirm). Neutral on the biology axis; the sharper consequence is on the ADC/TCE modality axis
      (antigen reality), which routes through the surface-modality gate (P4), not a direct rule here.

  - rule_id: purity-confound-insufficient
    when:
      card_id: expression-purity-confound
      field: purity_confound_class
      equals: insufficient_paired_samples
    signals:
      small_molecule: insufficient
      degrader: insufficient
    rationale: |
      Fewer than the minimum tumors have BOTH per-sample expression and ABSOLUTE purity — the
      confound correlation is underpowered. Coverage gap, not opposing evidence.

  - rule_id: purity-confound-data-unavailable-insufficient
    when:
      card_id: expression-purity-confound
      field: purity_confound_class
      equals: data_unavailable
    signals:
      small_molecule: insufficient
      degrader: insufficient
    rationale: |
      No per-sample tumor expression or no ABSOLUTE purity for this (target, indication). Coverage
      gap; not used as opposing evidence.

  # ============================================================================
  # EXPRESSION CLINICAL ASSOCIATION (Q11 — does expression stratify survival?) — 2026-07-23
  # ============================================================================
  # Median-split OS log-rank by target expression. A PROGNOSTIC-context signal on the biology axis.
  # HYPOTHESIS-GENERATING (univariate/unadjusted), so signals are MODEST — a prognostic association is
  # a confidence/context qualifier + biomarker-facet input, NEVER a primary driver and never a killer
  # (survival is stage-dominated; a single-gene split needs multivariable + orthogonal validation).
  - rule_id: clinical-high-worse-survival-supportive
    when:
      card_id: expression-clinical-association
      field: survival_association_class
      equals: expression_high_worse_survival
    signals:
      small_molecule: supportive
      degrader: supportive
    rationale: |
      High target expression associates with WORSE overall survival (significant median-split
      log-rank). A candidate POOR-PROGNOSIS / more-aggressive-disease marker — mildly SUPPORTIVE: it
      strengthens the disease-relevance + patient-selection rationale (target-high patients have worse
      outcomes, the population that most needs a therapy). Univariate/exploratory (see caveats), a
      confidence qualifier + biomarker-facet input, not a primary driver.

  - rule_id: clinical-high-better-survival-neutral
    when:
      card_id: expression-clinical-association
      field: survival_association_class
      equals: expression_high_better_survival
    signals:
      small_molecule: neutral
      degrader: neutral
    rationale: |
      High target expression associates with BETTER overall survival (significant). A CAUTION for the
      prognostic rationale — the target may mark INDOLENT disease, so a target-high population is not
      obviously the highest-unmet-need group. Neutral (NOT opposing — expression-survival direction
      does not determine druggability); a context flag for patient-selection framing, read alongside
      dependency + genomic evidence.

  - rule_id: clinical-no-survival-association-neutral
    when:
      card_id: expression-clinical-association
      field: survival_association_class
      equals: no_survival_association
    signals:
      small_molecule: neutral
      degrader: neutral
    rationale: |
      Target expression does not significantly stratify overall survival in this indication. No
      prognostic signal from this axis — neutral (a target can be a valid dependency / antigen without
      a prognostic expression association; survival is stage-dominated).

  - rule_id: clinical-insufficient-survival-data-insufficient
    when:
      card_id: expression-clinical-association
      field: survival_association_class
      equals: insufficient_survival_data
    signals:
      small_molecule: insufficient
      degrader: insufficient
    rationale: |
      Too few deaths (events) or too small per-expression arms for a meaningful log-rank. Coverage /
      power gap, not opposing evidence.

  - rule_id: clinical-survival-data-unavailable-insufficient
    when:
      card_id: expression-clinical-association
      field: survival_association_class
      equals: data_unavailable
    signals:
      small_molecule: insufficient
      degrader: insufficient
    rationale: |
      No per-sample tumor expression or no TCGA-CDR survival for this (target, indication). Coverage
      gap; not used as opposing evidence.

  # ============================================================================
  # PHOSPHO PATHWAY ACTIVITY (Q8 — target biology at the phospho level) — 2026-07-23
  # ============================================================================
  # From CPTAC phospho: is the target phosphorylated (pathway-activity proxy), beyond total abundance?
  # A PROTEIN/PATHWAY-level presence signal on the biology axis — for kinases/signaling proteins the
  # sharpest presence read (phospho-activity > total abundance). Signals modest; not a killer.
  - rule_id: phospho-active-supportive
    when:
      card_id: phospho-pathway-activity
      field: phospho_activity_class
      equals: phospho_active
    signals:
      small_molecule: supportive
      degrader: supportive
    dominant: true
    rationale: |
      Target is PHOSPHORYLATED beyond its total abundance across a substantial fraction of tumors —
      evidence of ACTIVE signaling / pathway activation, not mere presence. For a kinase / signaling
      protein this is the strongest protein-level presence + mechanism signal (the pathway is ON, the
      target is engaged). Dominant-supportive: an active, engaged signaling target is a strong
      small-molecule / degrader rationale.

  - rule_id: phospho-present-supportive
    when:
      card_id: phospho-pathway-activity
      field: phospho_activity_class
      equals: phospho_present
    signals:
      small_molecule: supportive
      degrader: supportive
    rationale: |
      Target is phosphorylated + detected at the protein level (phosphosites present in a substantial
      fraction of tumors), but tracking its abundance rather than exceeding it — PRESENT and
      protein-confirmed, not clearly hyper-activated. Mildly supportive: confirms protein-level
      presence (a degrader/SM needs the protein to exist), a notch below phospho_active.

  - rule_id: phospho-low-neutral
    when:
      card_id: phospho-pathway-activity
      field: phospho_activity_class
      equals: phospho_low
    signals:
      small_molecule: neutral
      degrader: neutral
    rationale: |
      Phosphosites exist in the panel but are detected in few tumors — weak phospho-level signal.
      Neutral (MS detection-limit may undercount; low detection is not proof of no phosphorylation),
      not opposing.

  - rule_id: phospho-not-phosphoprotein-neutral
    when:
      card_id: phospho-pathway-activity
      field: phospho_activity_class
      equals: not_phosphoprotein
    signals:
      small_molecule: neutral
      degrader: neutral
    rationale: |
      The target has NO phosphosites in the CPTAC panel — it is not a phosphoprotein (e.g. a GTPase
      like KRAS, regulated by nucleotide exchange). The phospho axis genuinely DOES NOT APPLY; neutral
      (informational — read presence from the total-protein + RNA cards instead), NEVER opposing. A
      real biological fact, distinct from data_unavailable.

  - rule_id: phospho-data-unavailable-insufficient
    when:
      card_id: phospho-pathway-activity
      field: phospho_activity_class
      equals: data_unavailable
    signals:
      small_molecule: insufficient
      degrader: insufficient
    rationale: |
      No CPTAC cohort for the indication, or a phospho read failure. Coverage gap; not opposing evidence.

  # ============================================================================
  # P5 Slice 2 — gene-burden-safety card (human-genetics LoF-tolerance)
  # The full-KO safety signal from population rare-variant burden. Fires on the intracellular
  # axis (SM/degrader = the full-inhibition modalities the WT-loss concern bears on). NOT YET
  # resolver-referenced (byte-stable this slice); safety.resolver.yaml wires it in Slice 5,
  # composed with the mutant-selective mechanism-conditioning downgrade.
  # ============================================================================

  - rule_id: gene-burden-lof-safety-warning
    when:
      card_id: gene-burden-safety
      field: burden_safety_class
      equals: lof_risk_phenotype
    signals:
      small_molecule: opposing
      degrader: opposing
    dominant: true
    rationale: |
      Population rare-variant burden shows LoF variants INCREASE disease risk (directionOnTrait=risk
      on a uniformly LoF-on-target association). Losing this gene's function is harmful at population
      scale — an on-target safety concern for a full-KO modality (degrader, RNA therapeutic, full-
      inhibition SM). Opposing + dominant, mirroring the gnomAD highly-constrained rung. NOTE: for a
      MUTANT-SELECTIVE therapy against an activating driver, the WT protein this concerns is spared —
      the resolver's mechanism-conditioning downgrade (Slice 5) nullifies this via when_all_fired with
      the activating-driver-role-safety-context rule (parallel to wt_constraint_mechanism_mismatch).

  - rule_id: gene-burden-protective-favorable
    when:
      card_id: gene-burden-safety
      field: burden_safety_class
      equals: protective
    signals:
      small_molecule: supportive
      degrader: supportive
    rationale: |
      Population rare-variant burden shows LoF variants are PROTECTIVE against disease
      (directionOnTrait=protect). Loss of function is beneficial at population scale — a drug-POSITIVE
      human-genetics signal (the strongest kind of target-validation: nature's own knockout is
      protective). Supportive for the full-inhibition modalities. Contrast lof_risk_phenotype.

  # ============================================================================
  # P5 Slice 3 — clingen-dosage card (haploinsufficiency dosage-sensitivity)
  # Intracellular axis (SM/degrader = the full-inhibition modalities the single-copy-loss concern
  # bears on). NOT yet resolver-referenced (byte-stable); Slice 5 wires clingen-dominant-loss-safety-
  # warning composed with the mutant-selective downgrade.
  # ============================================================================

  - rule_id: clingen-dominant-loss-safety-warning
    when:
      card_id: clingen-dosage
      field: dosage_sensitivity_class
      equals: autosomal_dominant_loss
    signals:
      small_molecule: opposing
      degrader: opposing
    dominant: true
    rationale: |
      ClinGen shows single-copy loss is pathogenic (a high-confidence autosomal-dominant gene-disease
      association = haploinsufficiency). Losing one allele suffices for disease, so a full-KO modality
      (degrader, RNA therapeutic, full-inhibition SM) risks recapitulating a haploinsufficiency
      phenotype systemically. Opposing + dominant, mirroring the gnomAD + gene-burden safety rungs.
      NOTE: a MUTANT-SELECTIVE therapy against an activating driver spares the WT copy this concern is
      about — the resolver's mechanism-conditioning downgrade (Slice 5) nullifies it via when_all_fired
      with activating-driver-role-safety-context (parallel to wt_constraint_mechanism_mismatch).

  - rule_id: clingen-dosage-sufficient-neutral
    when:
      card_id: clingen-dosage
      field: dosage_sensitivity_class
      equals: dosage_sufficient
    signals:
      small_molecule: neutral
      degrader: neutral
    rationale: |
      ClinGen high-confidence associations are exclusively RECESSIVE — disease requires loss of BOTH
      copies, so single-allele reduction (or a partial-inhibition therapy) is better tolerated. Neutral,
      not supportive: recessive gene-disease validity is a lower single-allele safety concern, but not
      positive evidence of safety on its own. Contrast autosomal_dominant_loss.

  # ============================================================================
  # P5 Slice 4 — mouse-ko-phenotype card (developmental-guardrailed KO safety)
  # Intracellular axis (SM/degrader). INFERRED tier: lethal_ko fires OPPOSING (a caution), NOT a
  # killer — mouse is a model. developmental_only is explicitly NEUTRAL (the guardrail: embryonic
  # lethality is not adult tox). NOT yet resolver-referenced (byte-stable); Slice 5 wires lethal_ko.
  # ============================================================================

  - rule_id: mouse-ko-lethal-safety-warning
    when:
      card_id: mouse-ko-phenotype
      field: ko_phenotype_class
      equals: lethal_ko
    signals:
      small_molecule: opposing
      degrader: opposing
    rationale: |
      Mouse ADULT/postnatal knockout is lethal — an adult-essential-function signal (death after
      weaning, not merely developmental). On-target safety caution for a full-KO modality (degrader,
      RNA, full-inhibition SM). OPPOSING but NOT dominant and NOT a killer: mouse KO is INFERRED
      evidence (a model of human physiology), so it cautions rather than vetoes — contrast the
      measured gnomAD / gene-burden / ClinGen rungs which may be dominant. Composes with the
      mutant-selective downgrade (Slice 5): an activating driver drugged mutant-selectively spares WT.

  - rule_id: mouse-ko-developmental-only-neutral
    when:
      card_id: mouse-ko-phenotype
      field: ko_phenotype_class
      equals: developmental_only
    signals:
      small_molecule: neutral
      degrader: neutral
    rationale: |
      Mouse knockout is lethal ONLY at developmental stages (embryonic/prenatal/perinatal/neonatal/
      preweaning), NOT postnatally. This is the DEVELOPMENTAL GUARDRAIL: an embryonic-essential role
      does NOT establish adult on-target toxicity (many developmentally-essential genes — KRAS, MYC,
      BRCA1 — are dispensable in adult tissue). NEUTRAL, never opposing: context, explicitly not a
      safety hold. Distinguishes a genuine adult-tox signal (lethal_ko) from a developmental artifact.

  # ============================================================================
  # P5 follow-on — clinvar-pathogenicity-safety card (4th germline safety leg)
  # Intracellular axis (SM/degrader). germline_pathogenic fires OPPOSING (a WT-loss safety signal,
  # corroborating gene-burden/clingen/mouse). NOT yet resolver-referenced here (byte-stable); the
  # resolver adds it to the human_genetics_safety_concern when_any_fired set + a mutant-selective
  # downgrade rung.
  # ============================================================================

  - rule_id: clinvar-germline-pathogenic-safety-warning
    when:
      card_id: clinvar-pathogenicity-safety
      field: clinvar_pathogenic_class
      equals: germline_pathogenic
    signals:
      small_molecule: opposing
      degrader: opposing
    rationale: |
      ClinVar carries confident GERMLINE pathogenic variants — curated evidence that losing/altering
      this gene's function causes heritable disease (a WT-loss safety signal for a full-KO modality).
      Corroborates the gene-burden / ClinGen-dosage / mouse-KO legs (a haploinsufficient tumor
      suppressor typically fires several). OPPOSING, not dominant: it is one of several corroborating
      germline legs, not a standalone veto. The germline guardrail is in the card — a SOMATIC
      pathogenic variant (somatic_only) is a cancer-driver signal, NOT this safety signal, and does
      NOT fire. Composes with the mutant-selective downgrade (Slice-5 pattern): an activating driver
      drugged mutant-selectively spares the WT protein this concerns.

  # ============================================================================
  # Roadmap #3 — domain-modality-relevance card → DEGRADER lens (verdict-wiring, 2026-08-07)
  # The domain→modality facet MOVES the degrader lens (tractability-small-molecule _degrader_snapshot,
  # which reads modality_lens(fired, "degrader")). DELIBERATELY degrader-channel ONLY: NO small_molecule
  # signal on any rule here, so the SM resolver + druggability_snapshot verdict spine stay byte-stable
  # (the SM resolver does not reference this card). Approved verdict-spine change (degrader lens only).
  #   removal_required_scaffolding -> degrader supportive + DOMINANT (strong_degrader_rationale):
  #       catalytic inhibition is insufficient; the scaffolding/non-catalytic function needs removal.
  #   removal_favored              -> degrader supportive (degrader_rationale)
  #   inhibitor_sufficient / context_dependent -> degrader NEUTRAL (no movement — inhibitor is the lever
  #       or the mechanism is undecided; the facet must not push degrader on a clean inhibitor target)
  #   data_unavailable             -> degrader insufficient (coverage gap, not evidence)
  # ============================================================================

  - rule_id: domain-modality-scaffolding-degrader-supportive-dominant
    when:
      card_id: domain-modality-relevance
      field: modality_implication_class
      equals: removal_required_scaffolding
    signals:
      degrader: supportive
    dominant: true
    rationale: |
      The target has a documented catalytic-INDEPENDENT / scaffolding function (curated
      domain_modality_targets.yaml — e.g. RIPK1's kinase-independent RHIM + death-domain necrosome
      assembly). A catalytic-site inhibitor addresses only part of the biology; a DEGRADER removes the
      whole protein, scaffold included — so removal is the mechanistically-favored modality. DOMINANT
      for the degrader lens: a scaffolding function is the canonical degrader rationale, strong enough
      to stand alone (-> strong_degrader_rationale). DEGRADER CHANNEL ONLY — the small-molecule verdict
      is untouched (an inhibitor may still address the catalytic arm; this does not oppose SM).

  - rule_id: domain-modality-removal-favored-degrader-supportive
    when:
      card_id: domain-modality-relevance
      field: modality_implication_class
      equals: removal_favored
    signals:
      degrader: supportive
    rationale: |
      The target's domain architecture favors removal over catalytic inhibition (a multi-domain enzyme
      whose interaction/regulatory domains carry biology inhibition leaves intact, or a non-catalytic
      class with no pocket to inhibit — e.g. a transcription factor). Supportive (not dominant) for the
      degrader lens: removal engages more of the biology than inhibition, but without a curated
      scaffolding claim it is one signal among several. DEGRADER CHANNEL ONLY — SM verdict untouched.

  - rule_id: domain-modality-inhibitor-sufficient-degrader-neutral
    when:
      card_id: domain-modality-relevance
      field: modality_implication_class
      equals: inhibitor_sufficient
    signals:
      degrader: neutral
    rationale: |
      A clean single-domain enzyme with no curated scaffolding caveat — catalytic-site inhibition is
      the natural lever. NEUTRAL for the degrader lens (explicitly not opposing): a degrader can still
      work, but the domain architecture gives it no positive rationale, and the facet must not push a
      degrader read on a target the inhibitor modality already addresses. Never touches SM.

  - rule_id: domain-modality-context-dependent-degrader-neutral
    when:
      card_id: domain-modality-relevance
      field: modality_implication_class
      equals: context_dependent
    signals:
      degrader: neutral
    rationale: |
      The inhibitor-vs-removal choice depends on the specific pathway/indication (curated
      context_dependent — e.g. EGFR/JAK2, validated catalytic inhibitors that ALSO have
      kinase-independent or incomplete-clonal-suppression arms). NEUTRAL: do not pre-commit the
      degrader lens either way; the mechanism is genuinely undecided at the domain level. Never touches SM.

  - rule_id: domain-modality-data-unavailable-degrader-insufficient
    when:
      card_id: domain-modality-relevance
      field: modality_implication_class
      equals: data_unavailable
    signals:
      degrader: insufficient
    rationale: |
      No curated/InterPro domain or protein-class signal to reason from — the domain→modality
      implication is unknown (coverage gap), not evidence for or against a degrader. Never touches SM.

  # ============================================================================
  # E3 degradability slice — degradation-feasibility card → DEGRADER lens (verdict-wiring, 2026-08-07)
  # Fills the degrader lens's degradability_machinery slot (tractability-small-molecule
  # _degrader_snapshot reads modality_lens(fired, "degrader")). DELIBERATELY degrader-channel ONLY:
  # NO small_molecule signal on any rule → the SM resolver + druggability_snapshot stay byte-stable
  # (the SM resolver does not reference this card). Same discipline as the domain-modality degrader
  # rules (TC#234). Composes with domain-modality: a scaffolding target (removal_required_scaffolding)
  # that is ALSO precedented/ubiquitinatable accumulates multiple degrader-supportive signals.
  #   unfavorable_location     -> degrader OPPOSING (surface/secreted = cytoplasmic-E3-unreachable;
  #       a true negative for the intracellular-PROTAC modality — NOT a killer, since a molecular glue
  #       or an extracellular degrader (LYTAC/AbTAC) could still apply, so opposing not veto)
  #   precedented_degradable   -> degrader supportive + DOMINANT (feasibility demonstrated by a real
  #       degrader molecule; strong enough to stand alone -> strong_degrader_rationale)
  #   ubiquitination_substrate -> degrader supportive (natural E3 substrate = ubiquitination-competent)
  #   plausible_untested       -> degrader NEUTRAL (plausible but no positive evidence; absence of
  #       natural substrate is explicitly NOT held against it)
  #   data_unavailable         -> degrader insufficient (coverage gap, not evidence)
  # ============================================================================

  - rule_id: degradation-unfavorable-location-degrader-opposing
    when:
      card_id: degradation-feasibility
      field: degradability_feasibility_class
      equals: unfavorable_location
    signals:
      degrader: opposing
    rationale: |
      The target is a cell-surface / secreted protein — outside the reach of cytoplasmic E3
      ligases, so a classic intracellular PROTAC / molecular-glue cannot ubiquitinate and degrade
      it (this is an ADC / TCE surface-modality target instead). OPPOSING for the degrader lens, not
      a killer: an extracellular-degrader modality (LYTAC / AbTAC) or a membrane-tethered approach
      could in principle apply, so this disfavors — but does not veto — the intracellular-degrader
      read. DEGRADER CHANNEL ONLY — the small-molecule verdict is untouched.

  - rule_id: degradation-precedented-degrader-supportive-dominant
    when:
      card_id: degradation-feasibility
      field: degradability_feasibility_class
      equals: precedented_degradable
    signals:
      degrader: supportive
    dominant: true
    rationale: |
      The target has documented targeted-degrader precedent (a named clinical or tool PROTAC /
      molecular glue that degrades it — curated degrader_precedent_targets.yaml). Degradation
      feasibility is DEMONSTRATED, not merely inferred, so this is DOMINANT for the degrader lens
      (stands alone -> strong_degrader_rationale). DEGRADER CHANNEL ONLY — SM verdict untouched (a
      precedented degrader target may or may not also be a small-molecule-inhibitor target; this
      does not speak to SM).

  - rule_id: degradation-ubiquitination-substrate-degrader-supportive
    when:
      card_id: degradation-feasibility
      field: degradability_feasibility_class
      equals: ubiquitination_substrate
    signals:
      degrader: supportive
    rationale: |
      The target is a natural E3-ligase substrate (literature-curated in UbiBrowser) — it is
      ubiquitination-competent (accessible lysines, E3-reachable), a positive prior that a targeted
      degrader can engage the ubiquitin-proteasome system against it. Supportive (not dominant): a
      strong mechanistic prior short of demonstrated degrader precedent. DEGRADER CHANNEL ONLY.

  - rule_id: degradation-plausible-untested-degrader-neutral
    when:
      card_id: degradation-feasibility
      field: degradability_feasibility_class
      equals: plausible_untested
    signals:
      degrader: neutral
    rationale: |
      Intracellular target with no curated degrader precedent and no literature natural-substrate
      evidence. NEUTRAL for the degrader lens (explicitly not opposing): degradation is plausible but
      unproven, and absence of a natural substrate is NOT held against the target — PROTACs recruit
      E3s de novo (induced neo-substrate). Never touches SM.

  - rule_id: degradation-feasibility-data-unavailable-degrader-insufficient
    when:
      card_id: degradation-feasibility
      field: degradability_feasibility_class
      equals: data_unavailable
    signals:
      degrader: insufficient
    rationale: |
      No E3-substrate, precedent, or location signal for this target — degradation feasibility is a
      coverage gap, not evidence for or against a degrader. Never touches SM.

  # ============================================================================
  # E1-organoid — Organoid CRISPR dependency (Card: organoid-crispr-dependency)
  # ============================================================================
  # The ORGANOID-NATIVE reading of the same Chronos screens (OrganoidGeneEffect.csv, 114
  # organoid models, GI-dominated). CORROBORATING facet only: it strengthens a dependency
  # call in a more physiological 3D context, but its small lineage-SKEWED cohort is NEVER a
  # trusted independent veto — so no rule here fires a KILLER. The authoritative pan-cancer
  # veto lives on pan-cancer-crispr-dependency-distribution (measured-vs-null discipline).
  # Rules keyed on this card_id so the cell-line CRISPR rules above do not fire for it.

  - rule_id: organoid-selective-dependency-supportive
    when:
      card_id: organoid-crispr-dependency
      field: organoid_dependency_class
      equals: selective_organoid_dependency
    signals:
      small_molecule: supportive
      degrader: supportive
    rationale: |
      Dependency in 20-50% of organoid models — a context-selective dependency confirmed in
      patient-derived 3D organoids that retain architecture/differentiation 2D lines lose. This
      is the headline organoid-supportive signal: corroborates a therapeutic window in a more
      physiological model system. Corroborating (not dominant) — the pan-cancer + lineage cards
      carry the primary window call.

  - rule_id: organoid-broad-dependency-supportive
    when:
      card_id: organoid-crispr-dependency
      field: organoid_dependency_class
      equals: broad_organoid_dependency
    signals:
      small_molecule: supportive
      degrader: supportive
    rationale: |
      Dependency in 50-90% of organoid models — a broad, reproducible organoid dependency short
      of pan-essential. Corroborates a real functional requirement in physiological organoids.
      NOTE the cohort is GI-skewed, so "broad" here can reflect a GI-concentrated dependency;
      pair with the pan-cancer + lineage-selectivity cards for the cross-lineage picture.

  - rule_id: organoid-pan-essential-neutral
    when:
      card_id: organoid-crispr-dependency
      field: organoid_dependency_class
      equals: pan_organoid_essential
    signals:
      small_molecule: neutral
      degrader: neutral
    rationale: |
      Dependency in >=90% of organoid models — common-essential-like (low therapeutic window).
      NEUTRAL, not killer: the organoid cohort is small (n~114) and GI-skewed, so it CORROBORATES
      a common-essential liability but must not independently fire the pan-essential veto — that
      veto is owned by pan-cancer-crispr-dependency-distribution over the full panel.

  - rule_id: organoid-rare-dependency-neutral
    when:
      card_id: organoid-crispr-dependency
      field: organoid_dependency_class
      equals: rare_organoid_dependency
    signals:
      small_molecule: neutral
      degrader: neutral
    rationale: |
      Dependency in 5-20% of organoid models — a rare dependency that may reflect a small
      responsive subset (e.g. an MSI or molecular-subtype fraction of the GI-heavy cohort).
      Surface it, but it does not move the verdict on its own; the mutation/subgroup-stratified
      cards carry the discriminating-context read.

  - rule_id: organoid-not-dependent-neutral
    when:
      card_id: organoid-crispr-dependency
      field: organoid_dependency_class
      equals: not_organoid_dependent
    signals:
      small_molecule: neutral
      degrader: neutral
    rationale: |
      Dependency in <5% of organoid models. NEUTRAL, not killer: the organoid cohort is small and
      GI-skewed, so an organoid-negative is NOT a trusted measured negative — a target dependent
      only in a non-GI lineage would read negative here purely from cohort composition. Absence of
      organoid dependency is a coverage/composition gap, not evidence-against (measured-vs-null
      discipline). The full-panel + lineage cards own the negative call.

  - rule_id: organoid-dependency-data-unavailable-insufficient
    when:
      card_id: organoid-crispr-dependency
      field: organoid_dependency_class
      equals: data_unavailable
    signals:
      small_molecule: insufficient
      degrader: insufficient
    rationale: |
      Target absent from the organoid gene-effect matrix (or the product is unavailable) — a
      coverage gap, not evidence for or against a dependency. Never a veto.
