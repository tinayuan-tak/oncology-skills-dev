# Tier-2 signal-mapping rules for the intracellular-intrinsic biology axis.
# Maps card-emitted descriptive labels → per-modality signals consumed by Tier-3 synthesis.
#
# CONSOLIDATES three previously-scattered homes of normative logic:
#   1. card_spec interpretation_hints[].dominant flags (Cards 1, 2, 4)
#   2. modality-module killer_conditions (small_molecule, degrader)
#   3. synthesis-layer NOT_INFORMATIVE_CALLS hardcoded set (_synthesis.py:59-68)
#
# Reviewable by domain experts in PR. Each rule is a normative claim that should be
# defensible against biology + therapeutic-development practice.

rules_id: intracellular-intrinsic
version: 1.0.0
axis: intracellular_intrinsic
schema_version: 1

rationale: |
  Intracellular-intrinsic targets (cytoplasmic/nuclear proteins acting cell-autonomously)
  are pursued primarily via small-molecule + degrader modalities. The therapeutic
  rationale requires (a) functional dependency in the indication's cell context AND
  (b) for degraders, demonstrable protein presence. This rules file encodes those
  modality-specific requirements as signal mappings over descriptive evidence labels.

rules:
  # ============================================================================
  # E1 — Pan-cancer dependency distribution (Card 1: pan-cancer-crispr-dependency-distribution)
  # ============================================================================

  - rule_id: pan-essential-killer
    when:
      card_id: pan-cancer-crispr-dependency-distribution
      field: dependency_class
      equals: common_essential
    signals:
      small_molecule: killer
      degrader: killer
    killer_message: |
      Pan-essential target — no therapeutic window. Common-essential genes are required
      for viability across the panel; systemic inhibition produces unacceptable toxicity
      regardless of indication. Not viable as a small-molecule or degrader program.
    rationale: |
      DepMap's common_essential classification (~2000 genes, mostly housekeeping/ribosomal).
      Pursuing these requires either tissue-restricted delivery (out of scope for systemic
      small-molecule/degrader) or context-conditional inhibition (mutant-specific, etc.).

  - rule_id: strongly-selective-supportive
    when:
      card_id: pan-cancer-crispr-dependency-distribution
      field: dependency_class
      equals: strongly_selective
    signals:
      small_molecule: supportive
      degrader: supportive
    dominant: true
    rationale: |
      DepMap's strongly_selective classification — dependency is highly variable across
      the panel, suggesting context-specific essentiality. This is the canonical
      therapeutic-window signal: some cell contexts need it, most don't.

  - rule_id: non-dependent-killer
    when:
      card_id: pan-cancer-crispr-dependency-distribution
      field: dependency_class
      equals: non_dependent
    signals:
      small_molecule: killer
      degrader: killer
    killer_message: |
      No functional dependency detected across the cell-line panel. Without dependency
      evidence there is no rationale for therapeutic investment regardless of modality.

  - rule_id: broadly-dependent-neutral
    when:
      card_id: pan-cancer-crispr-dependency-distribution
      field: dependency_class
      equals: broadly_dependent
    signals:
      small_molecule: neutral
      degrader: neutral
    rationale: |
      Dependency signal is broad but doesn't meet the common_essential threshold (~85%
      strongly-dependent). Between selective and pan-essential territory. NOT a killer
      on its own — could still be a valid therapeutic-window target if lineage-selectivity
      or mutation-stratification cards identify a discriminating context. Downstream cards
      carry the differentiation.

  # ============================================================================
  # E1b — Pan-cancer RNAi dependency distribution (Card 1b)
  # ============================================================================
  # Parallel to CRISPR Card 1 on DEMETER2 scale. The concordance card (E1c) carries
  # cross-assay reconciliation; these per-assay rules are scoped to single-card signal.

  - rule_id: rnai-pan-essential-killer
    when:
      card_id: pan-cancer-rnai-dependency-distribution
      field: rnai_dependency_class
      equals: common_essential
    signals:
      small_molecule: killer
      degrader: killer
    killer_message: |
      RNAi LOF shows pan-essential signal. Cross-check vs CRISPR via the concordance
      card; if both agree the program is not viable as systemic small_molecule/degrader.
    rationale: |
      DEMETER2 ≥85% strong-dep matches DepMap's common_essential convention on the RNAi
      panel. Same therapeutic-window argument as CRISPR's pan-essential rule.

  - rule_id: rnai-strongly-selective-supportive
    when:
      card_id: pan-cancer-rnai-dependency-distribution
      field: rnai_dependency_class
      equals: strongly_selective
    signals:
      small_molecule: supportive
      degrader: supportive
    rationale: |
      RNAi shows selective dependency — orthogonal LOF confirmation if CRISPR also
      strongly-selective. NOT dominant on its own: RNAi knockdown is partial vs CRISPR's
      complete knockout, so RNAi-alone signal needs CRISPR cross-check to drive fit_level.

  - rule_id: rnai-non-dependent-neutral
    when:
      card_id: pan-cancer-rnai-dependency-distribution
      field: rnai_dependency_class
      equals: non_dependent
    signals:
      small_molecule: neutral
      degrader: neutral
    rationale: |
      RNAi finds no dependency. NOT a killer on its own — RNAi has known false-negative
      patterns (partial knockdown insufficient to reveal dependency). The CRISPR card
      carries the dependency-killer logic; concordance card reconciles cross-assay.

  - rule_id: rnai-broadly-dependent-neutral
    when:
      card_id: pan-cancer-rnai-dependency-distribution
      field: rnai_dependency_class
      equals: broadly_dependent
    signals:
      small_molecule: neutral
      degrader: neutral
    rationale: |
      RNAi shows dependency across many but not all lines — between strongly_selective
      and common_essential. Signal alone is neutral; the CRISPR analog + concordance
      card carry the dominant decision logic.

  - rule_id: rnai-data-unavailable-insufficient
    when:
      card_id: pan-cancer-rnai-dependency-distribution
      field: rnai_dependency_class
      equals: data_unavailable
    signals:
      small_molecule: insufficient
      degrader: insufficient
    rationale: |
      RNAi data unreachable or target absent from DEMETER2 panel. Coverage gap;
      not used as opposing evidence. CRISPR card carries the dependency call alone.

  # ============================================================================
  # E1c — CRISPR-RNAi concordance (Card 1c, derived)
  # ============================================================================
  # The concordance card consumes upstream CRISPR + RNAi outputs and emits a derived
  # categorical describing cross-assay agreement. These rules promote concordant
  # signals to DOMINANT (orthogonal-evidence confirmation strengthens the call)
  # and flag discordance as a warning, not a killer.

  - rule_id: concordant-dependent-supportive-dominant
    when:
      card_id: crispr-rnai-dependency-concordance
      field: concordance_class
      equals: strongly_concordant_dependent
    signals:
      small_molecule: supportive
      degrader: supportive
    dominant: true
    rationale: |
      CRISPR and RNAi BOTH call dependent for the majority of cell lines tested in
      both panels. Orthogonal-LOF-evidence confirmation; reliability is high.
      Promoted to dominant because cross-assay agreement is the gold-standard
      'real dependency' signal in cellular models.

  - rule_id: concordant-non-dependent-neutral
    when:
      card_id: crispr-rnai-dependency-concordance
      field: concordance_class
      equals: strongly_concordant_non_dependent
    signals:
      small_molecule: neutral
      degrader: neutral
    rationale: |
      Concordance class is descriptive of which side of the partition dominates the
      in-both subset — for SELECTIVE targets (which are the framework's main interest),
      most lines are non-dependent in both assays, so 'strongly_concordant_non_dependent'
      lands here naturally without being a kill-the-program signal. The killer-on-
      non-essentiality logic lives in the upstream per-assay cards' non_dependent rules
      (CRISPR non-dependent-killer + RNAi non-dependent-killer); both must fire to
      kill the program. This rule keeps the descriptive concordance label without
      double-firing the killer.

      Discovered 2026-06-30 during live KRAS-COADREAD smoke: KRAS is a strongly
      selective target with two approved small molecules (sotorasib, adagrasib). The
      concordance label legitimately reports 51% agree-non-dependent vs 24%
      agree-dependent on the in-both subset (a SELECTIVE-target signature), which
      should NOT be a killer.

  - rule_id: concordance-discordant-warning
    when:
      card_id: crispr-rnai-dependency-concordance
      field: concordance_class
      equals: discordant
    signals:
      small_molecule: opposing
      degrader: opposing
    rationale: |
      CRISPR and RNAi disagree substantially (≥30% of in-both lines disagree). Not a
      killer — discordance can reflect biology (partial RNAi knockdown vs complete
      CRISPR knockout) rather than error — but downgrades single-assay-dominant
      signals from supportive to opposing pending mechanistic context.

  - rule_id: concordance-partially-assayed-insufficient
    when:
      card_id: crispr-rnai-dependency-concordance
      field: concordance_class
      equals: partially_assayed
    signals:
      small_molecule: insufficient
      degrader: insufficient
    rationale: |
      Cell-line overlap between CRISPR and RNAi panels is below the minimum threshold
      (< 30 lines). Concordance call cannot be made reliably; the per-assay cards
      carry the dependency signals individually.

  - rule_id: concordance-data-unavailable-insufficient
    when:
      card_id: crispr-rnai-dependency-concordance
      field: concordance_class
      equals: data_unavailable
    signals:
      small_molecule: insufficient
      degrader: insufficient
    rationale: |
      Concordance requires BOTH upstream cards to succeed; one or both failed. Not
      used as opposing evidence. The per-assay cards may still contribute signals.

  # ============================================================================
  # E2 — Lineage selectivity (Card 2: dependency-lineage-selectivity)
  # ============================================================================

  # Card 2 (E2) refactored to v3.0.0 — target-only, indication-decoupled. Emits
  # `enrichment_class` describing the SHAPE of lineage variation across the panel.
  # Per-indication interpretation ("which lineage matters for THIS dashboard?") is
  # a synthesis-layer concern that consults the per_lineage_stats table directly.

  - rule_id: lineage-selective-supportive
    when:
      card_id: dependency-lineage-selectivity
      field: enrichment_class
      equals: lineage_selective
    signals:
      small_molecule: supportive
      degrader: supportive
    dominant: true
    rationale: |
      ≥1 lineage is significantly more dependent on the target than the rest of the
      panel (BH-adjusted q < α). Indication-selection driver: a clear "use it for THIS
      cancer type" signal. Which specific lineage matters for the dashboard's resolved
      indication is a synthesis-layer lookup over per_lineage_stats.

  - rule_id: broadly-lineage-dependent-neutral
    when:
      card_id: dependency-lineage-selectivity
      field: enrichment_class
      equals: broadly_lineage_dependent
    signals:
      small_molecule: neutral
      degrader: neutral
    rationale: |
      Multiple lineages show dependency but no single lineage is significantly enriched
      vs the rest. Doesn't kill the case (dependency exists) but doesn't differentiate
      an indication either. Pan-cancer dependency classification (E1) carries the
      therapeutic-window story instead.

  - rule_id: no-lineage-enrichment-neutral
    when:
      card_id: dependency-lineage-selectivity
      field: enrichment_class
      equals: no_lineage_enrichment
    signals:
      small_molecule: neutral
      degrader: neutral
    rationale: |
      No lineage shows significant dependency enrichment vs the rest. This is
      DESCRIPTIVELY informative but NOT a killer on its own — the gene could still
      be uniformly dependent across the panel (in which case E1's dependency_class
      would carry the killer). Killer determination for "dependency does not exist"
      lives correctly on E1's non-dependent-killer rule, not duplicated here.

  - rule_id: lineage-selectivity-data-unavailable-insufficient
    when:
      card_id: dependency-lineage-selectivity
      field: enrichment_class
      equals: data_unavailable
    signals:
      small_molecule: insufficient
      degrader: insufficient
    rationale: |
      Lineage selectivity data unreachable or panel too small. Coverage gap; not
      used as opposing evidence. Other dependency evidence threads (E1 CRISPR/RNAi)
      carry the therapeutic-window story.

  # ============================================================================
  # Card 3 — mutation-stratified-dependency (oncogene-addiction biomarker)
  # ============================================================================

  - rule_id: mutant-strongly-dependent-supportive
    when:
      card_id: mutation-stratified-dependency
      field: mutation_stratification_class
      equals: mutant_strongly_dependent
    signals:
      small_molecule: supportive
      degrader: supportive
    dominant: true
    rationale: |
      Mutant cells significantly + strongly more dependent than WT (BH-corrected q < α,
      |delta| >= 0.5). Oncogene-addiction biomarker — supports a mutation-stratified
      clinical strategy (give the drug to patients with the mutation). Canonical
      examples: BRAF-V600E + vemurafenib, KRAS-G12C + sotorasib, EGFR-L858R + erlotinib.

  - rule_id: mutant-moderately-dependent-supportive
    when:
      card_id: mutation-stratified-dependency
      field: mutation_stratification_class
      equals: mutant_moderately_dependent
    signals:
      small_molecule: supportive
      degrader: supportive
    rationale: |
      Significant mutant-vs-WT stratification but smaller effect size (-0.2 to -0.5).
      Supportive but not dominant on its own; biomarker hypothesis viable but needs
      stronger orthogonal evidence (PDX, isogenic-model rescue) before clinical strategy.

  - rule_id: wt-strongly-dependent-neutral
    when:
      card_id: mutation-stratified-dependency
      field: mutation_stratification_class
      equals: wt_strongly_dependent
    signals:
      small_molecule: neutral
      degrader: neutral
    rationale: |
      WT cells more dependent than mutant — unusual pattern, sometimes seen in
      tumor-suppressor contexts where the LOF mutation produces synthetic dependency
      ELSEWHERE in the genome. Doesn't kill the small_molecule/degrader case on its
      own but suggests the biology is more complex than direct oncogene-addiction.

  - rule_id: not-mutation-stratified-neutral
    when:
      card_id: mutation-stratified-dependency
      field: mutation_stratification_class
      equals: not_mutation_stratified
    signals:
      small_molecule: neutral
      degrader: neutral
    rationale: |
      Dependency doesn't stratify by mutation status across the panel. NOT a killer:
      the target could still be a strong-fit modality via lineage selectivity (E2) or
      pan-essential discrimination (E1). It just means mutation status isn't a
      stratifying biomarker for this target.

  - rule_id: insufficient-mutation-rate-insufficient
    when:
      card_id: mutation-stratified-dependency
      field: mutation_stratification_class
      equals: insufficient_mutation_rate
    signals:
      small_molecule: insufficient
      degrader: insufficient
    rationale: |
      <5 mutant cell lines in the panel — Mann-Whitney test is underpowered. Coverage
      gap, not opposing evidence. Tier-3 should surface this in coverage_summary.

  - rule_id: mutation-stratified-data-unavailable
    when:
      card_id: mutation-stratified-dependency
      field: mutation_stratification_class
      equals: data_unavailable
    signals:
      small_molecule: insufficient
      degrader: insufficient
    rationale: |
      DepMap mutation matrices were unreachable. Coverage gap; not used as opposing evidence.

  # ============================================================================
  # E3.b — Copy-number distribution (Card 3b: copy-number-distribution)
  # ============================================================================
  # DESIGN: "broadly_neutral" is the CORRECT call for mutation-driven targets
  # (KRAS, BRAF, etc.) — informative ("CN axis isn't a driver here"), NOT a gap.
  # The vocabulary maps to signals that respect this: amplified/deleted are
  # supportive (CN-driven biology supports the program), neutral is NEUTRAL,
  # mixed is NEUTRAL pending downstream interpretation, data_unavailable is
  # insufficient. No CN-class is a killer — CN alone shouldn't kill a program.

  - rule_id: cn-recurrently-amplified-supportive
    when:
      card_id: copy-number-distribution
      field: copy_number_class
      equals: recurrently_amplified
    signals:
      small_molecule: supportive
      degrader: supportive
    rationale: |
      Recurrent focal amplification across the panel (>=20% of lines). The CN axis
      is plausibly driving target activity in a subset of contexts. Supportive
      across modalities; degrader programs can leverage amplification-elevated
      protein abundance, small-molecule programs can leverage oncogene-addiction
      patterns at amplified loci (e.g. MYC amp in HCC).

  - rule_id: cn-recurrently-deleted-supportive
    when:
      card_id: copy-number-distribution
      field: copy_number_class
      equals: recurrently_deleted
    signals:
      small_molecule: supportive
      degrader: supportive
    rationale: |
      Recurrent deletion across the panel (>=20% of lines). For tumor-suppressor
      targets, deletion is the canonical loss-of-function event; the framework
      treats it as supportive (the deletion creates a context the program might
      exploit, e.g. synthetic-lethal partner targeting). NOT a killer on its own
      — interpretation requires the dependency cards as orthogonal evidence.

  - rule_id: cn-mixed-neutral
    when:
      card_id: copy-number-distribution
      field: copy_number_class
      equals: mixed
    signals:
      small_molecule: neutral
      degrader: neutral
    rationale: |
      Both amp and del are recurrent in different lineages (balanced ratio). The
      CN axis is complex but not unidirectional; treat as neutral signal pending
      lineage-specific context from synthesis layer.

  - rule_id: cn-broadly-neutral-neutral
    when:
      card_id: copy-number-distribution
      field: copy_number_class
      equals: broadly_neutral
    signals:
      small_molecule: neutral
      degrader: neutral
    rationale: |
      No recurrent CN events — the CN axis is NOT a driver for this target.
      This is the EXPECTED outcome for mutation-driven oncogenes (KRAS, BRAF,
      EGFR) and is informative evidence ("CN isn't where the action is here").
      NOT a killer; other evidence threads (dependency, mutation, expression)
      carry the therapeutic-window story.

  - rule_id: cn-data-unavailable-insufficient
    when:
      card_id: copy-number-distribution
      field: copy_number_class
      equals: data_unavailable
    signals:
      small_molecule: insufficient
      degrader: insufficient
    rationale: |
      CN data unreachable, OR the target gene is absent from both the WES and WGS
      panels. Coverage gap; not used as opposing evidence. Other evidence threads
      remain the basis for the call.

  # ============================================================================
  # E4 — Mutation-type counts (Card E4: mutation-type-counts)
  # ============================================================================
  # DESIGN: classification is descriptive — describes the variant-class profile of
  # the gene across DepMap cell lines. Oncogene-pattern (missense_dominant) and
  # tumor-suppressor-pattern (lof_dominant) both can be supportive for the right
  # modality. No rule emits a killer signal — mutation-type alone shouldn't kill a
  # program; coverage / dependency / clinical-precedent carry that logic.

  - rule_id: mut-missense-dominant-supportive
    when:
      card_id: mutation-type-counts
      field: mutation_landscape_class
      equals: missense_dominant
    signals:
      small_molecule: supportive
      degrader: supportive
    rationale: |
      Missense-dominant variant profile (≥70% missense among coding variants) is
      the canonical oncogene signature. Activating hotspot mutations support both
      small-molecule (inhibitor of the mutant protein, e.g. KRAS-G12C inhibitors)
      and degrader strategies (degrade the oncogenic protein).

  - rule_id: mut-lof-dominant-supportive
    when:
      card_id: mutation-type-counts
      field: mutation_landscape_class
      equals: lof_dominant
    signals:
      small_molecule: supportive
      degrader: supportive
    rationale: |
      LOF-dominant variant profile (≥50% nonsense + frameshift + splice) is the
      canonical tumor-suppressor signature. The target itself is being lost — so
      direct inhibition is NOT the strategy. Supportive for SYNTHETIC-LETHAL
      partner-targeting strategies (PARP for BRCA-LOF, MAT2A for MTAP-LOF, etc.)
      where the framework subsequently asks 'what depends on this LOF context?'.

  - rule_id: mut-mixed-neutral
    when:
      card_id: mutation-type-counts
      field: mutation_landscape_class
      equals: mixed
    signals:
      small_molecule: neutral
      degrader: neutral
    rationale: |
      Neither missense nor LOF dominates (dual-role gene, e.g. TP53). The
      mutation profile alone doesn't drive a directional therapeutic call;
      synthesis layer should consult the dependency cards + clinical-precedent.

  - rule_id: mut-no-mutations-neutral
    when:
      card_id: mutation-type-counts
      field: mutation_landscape_class
      equals: no_mutations
    signals:
      small_molecule: neutral
      degrader: neutral
    rationale: |
      Fewer than 5 cell lines mutated — gene is rarely mutated in the DepMap
      panel. NOT a killer (rare-mutation oncogenes exist, e.g. RIT1 in NSCLC).
      Other evidence threads (dependency, expression, copy number) carry the
      call; this card adds no signal.

  - rule_id: mut-data-unavailable-insufficient
    when:
      card_id: mutation-type-counts
      field: mutation_landscape_class
      equals: data_unavailable
    signals:
      small_molecule: insufficient
      degrader: insufficient
    rationale: |
      MAF unreachable or target absent. Coverage gap; not used as opposing evidence.

  # ============================================================================
  # Expression — tumor vs adjacent (Card v2.0.0, pure-data 2026-07-01)
  # ============================================================================
  # Degrader-specific: degraders require demonstrable protein presence in the indication.
  # Card was migrated 2026-07-01 from interpretation_hints to pure-data
  # expression_call_class vocabulary. 4 rules cover the full vocabulary.

  - rule_id: expression-strong-upregulation-supportive
    when:
      card_id: expression-tumor-vs-adjacent
      field: expression_call_class
      equals: strong_upregulation
    signals:
      small_molecule: supportive
      degrader: supportive
    rationale: |
      Strong tumor-vs-adjacent upregulation (q < 0.05 AND log2_fc >= 1.5). RNA-level
      evidence that the target is elevated in tumor vs normal — supports both
      small-molecule (target is available in tumor tissue) and degrader (RNA proxy
      for protein presence). Not dominant; other cards carry the therapeutic-window
      story.

  - rule_id: expression-modest-upregulation-neutral
    when:
      card_id: expression-tumor-vs-adjacent
      field: expression_call_class
      equals: modest_upregulation
    signals:
      small_molecule: neutral
      degrader: neutral
    rationale: |
      Modest tumor-vs-adjacent upregulation (q < 0.05 AND 0.5 <= log2_fc < 1.5).
      Directionally consistent but small effect size. Neither supports nor
      opposes; other cards drive the fit determination.

  - rule_id: expression-call-not-informative-degrader-killer
    when:
      card_id: expression-tumor-vs-adjacent
      field: expression_call_class
      equals: not_informative
    signals:
      degrader: killer
    killer_message: |
      Degrader not viable — no demonstrable tumor-vs-adjacent expression differential
      in this indication. Degrader investment requires confirmed intracellular protein
      presence; RNA-level evidence is the iter-1b proxy until the proteomics card lands.
    rationale: |
      Pure-data v2 (renamed from expression-not-informative-degrader-killer 2026-07-01).
      Fires on the same semantic condition (q >= 0.05 OR log2_fc < 0.5) but now via
      the vocabulary field. Small-molecule NOT killed — SM programs can pursue
      targets without tumor-vs-adjacent differential; degraders cannot.

  - rule_id: expression-call-data-unavailable-insufficient
    when:
      card_id: expression-tumor-vs-adjacent
      field: expression_call_class
      equals: data_unavailable
    signals:
      small_molecule: insufficient
      degrader: insufficient
    rationale: |
      DGE data unreachable or target absent from the indication's DGE table. Coverage
      gap; not used as opposing evidence for either modality.

  # ============================================================================
  # E3a — Expression distribution (Card E3a: expression-distribution)
  # ============================================================================
  # Pan-cancer cell-line TPM distribution. NOT a primary fit_level driver — the
  # rationale-for-modality questions live in tumor-vs-normal / lineage-restriction.
  # This card answers "is the target measurably expressed across cell lines?"

  - rule_id: expression-broadly-low-degrader-killer
    when:
      card_id: expression-distribution
      field: expression_class
      equals: broadly_low
    signals:
      degrader: killer
    killer_message: |
      Target is broadly NOT expressed in DepMap cell lines (<10% expressed). Degraders
      require protein presence to degrade; this is strong evidence the protein is not
      present in cellular models. Not viable for degrader.
    rationale: |
      Degrader programs need a target protein to degrade. Broadly-low expression on the
      most-comprehensive cell-line panel is strong negative evidence for that condition.
      Small-molecule signal here is neutral — the SM rationale lives in expression-tumor-
      vs-adjacent (patient-level evidence), not the DepMap cell-line panel.

  - rule_id: expression-broadly-high-supportive
    when:
      card_id: expression-distribution
      field: expression_class
      equals: broadly_high
    signals:
      small_molecule: supportive
      degrader: supportive
    rationale: |
      Target is broadly + highly expressed across DepMap cell lines. Confirms measurable
      protein expression. Supportive for both modalities; not dominant (selectivity
      questions live in lineage-restriction-evidence + tumor-vs-normal).

  - rule_id: expression-lineage-restricted-supportive
    when:
      card_id: expression-distribution
      field: expression_class
      equals: lineage_restricted
    signals:
      small_molecule: supportive
      degrader: supportive
    rationale: |
      Target shows lineage-restricted expression across DepMap (one or more lineages
      express, others don't). Therapeutic-window candidate by selectivity; the
      indication-of-interest needs to overlap an expressing lineage (synthesis-layer
      lookup over per_lineage_stats).

  - rule_id: expression-broadly-moderate-neutral
    when:
      card_id: expression-distribution
      field: expression_class
      equals: broadly_moderate
    signals:
      small_molecule: neutral
      degrader: neutral
    rationale: |
      Target expressed everywhere at moderate levels — informative that expression
      isn't a differentiator, but doesn't drive a directional call. Not a killer
      (degrader-viable target expression is present), not a supportive (no
      selectivity signal). KRAS lands here in real DepMap data — expression is
      not the biology-driver axis for many mutation-driven oncogenes.

  - rule_id: expression-data-unavailable-insufficient
    when:
      card_id: expression-distribution
      field: expression_class
      equals: data_unavailable
    signals:
      small_molecule: insufficient
      degrader: insufficient
    rationale: |
      Expression matrix unreachable or target absent. Coverage gap.

  # ============================================================================
  # expression-dependency-correlation — biomarker hypothesis
  # (v2 refactor 2026-06-30: card now pure-data; 5 vocab values, 5 rules)
  # ============================================================================

  - rule_id: expression-biomarker-supportive
    when:
      card_id: expression-dependency-correlation
      field: correlation_class
      equals: strong_negative
    signals:
      small_molecule: supportive
      degrader: supportive
    dominant: true
    rationale: |
      Strong negative expression-dependency correlation (r ≤ -0.4, p ≤ 0.01) =
      high-expressers are strongly dependent. Biomarker-stratification candidate;
      supports patient-selection strategy. Dominant — when this fires it should
      drive fit_level upward absent contradicting killer signals.

  - rule_id: expression-biomarker-moderate-supportive
    when:
      card_id: expression-dependency-correlation
      field: correlation_class
      equals: moderate_negative
    signals:
      small_molecule: supportive
      degrader: supportive
    rationale: |
      Moderate negative correlation (-0.4 < r ≤ -0.2, p ≤ 0.01). Signal is directional
      but smaller-effect — supports biomarker hypothesis without being dominant.

  - rule_id: expression-correlation-weak-neutral
    when:
      card_id: expression-dependency-correlation
      field: correlation_class
      equals: weak_negative
    signals:
      small_molecule: neutral
      degrader: neutral
    rationale: |
      Weak negative correlation (-0.2 < r ≤ -0.1). Directionally consistent but not
      conclusive; treated as neutral signal until orthogonal evidence accumulates.

  - rule_id: expression-no-correlation-neutral
    when:
      card_id: expression-dependency-correlation
      field: correlation_class
      equals: no_correlation
    signals:
      small_molecule: neutral
      degrader: neutral
    rationale: |
      Expression and dependency are uncorrelated. Not a killer (target could still
      be a fit via other evidence threads — dependency, lineage selectivity, mutation
      stratification); just no biomarker hypothesis from this axis.

  - rule_id: expression-positive-anomaly-opposing
    when:
      card_id: expression-dependency-correlation
      field: correlation_class
      equals: positive_anomaly
    signals:
      small_molecule: opposing
      degrader: opposing
    rationale: |
      Positive correlation (r > 0.2): high expression associates with REDUCED
      dependency. Anomalous — may indicate paralog compensation (expressing the
      target signals an alternative pathway is active) or measurement artifact.
      Treated as opposing evidence; pair with paralog analysis before discounting.

  - rule_id: expression-correlation-data-unavailable-insufficient
    when:
      card_id: expression-dependency-correlation
      field: correlation_class
      equals: data_unavailable
    signals:
      small_molecule: insufficient
      degrader: insufficient
    rationale: |
      Expression or Chronos data unreachable, OR insufficient n cell lines.
      Coverage gap; not used as opposing evidence.

  # ============================================================================
  # E5 — Dependency predictability (Card: dependency-predictability)
  # ============================================================================
  # Asks how well STANDARD features (own omics + lineage) explain Chronos. The
  # descriptive class drives a biomarker-vs-context call:
  #   own_omics_driven → biomarker hypothesis supported (target-own omic
  #                       feature dominates → patient-selection axis exists)
  #   lineage_driven   → context-determined (tissue matters; no extra
  #                       biomarker beyond indication)
  # Two rules in v1 (minimal scope). weakly_predictable + unpredictable surface
  # as card-level caveats, not Tier-2 signals — low R² doesn't kill a target,
  # it just means the standard feature set doesn't explain it.

  - rule_id: predictability-biomarker-hypothesis-supportive
    when:
      card_id: dependency-predictability
      field: predictability_class
      equals: own_omics_driven
    signals:
      small_molecule: supportive
      degrader: supportive
    rationale: |
      Dependency is biomarker-anchored: a target-own omic feature (expression,
      copy number, or mutation status) dominates a RandomForest model with
      out-of-fold R² ≥ 0.5. This is the canonical patient-selection signal —
      the standard omics axes carry enough information to predict who responds.
      Supports both small-molecule and degrader programs by giving the
      development plan a defensible biomarker hypothesis at IND entry.

  - rule_id: predictability-context-determined-neutral
    when:
      card_id: dependency-predictability
      field: predictability_class
      equals: context_or_driver_dependent
    signals:
      small_molecule: neutral
      degrader: neutral
    rationale: |
      Model has strong signal (r²_rf CI lower bound ≥ 0.35) but the top feature
      is lineage / arm-level CN / co-driver flag — NOT the target's own omic
      state. Dependency is context/driver-determined; the standard target-own
      axes don't give a patient-selection biomarker beyond indication + co-
      driver context. Doesn't kill the target (many valid programs sit here:
      KRAS in pancreas, ESR1 in breast, WRN in MSI) but flags that the
      biomarker arm of the development plan needs to combine indication +
      co-driver readouts rather than a single target-anchored assay.

  - rule_id: predictability-weakly-predictable-neutral
    when:
      card_id: dependency-predictability
      field: predictability_class
      equals: weakly_predictable
    signals:
      small_molecule: neutral
      degrader: neutral
    rationale: |
      r² above DepMap's high-confidence floor (≥ 0.16) but the 95% CI lower
      bound is < 0.35 — meaningful signal but wide uncertainty. Doesn't kill
      the target and doesn't cleanly support a biomarker hypothesis; the
      standard features give a partial explanation but the class call is not
      yet defensible. Use as a caveat, not a discriminant.

  - rule_id: predictability-unpredictable-neutral
    when:
      card_id: dependency-predictability
      field: predictability_class
      equals: unpredictable
    signals:
      small_molecule: neutral
      degrader: neutral
    rationale: |
      r² < DepMap's high-confidence floor (0.16) — standard omics + lineage
      + arm-level CN + driver flags do NOT explain Chronos for this target.
      NOT a kill — the dependency may still be real (verify via E1/E2). Flags
      a novel-biology candidate where the biomarker hypothesis needs a feature
      class not in the standard predictability panel (e.g. epigenetic state,
      protein-level signature, pathway-partner dependency structure).

  - rule_id: predictability-data-unavailable-insufficient
    when:
      card_id: dependency-predictability
      field: predictability_class
      equals: data_unavailable
    signals:
      small_molecule: insufficient
      degrader: insufficient
    rationale: |
      Target absent from v1 medium-scope precompute (~500 dependency-mappable
      genes). Coverage gap; not used as opposing evidence. v2 (full genome) will
      backfill this set.

  # ============================================================================
  # Generic insufficient-evidence handling (replaces NOT_INFORMATIVE_CALLS)
  # ============================================================================
  # Cards that emit data_unavailable / no_data_for_target descriptive labels signal
  # 'insufficient' for all modalities — counted toward coverage gap, not held against fit.

  - rule_id: data-unavailable-insufficient
    when:
      card_id: pan-cancer-crispr-dependency-distribution
      field: dependency_class
      equals: data_unavailable
    signals:
      small_molecule: insufficient
      degrader: insufficient
    rationale: |
      Card's underlying data was unreachable (_live_read_error) or the target was absent
      from the substrate. Coverage gap; not used as opposing evidence.

  # ============================================================================
  # E6 — PRISM compound activity (Card prism-compound-activity)
  # ============================================================================
  # Interpretation surface locked 2026-07-01 (plan Q4):
  #   - clinically_active    → SUPPORTIVE for small_molecule; NEUTRAL for degrader
  #   - tool_compound_only   → weak-supportive for small_molecule (druggability signal only)
  #   - weakly_active        → weak-supportive for small_molecule (activity without clinical anchor)
  #   - no_compounds_found   → NEUTRAL (first-in-class opportunity, NOT a killer)
  #   - data_unavailable     → insufficient (parquet unreadable / release_pin unknown)

  - rule_id: prism-clinically-active-supportive-sm
    when:
      card_id: prism-compound-activity
      field: prism_activity_class
      equals: clinically_active
    signals:
      small_molecule: supportive
      degrader: neutral
    rationale: |
      An OncologyReference-prioritized compound (proxy for phase_1+ clinical anchor) is
      annotated as targeting this gene. Compound existence + clinical presence is a real
      small-molecule tractability signal — chemistry-matter risk is de-risked. Degrader
      is scored NEUTRAL rather than supportive: small-molecule inhibitor tractability
      does not imply degrader (E3 ligase recruitment) feasibility; those are independent
      chemistry problems.

  - rule_id: prism-tool-compound-only-weak-supportive-sm
    when:
      card_id: prism-compound-activity
      field: prism_activity_class
      equals: tool_compound_only
    signals:
      small_molecule: supportive
      degrader: neutral
    rationale: |
      Tool / preclinical compounds exist but no clinical anchor. This validates the target
      is chemically approachable at bench scale but leaves clinical translatability
      unresolved. Weak-supportive: better than first-in-class-chemistry risk, worse than
      an existing clinical scaffold.

  - rule_id: prism-weakly-active-weak-supportive-sm
    when:
      card_id: prism-compound-activity
      field: prism_activity_class
      equals: weakly_active
    signals:
      small_molecule: supportive
      degrader: neutral
    rationale: |
      Tool compounds show measurable pan-cancer viability activity (median LFC < -0.5) but
      no clinical anchor. Activity signal is present but interpretation is confounded by
      the tool-vs-clinical gap; treat as chemistry-tractability weak-positive.

  - rule_id: prism-no-compounds-found-neutral
    when:
      card_id: prism-compound-activity
      field: prism_activity_class
      equals: no_compounds_found
    signals:
      small_molecule: neutral
      degrader: neutral
    rationale: |
      No PRISM-annotated compound targets this gene across either OncologyReference 25Q4
      or Repurposing 24Q2. Locked 2026-07-01: NEUTRAL, NOT killer. Absence of a screened
      compound is a first-in-class OPPORTUNITY — targets like this are where discovery
      programs are meant to originate. Killer-classification would conflate "not-yet-drugged"
      with "undruggable" and mis-eliminate legitimate first-in-class targets.

  - rule_id: prism-data-unavailable-insufficient
    when:
      card_id: prism-compound-activity
      field: prism_activity_class
      equals: data_unavailable
    signals:
      small_molecule: insufficient
      degrader: insufficient
    rationale: |
      Derived aggregate parquet unreadable (S3 error, unknown release_pin, or parquet
      corruption). Coverage gap; not used as opposing evidence. Distinct from
      no_compounds_found — a real class call.
