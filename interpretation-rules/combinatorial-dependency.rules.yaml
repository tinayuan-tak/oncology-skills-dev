# Tier-2 signal-mapping rules for the COMBINATORIAL-KO DEPENDENCY axis.
# Maps the combinatorial-dependency card's descriptive combinatorial_dependency_class →
# per-modality signals consumed by the combinatorial-dependency skill's self-contained verdict.
#
# SELF-CONTAINED: these rules drive the combinatorial-dependency skill's OWN verdict
# (combinatorial_dependency_verdict). They are deliberately NOT wired into the shared
# nomination_verdict_gate ladder — this axis composes into target-profile as a follow-on, so the
# existing dependency/nomination resolver golden snapshots stay byte-stable (avoids the rule_id-
# ladder trap: a new rung there would need edits in ~5 places + golden regen).
#
# Biology: a combinatorial (paralog) dependency is a genetic-target rationale for CO-TARGETING —
# inhibit/degrade BOTH nodes, or the buffered node in the partner-loss context. It is NOT a
# single-agent dependency (single-KO of either gene alone is, by construction, insufficient), so
# these signals are framed as combination / conditional rationale, never a monotherapy killer.

rules_id: combinatorial-dependency
version: 1.0.0
# axis matches the filename (loader resolves {axis-kebab}.rules.yaml + requires this field ==
# requested axis). A DEDICATED axis keeps this self-contained verdict's rules isolated from the
# shared intracellular-intrinsic ladder (no cross-loading, no golden-snapshot entanglement).
axis: combinatorial_dependency
schema_version: 1

rationale: |
  Paralog buffering / synthetic lethality is invisible to single-gene dependency screens: a gene
  buffered by its paralog reads non-essential alone yet is a real co-dependency once the partner is
  lost (CDK2/CDK4, KAT6A/KAT6B, MARK2/MARK3). This axis surfaces that combinatorial rationale. A
  CONSTITUTIVE interaction (broad across lines) supports co-targeting broadly; a CONTEXT-conditional
  one supports a genotype/lineage-selected combination hypothesis (the therapeutically interesting
  case, but requiring stratification). Absence in the paralog library is a coverage gap, never a
  negative.

rules:
  - rule_id: combo-constitutive-synthetic-lethal
    when:
      card_id: combinatorial-dependency
      field: combinatorial_dependency_class
      equals: strong_synthetic_lethal
    signals:
      small_molecule: supportive
      degrader: supportive
    verdict: constitutive_combinatorial_dependency
    message: |
      Constitutive synthetic-lethal / buffering interaction with the paralog partner — the pair is
      required together broadly across cell lines. Supports a CO-TARGETING rationale (dual inhibition/
      degradation of both nodes). NOTE: single-agent inhibition of either node alone is buffered
      (insufficient by construction) — the rationale is for the COMBINATION.
    rationale: |
      combinatorial_dependency_class=strong_synthetic_lethal means >=1 partner is constitutive_buffering
      (mean GI <= -0.25 across lines, p<0.05). Broad, non-conditional co-dependency.

  - rule_id: combo-context-conditional-synthetic-lethal
    when:
      card_id: combinatorial-dependency
      field: combinatorial_dependency_class
      equals: context_synthetic_lethal
    signals:
      small_molecule: conditional
      degrader: conditional
    verdict: context_combinatorial_dependency
    message: |
      CONTEXT-dependent synthetic-lethal interaction — only a minority of cell lines / specific
      lineages show strong buffering. Supports a GENOTYPE- or LINEAGE-SELECTED combination hypothesis,
      NOT a broad co-target. The actionable next step is stratification: which lineage/genotype, and
      (where the partner is a tumor suppressor) conditioning on partner LOSS status.
    rationale: |
      context_synthetic_lethal = no constitutive partner, but >=1 context_buffering partner
      (frac_lines_strong_gi >= 0.10 OR a single very-strong line). Conditional dependencies are the
      therapeutically selective case but must be read with the lineage breakdown.

  - rule_id: combo-suppressive-interaction
    when:
      card_id: combinatorial-dependency
      field: combinatorial_dependency_class
      equals: suppressive_interaction
    signals:
      small_molecule: uninformative
      degrader: uninformative
    verdict: suppressive_combinatorial_interaction
    message: |
      Suppressive (positive-GI) interaction — co-loss is LESS lethal than the additive single-KO
      expectation (masking / epistasis). No combinatorial-dependency rationale; if anything a caution
      that co-targeting could be antagonistic.
    rationale: |
      suppressive_interaction: strongest partner has positive mean GI with p<0.05. Not a co-dependency.

  - rule_id: combo-no-interaction
    when:
      card_id: combinatorial-dependency
      field: combinatorial_dependency_class
      equals: no_interaction
    signals:
      small_molecule: uninformative
      degrader: uninformative
    verdict: no_combinatorial_dependency
    message: |
      Paralog partner(s) screened, but none show a genetic interaction beyond the additive single-KO
      expectation. No combinatorial-dependency rationale from the measured paralog library.
    rationale: |
      Partners present in the library, all interaction_class=no_interaction. A measured negative
      (distinct from no_paralog_screened, which is a coverage gap).

  - rule_id: combo-no-paralog-screened
    when:
      card_id: combinatorial-dependency
      field: combinatorial_dependency_class
      equals: no_paralog_screened
    signals:
      small_molecule: insufficient
      degrader: insufficient
    verdict: combinatorial_dependency_insufficient
    message: |
      {target} is not present in the DepMap ParalogV2 dual-KO library — a coverage gap (the library
      screens curated paralog pairs only). NOT evidence of no combinatorial dependency. Published
      CC-BY GI maps (Dede/in4mer/Horlbeck) are a future corroboration leg for non-covered genes.
    rationale: |
      Measured-vs-null discipline: absence from the paralog library is a coverage gap → insufficient,
      NEVER a negative verdict.

  - rule_id: combo-data-unavailable
    when:
      card_id: combinatorial-dependency
      field: combinatorial_dependency_class
      equals: data_unavailable
    signals:
      small_molecule: insufficient
      degrader: insufficient
    verdict: combinatorial_dependency_insufficient
    message: |
      Paralog GI product could not be read (infrastructure / access). Verdict withheld — an
      environment failure, not a biology signal.
    rationale: |
      Distinguish env-failure (data_unavailable) from measured absence (no_paralog_screened) — both
      route to insufficient, but the message differs for the operator.
