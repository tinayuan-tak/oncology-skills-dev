# Triage dispositions for the SHARP discordance rows (calibration_gap + verdict_rule_gap), keyed by the
# ledger row key "SKILL|TARGET|INDICATION|AXIS|GAP_CLASS". The structured record of the CASE_LOG triage
# (CASE-007..010), consumed by loop_health.py to measure the loop's own precision. Update this alongside
# CASE_LOG when a row is triaged; prune the baseline when a real gap is FIXED.
#
# disposition vocabulary:
#   fixed                    - a landed fix addresses this row (verdict-INERT caveat or verdict-moving)
#   real_deferred            - a REAL gap, fix deferred (data-build / verdict-moving follow-up)
#   dismissed_scope          - a MEASURED-axis contradiction, but the axis is scope-honest AND the verdict
#                              is already conservative; resolved with a scope caveat (not a bug)
#   dismissed_concordant     - literature actually AGREES with the verdict; the lane over-flagged a sub-axis
#   dismissed_data_absent    - the omics axis was data_unavailable; literature cannot contradict an absent signal
#   auto_demoted_concordant  - the concordant-over-flag GUARD now removes this row from the sharp set
#                              automatically (lane overall_consistency==concordant + a lone axis contradicts →
#                              gap_class concordant_over_flag). No longer counted in n_sharp — the manual
#                              dismissed_concordant triage graduated into the deterministic ledger guard.
#
# "real" (numerator of strict precision) = fixed + real_deferred.
# "noise" = dismissed_concordant + dismissed_data_absent. "scope" is reported separately (borderline-honest).
# auto_demoted_concordant rows are EXCLUDED from n_sharp (the guard drops them upstream of the sharp set).

