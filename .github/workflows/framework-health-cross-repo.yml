name: framework-health-cross-repo

# The CROSS-REPO staleness guard the framework review found was wired into NO CI.
#
# build_framework_health.py --check and build_living_doc --check probe all FOUR sibling repos
# (skills / analysis-methods / data-products / data-catalog) and FAIL when a committed dashboard feed
# (health/framework_health.json, health/framework_atlas.json) has drifted from what the CURRENT
# card / rule / resolver / skill wiring computes — e.g. a card added with an unbuilt method, an
# orphaned card, or a skill<->card wiring change. That is the integrity check nothing else enforces:
# framework-health.yml runs only the checkout-only --self-check (internal consistency of the committed
# artifact), which cannot see cross-repo drift; the full --check lived only in `make` targets a human
# had to remember to run. This job checks out all five repos so the real --check can run in CI.
#
# LAYOUT: build_framework_health.probe.default_roots() + build_living_doc default their sibling roots
# to (parent-of-contracts)/rnd-computational-biology-oncology-<repo>. Checking every repo out under
# ${{ github.workspace }}/rnd-computational-biology-oncology-<repo> makes those defaults resolve with
# no flags (the working-directory'd contracts checkout's parent IS the workspace).
#
# TOKEN: needs read access to the sibling repos — repo/org secret CROSS_REPO_TOKEN (a PAT or GitHub
# App token), mirroring skills-validate.yml. Without it the sibling checkouts 403 and the job cannot run.
#
# EXPECT RED until the committed feeds are regenerated: as of this workflow's addition BOTH feeds are
# STALE (verified 2026-09-06, behind ~22 verdict-moving contract commits). Regenerate + commit via
# `make atlas` and `python validators/framework_health/build_framework_health.py` (see Makefile). A red
# run here is the guard doing its job — surfacing drift that previously shipped silently.

# Least-privilege token: this job only reads (checks out repos + runs the --check guards, writes
# nothing back). The sibling-repo checkouts authenticate via CROSS_REPO_TOKEN, not this token.
permissions:
  contents: read

on:
  schedule:
    - cron: "0 7 * * *"        # daily 07:00 UTC backstop
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      # a change to any of these can move what the dashboards should say → re-check drift on merge
      - "cards/**"
      - "interpretation-rules/**"
      - "resolvers/**"
      - "schemas/**"
      - "vocabularies/**"
      - "health/**"
      - ".github/workflows/framework-health-cross-repo.yml"

jobs:
  cross-repo-staleness:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target-contracts
        uses: actions/checkout@v4
        with:
          path: rnd-computational-biology-oncology-target-contracts

      - name: Checkout skills (sibling)
        uses: actions/checkout@v4
        with:
          repository: oneTakeda/rnd-computational-biology-oncology-claude-oncology-skills
          ref: v2-architecture
          path: rnd-computational-biology-oncology-claude-oncology-skills
          token: ${{ secrets.CROSS_REPO_TOKEN || github.token }}

      - name: Checkout analysis-methods (sibling)
        uses: actions/checkout@v4
        with:
          repository: oneTakeda/rnd-computational-biology-oncology-analysis-methods
          ref: main
          path: rnd-computational-biology-oncology-analysis-methods
          token: ${{ secrets.CROSS_REPO_TOKEN || github.token }}

      - name: Checkout data-products (sibling)
        uses: actions/checkout@v4
        with:
          repository: oneTakeda/rnd-computational-biology-oncology-data-products
          ref: main
          path: rnd-computational-biology-oncology-data-products
          token: ${{ secrets.CROSS_REPO_TOKEN || github.token }}

      - name: Checkout data-catalog (sibling)
        uses: actions/checkout@v4
        with:
          repository: oneTakeda/rnd-computational-biology-oncology-data-catalog
          ref: main
          path: rnd-computational-biology-oncology-data-catalog
          token: ${{ secrets.CROSS_REPO_TOKEN || github.token }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip pyyaml jsonschema

      - name: framework_health cross-repo staleness (--check)
        working-directory: rnd-computational-biology-oncology-target-contracts
        run: python validators/framework_health/build_framework_health.py --check --json-only

      - name: architecture atlas cross-repo staleness (--check)
        working-directory: rnd-computational-biology-oncology-target-contracts
        run: python -m validators.architecture_dashboard.living.build_living_doc --check
