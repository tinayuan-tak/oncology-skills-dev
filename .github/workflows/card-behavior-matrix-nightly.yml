name: Nightly Live Drift (card-behavior matrix + target-intrinsic + tumor-presence + tumor-selectivity)

# The LIVE half of the framework's offline drift guards. Three independent offline replays run
# credential-less on every PR (in skills-validate); THIS scheduled workflow re-freezes their fixtures
# against the real onc-compbio bucket + sibling repos and re-asserts them, catching drift the offline
# replays cannot see because they read frozen snapshots:
#   1. #5 card-behavior matrix (skills/tests/card_behavior_matrix/) — a card that stays REACHABLE but
#      stops FIRING on real data (silent data/shard/contract drift) + subgroup null-strata traps.
#   2. target-intrinsic dossier (skills/target-intrinsic/tests/) — the reader-real-field-names bug
#      class: a card method renaming an output field makes the _HEADLINE_SPEC read resolve to None
#      SILENTLY. The offline replay (test_target_intrinsic_replay.py) pins this against a FROZEN
#      fixture; only a live re-freeze can catch the frozen snapshot itself going stale vs live readers.
#   3. tumor-presence dossier (skills/tumor-presence/tests/) — same drift class PLUS the verdict path
#      (a reader renaming a field a RULE keys on collapses presence_verdict to a false-negative). Its
#      offline replay (test_tumor_presence_replay.py) pins EPCAM/COADREAD; tumor-presence has NO live
#      golden, so this nightly re-freeze is its ONLY guard against the frozen snapshot going stale.
#   4. tumor-selectivity dossier (skills/tumor-selectivity/tests/) — same verdict-path drift class.
#      Its offline replay (test_selectivity_replay.py) pins CEACAM5/COADREAD (clean-selective, no veto)
#      and TACSTD2/COADREAD (all three normal-breadth veto arms fire -> selective_but_broadly_normal).
#      A veto-card reader drifting would silently un-fire the veto (TROP2 -> tumor_selective FALSE
#      POSITIVE); only a live re-freeze catches the frozen snapshot itself going stale.
#
# CREDENTIAL GATING (honest-scaffold): the live freeze needs AWS creds, which no other workflow in
# this repo uses (all PR CI self-skips live-S3). Until an OIDC role is provisioned as the repo secret
# AWS_ROLE_TO_ASSUME, the freeze steps are SKIPPED. Once the secret exists, the freezes run live and
# the job goes red on real drift. This keeps the workflow from false-reddening before the role is wired.
#
# NO-CREDS EARLY-EXIT (#2092): when HAVE_AWS is false the four dossier asserts below are gated OFF —
# without a live re-freeze they read the SAME committed fixtures the PR suite already asserts every
# PR (a strict-subset re-run: card_behavior_matrix + target-intrinsic + tumor-presence +
# tumor-selectivity all run in skills-validate's pytest-shards). So credential-less the job posts
# the no-creds warning and exits green having done nothing PR CI didn't. The LIVE half (freezes +
# breadth smoke + drift-fail) is untouched and still runs the instant the OIDC role lands.
#
# DATA-CATALOG VINTAGE SKEW (decide when the OIDC role lands): this nightly (and discordance-monitor)
# check out data-catalog at `ref: main` (UNPINNED), whereas PR CI (skills-validate.yml) pins
# env.DATA_CATALOG_SHA. Once live freezes run, a manifest that moved on data-catalog main but not at
# the PR pin could surface here as "drift" that PR CI cannot see. Decide then whether the nightly
# should pin the same SHA (reproducible, but blind to catalog drift — arguably the thing a nightly
# SHOULD catch) or stay on main (catches catalog drift, at the cost of a moving reference).

on:
  schedule:
    - cron: "17 7 * * *"        # 07:17 UTC nightly (off the top-of-hour runner surge)
  workflow_dispatch:            # manual re-freeze / drift check

permissions:
  id-token: write               # for OIDC assume-role (configure-aws-credentials)
  contents: read

jobs:
  freeze-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HAVE_AWS: ${{ secrets.AWS_ROLE_TO_ASSUME != '' }}
      # methods/ and contracts/ are IN-TREE since the SK#2063 consolidation.
      ANALYSIS_METHODS_ROOT: ${{ github.workspace }}/rnd-computational-biology-oncology-claude-oncology-skills/methods
      TARGET_CONTRACTS_ROOT: ${{ github.workspace }}/rnd-computational-biology-oncology-claude-oncology-skills/contracts
      DATA_CATALOG_ROOT: ${{ github.workspace }}/rnd-computational-biology-oncology-data-catalog
    steps:
      - name: Checkout skills
        uses: actions/checkout@v4
        with:
          path: rnd-computational-biology-oncology-claude-oncology-skills

      - name: Checkout data-catalog (sibling — target_id_resolver editable pixi dep)
        uses: actions/checkout@v4
        with:
          repository: oneTakeda/rnd-computational-biology-oncology-data-catalog
          ref: main
          path: rnd-computational-biology-oncology-data-catalog
          token: ${{ secrets.CROSS_REPO_TOKEN || github.token }}

      - name: Set up pixi (installs the locked env incl. the editable siblings)
        uses: prefix-dev/setup-pixi@v0.8.1
        with:
          pixi-version: v0.70.2
          cache: true
          manifest-path: rnd-computational-biology-oncology-claude-oncology-skills/pixi.toml

      - name: Configure AWS credentials (OIDC assume-role)
        if: env.HAVE_AWS == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: us-east-1

      # Framework-review SK1 — BREADTH live smoke. The per-skill re-freezes below cover 4 skills'
      # fixtures; this runs the full in-process fan-out for a canonical target across ALL ~15 wired
      # sub-skills and FAILS on any `_live_read_error` (a reader that blew up on real data → the
      # sub-verdict silently degrades to insufficient with PR CI green). data_unavailable is INFO, not
      # a failure. Exits 1 on any hard read-error → reds the nightly so the breakage is not ignored.
      - name: Live-reader breadth smoke (all sub-skills, KRAS/COADREAD)
        if: env.HAVE_AWS == 'true'
        working-directory: rnd-computational-biology-oncology-claude-oncology-skills
        run: pixi run python eval/live_reader_smoke.py --target KRAS --indication COADREAD

      - name: Re-freeze fixtures against live S3
        if: env.HAVE_AWS == 'true'
        working-directory: rnd-computational-biology-oncology-claude-oncology-skills
        run: pixi run python skills/tests/card_behavior_matrix/freeze.py --all

      - name: Report which fixtures drifted
        if: env.HAVE_AWS == 'true'
        working-directory: rnd-computational-biology-oncology-claude-oncology-skills
        run: |
          if ! git diff --quiet -- skills/tests/card_behavior_matrix/fixtures/; then
            echo "::warning title=card-behavior-matrix::live fixtures drifted vs committed — see diff below"
            git --no-pager diff --stat -- skills/tests/card_behavior_matrix/fixtures/
            echo "DRIFT_DETECTED=true" >> "$GITHUB_ENV"
          else
            echo "no fixture drift"
          fi

      - name: Re-freeze target-intrinsic EGFR fixture against live S3
        if: env.HAVE_AWS == 'true'
        working-directory: rnd-computational-biology-oncology-claude-oncology-skills
        run: pixi run python skills/target-intrinsic/tests/freeze_fixture.py

      - name: Report whether the target-intrinsic fixture drifted
        if: env.HAVE_AWS == 'true'
        working-directory: rnd-computational-biology-oncology-claude-oncology-skills
        run: |
          if ! git diff --quiet -- skills/target-intrinsic/tests/fixtures/; then
            echo "::warning title=target-intrinsic::live EGFR fixture drifted vs committed — a reader field/value changed. See diff; refresh the committed fixture if intended."
            git --no-pager diff --stat -- skills/target-intrinsic/tests/fixtures/
            echo "DRIFT_DETECTED=true" >> "$GITHUB_ENV"
          else
            echo "no target-intrinsic fixture drift"
          fi

      - name: Re-freeze tumor-presence EPCAM/COADREAD fixture against live S3
        if: env.HAVE_AWS == 'true'
        working-directory: rnd-computational-biology-oncology-claude-oncology-skills
        run: pixi run python skills/tumor-presence/tests/freeze_fixture.py

      - name: Report whether the tumor-presence fixture drifted
        if: env.HAVE_AWS == 'true'
        working-directory: rnd-computational-biology-oncology-claude-oncology-skills
        run: |
          if ! git diff --quiet -- skills/tumor-presence/tests/fixtures/; then
            echo "::warning title=tumor-presence::live EPCAM/COADREAD fixture drifted vs committed — a reader field/value or fired-rule changed. See diff; refresh the committed fixture if intended."
            git --no-pager diff --stat -- skills/tumor-presence/tests/fixtures/
            echo "DRIFT_DETECTED=true" >> "$GITHUB_ENV"
          else
            echo "no tumor-presence fixture drift"
          fi

      - name: Re-freeze tumor-selectivity fixtures against live S3
        if: env.HAVE_AWS == 'true'
        working-directory: rnd-computational-biology-oncology-claude-oncology-skills
        run: |
          pixi run python skills/tumor-selectivity/tests/freeze_fixture.py --target CEACAM5 --indication COADREAD
          pixi run python skills/tumor-selectivity/tests/freeze_fixture.py --target TACSTD2 --indication COADREAD

      - name: Report whether the tumor-selectivity fixtures drifted
        if: env.HAVE_AWS == 'true'
        working-directory: rnd-computational-biology-oncology-claude-oncology-skills
        run: |
          if ! git diff --quiet -- skills/tumor-selectivity/tests/fixtures/; then
            echo "::warning title=tumor-selectivity::live CEACAM5/TACSTD2 fixture drifted vs committed — a reader field/value or fired-rule (incl. a normal-breadth veto arm) changed. See diff; refresh the committed fixture if intended."
            git --no-pager diff --stat -- skills/tumor-selectivity/tests/fixtures/
            echo "DRIFT_DETECTED=true" >> "$GITHUB_ENV"
          else
            echo "no tumor-selectivity fixture drift"
          fi

      - name: No-creds notice
        if: env.HAVE_AWS != 'true'
        run: echo "::warning title=nightly-live-drift::AWS_ROLE_TO_ASSUME secret not set — skipping live freezes, verifying COMMITTED fixtures only. Provision the OIDC role to enable live drift detection."

      # Assert the four-state matrix. When the freeze ran, this is against FRESH live data (drift →
      # red). When it didn't, it re-verifies the committed fixtures (same as the PR suite).
      - name: Assert card-behavior matrix (four-state)
        if: env.HAVE_AWS == 'true'   # no-creds early-exit (#2092): PR CI already asserts this fixture
        working-directory: rnd-computational-biology-oncology-claude-oncology-skills
        run: pixi run pytest skills/tests/card_behavior_matrix/ -q --import-mode=importlib

      # Assert the target-intrinsic dossier. When the re-freeze ran, the offline replay now reads the
      # FRESH fixture (drift → red via the >=12 headline drift floor); the live golden also runs
      # end-to-end. When creds are absent, this re-verifies the committed fixture (same as the PR suite).
      - name: Assert target-intrinsic dossier (drift floor + live golden)
        if: env.HAVE_AWS == 'true'   # no-creds early-exit (#2092): PR CI already asserts this fixture
        working-directory: rnd-computational-biology-oncology-claude-oncology-skills
        run: pixi run pytest skills/target-intrinsic/tests/ -q --import-mode=importlib

      # Assert the tumor-presence dossier. When the re-freeze ran, the offline replay reads the FRESH
      # fixture — drift → red via the verdict floor (presence_verdict must stay a measured-positive RNA
      # call), the per-modality bucket floor, and the >=30 non-null headline floor. When creds are
      # absent, this re-verifies the committed fixture (same as the PR suite). Unlike target-intrinsic,
      # tumor-presence has NO live golden, so this re-freeze is its ONLY guard against snapshot staleness.
      - name: Assert tumor-presence dossier (verdict + bucket + headline drift floors)
        if: env.HAVE_AWS == 'true'   # no-creds early-exit (#2092): PR CI already asserts this fixture
        working-directory: rnd-computational-biology-oncology-claude-oncology-skills
        run: pixi run pytest skills/tumor-presence/tests/ -q --import-mode=importlib

      # Assert the tumor-selectivity dossier. When the re-freeze ran, the offline replay reads the
      # FRESH fixtures — drift -> red via the verdict floor (resolved selectivity_class must not
      # collapse; CEACAM5 must stay selective with no false veto; TACSTD2 must stay downgraded by the
      # normal-breadth veto) + the >=20 non-null headline floor. When creds are absent, this
      # re-verifies the committed fixtures (same as the PR suite).
      - name: Assert tumor-selectivity dossier (verdict collapse + veto + headline drift floors)
        if: env.HAVE_AWS == 'true'   # no-creds early-exit (#2092): PR CI already asserts this fixture
        working-directory: rnd-computational-biology-oncology-claude-oncology-skills
        run: pixi run pytest skills/tumor-selectivity/tests/ -q --import-mode=importlib

      # FAIL the nightly on ANY live drift (was warning-only, so benign within-match drift accumulated
      # silently — the assert steps above only catch drift that violates a four-state / verdict floor).
      # Runs after every re-freeze + assert + the artifact-producing steps, and is gated on always() so a
      # red assert above still lets this surface the drift set. Placed BEFORE upload so the refreshed
      # fixtures are still archived (upload is if: always()). No-op when creds are absent (no re-freeze →
      # no drift possible; DRIFT_DETECTED unset).
      - name: Fail on any live fixture drift
        if: always() && env.HAVE_AWS == 'true'
        run: |
          if [ "${DRIFT_DETECTED:-false}" = "true" ]; then
            echo "::error title=nightly-live-drift::one or more live fixtures drifted vs committed — a reader field/value or fired-rule changed. Download the nightly-live-drift-fixtures artifact, review, and either commit the refreshed fixtures (intended) or fix the reader (regression). Failing the nightly so the drift is not silently ignored."
            exit 1
          fi
          echo "no live drift across any dossier — nightly green"

      - name: Upload refreshed fixtures
        # always() so a red assert still archives the refreshed fixtures; gated on HAVE_AWS (#2092)
        # because credential-less there is no re-freeze — nothing new to upload (no-creds early-exit).
        if: always() && env.HAVE_AWS == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: nightly-live-drift-fixtures
          path: |
            rnd-computational-biology-oncology-claude-oncology-skills/skills/tests/card_behavior_matrix/fixtures/
            rnd-computational-biology-oncology-claude-oncology-skills/skills/tumor-presence/tests/fixtures/
            rnd-computational-biology-oncology-claude-oncology-skills/skills/tumor-selectivity/tests/fixtures/
            rnd-computational-biology-oncology-claude-oncology-skills/skills/target-intrinsic/tests/fixtures/
          if-no-files-found: warn
