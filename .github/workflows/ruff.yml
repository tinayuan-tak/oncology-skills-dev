name: ruff
# Fleet delint Phase 3 — diff-aware lint + fleet-wide format check.
# format --check runs on ALL files (the tree is fully ruff-formatted). ruff check runs
# ONLY on the PR's changed .py files, so the legacy lint backlog is grandfathered while new
# / edited code must be clean.
#
# THIS IS A REQUIRED STATUS CHECK on v2-architecture. Branch protection requires exactly two
# contexts — `pytest` (skills-validate.yml) and `ruff` (this workflow's job) — with strict: false,
# and the branch carries no rulesets. Re-measure rather than trust this line:
#   gh api 'repos/{owner}/{repo}/branches/v2-architecture/protection' --jq .required_status_checks
# ⇒ Do NOT add a `paths:` filter here. A required context that never runs on a PR leaves that PR
# permanently "Expected — waiting for status" and unmergeable (the required-check deadlock;
# skills-validate.yml's header carries the long-form warning for the same reason). Path-filtering
# this workflow means FIRST dropping `ruff` from the branch-protection required set.
#
# NB "Phase 4" names two independent things and only ONE has landed: promoting this check to
# required (done) vs. the ruff.toml rule-family ratchet beyond select = ["F", "I"] out to bugbear
# and the style families (NOT done). Neither implies the other.
on:
  pull_request:

jobs:
  ruff:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # need the base branch to diff changed files
      - name: Install ruff (pinned)
        run: pipx install ruff==0.16.6
      - name: Format check (whole tree)
        run: ruff format --check .
      - name: Lint changed files (diff-aware)
        run: |
          set -euo pipefail
          base="${{ github.base_ref }}"
          git fetch -q origin "$base"
          changed=$(git diff --name-only --diff-filter=ACMR "origin/$base"...HEAD -- '*.py' || true)
          if [ -z "$changed" ]; then echo "No changed .py files."; exit 0; fi
          echo "Changed .py files:"; echo "$changed"
          echo "$changed" | xargs ruff check
