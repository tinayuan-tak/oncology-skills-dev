name: ruff
# Fleet delint Phase 3 — diff-aware lint + fleet-wide format check.
# format --check runs on ALL files (the tree is fully ruff-formatted). ruff check runs
# ONLY on the PR's changed .py files, so the legacy lint backlog is grandfathered while new
# / edited code must be clean. Not (yet) a required status check — Phase 4 promotes it.
on:
  pull_request:

jobs:
  ruff:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # need the base branch to diff changed files
      - name: Install ruff (pinned)
        run: pipx install ruff==0.16.6
      - name: Format check (whole tree)
        run: ruff format --check .
      - name: Lint changed files (diff-aware)
        run: |
          set -euo pipefail
          base="${{ github.base_ref }}"
          git fetch -q origin "$base"
          changed=$(git diff --name-only --diff-filter=ACMR "origin/$base"...HEAD -- '*.py' || true)
          if [ -z "$changed" ]; then echo "No changed .py files."; exit 0; fi
          echo "Changed .py files:"; echo "$changed"
          echo "$changed" | xargs ruff check
