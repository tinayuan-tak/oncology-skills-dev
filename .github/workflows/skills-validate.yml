name: Skills Validate

# T9 (2026-08-11 engineering review): the claude-oncology-skills repo had NO CI — the skill
# test suites never ran on a PR, so schema-vs-reality drift and regressions shipped silently.
# This workflow runs the skill test suites on every PR. Live-data tests that need S3 skip
# themselves when the onc-compbio bucket is unreadable (see
# skills/_skills_common/tests/conftest.py::skip_if_no_data), so the suite is green on a
# credential-less CI runner.
#
# PARALLELISM (2026-09-16): the pytest work is split across parallel matrix SHARDS to cut CI
# wall-clock (was ~23 min median, serial, grazing the 25 min timeout). The 4 big suites are split
# THREE ways (measured, not guessed): shard=core-common = _skills_common; shard=core-guards =
# skills/tests + eval/ (skills/tests, with its cross-skill guards + the end-to-end test_graduated
# run, was the heaviest under -n auto); shard=core-profile = target-profile — each under `-n auto`
# (pytest-xdist, ~nproc workers). shard=0..3 each run a deterministic round-robin slice of the
# remaining per-skill suites. A fan-in job named `pytest`
# (the branch-protection required status check) aggregates all shards — see the `pytest` job at
# the bottom. The matrix jobs report as `pytest-shards (…)` and are NOT the required check; the
# required name `pytest` MUST stay attached to the fan-in job or the required check would deadlock
# (a bare matrix reports only `pytest-shards (N)` and `pytest` would never post).
#
# CROSS-REPO LAYOUT: this repo's pixi.toml editable-depends on THREE sibling repos via `../`
# paths (analysis-methods, target-contracts, data-catalog/libs/target_id_resolver). CI must
# lay them out adjacent under $GITHUB_WORKSPACE so `pixi install --locked` resolves them and
# the tests can import the method/contract code. Checking out PRIVATE sibling repos needs a
# token with read access: set repo/org secret `CROSS_REPO_TOKEN` (a PAT or GitHub App token
# with contents:read on the three siblings). It falls back to the default GITHUB_TOKEN, which
# only works if each sibling has granted this repo's Actions access (Settings → Actions →
# Access) — otherwise the sibling-checkout steps 403 and CI cannot run.
#
# SIBLING PINS (2026-09-14): the three sibling checkouts below are pinned to explicit SHAs, not
# `ref: main`. Measured reason: contracts 56 + methods 31 + catalog 15 commits per 72 h ≈ 34
# re-baselining events/day, each silently changing what this suite tested on PRs that did not
# cause the change. Measured live while authoring this pin: ALL THREE siblings moved within one
# 9-minute window (methods 10f9b718→0006164e, contracts cd24888d→a716f923, catalog
# 7fd03697→1addffdd), so a PR whose CI ran at 14:05Z and re-ran at 14:14Z was tested against
# three different sibling trees with no diff of its own — a re-run stopped being a retry and
# became a different experiment. `pixi install --locked` does NOT protect against this: the
# siblings are EDITABLE PATH deps, so the lockfile pins their names, never their content.
#
# The property the pins buy is not "fewer reds" — it is that THE PINNED TRIPLE IS ALWAYS A
# KNOWN-GREEN INTEGRATION STATE. Sibling breakage stops landing on an unrelated contributor's
# PR and lands on the bump PR instead, quarantined there: a red bump PR does not merge, so the
# pins do not advance past a break.
#
# The cost is real and points the other way: pins go stale SILENTLY, so the bump mechanism is
# load-bearing rather than a convenience. `bump-sibling-pins.yml` runs daily, force-pushes the
# single branch `chore/bump-sibling-pins`, and keeps exactly ONE open PR meaning "current
# sibling mains vs. what we actually test against", with the per-sibling commit range in the
# body so a red is attributable to a named sibling commit. Cadence is the knob: shorter =
# better attribution, more PR noise. To bump by hand: Actions → Bump sibling CI pins → Run
# workflow.
#
# Do NOT revert a pin to `ref: main` to "get the latest". That re-opens the ~34/day churn and
# removes the last signal telling target-contracts it broke skills — contracts-validate never
# checks out skills and graceful-skips its figure-emission check, and the only job that sees
# both repos (framework-health-cross-repo.yml, in TARGET-CONTRACTS) is parked to
# workflow_dispatch. Bump the pin instead; that is what the bump PR is for.

# NOTE (2026-08-12): the pull_request trigger runs on ALL PRs — no `paths:` filter — because the
# `pytest` check is a REQUIRED status check on main (branch protection). A required check
# that is path-filtered would never report on a PR touching only non-matching paths (libs/, notebooks/,
# tests/, docs), leaving that PR permanently "Expected — waiting for status" and unmergeable (the
# required-check deadlock). Running the (fast, self-skipping-when-credential-less) suite on every PR
# is the robust way to keep the required check from ever wedging a merge. Do NOT re-add `paths:` here
# without first dropping `pytest` from the branch-protection required set.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  pytest-shards:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      # fail-fast: false — one red shard must NOT cancel the others, so a PR sees EVERY failure in
      # one run (and the fan-in still fails). shard=core = the 4 big suites under -n auto; 0..3 =
      # round-robin slices of the per-skill loop. Keep NUM_LOOP_SHARDS (in the run step) equal to
      # the count of numeric shards here.
      fail-fast: false
      matrix:
        shard: [core-common, core-guards, core-profile, 0, 1, 2, 3]
    env:
      # The skill readers resolve sibling code via these env vars (sys.path), in addition to the
      # editable pixi installs. Point them at the CI checkouts, not the local-dev default path.
      ANALYSIS_METHODS_ROOT: ${{ github.workspace }}/rnd-computational-biology-oncology-analysis-methods
      TARGET_CONTRACTS_ROOT: ${{ github.workspace }}/rnd-computational-biology-oncology-target-contracts
      DATA_CATALOG_ROOT: ${{ github.workspace }}/rnd-computational-biology-oncology-data-catalog
      # Thread the card readers (not the default process fork-pool). Harmless on credential-less CI
      # (forked readers hit no-data instantly) but defensive under `-n auto` if creds are ever added.
      # Byte-identical test output either way.
      SKILLS_READ_POOL: thread
    steps:
      - name: Checkout skills
        uses: actions/checkout@v4
        with:
          path: rnd-computational-biology-oncology-claude-oncology-skills

      - name: Checkout analysis-methods (sibling — editable pixi dep)
        uses: actions/checkout@v4
        with:
          repository: oneTakeda/rnd-computational-biology-oncology-analysis-methods
          # PINNED — main @ 2026-09-19T11:47:03Z. Bumped BY HAND to include depmap-predictability v4:
          # DEFAULT_RELEASE_PIN 26q1-v3→v4 (#670) + the provenance-stamping reader (#672); see SIBLING PINS above.
          ref: 22dff19bb8093f36ebc1f3db58a43225d7c7324c
          path: rnd-computational-biology-oncology-analysis-methods
          token: ${{ secrets.CROSS_REPO_TOKEN || github.token }}

      - name: Checkout target-contracts (sibling — editable pixi dep)
        uses: actions/checkout@v4
        with:
          repository: oneTakeda/rnd-computational-biology-oncology-target-contracts
          # PINNED — main @ 2026-09-28 (#1941, TC PR#951: declare 4 optional evidence_package
          # sections; gap over prior pin = TC#950 nomination-gate annotation_only_indirect→
          # tractability_sm contradiction). Bumped BY HAND; measured aperture-inert (ceiling
          # unchanged); see SIBLING PINS above.

          # BUMPED BY HAND HERE, not by the bump PR, because this pin and APERTURE_CEILING in
          # skills/_skills_common/tests/test_field_disposition.py are two halves of ONE fact and the
          # aperture ratchet is TWO-SIDED: a lone bump can red the SLACK half and a lone ceiling move the
          # CEILING half, so each can block the other, and whoever LOWERS the ceiling must move the pin in
          # the same commit. (The full 2x2 derivation lives in this file's git history at the c88c6e04 pin.)
          #
          # THIS BUMP needs NO ceiling move, and that is MEASURED as a 2x2 over BOTH axes against the EXACT
          # refs, not against a moving main — because a one-axis measurement cannot tell "the bump is inert"
          # from "the bump and the branch cancelled out":
          #                              contracts 2c322f8      contracts 6ff21f8 (this pin)
          #   skills trunk (548a6a84)     orphans 886, gap 1     orphans 886, gap 1
          #   skills this branch          orphans 885, gap 2     orphans 885, gap 2
          # domain is 1808 in all four cells. Read the table by axis: the CONTRACTS axis moves NOTHING (886->886,
          # 885->885), so this pin is aperture-inert; the -1 is entirely THIS BRANCH newly reading a
          # declared-but-unread field (tumor-rna-distribution `high_fraction`, lifted onto the headline in
          # tumor-presence 1.22.0). 885 <= 887 clears the CEILING half and 887 - 885 = 2 <= APERTURE_SLACK 20
          # clears the SLACK half, so the ceiling stays 887 and this pin moves ALONE. Aperture suite: 69 passed.
          # (The trunk x 2c322f8 cell reproducing the previous bump's 886 exactly is the instrument control —
          # without it a changed number could be a broken census rather than a real movement.)
          #
          # WHY THIS BUMP IS NOT OPTIONAL — same ATOMIC-fix rule as the prior bump, in the OPPOSITE direction.
          # TC#805 (6ff21f8) declared the rule `tumor-expression-subset-high-supportive`, and this branch adds
          # the matching rung to run.py's `_EXPRESSION_RANK`. Two guards in
          # skills/tumor-presence/tests/test_ladder_invariants.py evaluate that rule against the LIVE contracts
          # rules file, so they pass against a tree that declares it and FAIL against one that does not.
          # MEASURED, by substituting the tree CI actually checks out (`git archive <pin>` + TARGET_CONTRACTS_ROOT):
          #   contracts 2c322f8: 2 failed, 272 passed   <- what CI would have reported
          #   contracts 6ff21f8: 274 passed             <- what a clean trunk checkout reports
          # So the RULE-READING GUARD AND THIS PIN MUST MOVE IN ONE COMMIT. Note the direction: the prior bump
          # was GREEN in CI and RED on trunk; this one is GREEN on trunk and RED in CI. A local suite run reads
          # whatever SHA the sibling checkout happens to sit on, so it CANNOT detect either direction — the pin
          # is the declaration boundary that matters, NOT contracts `main`.
          #
          # PRIOR PIN, for the record: 2c322f89dbe8cbb38e3cfe3143eb8140e3a89868, "main @ 2026-09-18T03:59:38Z
          # (#801)" — accurate as written. Its rationale was the mirror-image case: TC#786 (b92956e) declared
          # `sc_normal_essential_veto_grade`, whose field-disposition ledger row asserts drift in BOTH
          # directions (`orphans = emitted - ledger` AND `stale = ledger - emitted`), so no forward-compatible
          # ledger shape exists and the row had to move with the pin. Full derivation in this file's git history.
          #
          # ============================================================================================
          # BUMP 6ff21f8 -> 26eee89, "main @ 2026-09-18T11:35Z (#807)". THIRD hand bump in this arc, and the
          # THIRD distinct direction — record it as such, because "the pin lags" is not one failure mode:
          #   prior-prior (2c322f8): CI GREEN / trunk RED   — a ledger row had to move WITH the pin
          #   prior      (6ff21f8): trunk GREEN / CI RED    — a rule-reading guard had to move WITH the pin
          #   this one   (26eee89): local GREEN / CI RED    — an ALLOWLIST DELETION has to move WITH the pin
          #
          # WHY IT IS FORCED-ATOMIC. TC#807 (26eee89) appended `tumor_subset_high_expression` to
          # `$defs.presence_verdict_enum` (33 -> 34 values, append-only, nothing else in that file changed).
          # That is phase 3a of the subset_high split, and it is what finally DECLARES the verdict that skills
          # #1441 already made emittable. `skills/tumor-presence/tests/test_ladder_invariants.py` held the gap
          # open as a named `_UNDECLARED_LADDER_VERDICTS` allowlist whose paired assert fires when 3a lands;
          # this commit deletes that allowlist. Deleting it against the OLD pin is red, keeping it against the
          # NEW tree is red, so the two edits cannot be separated.
          #
          # MEASURED AS A 2x2 over the EXACT refs (`git archive <ref>` + TARGET_CONTRACTS_ROOT), skills
          # trunk 22b89319 vs this branch, `pytest skills/tumor-presence/tests/ -q`:
          #                              contracts 6ff21f8 (old pin)   contracts 26eee89 (this pin)
          #   skills trunk (22b89319)     274 passed                    2 failed, 272 passed
          #   skills this branch          2 failed, 272 passed          274 passed
          # (First measured at trunk 08284392, then RE-MEASURED after a rebase onto 22b89319 moved trunk under
          # it. Re-measuring rather than relabelling is the point: a 2x2 cell is a claim about a NAMED tree, so
          # a rebase silently converts an accurate cell into a false one unless the label and the number move
          # together. All four cells reproduced identically, so the argument survives the rebase intact.)
          # COLLECTED is 274 in all four cells, so no cell is green by having dropped a test. The table is
          # ANTI-DIAGONAL, which is the whole point: read either axis alone and you conclude the other side is
          # fine. The same two tests fail in both red cells but for OPPOSITE reasons — token-not-declared on
          # the branch/old-pin cell, token-declared-but-still-allowlisted on the trunk/new-pin cell.
          #
          # THIS BUMP ALSO CROSSES TC#806 (e21a8e8, three by-subtype cards), so the aperture ratchet was
          # re-measured across the contracts axis rather than assumed: orphans 885, domain 1808 and ALL TEN
          # per_kind reach counts are BYTE-IDENTICAL at 6ff21f8 and 26eee89 — ALONG THE CONTRACTS AXIS ONLY,
          # which is the axis this pin moves. Those per_kind counts are NOT absolutes: rebasing this branch onto
          # 22b89319 (peer #1444, minting a SALIENCE_SPEC) moved `salience` reach 327 -> 333 while
          # candidate_orphans stayed 885, because orphans is a UNION over kinds and those 6 newly-reached fields
          # already had reach from another kind. So a union total can absorb a movement its own component cannot,
          # and a changed per_kind count is NOT by itself evidence of a broken census. Compare per_kind only
          # within one base. So the bump is aperture-inert,
          # APERTURE_CEILING stays 887, and 887 - 885 = 2 <= APERTURE_SLACK 20 clears the slack half — the pin
          # moves without a ceiling move. That inertness is STRUCTURAL, not luck: #806 widened `evidence_state`
          # ENUM VALUES and added `required_inputs` shards, and the census counts (card, field) PAIRS, which
          # enum widening cannot create. A future contracts PR adding an `outputs.summary_fields` entry WILL
          # move this axis — re-measure, do not cite this line.
          #
          # ============================================================================================
          # BUMP 26eee89 -> c3eec12, "main @ 2026-09-18T15:23Z (#809)". FOURTH hand bump in this arc, and
          # the FOURTH distinct direction. The running list, because "the pin lags" is not one failure mode:
          #   (2c322f8): CI GREEN / trunk RED   — a ledger row had to move WITH the pin
          #   (6ff21f8): trunk GREEN / CI RED   — a rule-reading guard had to move WITH the pin
          #   (26eee89): local GREEN / CI RED   — an ALLOWLIST DELETION had to move WITH the pin
          #   (c3eec12): local RED / CI GREEN   — a BEHAVIOUR CHANGE landed in contracts first, so the
          #                                       guards asserting the OLD routing broke locally while CI,
          #                                       reading the old pinned SHA, stayed green
          # That fourth direction is the dangerous one: CI is green, `main` is green, and the only signal is
          # a local red. Nothing in either repo's CI can see it, because the gating workflow reads a pinned
          # SHA and so is structurally blind to a contracts landing.
          #
          # WHY IT IS FORCED-ATOMIC. TC#809 (c3eec12) is phase 3b: it removes `subset_high` from
          # `tumor-expression-broadly-high-supportive`'s `in:` list — the arc's ONLY behaviour change. Three
          # tests in skills/tumor-presence/tests/test_ladder_invariants.py assert the PRE-3b routing and are
          # rewritten in this commit:
          #   - test_subset_high_is_still_inert_against_the_live_rules  (asserted the broad rule still fires)
          #       -> test_subset_high_drives_the_verdict_against_the_live_rules
          #   - test_subset_high_becomes_the_verdict_once_the_overlap_is_removed
          #       -> test_restoring_the_broad_overlap_collapses_the_subset_verdict  (control, now inverted)
          #   - test_the_vocabulary_reach_guard_can_actually_fail  (collateral — see below)
          # and the helper `_narrow_broad_rule` is inverted to `_restore_broad_overlap`: it SUBTRACTED
          # subset_high to simulate a narrowing that had not happened, and now ADDS it back to reconstruct
          # the pre-3b shape. Its `stripped == 1` control failed with `narrowed 0` against the new tree — a
          # control that had quietly stopped controlling. The new body asserts the overlap is ABSENT before
          # re-adding it, so it fails loudly against a pre-3b tree rather than silently no-op'ing.
          #
          # COUNT THE CALLERS, NOT THE HELPER. The 3b PR body predicted TWO guards would break. Measured:
          # THREE tests failed, because `_narrow_broad_rule` had two callers and the third
          # (test_the_vocabulary_reach_guard_can_actually_fail) never names subset_high in its own asserts.
          # The mechanism count was right and the test count was wrong. A shared helper makes the blast
          # radius of a contracts change wider than the guards that mention it by name.
          #
          # MEASURED AS A 2x2 over the EXACT refs, skills trunk 9e29d208 vs this branch,
          # `pytest skills/tumor-presence/tests/test_ladder_invariants.py -q`:
          #                              contracts 26eee89 (old pin)   contracts c3eec12 (this pin)
          #   skills trunk (9e29d208)     19 passed                     3 failed, 16 passed
          #   skills this branch          3 failed, 16 passed           19 passed
          # COLLECTED is 19 in all four cells, so no cell is green by having dropped a test. ANTI-DIAGONAL,
          # which is the point: read either axis alone and you conclude the other side is fine. Stronger than
          # the counts: the two red cells fail DIFFERENTLY-NAMED tests — trunk/c_new fails the pre-3b names
          # (..._is_still_inert_..., ..._becomes_the_verdict_once_the_overlap_is_removed) and branch/c_old
          # fails the post-3b ones (..._drives_the_verdict_..., ..._restoring_the_broad_overlap_...). Equal
          # counts for OPPOSITE reasons, which is what makes this a real 2x2 rather than one bug seen twice.
          #
          # HOW TO RE-MEASURE (the invocation is itself a trap). `git archive <ref> | tar -x` both contracts
          # trees, then run the suite FROM THE HOME CHECKOUT with
          #   TARGET_CONTRACTS_ROOT=<tree> PYTHONPATH=<side>/skills pixi run pytest <side>/<test path> -q
          # Never `cd` into a /tmp worktree to run pixi (it deep-copies a multi-GB env -> ENOSPC), and the
          # PYTHONPATH is not optional: pointing pytest at a worktree path from the home checkout fails
          # COLLECTION with `ModuleNotFoundError: No module named '_test_support'`, which prints no pass
          # count at all. Both branch cells first measured that way and read as blank, not as red.
          #
          # ============================================================================================
          # BUMP c3eec12 -> ebdcdfb, "main @ 2026-09-19 (#830 HEAD)". FIFTH hand bump in this arc, and the
          # SECOND instance of the FOURTH direction above (local RED / CI GREEN): a token PRODUCER landed
          # in contracts first, so the skills guards asserting the OLD dependency verdict enum broke
          # LOCALLY while CI, reading the stale pin, stayed green. Contracts dependency.resolver.yaml
          # v1.4.0 -> v1.6.0 (#812/#818, paralog twin #830-era) minted 4 indication-conditioned verdicts —
          # lineage_selective_in_indication / dependent_in_indication / not_dependent_in_indication /
          # insufficient_underpowered_in_indication — plus their nomination_verdict_gate.yaml arms (#814).
          # FORCED-ATOMIC with their skills-side consumption in this same commit: test_resolver_verdict_
          # consumers.py asserts a BIDIRECTIONAL enum equality (consumer sets == resolver enum), so the pin
          # and the consumer edits cannot go green independently (main is protected, neither half lands
          # alone). Aperture ratchet inert (test_field_disposition unchanged at HEAD). This bump also
          # carries the intervening skills-INERT contracts PRs #819-#830; the full skills fan-out on this
          # branch reds ONLY the dependency-token guards, empirically confirming those PRs are skills-inert.
          #
          # ============================================================================================
          # BUMP ebdcdfb -> 1863722c, "main @ 2026-09-23 (#873, over #869/#862)". SIXTH hand bump in this
          # arc. Direction: local RED / CI GREEN again — a token PRODUCER (cellline-rna card fields) landed
          # in contracts first, so the skills ledger guard broke LOCALLY while CI, reading the stale pin,
          # stayed green. This is P3 of the evidence-property epic (#1507): TC #869 declared 8 Card-1
          # `outputs.summary_fields`, TC #873 NARROWED that to the 2 the fleet actually reads —
          # coefficient_of_variation (capsule numeric_anchor) and distribution_pattern (capsule
          # categorical_field) — and reverted the other 6 (2 redundant echoes of allgene_percentile[_class],
          # 3 provenance/version tokens, 1 display array) plus expression_properties (deferred to P4 with its
          # claim/evidence reader). This commit narrows skills/tumor-presence/field_disposition.yaml to
          # disposition exactly those 2 fields.
          #
          # WHY IT IS FORCED-ATOMIC. tumor-presence/tests/test_field_disposition_complete.py::
          # test_ledger_matches_emitted_fields asserts SET EQUALITY (ledger card-section == card
          # outputs.summary_fields) against the LIVE contracts tree. So the pin and the ledger cannot go
          # green independently:
          #   - branch ledger (2 P3 rows) x OLD pin ebdcdfb (card emits neither): the 2 rows are STALE -> RED.
          #     MEASURED (git archive ebdcdfb + TARGET_CONTRACTS_ROOT): "STALE ledger fields (card no longer
          #     emits): ['coefficient_of_variation', 'distribution_pattern']".
          #   - branch ledger x NEW pin 1863722c (card emits both): set-equal -> GREEN (5 passed).
          #   - trunk ledger (no P3 rows) x NEW pin: the 2 emitted fields are UNCLASSIFIED -> RED.
          # Anti-diagonal: read either axis alone and the other looks fine. So pin + ledger move in one commit.
          #
          # APERTURE: MEASURED 781 on this branch x the new pin (domain 1813). 781 == APERTURE_CEILING, so
          # 781 <= 781 clears the ceiling half and 781 - 781 = 0 <= APERTURE_SLACK 20 clears the slack half:
          # THE CEILING DOES NOT MOVE and there is nothing to bank. Why declaring 2 new fields is aperture-
          # inert: TC #873 WIRED both into the card `capsule:` block, so capsule_readers() credits both
          # (verified: neither pair is in the orphan set) — a declared-AND-read field is not a candidate
          # orphan. The 6 reverted #869 fields leave the (card, field) domain entirely. (test_field_disposition.py
          # needs no edit; its vintage for this pin is recorded here, per this file's "a number that did not
          # move still has a new vintage" rule.)
          #
          # ALSO FORCED-ATOMIC: the genomic mirror. The pinned range carries the genomic `underpowered`
          # gap-with-intent tier (TC + skills #1504/#1505); moving the pin surfaces resolver guards that were
          # green only against the stale SHA. This commit mirrors them skills-side (genomic_claims.py
          # _cn_corroboration treats an underpowered patient-focal arm as a gap -> single_arm, not a fabricated
          # `low`; two-arm axes + resolver golden rule_id coverage updated) and regenerates the pinned roster
          # field_read_health.json against 1863722c (2 cellline fields, n=1813). Cross-repo live gate: none.
          #
          # ── BUMPED 1863722c -> 4f4866d4 (TC #876, P4 of the evidence-property architecture, SK#1508). TC #876
          # RE-DECLARES expression_properties on cards/cellline-rna-distribution.card.yaml — the object facet
          # #873 reverted "to return WITH its reader in P4". This commit lands that reader: presence_claims.py
          # `_expression_property_atom` surfaces it as a citable claim-vector evidence atom (verdict-inert), and
          # a field_disposition.yaml role:context row dispositions it. FORCED-ATOMIC for the same set-equality
          # reason as the P3 bump above (test_ledger_matches_emitted_fields): the ledger row and the pin cannot
          # go green independently — old pin x new ledger row = STALE; new pin x no row = UNCLASSIFIED.
          # APERTURE: the reader is a `_patom` claim_passthrough (an EXACT census reader; a capsule cannot credit
          # an object), so declaring the field is domain +1 AND reached +1 → orphan count UNCHANGED at 781 ==
          # APERTURE_CEILING (measured on this branch x the new pin, domain 1814). Ceiling half 781 <= 781 and
          # slack half 781 - 781 = 0 <= 20 both clear; THE CEILING DOES NOT MOVE. Verdict byte-inert: the
          # tumor-presence replay golden and resolver golden are unchanged (the atom is provenance, never a tier).
          # L2b-3 (#1546) BUMP -> c55602a6 (#890): pulls #887 (sc_normal_celltype_expression declared a
          # NORMAL_TISSUE context_type) + #890 (same card anchored in the safety normal-tissue-breadth
          # question answered_by). Needed by this branch: test_hierarchy_connectivity (context_type) and
          # test_question_card_coverage reverse-coverage (answered_by) both read the LIVE contracts tree.
          # Aperture-inert: measured the field_disposition suite (73 passed) against this branch x c55602a6 —
          # orphans stay in [APERTURE_CEILING-APERTURE_SLACK, APERTURE_CEILING] = [761, 781], so the ceiling
          # (781, in test_field_disposition.py) does not move and this pin bumps ALONE.
          # #1719 BUMP -> 37b5728 (TC #902 = issue #882; forward from c55602a6): declares the dropped
          # rna_proxy_class_boundary_fragile signal + its CI backing (rna_protein_r_ci95_low/high) +
          # rna_proxy_classified_on on BOTH concordance cards — rna-protein-concordance-tumor (TC #896,
          # issue #883, commit 026670f) and cellline-rna-protein-concordance (TC #902, issue #882, commit
          # 37b5728). The intervening commit 499bb41 (#898, Card 11 procan) also lands, declaring one field
