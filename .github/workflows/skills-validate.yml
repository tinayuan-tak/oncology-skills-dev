name: Skills Validate

# T9 (2026-08-11 engineering review): the claude-oncology-skills repo had NO CI — the skill
# test suites never ran on a PR, so schema-vs-reality drift and regressions shipped silently.
# This workflow runs the skill test suites on every PR. Live-data tests that need S3 skip
# themselves when the onc-compbio bucket is unreadable (see
# skills/_skills_common/tests/conftest.py::skip_if_no_data), so the suite is green on a
# credential-less CI runner.
#
# CROSS-REPO LAYOUT: this repo's pixi.toml editable-depends on THREE sibling repos via `../`
# paths (analysis-methods, target-contracts, data-catalog/libs/target_id_resolver). CI must
# lay them out adjacent under $GITHUB_WORKSPACE so `pixi install --locked` resolves them and
# the tests can import the method/contract code. Checking out PRIVATE sibling repos needs a
# token with read access: set repo/org secret `CROSS_REPO_TOKEN` (a PAT or GitHub App token
# with contents:read on the three siblings). It falls back to the default GITHUB_TOKEN, which
# only works if each sibling has granted this repo's Actions access (Settings → Actions →
# Access) — otherwise the sibling-checkout steps 403 and CI cannot run.
#
# SIBLING PINS (2026-09-14): the three sibling checkouts below are pinned to explicit SHAs, not
# `ref: main`. Measured reason: contracts 56 + methods 31 + catalog 15 commits per 72 h ≈ 34
# re-baselining events/day, each silently changing what this suite tested on PRs that did not
# cause the change. Measured live while authoring this pin: ALL THREE siblings moved within one
# 9-minute window (methods 10f9b718→0006164e, contracts cd24888d→a716f923, catalog
# 7fd03697→1addffdd), so a PR whose CI ran at 14:05Z and re-ran at 14:14Z was tested against
# three different sibling trees with no diff of its own — a re-run stopped being a retry and
# became a different experiment. `pixi install --locked` does NOT protect against this: the
# siblings are EDITABLE PATH deps, so the lockfile pins their names, never their content.
#
# The property the pins buy is not "fewer reds" — it is that THE PINNED TRIPLE IS ALWAYS A
# KNOWN-GREEN INTEGRATION STATE. Sibling breakage stops landing on an unrelated contributor's
# PR and lands on the bump PR instead, quarantined there: a red bump PR does not merge, so the
# pins do not advance past a break.
#
# The cost is real and points the other way: pins go stale SILENTLY, so the bump mechanism is
# load-bearing rather than a convenience. `bump-sibling-pins.yml` runs daily, force-pushes the
# single branch `chore/bump-sibling-pins`, and keeps exactly ONE open PR meaning "current
# sibling mains vs. what we actually test against", with the per-sibling commit range in the
# body so a red is attributable to a named sibling commit. Cadence is the knob: shorter =
# better attribution, more PR noise. To bump by hand: Actions → Bump sibling CI pins → Run
# workflow.
#
# Do NOT revert a pin to `ref: main` to "get the latest". That re-opens the ~34/day churn and
# removes the last signal telling target-contracts it broke skills — contracts-validate never
# checks out skills and graceful-skips its figure-emission check, and the only job that sees
# both repos (framework-health-cross-repo.yml, in TARGET-CONTRACTS) is parked to
# workflow_dispatch. Bump the pin instead; that is what the bump PR is for.

# NOTE (2026-08-12): the pull_request trigger runs on ALL PRs — no `paths:` filter — because the
# `pytest` check is a REQUIRED status check on v2-architecture (branch protection). A required check
# that is path-filtered would never report on a PR touching only non-matching paths (libs/, notebooks/,
# tests/, docs), leaving that PR permanently "Expected — waiting for status" and unmergeable (the
# required-check deadlock). Running the (fast, self-skipping-when-credential-less) suite on every PR
# is the robust way to keep the required check from ever wedging a merge. Do NOT re-add `paths:` here
# without first dropping `pytest` from the branch-protection required set.
on:
  pull_request:
  push:
    branches: [v2-architecture, dev, main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # The skill readers resolve sibling code via these env vars (sys.path), in addition to the
      # editable pixi installs. Point them at the CI checkouts, not the local-dev default path.
      ANALYSIS_METHODS_ROOT: ${{ github.workspace }}/rnd-computational-biology-oncology-analysis-methods
      TARGET_CONTRACTS_ROOT: ${{ github.workspace }}/rnd-computational-biology-oncology-target-contracts
      DATA_CATALOG_ROOT: ${{ github.workspace }}/rnd-computational-biology-oncology-data-catalog
    steps:
      - name: Checkout skills
        uses: actions/checkout@v4
        with:
          path: rnd-computational-biology-oncology-claude-oncology-skills

      - name: Checkout analysis-methods (sibling — editable pixi dep)
        uses: actions/checkout@v4
        with:
          repository: oneTakeda/rnd-computational-biology-oncology-analysis-methods
          # PINNED — main @ 2026-09-14T14:13:10Z. Bumped by bump-sibling-pins.yml; see SIBLING PINS above.
          ref: 0006164e2bbc84d5c515b2c22a3088a83389bc00
          path: rnd-computational-biology-oncology-analysis-methods
          token: ${{ secrets.CROSS_REPO_TOKEN || github.token }}

      - name: Checkout target-contracts (sibling — editable pixi dep)
        uses: actions/checkout@v4
        with:
          repository: oneTakeda/rnd-computational-biology-oncology-target-contracts
          # PINNED — main @ 2026-09-14T14:08:30Z. Bumped by bump-sibling-pins.yml; see SIBLING PINS above.
          ref: a716f9238a89a9daecea9f82a5a14cc0041d31ef
          path: rnd-computational-biology-oncology-target-contracts
          token: ${{ secrets.CROSS_REPO_TOKEN || github.token }}

      - name: Checkout data-catalog (sibling — target_id_resolver editable pixi dep)
        uses: actions/checkout@v4
        with:
          repository: oneTakeda/rnd-computational-biology-oncology-data-catalog
          # PINNED — main @ 2026-09-14T14:10:35Z. Bumped by bump-sibling-pins.yml; see SIBLING PINS above.
          ref: 1addffdd1f061bce6c817eb67e4cdd2290958e75
          path: rnd-computational-biology-oncology-data-catalog
          token: ${{ secrets.CROSS_REPO_TOKEN || github.token }}

      - name: Set up pixi (installs the locked env incl. the editable siblings)
        uses: prefix-dev/setup-pixi@v0.8.1
        with:
          pixi-version: v0.70.2
          cache: true
          manifest-path: rnd-computational-biology-oncology-claude-oncology-skills/pixi.toml

      # compose-dashboard was RETIRED 2026-08-21 — its shared engine (live-readers + figure registry)
      # moved into _skills_common (covered by the step below) and its orchestrator was deleted.
      - name: _skills_common shared harness suite
        working-directory: rnd-computational-biology-oncology-claude-oncology-skills
        run: pixi run pytest skills/_skills_common/tests/ -q

      # BLOCKING: target-profile is the composed nomination skill — the highest-value gate after the
      # orchestration spine. Its 179 tests are fixture/logic-based (no live S3), so they run green on a
      # credential-less runner. Promoted to blocking 2026-08-11 (was in the non-blocking bucket only
      # because of noisier peripheral skills, not its own health).
      - name: target-profile suite
        working-directory: rnd-computational-biology-oncology-claude-oncology-skills
        run: pixi run pytest skills/target-profile/tests/ -q

      # BLOCKING: the shared cross-skill invariant guards live in the top-level skills/tests/ dir —
      # Guard B (CARDS ⊆ cards_used), composition-declarations, resolver-verdict-consumers,
      # reference-drift, scope, reviewer-driven-upgrades. The `skills/*/tests` glob below matches
      # skills/<skill>/tests, NOT skills/tests/, so before this step these guards never ran in CI and
      # silently rotted (e.g. test_tmbed_license_attestation drifted to a renamed manifest). They are
      # AST/YAML/text checks (no live S3) — green on a credential-less runner.
      - name: shared cross-skill invariant guards (skills/tests/)
        working-directory: rnd-computational-biology-oncology-claude-oncology-skills
        run: pixi run pytest skills/tests/ -q --import-mode=importlib

      # BLOCKING: the eval/ harness (loop-health, disposition ledger, discordance ledgers,
      # per-axis backtest, literature harvest). Until 2026-09-12 NO part of eval/ ran in CI —
      # every pytest step above is skills/…-scoped, so eval/ was green-by-absence: six tracked
      # test modules never executed on a PR. This recursive step covers all of them, INCLUDING
      # eval/test_subskill_discordance.py which sits at the top of eval/ rather than under
      # eval/tests/ (a hardcoded `pytest eval/tests` would still have missed it). Fixture/logic
      # tests, no live S3 — green on a credential-less runner (measured: 59 passed ~0.2s, no creds).
      # --import-mode=importlib matches every other step and avoids run.py basename collisions.
      # The `test_ci_covers_all_test_files` guard in skills/tests/ fails if a NEW test dir ever
      # lands outside every step's scope again, so this list can't silently rot.
      - name: eval/ harness suite
        working-directory: rnd-computational-biology-oncology-claude-oncology-skills
        run: pixi run pytest eval/ -q --import-mode=importlib

      # BLOCKING-BY-DEFAULT coverage of the remaining skills (promoted from non-blocking 2026-08-12:
      # every remaining per-skill suite is green locally under pixi except the denylisted skill below).
      # The three suites above are their own BLOCKING steps (_skills_common = shared harness + engine,
      # target-profile = composed nomination skill, skills/tests = cross-skill invariant guards); this
      # loop covers everything else. Each remaining skill runs in
      # its OWN pytest process — the Fix-1 isolation: many skills ship scripts/run.py, and batching them
      # into a single `pytest skills/` process made `import run` bind to whichever skill loaded FIRST
      # (sys.modules cache), so a later skill's test got the wrong run.py (`cannot import name
      # _resistance_verdict/_snapshot from 'run'`). Per-skill --import-mode=importlib isolates each `run`
      # (exactly like the blocking suites) and removes that order-dependent fragility.
      #
      # BLOCKING SEMANTICS: a non-zero rc from any skill NOT in NON_BLOCKING_SKILLS FAILS the job (no
      # `continue-on-error` on the step). Blocking-by-default is the right polarity because CI runs on
      # the PR that ADDS or CHANGES a skill, so a newly-red skill is caught before merge — the opposite
      # of an allowlist, which would silently ignore any brand-new skill's suite. Denylisted skills are
      # knowingly red for a reason OUTSIDE this PR's control; their failure only emits a ::warning::.
      # Live-S3 tests self-skip on the credential-less CI runner (conftest skip_if_no_data), so a skill
      # that is green-or-skipped on CI stays green here.
      - name: remaining skill suites (per-skill, blocking-by-default with denylist)
        working-directory: rnd-computational-biology-oncology-claude-oncology-skills
        shell: bash
        run: |
          set +e   # a failing skill must NOT stop the loop — every remaining skill still runs
          # Skills knowingly red for a reason outside this PR's control. Each MUST carry a WHY.
          # A denylisted skill's failure is downgraded to ::warning:: (does NOT gate the job).
          NON_BLOCKING_SKILLS=(
            # (none — workflow-target-evaluation-onc retired 2026-08-14; add a skill here only
            #  with a WHY when it is knowingly red for a reason outside a PR's control)
          )
          is_nonblocking() {
            local s="$1" n
            for n in "${NON_BLOCKING_SKILLS[@]}"; do [ "$s" = "$n" ] && return 0; done
            return 1
          }
          gate_fail=0
          for d in skills/*/tests; do
            skill=$(basename "$(dirname "$d")")
            # the two suites above are their own BLOCKING steps — don't double-run them here
            case "$skill" in _skills_common|target-profile) continue ;; esac
            ls "$d"/test_*.py >/dev/null 2>&1 || continue   # skip dirs with no test files
            echo "::group::$skill"
            pixi run pytest "$d" -q --import-mode=importlib
            rc=$?
            echo "::endgroup::"
            if [ "$rc" -ne 0 ]; then
              if is_nonblocking "$skill"; then
                echo "::warning title=skills-validate::$skill suite failed (rc=$rc) — non-blocking (denylisted, see NON_BLOCKING_SKILLS)"
              else
                echo "::error title=skills-validate::$skill suite failed (rc=$rc) — BLOCKING (green-by-default; fix it or add to NON_BLOCKING_SKILLS with a reason)"
                gate_fail=1
              fi
            fi
          done
          [ "$gate_fail" -ne 0 ] && echo "One or more BLOCKING skill suites failed (see ::error:: above)"
          exit "$gate_fail"   # blocking-by-default: green suites gate, denylisted ones only warn
