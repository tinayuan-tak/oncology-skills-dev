name: Skills Validate

# T9 (2026-08-11 engineering review): the claude-oncology-skills repo had NO CI — the skill
# test suites never ran on a PR, so schema-vs-reality drift and regressions shipped silently.
# This workflow runs the skill test suites on every PR. Live-data tests that need S3 skip
# themselves when the onc-compbio bucket is unreadable (see
# skills/_skills_common/tests/conftest.py::skip_if_no_data), so the suite is green on a
# credential-less CI runner.
#
# PARALLELISM (2026-09-16): the pytest work is split across parallel matrix SHARDS to cut CI
# wall-clock (was ~23 min median, serial, grazing the 25 min timeout). The 4 big suites are split
# THREE ways (measured, not guessed): shard=core-common = _skills_common; shard=core-guards =
# skills/tests + eval/ (skills/tests, with its cross-skill guards + the end-to-end test_graduated
# run, was the heaviest under -n auto); shard=core-profile = target-profile — each under `-n auto`
# (pytest-xdist, ~nproc workers). shard=0..3 each run a deterministic round-robin slice of the
# remaining per-skill suites. A fan-in job named `pytest`
# (the branch-protection required status check) aggregates all shards — see the `pytest` job at
# the bottom. The matrix jobs report as `pytest-shards (…)` and are NOT the required check; the
# required name `pytest` MUST stay attached to the fan-in job or the required check would deadlock
# (a bare matrix reports only `pytest-shards (N)` and `pytest` would never post).
#
# CONSOLIDATED LAYOUT (SK#2063, 2026-09-29): analysis-methods and target-contracts live IN
# THIS REPO (methods/ and contracts/ — subtree merges, history preserved). Their old sibling
# SHA pins and checkout steps are GONE: every PR is tested against its own tree, atomically,
# which is the point of the consolidation — the pin + bump-PR choreography they required is
# retired with bump-sibling-pins.yml. The ONE remaining sibling is data-catalog (deliberately
# a separate repo; stable append-only manifest-ID interface). Its checkout below stays PINNED
# to an explicit SHA for the same reason the old triple was pinned: an editable path dep's
# content is not pinned by pixi.lock. Bump it BY HAND (rarely needed; it moves slowly) and
# treat the bumping PR as the integration test. CROSS_REPO_TOKEN (falls back to github.token)
# is needed only for that one private-repo checkout.

# NOTE (2026-08-12): the pull_request trigger runs on ALL PRs — no `paths:` filter — because the
# `pytest` check is a REQUIRED status check on main (branch protection). A required check
# that is path-filtered would never report on a PR touching only non-matching paths (libs/, notebooks/,
# tests/, docs), leaving that PR permanently "Expected — waiting for status" and unmergeable (the
# required-check deadlock). Running the (fast, self-skipping-when-credential-less) suite on every PR
# is the robust way to keep the required check from ever wedging a merge. Do NOT re-add `paths:` here
# without first dropping `pytest` from the branch-protection required set.
#
# PATH-SCOPING (2026-09-29, #2092): every PR used to run all jobs. It now runs a fast `changes`
# job first (git-diff vs the PR merge-base) that decides which of the heavier legs to run. The
# scoping is done with job-level `if:` conditions keyed on that job's outputs — NOT an `on.paths`
# filter, which would re-introduce the required-check deadlock above (a skipped-by-`on.paths`
# workflow never posts its required context). The `pytest` fan-in ALWAYS runs and posts, and it
# distinguishes an EXPECTED skip (the change-filter said skip that leg) from a wrong one (a leg
# that skipped when the filter said run it, or failed) — see the fan-in job at the bottom.
# Skip rules (derived from the measured coupling map: skills → methods + contracts at runtime;
# methods → contracts; contracts validators → skills + methods + contracts + data-catalog at
# runtime, since #2090 RETIRED the /nonexistent shim and wired the contracts jobs to the in-tree
# siblings — the contracts jobs are NO LONGER hermetic on skills/methods content):
#   • docs-only PR                → skip methods-pytest + contracts-static + contracts-pytest
#   • skills-only PR              → run contracts-static + contracts-pytest too (a skills edit to
#                                   _live_readers.py / questions.yaml / the framework-health sidecars
#                                   can change a live contracts validator's verdict); skip methods
#   • methods-touching PR         → run methods-pytest AND both contracts legs (contracts reads methods)
#   • contracts-touching PR       → run EVERYTHING (methods depends on contracts; skills on both)
#   • push:main (or any non-PR)   → run EVERYTHING (the trunk-green signal must be complete)
# The skills shards are NEVER skipped on a code PR — they are the always-on base leg. The contracts
# jobs run whenever skills/, methods/, or contracts/ changed (the `changes` job's `contracts_jobs`
# output); the fan-in below gates them on that same output.
on:
  pull_request:
  merge_group:            # GitHub merge queue: run the full gate on the prospective merged tree.
                          # The `changes` job routes every non-pull_request event to "run all legs"
                          # and the `pytest` fan-in always posts, so the required check reports here.
  push:
    branches: [main]

# CONCURRENCY (2026-09-29): 230 Skills Validate runs in one 48h window (~15-18 job-min each ≈
# 60-70 runner-hours) with no concurrency group — rapid push-amend runs the full 7-shard suite
# to completion once per push, and duplicate back-to-back full runs on one PR were observed.
# Group by workflow+ref and cancel superseded runs ONLY for pull_request events. push:main runs
# must NEVER be cancelled (they are the trunk-green signal), hence the conditional.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Single source of truth for the data-catalog checkout pin (hoisted 2026-09-29, #2092): the SHA
  # appeared verbatim in two checkout steps, kept in sync by comment only. Both reference
  # ${{ env.DATA_CATALOG_SHA }} below so the two vintages cannot drift. Bump BY HAND (rarely;
  # data-catalog moves slowly) and treat the bumping PR as the integration test. NOTE: the nightly +
  # discordance-monitor workflows deliberately check out data-catalog `main` (UNPINNED) — a known
  # vintage skew vs this pin, documented in their headers.
  #
  # ⚠️ A PIN BUMP NOW CARRIES A SECOND FAILURE MODE (SK#2097): besides manifest resolution, the pin
  # fixes the VINTAGE of data-catalog's VENDORED copies of two of our controlled vocabularies
  # (core-artifacts-schema/{measurement_types,indication_crosswalk}.yaml), which
  # contracts/tests/schemas/test_vendored_vocab_sync.py now byte-compares against
  # contracts/vocabularies/. So a bump can red on VOCAB MISMATCH, and conversely a PR editing either
  # vocabulary must land the data-catalog resync and bump this pin IN THE SAME PR — the pin, the
  # guard and the consumer-read are one atomic unit. Never bump this pin in a PR that cannot run
  # `contracts-pytest` (the leg that checks data-catalog out and exports DATA_CATALOG_ROOT).
  #
  # PINNED — data-catalog main @ 7783d39 (2026-09-29, DC#731 "resync vendored measurement_types.yaml
  # from monorepo source of truth"). Bumped from 13aef194 (2026-09-19, depmap-predictability-26q1-v4
  # manifest) by SK#2097: at 13aef194 the vendored measurement_types.yaml predates DC#731 and is
  # missing `depmap_cell_line_rna` + 3 sibling families (102 differing lines), so the new byte-sync
  # guard was born red against the old pin while data-catalog `main` was genuinely in sync. Bumped to
  # the resync commit ITSELF, deliberately NOT to DC main HEAD (15acfb0): DC#725 landed after it and
  # changes sibling-root resolution to a HARD ERROR on absence, which is a separate decision with a
  # different blast radius (this repo installs data-catalog as an editable pixi dep). The residual
  # 7783d39..main window is exactly what the nightly DC@main lane covers.
  DATA_CATALOG_SHA: 7783d3947dea0f8ecd5f4eeab5e52f261be51814

jobs:
  # CHANGE-DETECTION (#2092). Fast (~checkout-only) job that diffs the PR against its merge-base and
  # decides which heavy legs to run. Consumed by the `if:` on methods-pytest / contracts-* and by the
  # `pytest` fan-in (which treats a skip as OK ONLY when this job said skip that leg). On a non-PR
  # event (push:main, workflow_dispatch) there is no base to diff → every leg runs. NEVER use an
  # `on.paths` filter for this instead — that deadlocks the required `pytest` check (see header).
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      methods: ${{ steps.filter.outputs.methods }}
      contracts: ${{ steps.filter.outputs.contracts }}
      # contracts_jobs (#2090): the contracts legs are no longer hermetic — their validators read
      # skills + methods + contracts + data-catalog LIVE — so they must run when ANY of skills/,
      # methods/, or contracts/ changed. Both contracts legs' `if:` and the fan-in gate on THIS.
      contracts_jobs: ${{ steps.filter.outputs.contracts_jobs }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # need the merge-base to diff the PR's changed files
      - name: Compute changed-package filters
        id: filter
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            # push:main / workflow_dispatch — no base to diff; run every leg (trunk-green signal
            # must exercise the whole matrix, never a scoped subset).
            echo "non-PR event (${{ github.event_name }}) — running all legs"
            echo "methods=true"        >> "$GITHUB_OUTPUT"
            echo "contracts=true"      >> "$GITHUB_OUTPUT"
            echo "contracts_jobs=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base="${{ github.event.pull_request.base.ref }}"
          git fetch -q origin "$base"
          # three-dot: compare HEAD against the merge-base with the target branch (what THIS PR
          # changed). No `|| true` fail-open — a diff error must fail this job, not silently green.
          changed=$(git diff --name-only --diff-filter=ACMRD "origin/$base"...HEAD)
          echo "Changed files:"; echo "$changed"
          # Match against a FILE, never `echo "$changed" | grep -q` (skills#2258).
          # `set -o pipefail` + `grep -q` is a SIZE-DEPENDENT FAIL-OPEN: grep exits at the FIRST
          # match, the writer (echo) then takes SIGPIPE, and pipefail promotes that to the
          # pipeline's status — 141 — so the `if` reads FALSE and the leg is SKIPPED, while the
          # `pytest` fan-in reads that skip as EXPECTED and posts green. Invisible when the list
          # fits the 64 KiB pipe buffer; fires on exactly the large refactors that most need the
          # heavy legs. Measured on PR #2257: 1215 paths / 75564 bytes ->
          # methods=false contracts=false contracts_jobs=false, with contracts/ present at line 4.
          changed_list=$(mktemp)
          printf '%s\n' "$changed" > "$changed_list"
          contracts=false
          methods=false
          skills=false
          if grep -qE '^contracts/' "$changed_list"; then contracts=true; fi
          if grep -qE '^methods/'   "$changed_list"; then methods=true; fi
          if grep -qE '^skills/'    "$changed_list"; then skills=true; fi
          # Per-prefix match counts in the log, so a future false negative reads as
          # "N matched but leg=false" rather than having to be inferred from a bare `false`.
          echo "Matched: contracts=$(grep -cE '^contracts/' "$changed_list" || true)" \
               "methods=$(grep -cE '^methods/' "$changed_list" || true)" \
               "skills=$(grep -cE '^skills/' "$changed_list" || true)" \
               "of $(wc -l < "$changed_list") changed paths"
          # methods leg runs when methods/ changed OR contracts/ changed (methods imports contracts).
          if [ "$contracts" = "true" ]; then methods=true; fi
          # contracts legs (#2090, de-hermeticised): run when skills/, methods/, or contracts/ changed
          # — a skills or methods edit can now change a live contracts validator's verdict.
          contracts_jobs=false
          if [ "$methods" = "true" ] || [ "$skills" = "true" ]; then contracts_jobs=true; fi
          echo "Resolved legs: methods=$methods contracts=$contracts contracts_jobs=$contracts_jobs (skills shards always run)"
          echo "methods=$methods"             >> "$GITHUB_OUTPUT"
          echo "contracts=$contracts"         >> "$GITHUB_OUTPUT"
          echo "contracts_jobs=$contracts_jobs" >> "$GITHUB_OUTPUT"

  pytest-shards:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      # fail-fast: false — one red shard must NOT cancel the others, so a PR sees EVERY failure in
      # one run (and the fan-in still fails). shard=core = the 4 big suites under -n auto; 0..3 =
      # round-robin slices of the per-skill loop. Keep NUM_LOOP_SHARDS (in the run step) equal to
      # the count of numeric shards here.
      fail-fast: false
      matrix:
        shard: [core-common, core-guards, core-profile, 0, 1, 2, 3]
    env:
      # The skill readers resolve method/contract code via these env vars (sys.path), in
      # addition to the editable pixi installs. methods/ and contracts/ are IN-TREE since the
      # SK#2063 consolidation; only data-catalog is still a sibling checkout.
      ANALYSIS_METHODS_ROOT: ${{ github.workspace }}/rnd-computational-biology-oncology-claude-oncology-skills/methods
      TARGET_CONTRACTS_ROOT: ${{ github.workspace }}/rnd-computational-biology-oncology-claude-oncology-skills/contracts
      DATA_CATALOG_ROOT: ${{ github.workspace }}/rnd-computational-biology-oncology-data-catalog
      # Thread the card readers (not the default process fork-pool). Harmless on credential-less CI
      # (forked readers hit no-data instantly) but defensive under `-n auto` if creds are ever added.
      # Byte-identical test output either way.
      SKILLS_READ_POOL: thread
    steps:
      - name: Checkout skills
        uses: actions/checkout@v4
        with:
          path: rnd-computational-biology-oncology-claude-oncology-skills

      - name: Checkout data-catalog (sibling — target_id_resolver editable pixi dep)
        uses: actions/checkout@v4
        with:
          repository: oneTakeda/rnd-computational-biology-oncology-data-catalog
          # PINNED via the workflow-level env.DATA_CATALOG_SHA (hoisted #2092) — single source of
          # truth shared with the methods-pytest checkout so the two vintages cannot drift.
          ref: ${{ env.DATA_CATALOG_SHA }}
          path: rnd-computational-biology-oncology-data-catalog
          token: ${{ secrets.CROSS_REPO_TOKEN || github.token }}

      - name: Set up pixi (installs the locked env incl. the editable siblings)
        uses: prefix-dev/setup-pixi@v0.8.1
        with:
          pixi-version: v0.70.2
          cache: true
          # SK#2145: this is now the ONLY pixi manifest in the repo — `methods/pixi.toml` and its
          # separate ~280KB lock are deleted, and the methods-pytest leg below points here too. Both
          # manifest references in this workflow therefore name the same file on purpose; if you are
          # about to add a second manifest, read the header comment in pixi.toml first (two envs =
          # two interpreters gating the same code, which is what this issue removed).
          manifest-path: rnd-computational-biology-oncology-claude-oncology-skills/pixi.toml

      # SHARDED EXECUTION. shard=core runs the four big suites under `-n auto`; shard=0..3 each run a
      # deterministic round-robin slice of the remaining per-skill suites. Every shard runs the SAME
      # script and branches on $SHARD; the fan-in `pytest` job aggregates them.
      #
      # COVERAGE-GUARD CONTRACT (test_ci_covers_all_test_files): that guard parses THIS file for
      # `pytest <path>` literals + `for d in skills/*/tests` globs and asserts every collectable test
      # file is covered. It reads COVERAGE, not execution, so it is satisfied by the literals + glob
      # below regardless of which shard executes what — and every collectable file IS still run,
      # exactly once, by one shard (the union of shards = the whole suite). The four big-suite paths
      # are called as LITERALS (skills/tests/ and eval/ are NOT matched by the skills/*/tests glob, so
      # their literals are load-bearing for coverage), and the per-skill loop keeps the glob.
      #
      # compose-dashboard was RETIRED 2026-08-21 — its shared engine (live-readers + figure registry)
      # moved into _skills_common (covered by the core shard) and its orchestrator was deleted.
      #
      # Each per-skill suite runs in its OWN pytest process (--import-mode=importlib) so `import run`
      # binds to the right skill's scripts/run.py instead of whichever loaded first (sys.modules-cache
      # order-dependence). BLOCKING-BY-DEFAULT: a non-zero rc from any non-denylisted suite fails its
      # shard, and the fan-in then fails the required `pytest` check. Denylisted skills only ::warning::.
      # Live-S3 tests self-skip on the credential-less runner (conftest skip_if_no_data).
      #
      # SKIP VISIBILITY + SKIP BUDGET (skills#2127, skills#2236). Every invocation below carries
      # `-rsfE` so each skip is NAMED in the log AND the FAILED/ERROR short-summary survives (a bare
      # `-rs` REPLACES pytest's default `-r` value "fE" instead of adding to it, dropping the FAILED
      # list — see skills#2236). — MEASURED, not assumed — the redundant CLI `-q` was REMOVED:
      # pyproject's `addopts = "-q -rs …"` already supplies both, so a second `-q` pushed verbosity
      # to -2, which suppresses the final `N passed, M skipped in Xs` COUNT line. Skip reasons were
      # printed but the totals were not, leaving nothing to ratchet against and no cardinality
      # instrument at all. One `-q` (from addopts) keeps the log quiet AND keeps the count line; do
      # not re-add `-q` here. Each leg's output is also redirected to a log file that
      # `scripts/check_skip_budget.py` then parses
      # against the committed per-leg ceilings in `.github/skills-skip-budget.json`. That makes an
      # INFLATION in skips RED: ~45 contract-driven guards skipif target-contracts is unresolvable
      # and run here only because of the TARGET_CONTRACTS_ROOT export above — if that regresses the
      # family goes silently dark, and SKIP != PASS. The checker carries its own cardinality floor
      # (a leg reporting 0 outcomes fails) so the budget can never pass by measuring nothing.
      # NOTE: redirect-then-`cat`, never `| tee` — a pipeline's rc is tee's, which would swallow a RED.
      - name: run shard (${{ matrix.shard }})
        working-directory: rnd-computational-biology-oncology-claude-oncology-skills
        shell: bash
        env:
          SHARD: ${{ matrix.shard }}
          NUM_LOOP_SHARDS: "4"
        run: |
          set +e   # a failing suite must NOT stop the shard — every remaining suite still runs
          gate_fail=0
          LOGDIR="${RUNNER_TEMP:-/tmp}/skip-budget"; mkdir -p "$LOGDIR"
          logfile() { echo "$LOGDIR/$(echo "$1" | tr -c 'A-Za-z0-9._-' '_').log"; }
          check_budget() {  # $1=leg label  $2=that leg's pytest output log
            python3 scripts/check_skip_budget.py --label "$1" --log "$2" || gate_fail=1
          }
          # Skills knowingly red for a reason outside this PR's control. Each MUST carry a WHY.
          # A denylisted skill's failure is downgraded to ::warning:: (does NOT gate the job).
          NON_BLOCKING_SKILLS=(
            # (none — add a skill here only with a WHY when it is knowingly red for a reason
            #  outside a PR's control; target-archetype is DEFERRED via *.deferred renames, not here)
          )
          is_nonblocking() {
            local s="$1" n
            for n in "${NON_BLOCKING_SKILLS[@]}"; do [ "$s" = "$n" ] && return 0; done
            return 1
          }
          run_suite() {  # $1=label  $2=pytest args (intentionally word-split)
            local log; log=$(logfile "$1")
            echo "::group::$1"
            pixi run pytest $2 > "$log" 2>&1
            local rc=$?
            cat "$log"
            echo "::endgroup::"
            check_budget "$1" "$log"
            if [ "$rc" -ne 0 ]; then
              if is_nonblocking "$1"; then
                echo "::warning title=skills-validate::$1 failed (rc=$rc) — non-blocking (denylisted, see NON_BLOCKING_SKILLS)"
              else
                echo "::error title=skills-validate::$1 failed (rc=$rc) — BLOCKING (fix it or add to NON_BLOCKING_SKILLS with a reason)"
                gate_fail=1
              fi
            fi
          }

          if [ "$SHARD" = "core-common" ]; then
            # _skills_common ISOLATED on its own shard — the heaviest single suite (150 files,
            # including the un-splittable 68k-row golden-snapshot test), so it sets the wall-clock
            # floor. Split off from the other three big suites so it no longer runs behind them.
            # LITERAL path: the coverage anchor test_ci_covers_all_test_files parses (also matched by
            # the skills/*/tests glob below, but kept explicit as its own blocking gate).
            L=$(logfile _skills_common)
            echo "::group::_skills_common"; pixi run pytest skills/_skills_common/tests/ -rsfE -n auto > "$L" 2>&1; r=$?; cat "$L"; echo "::endgroup::"
            [ "$r" -ne 0 ] && gate_fail=1
            check_budget "_skills_common" "$L"
          elif [ "$SHARD" = "core-guards" ]; then
            # skills/tests cross-skill guards + eval/ — MEASURED to be the heaviest remaining group
            # (skills/tests, with its cross-skill guards + the end-to-end test_graduated run, was the
            # core-rest long pole at ~4m24s). LITERAL `pytest <path>` invocations (NOT via run_suite):
            # coverage anchors for skills/tests/ + eval/, which the skills/*/tests glob does not match.
            LG=$(logfile skills-guards); LE=$(logfile eval)
            echo "::group::skills-guards"; pixi run pytest skills/tests/ -rsfE --import-mode=importlib -n auto > "$LG" 2>&1; r1=$?; cat "$LG"; echo "::endgroup::"
            echo "::group::eval"; pixi run pytest eval/ -rsfE --import-mode=importlib -n auto > "$LE" 2>&1; r2=$?; cat "$LE"; echo "::endgroup::"
            for r in "$r1" "$r2"; do [ "$r" -ne 0 ] && gate_fail=1; done
            check_budget "skills-guards" "$LG"
            check_budget "eval" "$LE"
          elif [ "$SHARD" = "core-profile" ]; then
            # target-profile (the composed nomination skill) on its own shard. LITERAL path — also
            # matched by the skills/*/tests glob, kept explicit as its own blocking gate.
            L=$(logfile target-profile)
            echo "::group::target-profile"; pixi run pytest skills/target-profile/tests/ -rsfE -n auto > "$L" 2>&1; r=$?; cat "$L"; echo "::endgroup::"
            [ "$r" -ne 0 ] && gate_fail=1
            check_budget "target-profile" "$L"
          else
            # Remaining per-skill suites, round-robin across the numeric shards. The `for d in
            # skills/*/tests` glob is the coverage anchor for every per-skill dir.
            i=0
            for d in skills/*/tests; do
              skill=$(basename "$(dirname "$d")")
              # the two suites above are their own core-shard steps — don't double-run them here
              case "$skill" in _skills_common|target-profile) continue ;; esac
              ls "$d"/test_*.py >/dev/null 2>&1 || continue   # skip dirs with no test files (e.g. deferred skills)
              if [ "$((i % NUM_LOOP_SHARDS))" = "$SHARD" ]; then
                run_suite "$skill" "$d -rsfE --import-mode=importlib"
              fi
              i=$((i + 1))
            done
          fi
          [ "$gate_fail" -ne 0 ] && echo "shard $SHARD: one or more BLOCKING suites failed (see ::error:: above)"
          exit "$gate_fail"

  # FAN-IN — this job carries the branch-protection required status check name `pytest`. It runs
  # after every shard (if: always()) and fails unless ALL shards succeeded, so the required check
  # reflects the whole matrix. Renaming this job, or letting a bare matrix expose `pytest-shards (N)`
  # as the required name instead, would deadlock merges — keep the required check pointed here.
  # ── METHODS SUITE (ported from analysis-methods' methods-validate.yml at the SK#2063
  # consolidation; analysis-methods now lives in-tree at methods/) ─────────────────────────
  # Offline suite; live-S3 tests self-skip (methods/conftest.py). Root resolution: methods/
  # code derives sibling roots from __file__ (parent-of-AM-root), which the committed
  # repo-root symlinks (rnd-...-target-contracts -> contracts, rnd-...-data-catalog ->
  # ../rnd-...-data-catalog) satisfy — so the *_ROOT env vars stay deliberately UNSET,
  # preserving the old AM CI's coverage of the derived fallback (AM#631/#632 rationale:
  # exporting a value identical to the derivation makes the fallback branch unreachable
  # on the one machine that gates merges). target-contracts is now the PR's OWN tree —
  # a card/rule change and the methods change it pairs with are tested atomically.
  methods-pytest:
    needs: changes
    # PATH-SCOPING (#2092): run when methods/ or contracts/ changed (methods imports contracts), or
    # on any non-PR event (changes sets both outputs true). A skills-only/docs-only PR skips this;
    # the fan-in accepts that skip ONLY because this same output told it to.
    if: needs.changes.outputs.methods == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      SKILLS_SKIP_LIVE_DATA: "1"   # no AWS creds on the runner → live-S3 reads skip (conftest)
    steps:
      - name: Checkout (consolidated repo)
        uses: actions/checkout@v4
        with:
          path: rnd-computational-biology-oncology-claude-oncology-skills

      - name: Checkout data-catalog (sibling — manifests / catalog_query)
        uses: actions/checkout@v4
        with:
          repository: oneTakeda/rnd-computational-biology-oncology-data-catalog
          # Same pin as the pytest-shards job — ONE data-catalog vintage per workflow run, now
          # enforced structurally by the shared workflow-level env.DATA_CATALOG_SHA (#2092).
          ref: ${{ env.DATA_CATALOG_SHA }}
          path: rnd-computational-biology-oncology-data-catalog
          token: ${{ secrets.CROSS_REPO_TOKEN || github.token }}

      - name: Install pixi binary (retried — hardens the transient download flake)
        run: |
          set -euo pipefail
          export PIXI_VERSION=v0.70.2
          for i in 1 2 3 4 5; do
            if curl -fsSL https://pixi.sh/install.sh -o /tmp/pixi-install.sh; then
              bash /tmp/pixi-install.sh && break
            fi
            echo "::warning::pixi binary install attempt $i failed; retrying in $((i * 10))s"
            sleep $((i * 10))
          done
          "$HOME/.pixi/bin/pixi" --version
          echo "$HOME/.pixi/bin" >> "$GITHUB_PATH"

      - name: Set up pixi (the ONE workspace env; reuses the pre-installed binary)
        uses: prefix-dev/setup-pixi@v0.8.1
        with:
          # pixi-version deliberately UNSET → setup-pixi reuses the pre-installed binary.
          # SK#2145: was `.../methods/pixi.toml`. That manifest is DELETED — this leg and the
          # pytest-shards leg above now resolve the SAME root manifest, the same lock and the same
          # interpreter (python 3.14.6), instead of gating the same code under 3.12 here and 3.14
          # there. The methods package itself is an editable pypi-dependency of that manifest, so it
          # is installed in the env its own suite runs under (methods/pixi.toml never installed it).
          manifest-path: rnd-computational-biology-oncology-claude-oncology-skills/pixi.toml

      - name: methods + tests suite (offline; live-S3 tests self-skip)
        working-directory: rnd-computational-biology-oncology-claude-oncology-skills/methods
        # working-directory stays `methods/` and the pytest args are UNCHANGED apart from the -q
        # below: `pixi run <free-form cmd>` preserves the caller's cwd (verified), so pytest's
        # rootdir is still methods/ and methods/pyproject.toml still supplies [tool.pytest.ini_options].
        #
        # -rsfE: named skip lines — a skip is "the check did not run" and must be visible in
        # the log, never summed into the green (see the old methods-validate.yml history).
        #
        # ⚠️ SK#2145: `fE` was ADDED to `-rs`, and that is the second half of the same bug fix.
        # pytest's DEFAULT -r value is `fE`; passing `-rs` REPLACES it rather than adding to it, so
        # this leg's `short test summary info` block has been listing SKIPPED lines and NOTHING
        # about failures — no `FAILED <nodeid>` lines at all. Measured while gating this very PR:
        # the suite reported `1 failed, 4817 passed` and the failing test was NOT NAMED anywhere in
        # the log, so the only way to identify it was to re-read the traceback body by hand. On a
        # sharded/parallel CI log that is the difference between a one-line diagnosis and a bisect.
        # `-rsfE` restores the FAILED/ERROR list while keeping the named skips.
        #
        # ⚠️ SK#2145: the explicit `-q` was REMOVED, and that is a bug fix, not tidying.
        # methods/pyproject.toml's addopts ALREADY carries `-q` (declared there by SK#2093), so
        # `-q` here made it `-qq` — and at -qq pytest SUPPRESSES its final summary line. This leg
        # has therefore been printing progress dots, a warnings block and the -rs skip list but NO
        # `N passed, M skipped in Xs` line at all, locally AND on CI. That is the shape that reads
        # as green to anything parsing the tail of a log, and it removed the only cardinality
        # instrument this leg had (cf. scripts/check_skip_budget.py, whose docstring notes the
        # summary counts are the sole instrument under -q — which is exactly why the shard legs
        # above pass `-rs` WITHOUT `-q`). Verified on one file: with `-q` the log ends at the
        # SKIPPED list; without it, `21 passed, 1 skipped in 3.63s`.
        # The same redundant `-q`, and the same `-rs`-without-`fE`, that remained at the contracts
        # leg and at the skills sites in scripts/preland.sh (left alone here to keep this PR
        # scoped to the env change; both reported on #2145) were fixed separately in skills#2236.
        # skills#2237: the import package is `onc_methods` (was `methods`); this leg's cwd IS
        # `methods/`, so the first path arg is the PACKAGE dir and had to be renamed with it.
        run: pixi run pytest onc_methods/ tests/ -rsfE --import-mode=importlib -n auto

  # ── CONTRACTS GATES (ported from target-contracts' contracts-validate.yml at the SK#2063
  # consolidation; target-contracts now lives in-tree at contracts/) ───────────────────────
  # Static leg unsharded: cheap (~1min) and each run: step gives ATTRIBUTED failure (its red
  # names which contract broke). SIBLING-WIRED (#2090): the *_ROOT env vars point at the in-tree
  # siblings (skills/ and methods/ live in this repo since SK#2063 — the repo is checked out at the
  # workspace ROOT, so `${{ github.workspace }}` IS the skills-repo root and `.../methods` the AM
  # root; data-catalog is a PINNED sibling checkout below, wired by env). This RETIRES the
  # /nonexistent shim that kept the gate byte-identical to the pre-merge checkout-only TC CI: the
  # sibling-gated validators (validate_questions' skills scan, validate_cards' figure/method-
  # routability checks, the wiring/emission ledgers' LIVE halves) now RUN. Checkout is at ROOT
  # (not a named subdir like methods-pytest) on purpose: `working-directory: contracts` then resolves
  # in-repo for the test_ci_covers_all_test_files coverage guard (a `rnd-…/contracts` working-dir
  # would not). The consequence — path-driven `REPO.parent/rnd-…-data-catalog` tests self-skip
  # (their sibling-checkout adjacency is not reproduced at root, exactly as on trunk) — is a named,
  # pre-existing remainder; the DATA-CATALOG-dependent VALIDATORS resolve via DATA_CATALOG_ROOT env.
  contracts-static:
    needs: changes
    # #2090: de-hermeticised — run when skills/, methods/, or contracts/ changed (see the
    # `contracts_jobs` output). Docs-only PRs skip both contracts legs; the fan-in accepts that
    # skip because this same output told it to.
    if: needs.changes.outputs.contracts_jobs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      # In-tree siblings (#2090). The repo is checked out at the workspace root, so skills/ and
      # methods/ live directly under it; data-catalog is the pinned sibling checkout below.
      CLAUDE_ONCOLOGY_SKILLS_ROOT: ${{ github.workspace }}
      ANALYSIS_METHODS_ROOT: ${{ github.workspace }}/methods
      DATA_CATALOG_ROOT: ${{ github.workspace }}/data-catalog-pinned
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4

      - name: Checkout data-catalog (sibling — manifests / subgroup-catalogs / products registry)
        uses: actions/checkout@v4
        with:
          repository: oneTakeda/rnd-computational-biology-oncology-data-catalog
          # Same pin as the pytest-shards / methods-pytest jobs (workflow-level env.DATA_CATALOG_SHA).
          # Distinct path (NOT the committed `rnd-…-data-catalog` root-symlink name) to avoid a
          # checkout-vs-symlink collision; the DATA_CATALOG_ROOT env above points the validators here.
          ref: ${{ env.DATA_CATALOG_SHA }}
          path: data-catalog-pinned
          token: ${{ secrets.CROSS_REPO_TOKEN || github.token }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: contracts/pyproject.toml

      # Install set is IDENTICAL across both contracts legs so they share one pip cache.
      - name: Install dependencies
        run: python -m pip install --upgrade pip pyyaml jsonschema pytest pytest-xdist pytest-split matplotlib
      - name: Install the contracts package (editable — provides oncology_target_contracts.loader)
        run: python -m pip install -e .
      - name: Validate card specs
        run: python validators/validate_cards.py cards/
      - name: Validate evidence_graph (schema + referential integrity)
        run: python validators/validate_evidence_graph.py --self-check
      - name: Validate skill question registries (questions.yaml schema; skips if skills root not wired)
        run: python validators/validate_questions.py
      - name: Validate measurement types
        run: python validators/validate_measurement_types.py
      - name: Validate interpretation rules (all rules files)
        run: python validators/validate_interpretation_rules.py --rules interpretation-rules/ --cards cards/
      - name: Validate resolvers (dangling-rung / rule-id reachability)
        run: python validators/validate_resolvers.py --resolvers resolvers/ --rules interpretation-rules/
      - name: Validate nomination-gate verdict tokens (resolver consistency)
        run: python validators/validate_verdict_tokens.py --gate vocabularies/nomination_verdict_gate.yaml --resolvers resolvers/
      - name: Validate certainty corroboration ⟂ verdict-precedence disjointness
        run: python validators/validate_certainty_disjointness.py
      - name: Validate card→resolver consumption (verdict-role snapshot)
        run: python validators/validate_card_resolver_consumption.py
      - name: Validate factored claim records (schema + invariants)
        run: python validators/validate_claim_record.py --schema schemas/claim_record.schema.json --examples docs/design/examples/ --resolvers resolvers/
      - name: Validate rule-role partition (gating vs display drift)
        run: python validators/build_rule_role_partition.py --self-check
      - name: Validate Fold migration (all resolvers folded)
        run: python validators/validate_fold_migration.py --resolvers resolvers/
      - name: Eval ledger committed-artifact self-check
        run: python validators/build_eval_ledger.py --self-check
      - name: Validate emission ledger (T1 reachability; hermetic half only)
        run: python validators/build_emission_ledger.py --self-check
      - name: Validate wiring reconciliation (I.3; hermetic half only)
        run: python validators/build_wiring_reconciliation.py --self-check
      - name: Validate wiring ledger (I.4; hermetic half only)
        run: python validators/build_wiring_ledger.py --self-check
      - name: Living doc self-check
        run: python validators/architecture_dashboard/living/build_living_doc.py --self-check

      # Evidence-property arc (#2210) vocabulary validators — named explicitly so a genuine vocab
      # violation is attributed to the vocabulary, not "a contracts pytest test failed", and so CI
      # coverage is not hostage to an unrelated gate-argv pytest surviving (#2247). Invoked the same
      # way contracts/scripts/preland.sh invokes them; the roster is reconciled against preland.sh by
      # contracts/tests/validators/test_validator_gate_roster_reconciliation.py.
      - name: Validate property catalog (evidence-property arc)
        run: python validators/validate_property_catalog.py --catalog vocabularies/property_catalog --cards cards/
      - name: Validate concordance_class enum
        run: python validators/validate_concordance_enum.py --enum vocabularies/concordance_class.enum.yaml --families vocabularies/property_catalog/integrated_families.yaml
      - name: Validate comparability_state enum
        run: python validators/validate_comparability_state.py --enum vocabularies/comparability_state.enum.yaml --families vocabularies/property_catalog/integrated_families.yaml --concordance-enum vocabularies/concordance_class.enum.yaml
      - name: Validate expression_property enum
        run: python validators/validate_expression_property_enum.py --enum vocabularies/expression_property.enum.yaml --cards cards/
      - name: Validate claim_axis registry enum
        run: python validators/validate_claim_axis.py --enum vocabularies/claim_axis.enum.yaml --catalog vocabularies/property_catalog --skills ../skills

  contracts-pytest:
    needs: changes
    # #2090: de-hermeticised — same gating as contracts-static (skills/, methods/, or contracts/).
    if: needs.changes.outputs.contracts_jobs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # 4 shards; contracts/.test_durations is 1-indexed (--group 1..4). Regen regime:
        # see the header of the retired contracts-validate.yml (contracts/ git history).
        group: [1, 2, 3, 4]
    env:
      # In-tree siblings (#2090) — same values/layout as contracts-static (checkout at root); the
      # previously-skipped sibling-gated test families (card↔method wiring, products-registry sync,
      # subgroup-catalog contract, wiring/ledger LIVE recomputes) now RUN. -rs in the pytest step
      # keeps any remaining skip visible in the log.
      CLAUDE_ONCOLOGY_SKILLS_ROOT: ${{ github.workspace }}
      ANALYSIS_METHODS_ROOT: ${{ github.workspace }}/methods
      DATA_CATALOG_ROOT: ${{ github.workspace }}/data-catalog-pinned
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4

      - name: Checkout data-catalog (sibling — manifests / subgroup-catalogs / products registry)
        uses: actions/checkout@v4
        with:
          repository: oneTakeda/rnd-computational-biology-oncology-data-catalog
          ref: ${{ env.DATA_CATALOG_SHA }}
          path: data-catalog-pinned
          token: ${{ secrets.CROSS_REPO_TOKEN || github.token }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: contracts/pyproject.toml

      # matplotlib rationale: plot_styles' module-level importorskip otherwise drops 10
      # rendering-contract tests AT COLLECTION (measured in the old TC CI — see contracts/ git history).
      - name: Install dependencies
        run: python -m pip install --upgrade pip pyyaml jsonschema pytest pytest-xdist pytest-split matplotlib
      - name: Install the contracts package (editable — provides oncology_target_contracts.loader)
        run: python -m pip install -e .

      - name: Whole-package test suite (shard ${{ matrix.group }}/4; the contracts pytest gate)
        # -rsfE: named skip lines — a skip is "the check did not run" and must stay visible in the
        # log, AND the FAILED/ERROR short-summary must survive (a bare -rs REPLACES pytest's
        # default -r value "fE" instead of adding to it — see the methods-pytest step and
        # skills#2236). No CLI -q here: contracts/pyproject.toml's addopts already supplies -q, so
        # a second -q would push verbosity to -2 and suppress the final `N passed, M skipped in
        # Xs` count line (see the old methods-validate.yml history / skills#2236).
        run: >
          python -m pytest -rsfE -n auto
          --splits 4 --group ${{ matrix.group }}
          --durations-path .test_durations
          --splitting-algorithm least_duration

  # ── FAN-IN (the REQUIRED context) ────────────────────────────────────────────────────────
  # Branch protection requires the context named EXACTLY `pytest`; this job re-exports it over
  # every suite in the consolidated tree (skills shards + methods + contracts). `if: always()`
  # so it reports even when an upstream job fails — a required check that never posts leaves
  # the PR permanently "Expected — waiting for status" (the required-check deadlock).
  pytest:
    needs: [changes, pytest-shards, methods-pytest, contracts-static, contracts-pytest]
    if: always()
    runs-on: ubuntu-latest
    steps:
      # PER-LEG FAN-IN (#2092). The old aggregator demanded `success` from every leg, which would
      # red the required check the moment path-scoping legitimately SKIPPED a leg. Blanket
      # skipped-is-ok is the opposite trap: it would green a leg that skipped when it should have
      # run (a mis-gate hiding a regression). So each gated leg is OK iff it SUCCEEDED, or it was
      # SKIPPED **and the change-filter output said skip that leg**. The always-on legs (changes,
      # pytest-shards) must succeed outright. cancelled/failure is never OK. `if: always()` so this
      # required context always posts (a never-posting required check deadlocks the merge).
      - name: Aggregate results (skills shards + methods + contracts, path-scope aware)
        env:
          RUN_METHODS: ${{ needs.changes.outputs.methods }}
          RUN_CONTRACTS: ${{ needs.changes.outputs.contracts_jobs }}
          R_CHANGES: ${{ needs.changes.result }}
          R_SHARDS: ${{ needs.pytest-shards.result }}
          R_METHODS: ${{ needs.methods-pytest.result }}
          R_CSTATIC: ${{ needs.contracts-static.result }}
          R_CPYTEST: ${{ needs.contracts-pytest.result }}
        run: |
          set -uo pipefail
          fail=0
          # An always-on leg must succeed.
          check_always() {  # $1=name $2=result
            echo "$1: $2 (must always run)"
            if [ "$2" != "success" ]; then
              echo "::error title=pytest::$1 did not succeed (result=$2)"
              fail=1
            fi
          }
          # A path-scoped leg: success when selected to run; a clean skip ONLY when the filter said skip.
          check_gated() {  # $1=name $2=result $3=should_run(true/false)
            echo "$1: $2 (filter run=$3)"
            if [ "$3" = "true" ]; then
              if [ "$2" != "success" ]; then
                echo "::error title=pytest::$1 was selected to run but result=$2"
                fail=1
              fi
            else
              # filter said skip → the ONLY acceptable non-success is a clean skip
              if [ "$2" != "skipped" ]; then
                echo "::error title=pytest::$1 filter said skip but result=$2 (expected 'skipped')"
                fail=1
              fi
            fi
          }
          check_always "changes"       "$R_CHANGES"
          check_always "pytest-shards" "$R_SHARDS"
          check_gated  "methods-pytest"   "$R_METHODS"  "$RUN_METHODS"
          check_gated  "contracts-static" "$R_CSTATIC"  "$RUN_CONTRACTS"
          check_gated  "contracts-pytest" "$R_CPYTEST"  "$RUN_CONTRACTS"
          if [ "$fail" -ne 0 ]; then exit 1; fi
          echo "all selected suites passed (any skipped leg matched the change-filter)"
