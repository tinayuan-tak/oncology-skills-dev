name: contracts-validate

# Governance-contract CI: runs the three repo-local validators on every change to
# the data contracts (cards / interpretation-rules / schemas / vocabularies) or the
# validators themselves. This is the gate that keeps the evidence-card + rule
# contracts schema-valid and cross-consistent on every PR.
#
# WHY these three (and not the framework-health dashboard): framework-health.yml
# validates the committed dashboard ARTIFACT's internal integrity. This job
# validates the SOURCE contracts:
#   - validate_cards.py            — card_spec structural + cross-reference checks
#   - validate_measurement_types.py — measurement_type vocab ↔ card concordance
#   - validate_interpretation_rules.py — Tier-2 rule schema + card-reachability,
#     run over ALL interpretation-rules/*.rules.yaml (directory form globs them).
#
# CROSS-REPO NOTE: the figure-emission check in validate_cards.py reads the sibling
# claude-oncology-skills repo's _figure_emitters.py. On a checkout-only runner that
# sibling is absent, so that one check graceful-skips (never a false failure); the
# KNOWN_FIGURE_DEBT waiver keeps it green where the sibling IS present. Every other
# check runs fully from this repo alone.
#
# Plain `python` invocation (no pixi in this repo) — mirrors framework-health.yml.

on:
  pull_request:
    paths:
      - "cards/**"
      - "interpretation-rules/**"
      - "resolvers/**"
      - "dashboards/**"
      - "schemas/**"
      - "vocabularies/**"
      - "validators/**"
      - "tests/**"
      - ".github/workflows/contracts-validate.yml"
  push:
    branches: [main]
    paths:
      - "cards/**"
      - "interpretation-rules/**"
      - "resolvers/**"
      - "dashboards/**"
      - "schemas/**"
      - "vocabularies/**"
      - "validators/**"
      - "tests/**"
      - ".github/workflows/contracts-validate.yml"

jobs:
  contracts-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip pyyaml jsonschema pytest

      - name: Validate card specs
        run: python validators/validate_cards.py cards/

      - name: Validate measurement types
        run: python validators/validate_measurement_types.py

      - name: Validate interpretation rules (all rules files)
        run: python validators/validate_interpretation_rules.py --rules interpretation-rules/ --cards cards/

      # T9b (2026-08-11 engineering review): validate_resolvers.py was a fully-built validator
      # wired into NO workflow — the dangling-rung / renamed-rule-id drift it guards was unguarded
      # on PRs. Wire it here so resolver precedence changes are gated.
      - name: Validate resolvers (dangling-rung / rule-id reachability)
        run: python validators/validate_resolvers.py --resolvers resolvers/ --rules interpretation-rules/

      # R1-class guard (2026-08-15): validate_verdict_tokens.py checks that every verdict token
      # referenced by the nomination gate policy (gates / positive_signals /
      # positive_signals_modality_scoped) matches CASE-EXACT a verdict its sub-skill's resolver
      # actually emits — so a mis-cased/typo'd/stale token (the dead `ADC_preferred` vs
      # emitted `adc_preferred`) fails CI instead of silently never firing.
      - name: Validate nomination-gate verdict tokens (resolver consistency)
        run: python validators/validate_verdict_tokens.py --gate vocabularies/nomination_verdict_gate.yaml --resolvers resolvers/

      # T2 (2026-08-11): validate dashboard_spec + evidence_package INSTANCES against their schemas.
      # dashboard_spec instances were never schema-validated, so the required_cards maxItems:20 vs
      # 26 drift (and a `when`-required contradiction) shipped silently. This runs the schema-test
      # suite that pins every shipped dashboard_spec.
      - name: Validate contract instances against schemas (dashboard_spec, etc.)
        run: python -m pytest tests/schemas/ -q

      # Eval ledger (portfolio memory): unit tests + CI-safe self-check of the committed artifact
      # (checkout-only, no sibling probes — mirrors the framework-health self-check gate).
      - name: Eval ledger unit tests + committed-artifact self-check
        run: |
          python -m pytest tests/validators/test_eval_ledger.py -q
          python validators/build_eval_ledger.py --self-check

      # 2026-08-16 (cleanup follow-up): these three validators were fully built but gated by NO
      # workflow — the same drift-risk the T9b step above fixed for validate_resolvers.py. Wire
      # their suites so subgroup-assignment / coverage-matrix / framework-discrimination contract
      # checks actually run on a PR.
      - name: Validate subgroup assignments + coverage matrix
        run: python -m pytest tests/validators/test_subgroup_assignments_and_coverage.py -q

      - name: Framework-discrimination calibration
        run: python -m pytest tests/calibration/test_framework_discrimination.py -q
