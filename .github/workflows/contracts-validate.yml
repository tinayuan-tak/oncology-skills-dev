name: contracts-validate

# Governance-contract CI: runs the three repo-local validators on every change to
# the data contracts (cards / interpretation-rules / schemas / vocabularies) or the
# validators themselves. This is the gate that keeps the evidence-card + rule
# contracts schema-valid and cross-consistent on every PR.
#
# WHY these three (and not the framework-health dashboard): framework-health.yml
# validates the committed dashboard ARTIFACT's internal integrity. This job
# validates the SOURCE contracts:
#   - validate_cards.py            — card_spec structural + cross-reference checks
#   - validate_measurement_types.py — measurement_type vocab ↔ card concordance
#   - validate_interpretation_rules.py — Tier-2 rule schema + card-reachability,
#     run over ALL interpretation-rules/*.rules.yaml (directory form globs them).
#
# CROSS-REPO NOTE: the figure-emission check in validate_cards.py reads the sibling
# claude-oncology-skills repo's _figure_emitters.py. On a checkout-only runner that
# sibling is absent, so that one check graceful-skips (never a false failure); the
# KNOWN_FIGURE_DEBT waiver keeps it green where the sibling IS present. Every other
# check runs fully from this repo alone.
#
# Plain `python` invocation (no pixi in this repo) — mirrors framework-health.yml.

on:
  pull_request:
    paths:
      - "cards/**"
      - "interpretation-rules/**"
      - "resolvers/**"
      - "dashboards/**"
      - "schemas/**"
      - "vocabularies/**"
      - "validators/**"
      - "tests/**"
      - ".github/workflows/contracts-validate.yml"
  push:
    branches: [main]
    paths:
      - "cards/**"
      - "interpretation-rules/**"
      - "resolvers/**"
      - "dashboards/**"
      - "schemas/**"
      - "vocabularies/**"
      - "validators/**"
      - "tests/**"
      - ".github/workflows/contracts-validate.yml"

jobs:
  contracts-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip pyyaml jsonschema pytest

      - name: Validate card specs
        run: python validators/validate_cards.py cards/

      - name: Validate evidence_graph (schema + referential integrity)
        run: python validators/validate_evidence_graph.py --self-check

      - name: Validate measurement types
        run: python validators/validate_measurement_types.py

      - name: Validate interpretation rules (all rules files)
        run: python validators/validate_interpretation_rules.py --rules interpretation-rules/ --cards cards/

      # T9b (2026-08-11 engineering review): validate_resolvers.py was a fully-built validator
      # wired into NO workflow — the dangling-rung / renamed-rule-id drift it guards was unguarded
      # on PRs. Wire it here so resolver precedence changes are gated.
      - name: Validate resolvers (dangling-rung / rule-id reachability)
        run: python validators/validate_resolvers.py --resolvers resolvers/ --rules interpretation-rules/

      # R1-class guard (2026-08-15): validate_verdict_tokens.py checks that every verdict token
      # referenced by the nomination gate policy (gates / positive_signals /
      # positive_signals_modality_scoped) matches CASE-EXACT a verdict its sub-skill's resolver
      # actually emits — so a mis-cased/typo'd/stale token (the dead `ADC_preferred` vs
      # emitted `adc_preferred`) fails CI instead of silently never firing.
      - name: Validate nomination-gate verdict tokens (resolver consistency)
        run: python validators/validate_verdict_tokens.py --gate vocabularies/nomination_verdict_gate.yaml --resolvers resolvers/

      # CERTAINTY_MODEL §3 required-validator #1 (R3): certainty_by_axis `corroboration` sources must be
      # verdict-DISJOINT — a corroboration card must fire no verdict-driving rung for its gate, else
      # certainty double-counts the verdict. Asserts corroboration_by_gate (certainty_corroboration.yaml)
      # ∩ each gate's verdict-precedence card-set = ∅. Documented in the model but previously unimplemented.
      - name: Validate certainty corroboration ⟂ verdict-precedence disjointness
        run: python validators/validate_certainty_disjointness.py

      # Contract-drift guard (2026-08-17 cards review, S2 #4): the card→resolver-consumption
      # (verdict-role) map. Cards mislabel their verdict role in PROSE in both directions
      # (mutation-drug-response claims inert but drives a rung; genomic-event-model-match/phospho
      # claim driving but are inert). This pins the COMPUTED reality in a committed snapshot so a
      # card gaining/losing resolver consumption fails CI (conscious update).
      - name: Validate card→resolver consumption (verdict-role snapshot)
        run: python validators/validate_card_resolver_consumption.py

      # M0 of the factored-record migration (docs/design/VERDICT_REPRESENTATION_MIGRATION.md):
      # validate the factored claim-record schema + its four cross-field invariants against the
      # hand-authored worked examples. ZERO runtime consumers yet — this proves the record is
      # coherent before any skill emits it at M1 (shadow). Advisory-by-scope until M3, but gated
      # now so the schema/example/validator triple can never drift silently.
      - name: Validate factored claim records (schema + invariants)
        run: python validators/validate_claim_record.py --schema schemas/claim_record.schema.json --examples docs/design/examples/ --resolvers resolvers/

      # M5 (VERDICT_REPRESENTATION move #5): the rule-role partition (gating vs display) must match the
      # live contracts — a rule gaining/losing resolver consumption fails until the committed snapshot
      # (coverage/rule_role_partition.yaml) is consciously regenerated.
      - name: Validate rule-role partition (gating vs display drift)
        run: python validators/build_rule_role_partition.py --self-check

      # Fold M3 completion guard (VERDICT_REPRESENTATION_FOLD.md): every resolver must stay
      # match_all_reduce with unique per-rung priorities — the first_match interpreter path is retired
      # to a test oracle and a new/hand-edited resolver must not silently reintroduce positional precedence.
      - name: Validate Fold migration (all resolvers folded)
        run: python validators/validate_fold_migration.py --resolvers resolvers/

      # T2 (2026-08-11): validate dashboard_spec + evidence_package INSTANCES against their schemas.
      # dashboard_spec instances were never schema-validated, so the required_cards maxItems:20 vs
      # 26 drift (and a `when`-required contradiction) shipped silently. This runs the schema-test
      # suite that pins every shipped dashboard_spec.
      - name: Validate contract instances against schemas (dashboard_spec, etc.)
        run: python -m pytest tests/schemas/ -q

      # Eval ledger (portfolio memory): unit tests + CI-safe self-check of the committed artifact
      # (checkout-only, no sibling probes — mirrors the framework-health self-check gate).
      - name: Eval ledger unit tests + committed-artifact self-check
        run: |
          python -m pytest tests/validators/test_eval_ledger.py -q
          python validators/build_eval_ledger.py --self-check

      # 2026-08-16 (cleanup follow-up): these three validators were fully built but gated by NO
      # workflow — the same drift-risk the T9b step above fixed for validate_resolvers.py. Wire
      # their suites so subgroup-assignment / coverage-matrix / framework-discrimination contract
      # checks actually run on a PR.
      - name: Validate subgroup assignments + coverage matrix
        run: python -m pytest tests/validators/test_subgroup_assignments_and_coverage.py -q

      - name: Framework-discrimination calibration
        run: python -m pytest tests/calibration/test_framework_discrimination.py -q

      # Card CONCEPT-DISCIPLINE ratchet: no NEW molecular-form (isoform/splice) fields on a bulk_rna
      # expression-abundance card (a card owns ONE concept). Baselined debt burns down via Phase 3b.
      - name: Card concept-discipline ratchet
        run: python -m pytest tests/validators/test_card_concept_discipline.py -q

      # 2026-08-20 (CI-gap closure): the nomination-gate CURATION invariants (veto set, positive-axis
      # discipline, disjointness, provenance completeness) + the subtype-tier ADMISSIBILITY guard were
      # fully tested but gated by NO workflow — so a positive_signal graduation (cis_coherence) drifted
      # from the test allowlist unnoticed on trunk. Gate the two invariant files explicitly (curated,
      # not the whole dir — the figure-emission tests are skills-dependent and self-skip here).
      - name: Nomination-gate curation + subtype-tier admissibility invariants
        run: python -m pytest tests/vocabularies/test_nomination_verdict_gate.py tests/validators/test_subtype_tier_rules.py -q

      # 2026-08-21 (CI-gap closure): test_target_profiling_axes.py — THE canonical objective→axis→card
      # ontology contract (well-formedness, no-coverage-regression vs gate_coverage v2, no dangling
      # primary_axis / reports_into / conditioned_by refs, relational-consolidation shape) — was gated
      # by NO workflow. So #479's relational-trio consolidation renamed a key + left cis-feature-coherence
      # pointing at an UNREGISTERED cis_coherence axis, and the test file went red on trunk for weeks with
      # a green pipeline (fixed in #491). Gate it explicitly so ontology drift fails a PR instead.
      - name: Target-profiling-axes ontology contract
        run: python -m pytest tests/vocabularies/test_target_profiling_axes.py tests/vocabularies/test_question_hierarchies.py -q

      # Framework Atlas (validators/architecture_dashboard/living/): a superset of the
      # unified dashboard adding Gaps / Concepts / Docs tabs + the glossary LEGIBILITY layer. Like
      # framework-health, only the CI-SAFE self-check runs here (checkout-only runner has no siblings):
      # it validates the committed health/framework_atlas.json's internal consistency — concepts resolved,
      # gaps tally == list, and EVERY surfaced machine token is glossed (the legibility contract fails
      # the build on an unglossed token). Full regenerate / --check is a local guard (needs siblings).
      - name: Living doc self-check + unit tests (incl. glossary coverage)
        run: |
          python validators/architecture_dashboard/living/build_living_doc.py --self-check
          python -m pytest validators/architecture_dashboard/living/tests/ -q
