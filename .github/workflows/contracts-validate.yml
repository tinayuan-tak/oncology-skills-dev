name: contracts-validate

# Governance-contract CI: runs the three repo-local validators on every change to
# the data contracts (cards / interpretation-rules / schemas / vocabularies) or the
# validators themselves. This is the gate that keeps the evidence-card + rule
# contracts schema-valid and cross-consistent on every PR.
#
# WHY these three (and not the framework-health dashboard): framework-health.yml
# validates the committed dashboard ARTIFACT's internal integrity. This job
# validates the SOURCE contracts:
#   - validate_cards.py            — card_spec structural + cross-reference checks
#   - validate_measurement_types.py — measurement_type vocab ↔ card concordance
#   - validate_interpretation_rules.py — Tier-2 rule schema + card-reachability,
#     run over ALL interpretation-rules/*.rules.yaml (directory form globs them).
#
# CROSS-REPO NOTE: the figure-emission check in validate_cards.py reads the sibling
# claude-oncology-skills repo's _figure_emitters.py. On a checkout-only runner that
# sibling is absent, so that one check graceful-skips (never a false failure); the
# KNOWN_FIGURE_DEBT waiver keeps it green where the sibling IS present. Every other
# check runs fully from this repo alone.
#
# Plain `python` invocation (no pixi in this repo) — mirrors framework-health.yml.
#
# Runs on EVERY pull_request (no `paths:` filter): the validators re-check the whole
# contract set from the repo, so this passes cheaply (~1.5 min) on PRs that don't touch
# contracts and fails on any that break them. This is a prerequisite for making
# `contracts-validate` a REQUIRED status check — a required check whose workflow is
# path-filtered sits "Expected — waiting" forever on a PR that doesn't match the paths,
# deadlocking it. Running unconditionally makes the check always report so it can be
# required safely. (The push trigger stays path-scoped — it only gates main-branch pushes.)

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "cards/**"
      - "interpretation-rules/**"
      - "resolvers/**"
      - "dashboards/**"
      - "schemas/**"
      - "vocabularies/**"
      - "validators/**"
      - "tests/**"
      - ".github/workflows/contracts-validate.yml"

jobs:
  contracts-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # matplotlib is here ONLY for plot_styles/tests/test_figure_frame_contract.py, whose
      # module-level `pytest.importorskip("matplotlib")` otherwise skips the file AT COLLECTION
      # — and a collection-time module skip is near-invisible: bare `pytest -q` reports it as
      # "no tests collected" for that file, not as a skip line. Measured 2026-09-17 on a
      # sibling-free clone with this exact pip set: 1214 tests collected WITHOUT matplotlib vs
      # 1224 WITH it, and those 10 are the entire difference. So without this dependency the
      # whole-repo step below would be green while 10 rendering-contract tests never ran.
      - name: Install dependencies
        run: python -m pip install --upgrade pip pyyaml jsonschema pytest pytest-xdist matplotlib

      - name: Validate card specs
        run: python validators/validate_cards.py cards/

      - name: Validate evidence_graph (schema + referential integrity)
        run: python validators/validate_evidence_graph.py --self-check

      - name: Validate skill question registries (questions.yaml schema; skips if skills repo absent)
        run: python validators/validate_questions.py

      - name: Validate measurement types
        run: python validators/validate_measurement_types.py

      - name: Validate interpretation rules (all rules files)
        run: python validators/validate_interpretation_rules.py --rules interpretation-rules/ --cards cards/

      # T9b (2026-08-11 engineering review): validate_resolvers.py was a fully-built validator
      # wired into NO workflow — the dangling-rung / renamed-rule-id drift it guards was unguarded
      # on PRs. Wire it here so resolver precedence changes are gated.
      - name: Validate resolvers (dangling-rung / rule-id reachability)
        run: python validators/validate_resolvers.py --resolvers resolvers/ --rules interpretation-rules/

      # R1-class guard (2026-08-15): validate_verdict_tokens.py checks that every verdict token
      # referenced by the nomination gate policy (gates / positive_signals /
      # positive_signals_modality_scoped) matches CASE-EXACT a verdict its sub-skill's resolver
      # actually emits — so a mis-cased/typo'd/stale token (the dead `ADC_preferred` vs
      # emitted `adc_preferred`) fails CI instead of silently never firing.
      - name: Validate nomination-gate verdict tokens (resolver consistency)
        run: python validators/validate_verdict_tokens.py --gate vocabularies/nomination_verdict_gate.yaml --resolvers resolvers/

      # CERTAINTY_MODEL §3 required-validator #1 (R3): certainty_by_axis `corroboration` sources must be
      # verdict-DISJOINT — a corroboration card must fire no verdict-driving rung for its gate, else
      # certainty double-counts the verdict. Asserts corroboration_by_gate (certainty_corroboration.yaml)
      # ∩ each gate's verdict-precedence card-set = ∅. Documented in the model but previously unimplemented.
      - name: Validate certainty corroboration ⟂ verdict-precedence disjointness
        run: python validators/validate_certainty_disjointness.py

      # Contract-drift guard (2026-08-17 cards review, S2 #4): the card→resolver-consumption
      # (verdict-role) map. Cards mislabel their verdict role in PROSE in both directions
      # (mutation-drug-response claims inert but drives a rung; genomic-event-model-match/phospho
      # claim driving but are inert). This pins the COMPUTED reality in a committed snapshot so a
      # card gaining/losing resolver consumption fails CI (conscious update).
      - name: Validate card→resolver consumption (verdict-role snapshot)
        run: python validators/validate_card_resolver_consumption.py

      # M0 of the factored-record migration (docs/design/VERDICT_REPRESENTATION_MIGRATION.md):
      # validate the factored claim-record schema + its four cross-field invariants against the
      # hand-authored worked examples. ZERO runtime consumers yet — this proves the record is
      # coherent before any skill emits it at M1 (shadow). Advisory-by-scope until M3, but gated
      # now so the schema/example/validator triple can never drift silently.
      - name: Validate factored claim records (schema + invariants)
        run: python validators/validate_claim_record.py --schema schemas/claim_record.schema.json --examples docs/design/examples/ --resolvers resolvers/

      # M5 (VERDICT_REPRESENTATION move #5): the rule-role partition (gating vs display) must match the
      # live contracts — a rule gaining/losing verdict-moving consumption fails until the committed
      # snapshot (coverage/rule_role_partition.yaml) is consciously regenerated.
      #
      # Only the --self-check runs here now; its non-vacuity proof — the mutation tests in
      # tests/validators/test_rule_role_partition.py (--self-check alone cannot show the duplicate /
      # coverage / dangling / attribution checks can fail) — runs in the same job via the whole-repo
      # net at the end (2026-09-25: enumerated pytest dropped, all tests collected by that net).
      - name: Validate rule-role partition (gating vs display drift)
        run: python validators/build_rule_role_partition.py --self-check

      # Fold M3 completion guard (VERDICT_REPRESENTATION_FOLD.md): every resolver must stay
      # match_all_reduce with unique per-rung priorities — the first_match interpreter path is retired
      # to a test oracle and a new/hand-edited resolver must not silently reintroduce positional precedence.
      - name: Validate Fold migration (all resolvers folded)
        run: python validators/validate_fold_migration.py --resolvers resolvers/

      # Eval ledger (portfolio memory): CI-safe self-check of the committed artifact
      # (checkout-only, no sibling probes — mirrors the framework-health self-check gate).
      - name: Eval ledger committed-artifact self-check
        run: python validators/build_eval_ledger.py --self-check

      # T1 reachability (Stage I, 2026-09-19): which (card_id, field, value) triples does the corpus
      # actually emit? Every interpretation rule keys on a triple, and nothing enumerated them —
      # gen_summary_schemas.py copies each `enum` from the card's DECLARED vocabulary, so all 46
      # generated schemas carry required:[] + additionalProperties:true and cannot fail.
      #
      # ONLY THE HERMETIC HALF RUNS HERE, and that is a real hole, named rather than papered over:
      # this runner is checkout-only, so there is no corpus to re-walk. What CI proves is the
      # DECLARATION side — a card narrowing a vocabulary while the corpus still emits the value
      # (safety-adverse: a rule keyed on that token now references one the contract rejects), a
      # field renamed out from under the ledger, a newly declared vocabulary no method produces, a
      # hand-edited count. A method that starts emitting a NEW token is caught at corpus
      # regeneration, not here. The gate lands green with today's 3 violations + 11 never-observed
      # pairs pre-listed and dated, so each removal is a one-line PR and trunk never reds —
      # contracts-validate is not branch-protection-required, so a red trunk silently taints every
      # open PR.
      #
      # Non-vacuity is not optional: --self-check cannot show its own checks are non-vacuous, and four
      # of this validator's checks were measured fail-open during development (an exclusion filter keyed
      # on row presence published `{}` while 4 orphans went unreported). The mutation tests in
      # tests/validators/test_emission_ledger.py are the only thing proving they can fail at all — they
      # run in this same job via the whole-repo net at the end (2026-09-25: enumerated pytest dropped).
      - name: Validate emission ledger (T1 reachability; hermetic half only)
        run: python validators/build_emission_ledger.py --self-check

      # I.3 wiring reconciliation: READS (method) vs DECLARES (card required_inputs) vs EMITS
      # (emission ledger). This runner is checkout-only (no analysis-methods/skills/data-catalog
      # siblings), so only the HERMETIC half runs — it re-derives the findings from the committed
      # reads against today's cards, catching declaration-side drift; the LIVE re-extraction runs at
      # preland. Findings are asserted only on the SOUND tier (fully catalog_query-visible reads); the
      # dated known_violations baseline is EMPTY (the one genuine finding was fixed in the card). With
      # an empty baseline the mutation suite tests/validators/test_wiring_reconciliation.py are the only
      # proof the gate can fail at all (self-check alone cannot show its own checks are non-vacuous) —
      # they run in this same job via the whole-repo net at the end (2026-09-25: enumerated pytest dropped).
      - name: Validate wiring reconciliation (I.3; hermetic half only)
        run: python validators/build_wiring_reconciliation.py --self-check

      # I.4 wiring ledger: dataset-grain complement of I.3 — every data-catalog manifest id as read /
      # declared_only / dark (the wiring worklist). Checkout-only here, so only the HERMETIC half runs:
      # it re-reads today's cards for the declared set and gates the partition invariant, anti-vacuity
      # floors, and declaration drift (a card now declaring a committed-dark id). The LIVE recompute
      # runs at preland. `dark` is a dimension, never a gate; --self-check only forbids silent drift.
      # With nothing baselined the mutation suite tests/validators/test_wiring_ledger.py is the only
      # proof the checks can fail; it runs in this same job via the whole-repo net at the end
      # (2026-09-25: enumerated pytest dropped, all tests collected by that net).
      - name: Validate wiring ledger (I.4; hermetic half only)
        run: python validators/build_wiring_ledger.py --self-check

      # Framework Atlas (validators/architecture_dashboard/living/): a superset of the
      # unified dashboard adding Gaps / Concepts / Docs tabs + the glossary LEGIBILITY layer. Like
      # framework-health, only the CI-SAFE self-check runs here (checkout-only runner has no siblings):
      # it validates the committed health/framework_atlas.json's internal consistency — concepts resolved,
      # gaps tally == list, and EVERY surfaced machine token is glossed (the legibility contract fails
      # the build on an unglossed token). Full regenerate / --check is a local guard (needs siblings).
      # Only the --self-check runs here; the unit tests (incl. glossary coverage) under
      # validators/architecture_dashboard/living/tests/ run in this same job via the whole-repo net at
      # the end — confirmed collected by it (2026-09-25: enumerated pytest dropped).
      - name: Living doc self-check
        run: python validators/architecture_dashboard/living/build_living_doc.py --self-check

      # ── SAFETY NET (2026-09-17) ─────────────────────────────────────────────────────────
      # Every pytest step above names one file or directory, because tests/ is curated
      # file-by-file (see the "gated explicitly" comments above). That curation has never kept
      # pace with the repo. Measured immediately before this step was added: 48 of 81 test
      # files — 43 of 69 under tests/ — were reachable from NO workflow pytest target at all.
      # A test that runs in zero CI cannot fail, so it decays into documentation. Two cases
      # this actually bit:
      #   * tests/validators/test_measurement_types_vocab.py — framework-health.yml carried a
      #     SCOPE NOTE asserting this file was RED on main and therefore blocking a repo-wide
      #     suite. It is green (14/14) and it had never run in CI, so its state was never what
      #     gated anything. That note is retracted in the same change as this step.
      #   * validators/output_registry/tests/ — three files, named by nothing.
      #
      # ADDITIVE ON PURPOSE — this does not replace the enumerated steps:
      #   * a named step fails fast WITH ATTRIBUTION: its red says which contract broke, where
      #     a red here only says something did.
      #   * the `python validators/validate_*.py` steps are not pytest and are not covered by
      #     this step at all.
      #   * the price is re-running the ~33 files already gated above. Paid knowingly.
      # What this buys: a NEW test file is gated the day it lands, with nobody having to
      # remember to add a `run:` line for it.
      #
      # MEASURED IN CI, on the PR that added this step (#797) — not extrapolated from a local
      # run: 1198 passed / 26 skipped in 3m44s. That is 1224 collected, which equals a local
      # full-suite collection exactly, so nothing is silently uncollected on the runner. The 26
      # skips are the sibling-gated `skipif` families (analysis-methods / data-catalog /
      # claude-oncology-skills absent) — the intended checkout-only behaviour, not breakage.
      #
      # TRAP, if you re-measure locally and get 1209 passed / 15 skipped instead: sibling
      # presence is resolved TWO different ways in this repo, and moving the checkout only
      # defeats one of them.
      #   (a) relative to the checkout — a clone outside ~/ hides these. 15 skips.
      #   (b) via the DATA_CATALOG_ROOT / CLAUDE_ONCOLOGY_SKILLS_ROOT / ANALYSIS_METHODS_ROOT
      #       env vars, whose DEFAULTS are hardcoded /home/sagemaker-user/... ABSOLUTE paths
      #       (validate_cards.py, validate_questions.py, validate_subgroup_assignments.py).
      #       On a dev box these resolve to the REAL siblings no matter where the clone lives,
      #       so 11 more tests run locally that cannot run on a runner.
      # Relocating the clone is therefore NOT a faithful CI simulation, and neither is
      # redirecting HOME (measured: both still give 1209/15 — the paths are absolute, not
      # HOME-relative). Point the roots at nothing instead. Measured 1198 passed / 26 skipped
      # in 3m52s, matching CI's 1198/26 exactly:
      #     env DATA_CATALOG_ROOT=/nonexistent CLAUDE_ONCOLOGY_SKILLS_ROOT=/nonexistent \
      #         ANALYSIS_METHODS_ROOT=/nonexistent python -m pytest -q
      #
      # TIMING: this job was ~2m51s before this step and 6m42s with it. 2026-09-25 both bottlenecks
      # were taken out (chore/parallelize-gate-xdist): (1) the redundant enumerated `pytest` steps
      # were dropped — the author-endorsed remedy — since this net collects and runs every test file
      # anyway (only the `validators/validate_*.py` + `build_*.py --self-check` steps remain above,
      # which are not pytest and NOT covered here); (2) this net now runs under pytest-xdist. Measured
      # in this worktree, roots pointed at /nonexistent: serial `pytest -q` = 1490 passed / 15 skipped
      # in 5m29s; `-n auto` = the SAME 1490 / 15 in 1m17s (4.1×, byte-identical pass/skip → the suite
      # is parallel-safe). Do NOT path-filter this workflow to speed it up — that re-opens the
      # required-check deadlock (see header). `-n auto` sizes workers to the runner's core count.
      - name: Whole-repo test suite (the pytest gate; also nets files no validator step above names)
        run: python -m pytest -q -n auto
