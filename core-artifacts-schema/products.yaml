# Analysis Products Registry — v2.0
#
# Single source of truth for the v2 oncology framework's "analysis products".
# Each product is a named comparison/method within a dimension. Skills, batch
# jobs, and orchestrators query this registry rather than hard-coding product
# knowledge.
#
# Three layers (per spec section "Analysis Products Framework"):
#   DIMENSION      category       (12 dimensions enumerated in evidence.schema.json)
#     PRODUCT      named method   (this registry; ~25 entries below)
#       INSTANCE   parameterized  (gene × indication × subgroup × release)
#
# Field semantics:
#   id                            kebab-case unique identifier; embeds dimension + comparison
#   dimension                     must match an entry in evidence.schema.json's dimension enum
#   title                         human-readable
#   comparison_type               canonical phrase describing the statistical question
#   indication_scope              single_indication | single_indication_with_subgroups |
#                                 pan_cancer | lineage_mapped | target_level | n_a
#   sources                       list of data-catalog manifest IDs the product consumes
#   method                        free-form sub-object describing the algorithmic approach
#   result_schema_ref             relative path to per-product result-payload JSON schema
#   s3_path_template              tokenized template for the derived artifact location
#   core_artifact_path_template   tokenized template for evidence.json location
#   requires_subgroup             whether the orchestrator must pass a subgroup spec
#   requires_target_resolution_sidecar  whether emit_sidecar() must run on derived artifacts
#   status                        compute-ready | data-blocked | planned | partial
#   backfill_status               per-indication map of {shipped, planned, n_a}
#   notes                         free-form context
#
# Status enum:
#   compute-ready    sources are mirrored AND pipeline can be authored today
#   data-blocked     pipeline is designed but at least one source is not yet mirrored
#   planned          design exists in spec; pipeline + sources both deferred
#   partial          some indications shipped, others planned
#
# Schema version: track here so consumer skills can refuse to load incompatible registries
schema_version: "1.0.0"

products:

  # ============================================================
  # DIMENSION: expression-rna  (4 products)
  # ============================================================

  - id: expression-rna-tumor-vs-adjacent
    dimension: expression-rna
    title: "Differential expression — primary tumor vs adjacent normal"
    comparison_type: tumor_vs_adjacent_normal
    indication_scope: single_indication
    sources:
      - tcga-gdc-dr45-0
    method:
      family: deseq2
      design_formula: "~ sample_type"        # plus optional batch + subtype covariates per indication config
      shrinkage: apeglm
      fdr_method: BH
      multiple_testing_tier: tier1
      sample_filter: primary-tumor-and-adjacent-normal-only
      sample_dedup: one_per_case_group_first_by_file_id
      gene_aggregation: sum-by-gene_symbol
      pre_filter: ">=10_counts_in_>=3_samples"
    result_schema_ref: products/expression-rna-tumor-vs-adjacent.result.schema.json
    s3_path_template: "s3://onc-compbio/data-catalog/derived/{INDICATION}-dge/{git_sha}/tumor_vs_adjacent.parquet"
    core_artifact_path_template: "s3://onc-compbio/core-artifacts/{INDICATION}/{subtype}/{gene}/expression-rna/tumor-vs-adjacent.evidence.json"
    requires_subgroup: false
    requires_target_resolution_sidecar: true
    status: partial
    backfill_status:
      COADREAD: shipped       # coadread-dge-df06320 + sidecar live
      NSCLC: planned
      STAD: planned
      HNSC: planned
      SCLC: planned
    notes: |
      Reference product. The COADREAD-DGE artifact (coadread-dge-df06320)
      is a shipped instance with target-resolution sidecar attached.
      Tempus RWD overlay is OPTIONAL and added as result.tempus_summary
      sub-block when indication has Tempus coverage; not a separate product.

  - id: expression-rna-tumor-vs-gtex
    dimension: expression-rna
    title: "Differential expression — primary tumor vs GTEx-matched normal"
    comparison_type: tumor_vs_gtex_normal
    indication_scope: single_indication
    sources:
      - tcga-gdc-dr45-0
      - recount3-tcga-gtex-2023-01-04           # Monorail-uniform reprocessing for cross-source consistency
    method:
      family: deseq2_with_combat_seq
      design_formula: "~ source_class + sample_type"
      sensitivity_matrix: "{with, without ComBat-seq} x {GTEx-only, joint TCGA+GTEx}"
      shrinkage: apeglm
      fdr_method: BH
      multiple_testing_tier: tier1
    result_schema_ref: products/expression-rna-tumor-vs-gtex.result.schema.json
    s3_path_template: "s3://onc-compbio/data-catalog/derived/{INDICATION}-dge/{git_sha}/tumor_vs_gtex.parquet"
    core_artifact_path_template: "s3://onc-compbio/core-artifacts/{INDICATION}/{subtype}/{gene}/expression-rna/tumor-vs-gtex.evidence.json"
    requires_subgroup: false
    requires_target_resolution_sidecar: true
    status: compute-ready
    backfill_status:
      all: planned
    notes: |
      Required for indications without sufficient adjacent normals (e.g.,
      PDAC). For indications with both, tumor-vs-adjacent is the primary
      product and tumor-vs-GTEx is a sensitivity / cross-source check.
      Sensitivity matrix discipline is mandatory: all 4 cells must
      converge for HIGH confidence.

  - id: expression-rna-subtype-stratified
    dimension: expression-rna
    title: "Subtype-stratified DEG — per molecular subgroup tumor-vs-adjacent"
    comparison_type: tumor_vs_adjacent_normal_per_subgroup
    indication_scope: single_indication_with_subgroups
    sources:
      - tcga-gdc-dr45-0
    method:
      family: deseq2
      design_formula: "~ subgroup + sample_type + subgroup:sample_type"
      shrinkage: apeglm
      fdr_method: BH
      multiple_testing_tier: tier2            # per-subgroup BH; not genome-wide
    result_schema_ref: products/expression-rna-subtype-stratified.result.schema.json
    s3_path_template: "s3://onc-compbio/data-catalog/derived/{INDICATION}-dge/{git_sha}/by_subgroup.parquet"
    core_artifact_path_template: "s3://onc-compbio/core-artifacts/{INDICATION}/{subtype}/{gene}/expression-rna/by-subgroup.evidence.json"
    requires_subgroup: true
    requires_target_resolution_sidecar: true
    status: compute-ready
    backfill_status:
      all: planned
    notes: |
      Per-subgroup DEG via interaction term. Interpreted alongside
      tumor-vs-adjacent: subgroup-specific signals identify therapeutic
      windows ("strong in CMS3, weak in CMS1").

  - id: expression-rna-pan-cancer
    dimension: expression-rna
    title: "Pan-cancer expression profile — gene across all TCGA indications"
    comparison_type: cross_indication_profile
    indication_scope: pan_cancer
    sources:
      - tcga-gdc-dr45-0
    method:
      family: log2_tpm_summary
      stratification: per_oncotree_code
      multiple_testing_tier: tier1
    result_schema_ref: products/expression-rna-pan-cancer.result.schema.json
    s3_path_template: "s3://onc-compbio/data-catalog/derived/pan-cancer-expression/{git_sha}/profile.parquet"
    core_artifact_path_template: "s3://onc-compbio/core-artifacts/PAN_CANCER/all/{gene}/expression-rna/pan-cancer.evidence.json"
    requires_subgroup: false
    requires_target_resolution_sidecar: true
    status: compute-ready
    backfill_status:
      PAN_CANCER: planned
    notes: |
      Drives the indication-discovery dimension's cross-indication
      ranking; surfaces tissue-of-relevance for novel targets.

  # ============================================================
  # DIMENSION: mutation-profile  (3 products)
  # gdc-pancohort-somatic-dr45-0 lands as of #42; unblocked.
  # ============================================================

  - id: mutation-profile-frequency
    dimension: mutation-profile
    title: "Somatic mutation frequency by indication and subgroup"
    comparison_type: mutation_freq_per_strata
    indication_scope: single_indication_with_subgroups
    sources:
      - gdc-pancohort-somatic-dr45-0
    method:
      family: maf_aggregate
      callers: [mutect2, muse, varscan2, pindel]
      consequence_filter: ["missense_variant", "stop_gained", "frameshift_variant", "splice_donor_variant", "splice_acceptor_variant"]
    result_schema_ref: products/mutation-profile-frequency.result.schema.json
    core_artifact_path_template: "s3://onc-compbio/core-artifacts/{INDICATION}/{subtype}/{gene}/mutation-profile/mutation-profile-frequency.evidence.json"
    requires_subgroup: false                  # but optional subgroup stratification supported
    requires_target_resolution_sidecar: true
    status: compute-ready
    backfill_status:
      all: planned

  - id: mutation-profile-hotspot
    dimension: mutation-profile
    title: "Hotspot mutation calling — gene-level position frequency"
    comparison_type: position_level_recurrence
    indication_scope: single_indication
    sources:
      - gdc-pancohort-somatic-dr45-0
    method:
      family: hotspot_caller
      reference: cancerhotspots_v2_or_recurrence_threshold
    result_schema_ref: products/mutation-profile-hotspot.result.schema.json
    core_artifact_path_template: "s3://onc-compbio/core-artifacts/{INDICATION}/{subtype}/{gene}/mutation-profile/mutation-profile-hotspot.evidence.json"
    requires_subgroup: false
    requires_target_resolution_sidecar: true
    status: compute-ready

  - id: mutation-profile-cooccurrence
    dimension: mutation-profile
    title: "Mutation co-occurrence — pairwise Fisher across driver genes"
    comparison_type: gene_pair_cooccurrence
    indication_scope: single_indication
    sources:
      - gdc-pancohort-somatic-dr45-0
      - cancermine-r16849846-snapshot-2026-06-22  # driver-gene shortlist for pair selection
    method:
      family: fisher_exact_pairwise
      multiple_testing: BH
    result_schema_ref: products/mutation-profile-cooccurrence.result.schema.json
    core_artifact_path_template: "s3://onc-compbio/core-artifacts/{INDICATION}/{subtype}/{gene}/mutation-profile/mutation-profile-cooccurrence.evidence.json"
    requires_subgroup: false
    requires_target_resolution_sidecar: true
    status: compute-ready

  # ============================================================
  # DIMENSION: dependency  (2 products)
  # ============================================================

  - id: dependency-depmap-chronos
    dimension: dependency
    title: "DepMap CRISPR essentiality (Chronos score) by lineage and mutation context"
    comparison_type: cell_line_essentiality
    indication_scope: lineage_mapped
    sources:
      - depmap-consortium-26q1                # primary
      - depmap-consortium-26q1-crispr-supplementary
    method:
      family: chronos
      stratification: ["lineage", "primary_disease", "mutation_context"]
    result_schema_ref: products/dependency-depmap-chronos.result.schema.json
    core_artifact_path_template: "s3://onc-compbio/core-artifacts/{INDICATION}/{subtype}/{gene}/dependency/dependency-depmap-chronos.evidence.json"
    requires_subgroup: false
    requires_target_resolution_sidecar: true
    status: compute-ready
    backfill_status:
      all: planned

  - id: dependency-depmap-rnai
    dimension: dependency
    title: "DepMap RNAi (legacy DEMETER2) — orthogonal essentiality call"
    comparison_type: cell_line_essentiality_rnai
    indication_scope: lineage_mapped
    sources:
      - depmap-consortium-26q1-rnai
    method:
      family: demeter2
      stratification: ["lineage"]
    result_schema_ref: products/dependency-depmap-rnai.result.schema.json
    core_artifact_path_template: "s3://onc-compbio/core-artifacts/{INDICATION}/{subtype}/{gene}/dependency/dependency-depmap-rnai.evidence.json"
    requires_subgroup: false
    requires_target_resolution_sidecar: true
    status: compute-ready
    notes: |
      Used as an orthogonal CHECK on Chronos calls. Discrepancies
      flag potential CRISPR-vs-RNAi mechanism differences (e.g.,
      catalytic-vs-scaffold vulnerabilities).

  # ============================================================
  # DIMENSION: perturbation-response  (3 products)
  # PRISM is the dominant data source; multiple snapshot variants.
  # ============================================================

  - id: perturbation-prism-viability
    dimension: perturbation-response
    title: "PRISM Oncology Reference — drug viability matrix (cell line × compound)"
    comparison_type: small_molecule_viability_matrix
    indication_scope: lineage_mapped
    sources:
      - prism-oncref-dmc-25q4                 # latest pre-26Q1 (LANDMARK release)
      - depmap-consortium-26q1-perturbation-screens
    method:
      family: prism_viability_matrix
      detection: dual_track_lum_seq
      stratification: ["lineage", "mutation_context"]
    result_schema_ref: products/perturbation-prism-viability.result.schema.json
    core_artifact_path_template: "s3://onc-compbio/core-artifacts/{INDICATION}/{subtype}/{gene}/perturbation-response/perturbation-prism-viability.evidence.json"
    requires_subgroup: false
    requires_target_resolution_sidecar: true   # compound→target mapping happens via target-of-record
    status: compute-ready

  - id: perturbation-prism-doseresponse
    dimension: perturbation-response
    title: "PRISM Oncology Reference — dose-response curve parameters (IC50, Emax, AUC)"
    comparison_type: small_molecule_drc
    indication_scope: lineage_mapped
    sources:
      - prism-oncref-dmc-25q4
    method:
      family: prism_drc_4parameter_logistic
    result_schema_ref: products/perturbation-prism-doseresponse.result.schema.json
    core_artifact_path_template: "s3://onc-compbio/core-artifacts/{INDICATION}/{subtype}/{gene}/perturbation-response/perturbation-prism-doseresponse.evidence.json"
    requires_subgroup: false
    requires_target_resolution_sidecar: true
    status: compute-ready

  - id: perturbation-sanger-combinations
    dimension: perturbation-response
    title: "Sanger drug combination screens — synergy and Bliss/Loewe scores"
    comparison_type: pairwise_drug_synergy
    indication_scope: lineage_mapped
    sources:
      - sanger-drug-combinations-2022
    method:
      family: bliss_loewe_synergy
    result_schema_ref: products/perturbation-sanger-combinations.result.schema.json
    core_artifact_path_template: "s3://onc-compbio/core-artifacts/{INDICATION}/{subtype}/{gene}/perturbation-response/perturbation-sanger-combinations.evidence.json"
    requires_subgroup: false
    requires_target_resolution_sidecar: true
    status: compute-ready
    notes: |
      Useful for combination-therapy hypotheses (e.g., KRAS G12C +
      SHP2 inhibitor synergy in CRC lineage).

  # ============================================================
  # DIMENSION: survival  (2 products)
  # ============================================================

  - id: survival-km-by-expression
    dimension: survival
    title: "Kaplan-Meier survival stratified by gene expression tertile"
    comparison_type: km_by_expression
    indication_scope: single_indication
    sources:
      - tcga-gdc-dr45-0                       # clinical metadata + STAR-counts
    method:
      family: kaplan_meier
      stratification: expression_tertile_or_median_split
      test: log_rank
      cox_covariates: ["age", "sex", "stage"]
    result_schema_ref: products/survival-km-by-expression.result.schema.json
    core_artifact_path_template: "s3://onc-compbio/core-artifacts/{INDICATION}/{subtype}/{gene}/survival/survival-km-by-expression.evidence.json"
    requires_subgroup: false
    requires_target_resolution_sidecar: true
    status: compute-ready
    notes: |
      Treacherous interpretation: TCGA endpoints are confounded by
      mixed treatments. Reported as descriptive, not causal.

  - id: survival-km-by-mutation
    dimension: survival
    title: "Kaplan-Meier survival stratified by mutation status"
    comparison_type: km_by_mutation
    indication_scope: single_indication
    sources:
      - tcga-gdc-dr45-0
      - gdc-pancohort-somatic-dr45-0
    method:
      family: kaplan_meier
      stratification: mutation_status_binary
      test: log_rank
    result_schema_ref: products/survival-km-by-mutation.result.schema.json
    core_artifact_path_template: "s3://onc-compbio/core-artifacts/{INDICATION}/{subtype}/{gene}/survival/survival-km-by-mutation.evidence.json"
    requires_subgroup: false
    requires_target_resolution_sidecar: true
    status: compute-ready

  # ============================================================
