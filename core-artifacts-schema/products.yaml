    title: "UniProt-derived target-level biology — sequence, PTMs, function"
    comparison_type: target_level_annotation
    indication_scope: target_level
    indication_sentinel: TARGET_LEVEL
    sources:
      - uniprot-sprot-human-2026-02-snapshot-2026-06-18
    method:
      family: uniprot_xml_extract
      fields: [sequence, function, subcellular_location, ptm, domain, family]
    result_schema_ref: products/target-biology-uniprot.result.schema.json
    core_artifact_path_template: "s3://onc-compbio/core-artifacts/TARGET_LEVEL/all/{gene}/target-biology/target-biology-uniprot.evidence.json"
    requires_subgroup: false
    requires_target_resolution_sidecar: false  # target-level; not row-keyed
    status: compute-ready

  - id: target-biology-coordinates
    dimension: target-biology
