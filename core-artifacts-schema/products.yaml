    comparison_type: gene_coordinates
    indication_scope: target_level
    indication_sentinel: TARGET_LEVEL
    sources:
      - ensembl-coords-release-116-snapshot-2026-06-22
    method:
      family: ensembl_coord_lookup
    result_schema_ref: products/target-biology-coordinates.result.schema.json
    core_artifact_path_template: "s3://onc-compbio/core-artifacts/TARGET_LEVEL/all/{gene}/target-biology/target-biology-coordinates.evidence.json"
    requires_subgroup: false
    requires_target_resolution_sidecar: false
    status: compute-ready

  - id: target-biology-paralog-landscape
    dimension: target-biology
    title: "Paralog landscape — co-essentiality and redundancy from DepMap"
    comparison_type: paralog_landscape
    indication_scope: target_level
    indication_sentinel: TARGET_LEVEL
    sources:
      - depmap-consortium-26q1-paralogs
    method:
      family: paralog_pair_essentiality
    result_schema_ref: products/target-biology-paralog-landscape.result.schema.json
    core_artifact_path_template: "s3://onc-compbio/core-artifacts/TARGET_LEVEL/all/{gene}/target-biology/target-biology-paralog-landscape.evidence.json"
    requires_subgroup: false
    requires_target_resolution_sidecar: false  # paralog-pair indexed, not single gene
    status: compute-ready
    notes: |
      Synthetic-lethal-adjacent. A gene with a paralog showing strong
      co-essentiality in DepMap suggests redundant compensation —
      single-gene knockdowns may be insufficient.

