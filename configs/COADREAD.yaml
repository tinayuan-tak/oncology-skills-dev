# Indication parameters — COADREAD (combined colon + rectum adenocarcinoma)
# OncoTree code: COADREAD (parent of COAD + READ in the AACR ontology).
# Used by batch/ jobs and skills/ that need indication-specific filters.

indication: COADREAD
indication_full: Colorectal Adenocarcinoma (combined COAD + READ)
oncotree_code: COADREAD
common_name: CRC

# Canonical source binding. The loader (00_load_counts.R) resolves manifest_id
# against the data-catalog repo's manifests/sources/ directory, then dispatches
# on manifest$provider to the appropriate source-specific reader.
source:
  manifest_id: tcga-gdc-dr45-0
  catalog_repo: rnd-computational-biology-oncology-data-catalog

# TCGA cohorts that constitute COADREAD (these ARE the OncoTree leaf codes)
tcga_cohorts:
  - COAD  # colon adenocarcinoma (TCGA-COAD)
  - READ  # rectum adenocarcinoma (TCGA-READ)

# Standard consensus subtypes (per runbook §"Standard consensus subtypes only").
# Subtype values are Takeda-internal vocabulary, NOT OncoTree codes — OncoTree
# does not enumerate molecular subtypes. These populate the {subtype} path axis.
subtypes:
  cms:
    - CMS1  # MSI immune
    - CMS2  # canonical
    - CMS3  # metabolic
    - CMS4  # mesenchymal
  ras:
    - mutant
    - wildtype
  msi:
    - MSS
    - MSI-H
  braf:
    - V600E_positive
    - V600E_negative

# DGE configuration
dge:
  comparison: tumor_vs_adjacent_normal
  tcga_barcode_suffixes:
    tumor: ['-01']
    adjacent_normal: ['-11']
  # Multi-aliquot handling: TCGA contributes multiple files per (case_id, group)
  # for ~2-3% of patients (technical-replicate vials, biological aliquots from
  # the same tumor block). Treating these as independent samples violates
  # DESeq2's NB-GLM independence assumption. Field-standard discipline (mc3,
  # cBioPortal, TCGAbiolinks): one aliquot per (case_id, sample_type), picked
  # deterministically. v1 policy: alphabetical-first by GDC file_id UUID.
  # See runbook entry "TCGA pseudo-replicate handling".
  sample_dedup: one_per_case_group_first_by_file_id
  multiple_testing:
    tier_1:
      method: BH
      scope: genome_wide
      pre_specified: true
    tier_2:
      method: BH
      scope: per_subtype_comparison
      pre_specified: true
      requires_tier_1_survival: true
    tier_3:
      method: none
      scope: exploratory
      pre_specified: false

# Reference normal: GTEx colon for sanity-checking adjacent-normal-derived DGE
gtex_reference:
  tissues:
    - Colon_Sigmoid
    - Colon_Transverse

# Output paths (these are templates; actual paths are produced at runtime with the git_commit)
outputs:
  dge_parquet: s3://onc-compbio/data-catalog/derived/COADREAD-dge/{git_commit}/tumor_vs_adjacent.parquet
  dge_provenance: s3://onc-compbio/data-catalog/derived/COADREAD-dge/{git_commit}/provenance.yaml
  artifact_root: s3://onc-compbio/core-artifacts/COADREAD/
