[workspace]
name = "analysis-protein-nsclc"
version = "0.1.0"
description = "NSCLC protein analysis using Human Protein Atlas data"
channels = ["conda-forge"]
platforms = ["osx-arm64", "osx-64", "linux-64"]

[tasks]
analyze = "python scripts/nsclc_protein_analysis.py"

[dependencies]
python = ">=3.10"
pandas = ">=2.0"
numpy = ">=1.24"
matplotlib = ">=3.7"
pyyaml = ">=6.0"
