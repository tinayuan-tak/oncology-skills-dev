# MOSTLY HUMAN-AUTHORED. Every row here carries `reviewed: true`: a human read the field's
# producers (target-contracts card contract) and its consumers (the census, blind to this ledger)
# and chose the role. Roles were NOT auto-drafted from field names (the tumor-presence _meta explains
# why that heuristic is noise). Completeness (every emitted summary_field covered) and reader-reach for
# `role: signal` are CI-enforced by skills/tests/test_field_disposition_ledgers.py.
_meta:
  description: Field-disposition ledger for tumor-selectivity — every emitted summary_field carries an
    explicit role so nothing is dropped SILENTLY. Enforced by skills/tests/test_field_disposition_ledgers.py.
  roles:
    signal: feeds a claim / verdict (must be wired or explicitly waived)
    context: qualifies a signal (power, certainty, statistical qualifier, percentile, CI bound, denominator,
      cross-axis pointer)
    provenance: audit / identity / method / version token — surfaced, never a signal
    display: human-facing detail or large container; verdict-inert by design
  generated_from: target-contracts/cards/<card>.card.yaml outputs.summary_fields
  reviewed: true == a human read the field's producers and consumers and chose this role.
  waived_because: only legal on role:signal. Records WHY a signal no declared reader reaches is left unwired
    (the Track-B wiring queue). Must name the missing consumer or owning repo.
