domain-modality-relevance:
  _primary_source_doi: 10.1038/onc.2013.497
  functional_domains:
  - "Protein kinase (catalytic \u2014 the TKI target)"
  - Extracellular / dimerization (ligand-independent kinase-independent signalling)
  method_version: 0.2.0
  modality_context: "EGFR has documented KINASE-INDEPENDENT pro-survival functions\
    \ (glucose transporter stabilization, autophagy modulation) beyond its catalytic\
    \ activity, so full removal (degrader / antibody-mediated downregulation) can\
    \ differ from TKI inhibition in some contexts. But the dominant oncogenic driver\
    \ in EGFR-mutant NSCLC IS the kinase, where TKIs are validated \u2014 hence context_dependent,\
    \ not removal_required."
