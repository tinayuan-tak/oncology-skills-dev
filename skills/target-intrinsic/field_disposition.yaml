# MOSTLY HUMAN-REVIEWED. Every row in this ledger carries `reviewed: true`: a human read the
# field's producers and consumers and chose the role. target-intrinsic is a GATELESS, verdict-INERT
# `tier: target` dossier (rules_scope: [], synthesis: none, verdict_fn=None): its safety / structure /
# mechanism facts are HOME'd and claim-decomposed under their OWNING subskills, so `role: signal` here
# records a field that feeds a claim/verdict SOMEWHERE in the framework (reach is measured BLIND to
# this ledger, globally, by _skills_common.field_disposition.census). Only the two fields UNIQUE to
# target-intrinsic that carry a defensible signal are projected into its own claim vector
# (target_intrinsic_claims.py): domain-modality-relevance modality_implication_class (MODALITY_ROUTING)
# and target-development-level tdl_class (TRACTABILITY_PRECEDENT). Completeness (exactly this skill's
# run.py CARDS x each card's outputs.summary_fields) and reader-reach for `role: signal` are the two
# CI-enforced properties. Roles for the four cards SHARED with the surface-modality-fit / tumor-presence
# ledgers (surfaceome-family-classification, structure-features-static, shed-ectodomain-liability,
# normal-tissue-liability) are REUSED verbatim from those reviewed ledgers via the sibling test.
_meta:
  description: "Field-disposition ledger for target-intrinsic \u2014 every emitted summary_field carries an explicit role so nothing is dropped SILENTLY. Enforced by skills/tests/test_field_disposition_ledgers.py."
  roles:
    signal: feeds a claim / verdict (must be wired or explicitly waived)
    context: qualifies a signal (power, certainty, statistical qualifier, cross-axis pointer)
    provenance: "audit / identity / method token \u2014 surfaced, never a signal"
    display: human-facing detail or large container; verdict-inert by design
  generated_from: target-contracts/cards/<card>.card.yaml outputs.summary_fields
  reviewed: "true == a human read the fields producers and consumers and chose this role. Absent == auto-drafted from the field NAME; treat as a draft, not a decision."
  waived_because: "only legal on `role: signal`. Records WHY a signal no declared reader reaches is being left unwired. A waiver must name the missing consumer or the owning repo; it is not a way to silence the guard. (No signal in this ledger needs one: all are exact-reached.)"
