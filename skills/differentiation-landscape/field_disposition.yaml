# MOSTLY HUMAN-AUTHORED. A row is a HUMAN JUDGEMENT when it carries `reviewed: true`; every row in this
# ledger does. Completeness (every emitted summary_field present) and reader-reach for `role: signal`
# are CI-enforced (skills/tests/test_field_disposition_ledgers.py). Reach is measured BLIND to this file.
# differentiation-landscape: 1 verdict-driving card (co-mutation-and-mutual-exclusivity) + 8 verdict-inert
# render-facet cards; `signal` rows on the facet cards feed CLAIM atoms, not the differentiation verdict.
_meta:
  description: Field-disposition ledger for differentiation-landscape — every emitted summary_field carries
    an explicit role so nothing is dropped SILENTLY. Enforced by skills/tests/test_field_disposition_ledgers.py.
    Only co-mutation-and-mutual-exclusivity is verdict-driving (its class + driver flags gate the differentiation
    resolver); the other 8 cards are ADDITIVE, VERDICT-INERT render facets, so their `signal` rows feed
    CLAIM atoms (evidence capsule / salience / display), not the differentiation_verdict spine (byte-stable).
  roles:
    signal: feeds a claim / verdict (must be wired or explicitly waived)
    context: qualifies a signal (power, certainty, statistical qualifier, cross-axis pointer)
    provenance: audit / identity / method token — surfaced, never a signal
    display: human-facing detail or large container; verdict-inert by design
  generated_from: target-contracts/cards/<card>.card.yaml outputs.summary_fields
  reviewed: 'true == a human read the field''s producers and consumers and chose this role. Every row
    here is reviewed: true (authored deliberately, not name-shape drafted).'
  waived_because: 'only legal on `role: signal`. Records WHY a signal no declared reader reaches is left
    unwired. None are needed here: every role:signal row is reach-confirmed exact by the blind census
    2026-09-27.'
co-mutation-and-mutual-exclusivity:
  cooccurrence_class:
    role: signal
    reason: headline co-occurrence/mutual-exclusivity call and the sole differentiation.resolver-gating
      categorical for this skill; role:signal reach-confirmed exact via {gating_rule, salience, skill_code}
      (census 2026-09-27, blind to ledger)
    reviewed: true
  cooccurrence_class_prefloor:
    role: context
    reason: raw pre-floor class emitted for AUDIT only (differs from cooccurrence_class solely when the
      significance floor demotes it); verdict-inert qualifier of the floored call; read exact by run.py
      headline (skill_code)
    reviewed: true
  top_cooccurring:
    role: display
    reason: per-partner Fisher q-value table (nested container) emitted as tables/top_cooccurring.csv
      for human/governance filtering by pooled_eligible; verdict-inert large container (resolver reads
      only the class + driver flags). Surfaced by the evidence capsule (salience) + run.py (skill_code)
    reviewed: true
  top_mutually_exclusive:
    role: display
    reason: per-partner mutual-exclusivity Fisher q-value table (nested container) emitted as tables/top_mutually_exclusive.csv;
      verdict-inert large container; read exact by run.py headline (skill_code)
    reviewed: true
  n_significant_cooccurring:
    role: context
    reason: count of significant co-occurring partners; statistical qualifier behind the class call; read
      exact by run.py (skill_code)
    reviewed: true
  n_significant_mutually_exclusive:
    role: context
    reason: count of significant mutually-exclusive partners; statistical qualifier behind the class call;
      read exact by run.py (skill_code)
    reviewed: true
  n_pairs_panel_intersect_eligible:
    role: context
    reason: pooled-eligible pair count; power/eligibility qualifier feeding _strength_certainty; read
      exact by run.py (skill_code)
    reviewed: true
  n_pairs_per_source_only:
    role: context
    reason: panel-ineligible (per-source-only) pair count; power/eligibility qualifier; read exact by
      run.py (skill_code)
    reviewed: true
  has_cooccurring_driver:
    role: signal
    reason: 'boolean driver flag the co-mutation resolver rung consumes (SKILL.md: rules engine consumes
      has_cooccurring_driver); role:signal reach-confirmed exact via {display_rule, skill_code} (census
      2026-09-27, blind to ledger)'
    reviewed: true
  has_mutually_exclusive_driver:
    role: signal
    reason: boolean mutual-exclusivity driver flag the co-mutation resolver input builder consumes; role:signal
      reach-confirmed exact via {skill_code} (census 2026-09-27, blind to ledger)
    reviewed: true
  method_version:
    role: provenance
    reason: cooccurrence_fisher_pancohort method-version token; audit/provenance, never a signal; name_only
      reach
    reviewed: true
