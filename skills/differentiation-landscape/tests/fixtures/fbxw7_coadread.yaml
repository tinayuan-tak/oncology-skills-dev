pathway-node-leverage:
  _caveats:
  - 'SOFT context: no veto, never raises certainty'
  - "complex (CORUM) lens is the robust one; pathway-lens node-set selection is a\
    \ HEURISTIC (C2.CP-preferred, size-banded) over many-to-many gene<->set membership\
    \ \u2014 judge the selected node_set NAME for relevance"
  - "ppi lens (BioGRID physical interactors, top-N by publications) is REPORT-ONLY\
    \ \u2014 surfaced for inspection but EXCLUDED from the headline (an interaction\
    \ hairball under worst-across-lenses aggregation would inflate 'dominated'); fail-soft"
  - "no directed acts-through check (SIGNOR/OmniPath) \u2014 DEFERRED, and not yet\
    \ needed: this method makes a relative fitness-rank comparison, NOT a directional\
    \ 'X acts through Y' claim, so there is no directional assertion to ground yet"
  - "paralog/combinatorial correction: single_ko_leverage_understated flags when the\
    \ target is paralog-BUFFERED (strong/partial, from the dual-KO buffering product)\
    \ \u2014 its single-KO Chronos, hence its leverage verdict, UNDERSTATES its dependency;\
    \ a buffered weak_and_uncontested/dominated call is a candidate false-negative\
    \ masked by redundancy (assess dual-KO / combinatorial leverage). Additive, fail-soft.\
    \ NOTE the paralog-MEDIATED-effector case (target whose PARALOG sits in the effector\
    \ pathway, e.g. MARK2 via MARK3) is surfaced as this buffering flag, not as a\
    \ node-set membership edge (which the pinned lenses cannot ground)"
  _method_version: 0.1.0
  evidence_scope: within_indication_lineage
