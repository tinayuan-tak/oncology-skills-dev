precog-prognostic-association:
  _caveat: "meta-analytic across 166 heterogeneous datasets (platforms/cohorts vary);\
    \ UNADJUSTED univariate survival association, hypothesis-generating not a clinical\
    \ claim. INDICATION IS AN APPROXIMATION \u2014 see precog_source_column."
  _method_version: 0.1.0
  _source: PRECOG pan-cancer prognostic meta-Z (Gentles 2015 Nat Med + 2026 NAR).
    POSITIVE meta-Z = high expression -> WORSE overall survival. Verdict-inert; meta-analytic
    corroboration of the single-cohort expression-clinical-association.
  indication: COADREAD
  meta_z: -0.786
  meta_z_significance_cut: 1.96
  n_precog_datasets: 166 datasets / ~18k patients (pan-cancer meta-analysis)
  pan_cancer_meta_z: -2.8562
  pan_cancer_prognostic_class: expression_high_better_survival
  precog_indication_approx: true
  precog_source_column: Colon_cancer
  prognostic_class: no_prognostic_association
  target: FBXW7
stemness-context:
