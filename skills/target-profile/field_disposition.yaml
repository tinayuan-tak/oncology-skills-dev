# CAPSTONE ledger for the target-profile ORCHESTRATOR. A row is a HUMAN JUDGEMENT only when it
# carries `reviewed: true` — EVERY row here does. Roles are INHERITED VERBATIM from the 15 landed
# sibling evidence-skill ledgers (the home owner of each of the 37 cards_used), because target-profile
# is a fan-out composer whose nomination is a function of each sub-skill's SUB-VERDICT, not of raw card
# fields read here directly. See _meta.inheritance and _meta.multi_owner_resolution. Completeness (every
# summary_field of every card) and reach for role:signal are CI-enforced by the fleet guard
# skills/tests/test_field_disposition_ledgers.py.
_meta:
  description: "Field-disposition ledger for target-profile (the composite ORCHESTRATOR / capstone) — every emitted summary_field of all 37 cards_used carries an explicit role so nothing is dropped SILENTLY. Enforced by skills/tests/test_field_disposition_ledgers.py (fleet guard: wellformedness + the reach ratchet over role:signal rows)."
  roles:
    signal: "feeds a claim / verdict / the target-profile NOMINATION (must be reader-reached or explicitly waived)"
    context: qualifies a signal (power, certainty, statistical qualifier, cross-axis pointer)
    provenance: audit / identity / method token — surfaced, never a signal
    display: human-facing detail or large container; verdict-inert by design
  generated_from: "target-contracts/cards/<card>.card.yaml outputs.summary_fields (37 cards_used from SKILL.md composition)"
  inheritance: "target-profile is a FAN-OUT-OVER-SUB-SKILLS composer: its nomination is a function of each sub-skill's SUB-VERDICT plus the LLM synthesis, not of raw card fields read directly here. Every one of these 37 cards is the HOME card of one of the 15 landed evidence-skill ledgers, which already made the reviewed role judgement. Roles/reasons are therefore INHERITED VERBATIM from those home ledgers: a field that is role:signal in its home skill feeds that skill's sub-verdict, which feeds the nomination, so it stays role:signal here; a field the home owner deemed verdict-inert (context/provenance/display) is not newly gated by the orchestrator. Reach is measured by the SAME global census, so signals reach the same readers. This ledger is CENSUS-NEUTRAL and VERDICT-INERT (ledger-only, no code/reader change)."
  multi_owner_resolution: "9 fields are covered by >1 home ledger with differing roles (cards composed under multiple lenses). Resolved by signal>context>provenance>display priority — signal wins where ANY gating consumer exists, per the orchestrator's definitive-gating perspective."
  reviewed: "true == the role was authored deliberately (here: inherited from the reviewed home-skill ledger and confirmed against target-profile's orchestrator perspective). EVERY row in this capstone carries reviewed: true."
  waived_because: "only legal on role:signal. Records WHY a signal that no declared reader reaches is kept signal rather than relabelled inert; inherited verbatim from the home ledger (surface-modality-fit) for the 8 adc-tce-modality-fit grade/topology signals."
