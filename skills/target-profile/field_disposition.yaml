  expression_properties:
    role: signal
    reason: "shared L2 expression-property facet object {presence, magnitude, prevalence, heterogeneity, lineage_restriction, + fleet-deferred selectivity/localization/subtype_restriction} resolved by the P2 property resolver (analysis-methods/methods/expression_properties, #720) from the same measurements that drive expression_class. Surfaced as a citable evidence atom on the presence claim vector (_skills_common/presence_claims.py `_expression_property_atom`, via the `_patom` claim_passthrough seam). P5 (issue #1509): promoted to role:signal on the DATA-DRIVEN basis that it is the one field of the distribution_pattern/coefficient_of_variation/expression_properties trio with EXACT, census-visible, skills-side SIGNAL reach — claim_passthrough (a code read into the claim vector; a capsule cannot credit an object). It is the resolved PROPERTY the evidence-property ontology attaches the signal to (its raw-measurement inputs distribution_pattern/coefficient_of_variation stay context). STILL VERDICT-INERT at the replay layer: it is a citable atom on the claim vector, not averaged into any claim or the presence_verdict — the reach ratchet is satisfied by the claim_passthrough reader, and the replay golden is byte-stable. Evidence-property architecture epic claude-oncology-skills#1507 / audit #1506 (P4, issue #1508; P5, issue #1509)"
    reviewed: true
  coefficient_of_variation:
    role: context
    reason: "distribution dispersion on linear TPM. P5 data-driven basis (issue #1509): its only skills-visible exact reach is `capsule` (a numeric_anchor, TC #873) — capsule reach cannot separate a decisive call from a context input, so it is a review candidate, not an auto-signal. Kept context because it is a raw measurement INPUT to the cross-repo P2 property resolver (analysis-methods methods/expression_properties/resolve.py:180 `_heterogeneity` reads it alongside distribution_pattern), NOT an independent signal: in the evidence-property ontology the signal attaches to the resolved PROPERTY (`expression_properties`, role:signal), never to the raw measurement. Whether the census should count that cross-repo resolver read is the split-out follow-up (must be gated with the analysis-methods sibling present and pin the resolver commit it scrapes). Capsule-wired so the fleet-aperture census reaches it (P3, issue #862)"
    reviewed: true
  distribution_pattern:
    role: context
    reason: "shape of the log2(TPM+1) distribution (unimodal/bimodal/long_tail); capsule-wired as a categorical_field (TC #873) so the fleet-aperture census reaches it. P5 resolution (issue #1509): STAYS role:context. Its only skills-visible exact reach is `capsule` — census- and descriptor-indistinguishable from the coefficient_of_variation sibling, so capsule reach cannot promote it. It is a raw measurement INPUT to the cross-repo P2 property resolver (analysis-methods methods/expression_properties/resolve.py:180 `_heterogeneity` reads distribution_pattern AND coefficient_of_variation as its two supplies), NOT an independent signal: the biological signal is carried by the RESOLVED property `expression_properties` (role:signal), which the evidence-property ontology attaches to the property rather than the raw measurement. The P3 note anticipated a P5 promotion, but the resolver read is cross-repo (the skills census scrapes the skills tree only, field_disposition.py:547), so promoting it is not a skills-visible reach fact — it is deferred to the split-out follow-up (teach the census to read the analysis-methods tree, AM-sibling-gated, pinning the resolver commit) (P3, issue #862; epic claude-oncology-skills#1507)"
    reviewed: true
