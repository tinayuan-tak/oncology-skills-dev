_meta:
  description: 'Field-disposition ledger for genomic-alteration-profile — every emitted summary_field
    across the skill''s 26 cards_used carries an explicit, HUMAN-REVIEWED role so nothing is dropped SILENTLY.
    Every row is reviewed: true (authored deliberately, not auto-drafted from field names). Enforced skill-agnostically
    by skills/tests/test_field_disposition_ledgers.py (well-formedness + the role:signal reach ratchet).'
  roles:
    signal: feeds a claim / verdict (the only role the reach ratchet gates; must be exact-reader-reached
      or explicitly waived)
    context: qualifies a signal (power / statistical qualifier / magnitude-behind-a-class / cohort-context
      or cross-axis pointer)
    provenance: audit / identity / method / version token — surfaced, never a signal
    display: human-facing detail, large container, or named-entity list; verdict-inert by design
  generated_from: target-contracts/cards/<card>.card.yaml outputs.summary_fields (domain), reach measured
    by _skills_common.field_disposition.census (blind to this ledger)
  reviewed: 'true == a human read the field''s producers and consumers and chose this role. Every row
    in this ledger is reviewed: true — the roles were authored, not name-shape drafted.'
  waived_because: 'only legal on role: signal. Records WHY a verdict/claim-bearing field that no exact
    declared reader reaches is left unwired — the Track-B wiring queue. Names the owning module/repo;
    not a way to silence the guard. Reach is EXACT-only: name_only / orphan do not satisfy the ratchet.'
  census_note: Reach captured 2026-09-27 via _skills_common.field_disposition.census over skills/ + the
    CI-pinned target-contracts card contracts; exact reader KINDS are named per signal row. Cohort-level
    context classes (genomic-instability / mutational-signature / ddr / oncogenic-pathway) are role:context
    by judgment — they frame the indication cohort, not the target's own alteration call. The three subgroup-stratified-*
    cards emit NO verdict per SKILL.md, so they carry no signal rows.
  interpretation_reach: 'SECOND AXIS (SK#1525, two-axis field-disposition contract
    _skills_common/field_disposition_contract.py; thread A2/A4 of #1937). Orthogonal to role: role says
    WHAT the field is (signal/context/provenance/display), interpretation_reach says HOW FAR its
    interpretation travels — unreached (no declared reader: a candidate orphan, a review queue, never a
    delete list), skills_local (read by a rule/capsule/salience/code/figure/gloss inside this repo), or
    cross_repo_resolver (read by the analysis-methods property resolver). MACHINE-DERIVED per
    (card_id, field) from _skills_common.field_disposition.census via
    field_disposition_contract.interpretation_reach_for (blind to this ledger), captured 2026-10-02;
    genomic resolves no analysis-methods resolver input, so no row is cross_repo_resolver. ADDITIVE
    beside role (nothing renamed/deleted); reach does not promote role (SK#2091, verdict-inert).'
