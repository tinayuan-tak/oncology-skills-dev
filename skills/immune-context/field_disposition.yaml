# FULLY HUMAN-REVIEWED. Every row carries `reviewed: true`: a human read the field's producers
# (target-contracts card outputs.summary_fields) and its consumers (skills/immune-context/scripts/run.py
# + the framework readers the census sees) and chose the role. immune-context is a GATELESS,
# effector-axis skill: the immune_context_verdict is a DIRECT read of immune_context_class (run.py
# _verdict; no resolver, no rule mapped into _RULE_TO_VERDICT), so the verdict SPINE is byte-stable and
# every card beyond the primary immune-context card is VERDICT-INERT display/facet by design. `role:
# signal` therefore records a field that feeds a claim/verdict SOMEWHERE in the framework -- reach is
# measured BLIND to this ledger, globally, by _skills_common.field_disposition.census (only `exact`
# evidence counts). Four fields carry a defensible signal: immune-context.immune_context_class (the
# verdict token), tcga-til-fraction-saltz.til_fraction_class (the orthogonal absolute-TIL corroborator
# the confidence RULER reads -- CONTRADICTS/CORROBORATES the CIBERSORT call and raises a first-class
# conflict, v1.8.0), and the two spatial-tumor-normal-colocalization signals REUSED verbatim from the
# reviewed tumor-selectivity ledger via the sibling test (spatial_coloc_class caps bite_tce at
# `conditional` here -- v1.7.0/v1.8.0 -- and normal_epithelium_adjacency_fraction carries its
# bystander-safety signal in tumor-selectivity). All four are exact-reached, so no `waived_because` is
# needed. Well-formedness and reader-reach for `role: signal` are the CI-enforced properties
# (skills/tests/test_field_disposition_ledgers.py); role CORRECTNESS is the human judgement `reviewed`
# marks.
_meta:
  description: "Field-disposition ledger for immune-context -- every emitted summary_field carries an explicit role so nothing is dropped SILENTLY. Enforced by skills/tests/test_field_disposition_ledgers.py."
  roles:
    signal: feeds a claim / verdict (must be wired or explicitly waived)
    context: qualifies a signal (power, certainty, statistical qualifier, cross-axis pointer)
    provenance: "audit / identity / method token -- surfaced, never a signal"
    display: human-facing detail or large container; verdict-inert by design
  generated_from: target-contracts/cards/<card>.card.yaml outputs.summary_fields
  reviewed: "true == a human read the field's producers and consumers and chose this role. Absent == auto-drafted from the field NAME; treat as a draft, not a decision."
  waived_because: "only legal on `role: signal`. Records WHY a signal no declared reader reaches is being left unwired. A waiver must name the missing consumer or the owning repo; it is not a way to silence the guard. (No signal in this ledger needs one: all four are exact-reached.)"

immune-context:
  immune_context_class:
    role: signal
    reason: "headline pan-cancer rank of the CD8 SHARE of the leukocyte compartment; the gateless immune_context_verdict is a DIRECT read of this token (run.py _verdict), so it is the skill's one true verdict-bearing field; reach=exact"
    reviewed: true
  median_cd8_fraction:
    role: context
    reason: "median CD8 share of the leukocyte compartment; continuous magnitude the class RANKS -- the verdict reads the class/rank, not the raw share (reference_frame), so it qualifies rather than decides; reach=exact"
    reviewed: true
  median_total_t_cell_fraction:
    role: context
    reason: "median total T-cell fraction; abundance qualifier surfaced beside the CD8-share call on the headline; reach=exact"
    reviewed: true
  n_samples:
    role: context
    reason: "cohort sample count; power qualifier (also a NOT-READ 0-sentinel under the lymphoid-denominator guard, never rendered as a size -- v1.9.1); reach=exact"
    reviewed: true
  tumor_studies:
    role: provenance
    reason: "TCGA study codes composing the cohort; identity token cited by reference_frame (what the 'a cohort exists' claim rests on); reach=exact"
    reviewed: true
  cd8_hot_sample_fraction:
    role: context
    reason: "prevalence of strongly-infiltrated samples at the pan-cancer cut; heterogeneity_frame qualifier for the pooled median (bimodal-cohort blind spot); DESCRIPTIVE / non-gating by design (v1.9.0); reach=exact"
    reviewed: true
  cd8_treg_ratio:
    role: context
    reason: "CD8:Treg suppression ratio; suppression_frame qualifier (inflamed-but-SUPPRESSED != a bare hot call); non-gating (v1.9.0); reach=exact"
    reviewed: true
  cd8_m2_ratio:
    role: context
    reason: "CD8:M2-macrophage suppression ratio; suppression_frame qualifier; non-gating (v1.9.0); reach=exact"
    reviewed: true
  median_treg_fraction:
    role: context
    reason: "median Treg fraction; compartment magnitude behind cd8_treg_ratio and the leukocyte-composition figure; reach=name_only"
    reviewed: true
  median_m2_macrophage_fraction:
    role: context
    reason: "median M2-macrophage fraction; compartment magnitude behind cd8_m2_ratio; reach=name_only"
    reviewed: true
  median_m1_macrophage_fraction:
    role: context
    reason: "median M1-macrophage fraction; TME-composition magnitude for the leukocyte-composition figure; reach=name_only"
    reviewed: true
  antigen_conditioned_call:
    role: context
    reason: "target-DEPENDENT effector-escape call -- are the antigen-HIGH patients T-cell-poorer; v1.6.1 VERDICT-INERT display that qualifies the cohort-median hot call with antigen conditioning; reach=exact"
    reviewed: true
  antigen_high_immune_context_class:
    role: context
    reason: "immune-context class among the antigen-high patients; antigen-conditioned qualifier of the pooled class; verdict-inert (v1.6.1); reach=exact"
    reviewed: true
  cd8_high_minus_low:
    role: context
    reason: "CD8-share difference antigen-high minus antigen-low; effector-escape magnitude (negative => antigen-high patients poorer); the weaker of the two antigen-conditioning instruments (v1.10.0); reach=exact"
    reviewed: true
  cd8_fraction_antigen_high:
    role: context
    reason: "CD8 share in the antigen-high arm; raw arm behind cd8_high_minus_low; reach=orphan"
    reviewed: true
  cd8_fraction_antigen_low:
    role: context
    reason: "CD8 share in the antigen-low arm; raw arm behind cd8_high_minus_low; reach=orphan"
    reviewed: true
  n_patients_joined:
    role: context
    reason: "patients retained by the antigen-immune join; power qualifier for the antigen-conditioned read (data_unavailable when the join is thin); reach=exact"
    reviewed: true
  join_fraction:
    role: context
    reason: "fraction of the cohort retained by the antigen-conditioned join; join-quality / power qualifier; reach=orphan"
    reviewed: true

tcga-til-fraction-saltz:
  til_fraction_class:
    role: signal
    reason: "absolute H&E-DL TIL corroborator (Saltz 2018); the confidence RULER reads it -- til_cibersort_agreement CONTRADICTS/CORROBORATES the relative CIBERSORT CD8 call and raises a first-class `conflict` that caps confidence (run.py _immune_corr, v1.8.0); reach=exact"
    reviewed: true
  median_til_percentage:
    role: context
    reason: "median TIL percentage; continuous magnitude behind til_fraction_class; reach=exact"
    reviewed: true
  n_samples:
    role: context
    reason: "Saltz cohort sample count; power qualifier surfaced as til_n_samples; reach=exact"
    reviewed: true
  median_number_of_clusters:
    role: context
    reason: "coarse spatial-aggregation hint (clustered-vs-dispersed TIL) -- a first spatial proxy the bulk CD8 fraction lacks; qualifier surfaced in immune_provenance (v1.6.1); reach=exact"
    reviewed: true
  method_version:
    role: provenance
    reason: "Saltz method/pipeline version; audit / method token; reach=name_only"
    reviewed: true
  tcga_studies:
    role: provenance
    reason: "TCGA study codes for the Saltz cohort; identity token; reach=name_only"
    reviewed: true
  til_context:
    role: provenance
    reason: "audit / context token surfaced beside the TIL read; never a signal; reach=orphan"
    reviewed: true

