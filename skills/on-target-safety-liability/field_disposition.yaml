# MOSTLY HAND-REVIEWED. Every row carries `reviewed: true`: a human read the field's producers and
# consumers (this skill's run.py + the fleet census, blind to this ledger) and chose the role. Roles for
# cards SHARED with a landed sibling ledger were reused for fleet consistency (see per-row reason);
# the four cards with no sibling ledger (normal-tissue-liability-gtex, shet-lof-intolerance,
# drug-warning-safety, onsides-adverse-event-safety) were judged fresh. Completeness (every emitted
# summary_field present) and reader-reach for `role: signal` are CI-enforced (see
# skills/tests/test_field_disposition_ledgers.py).
_meta:
  description: "Field-disposition ledger for on-target-safety-liability \u2014 every emitted summary_field carries an explicit role so nothing is dropped SILENTLY. Enforced by skills/tests/test_field_disposition_ledgers.py."
  roles:
    signal: feeds a claim / verdict (must be wired or explicitly waived)
    context: qualifies a signal (power, certainty, statistical qualifier, cross-axis pointer)
    provenance: "audit / identity / method token \u2014 surfaced, never a signal"
    display: human-facing detail or large container; verdict-inert by design
  generated_from: target-contracts/cards/<card>.card.yaml outputs.summary_fields
  reviewed: "true == a human read the field's producers and consumers and chose this role. Absent == auto-drafted from the field NAME; treat as a draft, not a decision."
  waived_because: "only legal on `role: signal`. Records WHY a signal no declared reader reaches is being left unwired. A waiver must name the missing consumer or the owning repo; it is not a way to silence the guard."
