# dependency-predictability is SHARED with skills/genomic-alteration-profile — roles reuse that
# reviewed ledger's assignments via the sibling test (predictability_class + pred_dominant_feature_class
# = signal there; the r-squared/CI scalars = context; feature-attribution containers = display; cell-line
# count = provenance). In this skill predictability_class is additionally rule-fed (5 Tier-2 predicates
# in intracellular-intrinsic.rules.yaml) and pred_dominant_feature_class is read by run.py (line ~200).
dependency-predictability:
  predictability_class:
    role: signal
    reason: "DESCRIPTIVE categorical driving 5 Tier-2 rule predicates
      (interpretation-rules/intracellular-intrinsic.rules.yaml); sibling-test role:signal in
      genomic-alteration-profile. Exact reader via run.py get_card_field + capsule/salience/skill_code
      (census 2026-09-27, blind to ledger)"
    reviewed: true
  pred_dominant_feature_class:
    role: signal
    reason: "feature-class of the top-1 predictive feature; sibling-test role:signal in
      genomic-alteration-profile. Read by run.py into the headline (get_card_field), exact reader
      confirmed (census 2026-09-27)"
    reviewed: true
  pearson_r_rf:
    role: context
    reason: "Pearson r of OOF preds vs truth (RF); comparator/quality qualifier behind
      predictability_class. Sibling-test role:context (genomic-alteration-profile). No exact reader
      (census 2026-09-27)"
    reviewed: true
  pearson_r_squared_rf:
    role: context
    reason: "r_rf squared (primary DepMap-parity scalar); magnitude qualifier behind predictability_class.
      Sibling-test role:context. Exact reader via run.py (census 2026-09-27); verdict-inert qualifier"
    reviewed: true
  pearson_r_squared_rf_ci_lo:
    role: context
    reason: "bootstrap 95% CI lower bound; statistical qualifier. Sibling-test role:context
      (genomic-alteration-profile). No exact reader (census 2026-09-27)"
    reviewed: true
  pearson_r_squared_rf_ci_hi:
    role: context
    reason: "bootstrap 95% CI upper bound; statistical qualifier. Sibling-test role:context
      (genomic-alteration-profile). No exact reader (census 2026-09-27)"
    reviewed: true
  pred_top_features_rf:
    role: display
    reason: "top-10 features by mean(|SHAP|) (struct list); large feature-attribution container,
      human-facing and verdict-inert. Sibling-test role:display. Read by run.py (exact, census
      2026-09-27) but a detail block, not a signal"
    reviewed: true
  pred_dominant_feature:
    role: display
    reason: "top-1 feature name; human-facing named-entity detail, verdict-inert. Sibling-test
      role:display (genomic-alteration-profile). No exact reader (census 2026-09-27)"
    reviewed: true
  per_lineage_predictability:
    role: display
    reason: "RF-only per-lineage r-squared + top-feature table; large per-lineage container, verdict-inert.
      Sibling-test role:display. No exact reader (census 2026-09-27)"
    reviewed: true
  pred_n_cell_lines_evaluated:
    role: provenance
    reason: "n cells with complete-case features; provenance/scope token for the predictability model.
      Sibling-test role:provenance (genomic-alteration-profile). No exact reader (census 2026-09-27)"
    reviewed: true
