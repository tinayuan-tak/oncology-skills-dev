      ledger)"
    reviewed: true
  n_phosphosites:
    role: context
    reason: "count of the target's phosphosites in the CPTAC panel; power qualifier behind
      phospho_activity_class, surfaced in the headline (exact reader, census 2026-09-27)"
    reviewed: true
  n_phosphosites_frequent:
    role: context
    reason: "sites detected in >= active-fraction of tumors; power/coverage qualifier behind the phospho
      call. No exact reader (census 2026-09-27); verdict-inert qualifier"
    reviewed: true
  max_site_detection_fraction:
    role: context
    reason: "detection fraction of the most-detected site; magnitude/certainty qualifier behind
      phospho_activity_class, surfaced in the headline (exact reader, census 2026-09-27)"
    reviewed: true
  phospho_exceeds_abundance:
    role: context
    reason: "bool — phosphorylated beyond total protein (the pathway-active residual-direction call
      behind phospho_activity_class). The categorical class carries the verdict; this underlying bool
      qualifies it. No exact reader (census 2026-09-27)"
    reviewed: true
  top_site_phospho_minus_protein:
    role: context
    reason: "top site's mean phospho-minus-protein log-ratio residual; magnitude behind the phospho call.
      No exact reader (census 2026-09-27); verdict-inert qualifier"
    reviewed: true
  n_phospho_protein_paired:
    role: context
    reason: "paired tumors backing the top site's phospho-vs-protein residual; statistical-power
      qualifier. No exact reader (census 2026-09-27)"
    reviewed: true
  total_protein_detected_in_cohort:
    role: context
    reason: "bool (null = probe unavailable) — whether the target's total protein is detected in this
      cohort's MS; a data-availability qualifier that conditions the phospho residual. No exact reader
      (census 2026-09-27)"
    reviewed: true
  n_cohorts_with_phosphosites:
    role: context
    reason: "how many of the 10 CPTAC cohorts carry >=1 phosphosite for the target; coverage qualifier.
      No exact reader (census 2026-09-27)"
    reviewed: true
  phosphoprotein_detected_in_other_cohorts:
    role: context
    reason: "bool — the target IS a phosphoprotein elsewhere in CPTAC, so this cohort's zero is a
      detection gap; disambiguates the data_unavailable call (qualifier). No exact reader (census
      2026-09-27)"
    reviewed: true
  phospho_axis_uninformative_reason:
    role: context
    reason: "string — why data_unavailable when it is not a missing cohort (e.g.
      total_protein_not_detected_in_cohort); names the reason behind the class call. No exact reader
      (census 2026-09-27); verdict-inert qualifier"
    reviewed: true
  n_tumors:
    role: context
    reason: "cohort tumor count; statistical-power qualifier for the phospho readout. No exact reader
      (census 2026-09-27)"
    reviewed: true
  top_phosphosites:
    role: display
    reason: "top sites by detection (record list); human-facing per-site detail container, verdict-inert.
      No exact reader (census 2026-09-27)"
    reviewed: true
  cptac_cohort:
    role: provenance
    reason: "string — the CPTAC cohort the phospho readout was drawn from; identity/scope key. No exact
      reader (census 2026-09-27)"
    reviewed: true
  substrate:
    role: provenance
    reason: "string — the target/substrate identity the phospho panel is keyed on; identity key, never a
      signal. No exact reader (census 2026-09-27)"
    reviewed: true

pathway-activity-context:
  pathway_activity_class:
    role: context
    reason: "PRIMARY categorical (relatively_high | profiled | data_unavailable) of the PROGENy
      pathway-activity facet. NO rule predicate reads it — SKILL.md/composition: pathway-activity-context
      is DISPLAY-ONLY, feeds NO resolver, mechanism_verdict byte-stable. A mechanism-CONTEXT call
      (indication-level pathway activity), NOT a gated signal. Exact reader via run.py (census
      2026-09-27)"
    reviewed: true
  relatively_high_pathways:
    role: display
    reason: "pathways at cross-indication z >= +1 (named-pathway list); human-facing detail behind the
      pathway_activity facet, verdict-inert. No exact reader (census 2026-09-27)"
    reviewed: true
  relatively_low_pathways:
    role: display
    reason: "pathways at z <= -1 (named-pathway list); human-facing detail, verdict-inert. No exact
      reader (census 2026-09-27)"
    reviewed: true
  n_pathways_profiled:
    role: context
    reason: "pathways with data for this indication (<=14); coverage/power qualifier behind
      pathway_activity_class. Census reaches it name_only (not exact), so not credited as a signal
