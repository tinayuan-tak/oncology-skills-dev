# FULLY REVIEWED. Every row carries `reviewed: true` — a human read the field's producers
# (scripts/run.py + SKILL.md) and consumers (the census, blind to this ledger; target-contracts
# interpretation-rules; the narrator/capsule) and chose the role. Completeness (that this ledger
# covers exactly the cards run.py reads) plus reach-for-signal are CI-enforced by
# skills/tests/test_field_disposition_ledgers.py; role CORRECTNESS is the human judgement recorded here.
#
# VERDICT ARCHITECTURE (why so few signals): the mechanism_verdict spine keys ONLY on network_class
# (scripts/run.py resolver note; replay guard test_mechanism_replay.py). The per-modality
# small_molecule/degrader claim signals are emitted by interpretation-rules/intracellular-intrinsic.rules.yaml
# off network_class + has_pd_marker (has-pd-marker-supportive rule). Tier-2 rules key on
# phospho_activity_class + predictability_class. tahoe-drug-perturbation and pathway-activity-context are
# DISPLAY-ONLY facets (SKILL.md: feed NO resolver; mechanism_verdict byte-stable) — their primary
# categorical is a mechanism-CONTEXT call, NOT a gated signal. has_actionable_moa feeds ONLY the
# verdict-inert actionable-MoA-inflation caveat (no rule predicate reads it), so it is context, not signal.
_meta:
  description: "Field-disposition ledger for mechanism-and-pharmacology — every emitted summary_field
    carries an explicit role so nothing is dropped SILENTLY. Enforced by
    skills/tests/test_field_disposition_ledgers.py (fleet wellformedness + reach ratchet)."
  roles:
    signal: feeds a claim / verdict (must be wired or explicitly waived)
    context: qualifies a signal (power, certainty, statistical qualifier, cross-axis pointer)
    provenance: "audit / identity / method token — surfaced, never a signal"
    display: human-facing detail or large container; verdict-inert by design
  generated_from: target-contracts/cards/<card>.card.yaml outputs.summary_fields
  reviewed: "true == a human read the field's producers and consumers and chose this role. Every row in
    this ledger is reviewed: true (authored deliberately, not auto-drafted from field names)."
  waived_because: "only legal on `role: signal`. Records WHY a signal no declared reader reaches is
    left unwired, naming the missing consumer or owning repo. No waivers are present: all 5 signal rows
    are reader-reached (exact census hit, 2026-09-27)."

signaling-network-mechanism:
  network_class:
    role: signal
    reason: "PRIMARY categorical the mechanism_verdict spine keys on; the ONLY verdict-bearing field of
      this card. Drives 4 per-modality rules (small_molecule/degrader) in
      interpretation-rules/intracellular-intrinsic.rules.yaml. role:signal reach-confirmed exact via
      run.py get_card_field + capsule/salience (census 2026-09-27, blind to ledger)"
    reviewed: true
  has_pd_marker:
    role: signal
    reason: "bool — >=1 downstream effector; feeds the has-pd-marker-supportive rule
      (interpretation-rules/intracellular-intrinsic.rules.yaml) emitting small_molecule/degrader:supportive.
      The mechanism_verdict-spine rung was retired 2026-09-07 (keys only on network_class) but the
      per-modality claim signal is LIVE, so this is verdict/claim-bearing. Exact reader confirmed
      (run.py headline get_card_field, census 2026-09-27)"
    reviewed: true
  has_actionable_moa:
    role: context
    reason: "bool — >=1 upstream partner with actionable modality relevance. NO rule predicate reads it
      (mechanism resolver keys only on network_class); feeds ONLY the verdict-INERT
      actionable-MoA-inflation caveat (run.py _actionable_moa_inflation_note) that flags when a True
      call may be over-stated. Qualifies the network_class signal, does not bear a verdict"
    reviewed: true
  moa_classes_present:
    role: context
    reason: "list<string> — unique MoA classes hit by upstream partners; read by run.py into the
      headline/opportunities table and the inflation caveat, not by any rule. Names the MoA classes
      behind has_actionable_moa (qualifier), verdict-inert (exact reader, census 2026-09-27)"
    reviewed: true
  pd_marker_classes_present:
    role: context
    reason: "list<string> — unique MoA classes hit by downstream partners; parallel to
      moa_classes_present. Read into the headline (exact, census 2026-09-27), not a rule; qualifies the
      has_pd_marker signal, verdict-inert"
    reviewed: true
  n_upstream_regulators:
    role: context
    reason: "count of distinct upstream partners; magnitude/power behind network_class, surfaced in the
      headline (exact reader, census 2026-09-27). Not a rule predicate — verdict-inert qualifier"
    reviewed: true
  n_downstream_effectors:
    role: context
    reason: "count of distinct downstream partners; magnitude/power behind has_pd_marker, surfaced in
      the headline (exact reader, census 2026-09-27). Not a rule predicate — verdict-inert qualifier"
    reviewed: true
  high_confidence_edges_count:
    role: context
    reason: "int — curated edges supported by >=2 sources (the quorum measure); read by run.py into the
      mechanism_provenance quorum summary (exact, census 2026-09-27). Card comment: None feeds a
      resolver rung — verdict byte-stable. Qualifies the CONFIDENCE of network_class"
    reviewed: true
  kinome_atlas_predictions:
    role: context
    reason: "struct — the kinome-atlas PWM PREDICTION lane, carried ALONGSIDE and NEVER merged into
      network_class/has_actionable_moa. Read by run.py into the verdict-INERT prediction_lane_caveat
      (materiality gate compares lane vs curated-network size). Qualifies network_class, exact reader
      (census 2026-09-27)"
    reviewed: true
  coessentiality_context:
    role: context
    reason: "struct — the DepMap co-essentiality FUNCTIONAL lane (correlational, not a curated edge),
      carried alongside network_class. Read into the verdict-INERT prediction_lane_caveat (run.py).
      Qualifies network_class, exact reader (census 2026-09-27)"
    reviewed: true
  moa_ontology_version:
    role: provenance
    reason: "string — MoA ontology pin for reproducibility; stamped into provenance.yaml (SKILL.md
      provenance discipline). Method/version token, never a signal (exact reader, census 2026-09-27)"
    reviewed: true
  moa_ontology_unmapped_fraction:
    role: provenance
    reason: "float — fraction of curated edges that fell to 'unmapped' class; a data-quality/audit
      metric stamped into provenance.yaml and CI-enforced (<5% target, SKILL.md). No exact reader
      (census 2026-09-27); surfaced as a reproducibility QC token"
    reviewed: true
  source_counts:
    role: provenance
    reason: "map<source,int> — per-source curated + prediction/functional edge counts
      (signor/collectri/reactome/kinome_atlas/coessentiality); the network-composition audit. Read into
      mechanism_provenance (run.py, exact, census 2026-09-27). Audit token, not a signal"
    reviewed: true
  sources_wired:
    role: provenance
    reason: "list<string> — which sources contributed edges for this target; composition-audit token
      read into mechanism_provenance (run.py, exact, census 2026-09-27). Never a signal"
    reviewed: true
  upstream_regulators:
    role: display
    reason: "list<struct: partner_uniprot_ac, gene_symbol, raw_mechanism, moa_class, modality_relevance>
      — the source rows for the moa_opportunities.csv table; a large per-partner container, human-facing
      and verdict-inert. No exact reader by field name (census 2026-09-27; consumed structurally into
      the table)"
    reviewed: true
  downstream_effectors:
    role: display
    reason: "list<struct: partner_uniprot_ac, gene_symbol, raw_mechanism, moa_class, pd_marker_relevance>
      — source rows for pd_marker_opportunities.csv; large per-partner container, verdict-inert. No
      exact reader by field name (census 2026-09-27)"
    reviewed: true

phospho-pathway-activity:
  phospho_activity_class:
    role: signal
    reason: "PRIMARY categorical; drives 5 Tier-2 rule predicates in
      interpretation-rules/intracellular-intrinsic.rules.yaml. Verdict/claim-bearing. role:signal
