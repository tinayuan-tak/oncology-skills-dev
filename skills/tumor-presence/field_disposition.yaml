# MOSTLY AUTO-DRAFTED. A row is a HUMAN JUDGEMENT only when it carries `reviewed: true`;
# every other role came from a name-shape heuristic over the card's summary_fields list and
# should be read as a DRAFT. Completeness (not tag-correctness) is CI-enforced; reader-reach
# for `role: signal` is enforced too (see _meta.reviewed / _meta.waived_because).
_meta:
  description: "Field-disposition ledger for tumor-presence \u2014 every emitted summary_field carries\
    \ an explicit role so nothing is dropped SILENTLY. Enforced by tests/test_field_disposition_complete.py."
  roles:
    signal: feeds a claim / verdict (must be wired or explicitly waived)
    context: qualifies a signal (power, certainty, statistical qualifier, cross-axis pointer)
    provenance: "audit / identity / method token \u2014 surfaced, never a signal"
    display: human-facing detail or large container; verdict-inert by design
  generated_from: target-contracts/cards/<card>.card.yaml outputs.summary_fields
  # \u2500\u2500 provenance of the ROLE itself (added 2026-09-13, Stage 1b step 4) \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500
  # The roles were auto-drafted from FIELD NAMES, and the draft is demonstrably not a judgement:
  # on tumor-elevation-breadth the same quantity on the two arms landed in opposite buckets
  # (fraction_elevated -> signal, rna_fraction_elevated -> display; median_effect_across_elevated
  # -> display, rna_median_max_log2fc_across_elevated -> signal), because the `rna_` prefix missed
  # the pattern. Worse, the heuristic's FALLBACK was unconditionally `display` -- every one of the
  # 36 "unclassified by heuristic - REVIEW" rows is role:display, i.e. parked in the bucket that
  # claims "verdict-inert BY DESIGN" without anyone having decided that. So an unreviewed row is
  # NOT evidence about the field, and this ledger must not be quoted as a labelled set.
  reviewed: "true == a human read the field's producers and consumers and chose this role. Absent ==
    auto-drafted from the field NAME; treat as a draft, not a decision."
  waived_because: "only legal on `role: signal`. Records WHY a signal no declared reader reaches is
    being left unwired -- the review queue _meta.roles already promised (`must be wired or explicitly
    waived`) but never had a key for. A waiver must name the missing consumer or the owning repo; it
    is not a way to silence the guard."
  interpretation_reach: "SECOND AXIS (added 2026-09-27, SK#1525 -- the two-axis field-disposition
    contract, _skills_common/field_disposition_contract.py). Orthogonal to `role`: role says WHAT the
    field is (signal/context/provenance/display), interpretation_reach says HOW FAR its interpretation
    travels -- `unreached` (no declared reader: a candidate orphan, a review queue, never a delete
    list), `skills_local` (read by a rule/capsule/salience/code/figure inside this repo), or
    `cross_repo_resolver` (read by the analysis-methods property resolver, e.g. the cellline-rna
    _heterogeneity inputs). A cross-repo resolver INPUT is role:context AND reach:cross_repo_resolver --
    it is consumed (not an orphan) yet the signal attaches to the RESOLVED property in analysis-methods,
    not to this raw measurement, so reach does not promote role. Values are MACHINE-DERIVED from the
    field_disposition census (blind to this ledger)."
  review_pass_1525: "SK#1525 reviewed EVERY previously-unreviewed auto-draft row via the reach census +
    the 4-case migration audit (legacy_role x is-it-an-L2-input). 13 display rows with an exact INPUT
    reader were reclassified display->context (the auto-draft fallback was display, never a judgement);
    display rows whose only reach is a figure/name-only render, and the query-echo/projection subtype
    fields whose prior reasons already argue display-by-design, were CONFIRMED display. All rows now
    carry reviewed:true and interpretation_reach. Verdict-inert: no promoted field is role-tagged in an
    emitted anchor/claim atom, so the replay golden is byte-stable."
