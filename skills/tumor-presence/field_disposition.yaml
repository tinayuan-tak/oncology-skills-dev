# AUTO-DRAFTED then reviewed; edit roles by hand as needed. Completeness (not tag-
# correctness) is CI-enforced. See _meta.roles.
_meta:
  description: "Field-disposition ledger for tumor-presence \u2014 every emitted summary_field carries\
    \ an explicit role so nothing is dropped SILENTLY. Enforced by tests/test_field_disposition_complete.py."
  roles:
    signal: feeds a claim / verdict (must be wired or explicitly waived)
    context: qualifies a signal (power, certainty, statistical qualifier, cross-axis pointer)
    provenance: "audit / identity / method token \u2014 surfaced, never a signal"
    display: human-facing detail or large container; verdict-inert by design
  generated_from: target-contracts/cards/<card>.card.yaml outputs.summary_fields
