    role: context
    reason: "marginal expressed rate qualifying the READ rna_protein_r / rna_as_biomarker (question-table Q6)"
    reviewed: true
  rna_high_protein_low_fraction:
    role: signal
    reason:
      RNA-high / protein-low discordant-quadrant fraction, cell-line arm only; SELF-NORMALIZED, null pinned at 0.10 by
      construction; WAIVED, see waived_because
    reviewed: true
    waived_because: "ORTHOGONAL TO THE CLASS BUT UNUSABLE AS A RATE. Both questions the previous waiver could not answer
      are now measured against analysis-methods and the n=504 corpus (375 cell-line cards). (1) The producer does NOT
      fold it into rna_as_biomarker: _classify_rna_biomarker takes (correlation, n) only, and rna_proxy_classified_on is
      'spearman' in 375/375. (2) It is genuinely NOT derivable from the correlation - at one fixed class, partial_proxy,
      it spans the full range (AR 0.0000 vs CCNE1-CML 0.1042). So the field does carry independent information. WHAT
      KILLS IT AS A CONSUMER IS THE FRAME: eligibility is 'protein <= the 10th percentile OF THE SAME protein vector',
      so 0.10 is the NO-INFORMATION value by construction - measured median is exactly 0.1000, 228 of 374 non-null
      values sit within +/-0.005 of it, and the whole range is 0.0000-0.1333 (values above 0.10 come from ties at the
      decile cut, not from headroom). A raw '13% discordant' therefore reads as alarming when 10% is what independence
      alone gives, and the statistic has almost no room to RISE, so it cannot falsify a positive proxy call at all - the
      opposite of what this waiver previously assumed. The owner decision is now SCOPED, not open: cite it only as a
      one-sided DOWNWARD departure from the 0.10 construction null (i.e. as concordance evidence, as at AR 0.0000),
      labelled with that null, and never as a bare rate. Q6 deliberately does not cite it in this PR."
  rna_protein_r:
    role: context
    reason: "RNA-protein correlation coefficient; statistical qualifier behind rna_as_biomarker; reached via {question_table, salience, skill_code} (census 2026-09-19)"
    reviewed: true
