# RAW card-reader summaries (dispatcher outputs) for the cis-coherence replay harness — NOT derived
# headline values. The claim_vector + cis_coherence_verdict are RE-DERIVED from these raw fields by the
# real run.py in the test (a fixture of derived values can never fail). See test_cis_coherence_replay.py.
#
# ERBB2 / BRCA — the canonical amplification-driven oncogene addiction (17q12). Leg-1 coupled via the
# AMPLIFIED arm, leg-2 dependency present (both the correlation leg AND the conjoint amp∩overexpr leg) →
# a coherent cis-driver chain. ERBB2 is a validated cis-driver, the ground truth the passenger trap is
# calibrated against.
