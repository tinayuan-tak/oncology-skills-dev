# NRAS / SKCM — every coherence leg is untestable/unmeasured: no CN variation to test cis-dosage
# (cn_invariant_panel → no leg-1 token), no methylation subset (methylation_invariant_panel), and the
# dependency correlation leg fires only its absent-neutral token which matches no rung on its own. No
# rung matches → the honest-abstention default insufficient_cis_coherence (driving_rule_id null).
