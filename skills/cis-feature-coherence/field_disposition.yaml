    reason: significance of the secondary (non-robust) Pearson estimator; qualifier, not the primary metric
    reviewed: true
  cn_expr_pearson_r:
    role: context
    reason: secondary Pearson estimator alongside the primary Spearman correlation; corroborating, not the reached primary
    reviewed: true
  cn_expr_slope_log2tpm_per_cn:
    role: provenance
    reason: OLS slope log2TPM per unit relative CN; audit magnitude (card annotates provenance), surfaced not gated
    reviewed: true
