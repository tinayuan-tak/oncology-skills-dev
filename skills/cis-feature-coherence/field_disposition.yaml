# FULLY REVIEWED. Every row carries `reviewed: true` — a human read the field's producers and
# consumers and chose the role. Completeness (every emitted summary_field present) and reader-reach
# for `role: signal` are CI-enforced (skills/tests/test_field_disposition_ledgers.py). Reach was
# measured BLIND to this ledger via the census; every `role: signal` row below is exact-reached, so
# none required a `waived_because`.
_meta:
  description: "Field-disposition ledger for cis-feature-coherence — every emitted summary_field\
    \ carries an explicit role so nothing is dropped SILENTLY. Enforced by\
    \ skills/tests/test_field_disposition_ledgers.py (fleet reach + wellformedness)."
  roles:
    signal: feeds a claim / verdict (must be wired or explicitly waived)
    context: qualifies a signal (power, certainty, statistical qualifier, cross-axis pointer)
    provenance: "audit / identity / method token — surfaced, never a signal"
    display: human-facing detail or large container; verdict-inert by design
  generated_from: target-contracts/cards/<card>.card.yaml outputs.summary_fields
  # -- provenance of the ROLE itself --------------------------------------------
  # Roles were assigned NORMATIVELY: the categorical *_class calls that the cis_coherence resolver /
  # interpretation-rules read (cis_dosage_class, methylation_silencing_class, correlation_class,
  # amp_expr_stratification_class) plus the reach-confirmed decisive effect magnitudes (primary
  # correlation r, class-driver / lineage-controlled deltas) are `signal`; significance qualifiers
  # (p/q), sample sizes/denominators, medians, IQRs, thresholds, evidence_scope, guard ratios and
  # secondary estimators are `context`; slopes / abundance_layer / *_driver-of-method / release_pin /
  # isoform identity are `provenance`; large list containers are `display`. Reach was measured by the
  # census, blind to this file. `amp-expr-stratified-dependency` is SHARED with genomic-alteration-
  # profile; its roles are reused from that reviewed ledger (sibling test).
  reviewed: "true == a human read the field's producers and consumers and chose this role. Absent ==
    auto-drafted from the field NAME; treat as a draft, not a decision."
  waived_because: "only legal on `role: signal`. Records WHY a signal no declared reader reaches is
    being left unwired. A waiver must name the missing consumer or the owning repo; it is not a way to
    silence the guard."

cis-feature-expression-coherence:
