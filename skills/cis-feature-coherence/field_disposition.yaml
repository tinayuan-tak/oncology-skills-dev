    role: context
    reason: significance qualifier behind the pan-panel cis-dosage correlation
    reviewed: true
  cn_expr_spearman_r:
    role: signal
    reason: primary robust CN-vs-log2TPM cis-dosage correlation; the decisive continuous magnitude behind cis_dosage_class; reach-confirmed exact (census 2026-09-27, blind to ledger)
