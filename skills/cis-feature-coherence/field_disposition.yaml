    role: context
    reason: one-sided Mann-Whitney significance qualifier on the deletion-arm contrast
    reviewed: true
  deleted_within_lineage_delta_log2tpm:
    role: signal
    reason: within-lineage counterpart of the deletion-arm delta (same lineage control as the amplified arm); the confound-controlled deletion driver; reach-confirmed exact (census 2026-09-27, blind to ledger)
    reviewed: true
  deletion_threshold_relative_cn:
    role: provenance
    reason: DELETION relative-CN cutoff used; audit token
    reviewed: true
  delta_log2tpm_amplified_vs_neutral:
    role: context
    reason: mean-based amplified-vs-neutral contrast; card marks it an interpretability aid, NOT the class driver (the subset/within-lineage deltas are)
    reviewed: true
  evidence_scope:
    role: context
    reason: indication-conditioning scope (within_indication through pan_no_indication); qualifies where the cis call was measured
    reviewed: true
  log2tpm_iqr:
    role: context
    reason: expression dispersion; distribution qualifier behind the correlation reliability
    reviewed: true
  mean_log2tpm_amplified:
    role: context
    reason: mean expression in amplified cells; component of the interpretability contrast
    reviewed: true
  mean_log2tpm_neutral:
    role: context
    reason: mean expression in neutral cells; component of the interpretability contrast
    reviewed: true
  median_log2tpm:
    role: context
    reason: panel median expression; distribution qualifier
    reviewed: true
  median_relative_cn:
    role: context
    reason: panel median relative CN; distribution qualifier
    reviewed: true
  n_amplified:
    role: context
    reason: count of amplified cells (relative CN > threshold); power/sample-size qualifier for the amplified arm
    reviewed: true
  n_cell_lines_evaluated:
    role: context
    reason: cells with both relative CN and expression coverage; power/sample-size qualifier
    reviewed: true
  n_deleted:
    role: context
    reason: count of deleted cells (relative CN < threshold); power/sample-size qualifier for the deletion arm
    reviewed: true
  relative_cn_iqr:
    role: provenance
    reason: middle-50% CN spread; card marks provenance ONLY (blind to the amplified tail, explicitly NOT the gate)
