[workspace]
name = "workflow-target-evaluation-onc"
version = "1.0.0"
description = "4-step therapeutic target evaluation workflow for oncology"
channels = ["conda-forge"]
platforms = ["osx-arm64", "osx-64", "linux-64"]

[dependencies]
python = ">=3.12"
pandas = ">=2.0"
numpy = ">=1.24"
matplotlib = ">=3.7"
seaborn = ">=0.12"
scipy = ">=1.11"
statsmodels = ">=0.14"
pyyaml = ">=6.0"
jinja2 = ">=3.1"
pytest = ">=7.0"

# v1.4.0: PubMed → facts.yaml extractor uses Anthropic Bedrock client
# (sync). Auth + region + model defaults inherited from the harness env
# (~/.claude/settings.json sets AWS_PROFILE, AWS_REGION, ANTHROPIC_*).
[pypi-dependencies]
anthropic = { version = ">=0.40", extras = ["bedrock"] }

[tasks]
pdf = "python generate_target_report_pdf.py"
test = "pytest tests/ -v"
