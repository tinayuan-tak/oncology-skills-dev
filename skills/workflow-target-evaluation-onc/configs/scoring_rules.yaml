# Deterministic Scoring Rules for Target Evaluation
# Version: 1.0.0
# NO LLM interpretation - pure rule-based scoring

version: "1.0.0"
description: "Rule-based scoring for consistent target evaluation"

# =============================================================================
# LITERATURE EVIDENCE SCORING
# =============================================================================
literature_scoring:
  biological_validation:
    evidence_weights:
      crispr_knockout: 3
      rnai_knockdown: 2
      animal_model_efficacy: 3
      human_genetic_association: 3
      overexpression_study: 1
      functional_study_other: 1

    # Risk level thresholds (based on total weight)
    risk_thresholds:
      LOW:
        min_weight: 6
        description: "Strong functional validation"
      MEDIUM:
        min_weight: 3
        max_weight: 5
        description: "Moderate validation evidence"
      HIGH:
        max_weight: 2
        description: "Limited or no functional validation"

    # Score conversion (1-5 scale)
    score_mapping:
      - {min_weight: 9, score: 5}
      - {min_weight: 6, score: 4}
      - {min_weight: 4, score: 3}
      - {min_weight: 2, score: 2}
      - {min_weight: 0, score: 1}

  clinical_validation:
    evidence_weights:
      phase_4_approved: 5
      phase_3_completed: 4
      phase_2_completed: 3
      phase_1_completed: 2
      phase_1_terminated: 1
      preclinical_only: 0

    risk_thresholds:
      LOW:
        min_phase: 3
        description: "Phase 2+ clinical data available"
      MEDIUM:
        min_phase: 1
        max_phase: 2
        description: "Early clinical data available"
      HIGH:
        max_phase: 0
        description: "No clinical validation"

    score_mapping:
      - {min_phase: 4, score: 5}
      - {min_phase: 3, score: 4}
      - {min_phase: 2, score: 3}
      - {min_phase: 1, score: 2}
      - {min_phase: 0, score: 1}

  druggability:
    evidence_weights:
      approved_drug_exists: 5
      clinical_compound_exists: 4
      tool_compound_ic50_lt_100nm: 3
      tool_compound_ic50_lt_1um: 2
      binding_pocket_identified: 2
      structure_available: 1
      no_compounds: 0

    risk_thresholds:
      LOW:
        min_weight: 4
        description: "Validated druggability"
      MEDIUM:
        min_weight: 2
        max_weight: 3
        description: "Druggability evidence available"
      HIGH:
        max_weight: 1
        description: "Limited druggability evidence"

    score_mapping:
      - {min_weight: 5, score: 5}
      - {min_weight: 4, score: 4}
      - {min_weight: 2, score: 3}
      - {min_weight: 1, score: 2}
      - {min_weight: 0, score: 1}

  safety_literature:
    evidence_weights:
      clinical_safety_good: 3
      knockout_viable_healthy: 2
      knockout_viable_phenotype: 1
      knockout_lethal: -2
      known_toxicity_severe: -3
      known_toxicity_manageable: -1

    risk_thresholds:
      LOW:
        min_weight: 2
        description: "Favorable safety profile"
      MEDIUM:
        min_weight: 0
        max_weight: 1
        description: "Moderate safety concerns"
      HIGH:
        max_weight: -1
        description: "Significant safety concerns"

# =============================================================================
# OMICS SCORING (from bulk RNA analysis)
# =============================================================================
omics_scoring:
  differential_expression:
    # Based on tumor vs adjacent normal fold change
    thresholds:
      - {min_fc: 4.0, score: 5, risk: "LOW", description: ">4x tumor enrichment"}
      - {min_fc: 2.0, score: 4, risk: "LOW", description: "2-4x tumor enrichment"}
      - {min_fc: 1.5, score: 3, risk: "MEDIUM", description: "1.5-2x tumor enrichment"}
      - {min_fc: 1.0, score: 2, risk: "HIGH", description: "1-1.5x tumor enrichment"}
      - {min_fc: 0.0, score: 1, risk: "HIGH", description: "No tumor enrichment"}

    # On-target toxicity risk criteria
    toxicity_risk:
      LOW:
        min_fc: 2.0
        description: ">2x tumor vs adjacent normal (good therapeutic window)"
      MEDIUM:
        min_fc: 1.5
        max_fc: 2.0
        description: "1.5-2x tumor vs adjacent normal (moderate window)"
      HIGH:
        max_fc: 1.5
        description: "<1.5x tumor vs adjacent normal (narrow window, toxicity concern)"

  safety_profile:
    # Based on normal tissue expression + tumor enrichment
    thresholds:
      - condition: "fc >= 2.0 AND normal_expr < 4.0"
        risk: "LOW"
        score: 5
        description: "High tumor enrichment + low normal expression"
      - condition: "fc >= 2.0 AND normal_expr < 5.0"
        risk: "LOW"
        score: 4
        description: "High tumor enrichment + moderate normal expression"
      - condition: "fc >= 1.5 OR normal_expr < 5.0"
        risk: "MEDIUM"
        score: 3
        description: "Moderate therapeutic window"
      - condition: "fc < 1.5 AND normal_expr >= 5.0"
        risk: "HIGH"
        score: 2
        description: "Low enrichment + high normal expression"
      - condition: "fc < 1.0"
        risk: "HIGH"
        score: 1
        description: "No tumor enrichment"

  idas_alignment:
    # iDAS whitespace alignment scoring
    thresholds:
      - {min_expr: 4.0, alignment: "Strong", score: 5}
      - {min_expr: 2.0, alignment: "Moderate", score: 3}
      - {min_expr: 0.0, alignment: "Weak", score: 1}

# =============================================================================
# PROTEIN SCORING (from HPA analysis) - FUTURE
# =============================================================================
protein_scoring:
  surface_target:
    locations_qualifying:
      - "Plasma membrane"
      - "Cell Junctions"
    is_surface: true
    not_surface_locations:
      - "Cytosol"
      - "Nucleoplasm"
      - "Mitochondria"

  gi_toxicity:  # For CRC
    thresholds:
      LOW:
        ihc_level: ["Not detected", "Low"]
        description: "Minimal GI expression"
      MEDIUM:
        ihc_level: ["Medium"]
        description: "Moderate GI expression"
      HIGH:
        ihc_level: ["High"]
        description: "High GI expression - toxicity concern"

  rna_protein_concordance:
    thresholds:
      - {min_concordance: 0.7, confidence: "HIGH", score: 5}
      - {min_concordance: 0.5, confidence: "MEDIUM", score: 3}
      - {min_concordance: 0.0, confidence: "LOW", score: 2}

# =============================================================================
# SCHOLAREVAL DIMENSION MAPPING
# =============================================================================
scholareval:
  dimensions:
    differential_expression:
      weight: 0.15
      source: "omics"
      field: "tumor_vs_adjacent_fc"
      scoring_rule: "omics_scoring.differential_expression"

    pathway_relevance:
      weight: 0.15
      source: "literature"
      field: "pathway_evidence_score"
      scoring_rule: "direct"

    druggability:
      weight: 0.15
      source: "literature"
      field: "druggability_weight"
      scoring_rule: "literature_scoring.druggability"

    genetic_validation:
      weight: 0.10
      source: "literature"
      field: "biological_validation_weight"
      scoring_rule: "literature_scoring.biological_validation"

    disease_association:
      weight: 0.10
      source: "both"
      fields: ["literature.disease_association", "omics.subgroup_suitability"]
      scoring_rule: "average"

    safety_profile:
      weight: 0.15
      source: "omics"
      field: "toxicity_risk"
      scoring_rule: "omics_scoring.safety_profile"

    clinical_validation:
      weight: 0.10
      source: "literature"
      field: "clinical_evidence_weight"
      scoring_rule: "literature_scoring.clinical_validation"

    biomarker_potential:
      weight: 0.10
      source: "both"
      fields: ["omics.detection_rate", "literature.biomarker_evidence"]
      scoring_rule: "average"

  # Assessment labels based on total score
  assessment_thresholds:
    - {min_score: 4.5, label: "Excellent", recommendation: "GO-PRIORITY"}
    - {min_score: 4.0, label: "Strong", recommendation: "GO"}
    - {min_score: 3.5, label: "Moderate", recommendation: "GO-CONDITIONAL"}
    - {min_score: 3.0, label: "Weak", recommendation: "CONDITIONAL"}
    - {min_score: 0.0, label: "Poor", recommendation: "NO-GO"}

# =============================================================================
# RECOMMENDATION RULES
# =============================================================================
recommendation_rules:
  GO_PRIORITY:
    conditions:
      - "scholareval_total >= 4.5"
      - "high_risk_count == 0"
      - "differential_expression_score >= 4"
    description: "Strong overall score with no high-risk categories"

  GO:
    conditions:
      - "scholareval_total >= 4.0"
      - "high_risk_count <= 1"
      - "safety_risk != 'HIGH'"
    description: "Good score with minimal risks"

  GO_CONDITIONAL:
    conditions:
      - "scholareval_total >= 3.5"
      - "high_risk_count <= 1"
      - "safety_risk != 'HIGH'"
    description: "Moderate score, requires specific conditions"

  CONDITIONAL:
    conditions:
      - "scholareval_total >= 3.0"
      - "high_risk_count <= 2"
    description: "Requires additional validation"

  NO_GO:
    conditions:
      - "scholareval_total < 3.0"
      - "OR safety_risk == 'HIGH' AND differential_expression_score < 3"
      - "OR high_risk_count >= 3"
    description: "Insufficient score or unacceptable risk profile"

# =============================================================================
# RISK CATEGORY AGGREGATION
# =============================================================================
risk_categories:
  biological:
    sources: ["literature.biological_validation"]
    weight: 1.0

  druggability:
    sources: ["literature.druggability"]
    weight: 1.0

  translational:
    sources: ["literature.translational", "omics.model_availability"]
    weight: 1.0

  clinical:
    sources: ["literature.clinical_validation"]
    weight: 1.0

  safety:
    sources: ["omics.safety_profile", "literature.safety", "protein.toxicity"]
    weight: 1.0
    aggregation: "worst_case"  # Take highest risk from any source

  commercial:
    sources: ["literature.commercial"]
    weight: 1.0
