# NEGATIVE-DIRECTION offline-replay fixture for the indication VETO rung (issue #1833).
#
# Unlike kras_coadread.yaml (a REAL live freeze of a positive dependency), this is a HAND-CONSTRUCTED
# minimal card-summary set: a target that is NON-dependent pan-cancer AND whose queried indication's
# DepMap lineage is screened at adequate power but sits above the dependency cut. It exists to give the
# indication veto path — `_dependency_preprocess` -> `indication_dependency_class == not_dependent_in_indication`
# -> `not-dependent-in-indication-killer` (dependency.resolver.yaml rung 10) -> `dependency_verdict ==
# not_dependent_in_indication` — the END-TO-END coverage it lacked. All other FR replay fixtures that
# carry `not_dependent_in_indication` are DIRECT-read/synthetic and never drive the preprocessor->rule
# ->resolver chain (see issue #1833 Part A).
#
# Why the killer WINS here (and why this is a real drift guard): the pooled arms are non-dependent so no
# priority 0-9 rung fires (no pan-essential, no concordant_dependent, no *_in_indication positive, no
# partner-conditional / chemical-genetic / paralog-buffering rescue). With the preprocessor the killer
# (priority 10) wins -> not_dependent_in_indication; if the preprocessor is reverted to a no-op the field
# is never written, the killer cannot fire, and the run falls THROUGH to the pooled `non-dependent-killer`
# (priority 23) -> non_dependent. The negative-direction replay test pins the veto token + driving rule,
# so that silent revert reds.
#
# COADREAD -> Bowel is a SHARED coarse lineage (depmap_oncotree_codes present), but we deliberately omit
# `per_oncotree_code_stats`, so `_sublineage_read` returns None and the read falls back to the coarse
# per_lineage_stats path (the offline-fixture path) — Bowel median above the cut -> not_dependent_in_indication.

