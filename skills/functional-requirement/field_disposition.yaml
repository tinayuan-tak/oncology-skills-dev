_meta:
  description: "Field-disposition ledger for functional-requirement — every emitted summary_field carries an explicit role so nothing is dropped SILENTLY. Enforced by skills/tests/test_field_disposition_ledgers.py (well-formedness + the reach ratchet). Authored deliberately (Track-A field-disposition campaign): every row carries reviewed: true."
  roles:
    signal: "feeds a claim / verdict (must be wired or explicitly waived)"
    context: "qualifies a signal (power, certainty, statistical qualifier, cross-axis pointer)"
    provenance: "audit / identity / method token — surfaced, never a signal"
    display: "human-facing detail or large container; verdict-inert by design"
  generated_from: "target-contracts/cards/<card>.card.yaml outputs.summary_fields"
  reviewed: "true == a human read the field's producers and consumers and chose this role. Every row in this ledger is reviewed."
  waived_because: "only legal on role: signal. Records WHY a signal no declared reader reaches is left unwired; must name the missing consumer or owning repo. No row here needs one — every signal is reader-reached."
  reach_note: "Roles assigned via the #1540 skill-audit rubric + the tumor-presence sibling precedent, with reader reach measured BLIND to this ledger by _skills_common.field_disposition.census on main d42694cf. The four pan-cancer-rnai-dependency-distribution fields (rnai_fraction_strongly_dependent / rnai_distribution_shape / rnai_selectivity_index / rnai_pan_essential_score) are READ via _rnai_lof_dependency_support in scripts/run.py (#1892)."
  interpretation_reach: "SECOND AXIS (added 2026-10-02, #2494 — thread A2 of epic #1937, on the
    two-axis contract _skills_common/field_disposition_contract.py landed by SK#1525; the
    tumor-presence ledger is the worked template). Orthogonal to `role`: role says WHAT the field is
    (signal/context/provenance/display), interpretation_reach says HOW FAR its interpretation travels
    — `unreached` (no declared reader: a candidate orphan, a REVIEW queue, never a delete list),
    `skills_local` (read by a rule/capsule/salience/figure/code reader inside this repo), or
    `cross_repo_resolver` (read by an analysis-methods property resolver under methods/onc_methods/,
    e.g. the cellline-rna _heterogeneity inputs tumor-presence declares). Reach does NOT promote role:
    a cross-repo resolver INPUT stays role:context, because the signal attaches to the RESOLVED
    property, not to this raw measurement.

    WHERE THE VALUES COME FROM — they are MACHINE-DERIVED, not judged: every value is
    `field_disposition_contract.interpretation_reach_for()` applied to the reader set
    `field_disposition.census()` measures for that (card, field), and the census reads NO
    field_disposition.yaml, so no value here can be satisfied by editing this file. The derivation is
    re-run and reconciled row-by-row by tests/test_field_disposition_reach.py — mutate a value here
    and that test reds. ADDITIVE: `role` is untouched and remains the semantic axis (this repo has no
    explicit `semantic_role` key); no row was renamed, retagged or deleted.

    NO ROW CARRIES cross_repo_resolver, and that is a MEASUREMENT, not an omission: the only property
    resolver that exists in methods/onc_methods/ is expression_properties/resolve.py, bound in
    field_disposition.RESOLVER_INPUT_BINDINGS to the card `cellline-rna-distribution` only. There is no
    dependency-property resolver, so no field of any card in THIS ledger is read across the seam.
    Tagging one cross_repo_resolver would be a fabricated consumption edge."
