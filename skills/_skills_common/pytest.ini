[pytest]
# Deliberately narrower than the repo-root default (../pyproject.toml [tool.pytest.ini_options]):
# this suite breaks under --import-mode=importlib (3 collection errors — test_card_output_emission.py,
# test_generic_dispatch.py, test_live_reader_chain.py — verified via --collect-only parity check
# 2026-09-29, SK#2093). pytest's ini discovery finds THIS file first for any invocation rooted under
# skills/_skills_common/, so the root default's --import-mode=importlib never reaches it.
addopts = -q -rs --tb=short
