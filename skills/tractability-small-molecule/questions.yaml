# Canonical question + axis registry for the tractability-small-molecule dashboard (Phase-0 keystone of
# the evidence_graph layer). Single source of truth for the consumer-facing small-molecule-druggability
# questions and the unified axis_id vocabulary {POTENCY, ACTIVITY, STRUCT, DRUG, DEGRADER} — the SAME axis
# keys the tractability-small-molecule narrator lens uses (narrator_lenses.py TRACTABILITY_SM.axis_labels:
# POTENCY binding-potency / ACTIVITY cellular-activity / STRUCT structural-ligandability / DRUG
# drug-or-tool-compound / DEGRADER degrader-handle), so the literature axis->question crosswalk resolves.
# These are ALSO the claim_vector axes (tractability_claims.SMALL_MOLECULE_CLAIM_SPEC) and the
# question_hierarchy.yaml sub_groups, so questions / claims / literature all share one axis vocabulary.
#
# Consumed by _skills_common/evidence_graph.py (build_evidence_graph). VERDICT-INERT and display-only:
# nothing here feeds a rule, resolver, or gate. It is joined onto the already-emitted
# headline.question_table (matched by `legacy_id` = the row id the tractability_sm_question_table builder
# emits: Compound / Concordance / Structure / Known-drug) — the emitted question_table itself is NOT
# modified (byte-stable). POTENCY and DEGRADER have no emitted question_table row today (the leading table
# ships only the 4 rows above), so those two questions carry no legacy_id: their per-question signal comes
# from the joined card capsules, not a question_table row — build_evidence_graph fail-softs (empty signal).
#
# Per-question fields (identical contract to skills/functional-requirement/questions.yaml):
#   id              stable semantic slug (the join key every graph edge references; NOT "Compound")
#   legacy_id       the row id tractability_sm_question_table emits (Compound|Concordance|Structure|
#                   Known-drug); omitted for POTENCY/DEGRADER (no emitted row yet)
#   seq             1-based display order (follows the lens axis_keys order POTENCY->…->DEGRADER)
#   text            human question text
#   axis_id         unified claim/literature axis (POTENCY|ACTIVITY|STRUCT|DRUG|DEGRADER); null = no axis
#   role            verdict_bearing | corroboration | display_only  (editorial question role)
#   measurement_types  the card-join key: a card joins this question when its measurement_type is in this
#                   list. Sourced from question_hierarchy.yaml (sub_groups->measurement_types) + the card
#                   contracts (target-contracts/cards/<id>.card.yaml measurement_type).
#
# The literature axis->question crosswalk is DERIVED, not stored:
#   question_ids(axis) = [q.id for q where q.axis_id == axis and q.role != "corroboration"]
#   => POTENCY->[measured_binding_potency]   ACTIVITY->[has_active_compound, chemically_agrees_with_dependency]
#      STRUCT->[ligandable_pocket]           DRUG->[known_drug_pharmacology]
#      DEGRADER->[degrader_handle]
#
# NOTE (no subtype question): tractability-small-molecule composes NO tier:subtype card (every card is
# tier target or whole-cohort — structure / potency / known-drug / degradability are properties of the
# gene/protein, indication- and subgroup-invariant). So there is no ambiguous measurement_type and no
# subtype:true question — a subtype question would grab nothing in a standard run.
skill: tractability-small-molecule
axis_vocabulary:
  POTENCY: binding potency
  ACTIVITY: cellular activity
  STRUCT: structural ligandability
  DRUG: drug/tool compound
  DEGRADER: degrader handle
questions:
- id: measured_binding_potency
  seq: 1
  text: Is there measured binding potency (a compound that binds the target)?
  axis_id: POTENCY
  role: verdict_bearing
  measurement_types: [measured_potency_tractability]
- id: has_active_compound
  legacy_id: Compound
  seq: 2
  text: Is there an active small-molecule compound (PRISM)?
  axis_id: ACTIVITY
  role: verdict_bearing
  measurement_types: [prism_compound_activity]
- id: chemically_agrees_with_dependency
  legacy_id: Concordance
  seq: 3
  text: Does compound-kill agree with the genetic dependency (chemical-genetic)?
  axis_id: ACTIVITY
  role: verdict_bearing
  measurement_types: [chemical_genetic_concordance]
- id: ligandable_pocket
  legacy_id: Structure
  seq: 4
  text: Is there a ligandable pocket even absent a known compound (structural / forward ligandability)?
  axis_id: STRUCT
  role: verdict_bearing
  measurement_types: [structure_druggability]
- id: known_drug_pharmacology
  legacy_id: Known-drug
  seq: 5
  text: Is there known-drug / druggable-genome pharmacology?
  axis_id: DRUG
  role: verdict_bearing
  measurement_types: [known_drug_tractability]
- id: degrader_handle
  seq: 6
  text: Is there a degrader handle (E3-substrate evidence / PROTAC precedent)?
  axis_id: DEGRADER
  role: verdict_bearing
  measurement_types: [degradation_feasibility]
- id: corroborated_predictable
  seq: 7
  text: How corroborated / predictable is the tractability call?
  axis_id: POTENCY
  role: corroboration
  measurement_types: [dependency_predictability]
