# Stub fixture: TG (thyroglobulin) in COADREAD — NEGATIVE-CONTROL CASE
#
# L9 fix (post-adversarial-review): the framework's negative-control claim depends
# on TG actually producing a "no viable modality" outcome. This fixture encodes
# realistic TG values for COADREAD that exercise the framework's refusal-discipline:
#   - TG is thyroid-restricted in HPA; baseline tumor expression near-zero in CRC
#   - Some TG transcript IS detectable in scattered COADREAD samples (enteroendocrine /
#     thyroid-like-metaplasia subsets), so the fixture acknowledges non-zero detection
#   - At the framework's interpretation_hint thresholds, TG should hit "not informative"
#     calls across dependency/mutation/expression; the synthesis should refuse to claim
#     viable fit
#
# This fixture is the substrate for test_e2e_tg_coadread_negative_control_with_data —
# the asserted-output contract the framework's "negative control" claim depends on.
#
# Note: TG is in target_biology_axis_lookup.yaml ONLY if added; in the current iter-1b
# build, TG is NOT in the curated lookup, so phase-1 returns axis=unknown and 0 cards
# run — this fixture is only consumed if TG is added to the lookup (deferred work).
# For now, the fixture exists structurally to validate the framework's discipline
# WHEN it eventually gets to phase-2 for TG.

target-identity-summary:
  input_value: TG
  resolved_hgnc_symbol: TG
  resolved_hgnc_id: 11764
  resolved_ensembl_id: ENSG00000042832.13
  resolved_uniprot_canonical: P01266
  resolution_status: resolved
  redirects_applied: []
  resolver_release_pin: resolver_v1.0.0
  biology_axis_curated: surface_intrinsic         # IF added to lookup: thyroid-restricted surface protein
  biology_axis_source: target_biology_axis_lookup.yaml

# TG expression in CRC is essentially zero baseline with scattered detection;
# log2_fc vs adjacent normal is near-zero or slightly NEGATIVE (normal colon
# also doesn't express TG, so the contrast is uninformative).
tumor-rna-vs-adjacent:
  log2_fc: 0.1
  q_value: 0.72                                   # not significant
  tumor_mean_tpm: 0.08                            # near-zero
  adjacent_mean_tpm: 0.07
  n_tumor: 625
  n_adjacent: 51

# TG is not a CRC dependency. DepMap shows essentially no growth effect.
dependency-lineage-selectivity:
  median_chronos_lineage: -0.05                   # near-zero; not a dependency
  median_chronos_panel: -0.03
  selectivity_score: 0.02
  n_cell_lines_in_lineage: 49
  n_cell_lines_panel: 1078
  lineage_rank_percentile: 48                     # roughly median; no selectivity

# TG mutation in CRC: extremely low frequency, no characterized hotspot landscape.
mutation-hotspot-frequency:
  overall_mutation_frequency: 0.008               # <1% of TCGA-COADREAD
  n_samples_in_indication: 625
  n_samples_mutated: 5
  hotspot_frequencies: []                          # no published hotspots
  top_cooccurring_genes: []
  top_mutually_exclusive_genes: []

# Surface-intrinsic-base cards: tumor-vs-normal, protein-surface, antigen-prevalence,
# normal-tissue-liability — needed for full negative-control coverage if axis is surface_intrinsic.
tumor-vs-normal-selectivity:
  tumor_median_tpm: 0.08
  tumor_p25_tpm: 0.0
  tumor_p75_tpm: 0.12
  max_normal_tissue_tpm: 3850.0                   # thyroid expression — VERY HIGH
  selectivity_score: -3.2                         # tumor far below max normal
  log2_fc_vs_max_normal: -15.5                    # heavily NEGATIVE — tumor << thyroid normal
  log2_fc_vs_paired_adjacent: 0.1
  log2_fc_vs_gtex_pooled: -8.2

protein-surface-evidence:
  subcellular_localization_uniprot: secreted_glycoprotein   # not classically tumor-cell-surface
  hpa_ihc_positivity_fraction: 0.02                          # scattered cells only
  hpa_ihc_intensity: weak
  surface_accessibility_call: intracellular_only             # TG is secreted, not surface-bound
  protein_evidence_strength: not_a_surface_target

antigen-prevalence:
  fraction_clinically_relevant: 0.005             # ~0.5% of CRC tumors
  fraction_high_expression: 0.001
  n_samples: 625
  median_tpm: 0.08
  cutoff_used_tpm: 1.0

clinical-precedent:
  highest_clinical_stage: none
  approved_agents: []
  n_active_trials: 0
  modality_precedent: {}
  notable_failures: []
  resistance_mechanisms_reported: []

normal-tissue-liability:
  max_normal_tissue_expression: 3850.0            # thyroid — high
  max_normal_tissue_name: thyroid
  n_essential_tissues_with_expression: 0          # thyroid is non-essential for survival
  n_non_essential_tissues_with_expression: 2      # thyroid + scattered salivary
  safety_tissue_flags: [thyroid]
  normal_expression_breadth: narrow

# EG1 (iter-2) — TG IS lineage-restricted (thyroid-only in adult tissue). If TG were added
# to the curated biology_axis_lookup as surface_intrinsic, this card would emit the dominant
# call "lineage-restricted: single tissue" → EG4 scoring rule would rate the modality strong
# IF no other primary card contradicts. But for TG in COADREAD, other surface-intrinsic
# cards DO contradict (tumor expression near zero, tumor-vs-normal selectivity inverted —
# tumor << thyroid normal). The contradiction blocks the dominant signal from carrying. This
# is the framework's intended discipline: dominant signal carries when other cards confirm
# the hypothesis, not when they reject it. TG remains correctly refused as non-viable.
lineage-restriction-evidence:
  n_adult_tissues_above_threshold: 1         # thyroid only
  tissue_restriction_score: 0.97             # near-perfect restriction
  top_expressing_tissues: [thyroid]
  target_tissue_overlap_indications: 0       # COADREAD ≠ thyroid; no overlap
  max_normal_tissue_expression: 3850.0       # thyroid (very high)
  secondary_tissue_max_expression: 0.12      # next-highest tissue, near-zero

# Subgroup-stratified: scattered detection across MSI/MSS — no biologically meaningful
# stratification because base expression is near-zero across all strata.
subgroup-stratified-expression:
  per_subgroup_metrics:
    - subgroup_id: MSI_H
      log2_fc: 0.12
      n_tumor: 95
      n_adjacent: 8
    - subgroup_id: MSS
      log2_fc: 0.09
      n_tumor: 530
      n_adjacent: 43
  n_subgroups_with_data: 2
  max_subgroup_log2fc: 0.12
  min_subgroup_log2fc: 0.09
  cross_subgroup_delta_log2fc: 0.03
  any_subgroup_significant: false
