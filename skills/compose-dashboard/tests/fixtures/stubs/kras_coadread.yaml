# Card E6 — prism-compound-activity (PRISM small-molecule viability, dual-release).
# KRAS is a poster-child for `clinically_active`: OncologyReference 25Q4 carries 15+
# KRAS-annotated prioritized compounds including the approved G12C inhibitors
# (sotorasib, adagrasib) and MRTX-1133 (KRAS-G12D). Repurposing 24Q2 adds LONAFARNIB
# (polyselective: FNTA/HRAS/KRAS/NRAS) as an FTase-inhibitor tool compound.
# Activated 2026-07-01 (plan warm-rolling-bunny Family C).
