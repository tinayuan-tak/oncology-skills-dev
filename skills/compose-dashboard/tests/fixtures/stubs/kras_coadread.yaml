# EG1 (iter-2) — KRAS is intracellular, so this card SHOULDN'T fire when phase-1
# routes through the intracellular-intrinsic-base dashboard. The stub is here as
# defense-in-depth + documentation; KRAS broadly expressed at low TPM across many
# tissues. If a future surface-intrinsic context loaded this card for KRAS, the
# call would be "broadly expressed: narrow therapeutic window" — correct behavior.
lineage-restriction-evidence:
  n_adult_tissues_above_threshold: 28        # KRAS detectable in most tissues at TPM>=5
  tissue_restriction_score: 0.04             # very low restriction
  top_expressing_tissues: [colon, lung, pancreas, breast, prostate, kidney, muscle, brain]
  target_tissue_overlap_indications: 28
  max_normal_tissue_expression: 12.3
  secondary_tissue_max_expression: 11.8

subgroup-stratified-expression:
  # L5: counts and log2_fc values re-derived. MSI_H + MSS sum to 625 (matches expression card).
  # KRAS log2_fc values consistent with the parent expression-tumor-vs-adjacent card (~0.7 overall);
  # MSS slightly higher than MSI_H (modest cross-stratum delta).
  per_subgroup_metrics:
    - subgroup_id: MSI_H
      log2_fc: 0.55
      n_tumor: 95           # ~15% of 625 (TCGA-COADREAD MSI-H fraction)
      n_adjacent: 8
    - subgroup_id: MSS
      log2_fc: 0.81
      n_tumor: 530          # ~85% of 625
      n_adjacent: 43
  n_subgroups_with_data: 2
  max_subgroup_log2fc: 0.81
  min_subgroup_log2fc: 0.55
  cross_subgroup_delta_log2fc: 0.26
  any_subgroup_significant: true

