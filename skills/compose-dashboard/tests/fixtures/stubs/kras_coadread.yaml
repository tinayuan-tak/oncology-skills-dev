      best_responder_lfc: -4.72
      single_dose_lfc: null
      n_lines_screened: 380
      polyselective: false
      n_annotated_targets: 1
      source_release: oncref-25q4
      prioritized: true
      metric_source: log2auc
    - compound_id: PRC-KRAS-2
      drug_name: RMC-7977
      moa: pan-RAS (ON) inhibitor
      median_log2auc: -0.41
      best_responder_lfc: -5.26
      single_dose_lfc: null
      n_lines_screened: 380
      polyselective: false
      n_annotated_targets: 1
      source_release: oncref-25q4
      prioritized: true
      metric_source: log2auc
    - compound_id: PRC-KRAS-G12C-1
