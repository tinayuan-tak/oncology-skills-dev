      n_high_expr: 28
      mean_chronos_high_expr: -1.45
    - lineage: Bowel
      n_high_expr: 32
      mean_chronos_high_expr: -1.18
    - lineage: Lung
      n_high_expr: 45
      mean_chronos_high_expr: -0.62
