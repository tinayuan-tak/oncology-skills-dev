  # v3 (2026-07-01): PRIMARY metric = Log2AUC (dose-response integral). Real KRAS
  # under Log2AUC shows Bowel/Esophagus/Pancreas ranking top (KRAS-mut-enriched
  # lineages) while median LFC (v2) was flat. best_responder_lfc preserves the
  # deep KRAS-G12C responder tail (-4 to -5) that Log2AUC's 0-cap compresses.
  # OncRef compounds carry median_log2auc; Repurposing = annotation-only (single_dose_lfc).
  prism_activity_class: clinically_active
  n_compounds_targeting: 23
  highest_clinical_phase: phase_1_plus
  median_log2auc_across_compounds: -0.12
  top_compounds:
