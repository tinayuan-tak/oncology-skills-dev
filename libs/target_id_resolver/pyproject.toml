[project]
name = "target-id-resolver"
version = "0.1.0a1"
description = "Release-pinned identifier resolver for human gene/protein targets. Maps any input identifier (HGNC symbol, alias, deprecated symbol, Ensembl gene ID, UniProt accession, NCBI Entrez ID) to a canonical Target object with HGNC + Ensembl + UniProt + NCBI cross-references. Backbone of v2 oncology target evaluation skills."
authors = [
  { name = "Ryan Abo", email = "ryan.abo@takeda.com" },
]
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Internal — Takeda Oncology Computational Biology" }

dependencies = [
  "pydantic>=2.0,<3",
  "requests>=2.31",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-vcr>=1.0",  # record/replay HTTP for offline test runs
]

[project.scripts]
resolve-target-id = "target_id_resolver.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["target_id_resolver*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "live: marks tests that hit live external endpoints (deselect with '-m \"not live\"')",
  "snapshot: marks tests that require local cache of pinned reference snapshots (deselect with '-m \"not snapshot\"')",
]
