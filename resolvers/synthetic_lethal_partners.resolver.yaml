# synthetic-lethal-partners (Gate C step-2) verdict resolver (gap #5, 2026-07-20).
# Declarative transcription of skills/synthetic-lethal-partners/scripts/run.py::_verdict.
# has_experimental_sl_partner is the gate veto-suppressor trigger (SMARCA2<-SMARCA4);
# computational-only is surfaced but does NOT suppress a veto. ANNOTATION, never nominates.
gate: synthetic_lethal_partners
version: 1.0.0
description: Curated SL-partner annotation precedence (SynLethDB v3).
resolve:
  - verdict: has_experimental_sl_partner
    when_fired: sl-experimental-partner-context-conditional
  - verdict: has_computational_sl_partner
    when_fired: sl-computational-partner-informational
  - verdict: no_curated_sl_partner
    when_fired: sl-no-partner-neutral
  - verdict: data_unavailable
    when_fired: sl-data-unavailable-insufficient
default: insufficient
