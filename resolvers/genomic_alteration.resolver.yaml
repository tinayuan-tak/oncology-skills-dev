# genomic-alteration-profile (genomic gate) verdict resolver — inline→declarative conversion.
#
# Byte-for-byte transcription of skills/genomic-alteration-profile/scripts/run.py::_verdict (the
# inline multi-axis if-chain), proven equivalent across all 2^8 fired-set combinations by the
# pre-swap oracle before the inline logic is deleted (gap #5 discipline).
#
# The genomic verdict is MULTI-AXIS (not a flat ladder): a SNV/indel axis (mutation-priority
# first-match) + a copy-number axis, combined so a target driven by BOTH reads multi_class_driver.
# Expressed here as ORDERED rungs:
#   (1) multi_class = (any mut-driver) AND (any cn-driver) — the CROSS-PRODUCT of the 4 mut-driver
#       rules × 2 cn rules, ordered by mut-priority so the driving_rule is the highest-priority
#       fired mut rule (matches _mutation_verdict's first-match + the inline `return ..., mut_rule`).
#   (2) single mut-driver (mut drives, no cn) — the 4 mut-driver verdicts, mut-priority order.
#   (3) cn-only (cn drives, mut not a driver) — amplified before deleted (matches _cn_driver_fired
#       first-match).
#   (4) mixed/passenger fallback (mut_verdict present but not a driver, no cn).
# CN-only PRECEDES mixed/passenger because the inline `if cn_driver` branch runs before the
# `if mut_verdict is not None` fallback.
#
# GUARDRAIL: pattern-match over fired rule IDs only — no arithmetic (labels live in the cards).
gate: genomic_alteration
version: 1.0.0
description: |
  Multi-class genomic-alteration verdict. SNV/indel axis primary (strongest therapeutic signals),
  copy-number layered as a modifier so an amplification/deletion-driven target (few mutations) is
  reported as a CN driver rather than collapsing to passenger. Faithful transcription of the
  former inline _verdict; multi_class = mut-driver AND cn-driver via cross-product rungs.

resolve:
  # (0) CONFIRMED DRIVER (2026-07-22): a driver-establishing signal CORROBORATED by a typed driver
  #     ROLE (OncoKB×IntOGen gof OR lof) — the strongest "real, annotation-backed driver" statement.
  #     DIRECTION-AGNOSTIC: variant-class-pattern and functional-role are orthogonal (TP53 is a LoF
  #     driver that is missense-dominant), so ANY driver signal + ANY direct-driver role confirms.
  #     SCOPE (deliberate, Option-B): confirmation applies ONLY to the driver calls that are NOT
  #     already load-bearing in the nomination gate — recurrent_missense/lof_driver + the CN drivers.
  #     The two BIOMARKER-DEPENDENCY verdicts (mutant-strongly/moderately-dependent) are LEFT
  #     UNTOUCHED: they are the gate's veto-suppressor + dominant positive_signal (EGFR/IDH1/FLT3
  #     rescue, nomination_verdict_gate.yaml L129/L226), so swallowing them into confirmed_driver
  #     would silently drop that rescue. Result: ZERO nomination-gate change; confirmation upgrades
  #     only the safe calls. passenger/data_unavailable roles fire NO rung → never create/downgrade.
  #     8 rungs = {mut-lof, mut-missense, cn-amp, cn-del} × {gof, lof}, mut-priority-ordered.
  - {verdict: confirmed_driver, when_all_fired: [mut-lof-dominant-supportive, alteration-role-gof-driver-supportive], driving_rule: mut-lof-dominant-supportive}
  - {verdict: confirmed_driver, when_all_fired: [mut-lof-dominant-supportive, alteration-role-lof-driver-neutral], driving_rule: mut-lof-dominant-supportive}
  - {verdict: confirmed_driver, when_all_fired: [mut-missense-dominant-supportive, alteration-role-gof-driver-supportive], driving_rule: mut-missense-dominant-supportive}
  - {verdict: confirmed_driver, when_all_fired: [mut-missense-dominant-supportive, alteration-role-lof-driver-neutral], driving_rule: mut-missense-dominant-supportive}
  - {verdict: confirmed_driver, when_all_fired: [cn-recurrently-amplified-supportive, alteration-role-gof-driver-supportive], driving_rule: cn-recurrently-amplified-supportive}
  - {verdict: confirmed_driver, when_all_fired: [cn-recurrently-amplified-supportive, alteration-role-lof-driver-neutral], driving_rule: cn-recurrently-amplified-supportive}
  - {verdict: confirmed_driver, when_all_fired: [cn-recurrently-deleted-supportive, alteration-role-gof-driver-supportive], driving_rule: cn-recurrently-deleted-supportive}
  - {verdict: confirmed_driver, when_all_fired: [cn-recurrently-deleted-supportive, alteration-role-lof-driver-neutral], driving_rule: cn-recurrently-deleted-supportive}

  # (1) MULTI-CLASS: any mut-driver AND any cn-driver. Cross-product, mut-priority order.
  #     driving_rule = the mut rule (matches the inline `return "multi_class_driver", mut_rule`).
  - {verdict: multi_class_driver, when_all_fired: [mutant-strongly-dependent-supportive, cn-recurrently-amplified-supportive], driving_rule: mutant-strongly-dependent-supportive}
  - {verdict: multi_class_driver, when_all_fired: [mutant-strongly-dependent-supportive, cn-recurrently-deleted-supportive], driving_rule: mutant-strongly-dependent-supportive}
  - {verdict: multi_class_driver, when_all_fired: [mutant-moderately-dependent-supportive, cn-recurrently-amplified-supportive], driving_rule: mutant-moderately-dependent-supportive}
  - {verdict: multi_class_driver, when_all_fired: [mutant-moderately-dependent-supportive, cn-recurrently-deleted-supportive], driving_rule: mutant-moderately-dependent-supportive}
  - {verdict: multi_class_driver, when_all_fired: [mut-lof-dominant-supportive, cn-recurrently-amplified-supportive], driving_rule: mut-lof-dominant-supportive}
  - {verdict: multi_class_driver, when_all_fired: [mut-lof-dominant-supportive, cn-recurrently-deleted-supportive], driving_rule: mut-lof-dominant-supportive}
  - {verdict: multi_class_driver, when_all_fired: [mut-missense-dominant-supportive, cn-recurrently-amplified-supportive], driving_rule: mut-missense-dominant-supportive}
  - {verdict: multi_class_driver, when_all_fired: [mut-missense-dominant-supportive, cn-recurrently-deleted-supportive], driving_rule: mut-missense-dominant-supportive}

  # (2) SINGLE MUT-DRIVER (mut drives, no cn-driver fired) — mut-priority order.
  - {verdict: biomarker_stratified_dependency, when_fired: mutant-strongly-dependent-supportive}
  - {verdict: moderate_biomarker_dependency,   when_fired: mutant-moderately-dependent-supportive}
  - {verdict: recurrent_lof_driver,            when_fired: mut-lof-dominant-supportive}
  - {verdict: recurrent_missense_driver,       when_fired: mut-missense-dominant-supportive}

  # (2b) CN-STRATIFIED DEPENDENCY (A1a, 2026-08-06). Amplified cells Chronos-proven more dependent —
  #      the copy-number analog of the mut-stratified rescue above. REUSES the SAME
  #      biomarker_stratified_dependency / moderate_biomarker_dependency verdicts (so
  #      nomination_verdict_gate.yaml is unchanged; distinct driving_rule_id preserves auditability).
  #      Placed AFTER the mut single-driver rungs (mutation wins first-match when both fire — e.g.
  #      KRAS amp+mut → driving_rule names the mutation path) and BEFORE the CN-ONLY rungs below (a
  #      Chronos-proven amplification DEPENDENCY outranks a bare CN-landscape driver with no dep test).
  - {verdict: biomarker_stratified_dependency, when_fired: cn-amplified-strongly-dependent-supportive}
  - {verdict: moderate_biomarker_dependency,   when_fired: cn-amplified-moderately-dependent-supportive}

  # (2c) FUSION-STRATIFIED DEPENDENCY (A1-fusion, 2026-08-06). Fusion-positive cells Chronos-proven
  #      more dependent — the gene-fusion analog of the mut/CN-stratified rescues above. REUSES the
  #      SAME biomarker_stratified_dependency / moderate_biomarker_dependency verdicts (so
  #      nomination_verdict_gate.yaml is unchanged; distinct driving_rule_id preserves auditability).
  #      Placed AFTER the mut + CN single-driver rungs (precedence mut > cn > fusion when several fire)
  #      and BEFORE the CN-ONLY rungs below (a Chronos-proven fusion DEPENDENCY outranks a bare
  #      CN-landscape driver with no dependency test). Recovers EWSR1-FLI1/BCR-ABL1 — targets neither
  #      hotspot-mutated nor amplified, invisible to (2)/(2b).
  - {verdict: biomarker_stratified_dependency, when_fired: fusion-positive-strongly-dependent-supportive}
  - {verdict: moderate_biomarker_dependency,   when_fired: fusion-positive-moderately-dependent-supportive}

  # (3) CN-ONLY (cn drives, mutation not a driver) — amplified before deleted (first-match parity).
  - {verdict: recurrent_amplification_driver,  when_fired: cn-recurrently-amplified-supportive}
  - {verdict: recurrent_deletion_driver,       when_fired: cn-recurrently-deleted-supportive}

  # (4) FALLBACK: mutation axis said something non-driver (mixed / passenger), no cn.
  - {verdict: mixed_pattern,      when_fired: mut-mixed-neutral}
  - {verdict: passenger_pattern,  when_fired: mut-no-mutations-neutral}

default: insufficient
