# genomic-alteration-profile (genomic gate) verdict resolver.
#
# Produces the multi-class genomic-alteration verdict from the set of fired rule IDs. The engine is
# first-match over the ordered `resolve:` ladder, emitting exactly ONE verdict (default: insufficient).
# It pattern-matches fired rule IDs only — no arithmetic (numeric labels live in the cards).
#
# The verdict spans three alteration classes (SNV/indel, copy-number, fusion) plus a typed driver
# ROLE and a genotype×drug-response biomarker. The ladder is ordered by how load-bearing each signal
# is for a nomination, NOT by alteration class:
#
#   1. Stratified-dependency family (Chronos KO dependency, any class) — TOP of the ladder.
#      A functional dependency test is the strongest signal, and biomarker_stratified_dependency is
#      the nomination gate's veto-suppressor + dominant positive_signal, so it must win first-match
#      over the (nomination-inert) confirmed_driver / multi_class_driver verdicts. Ordered
#      strong-before-moderate (precedence by effect strength); within a tier the class tie-break is
#      mut > cn > fusion > amp-expr.
#   2. multi_class_driver — a mutation-class driver AND a copy-number driver, gated on a typed driver
#      role, so a passenger with a driver-shaped spectrum + a CN-shape signal does not read multi_class.
#   3. confirmed_driver — a single-class driver (one altered class) corroborated by a typed driver role.
#   4. drug_response_biomarker — genotype-selective drug sensitivity (a distinct verdict; drug
#      sensitivity is not KO dependency).
#   5. Variant-class pattern (lof/missense-dominant) — mutation-spectrum SHAPE, no functional test.
#   6. CN-only and fusion-landscape recurrent drivers — landscape recurrence with no dependency line.
#   7. mixed / passenger fallback, guarded so a double data-gap reads insufficient, not passenger.
gate: genomic_alteration
version: 1.8.0   # 2026-09-01: LoF-role precedence over the MODERATE dependency tier (backtest-gated) — a
                 # direct_driver_lof gene with only a moderate genotype-stratified dependency resolves to the
                 # role-honest confirmed_lof_driver (neutral) instead of the positive moderate_biomarker_
                 # dependency (4 new rungs at priority 4-7, gated on alteration-role-lof-driver-neutral;
                 # GoF genes byte-stable). Priorities 4-50 shifted +4 to open the slots (order/verdicts
                 # preserved). Fixes TP53/COADREAD mis-framed as a positive biomarker dependency.
                 # 2026-08-28: subclonal-recurrence guard (distillation assessment change-3, backtest-gated) —
                 # a MEASURED predominantly-subclonal top-1% recurrent SNV with no other corroboration demotes
                 # recurrent_snv_driver → recurrent_snv_subclonal_uncertain (rung via
                 # snv-clonality-subclonal-opposing + snv-recurrence-top-driver-supportive). Clonal/unavailable unaffected.
description: |
  Multi-class genomic-alteration verdict. A Chronos stratified-dependency (any alteration class) is
  the strongest signal and leads the ladder; copy-number and fusion landscape recurrence keep an
  amplification/deletion/fusion-driven target (few mutations) from collapsing to passenger; a typed
  driver role corroborates single- and multi-class driver calls.

resolve:
  # ── 1. Stratified-dependency family (Chronos KO dependency) ──────────────────────────────────────
  #    Leads the ladder so a dependency signal wins first-match over confirmed_driver / multi_class
  #    (both nomination-inert). All four classes reuse the same two verdicts; the distinct
  #    driving_rule_id preserves the audit trail of which class drove.
  #    ALL FOUR classes are indication-scope-GATED (scope-coherence Phase 1): each biomarker rung requires
  #    the matching *-indication-scoped-context gate (evidence_scope within_indication[_mut_vs_pan_wt]), so
  #    a pan-lineage-only dependency in a lineage the queried indication does not belong to no longer earns
  #    a biomarker verdict — it falls through to confirmed_driver / *_dominant_pattern / recurrent_* below.
  #    Every rung lists the gate LAST in when_all_fired and MUST keep driving_rule set explicitly, else the
  #    interpreter's rids[-1] fallback would name the scope gate (not the dependency rule) as the driver.
  #    STRONG tier (|delta| >= 0.5):
  - {verdict: biomarker_stratified_dependency, when_all_fired: [mutant-strongly-dependent-supportive, mutant-indication-scoped-context], driving_rule: mutant-strongly-dependent-supportive, priority: 0}
  - {verdict: biomarker_stratified_dependency, when_all_fired: [cn-amplified-strongly-dependent-supportive, cn-amplified-indication-scoped-context], driving_rule: cn-amplified-strongly-dependent-supportive, priority: 1}
  - {verdict: biomarker_stratified_dependency, when_all_fired: [fusion-positive-strongly-dependent-supportive, fusion-positive-indication-scoped-context], driving_rule: fusion-positive-strongly-dependent-supportive, priority: 2}
  - {verdict: biomarker_stratified_dependency, when_all_fired: [amp-expr-strongly-dependent-supportive, amp-expr-indication-scoped-context], driving_rule: amp-expr-strongly-dependent-supportive, priority: 3}
  # ── LoF-ROLE PRECEDENCE over the MODERATE tier (2026-09-01, v1.8.0; backtest-gated) ───────────────
  #    A typed LoF (tumor-suppressor) driver ROLE with only a MODERATE genotype-stratified dependency is
  #    a role-DISCORDANT signal (mutant-GoF stabilization / passenger correlation), NOT an inhibitor/
  #    degrader green-light — "you cannot drug a lost function". So a direct_driver_lof gene resolves to the
  #    role-honest confirmed_lof_driver (neutral) instead of the POSITIVE moderate_biomarker_dependency.
  #    Gated on alteration-role-lof-driver-neutral, so it ONLY re-labels LoF-role genes: a GoF driver
  #    (alteration-role-gof-driver-supportive) never fires the lof rule → keeps moderate_biomarker_dependency
  #    (byte-stable, CD19-safe by construction). Scoped to the MODERATE tier only — a STRONG dependency
  #    (priority 0-3, above) stays biomarker_stratified_dependency even for a LoF gene (a real actionable
  #    dependency is not false-negatived). Backtest: TP53/COADREAD (direct_driver_lof + mutant_moderately_
  #    dependent) → confirmed_lof_driver; PIK3CA/COADREAD (direct_driver_gof, same dependency) → unchanged;
  #    APC/PTEN/RB1/SMAD4/STK11 (LoF, no moderate dependency) → unchanged (multi_class_lof/confirmed_lof).
  - {verdict: confirmed_lof_driver, when_all_fired: [mutant-moderately-dependent-supportive, mutant-indication-scoped-context, alteration-role-lof-driver-neutral], driving_rule: mutant-moderately-dependent-supportive, priority: 4}
  - {verdict: confirmed_lof_driver, when_all_fired: [cn-amplified-moderately-dependent-supportive, cn-amplified-indication-scoped-context, alteration-role-lof-driver-neutral], driving_rule: cn-amplified-moderately-dependent-supportive, priority: 5}
  - {verdict: confirmed_lof_driver, when_all_fired: [fusion-positive-moderately-dependent-supportive, fusion-positive-indication-scoped-context, alteration-role-lof-driver-neutral], driving_rule: fusion-positive-moderately-dependent-supportive, priority: 6}
  - {verdict: confirmed_lof_driver, when_all_fired: [amp-expr-moderately-dependent-supportive, amp-expr-indication-scoped-context, alteration-role-lof-driver-neutral], driving_rule: amp-expr-moderately-dependent-supportive, priority: 7}
  #    MODERATE tier (|delta| 0.2-0.5):
  - {verdict: moderate_biomarker_dependency, when_all_fired: [mutant-moderately-dependent-supportive, mutant-indication-scoped-context], driving_rule: mutant-moderately-dependent-supportive, priority: 8}
  - {verdict: moderate_biomarker_dependency, when_all_fired: [cn-amplified-moderately-dependent-supportive, cn-amplified-indication-scoped-context], driving_rule: cn-amplified-moderately-dependent-supportive, priority: 9}
  - {verdict: moderate_biomarker_dependency, when_all_fired: [fusion-positive-moderately-dependent-supportive, fusion-positive-indication-scoped-context], driving_rule: fusion-positive-moderately-dependent-supportive, priority: 10}
  - {verdict: moderate_biomarker_dependency, when_all_fired: [amp-expr-moderately-dependent-supportive, amp-expr-indication-scoped-context], driving_rule: amp-expr-moderately-dependent-supportive, priority: 11}

  # ── 2. multi_class_driver — a mutation-class driver AND a copy-number driver ─────────────────────
  #    Requires an alteration-role DRIVER co-signal (gof-supportive OR lof-neutral) so a passenger with
  #    a driver-shaped spectrum + a CN-shape signal falls through to passenger_pattern rather than
  #    reading multi_class. driving_rule = the mutation rule. Both cell-line CN and patient-focal CN
  #    count as the CN driver. Recurrence is deliberately NOT gated on (mutation-hotspot-frequency has a
  #    data_unavailable bin that would demote genuine drivers wherever recurrence is merely unmeasured).
  #    NOTE: multi_class rungs keyed on a mutant-*-dependent rule are intentionally absent — the
  #    stratified-dependency rungs above are a subset of their condition and always win first-match, so
  #    a mutation-DEPENDENCY + CN gene resolves to the biomarker verdict (the nomination-load-bearing one).
  - {verdict: multi_class_driver, when_all_fired: [mut-lof-dominant-supportive, cn-recurrently-amplified-supportive, alteration-role-gof-driver-supportive], driving_rule: mut-lof-dominant-supportive, priority: 12}
  - {verdict: multi_class_lof_driver, when_all_fired: [mut-lof-dominant-supportive, cn-recurrently-amplified-supportive, alteration-role-lof-driver-neutral], driving_rule: mut-lof-dominant-supportive, priority: 13}
  - {verdict: multi_class_driver, when_all_fired: [mut-lof-dominant-supportive, cn-recurrently-deleted-supportive, alteration-role-gof-driver-supportive], driving_rule: mut-lof-dominant-supportive, priority: 14}
  - {verdict: multi_class_lof_driver, when_all_fired: [mut-lof-dominant-supportive, cn-recurrently-deleted-supportive, alteration-role-lof-driver-neutral], driving_rule: mut-lof-dominant-supportive, priority: 15}
  - {verdict: multi_class_driver, when_all_fired: [mut-missense-dominant-supportive, cn-recurrently-amplified-supportive, alteration-role-gof-driver-supportive], driving_rule: mut-missense-dominant-supportive, priority: 16}
  - {verdict: multi_class_lof_driver, when_all_fired: [mut-missense-dominant-supportive, cn-recurrently-amplified-supportive, alteration-role-lof-driver-neutral], driving_rule: mut-missense-dominant-supportive, priority: 17}
  - {verdict: multi_class_driver, when_all_fired: [mut-missense-dominant-supportive, cn-recurrently-deleted-supportive, alteration-role-gof-driver-supportive], driving_rule: mut-missense-dominant-supportive, priority: 18}
  - {verdict: multi_class_lof_driver, when_all_fired: [mut-missense-dominant-supportive, cn-recurrently-deleted-supportive, alteration-role-lof-driver-neutral], driving_rule: mut-missense-dominant-supportive, priority: 19}
  #    Patient-focal CN twins: a mutation-class driver + role that is patient-focal amplified/deleted
  #    (but cell-line-CN-neutral) also reads multi_class — a rescue, never a downgrade.
  - {verdict: multi_class_driver, when_all_fired: [mut-lof-dominant-supportive, cn-patient-focal-amplified-supportive, alteration-role-gof-driver-supportive], driving_rule: mut-lof-dominant-supportive, priority: 20}
  - {verdict: multi_class_lof_driver, when_all_fired: [mut-lof-dominant-supportive, cn-patient-focal-amplified-supportive, alteration-role-lof-driver-neutral], driving_rule: mut-lof-dominant-supportive, priority: 21}
  - {verdict: multi_class_driver, when_all_fired: [mut-lof-dominant-supportive, cn-patient-focal-deleted-supportive, alteration-role-gof-driver-supportive], driving_rule: mut-lof-dominant-supportive, priority: 22}
  - {verdict: multi_class_lof_driver, when_all_fired: [mut-lof-dominant-supportive, cn-patient-focal-deleted-supportive, alteration-role-lof-driver-neutral], driving_rule: mut-lof-dominant-supportive, priority: 23}
  - {verdict: multi_class_driver, when_all_fired: [mut-missense-dominant-supportive, cn-patient-focal-amplified-supportive, alteration-role-gof-driver-supportive], driving_rule: mut-missense-dominant-supportive, priority: 24}
  - {verdict: multi_class_lof_driver, when_all_fired: [mut-missense-dominant-supportive, cn-patient-focal-amplified-supportive, alteration-role-lof-driver-neutral], driving_rule: mut-missense-dominant-supportive, priority: 25}
  - {verdict: multi_class_driver, when_all_fired: [mut-missense-dominant-supportive, cn-patient-focal-deleted-supportive, alteration-role-gof-driver-supportive], driving_rule: mut-missense-dominant-supportive, priority: 26}
  - {verdict: multi_class_lof_driver, when_all_fired: [mut-missense-dominant-supportive, cn-patient-focal-deleted-supportive, alteration-role-lof-driver-neutral], driving_rule: mut-missense-dominant-supportive, priority: 27}

  # ── 3. confirmed_driver — a single-class driver corroborated by a typed driver role ──────────────
  #    Below multi_class (a dually-altered driver surfaces multi_class first) but above the bare
  #    variant-class-pattern rungs (a role-confirmed driver outranks a mutation-spectrum shape).
  - {verdict: confirmed_driver, when_all_fired: [mut-lof-dominant-supportive, alteration-role-gof-driver-supportive], driving_rule: mut-lof-dominant-supportive, priority: 28}
  - {verdict: confirmed_lof_driver, when_all_fired: [mut-lof-dominant-supportive, alteration-role-lof-driver-neutral], driving_rule: mut-lof-dominant-supportive, priority: 29}
  - {verdict: confirmed_driver, when_all_fired: [mut-missense-dominant-supportive, alteration-role-gof-driver-supportive], driving_rule: mut-missense-dominant-supportive, priority: 30}
  - {verdict: confirmed_lof_driver, when_all_fired: [mut-missense-dominant-supportive, alteration-role-lof-driver-neutral], driving_rule: mut-missense-dominant-supportive, priority: 31}
  - {verdict: confirmed_driver, when_all_fired: [cn-recurrently-amplified-supportive, alteration-role-gof-driver-supportive], driving_rule: cn-recurrently-amplified-supportive, priority: 32}
  - {verdict: confirmed_lof_driver, when_all_fired: [cn-recurrently-amplified-supportive, alteration-role-lof-driver-neutral], driving_rule: cn-recurrently-amplified-supportive, priority: 33}
  - {verdict: confirmed_driver, when_all_fired: [cn-recurrently-deleted-supportive, alteration-role-gof-driver-supportive], driving_rule: cn-recurrently-deleted-supportive, priority: 34}
  - {verdict: confirmed_lof_driver, when_all_fired: [cn-recurrently-deleted-supportive, alteration-role-lof-driver-neutral], driving_rule: cn-recurrently-deleted-supportive, priority: 35}
  - {verdict: confirmed_driver, when_all_fired: [cn-patient-focal-amplified-supportive, alteration-role-gof-driver-supportive], driving_rule: cn-patient-focal-amplified-supportive, priority: 36}
  - {verdict: confirmed_lof_driver, when_all_fired: [cn-patient-focal-amplified-supportive, alteration-role-lof-driver-neutral], driving_rule: cn-patient-focal-amplified-supportive, priority: 37}
  - {verdict: confirmed_driver, when_all_fired: [cn-patient-focal-deleted-supportive, alteration-role-gof-driver-supportive], driving_rule: cn-patient-focal-deleted-supportive, priority: 38}
  - {verdict: confirmed_lof_driver, when_all_fired: [cn-patient-focal-deleted-supportive, alteration-role-lof-driver-neutral], driving_rule: cn-patient-focal-deleted-supportive, priority: 39}

  # ── 4. drug_response_biomarker — genotype-selective drug sensitivity ─────────────────────────────
  #    A distinct verdict, never conflated with biomarker_stratified_dependency (drug sensitivity is
  #    not CRISPR-KO dependency). Below the KO-dependency family (the more mechanism-anchored call) but
  #    above the bare variant-class-pattern rungs. Only the STRONG class drives a verdict; the moderate
  #    class stays a signal-only facet.
  - {verdict: drug_response_biomarker, when_fired: mutation-drug-response-strongly-sensitive-supportive, priority: 40}

  # ── 5. Variant-class pattern (mutation-spectrum SHAPE, no dependency test) ───────────────────────
  #    Fires from mutation-type-counts variant-class dominance (>=70% missense / >=50% truncating among
  #    coding variants in >=5 cell lines). These measure the SHAPE of the spectrum, not patient
  #    recurrence — "recurrent" is reserved for signals that literally count sample recurrence (cn-
  #    recurrently-*, fusion-landscape). Below the dependency family, above the CN-landscape rungs.
  - {verdict: lof_dominant_pattern, when_fired: mut-lof-dominant-supportive, priority: 41}
  - {verdict: missense_dominant_pattern, when_fired: mut-missense-dominant-supportive, priority: 42}

  # ── 6. CN-only and fusion-landscape recurrent drivers (landscape recurrence, no dependency line) ──
  #    Cell-line CN before patient-focal CN (cell-line wins first-match when both fire); amplified
  #    before deleted. Fusion-landscape last in this tier. These are landscape-recurrence drivers, not
  #    nominating positive_signals — they keep an amplification/deletion/fusion-driven oncogene with no
  #    DepMap dependency line (e.g. ERBB2/MYC amp, EWSR1-FLI1 / EML4-ALK fusion) from collapsing to
  #    passenger, mirroring how the copy-number reframe rescued amplification-driven targets.
  - {verdict: recurrent_amplification_driver, when_fired: cn-recurrently-amplified-supportive, priority: 43}
  - {verdict: recurrent_deletion_driver, when_fired: cn-recurrently-deleted-supportive, priority: 44}
  - {verdict: recurrent_amplification_driver, when_fired: cn-patient-focal-amplified-supportive, priority: 45}
  - {verdict: recurrent_deletion_driver, when_fired: cn-patient-focal-deleted-supportive, priority: 46}
  - {verdict: recurrent_fusion_driver, when_fired: fusion-landscape-recurrent-driver-supportive, priority: 47}
  #    SNV landscape recurrence (scope-coherence Phase 2): a top-1% pooled multi-cohort recurrent SNV
  #    driver with no KO-dependency, no variant-class dominance, and no CN/fusion landscape event. LAST
  #    in tier 6 so it fires only when no CN/fusion landscape driver did — a dually-altered gene keeps
  #    its existing recurrent_amplification/deletion/fusion verdict (byte-stable). The SNV analog of the
  #    recurrent focal-amp / recurrent-fusion rescues; makes patient recurrence verdict-relevant.
  #    SUBCLONAL GUARD (2026-08-28, distillation assessment change-3; backtest-gated per the card note):
  #    a top-1% recurrent SNV that is MEASURED predominantly-subclonal AND carries no other corroboration
  #    (no dependency/role/CN/fusion — those fire higher rungs) is a late/hitchhiker pattern, not a truncal
  #    driver → recurrent_snv_subclonal_uncertain (ranks ABOVE the bare recurrence rung). Fires ONLY when
  #    clonality is measured-subclonal; a clonal OR clonality-unavailable target keeps recurrent_snv_driver
  #    (no coverage regression). KRAS/APC/TP53 (predominantly_clonal) are unaffected.
  #    ROLE-CORROBORATION PRE-EMPTION: an OncoKB/intOGen driver ROLE (GoF or LoF) confirms a real driver
  #    regardless of clonality, so it PRE-EMPTS the subclonal demotion (ranks above it) → keep
  #    recurrent_snv_driver. (Role alone fires no higher confirmed_driver rung — that needs a CN/dep
  #    co-signal — so without this a role-confirmed subclonal recurrent SNV would wrongly demote.)
  - {verdict: recurrent_snv_driver, when_all_fired: [snv-recurrence-top-driver-supportive, alteration-role-gof-driver-supportive], driving_rule: snv-recurrence-top-driver-supportive, priority: 48}
  - {verdict: recurrent_snv_driver, when_all_fired: [snv-recurrence-top-driver-supportive, alteration-role-lof-driver-neutral], driving_rule: snv-recurrence-top-driver-supportive, priority: 49}
  - {verdict: recurrent_snv_subclonal_uncertain, when_all_fired: [snv-recurrence-top-driver-supportive, snv-clonality-subclonal-opposing], driving_rule: snv-clonality-subclonal-opposing, priority: 50}
  - {verdict: recurrent_snv_driver, when_fired: snv-recurrence-top-driver-supportive, priority: 51}

  # ── 7. mixed / passenger fallback, with a double-data-gap guard ──────────────────────────────────
  #    passenger_pattern is a substantive "not a driver" call, but its trigger fires on a rarely-mutated
  #    gene. When the copy-number axis is ALSO unmeasured (cn-data-unavailable-insufficient), asserting
  #    "not a driver" would come from a double data-gap — the exact mutation-only failure mode the
  #    amplification reframe was built to kill. The engine has no negation predicate, so the guard is
  #    precedence: no-mutations + CN-unavailable resolves to insufficient (an honest coverage gap). A
  #    MEASURED-neutral CN + no mutations still reads passenger_pattern (an informative not-a-driver call).
  - {verdict: insufficient, when_all_fired: [mut-no-mutations-neutral, cn-data-unavailable-insufficient], driving_rule: cn-data-unavailable-insufficient, priority: 52}
  - {verdict: mixed_pattern, when_fired: mut-mixed-neutral, priority: 53}
  - {verdict: passenger_pattern, when_fired: mut-no-mutations-neutral, priority: 54}

default: insufficient
evaluation: match_all_reduce
