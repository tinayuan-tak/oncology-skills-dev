                 # NOTE: the v1.9.0–v1.10.0 changelog entries BELOW cite pre-v1.11.0 absolute priorities (before the
                 # +4 shift); add 4 to any priority there to map to the live ladder. Inline comments in the
                 # resolve: body below have been updated to the live numbers.
                 # 2026-09-13: COMPOSITION of two independently-measured precedence passes that both rewrote the
                 # deletion arm. 1.9.0 (CASE-028, on main) established the ROLE asymmetry: a CN deletion is a
                 # driver class only for a LoF/neutral role. This branch's specificity pass established the
                 # PREDICATE restriction: the shallow-inclusive cn-recurrently-deleted-supportive is 60.1% null
                 # genome-wide and fires no rung at all. The two are orthogonal (one picks the role, the other
                 # picks the predicate) and BOTH are kept: the deletion arm now keys ONLY on
                 # cn-patient-focal-deleted-supportive / cn-recurrent-homozygous-deletion-supportive, and for
                 # each of those a GoF role reads mixed_pattern rather than a driver verdict.
                 # ★ ONE RUNG IS IN NEITHER ORIGINAL PASS: GoF + cn-recurrent-homozygous-deletion-supportive →
                 # mixed_pattern (priority 34). 1.9.0/CASE-028 never saw that predicate (this branch introduces
                 # it), so the asymmetry is EXTENDED to it here by the same argument — a biallelic deep deletion
