                 # FGFR2/STAD, a focal-AMPLIFICATION target in gastric, read `confirmed_driver` driven by
                 # cn-recurrently-deleted-supportive. (b) FUSION arm: the TOP fusion rung now requires
                 # fusion-recurrence-high-partner-context, so a moderate_promiscuous call (the card's own
                 # self-declared MIXED bucket) no longer outranks top-1% patient SNV recurrence — it falls
                 # to a DEMOTED bare-fusion rung (49) below the SNV-recurrence rungs. Panel case:
