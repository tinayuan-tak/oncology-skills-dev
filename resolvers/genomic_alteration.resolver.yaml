                 # missense_dominant_pattern→recurrent_fusion_driver, APC/RB1 multi_class_lof_driver→
                 # confirmed_lof_driver (the multi_class claim rested on the 60%-null deletion arm),
                 # CD19/TACSTD2 multi_class_driver→confirmed_driver. ALK/LUAD (high_recurrent_partner
                 # EML4-ALK) and all 6 controls are unchanged. Those deltas were measured against 1.8.0,
                 # i.e. BEFORE the CASE-028 role asymmetry landed; see the 1.10.0 note for the composed set.
                 # 1.9.0-a 2026-09-12: a CN DELETION is a driver class only for a LoF/neutral role (CASE-028,
                 # genomic-20 panel). GoF+deletion multi_class rungs removed (fall to single-class
                 # confirmed_driver); GoF+deletion confirmed_driver rungs → mixed_pattern (a deletion is not a
                 # GoF mechanism — IDH2/AML read a false confirmed_driver off a passenger cell-line deletion
                 # while SNV was blind).
                 # 1.8.0 2026-09-02: splice_exon_skip_driver rung (CASE-002) — a curated exon-skip driver (METex14)
                 # oncogenic in-indication + live DepMap carriers fires splice-exon-skip-driver-supportive →
                 # splice_exon_skip_driver (priority 36, above drug_response + the variant-class-shape rungs), so a splice-
                 # skipping oncogene reads a driver-class call not a neutral missense_dominant_pattern.
                 # Surgical blast radius (only genes w/ a registered exon-skip event in curated oncogenic scope).
                 # 1.7.0 2026-08-28: subclonal-recurrence guard (distillation assessment change-3, backtest-gated) —
                 # a MEASURED predominantly-subclonal top-1% recurrent SNV with no other corroboration demotes
                 # recurrent_snv_driver → recurrent_snv_subclonal_uncertain (new rung priority 47, via
                 # snv-clonality-subclonal-opposing + snv-recurrence-top-driver-supportive). Clonal/unavailable unaffected.
description: |
  Multi-class genomic-alteration verdict. A Chronos stratified-dependency (any alteration class) is
  the strongest signal and leads the ladder; copy-number and fusion landscape recurrence keep an
  amplification/deletion/fusion-driven target (few mutations) from collapsing to passenger; a typed
  driver role corroborates single- and multi-class driver calls.

resolve:
  # ── 1. Stratified-dependency family (Chronos KO dependency) ──────────────────────────────────────
  #    Leads the ladder so a dependency signal wins first-match over confirmed_driver / multi_class
  #    (both nomination-inert). All four classes reuse the same verdicts; the distinct driving_rule_id
  #    preserves the audit trail of which class drove.
  #    ALL FOUR classes are indication-scope-GATED (scope-coherence Phase 1): each biomarker rung requires
  #    the matching *-indication-scoped-context gate (evidence_scope in {within_indication,
  #    within_indication_mut_vs_pan_wt}), so a pan-lineage-only dependency in a lineage the queried indication
  #    does not belong to no longer earns a biomarker verdict — it falls through to confirmed_driver /
  #    *_dominant_pattern / recurrent_* below.
  #    Every rung lists the gate(s) LAST in when_all_fired and MUST keep driving_rule set explicitly, else the
  #    interpreter's rids[-1] fallback would name the scope gate (not the dependency rule) as the driver.
  #
  #    #8 HYBRID-SCOPE FAIL-OPEN DEMOTION (v1.11.0, content-audit arc, backtest-gated 2026-09-21). The four
  #    *-indication-scoped-context gates admit BOTH within_indication AND the hybrid within_indication_mut_vs_
  #    pan_wt scope (mutant arm indication-native, WT comparator pooled pan-lineage), so BEFORE this change a
  #    STRONG dependency measured at the hybrid scope earned the full biomarker_stratified_dependency dominant
  #    band off weaker (pooled-WT) evidence. FIX (additive — the within-gates and every pre-existing rung are
  #    UNCHANGED): add a matching *-indication-scoped-fallback-context gate per class (fires ONLY on the hybrid
  #    scope) and, ABOVE the strong biomarker rung, a dedicated hybrid-demotion rung {strong dep rule, within
  #    gate, fallback gate} → moderate_biomarker_dependency at priorities 0-3. At hybrid scope BOTH the within
  #    gate and the fallback gate fire, so the demotion rung (min priority) wins over the strong biomarker rung
  #    @4-7 it shadows. A fully within_indication strong dependency lacks the fallback gate, so the demotion
  #    rung misses and the biomarker rung @4-7 stands → keeps biomarker_stratified_dependency. The MODERATE
  #    band @8-11 is UNTOUCHED (its within-gate still admits the hybrid scope), so a moderate dependency at
  #    hybrid scope stays moderate_biomarker_dependency — the fix does NOT silently erase a valid moderate
  #    signal. Inserting the 0-3 demotion band shifted the entire pre-existing ladder (former priorities 0-54)
  #    DOWN by 4 to 4-58; the changelog priority references were updated in step. driving_rule stays the strong
  #    dependency rule (not a scope gate). class tie-break mut>cn>fusion>amp.
  #    #8 HYBRID-SCOPE DEMOTION rungs (priorities 0-3): a STRONG dependency at the hybrid within_indication_
  #    mut_vs_pan_wt scope. Both scope gates fire; this rung outranks the strong biomarker rung @4-7
  #    (min-priority-wins) AND every driver rung @12+ (so a hybrid dependency target that also carries a full
  #    driver signature cannot fail-open UP to confirmed_driver — no clamp layer exists). driving_rule = the
  #    strong dependency rule.
  - {verdict: moderate_biomarker_dependency, when_all_fired: [mutant-strongly-dependent-supportive, mutant-indication-scoped-context, mutant-indication-scoped-fallback-context], driving_rule: mutant-strongly-dependent-supportive, priority: 0}
  - {verdict: moderate_biomarker_dependency, when_all_fired: [cn-amplified-strongly-dependent-supportive, cn-amplified-indication-scoped-context, cn-amplified-indication-scoped-fallback-context], driving_rule: cn-amplified-strongly-dependent-supportive, priority: 1}
  - {verdict: moderate_biomarker_dependency, when_all_fired: [fusion-positive-strongly-dependent-supportive, fusion-positive-indication-scoped-context, fusion-positive-indication-scoped-fallback-context], driving_rule: fusion-positive-strongly-dependent-supportive, priority: 2}
  - {verdict: moderate_biomarker_dependency, when_all_fired: [amp-expr-strongly-dependent-supportive, amp-expr-indication-scoped-context, amp-expr-indication-scoped-fallback-context], driving_rule: amp-expr-strongly-dependent-supportive, priority: 3}
  #    STRONG tier (|delta| >= 0.5) → biomarker_stratified_dependency. A full within_indication strong
  #    dependency (fallback gate absent) lands here; a hybrid strong dependency is intercepted by the 0-3
  #    demotion rung above. Priorities 4-7.
  - {verdict: biomarker_stratified_dependency, when_all_fired: [mutant-strongly-dependent-supportive, mutant-indication-scoped-context], driving_rule: mutant-strongly-dependent-supportive, priority: 4}
  - {verdict: biomarker_stratified_dependency, when_all_fired: [cn-amplified-strongly-dependent-supportive, cn-amplified-indication-scoped-context], driving_rule: cn-amplified-strongly-dependent-supportive, priority: 5}
  - {verdict: biomarker_stratified_dependency, when_all_fired: [fusion-positive-strongly-dependent-supportive, fusion-positive-indication-scoped-context], driving_rule: fusion-positive-strongly-dependent-supportive, priority: 6}
  - {verdict: biomarker_stratified_dependency, when_all_fired: [amp-expr-strongly-dependent-supportive, amp-expr-indication-scoped-context], driving_rule: amp-expr-strongly-dependent-supportive, priority: 7}
  #    MODERATE tier (|delta| 0.2-0.5) → moderate_biomarker_dependency. The within-gate admits the hybrid
  #    scope, so a moderate dependency at EITHER within or hybrid scope resolves here (untouched by #8).
  #    Priorities 8-11.
  - {verdict: moderate_biomarker_dependency, when_all_fired: [mutant-moderately-dependent-supportive, mutant-indication-scoped-context], driving_rule: mutant-moderately-dependent-supportive, priority: 8}
  - {verdict: moderate_biomarker_dependency, when_all_fired: [cn-amplified-moderately-dependent-supportive, cn-amplified-indication-scoped-context], driving_rule: cn-amplified-moderately-dependent-supportive, priority: 9}
  - {verdict: moderate_biomarker_dependency, when_all_fired: [fusion-positive-moderately-dependent-supportive, fusion-positive-indication-scoped-context], driving_rule: fusion-positive-moderately-dependent-supportive, priority: 10}
  - {verdict: moderate_biomarker_dependency, when_all_fired: [amp-expr-moderately-dependent-supportive, amp-expr-indication-scoped-context], driving_rule: amp-expr-moderately-dependent-supportive, priority: 11}

  # ── 2. multi_class_driver — a mutation-class driver AND a copy-number driver ─────────────────────
  #    Requires an alteration-role DRIVER co-signal (gof-supportive OR lof-neutral) so a passenger with
  #    a driver-shaped spectrum + a CN-shape signal falls through to passenger_pattern rather than
  #    reading multi_class. driving_rule = the mutation rule. Both cell-line CN and patient-focal CN
  #    count as the CN driver. Recurrence is deliberately NOT gated on (mutation-hotspot-frequency has a
  #    data_unavailable bin that would demote genuine drivers wherever recurrence is merely unmeasured).
  #    NOTE: multi_class rungs keyed on a mutant-*-dependent rule are intentionally absent — the
  #    stratified-dependency rungs above are a subset of their condition and always win first-match, so
  #    a mutation-DEPENDENCY + CN gene resolves to the biomarker verdict (the nomination-load-bearing one).
  #    A DELETION is a driver CLASS only for a LoF/neutral role (a TSG's mechanism). For a GoF/activating
  #    oncogene the activating mechanism is amplification / mutation / fusion, so a co-occurring
  #    patient-focal or biallelic DELETION is a PASSENGER, not a second driver class — the four GoF+deletion
  #    multi_class rungs are therefore ABSENT (a GoF gene with a mutation driver + a deletion falls through
  #    to the single-class confirmed_driver rung below, crediting only the real class). The GoF+AMPLIFICATION
  #    multi_class rungs remain (amplification IS a GoF mechanism); the LoF+deletion multi_class rungs remain
  #    (deletion IS the TSG mechanism). Surfaced by the genomic-20 panel: FGFR3/BLCA read multi_class_driver
  #    off [missense + a cell-line deletion + GoF role], over-crediting the passenger deletion as a class.
  #    See eval/CASE_LOG CASE-028.
  - {verdict: multi_class_driver, when_all_fired: [mut-lof-dominant-supportive, cn-recurrently-amplified-supportive, alteration-role-gof-driver-supportive], driving_rule: mut-lof-dominant-supportive, priority: 12}
  - {verdict: multi_class_lof_driver, when_all_fired: [mut-lof-dominant-supportive, cn-recurrently-amplified-supportive, alteration-role-lof-driver-neutral], driving_rule: mut-lof-dominant-supportive, priority: 13}
  #    COMPOSED (1.10.0): the deletion twin here is cn-patient-focal-deleted-supportive (the shallow
  #    cn-recurrently-deleted-supportive rung is GONE — 60.1% genome-wide null), and only its LoF form
  #    exists (the GoF form is absent per CASE-028, priority 14/18 deliberately unused).
  - {verdict: multi_class_lof_driver, when_all_fired: [mut-lof-dominant-supportive, cn-patient-focal-deleted-supportive, alteration-role-lof-driver-neutral], driving_rule: mut-lof-dominant-supportive, priority: 15}
  - {verdict: multi_class_driver, when_all_fired: [mut-missense-dominant-supportive, cn-recurrently-amplified-supportive, alteration-role-gof-driver-supportive], driving_rule: mut-missense-dominant-supportive, priority: 16}
  - {verdict: multi_class_lof_driver, when_all_fired: [mut-missense-dominant-supportive, cn-recurrently-amplified-supportive, alteration-role-lof-driver-neutral], driving_rule: mut-missense-dominant-supportive, priority: 17}
  - {verdict: multi_class_lof_driver, when_all_fired: [mut-missense-dominant-supportive, cn-patient-focal-deleted-supportive, alteration-role-lof-driver-neutral], driving_rule: mut-missense-dominant-supportive, priority: 19}
  #    Patient-focal / biallelic CN twins: a mutation-class driver + role that is patient-focal amplified or
  #    homozygously deleted (but cell-line-CN-neutral) also reads multi_class — a rescue, never a downgrade.
  #    GoF+deletion twins are likewise absent (a deletion is a passenger for a GoF gene).
  - {verdict: multi_class_driver, when_all_fired: [mut-lof-dominant-supportive, cn-patient-focal-amplified-supportive, alteration-role-gof-driver-supportive], driving_rule: mut-lof-dominant-supportive, priority: 20}
  - {verdict: multi_class_lof_driver, when_all_fired: [mut-lof-dominant-supportive, cn-patient-focal-amplified-supportive, alteration-role-lof-driver-neutral], driving_rule: mut-lof-dominant-supportive, priority: 21}
  #    COMPOSED (1.10.0): the deletion twin here is the biallelic cn-recurrent-homozygous-deletion-supportive,
  #    LoF form only — the GoF form (priority 22/26) is absent by the same CASE-028 argument.
  - {verdict: multi_class_lof_driver, when_all_fired: [mut-lof-dominant-supportive, cn-recurrent-homozygous-deletion-supportive, alteration-role-lof-driver-neutral], driving_rule: mut-lof-dominant-supportive, priority: 23}
  - {verdict: multi_class_driver, when_all_fired: [mut-missense-dominant-supportive, cn-patient-focal-amplified-supportive, alteration-role-gof-driver-supportive], driving_rule: mut-missense-dominant-supportive, priority: 24}
  - {verdict: multi_class_lof_driver, when_all_fired: [mut-missense-dominant-supportive, cn-patient-focal-amplified-supportive, alteration-role-lof-driver-neutral], driving_rule: mut-missense-dominant-supportive, priority: 25}
  - {verdict: multi_class_lof_driver, when_all_fired: [mut-missense-dominant-supportive, cn-recurrent-homozygous-deletion-supportive, alteration-role-lof-driver-neutral], driving_rule: mut-missense-dominant-supportive, priority: 27}

  # ── 3. confirmed_driver — a single-class driver corroborated by a typed driver role ──────────────
  #    Below multi_class (a dually-altered driver surfaces multi_class first) but above the bare
  #    variant-class-pattern rungs (a role-confirmed driver outranks a mutation-spectrum shape).
  - {verdict: confirmed_driver, when_all_fired: [mut-lof-dominant-supportive, alteration-role-gof-driver-supportive], driving_rule: mut-lof-dominant-supportive, priority: 28}
  - {verdict: confirmed_lof_driver, when_all_fired: [mut-lof-dominant-supportive, alteration-role-lof-driver-neutral], driving_rule: mut-lof-dominant-supportive, priority: 29}
  - {verdict: confirmed_driver, when_all_fired: [mut-missense-dominant-supportive, alteration-role-gof-driver-supportive], driving_rule: mut-missense-dominant-supportive, priority: 30}
  - {verdict: confirmed_lof_driver, when_all_fired: [mut-missense-dominant-supportive, alteration-role-lof-driver-neutral], driving_rule: mut-missense-dominant-supportive, priority: 31}
  - {verdict: confirmed_driver, when_all_fired: [cn-recurrently-amplified-supportive, alteration-role-gof-driver-supportive], driving_rule: cn-recurrently-amplified-supportive, priority: 32}
  - {verdict: confirmed_lof_driver, when_all_fired: [cn-recurrently-amplified-supportive, alteration-role-lof-driver-neutral], driving_rule: cn-recurrently-amplified-supportive, priority: 33}
  #    GoF role + a DELETION as the SOLE altered class is INCOHERENT: a deletion is not the activating
  #    mechanism of an oncogene, so it cannot confirm a GoF driver. It reads mixed_pattern (signals present
  #    — a driver ROLE and a deletion — but no coherent driver call), NOT confirmed_driver, and NOT the bare
  #    recurrent_deletion_driver rescue below (that is for a NO-role deletion of an unknown gene). Surfaced
  #    by the genomic-20 panel: IDH2/AML read confirmed_driver off a cell-line focal DELETION of an
  #    R140/R172-activated gene while its SNV recurrence axis was data_unavailable (the deletion filled the
  #    vacuum). The LoF+deletion twins are the TSG case and stay confirmed_lof_driver. A GoF gene with a real
  #    activating class (missense/amp/fusion) matches one of the higher-priority confirmed rungs FIRST, so
  #    this only catches the deletion-ONLY GoF case. See eval/CASE_LOG CASE-028. driving_rule names the
  #    deletion so the audit trail shows the (uncredited) signal that was present.
  #    COMPOSED (1.10.0): the two deletion predicates below are the ones that survive the specificity pass —
  #    the shallow cn-recurrently-deleted-supportive rung pair is REMOVED outright rather than demoted to
  #    mixed_pattern, because a predicate that fires for 60.1% of all genes should establish no verdict at
  #    all, not a neutral one. Such a target now falls through to tier 7 (mixed/passenger) on its mutation
  #    axis, which is the honest read. The homozygous-deletion GoF rung at 38 is the extension flagged in
  #    the version note.
  - {verdict: mixed_pattern, when_all_fired: [cn-patient-focal-deleted-supportive, alteration-role-gof-driver-supportive], driving_rule: cn-patient-focal-deleted-supportive, priority: 34}
  - {verdict: confirmed_lof_driver, when_all_fired: [cn-patient-focal-deleted-supportive, alteration-role-lof-driver-neutral], driving_rule: cn-patient-focal-deleted-supportive, priority: 35}
  - {verdict: confirmed_driver, when_all_fired: [cn-patient-focal-amplified-supportive, alteration-role-gof-driver-supportive], driving_rule: cn-patient-focal-amplified-supportive, priority: 36}
