# genomic-alteration-profile (genomic gate) verdict resolver — inline→declarative conversion.
#
# Byte-for-byte transcription of skills/genomic-alteration-profile/scripts/run.py::_verdict (the
# inline multi-axis if-chain), proven equivalent across all 2^8 fired-set combinations by the
# pre-swap oracle before the inline logic is deleted (gap #5 discipline).
#
# The genomic verdict is MULTI-AXIS (not a flat ladder): a SNV/indel axis (mutation-priority
# first-match) + a copy-number axis, combined so a target driven by BOTH reads multi_class_driver.
# Expressed here as ORDERED rungs:
#   (1) multi_class = (any mut-driver) AND (any cn-driver) — the CROSS-PRODUCT of the 4 mut-driver
#       rules × 2 cn rules, ordered by mut-priority so the driving_rule is the highest-priority
#       fired mut rule (matches _mutation_verdict's first-match + the inline `return ..., mut_rule`).
#   (2) single mut-driver (mut drives, no cn) — the 4 mut-driver verdicts, mut-priority order.
#   (3) cn-only (cn drives, mut not a driver) — amplified before deleted (matches _cn_driver_fired
#       first-match).
#   (4) mixed/passenger fallback (mut_verdict present but not a driver, no cn).
# CN-only PRECEDES mixed/passenger because the inline `if cn_driver` branch runs before the
# `if mut_verdict is not None` fallback.
#
# GUARDRAIL: pattern-match over fired rule IDs only — no arithmetic (labels live in the cards).
gate: genomic_alteration
version: 1.3.0   # 2026-08-15: Sweep-2 item B — measured-vs-null guard on the passenger fallback (no-mutations × CN-unavailable → insufficient, not passenger_pattern; see rung 4-guard). Verdict-inert to nominations, golden byte-stable.
                #             1.2.0 (2026-08-11): N1 precedence fix (stratified-dependency FIRST; see head of resolve:). Was 1.1.0 T1.1 rename (recurrent_{missense,lof}_driver → *_dominant_pattern),
                #             T1.3 + recurrent_fusion_driver (fusion-landscape mode-gap), T2.4 precedence-by-strength
description: |
  Multi-class genomic-alteration verdict. SNV/indel axis primary (strongest therapeutic signals),
  copy-number layered as a modifier so an amplification/deletion-driven target (few mutations) is
  reported as a CN driver rather than collapsing to passenger. Faithful transcription of the
  former inline _verdict; multi_class = mut-driver AND cn-driver via cross-product rungs.

resolve:
  # (PRECEDENCE FIX, 2026-08-11 code review N1) — STRATIFIED-DEPENDENCY FIRST.
  #   The stratified-dependency family (below, formerly §2) is moved to the TOP of the ladder,
  #   ahead of confirmed_driver (§0) and multi_class_driver (§1). WHY: resolve_verdict is
  #   first-match and emits ONE verdict. confirmed_driver and multi_class_driver carry ZERO weight
  #   in nomination_verdict_gate.yaml (grep: 0 mentions each — display labels only), whereas
  #   biomarker_stratified_dependency is BOTH the veto_suppressor (L145, rescues EGFR/IDH1/FLT3)
  #   AND a `dominant` positive_signal (L249). Ordering confirmed_driver/multi_class ABOVE the
  #   biomarker rungs therefore SILENTLY DROPPED the gate rescue for any dually-evidenced driver
  #   (EGFR/LUAD, BRAF, ERBB2-amp: variant/CN pattern + gof role + Chronos dependency) — the §0
  #   comment's own stated invariant ("biomarker verdicts LEFT UNTOUCHED … swallowing them into
  #   confirmed_driver would silently drop that rescue") was contradicted by the rung ORDER.
  #   The engine has no negation predicate (guardrail), so the fix is precedence: whenever a
  #   Chronos stratified-dependency co-fires it now drives the verdict; a dually-ALTERED gene with
  #   NO dependency signal still reads confirmed_driver/multi_class exactly as before. Verdict-
  #   moving: golden re-baselined in the same commit (confirmed_driver/multi_class → biomarker_*).
  #   -- STRONG tier (|delta| >= 0.5) --
  - {verdict: biomarker_stratified_dependency, when_fired: mutant-strongly-dependent-supportive}
  - {verdict: biomarker_stratified_dependency, when_fired: cn-amplified-strongly-dependent-supportive}
  - {verdict: biomarker_stratified_dependency, when_fired: fusion-positive-strongly-dependent-supportive}
  - {verdict: biomarker_stratified_dependency, when_all_fired: [amp-expr-strongly-dependent-supportive, amp-expr-indication-scoped-context], driving_rule: amp-expr-strongly-dependent-supportive}
  #   -- MODERATE tier (|delta| 0.2-0.5) --
  - {verdict: moderate_biomarker_dependency,   when_fired: mutant-moderately-dependent-supportive}
  - {verdict: moderate_biomarker_dependency,   when_fired: cn-amplified-moderately-dependent-supportive}
  - {verdict: moderate_biomarker_dependency,   when_fired: fusion-positive-moderately-dependent-supportive}
  - {verdict: moderate_biomarker_dependency,   when_all_fired: [amp-expr-moderately-dependent-supportive, amp-expr-indication-scoped-context], driving_rule: amp-expr-moderately-dependent-supportive}

  # (0) CONFIRMED DRIVER (2026-07-22): a driver-establishing signal CORROBORATED by a typed driver
  #     ROLE (OncoKB×IntOGen gof OR lof) — the strongest "real, annotation-backed driver" statement.
  #     DIRECTION-AGNOSTIC: variant-class-pattern and functional-role are orthogonal (TP53 is a LoF
  #     driver that is missense-dominant), so ANY driver signal + ANY direct-driver role confirms.
  #     SCOPE (deliberate, Option-B): confirmation applies ONLY to the driver calls that are NOT
  #     already load-bearing in the nomination gate — recurrent_missense/lof_driver + the CN drivers.
  #     The two BIOMARKER-DEPENDENCY verdicts (mutant-strongly/moderately-dependent) are the gate's
  #     veto-suppressor + dominant positive_signal (EGFR/IDH1/FLT3 rescue, nomination_verdict_gate.yaml
  #     L145/L249). As of the N1 precedence fix (2026-08-11) the stratified-dependency rungs sit ABOVE
  #     this §0 block, so a dually-evidenced gene that ALSO co-fires a dependency resolves to the
  #     biomarker verdict FIRST and confirmed_driver never swallows the rescue. confirmed_driver here
  #     applies only to dually-ALTERED genes with NO co-firing dependency signal.
  #     passenger/data_unavailable roles fire NO rung → never create/downgrade.
  #     8 rungs = {mut-lof, mut-missense, cn-amp, cn-del} × {gof, lof}, mut-priority-ordered.
  # (0) CONFIRMED DRIVER rungs RELOCATED below the multi_class block (2026-08-16 redesign Stage 2
  #     precedence fix): a dually-ALTERED driver (a mut-class AND a cn-class, + a driver role) now
  #     matches a multi_class rung FIRST and surfaces multi_class_driver; a SINGLE-class driver (one
  #     altered class + role) falls through to the relocated confirmed_driver rungs just after §1b.
  #     Fixes the audit finding that EGFR (missense + focal-amp + GoF role) collapsed to confirmed_driver.

  # (1) MULTI-CLASS: any mut-driver AND any cn-driver. Cross-product, mut-priority order.
  #     driving_rule = the mut rule (matches the inline `return "multi_class_driver", mut_rule`).
  #
  #     SHADOWED-DEAD NOTE (2026-08-14 critical-issues sweep): the FOUR rungs whose when_all_fired
  #     includes `mutant-strongly-dependent-supportive` or `mutant-moderately-dependent-supportive`
  #     (the two cn-recurrently pairs at the head of this block + the two cn-patient-focal pairs in the
  #     patient-focal twins below) are UNREACHABLE under the N1 precedence hoist (2026-08-11): the
  #     standalone stratified-dependency rungs at L47/L52 (biomarker_stratified_dependency /
  #     moderate_biomarker_dependency, `when_fired: mutant-*-dependent-supportive`) sit ABOVE this
  #     block, and their condition is a strict SUBSET of these when_all_fired rungs — so first-match
  #     resolves the biomarker verdict FIRST whenever the mut-dependency rule fires, and these
  #     multi_class rungs can never win. This is INTENDED (N1: the biomarker verdict is the gate's
  #     veto-suppressor + dominant positive; multi_class_driver carries zero nomination weight), so the
  #     rungs are retained-but-inert rather than deleted (deletion is verdict-byte-stable but a separate
  #     change). The mut-lof/mut-missense variant-class multi_class rungs below are NOT shadowed (their
  #     rules appear in no earlier rung) and remain reachable — a dually-ALTERED gene with NO co-firing
  #     dependency still reads multi_class_driver as designed.
  - {verdict: multi_class_driver, when_all_fired: [mutant-strongly-dependent-supportive, cn-recurrently-amplified-supportive], driving_rule: mutant-strongly-dependent-supportive}
  - {verdict: multi_class_driver, when_all_fired: [mutant-strongly-dependent-supportive, cn-recurrently-deleted-supportive], driving_rule: mutant-strongly-dependent-supportive}
  - {verdict: multi_class_driver, when_all_fired: [mutant-moderately-dependent-supportive, cn-recurrently-amplified-supportive], driving_rule: mutant-moderately-dependent-supportive}
  - {verdict: multi_class_driver, when_all_fired: [mutant-moderately-dependent-supportive, cn-recurrently-deleted-supportive], driving_rule: mutant-moderately-dependent-supportive}
  # ROLE-GATED (2026-08-16 genomic-redesign Stage 1): multi_class now requires an alteration-role
  # DRIVER co-signal (gof-supportive OR lof-neutral), mirroring the confirmed_driver rungs above — so
  # a PASSENGER with a missense-dominant SHAPE + a CN-shape signal (e.g. CEACAM5 in CRC) no longer
  # reads multi_class_driver; it falls through to passenger_pattern. Genuine multi-class drivers (a
  # driver role + two altered classes) are unchanged. Recurrence is deliberately NOT gated on (§2e:
  # mutation-hotspot-frequency has a data_unavailable bin that would demote real drivers).
  - {verdict: multi_class_driver, when_all_fired: [mut-lof-dominant-supportive, cn-recurrently-amplified-supportive, alteration-role-gof-driver-supportive], driving_rule: mut-lof-dominant-supportive}
  - {verdict: multi_class_driver, when_all_fired: [mut-lof-dominant-supportive, cn-recurrently-amplified-supportive, alteration-role-lof-driver-neutral], driving_rule: mut-lof-dominant-supportive}
  - {verdict: multi_class_driver, when_all_fired: [mut-lof-dominant-supportive, cn-recurrently-deleted-supportive, alteration-role-gof-driver-supportive], driving_rule: mut-lof-dominant-supportive}
  - {verdict: multi_class_driver, when_all_fired: [mut-lof-dominant-supportive, cn-recurrently-deleted-supportive, alteration-role-lof-driver-neutral], driving_rule: mut-lof-dominant-supportive}
  - {verdict: multi_class_driver, when_all_fired: [mut-missense-dominant-supportive, cn-recurrently-amplified-supportive, alteration-role-gof-driver-supportive], driving_rule: mut-missense-dominant-supportive}
  - {verdict: multi_class_driver, when_all_fired: [mut-missense-dominant-supportive, cn-recurrently-amplified-supportive, alteration-role-lof-driver-neutral], driving_rule: mut-missense-dominant-supportive}
  - {verdict: multi_class_driver, when_all_fired: [mut-missense-dominant-supportive, cn-recurrently-deleted-supportive, alteration-role-gof-driver-supportive], driving_rule: mut-missense-dominant-supportive}
  - {verdict: multi_class_driver, when_all_fired: [mut-missense-dominant-supportive, cn-recurrently-deleted-supportive, alteration-role-lof-driver-neutral], driving_rule: mut-missense-dominant-supportive}
  # PATIENT-FOCAL CN multi-class twins (mut-driver AND patient-focal-cn-driver → multi_class_driver,
  # same as mut AND cell-line-cn). ADDITIVE: a mut-driver that is ALSO patient-focal-amplified/deleted
  # (but cell-line-CN-neutral) now reads multi_class_driver instead of single mut-driver — a rescue,
  # never a downgrade. driving_rule = the mut rule (matches the cell-line multi-class convention).
  - {verdict: multi_class_driver, when_all_fired: [mutant-strongly-dependent-supportive, cn-patient-focal-amplified-supportive], driving_rule: mutant-strongly-dependent-supportive}
  - {verdict: multi_class_driver, when_all_fired: [mutant-strongly-dependent-supportive, cn-patient-focal-deleted-supportive], driving_rule: mutant-strongly-dependent-supportive}
  - {verdict: multi_class_driver, when_all_fired: [mutant-moderately-dependent-supportive, cn-patient-focal-amplified-supportive], driving_rule: mutant-moderately-dependent-supportive}
  - {verdict: multi_class_driver, when_all_fired: [mutant-moderately-dependent-supportive, cn-patient-focal-deleted-supportive], driving_rule: mutant-moderately-dependent-supportive}
  - {verdict: multi_class_driver, when_all_fired: [mut-lof-dominant-supportive, cn-patient-focal-amplified-supportive, alteration-role-gof-driver-supportive], driving_rule: mut-lof-dominant-supportive}
  - {verdict: multi_class_driver, when_all_fired: [mut-lof-dominant-supportive, cn-patient-focal-amplified-supportive, alteration-role-lof-driver-neutral], driving_rule: mut-lof-dominant-supportive}
  - {verdict: multi_class_driver, when_all_fired: [mut-lof-dominant-supportive, cn-patient-focal-deleted-supportive, alteration-role-gof-driver-supportive], driving_rule: mut-lof-dominant-supportive}
  - {verdict: multi_class_driver, when_all_fired: [mut-lof-dominant-supportive, cn-patient-focal-deleted-supportive, alteration-role-lof-driver-neutral], driving_rule: mut-lof-dominant-supportive}
  - {verdict: multi_class_driver, when_all_fired: [mut-missense-dominant-supportive, cn-patient-focal-amplified-supportive, alteration-role-gof-driver-supportive], driving_rule: mut-missense-dominant-supportive}
  - {verdict: multi_class_driver, when_all_fired: [mut-missense-dominant-supportive, cn-patient-focal-amplified-supportive, alteration-role-lof-driver-neutral], driving_rule: mut-missense-dominant-supportive}
  - {verdict: multi_class_driver, when_all_fired: [mut-missense-dominant-supportive, cn-patient-focal-deleted-supportive, alteration-role-gof-driver-supportive], driving_rule: mut-missense-dominant-supportive}
  - {verdict: multi_class_driver, when_all_fired: [mut-missense-dominant-supportive, cn-patient-focal-deleted-supportive, alteration-role-lof-driver-neutral], driving_rule: mut-missense-dominant-supportive}

  # (1b) CONFIRMED DRIVER (relocated Stage 2) — a SINGLE-class driver (one altered class + a typed
  #      driver role) lands here, AFTER the multi_class block, so a dually-altered driver surfaces
  #      multi_class_driver first. Still ABOVE the §2d/§2e pattern rungs — a role-confirmed driver
  #      outranks a bare mutation-spectrum shape. 8 mut/cn + 4 patient-focal rungs, mut-priority.
  - {verdict: confirmed_driver, when_all_fired: [mut-lof-dominant-supportive, alteration-role-gof-driver-supportive], driving_rule: mut-lof-dominant-supportive}
  - {verdict: confirmed_driver, when_all_fired: [mut-lof-dominant-supportive, alteration-role-lof-driver-neutral], driving_rule: mut-lof-dominant-supportive}
  - {verdict: confirmed_driver, when_all_fired: [mut-missense-dominant-supportive, alteration-role-gof-driver-supportive], driving_rule: mut-missense-dominant-supportive}
  - {verdict: confirmed_driver, when_all_fired: [mut-missense-dominant-supportive, alteration-role-lof-driver-neutral], driving_rule: mut-missense-dominant-supportive}
  - {verdict: confirmed_driver, when_all_fired: [cn-recurrently-amplified-supportive, alteration-role-gof-driver-supportive], driving_rule: cn-recurrently-amplified-supportive}
  - {verdict: confirmed_driver, when_all_fired: [cn-recurrently-amplified-supportive, alteration-role-lof-driver-neutral], driving_rule: cn-recurrently-amplified-supportive}
  - {verdict: confirmed_driver, when_all_fired: [cn-recurrently-deleted-supportive, alteration-role-gof-driver-supportive], driving_rule: cn-recurrently-deleted-supportive}
  - {verdict: confirmed_driver, when_all_fired: [cn-recurrently-deleted-supportive, alteration-role-lof-driver-neutral], driving_rule: cn-recurrently-deleted-supportive}
  - {verdict: confirmed_driver, when_all_fired: [cn-patient-focal-amplified-supportive, alteration-role-gof-driver-supportive], driving_rule: cn-patient-focal-amplified-supportive}
  - {verdict: confirmed_driver, when_all_fired: [cn-patient-focal-amplified-supportive, alteration-role-lof-driver-neutral], driving_rule: cn-patient-focal-amplified-supportive}
  - {verdict: confirmed_driver, when_all_fired: [cn-patient-focal-deleted-supportive, alteration-role-gof-driver-supportive], driving_rule: cn-patient-focal-deleted-supportive}
  - {verdict: confirmed_driver, when_all_fired: [cn-patient-focal-deleted-supportive, alteration-role-lof-driver-neutral], driving_rule: cn-patient-focal-deleted-supportive}

  # (2) STRATIFIED-DEPENDENCY family — MOVED to the TOP of the ladder (see PRECEDENCE FIX N1 at the
  #     head of `resolve:`). The 8 rungs formerly here now lead the ladder so a Chronos stratified-
  #     dependency wins first-match over confirmed_driver/multi_class (both gate-invisible). Retained
  #     design notes: PRECEDENCE-BY-STRENGTH (T2.4) — all *strongly* rungs precede all *moderately*;
  #     within a tier the class tie-break is mut > cn > fusion > amp-expr. All four classes reuse
  #     biomarker_stratified_dependency / moderate_biomarker_dependency (distinct driving_rule_id
  #     preserves audit). These still outrank the variant-class-PATTERN rungs (2e) and CN-landscape
  #     rungs (3) — a functional dependency test outranks a bare composition/landscape signal.

  # (2d-drug) GENOTYPE x DRUG-RESPONSE biomarker (deferred-c, 2026-08-09) — the PHARMACOLOGICAL sibling
  #     of the stratified-dependency family. Fires a DISTINCT verdict drug_response_biomarker (NEVER
  #     conflated with biomarker_stratified_dependency): drug-sensitivity != CRISPR-KO dependency, so
  #     they must stay separate verdicts. Placed AFTER the stratified-dependency family (the KO-proven
  #     genetic dependency is the more mechanism-anchored call and wins first-match for a dually-
  #     evidenced gene) but BEFORE the bare variant-class-PATTERN rungs (2e) — a pharmacological
  #     biomarker (an actual drug shows genotype-selective activity) outranks a mere mutation-spectrum
  #     composition signal that has no functional test. Only the STRONG class drives a verdict; the
  #     moderate class stays a signal-only facet (necessary-not-sufficient for a nomination tier).
  #     New rule id → NOT in the golden's enumerated set → existing 4096 combos byte-identical (proven
  #     by the golden test); the new verdict is validated by a dedicated rescue test.
  - {verdict: drug_response_biomarker, when_fired: mutation-drug-response-strongly-sensitive-supportive}

  # (2e) VARIANT-CLASS PATTERN (mutation-spectrum composition, NO dependency test) — RENAMED T1.1
  #      (2026-08-09): recurrent_lof_driver -> lof_dominant_pattern, recurrent_missense_driver ->
  #      missense_dominant_pattern. HONESTY FIX: these fire from mutation-type-counts variant-CLASS
  #      dominance (>=70% missense / >=50% truncating among coding variants in >=5 cell lines) — they
  #      measure the SHAPE of the mutation spectrum, NOT patient RECURRENCE. The old "recurrent_*_driver"
  #      names over-claimed a recurrence signal the card never computes. Real MC3/GENIE recurrence lives
  #      in mutation-hotspot-frequency::driver_recurrence_class, which carries a data_unavailable bin —
  #      GATING the driver call on it would silently demote genuine drivers wherever recurrence is merely
  #      UNMEASURED (the infra-vs-absence trap), so we RENAME to what the signal actually measures rather
  #      than false-gate. "recurrent" is now reserved for the signals that literally COUNT sample
  #      recurrence (cn-recurrently-*, and the new fusion-landscape driver at 3c). Placed AFTER the
  #      dependency family (a Chronos dependency outranks a bare composition pattern) and BEFORE the
  #      CN-landscape rungs. VERDICT-STRING rename only — logic + driving_rule + precedence unchanged.
  - {verdict: lof_dominant_pattern,       when_fired: mut-lof-dominant-supportive}
  - {verdict: missense_dominant_pattern,  when_fired: mut-missense-dominant-supportive}

  # (3) CN-ONLY (cn drives, mutation not a driver) — amplified before deleted (first-match parity).
  - {verdict: recurrent_amplification_driver,  when_fired: cn-recurrently-amplified-supportive}
  - {verdict: recurrent_deletion_driver,       when_fired: cn-recurrently-deleted-supportive}
  # (3b) PATIENT-FOCAL CN-ONLY (consensus): a target that is patient-focal-amplified/deleted but
  #      cell-line-CN-neutral + not a mut-driver. Placed AFTER the cell-line CN-only rungs so cell-line
  #      wins first-match when BOTH fire (existing calls byte-stable); this only adds NEW rescues (the
  #      ERBB2/BRCA case: cell-line broadly_neutral, no mut-driver, patient recurrent_focal_amplification).
  - {verdict: recurrent_amplification_driver,  when_fired: cn-patient-focal-amplified-supportive}
  - {verdict: recurrent_deletion_driver,       when_fired: cn-patient-focal-deleted-supportive}

  # (3c) FUSION-LANDSCAPE RECURRENT DRIVER (T1.3, 2026-08-09) — the MODE-GAP fix. A recurrent patient
  #      fusion/rearrangement (fusion-rearrangement-landscape::fusion_class == recurrent_fusion_driver:
  #      >=3 samples partner-or-target recurrence, TCGA-consensus 3-caller + GENIE SV) is a bona-fide
  #      oncogenic DRIVER event — the fusion analog of recurrent focal amplification. NEW verdict
  #      recurrent_fusion_driver (mirrors recurrent_amplification_driver: a landscape-recurrence driver,
  #      NOT a nominating positive_signal — nomination_verdict_gate.yaml unchanged, same as the amp/del
  #      landscape verdicts). Placed in the LANDSCAPE tier AFTER the CN-only rungs (a gene both
  #      recurrently amplified AND fused — rare — names the CN path first, byte-stable) and BEFORE the
  #      mixed/passenger fallback. Closes the gap where a fusion-driven oncogene with NO DepMap line (or
  #      a line-poor tissue) collapsed to passenger/insufficient despite clear patient recurrence
  #      (EWSR1-FLI1, BCR-ABL1, EML4-ALK) — the exact gap the ERBB2/MYC CN reframe fixed for amplification.
  - {verdict: recurrent_fusion_driver,         when_fired: fusion-landscape-recurrent-driver-supportive}

  # (4-guard) MEASURED-vs-NULL admissibility guard for the passenger fallback (Sweep-2 item B,
  #      2026-08-15). `passenger_pattern` (below) is a SUBSTANTIVE "not a driver" statement, but its
  #      trigger `mut-no-mutations-neutral` fires on a RARELY-MUTATED gene (<5 mutated lines) whose own
  #      rule rationale states it "adds no signal — other threads (dependency, expression, COPY NUMBER)
  #      carry the call." When the copy-number axis is ALSO not measured (copy-number-distribution reads
  #      data_unavailable → `cn-data-unavailable-insufficient` fires), collapsing to passenger_pattern
  #      asserts "not a driver" from a DOUBLE data-gap — the exact mutation-only failure mode the
  #      2026-07-14 amplification reframe was built to kill (an amp-driven gene with unmeasured CN, e.g.
  #      an oncogene absent from the DepMap CN matrix, would read a substantive passenger). The engine has
  #      no negation predicate, so the guard is precedence: when a CN-unavailable signal co-fires with the
  #      no-mutations neutral, resolve to `insufficient` (an HONEST coverage gap) instead of passenger_pattern.
  #      Placed ABOVE the passenger rung so first-match intercepts. NARROW by design: it fires ONLY on the
  #      no-mutations × CN-unavailable co-fire — a MEASURED-neutral CN (broadly_neutral) + no mutations
  #      still reads passenger_pattern (that IS an informative not-a-driver call; see the copy-number card
  #      design note), and any real driver/dependency/fusion rung above still wins first-match. Verdict-
  #      inert to nominations: passenger_pattern and insufficient are BOTH zero-weight in
  #      nomination_verdict_gate.yaml (neither gates, suppresses, nor scores a positive) and the genomic
  #      replay drift-guard already treats them as the SAME collapsed state — this only sharpens the
  #      verdict STRING from a false "not a driver" to an honest "insufficient" + names the CN gap as the
  #      provenance anchor. `insufficient` is the resolver's existing default token (no new verdict). The
  #      new rung's condition includes `cn-data-unavailable-insufficient`, which the resolver golden's
  #      enumerated rule-set does not span, so all existing enumerated combos stay byte-identical.
  - {verdict: insufficient, when_all_fired: [mut-no-mutations-neutral, cn-data-unavailable-insufficient], driving_rule: cn-data-unavailable-insufficient}

  # (4) FALLBACK: mutation axis said something non-driver (mixed / passenger), no cn.
  - {verdict: mixed_pattern,      when_fired: mut-mixed-neutral}
  - {verdict: passenger_pattern,  when_fired: mut-no-mutations-neutral}

default: insufficient
