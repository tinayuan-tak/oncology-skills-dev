# surface-modality-fit (Gate F/E2) verdict resolver (gap #5, 2026-07-20).
# Declarative transcription of skills/surface-modality-fit/scripts/run.py::_verdict
# (incl. the C2 modality_ambiguous branch added 2026-07-20). Resolves from the composed
# adc-tce-modality-fit fit_class rules.
#
# SAFETY/DENSITY INTEGRATION (v1.1.0, 2026-08-09) — the modality-fit review found the verdict
# keyed ONLY on fit_class (topology+family), so the surface cards' KILLER/downgrade signals
# (essential-normal-tissue TCE safety, protein-absence, MEASURED low density, dominant shed) fired
# into the narrative but could NOT move the verdict — a gut-toxic TCE antigen with nice topology read
# `both_viable`. The framework's own calibration set graded all 11 biologics anchors
# `deciding_axis_coverage: blind`. These combination rungs (when_all_fired: fit-positive AND a
# liability rule) let the established, cited-threshold liabilities refine the call. Idiomatic:
# mirrors genomic_alteration's multi_class cross-product; pattern-matches fired rule IDs only.
#
# DESIGN PRINCIPLES (verified against the cards + the CD19/CEACAM5 counterexamples):
#   - MODALITY-SPECIFIC, not blanket. The essential-normal-tissue + sc-normal killers are bite_tce-ONLY
#     (TCE has no payload buffer; ADC/antibody get opposing, not killer) — so they DROP the TCE arm but
#     PRESERVE ADC (CEACAM5 = validated ADC target w/ normal-gut expression must survive).
#   - protein ihc-not-detected kills BOTH arms (no surface substrate) → neither_viable.
#   - MEASURED (grade A/B) below-TCE-floor density is a DOWNGRADE, NEVER a veto — CD19 = 110 copies/cell
#     yet a validated CAR-T/TCE antigen (high-avidity binders work below the soluble-TCE floor). The
#     density_floor_verdict field is grade-gated at source (_live_readers.py:1046 → unmeasured on grade E),
#     so an unmeasured target abstains and is never downgraded.
#   - dominant shed ectodomain (clinically_shed) is an ADC/antibody caveat (soluble decoy sink).
#   - All new verdicts are NON-NOMINATING foreclosure/caveat refinements (like the existing
#     neither_viable) → nomination_verdict_gate.yaml is UNCHANGED.
gate: surface_modality
version: 1.2.0   # 2026-08-24: promote modality-therapeutic-window essential_tissue_liability (SAFETY) + the
                # single-cell tce_antigen_escape_class escape_risk_high (EFFICACY, new adc_preferred_tce_escape_risk
                # / tce_escape_risk verdicts) to verdict-movers (druggability audit). 1.1.0 (2026-08-09):
                # safety/density/shed combination rungs (modality-fit review C1 + density-integrity).
description: Biologics surface-modality fit precedence (from adc-tce-modality-fit fit_class + safety/density/shed liabilities + therapeutic-window safety + single-cell TCE antigen-escape efficacy).
resolve:
  # (0) HARD ABSENCE — no protein-level surface substrate → both ADC + TCE dead. Highest precedence:
  #     an absent antigen forecloses every biologics mechanism regardless of topology favorability.
  - {verdict: neither_viable, when_all_fired: [both-viable-supportive, ihc-not-detected-killer],  driving_rule: ihc-not-detected-killer}
  - {verdict: neither_viable, when_all_fired: [adc-preferred-supportive, ihc-not-detected-killer], driving_rule: ihc-not-detected-killer}
  - {verdict: neither_viable, when_all_fired: [tce-preferred-supportive, ihc-not-detected-killer], driving_rule: ihc-not-detected-killer}

  # (1) TCE-UNSAFE ON NORMAL-TISSUE SAFETY (bite_tce-only killers) — DROP the TCE arm, PRESERVE ADC.
  #     A both_viable target with an essential-normal-tissue (HPA IHC) or sc-normal HIGH_LIABILITY read
  #     collapses to ADC-favored-TCE-unsafe (TROP2/HER2-class normal tox; CEACAM5 ADC survives because
  #     the killer is bite_tce-ONLY). A TCE_preferred target with the same liability has no safe arm left
  #     → tce_unsafe_normal_liability.
  - {verdict: adc_preferred_tce_unsafe, when_all_fired: [both-viable-supportive, normal-tissue-essential-bite-killer], driving_rule: normal-tissue-essential-bite-killer}
  - {verdict: adc_preferred_tce_unsafe, when_all_fired: [both-viable-supportive, sc-normal-high-liability-bite-killer], driving_rule: sc-normal-high-liability-bite-killer}
  - {verdict: tce_unsafe_normal_liability, when_all_fired: [tce-preferred-supportive, normal-tissue-essential-bite-killer], driving_rule: normal-tissue-essential-bite-killer}
  - {verdict: tce_unsafe_normal_liability, when_all_fired: [tce-preferred-supportive, sc-normal-high-liability-bite-killer], driving_rule: sc-normal-high-liability-bite-killer}

  # (1b) TCE-UNSAFE ON THERAPEUTIC-WINDOW (SAFETY, bite_tce-only) — the modality-therapeutic-window
  #      essential_tissue_liability signal (an essential normal organ exceeds the strict 1.0-TPM tier
  #      even when the tumor window RATIO is large — the CEACAM5 ~558x-window-yet-lung-positive pattern).
  #      Promoted to a verdict-mover 2026-08-24 (modality-fit audit): previously it fired into the
  #      narrative only. Same SAFETY semantics as the normal-tissue killers — DROP the TCE arm, PRESERVE
  #      ADC (moderate-tier bystander buffer tolerates essential expression; adc:neutral in the rule).
  - {verdict: adc_preferred_tce_unsafe,    when_all_fired: [both-viable-supportive, modality-window-essential-liability-tce-opposing], driving_rule: modality-window-essential-liability-tce-opposing}
  - {verdict: tce_unsafe_normal_liability, when_all_fired: [tce-preferred-supportive, modality-window-essential-liability-tce-opposing], driving_rule: modality-window-essential-liability-tce-opposing}

  # (1c) TCE ANTIGEN-ESCAPE (EFFICACY, bite_tce-only) — within-tumor antigen-low escape reservoir from the
  #      single-cell tce_antigen_escape_class (coverage x inter-donor consistency; escape_risk_high). This
  #      is an EFFICACY foreclosure of the TCE arm (antigen-low malignant cells survive redirected killing),
  #      DISTINCT from the normal-tissue/window SAFETY killers above — hence its OWN verdicts. Ranks BELOW
  #      the safety rungs (a safety foreclosure is the more fundamental call when both fire) and ABOVE the
  #      density/shed caveats (a TCE-arm drop is stronger than a viability-preserving caveat). ADC is
  #      heterogeneity-tolerant (bystander payload), so ADC is preserved. Promoted 2026-08-24 (audit): the
  #      superior escape model already shipped in the card's stats.py but fired into the narrative only.
  - {verdict: adc_preferred_tce_escape_risk, when_all_fired: [both-viable-supportive, sc-antigen-escape-high-tce-opposing], driving_rule: sc-antigen-escape-high-tce-opposing}
  - {verdict: tce_escape_risk,               when_all_fired: [tce-preferred-supportive, sc-antigen-escape-high-tce-opposing], driving_rule: sc-antigen-escape-high-tce-opposing}

  # (2) MEASURED LOW DENSITY — DOWNGRADE, NEVER VETO (CD19 trap). Grade-A/B below-TCE-floor only
  #     (density_floor_verdict is grade-gated at source). A topology-viable target whose MEASURED
  #     absolute density sits below the soluble-TCE floor is caveated, not killed.
  - {verdict: surface_viable_density_caveated, when_all_fired: [both-viable-supportive, surface-density-below-tce-floor-measured-downgrade], driving_rule: surface-density-below-tce-floor-measured-downgrade}
  - {verdict: surface_viable_density_caveated, when_all_fired: [tce-preferred-supportive, surface-density-below-tce-floor-measured-downgrade], driving_rule: surface-density-below-tce-floor-measured-downgrade}
  - {verdict: surface_viable_density_caveated, when_all_fired: [adc-preferred-supportive, surface-density-below-tce-floor-measured-downgrade], driving_rule: surface-density-below-tce-floor-measured-downgrade}

  # (3) DOMINANT SHED ECTODOMAIN — soluble-decoy-sink caveat for antibody-based modalities.
  - {verdict: shed_dominant_opposed, when_all_fired: [both-viable-supportive, shed-ectodomain-clinical-opposing], driving_rule: shed-ectodomain-clinical-opposing}
  - {verdict: shed_dominant_opposed, when_all_fired: [adc-preferred-supportive, shed-ectodomain-clinical-opposing], driving_rule: shed-ectodomain-clinical-opposing}
  - {verdict: shed_dominant_opposed, when_all_fired: [tce-preferred-supportive, shed-ectodomain-clinical-opposing], driving_rule: shed-ectodomain-clinical-opposing}

  # (4) PLAIN fit_class rungs (topology+family gate) — unchanged; the byte-stable base ladder. Reached
  #     when no liability combination above fires (first-match).
  - verdict: adc_preferred
    when_fired: adc-preferred-supportive
  - verdict: tce_preferred
    when_fired: tce-preferred-supportive
  - verdict: both_viable
    when_fired: both-viable-supportive
  - verdict: neither_viable
    when_fired: neither-viable-killer
  - verdict: isoform_dependent_undefined
    when_fired: isoform-dependent-modality-suppression
  - verdict: modality_ambiguous
    when_fired: modality-ambiguous-insufficient
default: insufficient
