# mechanism-and-pharmacology (Gate D) verdict resolver (gap #5, 2026-07-20).
# Declarative transcription of skills/mechanism-and-pharmacology/scripts/run.py::_verdict.
# NETWORK SHAPE resolves BEFORE the PD-marker flag (2026-07-17): has_pd_marker fires
# whenever >=1 downstream effector exists, which is also true for sparse/partial networks —
# so if it outranked sparse, a sparse network with any PD marker would bury the sparse
# OPPOSING warning. Network shape is the primary read; the PD marker is a secondary
# annotation. This ordering is exactly why the visible precedence ladder matters.
gate: mechanism
version: 1.0.0
description: Signaling-network mechanism precedence — network shape before PD-marker flag.
resolve:
  - verdict: well_characterized
    when_fired: mechanism-well-characterized-supportive
  - verdict: partial
    when_fired: mechanism-partial-neutral
  - verdict: sparse
    when_fired: mechanism-sparse-warning
  - verdict: has_pd_marker
    when_fired: has-pd-marker-supportive
  - verdict: data_unavailable
    when_fired: mechanism-data-unavailable-insufficient
default: insufficient
