# Dependency gate verdict resolver (gap #5, 2026-07-20).
#
# Declarative transcription of skills/functional-requirement/scripts/run.py::_verdict.
# Precedence is the explicit `priority:` field, LOWEST WINS — rung ORDER in this list is
# irrelevant (_skills_common/resolver.py returns the matching rung of MINIMUM priority; R6
# order-independence). The list is nonetheless kept in roughly-descending-precedence order,
# and grouped by theme, for readability; where the two diverge, `priority:` is the truth.
# LAYOUT (2026-09-12): every `priority:` now sits IMMEDIATELY UNDER its own `- verdict:`.
# It previously trailed the rung's other keys, so it read as if it belonged to the NEXT
# rung — an off-by-one-rung trap for anyone editing precedence (`priority: 17` sat under
# the `default:` comment). Placement only; the priority↔rung binding is unchanged.
#
# This is the framework's hardest-won, most opinionated dependency biology, now VISIBLE and
# PR-reviewable instead of buried in a per-skill if-chain. A single shared interpreter
# (_skills_common/resolver.py) evaluates it; the golden-oracle migration asserts this spec ==
# the Python _verdict byte-for-byte (verdict + driving_rule_id) across the calibration set.
#
# GUARDRAIL: pattern-matching over fired rule IDs ONLY. The two admissibility guards
# (underpowered pan-essential, underpowered non-dependent) and the paralog suppressor are
# all expressed as rung ordering + when_all_fired — NO arithmetic here (the floors live in
# the analysis-methods classifier; the labels live in the cards).

gate: dependency
version: 1.4.0   # 1.4.0 (2026-09-12): MEASURED-POSITIVE-OVER-AMBIGUITY precedence fix. The four
                #        partner_conditional_dependent rungs move from 11-14 to 8-11, above
                #        non_dependent_paralog_buffered (12), discordant (13) and
                #        insufficient_underpowered (14). Surfaced by the FR 20-target literature panel:
                #        PRMT5/MESO fired BOTH concordance-discordant-warning AND a partner
                #        stratification at q=4.6e-24 over n_partner_deficient=392 — the strongest
                #        measured signal on the panel — and the resolver returned `discordant`,
                #        discarding it. `discordant` only means the two POOLED channels (CRISPR vs
                #        RNAi) disagree, which is the EXPECTED signature of a conditional dependency
                #        (each pooled median depends on how many partner-deficient lines the screen
                #        happens to contain); it is not evidence against the stratified measurement.
                #        The rung-7 comment's own justification for outranking a pooled negative
                #        ("the pooled call is the false-negative-prone one") applies with MORE force
                #        here. VERDICT-MOVING → golden snapshot regenerated. GATE CONSEQUENCE, stated
                #        deliberately: `discordant` is a positive_contradiction AND a kill_capable
                #        contradiction, while partner_conditional_dependent is a DOMINANT
                #        positive_signal, so an affected package drops a contradiction and gains a
                #        dominant positive — enough (with one supportive dimension) to reach `strong`
                #        and therefore `nominate`. That is the intended reading for the anchor cases
                #        (PRMT5 in MTAP-deleted MESO, WRN×MSI); it is licensed by the two
                #        partner-conditional rules' own q<alpha requirement, which is why they may also
                #        outrank insufficient_underpowered — that verdict is a statement about the
                #        POOLED cohort's power, not about the stratified test, which cleared
                #        significance on its own n.
                # 1.3.0 / 1.2.0 (2026-08-08): RNAi-asymmetry fix — RNAi-alone can no longer fire pan_essential_killer
                #        (rung 2) or selective_dependent (rung 5). Both now require CRISPR (RNAi seed-effect
                #        false-positive risk); honors the two RNAi rules' own "needs CRISPR cross-check"
                #        rationales + the "CRISPR-beats-RNAi" invariant. VERDICT-MOVING → golden snapshot regenerated.
                # 1.1.0: + exhaustiveness/provenance rung for data-unavailable calls (verdict unchanged; driving_rule_id no longer null on a measured coverage gap)
description: |
  Dependency (Gate C) verdict precedence. Both admissibility guards
  (common_essential_underpowered top-rail, non_dependent_underpowered bottom-rail) and
  the paralog veto-suppressor (compound: non-dependent-killer AND strong paralog buffer)
  are encoded as ordered rungs, so an underpowered or buffered pooled call NEVER reaches
  the gate veto. CRISPR-beats-RNAi and suppressor-before-veto are the load-bearing
  precedence, now legible.

resolve:
  # Pan-essential ADMISSIBILITY guard — BEFORE the pan-essential killer (H fix): a
  # >=85% call on an underpowered panel is a tiny-panel artifact, escapes the veto.
  - verdict: insufficient_underpowered_pan_essential
    priority: 0
    when_any_fired:
      - common-essential-underpowered-insufficient
      - rnai-common-essential-underpowered-insufficient

  # pan_essential_killer — CRISPR-DRIVEN only (2026-08-08 RNAi-asymmetry fix). RNAi (DEMETER2) has
  # well-documented seed-effect off-target toxicity → FALSE pan-essential signals, so RNAi-ALONE must
  # not fire a SAFETY killer that would kill an otherwise-selective, druggable target. This honors
  # rnai-pan-essential-killer's OWN rationale ("Cross-check vs CRISPR … if both agree the program is
  # not viable") and the resolver's stated "CRISPR-beats-RNAi" invariant. When CRISPR AND RNAi both
  # read pan-essential, CRISPR's pan-essential-killer fires this rung anyway (agreement is preserved);
  # RNAi-alone pan-essential now falls through (typically to broadly_dependent or insufficient), where
  # its seed-effect risk cannot mask a real selective dependency. See rnai-pan-essential-killer-with-
  # crispr below for the explicit both-agree corroboration path.
  - verdict: pan_essential_killer
    priority: 1
    when_fired: pan-essential-killer

  # Both-agree RNAi pan-essential corroboration: RNAi pan-essential is admissible as a killer ONLY when
  # CRISPR corroborates it is broadly/pan essential (not selective). when_all_fired makes RNAi
  # non-dominant, exactly as its rule rationale requires. (CRISPR pan-essential already fires the rung
  # above; this catches CRISPR broadly-dependent + RNAi pan-essential — a consistent broad-essential
  # picture — without letting RNAi-alone kill.)
  - verdict: pan_essential_killer
    priority: 2
    when_all_fired:
      - rnai-pan-essential-killer
      - broadly-dependent-neutral

  - verdict: concordant_dependent
    priority: 3
    when_fired: concordant-dependent-supportive-dominant

  - verdict: lineage_selective
    priority: 4
    when_fired: lineage-selective-supportive

  # selective_dependent — CRISPR-DRIVEN, OR RNAi-selective WITH CRISPR corroboration (2026-08-08
  # RNAi-asymmetry fix). rnai-strongly-selective-supportive's OWN rationale says "NOT dominant on its
  # own … RNAi-alone signal needs CRISPR cross-check," but the former when_any_fired promoted it to a
  # co-equal driver. Now: CRISPR strongly-selective fires it directly; RNAi strongly-selective fires it
  # ONLY when CRISPR also reads a dependency signal (selective or broadly-dependent) — orthogonal-LOF
  # corroboration, never RNAi-alone. RNAi-selective-alone (CRISPR non-dependent / data-unavailable)
  # falls through rather than minting a selective call on the seed-effect-prone assay.
  - verdict: selective_dependent
    priority: 5
    when_fired: strongly-selective-supportive

  - verdict: selective_dependent
    priority: 6
    when_all_fired:
      - rnai-strongly-selective-supportive
      - broadly-dependent-neutral

  # CHEMICAL-GENETIC confirmation arm (E-PRISM re-home, 2026-07-20). The
  # prism-crispr-concordance card's `triangulated_target_engaged` class (CRISPR AND
  # RNAi dependency BOTH correlate with PRISM compound kill) is chemical+genetic
  # corroboration that the target is REQUIRED — a gate-C dependency signal, not just
  # SM tractability. Reuses the EXISTING rule (e7-triangulated-target-engaged-supportive)
  # rather than a duplicate: one measurement routes many-to-many to gates
  # (CARD_ARCHITECTURE_DECISION) — tractability_sm reads it for `well_covered` (E1: a
  # compound was found), dependency reads it here for confirmed-required (C).
  # POSITIVE-ONLY and veto-safe. Placement is IDENTICAL in kind to the three genetic
  # positives above (concordant/lineage/selective): it sits BELOW pan_essential_killer
  # (a pan-essential target is never rescued by a positive — verified: yields to it) and
  # ABOVE the bottom-rail non_dependent veto — so, exactly like the existing positives, a
  # measured chemical-genetic dependency confirmation outranks a POOLED non-dependence
  # (the pooled call is the false-negative-prone one; if per-line CRISPR+RNAi both track
  # compound kill while the pooled median reads non_dependent, that is the biomarker-
  # dilution pattern the framework already resolves in favor of the measured positive).
  # It can never CREATE a veto: PRISM absence is `no_compounds_found` → neutral, never a
  # killer (not-yet-drugged ≠ undruggable). Ranks BELOW the genetic positives — it
  # CONFIRMS a dependency, it is not a stronger call than a direct genetic dependency.
  - verdict: chemical_genetic_confirmed_dependent
    priority: 7
    when_fired: e7-triangulated-target-engaged-supportive

  # CRISPR-vs-RNAi POOLED disagreement. Deliberately BELOW the four partner-conditional rungs and
  # below non_dependent_paralog_buffered (v1.4.0): this rung reports that the two pooled channels do
  # not agree, which is an absence of resolution, not a measurement against the target. Whenever a
  # rung above it has an actual measurement (a significant partner stratification, a measured paralog
  # buffer), that measurement is the better estimator and the disagreement is usually its expected
  # side-effect. Still ABOVE insufficient_underpowered (a pure power statement) and the veto.
  - verdict: discordant
    priority: 13
    when_fired: concordance-discordant-warning

  # DepMap-power admissibility guard (bottom-rail): below-floor pooled negative
  # contradicted by a concentrated-dependent well-sampled lineage → escapes the veto.
  - verdict: insufficient_underpowered
    priority: 14
    when_fired: non-dependent-underpowered-insufficient

  # Paralog-buffering veto-suppressor (COMPOUND): a pooled non-dependence AND a strong
  # paralog buffer → buffering artifact, escapes the veto. driving_rule names the buffer
  # rule as the provenance anchor (matches the if-chain's return).
  - verdict: non_dependent_paralog_buffered
    priority: 12
    when_all_fired:
      - non-dependent-killer
      - strong-paralog-buffering-degrader-preferred
    driving_rule: strong-paralog-buffering-degrader-preferred

  # Track PC (2026-08-09): PARTNER-CONDITIONAL SL rescue (COMPOUND). A pooled non-dependence AND a
  # significant partner-conditional dependency (partner-deficient cells selectively dependent) → the
  # pooled non_dependent is a context-conditional FALSE NEGATIVE (the target IS required, in the
  # partner-deficient subset). Escapes the veto → distinct verdict partner_conditional_dependent
  # (NOT biomarker_stratified_dependency: partner-SL != own-oncogene addiction). One-directional:
  # rescues a veto, never vetoes. BOTH tiers (strong + moderate) rescue: for partner-conditional SL
  # the MODERATE tier IS the real signal (WRN×MSI = -0.41). driving_rule names the partner rule.
  # Also fires WITHOUT a pooled veto (a partner-conditional dependency is a positive relevance signal
  # in its own right); the bare when_fired rungs catch that case.
  #
  # PRECEDENCE (v1.4.0, 2026-09-12): these four are the highest-priority rungs after the genetic and
  # chemical-genetic positives — they outrank non_dependent (15, the veto they rescue) AND the three
  # rungs that merely FAIL TO RESOLVE a pooled reading: non_dependent_paralog_buffered (12),
  # discordant (13), insufficient_underpowered (14). Ordering principle: a MEASURED, significance-
  # gated positive stratification beats (a) a mechanism-naming explanation of a pooled negative,
  # (b) a disagreement BETWEEN pooled channels, and (c) a statement that the POOLED cohort was
  # underpowered. All three of those are about the pooled scalar, which is definitionally the wrong
  # estimator for a context-conditional dependency; none of them contradicts the stratified test.
  # The two rules require q < alpha, so this rung cannot be reached by an underpowered stratification.
  # paralog_buffered is kept ABOVE discordant for the same reason at lower strength: it at least
  # NAMES a mechanism (a measured buffer) for the pooled negative, where discordant names none.
  - verdict: partner_conditional_dependent
    priority: 8
    when_all_fired:
      - non-dependent-killer
      - partner-conditional-strongly-dependent-supportive
    driving_rule: partner-conditional-strongly-dependent-supportive
  - verdict: partner_conditional_dependent
    priority: 9
    when_all_fired:
      - non-dependent-killer
      - partner-conditional-moderately-dependent-supportive
    driving_rule: partner-conditional-moderately-dependent-supportive
  - verdict: partner_conditional_dependent
    priority: 10
    when_fired: partner-conditional-strongly-dependent-supportive
  - verdict: partner_conditional_dependent
    priority: 11
    when_fired: partner-conditional-moderately-dependent-supportive

  # non_dependent → gate VETO. Only CRISPR non-dependence qualifies (RNAi-only
  # non-dependence is neutral, falls through to insufficient — false-negative-prone).
  - verdict: non_dependent
    priority: 15
    when_fired: non-dependent-killer

  - verdict: broadly_dependent
    priority: 16
    when_any_fired:
      - broadly-dependent-neutral
      - rnai-broadly-dependent-neutral

  # EXHAUSTIVENESS / provenance rung (v1.1.0). A measured `data_unavailable` /
  # partially-assayed call on ANY dependency card is honestly `insufficient` — but WITHOUT
  # this rung it fell through to `default: insufficient` with driving_rule_id=None, so a
  # reviewer could not tell "a card ran and reported no usable data" (coverage gap, named
  # here) from "no dependency rule fired at all" (the card didn't run — still the bare
  # default). Verdict is UNCHANGED (still `insufficient`, F1-safe); this only attaches a
  # provenance anchor. Placed at the BOTTOM (above default): it fires ONLY when no positive,
  # veto, admissibility-guard, or neutral rung above it matched — so it can never outrank a
  # real signal. when_any_fired order = deterministic tie-break; CRISPR (the backbone) first.
  - verdict: insufficient
    priority: 17
    when_any_fired:
      - data-unavailable-insufficient                      # pan-cancer-crispr
      - concordance-partially-assayed-insufficient         # crispr-rnai-concordance (one assay only)
      - concordance-data-unavailable-insufficient          # crispr-rnai-concordance (neither)
      - rnai-data-unavailable-insufficient                 # pan-cancer-rnai
      - lineage-selectivity-data-unavailable-insufficient  # dependency-lineage-selectivity

# default fires ONLY when NOT EVEN a data-unavailable rule fired (i.e. no dependency card
# produced any rule at all) → insufficient with null provenance, the honest "nothing ran" state.
default: insufficient
evaluation: match_all_reduce
