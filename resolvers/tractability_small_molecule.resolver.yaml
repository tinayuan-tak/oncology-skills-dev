# tractability-small-molecule (Gate F / E6-E8) verdict resolver (B3a, 2026-08-06).
# Declarative transcription of skills/tractability-small-molecule/scripts/run.py::_snapshot
# (the 11-rung hand-rolled if-chain — the last modality/gate skill without a declarative resolver).
# Byte-identical to the if-chain: SAME rung ORDER, SAME verdicts, SAME driving_rule_ids (verified by a
# golden-oracle equivalence test enumerating every rule combination). First match wins.
#
# Precedence rationale (unchanged from the if-chain docstring):
#   1. Chemical-genetic (RETROSPECTIVE — a compound actually hit the target) ranks highest.
#   2. An opposing/off-target read (e7-discordant) precedes structural positives — a druggable pocket
#      does not redeem a target whose compound effect is mechanistically unlinked.
#   3. Structural / forward ligandability (E8 — a druggable pocket, no compound yet) ranks BELOW a real
#      chemical hit but ABOVE chemically_unhit (the KRAS-G12C-before-sotorasib case).
#   4. A measured structural NEGATIVE (low-confidence/disordered fold) is an SM-opposing note.
gate: tractability_small_molecule
version: 1.1.0   # +E-known-drug DGIdb pharmacology rungs (approved->chemically_active; category->structurally_ligandable)
description: Small-molecule druggability precedence (chemical-genetic E6/E7 + DGIdb approved-drug > opposing > structural E8 + druggable-category > unhit).
resolve:
  # --- Chemical-genetic (retrospective: a compound was found) ---
  - {verdict: well_covered,                 when_fired: e7-triangulated-target-engaged-supportive}
  - {verdict: chemically_confirmed_genetic, when_fired: e7-crispr-confirmed-supportive-sm}
  - {verdict: chemically_active,            when_fired: prism-clinically-active-supportive-sm}
  # E-known-drug (DGIdb pharmacology leg, 2026-08-07): an APPROVED drug catalogued against the target
  # is retrospective chemical evidence -> chemically_active (SAME verdict as PRISM clinically-active, so
  # it can only RESCUE a target PRISM missed, never change a combo that already returned it). Placed
  # right below the PRISM chemically_active rung (equal tier, drug-catalogue vs cell-line source).
  - {verdict: chemically_active,            when_fired: known-drug-approved-antineoplastic-sm-supportive}
  - {verdict: tool_compound_only,           when_fired: prism-tool-compound-only-weak-supportive-sm}
  - {verdict: weakly_active,                when_fired: prism-weakly-active-weak-supportive-sm}
  # --- Opposing / negative reads (must precede structural positives) ---
  - {verdict: discordant,                   when_fired: e7-discordant-off-target-warning}
  # --- Structural / forward ligandability (E8: druggable pocket, no compound yet) ---
  # E8-lig (composite structure-ligandability-per-protein-v1, 2026-08-07): the LIVE structural
  # leg. A real experimental co-crystal is the STRONGEST forward handle → ranks at the top of the
  # structural tier (above the hotspot-in-predicted-pocket rung; a co-crystal is harder evidence).
  # predicted_ligandable (pocket/VS-hit/cryptic) sits with the existing pocket rungs. All map to
  # the SAME structurally_ligandable verdict, so the ADDITION cannot change any combo that already
  # returned structurally_ligandable — it only rescues combos that previously fell through to
  # chemically_unhit / insufficient (the whole point). Driving-rule id differs (records WHY).
  - {verdict: structurally_ligandable,      when_fired: ligandability-experimental-sm-supportive}
  - {verdict: structurally_ligandable,      when_fired: hotspot-in-druggable-pocket-sm-supportive-e8}
  - {verdict: structurally_ligandable,      when_fired: structure-pocket-adjacent-sm-supportive}
  - {verdict: structurally_ligandable,      when_fired: ligandability-predicted-sm-supportive}
  # E-known-drug (DGIdb): a druggable-CATEGORY membership (CLINICALLY ACTIONABLE / DRUGGABLE GENOME)
  # without an approved drug is a forward druggable-class prior — same tier as a predicted pocket.
  - {verdict: structurally_ligandable,      when_fired: known-drug-druggable-category-sm-supportive}
  - {verdict: structurally_intractable,     when_fired: structure-low-confidence-sm-opposing}
  - {verdict: structurally_intractable,     when_fired: ligandability-disordered-sm-opposing}
  - {verdict: chemically_unhit,             when_fired: prism-no-compounds-found-neutral}
# ligandability-no-evidence-sm-insufficient carries small_molecule:insufficient and maps to the
# `default: insufficient` fallthrough — no explicit rung needed (a coverage gap, never a verdict).
default: insufficient
