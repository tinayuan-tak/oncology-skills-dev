# on-target-safety-liability (Gate F/G) verdict resolver (gap #5, 2026-07-20).
# Declarative transcription of skills/on-target-safety-liability/scripts/run.py::_verdict.
# Germline gnomAD LoF-constraint signal (highly_constrained → hold in the nomination gate).
gate: safety
version: 1.5.0   # 1.5.0 (2026-08-21): DATA-UTILIZATION EXPANSION — 3 new legs wiring already-ingested signals:
                 #   (a) pan_essential_broad_tox_concern (HOLD) from pan-essential-broad-tox-safety-warning
                 #       (DepMap common_essential = broad normal-tissue tox), with a GROUP-0 amplification
                 #       guard + a GROUP-1 mutant-selective downgrade (reuses wt_human_genetics_mechanism_mismatch);
                 #   (b) clingen-recessive-only-safety-favorable → tolerant_reduced_safety_risk, placed ABOVE
                 #       data_unavailable only (recessive-carrier health upgrades "unknown", never overrides a HOLD);
                 #   (c) normal_tissue_protein_safety_concern (HOLD) from normal-tissue-protein-liability-safety-warning
                 #       (HPA-IHC essential-tissue protein = on-target-off-tumor tox for full-KO SM/degrader).
                 # 1.4.0 (2026-08-09): PRECEDENCE FIX — human_genetics_safety_concern (HOLD) hoisted ABOVE
                 #   the SOFT gnomAD rungs (tolerant/moderately/data_unavailable), below highly_constrained.
                 #   It was co-emission-dead: gnomAD emits indeterminate for absent genes → data_unavailable
                 #   fired first → the P5 human-genetics HOLD never fired for its intended population.
                 # 1.3.0 (2026-07-24): + ClinVar germline-pathogenic as a 4th corroborating leg in the
                 #   human_genetics_safety_concern when_any_fired set + its mutant-selective downgrade.
                 # 1.2.0 (2026-07-24): + P5 human-genetics leg (gene-burden / ClinGen-dosage / mouse-KO)
                 #   as a combined concern rung BELOW the gnomAD chain (gnomAD path byte-identical),
                 #   each mechanism-conditioned for GoF drivers like the gnomAD path.
                 # 1.1.0 (2026-07-23): + mutant-selective mechanism-mismatch downgrade (when_all_fired)
description: >
  Germline/population + model safety precedence, mechanism-conditioned for GoF drivers. The gnomAD
  LoF-constraint chain is the dominant leg (unchanged); the P5 human-genetics leg (rare-variant
  burden, ClinGen dosage, mouse-KO) adds a combined concern that fires only when gnomAD is SILENT —
  so the gnomAD resolution is byte-identical, and the new leg extends coverage rather than competing.
resolve:
  # ── GROUP 0: AMPLIFICATION-driven-GoF GUARD (S1-1, cards review 2026-08-17). Must precede the
  #    GROUP-1 mutant-selective downgrades. The GROUP-1 downgrade assumes a GoF oncogene is drugged
  #    MUTANT-SELECTIVELY (spares WT), nullifying a WT-loss safety concern. That FAILS for an
  #    AMPLIFICATION-driven oncogene (ERBB2, MDM2, MYC): the target IS the wild-type protein, so an
  #    ADC / TCE / degrader / WT-hitting inhibitor engages WT in normal tissue and the WT-loss concern
  #    STANDS. When the tumour cohort shows recurrent FOCAL high-level amplification
  #    (copy-number-amplified-oncogene-safety-context) alongside the GoF role rules, we KEEP the
  #    on-target-safety HOLD (the same verdict the plain rungs below emit) instead of downgrading it.
  #    NOTE: this is a strict no-op until the on-target-safety-liability skill composes
  #    copy-number-distribution (the rule only fires when that card is in the skill's fired set), so
  #    non-amplified calibration targets still resolve via GROUP-1 exactly as before.
  - verdict: highly_constrained_safety_concern
    when_all_fired: [highly-constrained-safety-warning, activating-driver-role-safety-context, oncogene-role-safety-context, copy-number-amplified-oncogene-safety-context]
    driving_rule: copy-number-amplified-oncogene-safety-context
  - verdict: human_genetics_safety_concern
    when_all_fired: [gene-burden-lof-safety-warning, activating-driver-role-safety-context, oncogene-role-safety-context, copy-number-amplified-oncogene-safety-context]
    driving_rule: copy-number-amplified-oncogene-safety-context
  - verdict: human_genetics_safety_concern
    when_all_fired: [clingen-dominant-loss-safety-warning, activating-driver-role-safety-context, oncogene-role-safety-context, copy-number-amplified-oncogene-safety-context]
    driving_rule: copy-number-amplified-oncogene-safety-context
  - verdict: human_genetics_safety_concern
    when_all_fired: [mouse-ko-lethal-safety-warning, activating-driver-role-safety-context, oncogene-role-safety-context, copy-number-amplified-oncogene-safety-context]
    driving_rule: copy-number-amplified-oncogene-safety-context
  - verdict: human_genetics_safety_concern
    when_all_fired: [clinvar-germline-pathogenic-safety-warning, activating-driver-role-safety-context, oncogene-role-safety-context, copy-number-amplified-oncogene-safety-context]
    driving_rule: copy-number-amplified-oncogene-safety-context
  # pan-essential broad-tox: an AMPLIFICATION-driven common-essential oncogene is drugged against its
  # WT protein (ADC/TCE/degrader/WT-hitting inhibitor), so the broad-tox concern STANDS — KEEP the HOLD
  # rather than letting the GROUP-1 mutant-selective downgrade below fire.
  - verdict: pan_essential_broad_tox_concern
    when_all_fired: [pan-essential-broad-tox-safety-warning, activating-driver-role-safety-context, oncogene-role-safety-context, copy-number-amplified-oncogene-safety-context]
    driving_rule: copy-number-amplified-oncogene-safety-context

  # ── GROUP 0b: RARELY-ALTERED oncogene guard (2026-08-24, PR-4c). The GROUP-1 mutant-selective
  #    downgrades below assume an activating GoF driver drugged MUTANT-SELECTIVELY (KRAS-G12C, EGFR-
  #    ex19del, IDH1-R132) — those spare the WT protein, so the WT-loss concern is downgraded. But an
  #    oncogene that is `functional_state_class == rarely_altered` (mostly WILD-TYPE across tumors,
  #    an amplification/role-only oncogene with NO recurrent activating point mutation — MCL1) is
  #    drugged by PAN-inhibition against its WT protein, so the WT-loss concern STANDS. Same logic as
  #    the GROUP-0 amplification guard; must precede GROUP-1 (first-match-wins). Reuses the existing
  #    functional-gene-state-rarely-altered-neutral rule (no new rule); a NEGATIVE guard, so mutant-
  #    selective drivers (sporadic_biallelic, not rarely_altered) never match it and keep GROUP-1.
  - verdict: highly_constrained_safety_concern
    when_all_fired: [highly-constrained-safety-warning, activating-driver-role-safety-context, oncogene-role-safety-context, functional-gene-state-rarely-altered-neutral]
    driving_rule: functional-gene-state-rarely-altered-neutral
  - verdict: human_genetics_safety_concern
    when_all_fired: [gene-burden-lof-safety-warning, activating-driver-role-safety-context, oncogene-role-safety-context, functional-gene-state-rarely-altered-neutral]
    driving_rule: functional-gene-state-rarely-altered-neutral
  - verdict: human_genetics_safety_concern
    when_all_fired: [clingen-dominant-loss-safety-warning, activating-driver-role-safety-context, oncogene-role-safety-context, functional-gene-state-rarely-altered-neutral]
    driving_rule: functional-gene-state-rarely-altered-neutral
  - verdict: human_genetics_safety_concern
    when_all_fired: [mouse-ko-lethal-safety-warning, activating-driver-role-safety-context, oncogene-role-safety-context, functional-gene-state-rarely-altered-neutral]
    driving_rule: functional-gene-state-rarely-altered-neutral
  - verdict: human_genetics_safety_concern
    when_all_fired: [clinvar-germline-pathogenic-safety-warning, activating-driver-role-safety-context, oncogene-role-safety-context, functional-gene-state-rarely-altered-neutral]
    driving_rule: functional-gene-state-rarely-altered-neutral
  - verdict: pan_essential_broad_tox_concern
    when_all_fired: [pan-essential-broad-tox-safety-warning, activating-driver-role-safety-context, oncogene-role-safety-context, functional-gene-state-rarely-altered-neutral]
    driving_rule: functional-gene-state-rarely-altered-neutral

  # ── GROUP 1: mutant-selective DOWNGRADES (when_all_fired — most specific, must precede the raw
  #    concerns). A GoF driver drugged mutant-selectively spares the WT protein that EVERY WT-loss
  #    safety signal (gnomAD constraint, rare-variant burden, ClinGen dominant-loss, mouse adult-KO)
  #    concerns. Same mechanism-conditioning as the gnomAD path, one rung per WT-loss warning.
  #    Conditional on an allele-selective modality (a pan-target degrader / WT-hitting inhibitor
  #    re-exposes the concern — stated in each card caveat).

  # gnomAD (2026-07-23) — UNCHANGED, must remain the first downgrade rung (golden byte-stability).
  - verdict: wt_constraint_mechanism_mismatch
    when_all_fired: [highly-constrained-safety-warning, activating-driver-role-safety-context, oncogene-role-safety-context]
    driving_rule: highly-constrained-safety-warning
  # P5 (2026-07-24) — parallel downgrades for the human-genetics warnings.
  - verdict: wt_human_genetics_mechanism_mismatch
    when_all_fired: [gene-burden-lof-safety-warning, activating-driver-role-safety-context, oncogene-role-safety-context]
    driving_rule: gene-burden-lof-safety-warning
  - verdict: wt_human_genetics_mechanism_mismatch
    when_all_fired: [clingen-dominant-loss-safety-warning, activating-driver-role-safety-context, oncogene-role-safety-context]
    driving_rule: clingen-dominant-loss-safety-warning
  - verdict: wt_human_genetics_mechanism_mismatch
    when_all_fired: [mouse-ko-lethal-safety-warning, activating-driver-role-safety-context, oncogene-role-safety-context]
    driving_rule: mouse-ko-lethal-safety-warning
  - verdict: wt_human_genetics_mechanism_mismatch
    when_all_fired: [clinvar-germline-pathogenic-safety-warning, activating-driver-role-safety-context, oncogene-role-safety-context]
    driving_rule: clinvar-germline-pathogenic-safety-warning
  # pan-essential broad-tox downgrade: a mutant-selective agent against an activating driver spares
  # the WT essential protein normal cells depend on. Reuses wt_human_genetics_mechanism_mismatch
  # (a WT-loss concern nullified by allele selectivity — same semantics), keeping the mechanism-
  # mismatch verdict set unchanged. Guarded above by the GROUP-0 amplification rung.
  - verdict: wt_human_genetics_mechanism_mismatch
    when_all_fired: [pan-essential-broad-tox-safety-warning, activating-driver-role-safety-context, oncogene-role-safety-context]
    driving_rule: pan-essential-broad-tox-safety-warning

  # ── GROUP 2a: the DOMINANT gnomAD signal — a strongly LoF-constrained gene is the top raw concern.
  - verdict: highly_constrained_safety_concern
    when_fired: highly-constrained-safety-warning

  # ── GROUP 2a+: measured broad-tox / essential-tissue HOLDs (data-utilization expansion 2026-08-21).
  #    Both are strong MEASURED safety concerns (DepMap pan-essentiality; HPA-IHC essential-tissue
  #    protein). Placed just below the dominant gnomAD signal and above the P5 human-genetics HOLD +
  #    the soft gnomAD rungs. When one co-fires with a genuine downgrade context it is handled by the
  #    GROUP-0/1 rungs above (pan-essential) or stands (normal-tissue: no allele-selective escape).
  - verdict: pan_essential_broad_tox_concern
    when_fired: pan-essential-broad-tox-safety-warning
  - verdict: normal_tissue_protein_safety_concern
    when_fired: normal-tissue-protein-liability-safety-warning

  # ── GROUP 3: the P5 human-genetics COMBINED concern (HOLD). PRECEDENCE FIX (2026-08-09, resolver-
  #    precedence audit): this MUST precede the SOFT gnomAD rungs below (tolerant / moderately /
  #    data_unavailable). PRIOR BUG: it sat BELOW the whole gnomAD chain on the belief that the chain
  #    "goes silent" for a gnomAD-absent gene — but the gnomAD card is NEVER silent: an absent gene
  #    emits constraint_class=indeterminate (a genuine "read-the-table, gene-absent" value, per
  #    gnomad_constraint/read.py), firing constraint-data-unavailable-insufficient → data_unavailable
  #    ABOVE this rung. So human_genetics_safety_concern was CO-EMISSION-DEAD for exactly its intended
  #    population (gene absent-from / tolerant-in gnomAD but carrying a WT-loss human-genetics signal),
  #    silently dropping the HOLD (nomination_verdict_gate.yaml action: hold). A real gene-burden /
  #    ClinGen-dominant-loss / ClinVar-pathogenic / mouse-KO-lethal signal is a STRONGER safety concern
  #    than gnomAD-tolerant/moderate/absent, so it now outranks the soft gnomAD rungs (but still sits
  #    BELOW highly_constrained gnomAD — a strong constraint call dominates). The GROUP-1 mutant-
  #    selective downgrades still precede it (top of file), unchanged. driving_rule attributes the
  #    strongest-tier warning present (gene_burden measured > ClinGen > ClinVar > mouse=inferred).
  - verdict: human_genetics_safety_concern
    when_any_fired: [gene-burden-lof-safety-warning, clingen-dominant-loss-safety-warning, clinvar-germline-pathogenic-safety-warning, mouse-ko-lethal-safety-warning]

  # ── GROUP 2b: the SOFT gnomAD rungs — tolerant / moderately-constrained / indeterminate-or-unreadable.
  #    These are weaker than a real human-genetics WT-loss signal (GROUP 3), so they resolve AFTER it.
  #    A gene with NO human-genetics warning still lands here exactly as before (gnomAD rows unchanged).
  - verdict: tolerant_reduced_safety_risk
    when_fired: tolerant-safety-supportive
  - verdict: moderately_constrained_safety
    when_fired: moderately-constrained-safety-neutral
  # ClinGen recessive-only REASSURANCE (2026-08-21): carriers of a strictly-recessive disease gene are
  # healthy → human-genetics evidence that reduction/full-KO is tolerated. Placed here — below every
  # HOLD and below the tolerant/moderate gnomAD rungs, ABOVE data_unavailable — so it ONLY upgrades the
  # "gnomAD-silent/unreadable" population from "unknown" to "reduced risk", and can never override a
  # real constraint/burden/dominant-loss HOLD. Reuses tolerant_reduced_safety_risk (no new token).
  - verdict: tolerant_reduced_safety_risk
    when_fired: clingen-recessive-only-safety-favorable
  - verdict: data_unavailable
    when_fired: constraint-data-unavailable-insufficient
default: insufficient
