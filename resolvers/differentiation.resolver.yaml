# differentiation-landscape (Gate E) verdict resolver (gap #5, 2026-07-20).
# Declarative transcription of skills/differentiation-landscape/scripts/run.py::_verdict.
# Covers EVERY cooccurrence_class the axis can fire — the canonical silent-fall-through
# skill (ns→insufficient rename bug); the explicit `ns` rung + explicit default are what
# close that decision-layer collapse, now statically checkable by validate_resolvers.
gate: differentiation
version: 1.0.0
description: Co-mutation / mutual-exclusivity precedence (most-informative first).
resolve:
  - verdict: both_patterns_present
    when_fired: cooccurrence-both-patterns-supportive
  - verdict: strong_mutually_exclusive
    when_fired: strong-mutual-exclusivity-supportive
  - verdict: strong_cooccurring
    when_fired: cooccurrence-strong-supportive
  - verdict: has_cooccurring_driver
    when_fired: has-cooccurring-driver-supportive
  - verdict: modest_cooccurring
    when_fired: cooccurrence-modest-cooccurring-neutral
  - verdict: modest_mutually_exclusive
    when_fired: cooccurrence-modest-mutually-exclusive-neutral
  - verdict: ns
    when_fired: cooccurrence-ns-neutral
  - verdict: data_unavailable
    when_fired: cooccurrence-data-unavailable-insufficient
default: insufficient
