[project]
name = "rnd-computational-biology-oncology-analysis-methods"
version = "0.1.0"
description = "Deterministic analytical methods for the Takeda v2 oncology target-evaluation framework."
authors = ["Ryan Abo <rabo@takeda.com>"]
channels = ["conda-forge", "bioconda"]
platforms = ["linux-64"]

[dependencies]
python = ">=3.11,<3.13"
pyarrow = "*"
pandas = "*"
numpy = "*"
pyyaml = "*"
jsonschema = "*"
click = "*"                      # CLI scaffolding for method entrypoints
pytest = "*"
boto3 = "*"                      # S3 client for pull/prep stages
openpyxl = "*"                   # Excel parsing (CPTAC clinical XLSX + SURFY)
plotly = "*"                     # interactive figure specs (emit_plotly_specs → figure_*.plotly.json)
scipy = "*"                      # gaussian_kde for density-plot emitters (expression + protein-abundance)

# R + bioconductor (for dge_deseq2 + cooccurrence_fisher_pancohort + any future R-driven methods)
r-base = ">=4.3"
r-tidyverse = "*"
r-arrow = "*"                    # write parquet from R
r-optparse = "*"                 # CLI arg parsing in R stage scripts
r-devtools = "*"                 # cooccurrence_fisher_pancohort: install DISCOVER from GitHub via setup.R
r-remotes = "*"                  # cooccurrence_fisher_pancohort: devtools 2.5+ delegates install_github to remotes
"r-data.table" = "*"             # cooccurrence_fisher_pancohort: fast MAF parse + binary matrix build
"r-r.utils" = "*"                # cooccurrence_fisher_pancohort: peer dep of data.table for gz reads
r-igraph = "*"                   # cooccurrence_fisher_pancohort: SELECT dependency (Mina 2020)
r-matrix = "*"                   # cooccurrence_fisher_pancohort: SELECT dependency (sparse matrices)
r-matrixstats = "*"              # cooccurrence_fisher_pancohort: SELECT dependency (column-wise stats)
r-foreach = "*"                  # cooccurrence_fisher_pancohort: SELECT dependency (parallel loops)
r-doparallel = "*"               # cooccurrence_fisher_pancohort: SELECT dependency (parallel backend)
bioconductor-birewire = "*"      # cooccurrence_fisher_pancohort: SELECT dependency (bipartite network null model)
bioconductor-deseq2 = "*"
bioconductor-apeglm = "*"        # dge_deseq2: lfcShrink() adaptive-prior shrinkage (03_deseq2.R)
bioconductor-sva = "*"           # combat-seq batch correction
bioconductor-msstatstmt = "*"    # cptac_protein_deg: CPTAC TMT protein DEG with plex-batch mixed model
bioconductor-limma = "*"         # cptac_protein_deg: MSstatsTMT peer dep (eBayes under the hood); ALSO CMScaller dep
bioconductor-biobase = "*"       # subgroup_assigner_classifier (CMS): CMScaller dependency (ExpressionSet/NTP)
scikit-learn = ">=1.9.0,<2"
matplotlib-base = ">=3.11.1,<4"  # headless SVG figure rendering (emit_*_svg / plot_data); -base = no GUI backends

[pypi-dependencies]
# (target_id_resolver itself; installed as editable pip package once carved over)

[tasks]
# Mirrors .github/workflows/methods-validate.yml. --import-mode=importlib is REQUIRED: without it
# the ~21 duplicate test basenames (test_plotly_spec.py, test_render_from_plot_data.py, ...) collide
# on module name and collection aborts, so `pixi run test` could never run the suite CI runs.
test = "pytest methods/ tests/ --import-mode=importlib"
lint = "python -m py_compile $(find methods -name '*.py')"
