[workspace]
authors = ["Ryan Abo <ryan.abo@takeda.com>"]
channels = ["conda-forge", "bioconda"]
name = "rnd-computational-biology-oncology-claude-oncology-skills"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]

# Tier-1 packaging (PR #3): declare the three sibling framework repos as editable
# path-dependencies so the skills' `import methods.*` and (future) contracts-loader
# imports resolve to installed packages, not a sys.path hack. Paths are relative to this
# repo; they assume the canonical side-by-side clone layout. A consumer who clones
# elsewhere can either preserve the relative layout OR keep using the *_ROOT env-var
# fallbacks (the skills still carry those — this is additive). When a hosted index
# (CodeArtifact) is chosen, these become version pins instead of path deps.
[pypi-dependencies]
oncology-analysis-methods = { path = "../rnd-computational-biology-oncology-analysis-methods", editable = true }
oncology-target-contracts = { path = "../rnd-computational-biology-oncology-target-contracts", editable = true }
target-id-resolver = { path = "../rnd-computational-biology-oncology-data-catalog/libs/target_id_resolver", editable = true }
anthropic = ">=1.3.0, <2"

[dependencies]
python = ">=3.14.6,<3.15"
pandas = ">=3.0.3,<4"
scipy = ">=1.17.1,<2"
statsmodels = ">=0.14.6,<0.15"
pyarrow = ">=24.0.0,<25"
s3fs = ">=2026.4.0,<2027"
boto3 = ">=1.43.0,<2"
pyyaml = ">=6.0.3,<7"
jsonschema = ">=4.21,<5"
jupyter = ">=1.1.1,<2"
ipykernel = ">=7.3.0,<8"
pytest = ">=8.0"   # T9 (2026-08-11): declared so `pixi run pytest` works in CI (skills-validate.yml)
# Test-runtime deps the compose-dashboard suite pulls transitively through the method CLIs + figure
# emitters it imports (present in analysis-methods' env locally; must be declared here so the skills
# CI env is a proper superset). 2026-08-11 (T9 CI fix).
click = ">=8.1"      # method CLI entrypoints (methods/*/cli.py)
plotly = ">=5"       # figure emitters — plotly figure specs
openpyxl = ">=3.1"   # Excel parsing (CPTAC clinical XLSX + SURFY) reached by some readers
matplotlib = ">=3.8" # figure emitters — matplotlib-based card figures (e.g. dependency-lineage-selectivity)
numpy = ">=1.26"     # explicit (readers/emitters); previously only transitive via pandas/scipy
# target-archetype's atlas BUILD (scripts/build_atlas.py) imports sklearn.decomposition.PCA to fit the
# frozen linear embedding. Undeclared until 2026-09-13, which meant the freeze was not reproducible in
# this environment AT ALL: `atlas_stability.py --verify-rebuild` — the check that makes a re-freeze diff
# attributable — could only ever run under a system interpreter that happened to have sklearn. The import
# is deliberately kept LOCAL to build() (not module-level) so importing build_atlas for its declarations
# still works without it; declaring it here is what makes the rebuild half of the guard executable.
scikit-learn = ">=1.5"

# R + Bioconductor stack for the batch DGE pipeline (batch/expression_rna_*).
# DESeq2 + apeglm shrinkage on raw integer counts is the field-standard contract
# the Parquet handoff is built around; arrow gives stage 04 native Parquet I/O;
# paws.storage is the actively-maintained S3 client (preferred over aws.s3);
# sva ships ComBat-seq for the joint-source regime (skipped when has_batch=FALSE).
r-base = ">=4.4"
"r-data.table" = ">=1.16"
r-yaml = "*"
r-optparse = "*"
r-arrow = ">=18"
r-digest = "*"
r-biocmanager = "*"
bioconductor-deseq2 = "*"
bioconductor-apeglm = "*"
bioconductor-sva = "*"
bioconductor-biocparallel = "*"
pytest-xdist = ">=3.8.0,<4"
