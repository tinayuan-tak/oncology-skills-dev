[workspace]
authors = ["Ryan Abo <ryan.abo@takeda.com>"]
channels = ["conda-forge", "bioconda"]
name = "rnd-computational-biology-oncology-claude-oncology-skills"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]

# Tier-1 packaging (PR #3): declare the three sibling framework repos as editable
# path-dependencies so the skills' `import methods.*` and (future) contracts-loader
# imports resolve to installed packages, not a sys.path hack. Paths are relative to this
# repo; they assume the canonical side-by-side clone layout. A consumer who clones
# elsewhere can either preserve the relative layout OR keep using the *_ROOT env-var
# fallbacks (the skills still carry those — this is additive). When a hosted index
# (CodeArtifact) is chosen, these become version pins instead of path deps.
[pypi-dependencies]
oncology-analysis-methods = { path = "../rnd-computational-biology-oncology-analysis-methods", editable = true }
oncology-target-contracts = { path = "../rnd-computational-biology-oncology-target-contracts", editable = true }
target-id-resolver = { path = "../rnd-computational-biology-oncology-data-catalog/libs/target_id_resolver", editable = true }

[dependencies]
python = ">=3.14.6,<3.15"
pandas = ">=3.0.3,<4"
scipy = ">=1.17.1,<2"
statsmodels = ">=0.14.6,<0.15"
pyarrow = ">=24.0.0,<25"
s3fs = ">=2026.4.0,<2027"
boto3 = ">=1.43.0,<2"
pyyaml = ">=6.0.3,<7"
jsonschema = ">=4.21,<5"
jupyter = ">=1.1.1,<2"
ipykernel = ">=7.3.0,<8"

# R + Bioconductor stack for the batch DGE pipeline (batch/expression_rna_*).
# DESeq2 + apeglm shrinkage on raw integer counts is the field-standard contract
# the Parquet handoff is built around; arrow gives stage 04 native Parquet I/O;
# paws.storage is the actively-maintained S3 client (preferred over aws.s3);
# sva ships ComBat-seq for the joint-source regime (skipped when has_batch=FALSE).
r-base = ">=4.4"
"r-data.table" = ">=1.16"
r-yaml = "*"
r-optparse = "*"
r-arrow = ">=18"
r-digest = "*"
r-biocmanager = "*"
bioconductor-deseq2 = "*"
bioconductor-apeglm = "*"
bioconductor-sva = "*"
bioconductor-biocparallel = "*"
