# dge_deseq2 indication rosters — single source of truth (S1, analysis-methods #693).
#
# PURE NO-OP consolidation of the rosters previously hard-coded in derive_pancan_stack.py,
# emit_pan_tissue.py, and read/__init__.py. Each consumer reconstructs its prior structure by
# PROJECTION over this file (see config/__init__.py) and is verdict-identical to the pre-S1
# literals; the reconstruction is pinned byte-for-byte by tests/test_indication_config_rosters.py.
#
# The universe below is the UNION of every indication that appeared in ANY of those rosters:
# the 27 PUBLISHED sensitivity products (derive_pancan_stack) plus the read-map-only NSCLC (a
# pooled composite, no standalone product) and PDAC (an alias of PAAD).
#
# Count reconciliation (from the #693 plan-review comment — these are DIFFERENT sets with
# different consumers, NOT one roster counted several ways):
#   * published: true    -> 27  (derive_pancan_stack._PUBLISHED_INDICATIONS universe)
#   * pan_tissue_render   -> 19  (emit_pan_tissue.PAN_TISSUE_INDICATIONS; an old comment said "18")
#   * in_read_map: true   -> 21  (read.INDICATION_TO_TCGA_STUDIES; 20 have a GTEx tissue, HNSC null)
#   * "24" was a STALE changelog vintage note (acb0179, 2026-07-15), never a live roster.
# UNIVERSE EXPANSION toward the "~30" in the issue body (analysis-methods#734, the verdict-diff PR
# of arc #690) proceeds in two phases. Phase 1 (this file's `staged: true` entries) DEFINES the
# target universe with NO compute: candidates go in as published: false + in_read_map: false, so
# they change no projection and no live verdict (see the STAGED block near the bottom). A staged
# entry only becomes verdict-affecting when its flags are FLIPPED -- and that (Phase 2) requires
# BOTH explicit authorization AND domain sign-off on the matched-normal contrast, PLUS a
# before/after verdict diff. So: adding a `staged` candidate here is fine; PUBLISHING one (flipping
# `published`/`in_read_map`) is the gated step that must not happen without sign-off + verdict diff.
#
# Fields per indication:
#   tcga_studies        recount3 TCGA study codes (present iff in_read_map, or recorded on a staged
#                       candidate for the Phase-2 run)
#   gtex_tissue         matched recount3 GTEx tissue code, or null for no clean match (HNSC)
#   published           in the 27 published *-dge-tumor-vs-normal-sensitivity-v1 products
#   in_read_map         exposed via read.INDICATION_TO_{TCGA_STUDIES,GTEX_TISSUE}
#   staged              #734 universe-expansion candidate: defined but NOT yet published
#                       (published: false + in_read_map: false => verdict-inert). Requires a
#                       non-null `caveat`. Consumed by config.staged_indications() only.
#   caveat              matched-normal / contrast confound recorded on a staged candidate; the
#                       domain question that must be signed off before it can be published.
#   composite_children  finer sibling cohorts this OncoTree parent is the union of
#   xena_primary_site   {tcga, gtex} Xena/Toil `_primary_site` label(s) for the xena_toil
#                       substrate (R-side roster consolidation, analysis-methods#733). A
#                       TISSUE-level filter, not a TCGA-study filter (see 00_load_xena_toil.R's
#                       header note): present only for the 15 indications the xena_toil
#                       secondary/diagnostic substrate (S1b #694) actually loads. Xena has no
#                       separate rectum normal, so READ's own gtex site is "Colon" too.
#
# (The per-indication `cell_b_semantics` vintage field was removed in analysis-methods#727
#  when the ComBat-seq cell B was deleted from the four-cell pipeline.)

# Ordered render roster for emit_pan_tissue's pan-indication figure. Order IS the figure row order
# and must be preserved. A subset of the published universe (19 of 27; the 8 rarer
# ACC/KICH/KIRP/PCPG/TGCT/THCA/UCS/UCEC were not produced by the figure batch).
pan_tissue_render:
  - COAD
  - READ
  - COADREAD
  - LUAD
  - LUSC
  - BRCA
  - PAAD
  - SKCM
  - STAD
  - PRAD
  - OV
  - KIRC
  - GBM
  - LGG
  - BLCA
  - LIHC
  - CESC
  - ESCA
  - HNSC

# Run-ledger intent (S5, analysis-methods #698): the roster of dge_deseq2 catalogued derived
# products the batch is INTENDED to have produced, declared per (family x substrate). It is the
# NEW substrate axis the plan-review flagged (the per-indication config above carries no substrate
# dimension). build_run_ledger.py projects this into the expected {catalog_id -> attrs} map and
# reconciles it BIDIRECTIONALLY (mirror derive_pancan_stack.assert_roster_matches_published) against
# (a) the S3 data-catalog/derived/ product prefixes and (b) the derived manifests whose
# `notebook:` is under methods/dge_deseq2/ — reddening on ANY asymmetry (present-not-declared,
# declared-not-present, manifest-without-config). This is a DECLARATION reconciled against actuality,
# NOT the iteration driver: a product present on S3/catalog but absent here still reds (config alone
# never bounds the universe), and a cell declared here but never produced also reds.
#
# recount3 four-cell sensitivity products are the `published: true` indications by projection; the
# extra list adds 06-driver products that ship a sensitivity product WITHOUT a standalone `published`
# flag (NSCLC is the pooled LUAD+LUSC composite — published: false for the pancan stack, yet it has a
# landed sensitivity product on S3). Keeping the two apart is deliberate: the pancan-stack roster
# must NOT gain NSCLC (it would double-count LUAD+LUSC), but the run-ledger universe must include it.
run_ledger_intent:
  sensitivity_recount3_extra: [NSCLC]
  sensitivity_xena_toil: [COADREAD]
  adj_vs_gtex_recount3: [COADREAD]
  adj_vs_gtex_xena_toil: [COADREAD]
  subgroup_recount3: [COADREAD, NSCLC, STAD]
  # Products with no (indication x substrate) axis of their own — declared by explicit id.
  singletons:
    - id: pancan-dge-tumor-vs-normal-v1                 # derive_pancan_stack roll-up
      role: pancan_rollup
      substrate: recount3
    - id: dge-deseq2-qc-index-v1                        # build_qc_index cross-run QC index
      role: qc_index
      substrate: null
    - id: gencode-v26-gene-lengths-union-of-exons-v1    # gene_lengths.py reference input
      role: reference_gene_lengths
      substrate: null

indications:
  # --- in the read maps (21): substrate lookups for INDICATION_TO_{TCGA_STUDIES,GTEX_TISSUE} ---
  COADREAD:
    tcga_studies: [COAD, READ]
    gtex_tissue: COLON
    published: true
    in_read_map: true
    composite_children: [COAD, READ]
    xena_primary_site: {tcga: [Colon, Rectum], gtex: Colon}
  COAD:
    tcga_studies: [COAD]
    gtex_tissue: COLON
    published: true
    in_read_map: true
    xena_primary_site: {tcga: Colon, gtex: Colon}
  READ:
    tcga_studies: [READ]
    gtex_tissue: COLON
    published: true
    in_read_map: true
    xena_primary_site: {tcga: Rectum, gtex: Colon}  # Xena carries no separate rectum normal
  NSCLC:
    tcga_studies: [LUAD, LUSC]  # composite: pooled LUAD+LUSC (study-adjusted DGE, see 06_four_cell_driver.R)
    gtex_tissue: LUNG
    published: false  # pooled composite, no standalone published product
    in_read_map: true
    composite_children: [LUAD, LUSC]  # drop from breadth roll-up when LUAD+LUSC present
  LUAD:
    tcga_studies: [LUAD]
    gtex_tissue: LUNG
    published: true
    in_read_map: true
    xena_primary_site: {tcga: Lung, gtex: Lung}  # tissue-level: conflates LUAD+LUSC
  LUSC:
    tcga_studies: [LUSC]
    gtex_tissue: LUNG
    published: true
    in_read_map: true
    xena_primary_site: {tcga: Lung, gtex: Lung}  # tissue-level: conflates LUAD+LUSC
  BRCA:
    tcga_studies: [BRCA]
    gtex_tissue: BREAST
    published: true
    in_read_map: true
    xena_primary_site: {tcga: Breast, gtex: Breast}
  PAAD:
    tcga_studies: [PAAD]
    gtex_tissue: PANCREAS
    published: true
    in_read_map: true
    xena_primary_site: {tcga: Pancreas, gtex: Pancreas}
  PDAC:
    tcga_studies: [PAAD]  # alias of PAAD
    gtex_tissue: PANCREAS
    published: false  # alias, not a distinct published product
    in_read_map: true
  SKCM:
    tcga_studies: [SKCM]
    gtex_tissue: SKIN
    published: true
    in_read_map: true
    xena_primary_site: {tcga: Skin, gtex: Skin}
  STAD:
    tcga_studies: [STAD]
    gtex_tissue: STOMACH
    published: true
    in_read_map: true
    xena_primary_site: {tcga: Stomach, gtex: Stomach}
  PRAD:
    tcga_studies: [PRAD]
    gtex_tissue: PROSTATE
    published: true
    in_read_map: true
    xena_primary_site: {tcga: Prostate, gtex: Prostate}
  OV:
    tcga_studies: [OV]
    gtex_tissue: OVARY
    published: true
    in_read_map: true
  KIRC:
    tcga_studies: [KIRC]
    gtex_tissue: KIDNEY
    published: true
    in_read_map: true
    xena_primary_site: {tcga: Kidney, gtex: Kidney}  # tissue-level: conflates KIRC/KIRP/KICH
  GBM:
    tcga_studies: [GBM]
    gtex_tissue: BRAIN
    published: true
    in_read_map: true
  LGG:
    tcga_studies: [LGG]
    gtex_tissue: BRAIN
    published: true
    in_read_map: true
  HNSC:
    tcga_studies: [HNSC]
    gtex_tissue: null  # no clean GTEx match -> deliberately absent from INDICATION_TO_GTEX_TISSUE
    published: true
    in_read_map: true
  BLCA:
    tcga_studies: [BLCA]
    gtex_tissue: BLADDER
    published: true
    in_read_map: true
    xena_primary_site: {tcga: Bladder, gtex: Bladder}
  LIHC:
    tcga_studies: [LIHC]
    gtex_tissue: LIVER
    published: true
    in_read_map: true
    xena_primary_site: {tcga: Liver, gtex: Liver}
  CESC:
    tcga_studies: [CESC]
    gtex_tissue: CERVIX_UTERI
    published: true
    in_read_map: true
    xena_primary_site: {tcga: "Cervix Uteri", gtex: "Cervix Uteri"}
  ESCA:
    tcga_studies: [ESCA]
    gtex_tissue: ESOPHAGUS
    published: true
    in_read_map: true
    xena_primary_site: {tcga: Esophagus, gtex: Esophagus}
  # --- published but NOT in the read maps and NOT rendered by pan_tissue (the 8 rarer ---
  # --- indications) ---
  ACC:
    published: true
  KICH:
    published: true
  KIRP:
    published: true
  PCPG:
    published: true
  TGCT:
    published: true
  THCA:
    published: true
  UCS:
    published: true
  UCEC:
    published: true

  # --- STAGED universe-expansion candidates (analysis-methods #734, Phase 1) -------------------
  # Toward the issue's "~30 TCGA studies". These are NOT published and NOT in the read maps:
  # published: false + in_read_map: false => EVERY projection (published_indications,
  # indication_to_{tcga_studies,gtex_tissue}, pan_tissue_render, composite_indications) is
  # BYTE-IDENTICAL to before -- staging them is VERDICT-INERT (the frozen-literal pins in
  # tests/test_indication_config_rosters.py still hold: 27 / 21 / 20 / 19). gtex_tissue and
  # tcga_studies are RECORDED for the Phase-2 verdict-diff run but consumed by NOTHING until a
  # `published`/`in_read_map` flip lands WITH (a) explicit authorization AND (b) domain sign-off
  # on the matched-normal contrast, plus a before/after verdict diff. `staged: true` and a
  # non-null `caveat` are REQUIRED (pinned by the tests). Do NOT flip these without sign-off.
  #
  # TCGA study triage (33 study codes - 26 already covered by published products = 7 uncovered):
  #   STAGED here : LAML, DLBC          -- a GTEx normal exists; the contrast has a recorded confound.
  #   UNCERTAIN   : CHOL                -- cholangiocarcinoma (bile duct); GTEx has LIVER but no
  #                                        bile-duct normal, so no clean matched contrast. NOT added;
  #                                        needs a domain call before it can even be staged.
  #   EXCLUDED    : MESO, SARC, THYM, UVM -- no usable GTEx normal at all (mesothelium, heterogeneous
  #                                        soft tissue, thymus, and uvea are absent from GTEx).
  #                                        Staging one would FABRICATE a matched normal -- the exact
  #                                        failure the HNSC `gtex_tissue: null` guard exists to
  #                                        prevent -- so they are deliberately omitted, not staged.
  LAML:
    tcga_studies: [LAML]
    gtex_tissue: BLOOD  # GTEx Whole Blood -- recorded for Phase 2, NOT consumed (in_read_map: false)
    published: false
    in_read_map: false
    staged: true
    caveat: >-
      Maturation-state confound: TCGA LAML is immature peripheral-blood / bone-marrow blasts, but
      the only GTEx normal is mature, differentiated whole blood -- the contrast conflates
      malignancy with hematopoietic maturation. Needs domain sign-off before Phase-2 compute.
  DLBC:
    tcga_studies: [DLBC]
    gtex_tissue: SPLEEN  # candidate normal (SPLEEN or BLOOD) -- recorded for Phase 2, NOT consumed
    published: false
    in_read_map: false
    staged: true
    caveat: >-
      Mixed-lymphoid-organ confound: TCGA DLBC arises in lymph node / extranodal sites, but GTEx
      has no matched lymph-node normal -- the nearest normals (SPLEEN, whole BLOOD) are different
      lymphoid compartments. The matched-normal choice needs domain sign-off before Phase-2 compute.
