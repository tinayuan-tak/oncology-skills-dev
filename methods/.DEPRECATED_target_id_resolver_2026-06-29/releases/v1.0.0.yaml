# Resolver release v1.0.0 — production pin.
#
# All five reference sources mirrored to S3 and parsed locally. No live API
# calls during normal operation. Target objects are fully reproducible:
# same input + same resolver_release = byte-identical Target (modulo
# resolved_at timestamp).
#
# Promoted from resolver_v0.1.0-alpha (live MyGene) by adding pulls for
# UniProt + Ensembl + NCBI Gene and switching dispatch from live_mygene
# to snapshot. The Target schema does NOT change between alpha and v1.0.0;
# only the data plumbing (and the realism of populated fields — alpha
# emits ENSG*.0 sentinels, v1.0.0 emits real versions like .16/.21).

resolver_release: resolver_v1.0.0
status: production

# Cites data-catalog manifest IDs. Each entry MUST resolve to a manifest in
# rnd-computational-biology-oncology-data-catalog/manifests/sources/.
data_pins:
  hgnc: hgnc-2026-q2                                                    # April 2026 quarterly
  ensembl: ensembl-id-mapping-release-116-snapshot-2026-06-18           # Ensembl release 116 via BioMart REST
  uniprot: uniprot-sprot-human-2026-02-snapshot-2026-06-18              # UniProt release 2026_02 (10-Jun-2026)
  ncbi_gene: ncbi-gene-snapshot-2026-06-18                              # NCBI Gene daily-fresh snapshot
  mygene_metadata: mygene-info-metadata-20260602                        # tie-breaker only; not loaded into snapshot

behavior:
  dispatch: snapshot                          # in-memory SnapshotIndex; no HTTP at resolution time
  master_vocabulary: hgnc                     # HGNC primary symbol + ID is the canonical key
  protein_resolution: canonical_only          # UniProt isoform-aware lands in v2.x.y
  ambiguity: fail_closed                      # multi-HGNC alias hits raise AmbiguousInputError
  mygene_role: not_loaded                     # snapshot dispatch consults HGNC/Ensembl/UniProt/NCBI only
  forbid_in_production: false                 # this IS the production pin

created_date: '2026-06-18'
created_by: ryan.abo@takeda.com
notes: |
  Production pin. All five reference sources retained indefinitely:
    HGNC quarterly      retained on Google Storage
    UniProt release     retained on UniProt FTP previous_releases (back to 2005)
    Ensembl release     retained on Ensembl FTP (numbered releases never expire)
    NCBI Gene snapshot  date-stamped (NCBI doesn't version; capture date is the pin)
    MyGene metadata     date-stamped (build_version + per-source pins)

  Cold-start cost: ~60s (HGNC TSV + Ensembl TSV + UniProt XML iterparse).
  NCBI gene_info is loaded LAZILY on first miss against HGNC's entrez xref
  — adds ~4 minutes if triggered. Most queries never trigger NCBI load
  because HGNC carries Entrez ID directly.

  Determinism guarantee: for a fixed (input, resolver_release), every
  Target field except resolved_at is byte-identical across runs. Tested
  in libs/target_id_resolver/tests/test_resolve_snapshot.py.
